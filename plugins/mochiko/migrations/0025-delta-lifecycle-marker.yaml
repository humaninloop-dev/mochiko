id: 0025-delta-lifecycle-marker
sequence: 25
intent: >-
  Execute delta D2, with seams R8 and R9 and the lead's Q8 ruling: every baseline entry a run
  writes or amends carries a Lifecycle field of its own, keyed by the run's owner (FEAT-XXX,
  EPIC-XXX, lane-<slug>) — proposed before sign-off, flipped by kind at sign-off (R8), built or
  a removed stub at landing (R9). The entry grammar replaces impl.baseline-delta-grammar and
  carries the brief clause (Q8); the store's statuses, orphan rule and landing flip, its two
  templates, and the landing rules take the wider key set and the words proposed and removed. What
  leaves (Q6): the FEAT-XXX-only key and the five-status set (lifecycle-statuses,
  arch.tools-store-skill, store-landing, store-landing-incomplete, orphan-rule); a removing
  element flipping to built (fold-duty, now its removed stub). Re-cut after the census table's
  ratification (.mochiko/decisions/2026-09-29-census-table-ratified.md): rows F1-F4 give the
  grammar rule its per-store placement sentence (the Lifecycle line first under the entry heading,
  Raised and Weighed after it, a contracts clause heading and api.yaml's x-lifecycle key, the
  store in its own **Name**: form) and the two store templates their Raised and Weighed columns
  and fields; row E1 and the lead's ruling spell every baseline marker in the bold form the gate
  reads (**Lifecycle:**, **Raised:**, **Weighed:**). Nothing leaves.
