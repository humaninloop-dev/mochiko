changes:
  - op: supersede-rule
    schema: command/implement
    id: impl.baseline-delta-grammar
    disposition: >-
      superseded by impl.baseline-entry-grammar — a baseline change is an entry written in place
      under its lifecycle marker (D1/D2), not a feature-dir delta. Its landing-seat grade of
      build-time judgment moves to the successor and to impl.baseline-diff-review; its "three-way
      diff stays a transcription check" has nothing left to check, since no transcription remains
      (D3c).
    anchor: 2026-09-24 delta-files-vs-direct-baseline-edits D2
  - op: mint-rule
    schema: command/implement
    section: impl.sec.tools
    rule:
      id: impl.baseline-entry-grammar
      labels: [landing, evidence]
      class: must
      kind: binding
      text: >-
        Every product-baseline entry a run writes or amends carries a `**Lifecycle:**` field of
        its own, apart from any stance field (the store's lifecycle field is its `Status`; a
        constraints entry's `**Status:**` stays its stance). The key is the run's owner:
        `FEAT-XXX` for a feature run, `EPIC-XXX` for an epic's shared write, `lane-<slug>` for a
        product-lane run. Before the design checkpoint every run write reads `proposed (<key>)`: a
        new entry, an amended one with its new text in place, a removed one with its heading and
        marker kept and its body cut. The sign-off flips each by the pinned-base diff — absent
        at the base to `in-flight (<key>)`, changed from it to `modifying (<key>)`, cut to its
        heading to `removing (<key>)`. A build-time decision is written directly in that post-sign
        form — new `in-flight`, amended `modifying`, removed `removing` — its judgment graded
        by the landing verification seat. At landing `in-flight` and `modifying` flip to `built`,
        the key cleared; a `removing` entry becomes its stub (heading kept, `**Lifecycle:**
        removed`, no body, no key, its id still taken). An entry with no `**Lifecycle:**` field
        reads `built`. Readers: `proposed` is nothing promised and reads absent; the in-flight
        class (`in-flight` · `modifying` · `removing`) is planned contract; `removed` reads
        absent; `built` or no field is delivered. A new entry takes the next free id of the
        product file's own sequence at write time, a `removed` stub's id counting as taken — no
        feature-local sequence, no renumbering at landing. The why lives on the entry (a
        constraints entry's `Source` · `Shaped by` · `Impact`; a build-raised entry's
        `**Raised:**` and one-line `**Weighed:**`), never in a ledger; the commit message is not a
        carrier. Prior text is never kept beside the new — the pinned-base diff shows it. Where
        the marker sits: in data-model.md and quickstart.md the `**Lifecycle:**` line is the first
        line under the entry heading; in constraints-and-decisions.md it is the same first line,
        above the stance line (`**Class:** … · **Status:** …`), never sharing it; a
        build-raised entry's `**Raised:** <cycle>` and `**Weighed:** <why, one line>` follow it
        directly, one line each. A contracts/ .md entry is the heading of the clause that changes,
        at the level its sibling clauses use, `**Lifecycle:**` its first line; api.yaml takes an
        `x-lifecycle` key on the changed operation or schema, with the same values, a removed one
        keeping only its summary and `x-lifecycle: removed`. The architecture store takes no
        separate field and keeps its own `**Name**:` form: a spine element's lifecycle is its
        Status column, with Raised and Weighed columns filled on a build-raised element; a concern
        row's is its `- **Status**:` field, followed on a build-raised row by `- **Raised**:` and
        `- **Weighed**:`; a removed concern keeps its heading and `- **Status**: removed`, a
        removed spine row its id, kind, name and status, not drawn. Every brief to a seat that
        writes or amends a product baseline carries this rule as an obligated read.
      anchor: 2026-09-24 delta-files-vs-direct-baseline-edits D2
  - op: reword-rule
    schema: skill/authoring-architecture-store
    id: authoring-architecture-store.lifecycle-statuses
    text: >-
      Seven lifecycle statuses — `ruled` · `proposed` · `in-flight` · `modifying` ·
      `removing` · `built` · `removed`; each `proposed` and in-flight-class element MUST name
      the key of the run that owns the change — `FEAT-XXX`, `EPIC-XXX` or `lane-<slug>` — and
      `ruled`, `built` and `removed` carry none. Readers: `proposed` is nothing promised and reads
      absent; the in-flight class (`in-flight` · `modifying` · `removing`) is planned contract;
      `removed` reads absent. A removed concern row keeps its heading and `**Status**: removed`,
      no body; a removed spine element keeps its table row reduced to id, kind, name and status,
      and is not drawn; either id stays taken. Status is the build-lifecycle axis only — stance
      is a separate axis and never implies one.
  - op: reword-rule
    schema: skill/authoring-architecture-store
    id: authoring-architecture-store.orphan-rule
    text: >-
      Every `proposed` and in-flight-class element keys an open feature, epic or lane; an element
      whose key names a closed, retired, or nonexistent owner is an orphan — the health view
      flags it, the sufficiency check lists it for the user at run-open, the landing verifier
      flags one keyed to its own run, and desk visits clean it.
  - op: reword-rule
    schema: skill/authoring-architecture-store
    id: authoring-architecture-store.fold-duty
    text: >-
      The fold fires when the built work changed structure: the landing flip, read from the
      pinned-base diff — `in-flight` and `modifying` elements to `built`, their keys cleared,
      each `removing` element to its `removed` stub — then `As-built:` and `Drift:` on every
      touched row, and the index regenerated.
  - op: reword-rule
    schema: command/architecture
    id: arch.tools-store-skill
    text: >-
      mochiko:authoring-architecture-store is the store's owner: AX and spine grammar, the element
      lifecycle (`ruled` → `proposed (<key>)` → at sign-off `in-flight (<key>)` / `modifying
      (<key>)` / `removing (<key>)` → `built`, or `removed` for a removal; the key `FEAT-XXX`,
      `EPIC-XXX` or `lane-<slug>`), the stance vocabulary (`decided` · `not-now` · `n-a` ·
      `open`), row graduation, the fold at landings, the health view, and the index regeneration.
  - op: reword-rule
    schema: command/implement
    id: impl.store-landing
    text: >-
      A built structural change lands in the architecture store in three parts: the landing flip
      over the run's elements — `in-flight` and `modifying` to `built`, the key cleared, each
      `removing` element to its `removed` stub (transcription — rides this run's landing audit)
      · the touched rows' As-built: and Drift: fields are written as judgment and independently
      graded · the orphan check runs — a `proposed` or in-flight-class element keying no open
      feature, epic or lane is flagged, never left. The store skill regenerates the derived root
      ARCHITECTURE.md; it is never hand-edited here.
  - op: reword-rule
    schema: command/implement
    id: impl.fail.store-landing-incomplete
    text: >-
      A signed store delta landed without its built-vs-signed diff, or an in-flight-class element
      left neither flipped (to `built`, or to its `removed` stub) nor keyed to an open feature,
      epic or lane.
  - op: replace-document
    kind: template
    name: architecture-store
    content:
      template: architecture-store
      title: Product Architecture Store
      form: artifact-format.md
      register: full
      overview: |
        The product's standing architecture, in one home: `.mochiko/product/architecture/`. Two layers
        ride together — a topology SPINE (containers, boundaries, communication styles) and a CONCERN
        CATALOG (AX-XXX rows: auth, tenancy, billing, observability, ...). A concern row may pin to a
        spine element or apply product-wide. Every element carries a lifecycle status, so intent and
        built state live on one surface.

        Authored and amended per mochiko:authoring-architecture-store — the skill carries the write
        timing, the lifecycle rules, the landing duties, and the drift discipline; this shape carries
        only the structure. Stances are formed per mochiko:patterns-architecture-shelves.

        The sections below map to the PARTS OF A MULTI-FILE ARTIFACT — the store's own files — not to
        sections of a single document. That is a deliberate fit for a directory-shaped artifact, not
        altitude drift.

        Shape principle: a SMALL REQUIRED CORE plus broad flexibility. The required core is element ids,
        status values, stance values, and pointer fields — nothing else. Beyond it everything is legal:
        extra fields, extra sections, local diagrams, long-form prose. The schema constrains the
        skeleton, never the voice.

        The `--check` view grades the SKELETON ONLY — required core fields present, status and stance
        values legal, ids unique, `Work:`/NFR pointers resolving — and never the free-form body. It is
        an advisory view, never a gate.
      sections:
        - name: Store layout
          required: true
          contract: |
            The store is four files, three of them written by hand and one derived:

            | File | Holds |
            |------|-------|
            | `.mochiko/product/architecture/spine.md` | the topology deep view |
            | `.mochiko/product/architecture/concerns.md` | the AX-XXX concern ledger |
            | `.mochiko/product/architecture/concerns/AX-XXX-<slug>.md` | a graduated concern's deep view (only where one exists) |
            | `ARCHITECTURE.md` (repo root) | the DERIVED index — regenerated on every store write, never hand-maintained |

            The root index stays at the repo root, never inside the store directory. A store may exist
            with no graduated concern files at all; that is the normal starting state.
          check: >-
            Are `spine.md` and `concerns.md` present under `.mochiko/product/architecture/`, with
            the derived `ARCHITECTURE.md` at the repo root (not inside the store directory), and
            graduated concern files only where a row actually graduated?
        - name: Spine
          required: true
          contract: |
            `spine.md` — the topology deep view. Carries the container diagram, an element table, and
            sequence diagrams for qualifying flows (diagram craft and altitude: mochiko:patterns-system-design).

            The header carries a `Scope:` line naming the surface types the store covers — e.g.
            `Scope: backend-service`, or several for a full-stack product. Setup's scaffold writes it;
            the desk may override it. This is the durable home of shelf scope.

            REQUIRED CORE, per spine element: an id `SPN-XXX` (unique across the store), a `kind`
            (`container` | `boundary` | `flow`), a name, and a lifecycle `status`. Everything else —
            responsibility text, communication style, technology notes, local diagrams — is free-form.
            A build-raised element also fills two columns, `Raised` (its cycle) and `Weighed` (its why,
            one line); every other element reads `—` in both.

            Legal `status` values (the same set governs concern rows):
            `ruled` · `proposed (<key>)` · `in-flight (<key>)` · `modifying (<key>)` · `removing (<key>)` ·
            `built` · `removed`. The key names the run that owns the change — `FEAT-XXX`, `EPIC-XXX` or
            `lane-<slug>`. The four keyed values MUST carry it; `ruled`, `built` and `removed` MUST NOT.

            A run writes `proposed` before the design checkpoint's sign-off: a new element, an amended
            one with its new text in place, a removed one cut to its row's core. The sign-off flips each
            by the pinned-base diff — absent at the base to `in-flight`, changed from it to `modifying`,
            cut to its core to `removing`; a change made after sign-off takes that form from its first
            write. The landing flips `in-flight` and `modifying` to `built` and a `removing` element to
            `removed`: its row kept, reduced to id, kind, name and status, and never drawn. Readers:
            `proposed` is nothing promised and reads absent; `in-flight` · `modifying` · `removing` is
            planned contract; `removed` reads absent.

            Status tracks the BUILD lifecycle and is independent of stance. `ruled` is the resting
            status of any element not proposed, not in flight and not yet built — including a concern
            row whose stance is `open` or `n-a`. Do not read `ruled` as "a stance was decided".
          check: >-
            Does `spine.md` open with a `Scope:` line, and does every spine element carry a unique
            SPN-XXX id, a kind (container/boundary/flow), a name, and a legal status — with a
            run key (FEAT-XXX, EPIC-XXX or lane-<slug>) on every
            proposed/in-flight/modifying/removing element and none on ruled/built/removed?
        - name: Concern ledger (AX rows)
          required: true
          contract: |
            `concerns.md` — one entry per concern, compact by default. Rows start here and graduate to
            their own file only on real depth.

            REQUIRED CORE, per row: an id `AX-XXX` (unique across the store), a concern name, a
            `Stance`, and a lifecycle `Status` (same value set as spine elements). A row cut for removal —
            `proposed (<key>)` or `removing (<key>)` with its body cut, or `removed` after the landing — is
            the one exception: its heading (id and name) and its `- **Status**:` line, no other field; a `removed` row
            carries no key, and its id stays taken.

            Four stances: `decided` · `not-now` · `n-a` · `open` — `n-a` is never written bare (below).
            Two carry an obligation:
              - `not-now` — an `Upgrade trigger` line is expected (the deferral's revisit condition);
              - `n-a` — a reason axis is REQUIRED, either `genuinely never` or `handled elsewhere`.

            The reason axis is written as a SUFFIX ON THE STANCE. An `n-a` row's stance therefore reads
            in full as `n-a — genuinely never` or `n-a — handled elsewhere`, and both suffixed forms
            are legal stance values everywhere a stance is written — ledger row, graduated file, and
            the derived index table alike. A bare `n-a` carrying its reason somewhere else is not
            legal. `n-a — handled elsewhere` MUST also carry its pointer to the system that owns the
            concern; that pointer's home is the `Owned by` field.

            What a stance MEANS, and what may constrain the choice, is not this shape's business —
            see mochiko:patterns-architecture-shelves.

            Conventional free-form fields, present where they carry something: `Ruling` (+ ruled date),
            `Rationale`, `Upgrade trigger`, `Owned by` (the handled-elsewhere pointer's home — required
            on an `n-a — handled elsewhere` row, absent otherwise), `Targets` (NFR-XXX ids with their
            measurable target, measurement method, and source — the FR-XXX / SC-XXX whose promise the
            target serves — live HERE, one home per concern), `As-built`, `Drift`, `Raised` and `Weighed` (a build-raised row's cycle and one-line why, written
            `- **Raised**:` and `- **Weighed**:` directly after `Status`), `Work` (FEAT-XXX / EPIC-XXX pointers;
            the work itself lives on the feature map, never here).

            Every `Work:`, NFR-XXX, and `handled elsewhere` pointer MUST resolve. A dangling pointer is
            a defect, not a placeholder.
          check: >-
            Does every concern row carry a unique AX-XXX id, a name, a legal stance, and a legal
            status — with every `n-a` stance written in its suffixed form (`n-a — genuinely
            never` / `n-a — handled elsewhere`), an `Owned by` pointer on every
            handled-elsewhere row, and every Work/NFR pointer resolving?
        - name: Graduated concern file
          required: false
          contract: |
            `.mochiko/product/architecture/concerns/AX-XXX-<slug>.md` — present ONLY for a row that
            earned its own file: long rationale, local diagrams, a decision trail the ledger cannot
            hold in a few lines. Extend beats mint; a row that fits the ledger stays in the ledger.

            A graduated file carries the same required core as its ledger row (id, name, stance,
            status) and then whatever depth the concern actually has. The ledger keeps the row with a
            one-line summary and a link — the row never disappears from the ledger when it graduates.
          check: >-
            Does each graduated file carry the same id, name, stance, and status as its ledger
            row, with the ledger still holding that row as a one-line summary plus a link?
        - name: Derived root index
          required: true
          contract: |
            `ARCHITECTURE.md` at the repo root — a rendered VIEW of the store, regenerated on every
            store write by its single writer. Never hand-edited; index-vs-store disagreement is a
            defect fixed on sight, never reconciled by editing the index.

            Three parts:
              1. Spine thumbnail — the container view at a glance, plus a link to `spine.md`.
              2. AX summary table — one line per concern row (`AX-XXX` · concern · stance · status ·
                 one-line summary · link). This is the full row set, not a selection: it is the surface
                 the sufficiency check and the design phase read, so a missing row is an invisible row.
              3. Health — the health view, a SECTION OF THIS INDEX and not a separate artifact. Five
                 counts, each naming its rows: open rows · stale `not-now` triggers · fired triggers
                 awaiting routing · orphan elements (a `proposed` or
                 in-flight-class element whose key names no open feature, epic or lane) · drift register.

            The index carries no content of its own: everything in it is derived from the store.
          check: >-
            Is the root index a derived view carrying the spine thumbnail, the FULL AX summary
            table (one line per row, none omitted), and a Health section with the five counts —
            with nothing in it that is not derived from the store?
      skeleton: |
        <!-- file: .mochiko/product/architecture/spine.md -->

        # Architecture Spine

        **Scope**: backend-service

        ## Container diagram

        ```mermaid
        flowchart TD
            [containers and their communication; proposed and in-flight-class elements marked; removed elements not drawn]
        ```

        ## Elements

        | ID | Kind | Name | Responsibility | Talks to (style) | Status | Raised | Weighed |
        |----|------|------|----------------|------------------|--------|--------|---------|
        | SPN-001 | container | [name] | [one line] | SPN-002 (sync REST) | built | — | — |
        | SPN-002 | container | [name] | [one line] | SPN-003 (queue) | in-flight (FEAT-012) | [cycle] | [why, one line] |
        | SPN-003 | boundary | [name] | [what changes across it — trust, ownership, tenancy] | — | ruled | — | — |
        | SPN-004 | flow | [name] | — | — | removed | — | — |

        ## Key flows

        [Sequence diagrams for qualifying flows — selection and altitude per mochiko:patterns-system-design.]

        <!-- file: .mochiko/product/architecture/concerns.md -->

        # Concern Ledger

        ## AX-001 Tenancy

        - **Stance**: decided
        - **Status**: built
        - **Ruling**: pooled multi-tenant, `tenant_id` row-level scoping (ruled [DATE])
        - **Rationale**: [why this, and what it costs]
        - **Upgrade trigger**: first enterprise deal requiring silo OR >[N] tenants
        - **Targets**: NFR-014 (from SC-007) — tenant-scoped read p95 < 200ms, measured at the API gateway histogram
        - **As-built**: pooled; `tenant_id` on 14 tables
        - **Drift**: none
        - **Work**: FEAT-012, EPIC-004

        ## AX-002 SSO

        - **Stance**: not-now
        - **Status**: ruled
        - **Rationale**: [real concern, consciously deferred — why now is not the time]
        - **Upgrade trigger**: first prospect whose security review demands SAML

        ## AX-003 Payments ledger

        - **Stance**: n-a — handled elsewhere
        - **Status**: ruled
        - **Owned by**: [system/repo that owns this concern]   <!-- pointer REQUIRED on handled-elsewhere -->

        ## AX-004 Experimentation

        - **Stance**: open
        - **Status**: ruled
        - **Note**: [walked, no stance formed yet — counted by the health view]

        <!-- file: .mochiko/product/architecture/concerns/AX-001-tenancy.md  (only where a row graduated) -->

        # AX-001 Tenancy

        **Stance**: decided · **Status**: built

        [The depth the ledger row could not hold: the rationale in full, local diagrams, the trail of
        rulings that got here. The ledger keeps the row, summarised, with a link to this file.]

        <!-- file: ARCHITECTURE.md  (repo root — DERIVED; regenerated on every store write) -->

        # Architecture

        *Derived from `.mochiko/product/architecture/` — regenerated on every store write. Do not hand-edit.*

        ## Spine

        ```mermaid
        flowchart TD
            [thumbnail — the container view at a glance]
        ```

        Boundaries, flows, and per-element status: `.mochiko/product/architecture/spine.md`.

        ## Concerns

        | AX | Concern | Stance | Status | Summary | Detail |
        |----|---------|--------|--------|---------|--------|
        | AX-001 | Tenancy | decided | built | pooled, `tenant_id` scoping | [concerns/AX-001-tenancy.md](.mochiko/product/architecture/concerns/AX-001-tenancy.md) |
        | AX-002 | SSO | not-now | ruled | deferred to first SAML demand | `concerns.md` |
        | AX-003 | Payments ledger | n-a — handled elsewhere | ruled | owned by [system] | `concerns.md` |
        | AX-004 | Experimentation | open | ruled | walked, no stance yet | `concerns.md` |

        ## Health

        - **Open rows** — 1: AX-004
        - **Stale `not-now` triggers** — 1: AX-002 (trigger unreviewed since [DATE])
        - **Fired triggers awaiting routing** — 0
        - **Orphan elements** — 0
        - **Drift register** — 0
  - op: replace-document
    kind: template
    name: architecture-spine
    content:
      template: architecture-spine
      title: Architecture Spine
      form: artifact-format.md
      register: full
      overview: >-
        `spine.md` — the product's topology deep view, one of the two hand-written files in the
        architecture store at `.mochiko/product/architecture/`. It carries the container diagram,
        the element table (containers, boundaries and flows, each with a lifecycle status), the
        sequence diagrams for qualifying flows, and the as-built notes a landing fold writes. The
        concern catalog is its sibling file, `concerns.md`, and the repo-root `ARCHITECTURE.md` is
        a derived view of both — regenerated on every store write, never hand-edited. Authored
        per mochiko:authoring-architecture-store; diagram craft and altitude per
        mochiko:patterns-system-design.
      conformance:
        extra_headings: deny
      sections:
        - name: Header
          required: true
          contract: >-
            Title "# Architecture Spine" plus the scope line naming the product shape the spine
            describes. Governs no heading of its own.
          check: Is the title present with a scope line?
        - name: Container diagram
          heading: Container diagram
          required: true
          max_lines: 30
          contract: >-
            One C4-container view as a mermaid block: the containers and how they communicate,
            with `proposed` and in-flight-class elements marked and `removed` elements not drawn.
            One diagram, not a gallery — a second view earns its place only where the first
            cannot carry it.
          check: >-
            Is there exactly one container view, with proposed and in-flight-class elements marked
            and no removed element drawn?
        - name: Elements
          heading: Elements
          required: true
          max_lines: 40
          contract: >-
            The element table, one row per element: `SPN-XXX` id · kind (container | boundary |
            flow) · name · one-line responsibility · what it talks to and in which style ·
            lifecycle status (the value set and its run keys per
            mochiko:authoring-architecture-store). Two further columns, `Raised` (its cycle) and
            `Weighed` (its why, one line), are filled on a build-raised element and read `—`
            elsewhere. A `removed` element keeps its row, reduced to id, kind, name and status.
            One line per element; a row that needs a paragraph is hiding a concern row or a
            graduated file.
          check: >-
            Is every element one row with an id, a kind, a responsibility and a status — Raised
            and Weighed filled only on a build-raised element, a removed element reduced to id,
            kind, name and status?
        - name: Key flows
          heading: Key flows
          required: true
          max_lines: 30
          contract: >-
            Sequence diagrams for the flows that qualify — selection and altitude per
            mochiko:patterns-system-design. A flow that reads off the container diagram does not
            qualify.
          check: Does each diagram earn its place, or does the container view already say it?
        - name: As-built notes
          heading: As-built notes
          required: false
          max_lines: 15
          contract: >-
            What the landing fold recorded about the built state where it differs from the
            approved shape — one line per element, id-keyed. Drift itself lives on the element's
            row; this section is the fold's own note.
          check: Is each note one line, keyed to an element id?
      skeleton: |
        # Architecture Spine

        **Scope**: backend-service

        ## Container diagram

        ```mermaid
        flowchart TD
            [containers and their communication; proposed and in-flight-class elements marked; removed elements not drawn]
        ```

        ## Elements

        | ID | Kind | Name | Responsibility | Talks to (style) | Status | Raised | Weighed |
        |----|------|------|----------------|------------------|--------|--------|---------|
