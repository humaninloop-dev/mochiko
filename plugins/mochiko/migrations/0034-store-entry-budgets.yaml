grammar: 2
id: 0034-store-entry-budgets
sequence: 34
intent: >-
  Bound the cumulative stores per entry at the 177 floor with no whole-file bound, per the
  ratified census table (rows S1–S5, E1, Q1): product data-model and constraints-and-decisions
  at ### with their section text, quickstart and the architecture spine and concern ledger at ##,
  only the baselines' Lifecycle line uncounted, and a graduated concern file at a whole-file 177.
  The constraints file's ### entries assume its #### ids raised at the wave-4 cleanup, the census
  ratification's amendment in part of delta D5(iv)
  (.mochiko/decisions/2026-09-29-census-table-ratified.md).
anchor: 2026-09-23 hook-enforcement-field-review D2
hash: sha256:5dd8cb610d198563c26693cec9036d748df71309e40478623706933a5127e0af
changes:
  - op: replace-document
    kind: home
    name: product
    content:
      home: product
      title: The product baselines
      path: [.mochiko, product]
      bounds: template
      deliverables:
        - file: data-model.md
          form: entries
          entry_heading: '###'
          entry_max_lines: 177
          section_max_lines: 177
          entry_exempt_fields: [Lifecycle]
        - file: constraints-and-decisions.md
          form: entries
          entry_heading: '###'
          entry_max_lines: 177
          section_max_lines: 177
          entry_exempt_fields: [Lifecycle]
        - file: quickstart.md
          form: entries
          entry_heading: '##'
          entry_max_lines: 177
          entry_exempt_fields: [Lifecycle]
      subdirs: [architecture, contracts, design]
  - op: replace-document
    kind: home
    name: product-architecture
    content:
      home: product-architecture
      title: The product architecture store
      path: [.mochiko, product, architecture]
      bounds: template
      deliverables:
        - file: spine.md
          template: architecture-spine
          form: entries
          entry_heading: '##'
          entry_max_lines: 177
        - file: concerns.md
          template: architecture-concerns
          form: entries
          entry_heading: '##'
          entry_max_lines: 177
      subdirs: [concerns]
  - op: replace-document
    kind: home
    name: product-concerns
    content:
      home: product-concerns
      title: Graduated concern files
      path: [.mochiko, product, architecture, concerns]
      bounds: whole-file
      deliverables:
        - file: <AX-ID>.md
          max_lines: 177
