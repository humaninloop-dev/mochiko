id: 0042-marker-read-cited
sequence: 42
intent: >-
  Fix round for 0029, driven by gate auditor V1's blocking finding on review-sufficiency's budget
  (the D7 reader sentence rendered three times in one payload, about 360 of 0029's +1,031 render
  characters restatement). clause-in-flight and clause10-carve now cite
  review-sufficiency.lifecycle-marker-read, which binds every baseline and store entry read and
  carries no when:, instead of restating its reader sentence. What leaves: the two restatements
  ("proposed is nothing promised and reads absent; the in-flight class (in-flight · modifying ·
  removing) is planned contract; removed reads absent") — the obligation stays, carried once by
  lifecycle-marker-read. Delta D6d's "never proposed" for clause-in-flight stays in that rule's
  own text. Ids, classes, kinds, when: and the rules' anchors are kept; no other op.
anchor: 2026-09-24 delta-files-vs-direct-baseline-edits D7
hash: sha256:dc73c5da40a0e1145bc5bc6c709f47994261c95a16f80f59aa92f5caba9f6d6c
changes:
  - op: reword-rule
    schema: skill/review-sufficiency
    id: review-sufficiency.clause-in-flight
    text: >-
      In-flight exposure — keyed on the row's status. A touched surface owned by an in-flight
      row obliges reading that feature's signed architecture.md drawing, its owning spec, and its
      entries in the product baselines and the store by marker
      (review-sufficiency.lifecycle-marker-read), never a `proposed` one. Need covered → cite
      the planned contract, no gap · adjacent → gap, the design phase writes its `proposed`
      entries sequenced behind that delivery · conflicting → reserved to the user at run-open.
      No locks — conflict routing is a question to the user, never a hold on the touched
      feature; only silent contradiction is prohibited.
  - op: reword-rule
    schema: skill/review-sufficiency
    id: review-sufficiency.clause10-carve
    text: >-
      An in-flight collision under the in-flight exposure clause licenses reading the colliding
      feature's signed architecture.md drawing and owning spec — the sole run-output read the
      fence admits, scoped to the colliding surface, never extended to that feature's code, cards,
      or cycle reports. Its baseline and store entries are read in place, by marker
      (review-sufficiency.lifecycle-marker-read).
