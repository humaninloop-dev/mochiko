grammar: 1
id: 0023-setup-agnostic-setup-rule-set
sequence: 23
intent: >-
  Setup's rule set after the cut: five product-content ids retired, seven amended to empty
  scaffolds on every path, and the consumers of the struck reconstruction and bootstrap
  re-pointed.
anchor: 2026-09-24 setup-product-agnostic D5
hash: sha256:5187c5165d9ae1b55e82de9fbd47fc141de97e475c2bd637f5d1159f75f5734a
changes:
  - op: reword-rule
    schema: command/setup
    id: setup.user-card-rulings
    text: Every interrogation card ruling, module ruling, and waiver is the user's.
  - op: reword-rule
    schema: command/setup
    id: setup.feature-map-greenfield
    text: >-
      Scaffold the empty FEATURES.md index on every path, write-if-absent — the features-index
      template's header with no capability rows (shape: mochiko-cli template features-index); an
      existing index is never touched. On brownfield the empty index carries one line under the
      header stating that reconstruction of the delivered capabilities is pending and is not
      setup's — its owner is the open rehoming question (setup-product-agnostic OQ1).
  - op: set-rule-field
    schema: command/setup
    id: setup.feature-map-greenfield
    field: when
    value: null
  - op: reword-rule
    schema: command/setup
    id: setup.design-scaffold-unconditional
    text: >-
      The design home's scaffold is unconditional — on every path,
      ${product_dir}/design/design.md is created where missing, written by you as an empty
      scaffold: the design-baseline template's required truth headings (shape from `mochiko-cli
      home ${product_dir}/design/design.md` and `mochiko-cli template design-baseline`) with no
      product content under them — no `product-designer` seat and no grader in this run. It
      creates only what is missing and never writes over a baseline that carries content; the
      optional system sections stay absent until a landing fold writes them from shipped code.
  - op: reword-rule
    schema: command/setup
    id: setup.fail.no-feature-map
    text: No feature-map index at close — absent and not scaffolded.
  - op: set-rule-field
    schema: command/setup
    id: setup.fail.no-feature-map
    field: enforces
    value: [setup.feature-map-greenfield]
  - op: reword-rule
    schema: command/setup
    id: setup.map-never-overwrite
    text: >-
      The never-overwrite floor covers every feature-map write the run makes — the empty-index
      scaffold (setup.feature-map-greenfield), write-if-absent on every path, is its one instance,
      not its extent: an existing index or entry file is never written over.
  - op: reword-rule
    schema: command/setup
    id: setup.blind-map-dispatch
    text: >-
      The pre-ratification stress-test seat is spawned in two messages — first the setup topic /
      project name and goal only, never the synthesis path (${memory_dir}/governance-intent.md),
      so it builds its Phase 0 angle map blind to what the interrogation concluded; its map
      returns before you send the synthesis path and the cold read begins. In a pair, both seats
      build their maps independently.
  - op: set-moment
    schema: command/setup
    name: close
    text: Where the feature-map index and the scaffolds must exist.
  - op: reword-rule
    schema: command/specify
    id: spec.missing-map-surfaced
    text: >-
      A missing feature map is surfaced — offer /mochiko:setup, which scaffolds the empty index;
      reconstruction of delivered capabilities is not setup's — never silently tolerated.
  - op: reword-rule
    schema: command/architecture
    id: arch.tools-brownfield-reconstruction
    text: >-
      The first visit to an existing repo derives the store from what exists — repo
      `ARCHITECTURE.md` prose, any per-feature `architecture.md` files, `nfrs.md`, structural
      `D-XXX` rows — presents it for confirmation, then archives the absorbed sources to
      .mochiko/archive/product-baselines/<date>/. The derivation is `Assumed` — code and prose
      read as they stand, and a partial source can poison the baseline it seeds: say so when you
      present it.
  - op: reword-rule
    schema: skill/analysis-codebase
    id: analysis-codebase.design-facts-seed
    text: >-
      Design-system facts (`detect-stack.sh`'s `design_system` key, code-verified) are facts,
      never stances, recorded in the analysis only: no setup run writes them into the design
      baseline — its system part is written from shipped code at a landing fold — and they
      later seed the frontend shelf.
  - op: supersede-rule
    schema: command/setup
    id: setup.product-truth-leg
    disposition: >-
      superseded — setup elicits no product truth; the design home is the lead's empty scaffold
      (setup.design-scaffold-unconditional); where the truth content lives is OQ1's
      (setup-product-agnostic D5)
    anchor: 2026-09-24 setup-product-agnostic D5
  - op: supersede-rule
    schema: command/setup
    id: setup.design-truth-write
    disposition: >-
      superseded — no product-designer seat and no grader in setup; the lead writes the empty
      design scaffold (setup.design-scaffold-unconditional) (setup-product-agnostic D5)
    anchor: 2026-09-24 setup-product-agnostic D5
  - op: supersede-rule
    schema: command/setup
    id: setup.baselines-bootstrap
    disposition: >-
      superseded — setup bootstraps no product baselines on any path; their bootstrap is OQ1's
      (setup-product-agnostic D5)
    anchor: 2026-09-24 setup-product-agnostic D5
  - op: tombstone-rule
    schema: command/setup
    id: setup.user-map-confirmation
    disposition: >-
      retired — setup reconstructs no map, so there is nothing to confirm; it scaffolds the
      empty index only (setup.feature-map-greenfield) (setup-product-agnostic D5)
  - op: tombstone-rule
    schema: command/setup
    id: setup.feature-map-brownfield
    disposition: >-
      retired — setup reconstructs no feature map; the empty-index scaffold is
      setup.feature-map-greenfield on every path; reconstruction is OQ1's (setup-product-agnostic
      D5)
  - op: tombstone-rule
    schema: skill/analysis-codebase
    id: analysis-codebase.capability-signals-seed-feature-map
    disposition: >-
      retired — setup reconstructs no feature map, so no setup feed exists; the reconstruction
      and its inputs are OQ1's (setup-product-agnostic D5)
  - op: reword-rule
    schema: command/implement
    id: impl.design-landing
    text: >-
      A UX-bearing landing folds the built UI into the design baseline: ${designer_seat} derives
      the system part from shipped code, never from intent, reconciles it against the direction
      contract's declared tokens, writes the shipped values, and marks each divergence, each
      critique-advisory finding, and each accepted design-audit Drift: candidate as Drift:. The
      write is judgment, graded by the landing verification seat. The setup lead writes only its
      empty scaffold; ${designer_seat} is the only writer of its content, on two paths: a
      build-time baseline-delta.md entry, and this fold.
