id: 0078-implement-architecture-touches
sequence: 78
intent: >-
  Implement's share of architecture-brainstorm-interview D5, D8 and D9 as review-amended (the S8
  list and the tenth touch stamped at V7; the ninth, the checkpoint's wording, is 0076's): reword
  impl.design-inputs for the desk visit file (D5, with its S20 read against the run's base) and
  the run's design-stage.md; mint impl.desk-offer, the offer default; reword
  impl.design-outputs-home so the change is drawn into the store's diagram files before code and
  the run's architecture.md is the neighborhood view plus the checkpoint table listing them (D8 as
  repaired at S6/V1 and V9, superseding architecture-design-primitive D5-plan-run-artifact in
  part); reword impl.baseline-entry-grammar, whose store clause a diagram file's own Lifecycle
  line (D8 S3) makes false; reword the floor impl.deviation-gate to read the store diagrams, held
  to the container and flow views (D8 S6, S7), its force kept — the deployment view, signed in
  the run's drawing before, leaves the cycle-stop set as one of S7's "other views" and is checked
  at the landing's built-vs-signed diff, a narrowing by that ruling, not a silent one; reword
  impl.store-landing for the built-vs-signed diff, the landing flip of the diagrams and the orphan
  check over them (D8, and 0070's orphan-rule); reword impl.gap-finding-blind-dispatch's first
  message (D8); mint impl.index-regeneration (D8 S4, V7); and reword impl.design-seats-staffing
  and impl.design-review-pair, incomplete against D8 and against implement-brainstorm-led D8's
  meaning-kept grade. No floor or fail retired or lowered.
anchor: 2026-10-11 architecture-brainstorm-interview
hash: sha256:d78415d85d12509c44a7e5cdba48a95e16af62d11b12d1df52a4ff3c4de229fd
changes:
  - op: reword-rule
    schema: command/implement
    id: impl.design-inputs
    text: >-
      Design inputs are sufficiency-report.md and any desk visit file keyed to the run's feature
      or an epic member — its directory under `.mochiko/architecture/desk/` carrying the joined
      FEAT id lower-cased in its slug, read against the run's own pinned base, any conflict where
      the store has moved past it listed at the design checkpoint for the user to rule — and,
      where the design phase ran, the run's design-stage.md, its signed architecture.md at
      ${features_dir}/FEAT-XXX/ with the store diagram files it lists, and its marked entries in
      the product baselines, read in the pinned-base diff — the signed store delta among them
      (the store at the sign-off base, or the checkpoint table), the anchor for the deviation
      check and the built-vs-signed diff; the product baselines at ${product_dir}/ (data-model.md,
      contracts/, constraints-and-decisions.md, the design baseline at ${product_dir}/design/, and
      the architecture store, whose concern rows carry the NFR-XXX targets the built code must
      meet); spec.md for the cards' cited acceptance criteria.
  - op: set-rule-field
    schema: command/implement
    id: impl.design-inputs
    field: anchor
    value: 2026-10-11 architecture-brainstorm-interview D5
  - op: mint-rule
    schema: command/implement
