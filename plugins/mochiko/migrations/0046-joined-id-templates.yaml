grammar: 1
id: 0046-joined-id-templates
sequence: 46
intent: >-
  Write the joined ID form into the ten artifact templates that define, show or cite durable IDs
  (human-readable-ids D1, D2, D9, D11, D19, D21): definition lines, example IDs and single-ID
  citation slots go joined; cross-file per-artifact citations carry their owner (D11) — the
  spec's slug for US, FR and SC, the product file's owner for the C family (`product` for the
  product baseline), the run's key for a cycle; SC settles on three digits (D9); the tasks cycle
  heading leads with its joined cycle ID; the governance-intent trace line now matches on the GI
  number. GI markers, number-only paths and citations of decided IDs stay bare (D12, D21).
anchor: 2026-10-08 human-readable-ids D21
hash: sha256:056534d9b28738d007695dac31d81cb96453230b8e61642e866cb1988cacd8c8
changes:
  - op: replace-document
    kind: template
    name: spec
    content:
      template: spec
      title: Feature Specification
      form: artifact-format.md
      register: full
      overview: |
        The feature specification deliverable (spec.md). Dense by construction, human-legible.
        Follows the deliverable envelope (artifact-format.md). Omit empty sections. Section density
        norms: Overview <= 3 lines; stories per authoring-user-stories (scenarios one line each, 2-3
        per story); FR/SC/edge-case entries one line each; entities conceptual and compact.
      sections:
        - name: Intent
          required: true
          density: one line per ruling
          contract: |
            The confirmed one-screen synthesis from the intent stage — elicited rulings, one line
            each, confirmed by the user before authoring began. Governs the authoring depth, the
            feature derivation, and the stress-test rigor. Omit a line only if the probe was
            genuinely not applicable. Lines: Scope boundary; Delivery (whole vs subset now, first
            shippable value, sequencing constraints); Depth / rigor; UX-bearing (yes -> Screens &
            Flows + prototype obligated; no -> the waiver line); Constraints; Out of scope.
          check: >-
            Is the Intent present with its six ruling lines (scope boundary, delivery,
            depth/rigor, UX-bearing, constraints, out of scope), each confirmed with the user, or
            a per-line not-applicable note?
          heading: Intent
          max_lines: 10
        - name: Overview
          required: true
          density: <= 3 lines
          contract: |
            A compact synthesis of what the feature is. No more than three lines.
          check: Is the Overview present and <= 3 lines?
          heading: Overview
          max_lines: 6
        - name: User Stories
          required: true
          contract: |
            An INDEX only. Story content lives in per-story files: stories/US-*.md — each carries the
            story text, its acceptance scenarios, and its FEAT-ID mapping. The only story-native
            status is `rejected` (the derivation filter's verdict, with the why, recorded in the story
            file); every other status is derived by following the story's FEAT-ID to the feature map.
            One row per story. Columns: ID (linked to stories/US-N.md), Story (one breath), Priority
            (P1/P2/P3), Feature (FEAT-XXX-<slug> or —), Disposition (homed | rejected — why).
          check: >-
            Is the User Stories section an index (one linked row per story, no inline story
            bodies), with each row carrying priority, FEAT-ID (or —), and disposition, and every
            rejected row a one-line why?
          heading: User Stories
        - name: Edge Cases
          required: true
          density: one line each
          contract: |
            The boundary and failure conditions the feature must handle — one line each.
          check: Are edge cases enumerated, one line each?
          heading: Edge Cases
        - name: Functional Requirements
          required: true
          density: one line each
          contract: |
            Technology-agnostic functional requirements (FR-XXX-<slug>), one line each, per
            authoring-requirements. RFC 2119 language.
          check: >-
            Are functional requirements present in joined `FR-XXX-<slug>` form, one line each,
            technology-agnostic?
          heading: Functional Requirements
        - name: Key Entities
          required: true
          contract: |
            The feature's domain nouns — conceptual and compact, not an OpenAPI schema.
          check: Are key entities listed conceptually and compactly?
          heading: Key Entities
          max_lines: 15
        - name: Success Criteria
          required: true
          density: one line each
          contract: |
            Measurable success criteria (SC-XXX-<slug>), one line each, per authoring-requirements.
          check: Are success criteria present in joined `SC-XXX-<slug>` form and measurable?
          heading: Success Criteria
        - name: Screens & Flows
          required: true
          contract: |
            Authored per mochiko:authoring-prototype from the Intent section's UX-bearing ruling. Not
            UX-bearing -> the single line "No UX surface — prototype waived at intent." and nothing
            else. UX-bearing -> one Direction block per surface (per mochiko:patterns-design-direction), both
            tables, and the prototype pointer, in full. The manifest is binding
            (screens, data, actions); the prototype's pixels are advisory. Feature column lands at
            derivation as a re-tag pass (FEAT-XXX-<slug> per row); screens of unselected features greyed
            coming-soon; a filter-rejected story's screens kept, greyed, marked rejected.
          good: |
            UX-bearing form:

            ### Direction — [surface] ([SCR range])
            - **Mode:** [Persuade | Operate | Read | Experience]
            - **Register:** [bolder | quieter | distill | held] — [why, one clause]
            - **Contract:** thesis — [...] · own world — [...] · story — [...] · first viewport — [...] · viewports — [...]
            - **Declared tokens (intent):** [type · color · spacing · motion, as intent] | none — honors the baseline
            - **Incumbent world:** [preserve | expand | replace] — [evidence, one clause]

            | ID | Screen | Purpose | Data shown | Feature |
            |----|--------|---------|------------|---------|
            | SCR-001-<slug> | [name] | [one line] | [fields/collections rendered] | FEAT-001-<slug> |

            | ID | Flow | Steps | Story scenario | Feature |
            |----|------|-------|----------------|---------|
            | FLOW-001-<slug> | [name] | SCR-001-<slug> -> [action] -> SCR-002-<slug> | US-1-<slug> / [scenario] | FEAT-001-<slug> |

            **Prototype:** `prototype/` — clickable low-fi rendering of this manifest; serve with bun
            or open `prototype/index.html` directly. Flows and data are binding; layout and styling
            advisory.
          check: >-
            If the spec is UX-bearing, is a Direction block with its five fields present for each
            surface, and are both the SCR-XXX and FLOW-XXX tables present with a Feature column
            and the prototype pointer? If not UX-bearing, is the single waiver line present and
            nothing else?
          heading: Screens & Flows
          max_lines: 44
        - name: Feature Selection
          required: true
          contract: |
            Authored per mochiko:authoring-feature-map after stories are drafted. Derivation output
            (proposed entries, deltas, index-line drafts) stages in this spec workspace; the live map
            is written only at spec acceptance, as one atomic batch. The selection itself is the
            user's ruling — the derived table and filter verdicts are the producer's, the Selected
            line records the user's choice. Three sub-parts: Derived features (table: FEAT-ID,
            Feature, New/delta, Stories, SCs verified); Filter rejections (one line per rejected story
            — the why verbatim from its story file; omit when none); Selection (Selected build-now in
            dependency order; Deferred proposed entries carrying their SCs + seam obligations;
            Deferred SCs — the ones covered only by unselected features, shown at the moment of
            choice, never discovered at close).
          check: >-
            Does Feature Selection carry the derived-features table, the filter rejections (or
            none), and a Selection recording the user's ruling with deferred features and deferred
            SCs surfaced?
          heading: Feature Selection
          max_lines: 20
        - name: Assumptions
          required: false
          contract: |
            Assumptions the specification rests on. Omit if empty.
          check: Are material assumptions recorded (or the section omitted when none)?
          heading: Assumptions
          max_lines: 10
        - name: Open Questions
          required: false
          contract: |
            Unresolved questions carried out of authoring. Omit if empty.
          check: Are open questions recorded (or the section omitted when none)?
          heading: Open Questions
          max_lines: 10
      skeleton: |
        # {{spec_title}}

        > Spec: {{spec_id}}
        > Created: {{created}}
        > Status: {{status}}

        ---

        ## Intent

        - **Scope boundary:** {{intent_scope}}
        - **Delivery:** {{intent_delivery}}
        - **Depth / rigor:** {{intent_depth}}
        - **UX-bearing:** {{intent_ux_bearing}}
        - **Constraints:** {{intent_constraints}}
        - **Out of scope:** {{intent_out_of_scope}}

        ---

        ## Overview

        {{overview}}

        ---

        ## User Stories

        | ID | Story (one breath) | Priority | Feature | Disposition |
        |----|--------------------|----------|---------|-------------|
        | [US-1-{{slug}}](stories/US-1.md) | {{story_hook}} | P1 | FEAT-XXX-{{slug}} | homed |
        | [US-2-{{slug}}](stories/US-2.md) | {{story_hook}} | P2 | — | rejected — {{why, one line}} |

        ---

        ## Edge Cases

        {{edge_cases}}

        ---

        ## Functional Requirements

        {{functional_requirements}}

        ---

        ## Key Entities

        {{key_entities}}

        ---

        ## Success Criteria

        {{success_criteria}}

        ---

        ## Screens & Flows

        {{screens_and_flows}}

        ---

        ## Feature Selection

        ### Derived features

        | FEAT-ID | Feature | New / delta | Stories | SCs verified |
        |---------|---------|-------------|---------|--------------|
        | FEAT-XXX-{{slug}} | [name] | new (`proposed`) | US-1-{{slug}}, US-3-{{slug}} | SC-001-{{slug}}, SC-002-{{slug}} |
        | FEAT-YYY-{{slug}} | [name] | delta on delivered | US-2-{{slug}} | SC-003-{{slug}} |

        ### Filter rejections

        - US-4-{{slug}} — rejected: {{why, one line}}

        ### Selection

        - **Selected (build now, dependency order):** FEAT-XXX-{{slug}}, FEAT-YYY-{{slug}}
        - **Deferred (`proposed` on the map):** FEAT-ZZZ-{{slug}} — carries SC-004-{{slug}}, SC-005-{{slug}} and [seam obligations]
        - **Deferred SCs:** SC-004-{{slug}}, SC-005-{{slug}} — wait until FEAT-ZZZ-{{slug}} builds

        ---

        ## Assumptions

        {{assumptions}}

        ---

        ## Open Questions

        {{open_questions}}
      conformance:
        extra_headings: deny
  - op: replace-document
    kind: template
    name: tasks
    content:
      template: tasks
      title: Implementation Cycles (cycle cards)
      form: artifact-format.md
      register: full
      overview: |
        This file is CYCLE CARDS, not a task list. Each card is a coherent bundle of named test cases
        (the card's content); the builder decomposes each card into concrete tasks at build time, with
        the code in view — the decomposition is disclosed in the cycle report, never pre-written here.
        Cite spec/design content by ID (US-#, FR-#, SC-#, C-#) — never re-quote it; each test case cites
        the ID(s) it covers, each written joined behind its owner per the IDs section of `templates/artifact-format.md` — a US,
        FR or SC behind its spec's slug (`` `<spec-slug>` FR-012-<slug> ``), a C- ID behind its product
        file's owner: `` `product` `` for the product baseline, the spec's slug for a spec's own file
        (`` `product` C-003-<slug> ``). Structure and slicing judgment come from
        mochiko:patterns-vertical-tdd (the cycle-card shape). The card's checkbox is the progress surface,
        flipped when the cycle's named cases show green against real infrastructure.
      sections:
        - name: Header
          required: true
          contract: |
            Title "# Implementation Cycles: [FEAT-XXX-<slug> — FEATURE NAME]" plus two generated-from
            pointers: (1) the spec folder and the design inputs the cards were authored from —
            spec.md, features/FEAT-XXX/sufficiency-report.md, and, where the design phase ran, the
            run's architecture.md drawing and its marked entries in the product baselines, read in the
            pinned-base diff of .mochiko/product/ (on a zero-gap verdict no design phase ran, so the cards are
            authored from spec.md, the report, and the product baselines); (2) Structure:
            mochiko:patterns-vertical-tdd (cycle-card shape, slicing judgment).
          check: >-
            Is the header present with the joined FEAT-XXX-<slug> title and both provenance
            pointers (source artifacts and the patterns-vertical-tdd structure note)?
        - name: Overview
          required: true
          contract: |
            Metric table (Metric | Value): Cycles = [N]; Stories covered = [US-# list — every P1/P2
            story on at least one card]. There is no foundation/feature split in the count.
          check: >-
            Does the Overview table report the cycle count and the covered US-# list, with every
            P1/P2 story on at least one card?
          heading: Overview
          max_lines: 8
        - name: Cycle Format
          required: true
          contract: |
            Each card is one vertical increment: a coherent bundle of named test cases (expected behaviour,
            in the `**TEST:**` grammar — see patterns-vertical-tdd/references/TEST-GRAMMAR.md for the
            canonical Setup/Action/Assert/Capture grammar) that demonstrate together. The builder
            implements the card test-first (red/green/refactor per mochiko:executing-tdd-cycle,
            decomposition at build time), and the cycle is done when its named cases show green against
            real infrastructure. The card's checkbox is the progress surface, flipped when the bundle's
            cases pass. Where the work opens a new end-to-end path (greenfield / new path), the first
            cycle is a walking skeleton; growth on an already-standing path skips it. There is no
            foundation/feature card type — `[P]` parallel eligibility derives from a card's
            dependencies, not from a type column. Each named test case cites the spec/design ID(s) it
            covers.
          check: >-
            Does the Cycle Format explain the card as a bundle of named test cases, the test-first
            flow, cycle-done when named cases pass on real infrastructure, the
            checkbox-as-progress rule, the walking-skeleton first cycle where a new end-to-end
            path opens, no foundation/feature type with `[P]` derived from dependencies, and
            per-case ID citation?
          heading: Cycle Format
          max_lines: 6
        - name: Cycle Cards
          required: true
          contract: |
            Cards are listed directly, not grouped by foundation/feature type. Each card carries:
            checkbox + the card's joined cycle ID and title (`### - [ ] C<n>-<slug> — <title>`); Stories
            (US-# — why these stories/cases form one demonstrable bundle,
            <= 2 lines); Depends on; Case (Simple | Split — why, one line | Merge — why, one line);
            Brownfield exposure (none | extends `path` | modifies `path` — cycle-level surfaces only);
            and the closing `**TEST:**` bundle — one or more named test cases, each opening with
            `**Covers**: <spec/design IDs>` (the acceptance-ID citation lives per-case, never a standalone
            Acceptance-criteria field) then Setup/Action/Assert/Capture fields per TEST-GRAMMAR.md.
            Where a new end-to-end path opens, the first card is a walking skeleton (thinnest path, one
            trivial case green). `[P]` marks parallel-eligible cards, derived from dependencies.
          good: |
            SAMPLE (illustration only — replace with actual cycles; DO NOT keep the samples in the generated tasks.md):

            ### - [ ] C1-walking-skeleton-path — Walking skeleton: [thinnest end-to-end path]
            - **Stories:** `<spec-slug>` US-1-<slug> — thinnest end-to-end path through all layers, one trivial case green; establishes the production-shaped stack [<= 2 lines]
            - **Depends on:** —
            - **Case:** Simple
            - **Brownfield exposure:** none

            **TEST:** [entity] round-trips through the full stack
            - **Covers**: `<spec-slug>` US-1-<slug> / SC-001-<slug>
            - **Action**: `curl -X POST localhost:3000/api/[entity] -d '{"name":"Test"}'`
            - **Assert**: Response status: 201
            - **Assert**: Console contains "[entity]_id"
            - **Capture**: console

            ### - [ ] C2-<slug> — [Feature bundle title] `[P]`
            - **Stories:** `<spec-slug>` US-2-<slug> — [why these stories/cases form one demonstrable bundle, <= 2 lines]
            - **Depends on:** C1-walking-skeleton-path
            - **Case:** [Simple | Split — why | Merge — why]
            - **Brownfield exposure:** extends `src/models/[entity].py`

            **TEST:** [behavior] works end to end via API
            - **Covers**: `<spec-slug>` US-2-<slug> / SC-002-<slug> scenario 1
            - **Setup**: Seed prerequisite [entity] data
            - **Action**: `curl -X POST localhost:3000/api/[endpoint] -d '{"[field]":"value"}'`
            - **Assert**: Response status: 200
            - **Assert**: Console contains "[expected field]"
            - **Capture**: console

            **TEST:** [behavior] rejects [invalid case]
            - **Covers**: `<spec-slug>` US-2-<slug> / SC-002-<slug> scenario 2
            - **Setup**: Seed prerequisite [entity] data
            - **Action**: `curl -X POST localhost:3000/api/[endpoint] -d '{"[field]":"invalid"}'`
            - **Assert**: Response status: 400
            - **Capture**: console
          check: >-
            Are cards listed directly (no foundation/feature grouping), each a bundle of named
            `**TEST:**` cases with per-case `**Covers**:` IDs (never a standalone
            acceptance-criteria field), carrying Stories/Depends-on/Case/Brownfield-exposure; is
            the first cycle a walking skeleton where a new end-to-end path opens; is `[P]` used
            only where dependencies allow; and is no illustrative sample or pre-written task list
            / file path left in?
          heading: Cycle Cards
      skeleton: |
        # Implementation Cycles: [FEAT-XXX-<slug> — FEATURE NAME]

        > Generated from the spec folder and the design inputs the cards were authored from: spec.md, features/FEAT-XXX/sufficiency-report.md, and, where the design phase ran, the run's architecture.md drawing and its marked entries in the product baselines, read in the pinned-base diff of .mochiko/product/
        > Structure: `mochiko:patterns-vertical-tdd` (cycle-card shape, slicing judgment)

        ## Overview

        | Metric | Value |
        |--------|-------|
        | Cycles | [N] |
        | Stories covered | [US-# list — every P1/P2 story on at least one card] |

        ## Cycle Format

        Each card is one vertical increment: a coherent bundle of **named test cases** (expected behaviour,
        in the `**TEST:**` grammar — see [`TEST-GRAMMAR.md`](../skills/patterns-vertical-tdd/references/TEST-GRAMMAR.md)
        for the canonical Setup/Action/Assert/Capture grammar) that demonstrate together. The builder
        implements the card test-first (red/green/refactor per `mochiko:executing-tdd-cycle`,
        decomposition at build time), and the cycle is done when its named cases show green against real
        infrastructure. **The card's checkbox is the progress surface**, flipped when the bundle's cases
        pass. Where the work opens a new end-to-end path (greenfield / new path), the **first cycle is a
        walking skeleton**; growth on an already-standing path skips it. There is no foundation/feature
        card type — `[P]` parallel eligibility derives from a card's dependencies, not from a type
        column. Each named test case cites the spec/design ID(s) it covers.

        ---

        ## Cycle Cards

        ### - [ ] C1-<slug> — Walking skeleton: [thinnest end-to-end path]

        - **Stories:** `<spec-slug>` US-#-<slug> — [thinnest end-to-end path through all layers; establishes the production-shaped stack, <= 2 lines]
        - **Depends on:** —
        - **Case:** Simple
        - **Brownfield exposure:** none

        **TEST:** [behavior] round-trips through the full stack
        - **Covers**: `<spec-slug>` US-#-<slug> / SC-#-<slug>
        - **Action**: `[command]`
        - **Assert**: [expected]
        - **Capture**: console

        ---

        ### - [ ] C<n>-<slug> — [Feature bundle title] `[P]`

        - **Stories:** `<spec-slug>` US-#-<slug> — [why these stories/cases form one demonstrable bundle, <= 2 lines]
        - **Depends on:** [cycle refs]
        - **Case:** [Simple | Split | Merge]
        - **Brownfield exposure:** [none | extends `path` | modifies `path`]

        **TEST:** [behavior] works end to end via real infrastructure
        - **Covers**: `<spec-slug>` US-#-<slug> / SC-#-<slug>
        - **Setup**: [preconditions]
        - **Action**: `[command]`
        - **Assert**: [expected]
        - **Capture**: console
      conformance:
        placeholders:
          - '[thinnest end-to-end path]'
          - '[Feature bundle title]'
        extra_headings: deny
  - op: replace-document
    kind: template
    name: feature-entry
    content:
      template: feature-entry
      title: Feature Map Entry (per-capability)
      form: artifact-format.md
      register: full
      overview: |
        One file per capability: .mochiko/features/FEAT-XXX-<slug>.md — the file's slug is the ID's
        slug, `FEAT-XXX-<slug>`. Authored and amended per
        mochiko:authoring-feature-map — the skill carries the derivation method, the work-row and
        fold rules, and the write timing; this shape carries only the structure. An entry is a
        durable capability plus a block of transient work rows (its delivery increments); there is
        NO parent/leaf nesting — capabilities are flat, grouped by domains only at the soft cap
        (mochiko:patterns-map-minimalism). Status is owned HERE (and mirrored one-line in
        FEATURES.md): story files derive theirs by following the FEAT-ID. Omit empty sections per
        artifact-format.md rule 6.
      sections:
        - name: Header & Status
          required: true
          contract: |
            Title "# FEAT-{{XXX}}-{{slug}} — {{capability_name}}" plus a Status line
            (proposed | in-flight | delivered | retired) and one status-dependent detail line:
              in-flight  -> since {{date}} · live work rows in run(s): `.mochiko/specs/{{spec-slug}}/`
                            (or the owning lane run, for feature-command growth-door work)
              delivered  -> since {{date}} · sticky — live rows may still be visible below
              retired    -> {{date}} · ruling: {{pointer}}  (or, on a merge: merged-into FEAT-{{YYY}}-{{slug}})
              proposed   -> surfaced by {{spec-slug}} ({{date}}) — or, for a capability stub,
                            minted by /mochiko:feature ({{date}}) · marked `unrefined`
            Reconstructed entries add: `reconstructed-from-code ({{date}}) — first touching spec
            re-verifies extent` — cleared at that spec's acceptance. `unrefined` stubs carry name +
            one-breath hook only — no Extent, no work rows; only specify's derivation fills them and
            makes the entry selectable.
          check: >-
            Is the joined FEAT-XXX-<slug> header + capability name present, with a Status
            (proposed/in-flight/delivered/retired) and the matching one-line status detail (and
            the unrefined/reconstructed markers where they apply)?
        - name: Capability
          required: true
          density: 1-3 lines
          contract: |
            1-3 lines, the system's own language — what the product does, standing on its own without
            reference to any story or spec. More than ~3 lines of extent below usually means this is
            two capabilities, or its bulk is undelivered work rows.
          check: >-
            Is the Capability statement 1-3 lines in the system's own language, standing without
            reference to a story or spec?
          heading: Capability
          max_lines: 6
        - name: Extent
          required: true
          density: one line each
          contract: |
            What is in, and what is notably NOT in — one line each. This is where stories sharpen the
            capability over time, and where a delivered work row folds in at its landing. (Absent on
            an `unrefined` stub.)
          check: >-
            Does Extent state what is in and what is notably not in, one line each (or is the
            entry an unrefined stub, which has no Extent)?
          heading: Extent
          max_lines: 6
        - name: Work rows
          required: false
          density: one line each, newest first
          contract: |
            Transient delivery increments under this capability — one line each, newest first. Each
            row carries a state and its run pointer; a `live` row folds into Extent above at its
            acceptance landing and leaves this list, a `pending` row persists as open obligation
            (deferred work never silently disappears). Grammar:
              - `pending` — {{increment}} · acceptance: {{criteria}} · cut by {{spec-slug or lane-run}}
              - `live`    — {{increment}} · acceptance: {{criteria}} · in {{spec-slug or lane-run}}
            Story-shaped increments are fine here; a story-shaped *capability* is not.
          check: >-
            Are work rows one line each (newest first), each carrying a state (`live`/`pending`),
            acceptance, and run pointer — with `live` rows folding into Extent at landing and
            `pending` rows persisting?
          heading: Work rows
          max_lines: 20
        - name: Relations
          required: false
          density: one line per relation
          contract: |
            One line per relation to another FEAT-ID: depends-on / extends / composes-with. A work row
            may depend on another capability's row — note it here; row-level dependencies order the
            two capability-batch runs.
          check: >-
            Is each relation one line to a FEAT-ID with a relation kind
            (depends-on/extends/composes-with) and a one-line why?
          heading: Relations
          max_lines: 20
        - name: Architecture
          required: false
          contract: |
            Which architecture-store elements realize this capability, named by id: SPN-XXX spine
            elements — any kind (container | boundary | flow) — and/or AX-XXX concern rows, at
            .mochiko/product/architecture/. Pointers only, navigable both directions; never restate
            the element. (Domain -> element mapping is dormant: it lands only at the soft cap, per
            mochiko:patterns-map-minimalism.)
          check: >-
            Does Architecture point at the realizing store elements by id — SPN-XXX spine
            elements of any kind (container/boundary/flow) and/or AX-XXX concern rows (pointers
            only, no restated element content)?
          heading: Architecture
          max_lines: 20
        - name: Story trace
          required: false
          density: IDs and pointers only, newest first
          contract: |
            Accumulating provenance: which specs/stories informed this capability — IDs and pointers
            only, newest first.
          check: Is the story trace IDs-and-pointers only, newest first (accumulating provenance)?
          heading: Story trace
          max_lines: 20
        - name: Obligations
          required: false
          density: one line each
          contract: |
            Deferred completeness pointers riding this entry until the work builds — one line each,
            distinct from work rows (which are cut delivery increments): deferred `<spec-slug>` SC-XXX-<slug> (travels here
            when its covering capability went unselected) · deferred seams ("when built, verify seam
            against FEAT-XXX-<slug>") · cross-cutting extend obligations from stories homed elsewhere.
          check: >-
            Are obligations one line each, distinct from work rows — deferred SCs, each behind
            its spec's slug, deferred seams, and cross-cutting extend obligations?
          heading: Obligations
          max_lines: 20
      skeleton: |
