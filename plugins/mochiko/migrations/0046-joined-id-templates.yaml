            |----|------------|--------|------|
            | [FEAT-001-{{slug}}](.mochiko/features/FEAT-001-{{slug}}.md) | {{capability_name}} | {{status}} | {{one_breath_hook}} |
            |  | ↳ `live` {{work_row}} | in {{spec-slug}} | {{increment_hook}} |
            | [FEAT-002-{{slug}}](.mochiko/features/FEAT-002-{{slug}}.md) | {{stub_name}} | proposed (unrefined) | {{one_breath_hook}} |
          check: >-
            Is the index one linked line per capability (ID · name · status · one-breath hook),
            ordered newest-relevant first, with work rows as `↳` sublines, `unrefined` stubs
            marked `proposed (unrefined)`, and no parent/leaf nesting or premature domain headers
            below the ~9 cap?
      skeleton: |
        # Features

        > The system as capabilities — the capability peer of the architecture store
        > (`.mochiko/product/architecture/`).
        > Entries: `.mochiko/features/FEAT-XXX-<slug>.md` (linked per line).
        > Statuses: `proposed` · `in-flight` · `delivered` · `retired`.

        | ID | Capability | Status | Hook |
        |----|------------|--------|------|
        | [FEAT-001-{{slug}}](.mochiko/features/FEAT-001-{{slug}}.md) | {{capability_name}} | {{status}} | {{one_breath_hook}} |
        |  | ↳ `live` {{work_row}} | in {{spec-slug}} | {{increment_hook}} |
        | [FEAT-002-{{slug}}](.mochiko/features/FEAT-002-{{slug}}.md) | {{stub_name}} | proposed (unrefined) | {{one_breath_hook}} |
