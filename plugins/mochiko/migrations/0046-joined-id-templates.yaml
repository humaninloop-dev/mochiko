    content:
      template: architecture-spine
      title: Architecture Spine
      form: artifact-format.md
      register: full
      overview: >-
        `spine.md` — the product's topology deep view, one of the two hand-written files in the
        architecture store at `.mochiko/product/architecture/`. It carries the container diagram,
        the element table (containers, boundaries and flows, each with a lifecycle status), the
        sequence diagrams for qualifying flows, and the as-built notes a landing fold writes. The
        concern catalog is its sibling file, `concerns.md`, and the repo-root `ARCHITECTURE.md` is
