      register: full
      overview: >-
        `concerns.md` — the architecture store's concern catalog, one `##` entry per `AX-XXX`
        row. The row set is the product's, so this kind declares no heading grammar and takes no
        size bound: a ledger's length is the concern count, which the product owns, and a cap
        there would be a verbosity lever over the wrong thing. What is bound is the row's own
        shape — the fields below, compact by default, with depth graduating to
        `concerns/AX-XXX-<slug>.md` only where a row earned its own file. Its sibling file is
        `spine.md`; the repo-root `ARCHITECTURE.md` is a derived view of both. Authored per
        mochiko:authoring-architecture-store.
      sections:
        - name: Header
          required: true
          contract: Title "# Concern Ledger" and nothing else above the first row.
          check: Is the title present?
        - name: Concern rows
          required: true
          contract: >-
            One `## AX-XXX-<slug> <concern>` entry per row, in id order. Each carries **Stance**
            (decided | not-now | n-a | open) · **Status** (the lifecycle state) · **Ruling**
            with its date where the stance is decided · **Rationale** · **Upgrade trigger**
            where the stance is not-now · **Owned by** where the stance is n-a — handled
            elsewhere · **Targets** (NFR-XXX-<slug>, with the measurement point) · **As-built**
            · **Drift** · **Work** (FEAT/EPIC ids). One line per field; a field with nothing to
            say is omitted, never written as "none" prose — except **Drift**, where `none` is
            the finding.
          check: Does every row carry a stance, a status and a rationale, one line per field?
        - name: Graduated rows
          required: false
          contract: >-
            A row that earned its own file keeps its summary here and links to
            `concerns/AX-XXX-<slug>.md`. The graduated file holds the depth the row could not —
            never a copy of the row.
          check: Does each graduated row keep a summary and a link, with no duplicated depth?
