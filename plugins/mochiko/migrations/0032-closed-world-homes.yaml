grammar: 1
id: 0032-closed-world-homes
sequence: 32
intent: >-
  Declare the directories mochiko itself writes under the closed world, per the ratified census
  table (rows H5, N1–N5): the archive root with its literal set, the archived ledgers and the
  product-baseline snapshots as homes with their own file sets, the derived views by kind, the
  strip records and the operating docs a knowledge-management collision ruling nests; and withdraw
  the spec home's two unwritten baseline names. The archive root declares no name pattern, and
  kinako's B53, B61 and FEAT-006/reviews stay undeclared as closed record, which the census
  ratification rules as amending field review S11 and D9(b) in part
  (.mochiko/decisions/2026-09-29-census-table-ratified.md).
anchor: 2026-09-23 hook-enforcement-field-review D3
hash: sha256:8a46752953f311e02bf8d419d37f5e7abac3733f85aca2c9ab3a76f504a76b7e
changes:
  - op: import-document
    kind: home
    name: archive
    content:
      home: archive
      title: The archive — append-only and frozen records
      path: [.mochiko, archive]
      bounds: elsewhere
      bounds_cite: .mochiko/memory/knowledge-management.md
      deliverables:
        - file: backlog-trail.md
        - file: REGISTRY.md
        - file: ROADMAP.md
        - file: provenance-frozen-2026-09-05.yaml
  - op: import-document
    kind: home
    name: archive-ledgers
    content:
      home: archive-ledgers
      title: One feature's archived baseline-delta ledger, moved unchanged
      path: [.mochiko, archive, ledgers, <FEAT-ID>]
      bounds: elsewhere
      bounds_cite: delta-files-vs-direct-baseline-edits D5(ii) (moved unchanged, frozen)
      deliverables:
        - file: baseline-delta.md
  - op: import-document
    kind: home
    name: archive-product-baselines
    content:
      home: archive-product-baselines
      title: One dated snapshot of the sources a brownfield store reconstruction absorbed
      path: [.mochiko, archive, product-baselines, <slug>]
      bounds: elsewhere
      bounds_cite: arch.tools-brownfield-reconstruction (the absorbed sources, archived unchanged)
      deliverables:
        - file: ARCHITECTURE-prose.md
        - file: <FEAT-ID>-architecture.md
        - file: nfrs.md
  - op: import-document
    kind: home
    name: schema-views
    content:
      home: schema-views
      title: One kind's derived views — regenerated by mochiko-cli views emit, never hand-edited
      path: [.mochiko, schema-views, <slug>]
      bounds: elsewhere
      bounds_cite: the replayed migration log, emitted by mochiko-cli views emit
      deliverables:
        - file: <slug>.yaml
  - op: import-document
    kind: home
    name: strips
    content:
      home: strips
      title: Per-primitive strip records
      path: [.mochiko, strips]
      bounds: elsewhere
      bounds_cite: .mochiko/strips/README.md
      deliverables:
        - file: README.md
        - file: <slug>.md
  - op: import-document
    kind: home
    name: operating-docs-nested
    content:
      home: operating-docs-nested
      title: Operating docs a knowledge-management collision ruling nests under .mochiko
      path: [.mochiko]
      bounds: elsewhere
      bounds_cite: .mochiko/memory/knowledge-management.md
      deliverables:
        - file: ROADMAP.md
        - file: BACKLOG.md
        - file: DECISIONS.md
        - file: ARCHITECTURE.md
        - file: GLOSSARY.md
  - op: replace-document
    kind: home
    name: spec
    content:
      home: spec
      title: One feature specification's home
      path: [.mochiko, specs, <slug>]
      bounds: template
      deliverables:
        - file: spec.md
          template: spec
        - file: derivation.md
          max_lines: 300
        - file: constraints-and-decisions.md
          max_lines: 300
      subdirs: [stories, contracts, prototype, map-delta]
      reports:
        envelope: report-envelope
        by_type: {}
