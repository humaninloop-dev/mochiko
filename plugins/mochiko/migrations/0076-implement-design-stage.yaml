grammar: 1
id: 0076-implement-design-stage
sequence: 76
intent: >-
  Implement's design stage, written straight onto the shared thinking stage with only its domain
  part (implement-brainstorm-led D5–D8 as review-amended, and the confirmed defaults Implement
  — the blind list, handed-in sets, mid-build re-fire, the set's home and the fail): the
  design-stage moment; seven domain rules across roles, reserved and ways-of-working — the stage
  with its ruled-set contract on, its agenda and the outside need, the unit, the blind list, the
  inputs in hand, the set's file and the seat-addition split that is implement's by-name grant of
  analysis-iterative.contract-inside's latitude; the floor fail
  impl.fail.design-outside-ruled-set; the floor gate impl.gate-design-checkpoint reworded to the
  landing table and to architecture-brainstorm-interview D8's signed object and D9's surface, its
  force kept and re-anchored to D8 (superseding architecture-design-primitive
  D8-rendered-diagram-signoff as to the rendered-diagram clause); and impl.midrun-refire reworded
  for the short re-fired stage. No asking mechanic is restated; no floor or fail retired or
  lowered.
anchor: 2026-10-11 implement-brainstorm-led
hash: sha256:8f88f832f04a4429e5bee283708a10d10c461509180677b6f1a17bb1243c8785
changes:
  - op: set-moment
    schema: command/implement
    name: design-stage
    text: >-
      Where the design phase's agenda is ruled with the user — after the run-open confirmation,
      before any design seat drafts — and again, scoped to the discovery, when undesigned
      structure halts a cycle.
  - op: mint-rule
    schema: command/implement
    section: impl.sec.roles
    rule:
      id: impl.design-stage
      labels: [scope-entry, user-gate]
      class: must
      kind: duty
      text: >-
        At the design-stage moment the design phase's agenda (impl.design-stage-agenda) is ruled
        with the user on the thinking stage with its ruled-set contract on: the ruled set is saved
        in the run's `design-stage.md` (impl.design-stage-file), the design seats are its next
        writers and plan and draft only inside it, and the design review pair is its independent
        leg (impl.design-review-pair). Run-open stays one confirmation; on the zero-gap path no
        stage runs and nothing changes, and an epic's joint spine always gives it an agenda.
      anchor: 2026-10-11 implement-brainstorm-led D5
  - op: mint-rule
    schema: command/implement
    section: impl.sec.roles
    rule:
      id: impl.design-stage-blind-list
      labels: [independence, seats]
      class: must
      kind: duty
      text: >-
        Once per design phase, before the stage closes, one fresh persona-less `general-purpose`
        seat spawned with `model: opus` draws the blind list, given only the spec, the gap list,
        the derived store index and any visit file handed in, and returns the hidden choices it
        sees inside each gap; each difference from your candidates is a candidate piece the user
        rules, and one outside every gap is an outside need (impl.design-stage-agenda). Skipped on
        a single-gap re-fire.
      anchor: 2026-10-11 implement-brainstorm-led
  - op: mint-rule
    schema: command/implement
    section: impl.sec.reserved
    rule:
      id: impl.design-stage-agenda
      labels: [user-gate, scope-entry]
      class: must
      kind: reservation
      text: >-
        The stage's agenda is the gap list the sufficiency check graded — on an epic, once, the
        joint gap list with the joint spine's design items beside it: the seams between members,
        the joint architecture, the batch ordering. A design need found outside it is the user's
        to rule, split by kind: new behaviour, which the spec carries no story or acceptance
        criteria for, never joins this run — it goes to `/mochiko:specify`, `BACKLOG.md` or a
        feature-desk card; a design piece inside a story the spec carries is the user's — this
        run, or later — and joins only once the sufficiency seat has re-graded it as a gap,
        marked user-added in its report. A lane run adds none (impl.lane-never-widens). Nothing
        outside the agenda is designed without that ruling.
      anchor: 2026-10-11 implement-brainstorm-led D6
  - op: mint-rule
    schema: command/implement
    section: impl.sec.reserved
    rule:
      id: impl.design-seat-additions
      labels: [user-gate]
      class: must
      kind: reservation
      text: >-
        What a design seat adds beyond the ruled set is the user's. A small technical extra no
        ruled item or confirmed default touches — an index for speed — may wait for the
        landing table at the design checkpoint: this is implement's by-name grant of
        analysis-iterative.contract-inside's latitude for a later sign-off, and nothing wider.
        Anything that changes a ruling, or that the user would notice — invoices becoming
        deletable — halts to the user through you before it is written.
      anchor: 2026-10-11 implement-brainstorm-led D8
  - op: mint-rule
    schema: command/implement
    section: impl.sec.ways-of-working
    rule:
      id: impl.design-stage-unit
      labels: [user-gate, seats]
      class: must
      kind: duty
      text: >-
        Per gap the user gives the direction in their own words and one "I'd know it works if…"
        line — the seed, `open` allowed and carried as an open question, never invented. The
        design seat that owns the gap's surface — ${design_seat} for a data or contract gap,
        ${architect_seat} for a structural one — then proposes its candidate pieces read-only,
        riding its plan-only dispatch and writing nothing: for a data gap the fields, states and
        rules; for an API gap the inputs, outputs and errors; for a structural gap the parts and
        how they talk. You put the pieces to the user under the stage's own-turn-or-batch rule, a
        piece with its own turn put as what the user would notice — plain consequences and a
        worked example with real values, never a schema — and a batched one with its suggestion
        and its cost. A gap's ruled set is its direction, its seed and its ruled pieces; once the
        stage closes the seat finishes its plan inside it, peer-graded per
        impl.plan-approval-producers.
      anchor: 2026-10-11 implement-brainstorm-led D7
  - op: mint-rule
    schema: command/implement
    section: impl.sec.ways-of-working
    rule:
      id: impl.design-stage-inputs
      labels: [scope-entry, evidence]
      class: must
      kind: binding
      text: >-
        Implement's inputs in hand when its design stage opens: a desk visit file keyed to the
        feature (impl.design-inputs), the spec's slate and Intent, and a brainstorm record the
        user names. A visit file that covers some gaps leaves the stage to run on the rest.
      anchor: 2026-10-11 implement-brainstorm-led
  - op: mint-rule
    schema: command/implement
    section: impl.sec.ways-of-working
    rule:
      id: impl.design-stage-file
      labels: [binding]
      class: must
      kind: binding
      text: >-
        The ruled set is kept in `design-stage.md` at the run's home — the feature's, an epic's,
        a lane's — to the shape `mochiko-cli template design-stage` renders: you write each item
        into it as the stage rules it and the whole set before the pen passes, every later ruling
        — a halted addition, a user-added gap — before it reaches the writer, and a stopped
        stage's open candidates, so a resumed run opens the stage from the file.
      anchor: 2026-10-11 implement-brainstorm-led
  - op: mint-rule
    schema: command/implement
    section: impl.sec.fail-conditions
    rule:
      id: impl.fail.design-outside-ruled-set
      labels: [user-gate]
      class: floor
      kind: fail
      text: >-
        A design output (impl.design-outputs-home) written with no ruled set behind it in the
        run's `design-stage.md` — the baseline seed of impl.design-absent-baseline-seed excepted
        — a write that changes a ruling without the user's word, or a small technical extra the
        user did not OK at the landing table.
      enforces: [impl.design-stage, impl.design-stage-agenda, impl.design-stage-file, impl.design-seat-additions]
      anchor: 2026-10-11 implement-brainstorm-led
  - op: reword-rule
    schema: command/implement
    id: impl.gate-design-checkpoint
    text: >-
      The design checkpoint is the user's. Where the check named gaps, no code is written before
      the user signs the design and the store delta, asked as the landing table: each ruled item
      of the run's `design-stage.md` — direction, seed, ruled piece, user-added gap — beside
      how it landed in the drafts, kept or changed with why, and every small technical extra the
      seats added, each needing the user's OK; mochiko:review-plan-artifacts' meaning-kept grade
      fills it. The store delta is signed on the run's architecture.md — signing it signs the
      delta-styled store diagram files it lists — plus its named AX-XXX row changes and the
      pinned-base diff of the baselines; each diagram is shown as Mermaid text that parses,
      rendered beside it where the session can — a local preview preferred, a hosted page only
      on the user's yes — else with a one-line note that it was not rendered here, that it
      renders where it is viewed, and which read confirmed the parse. The checkpoint's closing act
      is the flip: each `proposed (<key>)` entry of the run, in every baseline and the store,
      flips by the pinned-base diff — absent at the base to `in-flight (<key>)`, changed from it
      to `modifying (<key>)`, cut to its heading to `removing (<key>)` — the store's through
      mochiko:authoring-architecture-store; the sign-off base is then pinned per impl.base-pins.
      The user may stop at the checkpoint and resume the build later.
  - op: set-rule-field
    schema: command/implement
    id: impl.gate-design-checkpoint
    field: anchor
    value: 2026-10-11 implement-brainstorm-led D8
  - op: reword-rule
    schema: command/implement
    id: impl.midrun-refire
    text: >-
      A builder hitting undesigned structure halts that cycle and interrupts, as
      impl.escalation-batching allows a build-blocking question: the design phase re-fires scoped
      to the discovery — a short design stage over it, then the same grade and the same
      landing-table checkpoint. The deviation gate anchors to the signed delta once one exists.
