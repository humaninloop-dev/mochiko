grammar: 1
id: 0035-home-sets-after-delta
sequence: 35
intent: >-
  The feature, epic and product-lane home sets after delta D4, per the ratified census table (rows
  H1–H4): the baseline copies and baseline-delta.md withdrawn, the epic's implement-log.md
  withdrawn per field review D6, the lane run's signed drawing declared, the feature gates file at
  a whole-file 300, and the two contracts homes emptied.
anchor: 2026-09-24 delta-files-vs-direct-baseline-edits D4
