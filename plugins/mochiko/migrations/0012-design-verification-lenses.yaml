grammar: 1
id: 0012-design-verification-lenses
sequence: 12
intent: >-
  Ship the design-verification lenses: the review-design-audit skill on the verification seat, the
  critique lens and its fence entry inside testing-gap-finding with the accessibility decline
  superseded for verification only, and the measured-assert evidence note on testing-end-user.
anchor: 2026-09-19 impeccable-design-integration D8
hash: sha256:e6d23f678ce6d98fe08babaab250c27175b5f9ecf4f4b3b6d11c04cf4c4af354
changes:
  - op: import-document
    kind: skill
    name: review-design-audit
    content:
      kind: skill
      skill: review-design-audit
      conditions:
        ux_bearing:
          values:
            - 'yes'
            - 'no'
          resolution: entry-derived
          note: the spec's intent-stage UX-bearing ruling for the feature under validation.
      sections:
        - id: review-design-audit.sec.independence
          title: Independence — the verification seat, never the builder
          intent: Who runs the lens and who never does.
          rules:
            - id: review-design-audit.author-grader
              class: floor
              extends: review-common.author-grader
            - id: review-design-audit.seat-qa-engineer
              labels: [independence]
              class: must
              kind: binding
              text: >-
                The lens runs on the verification seat, `mochiko:qa-engineer` — never the
                builder who wrote the UI and never the blind gap-finding seat, whose fence forbids
                code sight.
              pointer: mochiko:qa-engineer
              anchor: 2026-09-19 impeccable-design-integration D3
        - id: review-design-audit.sec.scope
          title: Scope — the design-audit lens only
          intent: Where the lens runs and the neighbouring lenses it never absorbs.
          rules:
            - id: review-design-audit.final-validation-ux-only
              labels: [boundary]
              class: must
              text: >-
                Runs once, at final validation, over a UX-bearing feature's built UI —
                identically at both depth levels; depth never adds or removes a leg.
              when: {ux_bearing: 'yes'}
              anchor: 2026-09-19 impeccable-design-integration D13
            - id: review-design-audit.not-critique
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Grading the built UI against the direction contract is the critique lens in
                `mochiko:testing-gap-finding`, on the blind seat — never this lens.
              pointer: mochiko:testing-gap-finding
            - id: review-design-audit.not-a11y-verification
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Verifying the accessibility standard of record is the audit lens's pass/fail legs
                — `**TEST:**` cases on the UX-bearing cards, executed by
                `mochiko:testing-end-user`; this lens originates no accessibility finding.
              pointer: mochiko:testing-end-user
              anchor: 2026-09-19 impeccable-design-integration D11
            - id: review-design-audit.not-test-execution
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                The pass/fail half of the audit — the UX-bearing cards' `**TEST:**` legs —
                runs through `mochiko:testing-end-user`; this lens originates findings only, and
                never re-runs a declared case.
              pointer: mochiko:testing-end-user
            - id: review-design-audit.not-code-minimalism
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Ladder discipline in the produced code is `mochiko:review-code-minimalism`, per
                cycle — never this lens.
              pointer: mochiko:review-code-minimalism
        - id: review-design-audit.sec.inputs
          title: Inputs — the standards and the running build
          intent: What the lens grades against and what it reads.
          rules:
            - id: review-design-audit.standard-binding
              labels: [binding, evidence]
              class: must
              kind: binding
              text: >-
                The standards are the spec's Screens & Flows Direction block and SCR/FLOW
                manifest, and the design baseline at `.mochiko/product/design/` — pointed at,
                never restated. Before the baseline holds a system part, the Direction block's
                declared tokens stand in.
            - id: review-design-audit.built-ui-real-infra
              labels: [evidence]
              class: must
              text: >-
                The lens reads the built UI running on real infrastructure, at the viewports the
                Direction block's Contract declares, plus the feature's code — never the
                prototype.
            - id: review-design-audit.legs-walked
              labels: [evidence, reporting]
              class: must
              kind: duty
              text: >-
                All four legs — performance, `harden`, `polish`, slop tells — are walked, or a
                leg's skip is stated with its reason; an unstated skip reads as a clean leg.
        - id: review-design-audit.sec.verdict
          title: Verdict semantics — advisory
          intent: What a finding is and what it can never do.
          rules:
            - id: review-design-audit.advisory-never-failing
              labels: [verdict]
              class: floor
              text: >-
                A `design-audit:` finding never fails a cycle or the final validation — advisory
                to the lead's checkpoint verdict.
              anchor: 2026-09-19 impeccable-design-integration D8
            - id: review-design-audit.baseline-divergence-drift
              labels: [verdict]
              class: must
              text: >-
                A value diverging from the design baseline is a finding carried to the landing
                fold as a `Drift:` candidate; the lens never writes the baseline.
              anchor: 2026-09-19 impeccable-design-integration D7
            - id: review-design-audit.evidence-per-finding
              labels: [evidence]
              class: must
              text: >-
                Every finding carries one line of evidence — a measured value, a screenshot
                path, or a file and line; a finding without evidence is dropped, never reported.
        - id: review-design-audit.sec.output
          title: Output — the findings block
          intent: The one shape findings leave in.
          rules:
            - id: review-design-audit.design-audit-entries-form
              labels: [reporting]
              class: must
              kind: binding
              text: >-
                One `design-audit:` entry per finding in the final-validation report: leg, the
                SCR-XXX or FLOW-XXX it sits on, one-line evidence. No findings — an empty block;
                never narrate a clean audit.
        - id: review-design-audit.sec.reserved
          title: Reserved — the lead's checkpoint, the user's ruling
          intent: Decisions this lens never takes.
          rules:
            - id: review-design-audit.verdict-is-input
              class: must
              kind: reservation
              extends: review-common.verdict-is-input
            - id: review-design-audit.disposition-at-checkpoint
              labels: [user-gate]
              class: must
              kind: reservation
              text: >-
                The user rules each finding fix-now, backlog, or accept at the final checkpoint;
                the lens never fixes what it finds.
  - op: set-condition
    schema: skill/testing-gap-finding
    name: ux_bearing
    spec:
      values:
        - 'yes'
        - 'no'
      resolution: entry-derived
      note: the spec's intent-stage UX-bearing ruling for the feature under validation.
  - op: mint-rule
    schema: skill/testing-gap-finding
    section: testing-gap-finding.sec.scope
    rule:
      id: testing-gap-finding.critique-lens-ux-bearing
      labels: [boundary]
      class: must
      text: >-
        On a UX-bearing feature the pass carries the critique lens: the same blind seat, inside
        the same fence, grades the built UI against the Screens & Flows Direction block, the
        SCR/FLOW manifest, and the design baseline — at both depth levels.
      when: {ux_bearing: 'yes'}
      anchor: 2026-09-19 impeccable-design-integration D8
  - op: mint-rule
    schema: skill/testing-gap-finding
    section: testing-gap-finding.sec.scope
    rule:
      id: testing-gap-finding.a11y-verification-routing
      labels: [boundary]
      class: must
      kind: routing
      text: >-
        No accessibility probing in this pass or its critique lens. The a11y floor stays a
        build-time standard; verifying it at final validation is the audit lens's `**TEST:**` legs
        on `mochiko:qa-engineer`.
      anchor: 2026-09-19 impeccable-design-integration D11
  - op: mint-rule
    schema: skill/testing-gap-finding
    section: testing-gap-finding.sec.verdict
    rule:
      id: testing-gap-finding.critique-finding-split
      labels: [verdict, evidence]
      class: must
      text: >-
        Critique findings split by kind: a broken Direction-block or SCR/FLOW promise is a
        spec-violation citing it; a departure from the design baseline blocks, citing the baseline
        entry; a taste finding is advisory, carried to the landing fold — never blocking.
      anchor: 2026-09-19 impeccable-design-integration D8
  - op: mint-rule
    schema: skill/testing-gap-finding
    section: testing-gap-finding.sec.verdict
    rule:
      id: testing-gap-finding.critique-low-depth-advisory
      labels: [verdict]
      class: must
      text: Every critique finding is advisory, and no confirm round runs.
      when: {depth: low, ux_bearing: 'yes'}
      anchor: 2026-09-19 impeccable-design-integration D13
  - op: mint-rule
    schema: skill/testing-gap-finding
    section: testing-gap-finding.sec.reserved
    rule:
      id: testing-gap-finding.critique-fix-confirm-bound
      labels: [verdict]
      class: must
      kind: bound
      text: >-
        Critique findings are batched: one fix round, then one confirm round that scores each
        prior finding resolved, partial, or unresolved and names regressions the fix batch
        introduced — no new hunt. Then stop; what stays open goes to the checkpoint.
      when: {depth: high, ux_bearing: 'yes'}
      anchor: 2026-09-19 impeccable-design-integration D8
  - op: reword-rule
    schema: skill/testing-gap-finding
    id: testing-gap-finding.blindness-fence-inclusion-list
    text: >-
      The explorer is blind to code and cards. Admissible inputs are an explicit inclusion list,
      not a layer label: `spec.md` (FR-XXX, SC-XXX, stories, declared edge cases) · the run's
      sufficiency report and the feature's design-phase deltas — those two artifacts only, never
      the `FEAT-XXX/` run-output directory at large · Screens & Flows (SCR-XXX, FLOW-XXX) ·
      `data-model.md` (entities, state machines, DS-XXX sensitivity) · `contracts/` (`api.yaml`
      and any sibling contract documents) · the architecture store's concern rows only — their
      `NFR-XXX` targets (`.mochiko/product/architecture/concerns.md` plus any graduated
      `concerns/AX-XXX-<slug>.md`) · on a UX-bearing feature, the design baseline
      (`.mochiko/product/design/`), whose design truth and as-built system are the promised look
      and conduct of the rendered UI. All define externally-observable promised behavior, so the
      pass stays black-box.
  - op: reword-rule
    schema: skill/testing-gap-finding
    id: testing-gap-finding.report-disclosure
    text: >-
      The final-validation report discloses the expectation count, the probed count, each
      unprobeable expectation with its reason, the findings by kind, and — on a UX-bearing
      feature — the critique findings by kind with their fix and confirm outcomes.
  - op: reword-rule
    schema: skill/testing-gap-finding
    id: testing-gap-finding.reviewer-mirror-checklist
    text: >-
      The pre-hand-up quality checklist mirrors this schema's rules one-for-one — scope and skip
      statement · fence-clean dispatch and delegation · numbered expectations before probing ·
      depth-bound lens or noted skip · critique lens run on a UX-bearing feature, no
      accessibility probing · kinds proposed with evidence · critique split and bound honored ·
      adjudication and routing honored · done condition met · disclosure complete · fold-back
      authored — each box checked against its rule, none beyond them.
  - op: mint-rule
    schema: skill/testing-end-user
    section: testing-end-user.sec.output
    rule:
      id: testing-end-user.measured-assert-evidence
      labels: [evidence]
      class: must
      kind: duty
      text: >-
        An assert stating a numeric threshold on the rendered UI — contrast, target or text
        size, line length, heading order, a viewport — is measured through the browser driver's
        computed styles and layout where the project has one, and the measured value captured as
        evidence. It stays a custom assertion for human evaluation; classification is unchanged.
      anchor: 2026-09-19 impeccable-design-integration D10
