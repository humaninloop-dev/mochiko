grammar: 1
id: 0084-artifact-home-only-restored
sequence: 84
intent: >-
  Wave 3's gate fix round (unit 3 FAIL, one blocking finding): 0083 reworded the floor
  impl.artifact-home from "recorded on that entry only," to "recorded on that entry,", and the
  "only" carries the seams ruling R1 (2026-09-29-joint-hook-delta-build-seams, "recorded on that
  entry and nowhere else", landed via 0037) — it keeps a ruling that changes an entry out of
  `.mochiko/decisions/`, which "never in a ledger" does not, a ledger in implement's text being
  baseline-delta.md or the governance ledger. Restore the "only"; every other byte of 0083's text
  stands, the "never in a ledger" clause and the design-stage.md clause — the run's input, never
  that record — included, the latter keeping the "only" true. The floor keeps its id, class,
  kind and the hook-enforced-artifact-schema D1 anchor; no floor or fail retired or lowered.
anchor: 2026-10-11 implement-brainstorm-led
hash: sha256:6bbee4f6bd8075674c61293ce4ca01d18650f6519c8abfb9a9b5e25c39fb9ad0
changes:
  - op: reword-rule
    schema: command/implement
    id: impl.artifact-home
    text: >-
      Build-run artifacts have a declared home: render `mochiko-cli home ${features_dir}/FEAT-XXX`
      — an epic run, the epic home; a lane run, the lane home — before the first write.
      `tasks.md` binds the `tasks` template and `design-stage.md` the `design-stage` template;
      every report lands in that home's `reports/` typed by its envelope. The run log,
      `implement-log.md`, is the lead's ephemeral working memory in the run folder
      (impl.run-folder), never in any other home. A ruling made during the run that changes a
      product baseline or the architecture store is recorded on that entry only, its reason in the
      entry's own fields (impl.baseline-entry-grammar), never in a ledger; the run's
      `design-stage.md` holds the design stage's ruled set as the run's input, never as that
      record; a standing ruling that touches no entry lands at the landing as a
      `.mochiko/decisions/<date>-<slug>.md` record; a checkpoint acceptance takes no
      `DECISIONS.md` row — its report and the `tasks.md` checkbox carry it. A name the home's
      set does not carry is raised to the lead, never minted from a sibling run.
