      kind: binding
      text: >-
        The prototype is written under the spec home's declared `prototype/` sub-directory, which
        no home document governs: render `mochiko-cli home .mochiko/specs/<slug>` before the first
        write to confirm that, and keep the screens and flows the prototype renders in `spec.md`'s
        own section under the `spec` template. Nothing outside that sub-directory is the
        prototype's to write.
      anchor: 2026-09-13 hook-enforced-artifact-schema D1
