  - op: replace-document
    kind: template
    name: feature-entry
    content:
      template: feature-entry
      title: Feature Map Entry (per-capability)
      form: artifact-format.md
      register: full
      overview: |
        One file per capability: .mochiko/features/FEAT-XXX-<slug>.md. Authored and amended per
        mochiko:authoring-feature-map — the skill carries the derivation method, the work-row and
        fold rules, and the write timing; this shape carries only the structure. An entry is a
        durable capability plus a block of transient work rows (its delivery increments); there is
        NO parent/leaf nesting — capabilities are flat, grouped by domains only at the soft cap
        (mochiko:patterns-map-minimalism). Status is owned HERE (and mirrored one-line in
        FEATURES.md): story files derive theirs by following the FEAT-ID. Omit empty sections per
        artifact-format.md rule 6.
      sections:
        - name: Header & Status
          required: true
          contract: |
            Title "# FEAT-{{XXX}} — {{capability_name}}" plus a Status line
            (proposed | in-flight | delivered | retired) and one status-dependent detail line:
              in-flight  -> since {{date}} · live work rows in run(s): `.mochiko/specs/{{spec-slug}}/`
                            (or the owning lane run, for feature-command growth-door work)
              delivered  -> since {{date}} · sticky — live rows may still be visible below
              retired    -> {{date}} · ruling: {{pointer}}  (or, on a merge: merged-into FEAT-{{YYY}})
              proposed   -> surfaced by {{spec-slug}} ({{date}}) — or, for a capability stub,
                            minted by /mochiko:feature ({{date}}) · marked `unrefined`
            Reconstructed entries add: `reconstructed-from-code ({{date}}) — first touching spec
            re-verifies extent` — cleared at that spec's acceptance. `unrefined` stubs carry name +
            one-breath hook only — no Extent, no work rows; only specify's derivation fills them and
            makes the entry selectable.
          check: >-
            Is the header FEAT-XXX + capability name present, with a Status
            (proposed/in-flight/delivered/retired) and the matching one-line status detail (and
            the unrefined/reconstructed markers where they apply)?
        - name: Capability
          required: true
          density: 1-3 lines
          contract: |
            1-3 lines, the system's own language — what the product does, standing on its own without
            reference to any story or spec. More than ~3 lines of extent below usually means this is
            two capabilities, or its bulk is undelivered work rows.
          check: >-
            Is the Capability statement 1-3 lines in the system's own language, standing without
            reference to a story or spec?
          heading: Capability
          max_lines: 6
        - name: Extent
          required: true
          density: one line each
          contract: |
            What is in, and what is notably NOT in — one line each. This is where stories sharpen the
            capability over time, and where a delivered work row folds in at its landing. (Absent on
            an `unrefined` stub.)
          check: >-
            Does Extent state what is in and what is notably not in, one line each (or is the
            entry an unrefined stub, which has no Extent)?
          heading: Extent
          max_lines: 6
        - name: Work rows
          required: false
          density: one line each, newest first
          contract: |
            Transient delivery increments under this capability — one line each, newest first. Each
            row carries a state and its run pointer; a `live` row folds into Extent above at its
            acceptance landing and leaves this list, a `pending` row persists as open obligation
            (deferred work never silently disappears). Grammar:
              - `pending` — {{increment}} · acceptance: {{criteria}} · cut by {{spec-slug or lane-run}}
              - `live`    — {{increment}} · acceptance: {{criteria}} · in {{spec-slug or lane-run}}
            Story-shaped increments are fine here; a story-shaped *capability* is not.
          check: >-
            Are work rows one line each (newest first), each carrying a state (`live`/`pending`),
            acceptance, and run pointer — with `live` rows folding into Extent at landing and
            `pending` rows persisting?
          heading: Work rows
          max_lines: 20
        - name: Relations
          required: false
          density: one line per relation
          contract: |
            One line per relation to another FEAT-ID: depends-on / extends / composes-with. A work row
            may depend on another capability's row — note it here; row-level dependencies order the
            two capability-batch runs.
          check: >-
            Is each relation one line to a FEAT-ID with a relation kind
            (depends-on/extends/composes-with) and a one-line why?
          heading: Relations
          max_lines: 20
        - name: Architecture
          required: false
          contract: |
            Which architecture-store elements realize this capability, named by id: SPN-XXX spine
            elements — any kind (container | boundary | flow) — and/or AX-XXX concern rows, at
            .mochiko/product/architecture/. Pointers only, navigable both directions; never restate
            the element. (Domain -> element mapping is dormant: it lands only at the soft cap, per
            mochiko:patterns-map-minimalism.)
          check: >-
            Does Architecture point at the realizing store elements by id — SPN-XXX spine
            elements of any kind (container/boundary/flow) and/or AX-XXX concern rows (pointers
            only, no restated element content)?
          heading: Architecture
          max_lines: 20
        - name: Story trace
          required: false
          density: IDs and pointers only, newest first
          contract: |
            Accumulating provenance: which specs/stories informed this capability — IDs and pointers
            only, newest first.
          check: Is the story trace IDs-and-pointers only, newest first (accumulating provenance)?
          heading: Story trace
          max_lines: 20
        - name: Obligations
          required: false
          density: one line each
          contract: |
            Deferred completeness pointers riding this entry until the work builds — one line each,
            distinct from work rows (which are cut delivery increments): deferred SC-XXX (travels here
            when its covering capability went unselected) · deferred seams ("when built, verify seam
            against FEAT-XXX") · cross-cutting extend obligations from stories homed elsewhere.
          check: >-
            Are obligations one line each, distinct from work rows — deferred SCs, deferred
            seams, and cross-cutting extend obligations?
          heading: Obligations
          max_lines: 20
      skeleton: |
        # FEAT-{{XXX}} — {{capability_name}}

        > Status: {{status}}  <!-- proposed | in-flight | delivered | retired -->
        > {{status_line_detail}}

        ## Capability

        {{capability_statement}}

        ## Extent

        - {{in_scope_line}}
        - Not: {{out_of_scope_line}}

        ## Work rows

        - `live` — {{increment}} · acceptance: {{criteria}} · in {{spec_or_lane_run}}

        ## Relations

        - depends-on: {{FEAT-ID}} — {{one_line_why}}

        ## Architecture

        - {{SPN-XXX | AX-XXX}} — {{element_name}} (`.mochiko/product/architecture/`)

        ## Story trace

        - {{spec-slug}}: US-{{n}}, US-{{n}}

        ## Obligations

        - {{obligation_line}}
      conformance:
        extra_headings: deny
  - op: replace-document
    kind: template
    name: governance-intent
    content:
      template: governance-intent
      title: Governance Intent (the session synthesis — traceable contract)
      form: artifact-format.md
      register: full
      overview: |
        GOVERNANCE INTENT — the session synthesis (fill target)
        ========================================================
        Written by the /mochiko:setup lead at the close of the interrogation session and ratified at the
        synthesis-confirmation checkpoint BEFORE any authoring. Lives durably at
        `.mochiko/memory/governance-intent.md`, beside the governance ledger of the surface set it
        governs (there is no constitution.md — governance lands on native surfaces).

        This artifact is a TRACEABLE CONTRACT on the surface-set producer, not a brief:
        - Every principle in the authored surface set MUST trace to exactly one element here
          (its GI-ID), and every principle-bearing element here MUST be realized on a surface
          or surfaced as a flagged proposal at the acceptance gate.
        - Producer latitude is confined to FORMULATION (wording, enforcement mechanics, three-part
          structure with real commands) — never SELECTION.
        - The validator string-matches trace-IDs both ways (deterministic). Semantic fidelity of a
          stamped trace is judgment-grade residual risk, mitigated by the synthesis-confirmation
          checkpoint and the acceptance gate's trace summary.

        AMEND RUNS UPDATE THIS FILE DELTA-WISE: touched elements are edited or superseded (never
        renumbered), new elements take fresh IDs, untouched elements keep their IDs, and the Amendment
        Log records each delta. The traceability cross-check always runs against this persisted,
        updated file. LEGACY MIGRATION: an amend run meeting a tier declaration (the retired axis)
        supersedes it — never renumbered — elicits the fact profile once, and re-records existing
        waivers under the D4 model. An existing single-floor synthesis that carries NO depth-level
        declaration defaults to `high` on its next amend (adaptive-depth 2026-08-11, review fold #7) —
        recorded as the declared level without a flip ceremony, since it never operated at `low`.

        GI-ID rule: sequential GI-001, GI-002, … — unique forever within this file; never reuse a
        retired ID.

        CONFIDENCE MARKS: every GI element carries a mark from
        `Confident / Assumed / Contested / Unsure / Deferred`, assigned by the lead at assembly from the
        session's own indicators — updated DELTA-WISE on amend (untouched elements keep their marks).
        The marks are the G3 intent review's prioritization substrate; they are lead-self-reported, so
        the review audits them rather than trusting them. `Contested` = the user overruled a recorded
        challenge with the steelman in view — the recorded basis is required, or the mark is a defect.

        THE REVIEW SECTION is this file's durable record of the sized pre-G3 review (or its waiver) —
        recovery keys off its state. The reviewers produce lead-adjudicated input; the Tier-2 validator
        downstream issues the authoritative grade on the authored surface set (both still human-gated).
      sections:
        - name: Header
          required: true
          contract: |
            Title "# Governance Intent — [PROJECT_NAME]" plus:
            **Session date:** [YYYY-MM-DD] · **Mode:** [greenfield | brownfield | amend]
            **Confirmed at synthesis checkpoint:** [YYYY-MM-DD] by [user]
            **Governs:** the governance surface set v[X.Y.Z] (CLAUDE.md governance region · `.claude/rules/mochiko/` · `.mochiko/memory/governance-ledger.md`)
          check: >-
            Is the header present with project name, session date, mode
            (greenfield/brownfield/amend), the synthesis-checkpoint confirmation line, and the
            Governs line naming the surface-set version?
        - name: Fact profile
          required: true
          contract: |
            The module-driving facts (interrogation dimension 2), each with its consequence-stated
            confirmation — negatives are recorded facts too (the S4 fail-safe, per
            `authoring-constitution/references/COMPLIANCE-MODULES.md`):

            - **GI-001 — Facts:** industry: [x] · data classes: [x] · jurisdictions/markets: [x] ·
              contractual commitments: [x] · **Mark:** [Confident | Assumed | Contested | Unsure | Deferred]
            - **Modules triggered (mechanical):** [module list with trigger fact each, or "none — negatives
              confirmed: (each negative + its stated consequence)"]
            - **Brownfield cross-check:** [declared facts vs `codebase-analysis.md` / DS-XXX / detected
              integrations — "consistent" or the confrontation's ruling] *(brownfield only)*
          check: >-
            Does the Fact profile carry GI-001 (industry, data classes, jurisdictions, contractual
            commitments, with a mark), the mechanically-triggered modules (or 'none' with each
            negative + its stated consequence), and — brownfield only — the
            declared-facts-vs-codebase cross-check?
          heading: Fact profile
          max_lines: 15
        - name: Project identity & type
          required: true
          contract: |
            - **GI-002 — Type:** [frontend | backend | fullstack | service | mobile | desktop] → shelves
              dealt: [list] · **Mark:** [Confident | Assumed | Contested | Unsure | Deferred]
            - **Identity:** [what's being built, for whom, lifespan — 2-3 sentences]
            - **Risk surface:** [what failure costs — honest context for the floor's expression]
            - **Team reality:** [solo/team, review culture — what enforcement can lean on]
          check: >-
            Does Project identity & type carry GI-002 (type + shelves dealt + mark), the identity
            (what/for whom/lifespan), the risk surface, and the team reality?
          heading: Project identity & type
          max_lines: 10
        - name: Depth level declaration
          required: true
          contract: |
            The floor's single depth dial (adaptive-depth, 2026-08-11) — **one project-wide declaration, not
            a per-check negotiation**. Breadth is invariant: every floor category is present at both levels;
            the level tunes only how strictly the asserted *code* standards are authored (process rigor is
            uniform — D8), and compliance modules are level-blind (full strength at either level — D7). The
            level is the user's declaration alone — never fact-derived (D1); setup recommends, the user rules.

            - **GI-0XX — Declared level:** [low | high] · **Declared:** [YYYY-MM-DD] by [user] ·
              **Mark:** [Confident | Assumed | Contested | Unsure | Deferred]
            - **Rationale:** [why this level — setup recommends `low` for greenfield, `high` where reality
              warrants it; the user's ruling, recorded]
            - **Ratchet:** one-way — `high` is terminal; a later `low`→`high` move happens only through a
              flip ceremony (a conscious `/mochiko:setup` rerun in high mode), never silently, never reversed.
          check: >-
            Is there one project-wide Depth level declaration (GI-0XX: low|high, declared date +
            by user, mark, rationale, one-way ratchet), the user's declaration alone (never
            fact-derived)?
          heading: Depth level declaration
          max_lines: 6
        - name: Convergence skips
          required: false
          contract: |
            [Named skips only — a dimension left unasked because an earlier answer settled it ("dimension 5
            settled by dimension 1: solo founder"). A skip is convergence bookkeeping, never a scope ruling
            — there is no pruning license. Or "none".]
          check: >-
            Are convergence skips named-only (each a dimension settled by an earlier answer) or
            'none' — with no skip used as a scope/pruning ruling?
          heading: Convergence skips
          max_lines: 10
        - name: Real commands
          required: true
          contract: |
            (dimension 6/8 → the validator's placeholder bar)

            | Purpose | Command | Source |
            |---------|---------|--------|
            | Lint | `[actual command]` | [detected / declared] |
            | Test | `[actual command]` | [detected / declared] |
            | [etc.] | | |
          check: >-
            Are real commands (lint, test, etc.) captured as ACTUAL commands with a
            detected/declared source — no placeholders — meeting the validator's placeholder
            bar?
          heading: Real commands
          max_lines: 12
        - name: Floor expression & deck rulings
          required: true
          contract: |
            Floor cards enter asserted — their rows record *expression* (type translation), never a level
            ruling; arbitrated cards (architecture-opinion and kin) record the user's ruling. **Dropped
            arbitrated cards are rulings too:**

            | GI-ID | Card | Layer | Ruling / Expression | Mark |
            |-------|------|-------|---------------------|------|
            | GI-0XX | FLOOR-SEC | floor-asserted | [expression shaped how, or "at floor level"] | [Confident] |
            | GI-0XX | BE-HEX | arbitrated | [kept/tightened/dropped + user's stated reason] | [Confident] |
            | … | | | | |

            *(On a fact-profile or un-waive amend, affected rulings are re-dealt on the event's agenda
            slice or force-re-marked — a stale `Confident` never carries an unexamined ruling forward.)*
          check: >-
            Does Floor expression & deck rulings record each floor card's expression (type
            translation, not a level ruling) and each arbitrated card's user ruling
            (kept/tightened/dropped with reason — dropped cards recorded too), each with a GI-ID
            and mark?
          heading: Floor expression & deck rulings
          max_lines: 25
        - name: Minted principle intents
          required: false
          contract: |
            One element per minted intent — traced to the elicited answer, never to prompting:

            - **GI-0XX — [Intent name]:** [what to enforce, how strictly — the user's words distilled]
              · **Mark:** [Confident | Assumed | Contested | Unsure | Deferred]
              *Elicited from:* [dimension 9 answer, quoted or closely paraphrased]
          check: >-
            Is each minted principle intent one element (GI-0XX, what to enforce + how strictly,
            mark) traced to an elicited answer (never to prompting)?
          heading: Minted principle intents
          max_lines: 25
        - name: Waivers
          required: false
          contract: |
            Any asserted standard may be waived with a recorded justification (D4) — **except legal-mandate
            module obligations (D4.2)**. Waivers are permanent pending the D4.1 revisit; a revisit trigger
            is the user's option, never a default.

            **Interim transition delta (D6).** After a `low`→`high` flip, a category the project does not yet
            meet at the high level rides a waiver as a **bounded transition exception** — transition-scoped,
            naming its delta item, and dying when that item conforms. It is a staged-adoption record, never a
            depth valve: it does not lower the declared level, and the level stays `high`.

            Every waiver is auditable:

            | GI-ID | Standard (floor category / card / non-legal module obligation) | Justification | Revisit trigger (optional) | Mark |
            |-------|---------------------------------------------------------------|---------------|---------------------------|------|
            | GI-0XX | [e.g. FLOOR-TEST coverage gate] | [recorded reason] | [or "permanent (D4.1 pending)"] | [Confident] |
            | GI-0XX | [e.g. FLOOR-OBS SLO formalization] | interim transition delta (high declared [date]) | transition — dies when the item conforms | [Confident] |
          check: >-
            Is every waiver auditable (GI-ID, standard, justification, revisit-or-permanent,
            mark), with none naming a legal-mandate module obligation (D4.2), and interim
            transition deltas (D6) recorded as bounded transition-scoped exceptions that do not
            lower the declared level?
          heading: Waivers
          max_lines: 25
        - name: Module selections
          required: true
          contract: |
            **Template modules** (the operating-docs layer — knowledge-management, layer-rules,
            release-gates), ruled in session; *compliance modules attach mechanically in the Fact profile
            above, never here.* **Declines are rulings too** (recorded, durable: amend runs offer only
            modules with *no* recorded ruling here; a recorded decline is never re-asked until the user
            reopens it). The validator checks core + exactly the adopted modules:

            | GI-ID | Module | Ruling | Because | Mark |
            |-------|--------|--------|---------|------|
            | GI-0XX | [layer-rules] | adopted | [BE-HEX kept \| layered intent minted] | [Confident] |
            | GI-0XX | [knowledge-management] | [adopted \| declined] | [offered default-on at dimension 7; a decline also memorializes in dimension 10] | [Confident] |
            | … | | | | |
          check: >-
            Does Module selections rule the template modules in-session (adopted/declined, each
            with a why + GI-ID + mark), with declines recorded as durable rulings, and compliance
            modules NOT listed here (they attach mechanically in Fact profile)?
          heading: Module selections
          max_lines: 25
        - name: Domain-dependency seeds
          required: false
          contract: |
            (only when `layer-rules` is adopted)

            Session-arbitrated registry seeds per `authoring-constitution/references/DOMAIN-DEPENDENCIES.md`
            — domain-relevance filtered, trust-ranked, each level-cited; rejected seeds are rulings too:

            | GI-ID | Dependency | Signal level | Ruling | Mark |
            |-------|------------|--------------|--------|------|
            | GI-0XX | [equatable] | [1 — Flutter Favorites, live-verified] | [kept \| dropped] | [Confident] |
            | … | | | | |
          check: >-
            When layer-rules is adopted, are domain-dependency seeds session-arbitrated
            (domain-relevance filtered, trust-ranked, level-cited), with rejected seeds recorded
            as rulings too, each GI-ID'd and marked?
          heading: Domain-dependency seeds
          max_lines: 10
        - name: Deliberate exclusions
          required: false
          contract: |
            (dimension 10)

            - **GI-0XX:** [what governance will not cover + why — never a floor category (the floor leaves
              only by recorded waiver, above)]
              · **Mark:** [Confident | Assumed | Contested | Unsure | Deferred]
          check: >-
            Is each deliberate exclusion (dimension 10) recorded with what governance will not
            cover + why + a mark, and never a floor category (the floor leaves only by recorded
            waiver)?
          heading: Deliberate exclusions
          max_lines: 10
        - name: Review
          required: true
          contract: |
            <!-- The durable record of the sized pre-G3 intent review — one block per run (amend runs append
            a new block, event-scaled). Recovery keys off this section's state: no sizing ruling → open the
            gate; sized but survivors undispositioned → respawn/continue the review; folded but unverified →
            verify pass; waived or verified → G3. -->

            **[YYYY-MM-DD] — [first ratification | amend]**

            - **Sizing:** lead stated weight [element count · mark mix · reality-surface load]; the default
              [pair on first ratification | event-scaled on amend: governance event → pair · lighter
              substantive delta → single · wording-level → none-with-recorded-waiver]; **lead sized:**
              [pair | single | none], the sizing composed by the lead in its run plan — below the default
              also takes a departure-trail line.
            - *(if none)* **Waiver:** this record is lead-penned, so `none` is not the lead's to take —
              waived by [user] as an explicit reserved ruling, [stated reason]. The synthesis proceeds to
              G3 unreviewed; this record is the audit trail.
            - *(otherwise)* **Review:** reviewer(s) [coverage / coherence lenses | solo]; **tally** [N raised
              → M merged survivors]; recommended status [ready | needs-revision | critical-gaps]
            - **Survivor dispositions** (every survivor carries one):

              | # | Sev | GI element(s) | Finding | Disposition |
              |---|-----|---------------|---------|-------------|
              | S1 | [Critical] | [GI-0XX] | [one line] | [resolved / user-ruled / recorded-open — overruled → element marked `Contested`] |

            - **Verify pass:** [PASS — folds confirmed by the coherence-lens/sole reviewer | pending]
            - *(if any)* **G3-edit delta-pass:** [edited elements + the still-seated reviewer's outcome]
          check: >-
            Is the Review section present as the durable pre-G3 review record — one block per
            run with sizing (and departure trail if below default), or a user-reserved waiver,
            else reviewer/tally/recommended-status, every survivor carrying a disposition, plus
            the verify-pass and any G3-edit delta-pass?
          heading: Review
          max_lines: 25
        - name: Amendment Log
          required: true
          contract: |
            [Empty on first ratification. Amend runs append one entry per delta:]
            - [YYYY-MM-DD] — [GI-IDs added/edited/superseded] — [one-line rationale] — re-confirmed at
              synthesis checkpoint [date]
          check: >-
            Is the Amendment Log present (empty on first ratification; one appended entry per
            delta on amend — date, GI-IDs added/edited/superseded, rationale, re-confirmation
            date)?
          heading: Amendment Log
          max_lines: 25
      skeleton: |
