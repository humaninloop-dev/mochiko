        and `implement-log.md` is bounded per entry. A landing or review directory is not a
        sub-home — its files are reports.
      anchor: 2026-09-13 hook-enforced-artifact-schema D1
  - op: mint-rule
    schema: skill/authoring-prototype
    section: authoring-prototype.sec.artifact
    rule:
