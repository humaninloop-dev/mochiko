  - op: reword-rule
    schema: command/implement
    id: impl.reports-envelope
    text: >-
      All reports land in the owning home's `reports/` directory —
      ${features_dir}/FEAT-XXX/reports/ (a product-lane run: ${product_dir}/lane-<slug>/reports/,
      an epic run: the epic home's): the sufficiency report, cycle reports, verification reports,
      the final-validation report, the built-vs-signed diff. Every one carries the
      `report-envelope` frontmatter (machine-first, typed by `report:`, ultra register, clean =
      frontmatter-only; bounce an envelope-breaking report per templates/report-format.md rule 9),
      and each producing seat's brief names the home's `reports/` path. Repeat runs append, dated;
      delta files overwrite only via the graded fold.
