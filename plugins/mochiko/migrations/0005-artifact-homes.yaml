  - op: import-document
    kind: template
    name: report-envelope
    content:
      template: report-envelope
      title: Report Envelope
      form: report-format.md
      register: ultra
      overview: >-
        The envelope every mochiko report opens with, and the only part of a report this schema
        grades. A report lands in its home's `reports/` directory under a free name; its type is
        the frontmatter's `report:` field, drawn from the closed set below. Payload fields per
        type live in that type's own home — the producing skill's reference or a per-type
        template named by the home's `by_type` binding — never here. The prose set is closed: a
        failure narrative where the report carries a FAIL or blocking finding, notes of note where
        a non-obvious decision or blocker needs saying, and a null-exit reasoning block where the
        workflow defines one. A clean report is frontmatter-only, and an empty section is omitted
        rather than written as "None". Full shared rules: `templates/report-format.md`.
      conformance:
        frontmatter:
          required: [report]
          enum:
            report: [cycle, verification, final-validation, review, feasibility, disclosure]
        placeholders: [<feature-id>, <n>]
        extra_headings: allow
      sections:
        - name: Header
          required: true
          contract: >-
            The YAML frontmatter block, machine-first: `report:` from the closed type set,
            `feature:` where the run has one (a cycle report carries `cycle:` and `attempt:`
            instead of `round:`), `round:` where a lead counts rounds. Unknown extra fields are
            permitted; a missing required payload field is not. Governs no heading of its own.
          check: >-
            Is the frontmatter present, typed by `report:`, with every consumed datum a field?
        - name: Failure narrative
          heading: Failure narrative
          required: false
          max_lines: 15
          contract: >-
            Mandatory where the report carries a FAIL or a blocking finding, absent otherwise:
            what failed, why, and what was tried. Debug value concentrates here, which is why it
            is the one prose section that is ever required.
          check: >-
            Where the report fails, does the narrative say what failed, why, and what was tried?
        - name: Notes of note
          heading: Notes of note
          required: false
          max_lines: 15
          contract: >-
            Non-obvious decisions, difficulties, and flagged blockers — only when non-empty. A
            fact that fits a frontmatter field belongs in the field, not here.
          check: Are the notes non-obvious, or are they restating fields?
        - name: Null-exit reasoning
          heading: Null-exit reasoning
          required: false
          max_lines: 15
          contract: >-
            Present only where the workflow defines a null exit: why the run produced nothing, in
            the terms that workflow names.
          check: Where a null exit fired, is its reasoning stated in the workflow's own terms?
      skeleton: |
        ---
        report: cycle
        feature: <feature-id>
        round: <n>
        ---

        ## Failure narrative

        ## Notes of note
  - op: import-document
    kind: template
    name: architecture-spine
    content:
      template: architecture-spine
      title: Architecture Spine
      form: artifact-format.md
      register: full
      overview: >-
        `spine.md` — the product's topology deep view, one of the two hand-written files in the
        architecture store at `.mochiko/product/architecture/`. It carries the container diagram,
        the element table (containers, boundaries and flows, each with a lifecycle status), the
        sequence diagrams for qualifying flows, and the as-built notes a landing fold writes. The
        concern catalog is its sibling file, `concerns.md`, and the repo-root `ARCHITECTURE.md` is
        a derived view of both — regenerated on every store write, never hand-edited. Authored
        per mochiko:authoring-architecture-store; diagram craft and altitude per
        mochiko:patterns-system-design.
      conformance:
        extra_headings: deny
      sections:
        - name: Header
          required: true
          contract: >-
            Title "# Architecture Spine" plus the scope line naming the product shape the spine
            describes. Governs no heading of its own.
          check: Is the title present with a scope line?
        - name: Container diagram
          heading: Container diagram
          required: true
          max_lines: 30
          contract: >-
            One C4-container view as a mermaid block: the containers and how they communicate,
            with in-flight-class elements marked. One diagram, not a gallery — a second view
            earns its place only where the first cannot carry it.
          check: Is there exactly one container view, with in-flight elements marked?
        - name: Elements
          heading: Elements
          required: true
          max_lines: 40
          contract: >-
            The element table, one row per element: `SPN-XXX` id · kind (container | boundary |
            flow) · name · one-line responsibility · what it talks to and in which style ·
            lifecycle status. One line per element; a row that needs a paragraph is hiding a
            concern row or a graduated file.
          check: Is every element one row with an id, a kind, a responsibility and a status?
        - name: Key flows
          heading: Key flows
          required: true
          max_lines: 30
          contract: >-
            Sequence diagrams for the flows that qualify — selection and altitude per
            mochiko:patterns-system-design. A flow that reads off the container diagram does not
            qualify.
          check: Does each diagram earn its place, or does the container view already say it?
        - name: As-built notes
          heading: As-built notes
          required: false
          max_lines: 15
          contract: >-
            What the landing fold recorded about the built state where it differs from the
            approved shape — one line per element, id-keyed. Drift itself lives on the element's
            row; this section is the fold's own note.
          check: Is each note one line, keyed to an element id?
      skeleton: |
        # Architecture Spine

        **Scope**: backend-service

        ## Container diagram

        ```mermaid
        flowchart TD
            [containers and their communication; in-flight-class elements marked]
        ```

        ## Elements

        | ID | Kind | Name | Responsibility | Talks to (style) | Status |
        |----|------|------|----------------|------------------|--------|
        | SPN-001 | container | [name] | [one line] | SPN-002 (sync REST) | built |
        | SPN-002 | container | [name] | [one line] | SPN-003 (queue) | in-flight (FEAT-012) |
        | SPN-003 | boundary | [name] | [what changes across it — trust, ownership, tenancy] | — | ruled |

        ## Key flows

        [Sequence diagrams for qualifying flows — selection and altitude per mochiko:patterns-system-design.]

        ## As-built notes

        - SPN-002 — [what the fold found built, one line]
  - op: import-document
    kind: template
    name: architecture-concerns
    content:
      template: architecture-concerns
      title: Concern Ledger
      form: artifact-format.md
      register: full
      overview: >-
        `concerns.md` — the architecture store's concern catalog, one `##` entry per `AX-XXX`
        row. The row set is the product's, so this kind declares no heading grammar and takes no
        size bound: a ledger's length is the concern count, which the product owns, and a cap
        there would be a verbosity lever over the wrong thing. What is bound is the row's own
        shape — the fields below, compact by default, with depth graduating to
        `concerns/AX-XXX-<slug>.md` only where a row earned its own file. Its sibling file is
        `spine.md`; the repo-root `ARCHITECTURE.md` is a derived view of both. Authored per
        mochiko:authoring-architecture-store.
      sections:
        - name: Header
          required: true
          contract: Title "# Concern Ledger" and nothing else above the first row.
          check: Is the title present?
        - name: Concern rows
          required: true
          contract: >-
            One `## AX-XXX <concern>` entry per row, in id order. Each carries **Stance** (decided
            | not-now | n-a | open) · **Status** (the lifecycle state) · **Ruling** with its
            date where the stance is decided · **Rationale** · **Upgrade trigger** where the
            stance is not-now · **Owned by** where the stance is n-a — handled elsewhere ·
            **Targets** (NFR-XXX, with the measurement point) · **As-built** · **Drift** ·
            **Work** (FEAT/EPIC ids). One line per field; a field with nothing to say is omitted,
            never written as "none" prose — except **Drift**, where `none` is the finding.
          check: Does every row carry a stance, a status and a rationale, one line per field?
        - name: Graduated rows
          required: false
          contract: >-
            A row that earned its own file keeps its summary here and links to
            `concerns/AX-XXX-<slug>.md`. The graduated file holds the depth the row could not —
            never a copy of the row.
          check: Does each graduated row keep a summary and a link, with no duplicated depth?
      skeleton: |
        # Concern Ledger

        ## AX-001 Tenancy

        - **Stance**: decided
        - **Status**: built
        - **Ruling**: pooled multi-tenant, `tenant_id` row-level scoping (ruled [DATE])
        - **Rationale**: [why this, and what it costs]
        - **Upgrade trigger**: first enterprise deal requiring silo OR >[N] tenants
        - **Targets**: NFR-014 (from SC-007) — tenant-scoped read p95 < 200ms, at the gateway histogram
        - **As-built**: pooled; `tenant_id` on 14 tables
        - **Drift**: none
        - **Work**: FEAT-012, EPIC-004

        ## AX-002 SSO

        - **Stance**: not-now
        - **Status**: ruled
        - **Rationale**: [real concern, consciously deferred — why now is not the time]
        - **Upgrade trigger**: first prospect whose security review demands SAML
  - op: replace-document
    kind: template
    name: spec
    content:
      template: spec
      title: Feature Specification
      form: artifact-format.md
      register: full
      overview: |
        The feature specification deliverable (spec.md). Dense by construction, human-legible.
        Follows the deliverable envelope (artifact-format.md). Omit empty sections. Section density
        norms: Overview <= 3 lines; stories per authoring-user-stories (scenarios one line each, 2-3
        per story); FR/SC/edge-case entries one line each; entities conceptual and compact.
      sections:
        - name: Intent
          required: true
          density: one line per ruling
          contract: |
            The confirmed one-screen synthesis from the intent stage — elicited rulings, one line
            each, confirmed by the user before authoring began. Governs the authoring depth, the
            feature derivation, and the stress-test rigor. Omit a line only if the probe was
            genuinely not applicable. Lines: Scope boundary; Delivery (whole vs subset now, first
            shippable value, sequencing constraints); Depth / rigor; UX-bearing (yes -> Screens &
            Flows + prototype obligated; no -> the waiver line); Constraints; Out of scope.
          check: >-
            Is the Intent present with its six ruling lines (scope boundary, delivery,
            depth/rigor, UX-bearing, constraints, out of scope), each confirmed with the user, or
            a per-line not-applicable note?
          heading: Intent
          max_lines: 10
        - name: Overview
          required: true
          density: <= 3 lines
          contract: |
            A compact synthesis of what the feature is. No more than three lines.
          check: Is the Overview present and <= 3 lines?
          heading: Overview
          max_lines: 6
        - name: User Stories
          required: true
          contract: |
            An INDEX only. Story content lives in per-story files: stories/US-*.md — each carries the
            story text, its acceptance scenarios, and its FEAT-ID mapping. The only story-native
            status is `rejected` (the derivation filter's verdict, with the why, recorded in the story
            file); every other status is derived by following the story's FEAT-ID to the feature map.
            One row per story. Columns: ID (linked to stories/US-N.md), Story (one breath), Priority
            (P1/P2/P3), Feature (FEAT-XXX or —), Disposition (homed | rejected — why).
          check: >-
            Is the User Stories section an index (one linked row per story, no inline story
            bodies), with each row carrying priority, FEAT-ID (or —), and disposition, and every
            rejected row a one-line why?
          heading: User Stories
        - name: Edge Cases
          required: true
          density: one line each
          contract: |
            The boundary and failure conditions the feature must handle — one line each.
          check: Are edge cases enumerated, one line each?
          heading: Edge Cases
        - name: Functional Requirements
          required: true
          density: one line each
          contract: |
            Technology-agnostic functional requirements (FR-XXX), one line each, per
            authoring-requirements. RFC 2119 language.
          check: >-
            Are functional requirements present in FR-XXX form, one line each,
            technology-agnostic?
          heading: Functional Requirements
        - name: Key Entities
          required: true
          contract: |
            The feature's domain nouns — conceptual and compact, not an OpenAPI schema.
          check: Are key entities listed conceptually and compactly?
          heading: Key Entities
          max_lines: 15
        - name: Success Criteria
          required: true
          density: one line each
          contract: |
            Measurable success criteria (SC-XXX), one line each, per authoring-requirements.
          check: Are success criteria present in SC-XXX form and measurable?
          heading: Success Criteria
        - name: Screens & Flows
          required: true
          contract: |
            Authored per mochiko:authoring-prototype from the Intent section's UX-bearing ruling. Not
            UX-bearing -> the single line "No UX surface — prototype waived at intent." and nothing
            else. UX-bearing -> both tables + the prototype pointer, in full. The manifest is binding
            (screens, data, actions); the prototype's pixels are advisory. Feature column lands at
            derivation as a re-tag pass (FEAT-XXX per row); screens of unselected features greyed
            coming-soon; a filter-rejected story's screens kept, greyed, marked rejected.
          good: |
            UX-bearing form:

            | ID | Screen | Purpose | Data shown | Feature |
            |----|--------|---------|------------|---------|
            | SCR-001 | [name] | [one line] | [fields/collections rendered] | FEAT-001 |

            | ID | Flow | Steps | Story scenario | Feature |
            |----|------|-------|----------------|---------|
            | FLOW-001 | [name] | SCR-001 -> [action] -> SCR-002 | US-1 / [scenario] | FEAT-001 |

            **Prototype:** `prototype/` — clickable low-fi rendering of this manifest; serve with bun
            or open `prototype/index.html` directly. Flows and data are binding; layout and styling
            advisory.
          check: >-
            If the spec is UX-bearing, are both the SCR-XXX and FLOW-XXX tables present with a
            Feature column and the prototype pointer? If not UX-bearing, is the single waiver line
            present and nothing else?
          heading: Screens & Flows
          max_lines: 30
        - name: Feature Selection
          required: true
          contract: |
            Authored per mochiko:authoring-feature-map after stories are drafted. Derivation output
            (proposed entries, deltas, index-line drafts) stages in this spec workspace; the live map
            is written only at spec acceptance, as one atomic batch. The selection itself is the
            user's ruling — the derived table and filter verdicts are the producer's, the Selected
            line records the user's choice. Three sub-parts: Derived features (table: FEAT-ID,
            Feature, New/delta, Stories, SCs verified); Filter rejections (one line per rejected story
            — the why verbatim from its story file; omit when none); Selection (Selected build-now in
            dependency order; Deferred proposed entries carrying their SCs + seam obligations;
            Deferred SCs — the ones covered only by unselected features, shown at the moment of
            choice, never discovered at close).
          check: >-
            Does Feature Selection carry the derived-features table, the filter rejections (or
            none), and a Selection recording the user's ruling with deferred features and deferred
            SCs surfaced?
          heading: Feature Selection
          max_lines: 20
        - name: Assumptions
          required: false
          contract: |
            Assumptions the specification rests on. Omit if empty.
          check: Are material assumptions recorded (or the section omitted when none)?
          heading: Assumptions
          max_lines: 10
        - name: Open Questions
          required: false
          contract: |
            Unresolved questions carried out of authoring. Omit if empty.
          check: Are open questions recorded (or the section omitted when none)?
          heading: Open Questions
          max_lines: 10
      skeleton: |
        # {{spec_title}}

        > Spec: {{spec_id}}
        > Created: {{created}}
        > Status: {{status}}

        ---

        ## Intent

        - **Scope boundary:** {{intent_scope}}
        - **Delivery:** {{intent_delivery}}
        - **Depth / rigor:** {{intent_depth}}
        - **UX-bearing:** {{intent_ux_bearing}}
        - **Constraints:** {{intent_constraints}}
        - **Out of scope:** {{intent_out_of_scope}}

        ---

        ## Overview

        {{overview}}

        ---

        ## User Stories

        | ID | Story (one breath) | Priority | Feature | Disposition |
