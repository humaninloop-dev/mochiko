grammar: 1
id: 0081-sufficiency-user-added
sequence: 81
intent: >-
  Give the sufficiency seat the re-grade of a design piece the user adds at implement's design
  stage (implement-brainstorm-led D6 as changed at review S1): mint user-added-regrade — the
  piece, inside a story the spec already carries, graded on the clause set before it joins and
  entered in the report marked user-added, the seat the report's one writer, the brief carrying
  the piece so the read fence holds; new behaviour is never a gap. No floor retired or lowered.
anchor: 2026-10-11 implement-brainstorm-led
hash: sha256:3fd38bccb4a5647cca8efa8ebd4e5e246ab4041533f0d5e76f7b27c73c11138f
changes:
  - op: mint-rule
    schema: skill/review-sufficiency
    section: review-sufficiency.sec.scope
    rule:
      id: review-sufficiency.user-added-regrade
      labels: [boundary, fence]
      class: must
      kind: duty
      text: >-
        A design piece the user adds to the run at implement's design stage, inside a story the
        spec already carries, is graded before it joins: the brief names the piece in the user's
        words and the story it sits in — the run's `design-stage.md` stays unread, inside the
        fence — and you grade it on the clause set like any unit, entering each gap it opens in
        `sufficiency-report.md` marked user-added, or saying there that every clause holds; you
        stay the report's one writer. A piece that needs behaviour the spec carries no story or
        acceptance criteria for is new behaviour, never a gap: it goes back to the lead.
      anchor: 2026-10-11 implement-brainstorm-led D6
