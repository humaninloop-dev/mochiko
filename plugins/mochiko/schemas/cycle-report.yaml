# Schema data file for the cycle report artifact template.
# The implementer's truthful self-disclosure of one cycle execution (and each rework), written as
# cycle-report.md.
# Source of truth for `mochiko-cli template cycle-report` (producer view) and `--check` (checklist view).
# Read this file raw when the binary is absent (D8 degraded path is first-class).
template: cycle-report
title: Cycle Report
form: report-format.md
register: ultra   # reports write ultra (report-format.md rule 8); the Failure narrative writes full (below)
overview: |
  The implementer produces a cycle-report.md after each cycle execution (and after each rework). A
  truthful self-disclosure of what happened — NOT a verdict on whether the result passes: the lead
  owns that verdict and the verifier grades independently. Follows the report envelope
  (report-format.md): machine-first, this schema carries only the cycle payload. Consumers: the
  lead's checkpoint verdict (the frontmatter) · the verification seat's code-minimalism lens
  (mochiko:review-code-minimalism reads the disclosed decomposition and its rung claims alongside the
  cycle's diff) · and, on failure, the debugging trail (the failure narrative). Conditional prose: a
  clean passing cycle is frontmatter-only; this report's sanctioned prose set is EXACTLY the two
  sections below (Notes of note, Failure narrative) — a third H2 is a defect, and prose on a clean
  report (`status: pass` with any body section beyond those two) is itself a defect that fails the
  clearing conditions and returns to the lead.

sections:
  - name: Identity
    required: true
    contract: |
      The run's identity and self-reported outcome. `cycle:` is the cycle number from tasks.md
      (integer) or `"fix"` for a fix pass. `attempt:` is 1 for the first attempt and increments on
      retry. `status:` is the execution-outcome self-report — `pass` (all tasks done, tests green) /
      `fail` (tasks failing) / `blocked` (could not proceed) — NOT the checkpoint verdict (the lead
      forms that independently). `report`/`feature`/`slice` follow report-format.md (`slice:` only
      when slice-scoped).
    check: "Do the identity fields carry `cycle:` (integer or \"fix\"), `attempt:` (1-based), and `status:` (pass/fail/blocked — a self-report, not the checkpoint verdict)?"

  - name: Decomposition
    required: true
    contract: |
      The build-time task breakdown of the card — this run's, disclosed. `decomposition:` is one
      `{id, task, path, rung}` entry per task, IDs local to this report (`T{cycle}.{n}`). `rung` is
      the pre-code ladder choice per mochiko:patterns-code-minimalism (1–7); a rung-1 skip is a
      decomposition entry with no path, its why one line in `task:`. This is the disclosure surface
      for the decomposition (the card in tasks.md stays undecomposed); rework and failure reports cite
      these IDs, and the verification seat grades the rung claims. `tasks_total:` / `tasks_completed:`
      are the counts. `failed_tasks:` is `[]` if none, else `{id, why}` (one line) per failed/
      incomplete task.
    check: "Is the decomposition disclosed as `{id, task, path, rung}` entries (rung 1–7) with `tasks_total`/`tasks_completed` counts and `failed_tasks` (`[]` or `{id, why}` each)?"
    good: |
      Passing cycle (complete report):

      ```markdown
      ---
      report: cycle
      feature: user-auth
      cycle: 3
      attempt: 1
      status: pass
      decomposition:
        - {id: T3.1, task: "failing E2E test for profile update", path: src/routes/api.test.ts, rung: 7}
        - {id: T3.2, task: "profile update route handler", path: src/routes/api.ts, rung: 7}
        - {id: T3.3, task: "wire route into router", path: src/routes/api.ts, rung: 6}
        - {id: T3.4, task: "[EXTEND] lastLogin field on User", path: src/models/user.ts, rung: 2}
      tasks_total: 4
      tasks_completed: 4
      failed_tasks: []
      files_created:
        - src/routes/api.ts
        - src/routes/api.test.ts
      files_modified:
        - src/models/user.ts
      brownfield_tasks: 1
      domain_deps_added: []
      deviations:
        - "T3.4: followed existing Sequelize patterns for the [EXTEND] on User"
      checkpoint_criteria_met: true
      ---
      ```

  - name: File & dependency changes
    required: true
    contract: |
      `files_created:` / `files_modified:` are the paths of new and modified files (empty list if
      none). `brownfield_tasks:` is the count of decomposition tasks classified extend/modify (per the
      card's brownfield exposure). `domain_deps_added:` is the domain-layer dependency registry
      additions made this cycle (package names; `[]` if none) — the visibility floor for registry
      growth: additions are disclosed here and surfaced at the checkpoint, and a non-empty list ALWAYS
      forces a human checkpoint, never auto-approved.
    check: "Are `files_created`/`files_modified`, the `brownfield_tasks` count, and `domain_deps_added` (`[]` or package names — a non-empty list forces a human checkpoint) all disclosed?"

  - name: Deviations & self-assessment
    required: true
    contract: |
      `deviations:` are departures from the task descriptions, one line each citing the task ID (e.g.
      `"T3.4: argon2 over bcrypt (C-012 allows)"`); `[]` if none. `checkpoint_criteria_met:` is the
      implementer's assessment of whether the cycle's checkpoint criteria are satisfied — a
      self-report, NOT the verdict; the lead verifies independently and decides.
    check: "Are `deviations` (`[]` or ID-cited one-liners) and `checkpoint_criteria_met` (a self-report, not the verdict) present?"

  - name: Notes of note
    required: false
    contract: |
      The producer-authored uncertainty carrier (one of the two sanctioned prose blocks). Present ONLY
      when non-empty: non-obvious decisions (pattern choices where multiple valid approaches existed,
      technology choices within a task's scope — one line each, ID-cited), genuine difficulties, and
      flagged blockers the lead should weigh at the checkpoint. Not a narration of what the tasks
      already describe; cite IDs, never restate task text. Register `ultra`.
    check: "Is `## Notes of note` present only for non-obvious decisions, difficulties, or flagged blockers (one line each, ID-cited — omitted on a clean cycle)?"

  - name: Failure narrative
    required: false
    contract: |
      Mandatory when `status` is `fail` or `blocked`, or a task failed in execution (one of the two
      sanctioned prose blocks). Debug value concentrates here — full detail: what failed (per failed
      task), why (the failing test/output evidence), what was tried, and the state things were left in.
      A failed cycle keeps this fuller narrative; the passing-cycle format is frontmatter-only.
      Register `full` (a lead scopes a retry from it). A task you were never meant to run is NOT an
      execution failure: a verifier-owned `**TEST:**` gate the producer must not execute belongs in
      `failed_tasks:` with a one-line reason and triggers no narrative — a cycle whose only incomplete
      task is one of those, everything else green, is a clean passing cycle and stays frontmatter-only.
    check: "When `status` is fail/blocked (or a task failed in execution), is `## Failure narrative` present with what failed / why / what was tried / the state left in — and absent when the only incomplete task is a verifier-owned `**TEST:**` gate?"
    good: |
      Failed attempt:

      ```markdown
      ---
      report: cycle
      feature: user-auth
      cycle: 4
      attempt: 2
      status: fail
      decomposition:
        - {id: T4.1, task: "failing test for token refresh", path: src/middleware/auth.refresh.test.ts, rung: 7}
        - {id: T4.2, task: "refresh contract test", path: src/middleware/auth.contract.test.ts, rung: 7}
        - {id: T4.3, task: "refresh handling in auth middleware", path: src/middleware/auth.ts, rung: 2}
      tasks_total: 3
      tasks_completed: 2
      failed_tasks:
        - {id: T4.3, why: "auth middleware test red — token refresh race"}
      files_created: []
      files_modified:
        - src/middleware/auth.ts
      brownfield_tasks: 0
      domain_deps_added: []
      deviations: []
      checkpoint_criteria_met: false
      ---

      ## Failure narrative

      T4.3's refresh test (`auth.refresh.test.ts:41`) fails intermittently: the refresh handler
      reads `user.lastLogin` before C3's write commits. Tried serializing on the session row
      (still races under the test's parallel logins) and moving the read behind the commit hook
      (breaks the T4.2 contract test). The middleware currently guards with a retry, which the
      test's timing still beats about 1 run in 5. Left red; needs a decision between a
      transaction boundary change (touches C3 code) and relaxing the timing assertion.
      ```

skeleton: |
  ---
  report: cycle
  feature: user-auth
  cycle: 3                    # Cycle number (integer) or "fix" for fix passes
  attempt: 1                  # Attempt number within this cycle (1 = first attempt)
  status: pass | fail | blocked   # Execution outcome self-report (not the checkpoint verdict)
  decomposition:              # The build-time task breakdown of the card (this run's, disclosed)
    - {id: T3.1, task: "failing test for POST /api/session", path: src/routes/session.test.ts, rung: 7}
    - {id: T3.2, task: "session route handler", path: src/routes/session.ts, rung: 7}
  tasks_total: 4              # Total tasks in the decomposition above
  tasks_completed: 4          # Decomposition tasks completed
  failed_tasks: []            # Task IDs not completed / failing, with a one-line reason each
  files_created:              # New files created during this cycle
    - src/routes/api.ts
    - src/routes/api.test.ts
  files_modified:             # Existing files modified during this cycle
    - src/models/user.ts
  brownfield_tasks: 1         # Count of decomposition tasks classified extend/modify
  domain_deps_added: []       # Domain-layer registry additions this cycle (package names; [] if none)
  deviations: []              # One-line, ID-cited departures from the task descriptions ([] if none)
  checkpoint_criteria_met: true  # The implementer's self-assessment (the lead verifies independently)
  ---

  ## Notes of note   <!-- only when non-empty: non-obvious decisions, difficulties, flagged blockers -->

  ## Failure narrative   <!-- mandatory when status is fail/blocked, or a task failed in execution -->
