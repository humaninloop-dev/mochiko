# Schema data file for the `layer-rules` constitution module (layered-architecture only).
# DOCTRINE-DENSE governance module: every operative line preserved verbatim; sections are
# FRAGMENT-LINE-DRIVEN — one producer section per Validator-checklist-fragment line, 1:1
# (section count = fragment-line count). The `--check` view serves validation-constitution
# (checked only when this module is attached).
# Source of truth for `mochiko-cli template layer-rules` and `--check`. Read raw when the binary is absent (D8).
template: layer-rules
title: Layer Rules — constitution module (layered architecture)
form: artifact-format.md
register: full   # governance document — full register (documents: full)
overview: |
  MODULE: layer-rules
  ===================
  Attach when: the synthesis kept a layered-architecture card (e.g. BE-HEX) OR minted a
  layered-architecture intent — the module ruling is recorded in the synthesis either way (the
  interrogation's layered-architecture beat). Never attach for projects that ruled it out: these
  sections are exactly the layer flavor the core template no longer carries.
  Trace: the GI module-selection element that names `layer-rules`.

sections:
  - name: Project Structure
    required: true
    contract: |
      The expected folder organization, matching the kept architecture card's layer structure and
      the project's actual conventions (brownfield: from codebase-analysis.md). Fill with real
      directory names — no `[LAYER_N]` placeholders in the authored output:

      ````markdown
      ## Project Structure

      <!--
      INSTRUCTION: The expected folder organization, matching the kept architecture card's layer
      structure and the project's actual conventions (brownfield: from codebase-analysis.md).
      -->

      ```
      [PROJECT_ROOT]/
      ├── [SOURCE_DIR]/
      │   ├── [LAYER_1]/        # [Purpose]
      │   ├── [LAYER_2]/        # [Purpose]
      │   └── [LAYER_3]/        # [Purpose]
      ├── [TEST_DIR]/
      │   ├── unit/             # Unit tests
      │   └── integration/      # Integration tests
      └── [CONFIG_FILES]
      ```
      ````
    check: "Project Structure tree present with real directory names (no [LAYER_N] placeholders)"

  - name: Layer Import Rules
    required: true
    contract: |
      The layer import-rules table — every layer with its MAY Import and MUST NOT Import columns
      filled. Fill:

      ```markdown
      ### Layer Import Rules

      | Layer | MAY Import | MUST NOT Import |
      |-------|------------|-----------------|
      | [LAYER_1] | [Allowed layers] | [Prohibited layers] |
      | [LAYER_2] | [Allowed layers] | [Prohibited layers] |
      | [LAYER_3] | [Allowed layers] | [Prohibited layers] |
      ```
    check: "Layer Import Rules table present; every layer has MAY and MUST NOT columns filled"

  - name: Import-rule architecture consistency
    required: true
    contract: |
      The Layer Import Rules (see Layer Import Rules) MUST be consistent with the kept — or minted —
      architecture ruling's layer structure. The import table is not free-standing; it encodes the
      same layering the architecture card fixed.
    check: "Import rules consistent with the kept (or minted) architecture ruling's layer structure"

  - name: Layer-rule enforcement tooling
    required: true
    contract: |
      Enforcement for the layer rules MUST name a real tool — an import linter or a CI rule — not
      "code review" alone; this is production-strength enforcement. The mechanism is recorded in the
      governance ledger's Three-Part metadata for the layer-rules principle.
    check: "Enforcement for layer rules names a real tool (import linter / CI rule), not \"code review\" alone — production-strength enforcement"

  - name: Rules-file path coverage
    required: true
    contract: |
      Every `.claude/rules/mochiko/` file whose concern a layer can violate — per the Import Rules
      table, including a layer that orchestrates the governed operation through ports/interfaces,
      not only the layer that implements it — MUST include that layer in its `paths` globs.
    check: "Every rules file whose concern a layer can violate (per the Import Rules table — including orchestration through ports) includes that layer in its `paths`"

  - name: Domain-Dependency Registry
    required: true
    contract: |
      The domain-dependency registry — a policy preamble above a single preserved registry block.
      Fill:

      ```markdown
      ### Domain-Dependency Registry

      The domain layer MAY import libraries listed in the registry block below — seeded at setup
      (session-arbitrated), grown at implement time under the human-gated add-process. Craft and
      policy single source: `authoring-constitution/references/DOMAIN-DEPENDENCIES.md`.

      The authored domain-layer rules file carries **two parts with different ownership**:

      - **Policy preamble** (setup-owned, regenerated): the qualification criteria, the add-process,
        and the add gate — regenerated from the governance ledger's Domain-dependency policy section.
      - **Registry block** (living, preserved): the list itself, between
        `<!-- mochiko:domain-registry:begin -->` and `<!-- mochiko:domain-registry:end -->` markers —
        **preserved verbatim across setup/amend regenerations** (implement-time additions live here;
        the one carve-out from rules-files-regenerated-whole). Row schema:

        | Dependency | Justification | Signal level | Added (by/when) | Gate |
        |------------|---------------|--------------|-----------------|------|
      ```
    check: "Domain-layer rules file carries exactly one `mochiko:domain-registry` begin/end marker pair, with the policy preamble above it"

  - name: Registry row metadata
    required: true
    contract: |
      Every registry row MUST carry justification, signal level, provenance (`Added (by/when)`), and
      gate fields — no blank metadata. The row schema is in Domain-Dependency Registry.
    check: "Every registry row carries justification, signal level, provenance, and gate fields (no blank metadata)"

  - name: Registry seed matches synthesis rulings
    required: true
    contract: |
      At ratification, the registry rows MUST match the synthesis's Domain-dependency seed rulings.
      Rows added later at implement time carry their add-gate provenance instead (not a synthesis
      seed).
    check: "At ratification, registry rows match the synthesis's Domain-dependency seed rulings (implement-time rows added later carry their add-gate provenance instead)"

  - name: CLAUDE.md sync-table row
    required: true
    contract: |
      The CLAUDE.md sync table MUST carry a row for this module's content, so the module's presence
      is visible in the governance region's module inventory.
    check: "CLAUDE.md sync table carries a row for this module's content"

skeleton: |
  layer-rules is the layered-architecture constitution module: `## Project Structure`, `### Layer
  Import Rules`, and `### Domain-Dependency Registry`. Attach only when the synthesis kept or minted
  a layered architecture. Author it from that ruling and the project's conventions:
    1. Fill the Project Structure tree with real directory names — no `[LAYER_N]` placeholders
       (Project Structure).
    2. Fill the Layer Import Rules table — every layer with MAY and MUST NOT columns (Layer Import
       Rules) — consistent with the architecture ruling (Import-rule architecture consistency),
       enforced by a real import linter / CI rule (Layer-rule enforcement tooling), with every rules
       file whose concern a layer can violate covering that layer in `paths` (Rules-file path
       coverage).
    3. Author the Domain-Dependency Registry: policy preamble above one `mochiko:domain-registry`
       marker pair (Domain-Dependency Registry), every row carrying full metadata (Registry row
       metadata), seed rows matching the synthesis (Registry seed matches synthesis rulings), and a
       CLAUDE.md sync-table row for the module (CLAUDE.md sync-table row).
  The fillable markdown for each authored surface is the fenced block inside its section's contract.
