# Command content schema for /mochiko:implement. The command .md instructs a raw, full Read of
# this file at command fire; the model interprets it live — the .md Rules block carries the
# reading grammar. Two semantics live only here:
#   class   floor = non-waivable · must = binding obligation · advisory = guidance, not binding.
#   conditions:  each dimension declares its resolution point (entry-derived · surface-presence ·
#           moment-resolved(<moment>) · user-ruled · standing-trigger); a moment-resolved
#           dimension is unresolved until its named moment — rules gated on it are inapplicable
#           until then.
kind: command
command: implement

vars:
  attempt_bound_cycle: "3"        # per-cycle verification attempts; redeclarable only at run-open
  gap_rework_bound: "2"           # gap-rework rounds per run; redeclarable only at run-open
  builder_seat: staff-engineer
  design_seat: technical-analyst
  architect_seat: principal-architect
  qa_seat: qa-engineer
  gap_finder_seat: devils-advocate
  explore_model: haiku
  features_dir: .mochiko/features
  product_dir: .mochiko/product
  epics_dir: .mochiko/epics
  rules_dir: .claude/rules/mochiko
  tasks_schema: plugins/mochiko/schemas/tasks.yaml

conditions:
  scope:
    values: [selection, delta, epic, lane]
    resolution: entry-derived
    note: the batch's scope type, fixed at the run-open confirmation.
  depth:
    values: [low, high]
    resolution: entry-derived
    note: the governance depth level, read from the governance region at entry.
  km_file:
    values: presence
    resolution: surface-presence
    note: .mochiko/memory/knowledge-management.md.
  governance_region:
    values: presence
    resolution: surface-presence
    note: the marked governance region in CLAUDE.md.
  baseline:
    values: presence
    resolution: surface-presence
    note: the product baseline a design gap targets; checked at the entry sufficiency check.
  seats:
    values: [single, multi]
    resolution: standing-trigger
    note: fires the moment the run composes more than one seat, and re-fires on a seat added mid-run.

moments:
  run-open: The confirmation that closes entry — batch, scope type, attempt bounds, done condition.
  entry: The gating and the sufficiency check, before the run-open confirmation.
  design-checkpoint: The user's sign-off on the design phase's output and the store delta.
  card-confirm: The user's ruling on the cycle slicing, before any card is built.
  cycle-checkpoint: The per-cycle grading point where escalations and findings land as one batch.
  final-validation: The whole-build verification pass — regression sweep, cold verification, gap finding.
  landing: The acceptance-time execution of folds, graduations, and the store landing.
  acceptance: The user's accept / amend / reject that closes the run.

sections:
  - id: impl.sec.roles
    title: Roles & Responsibilities — seat wiring
    intent: >-
      Seat staffing, independence, and authorship separation across the run's seats.
    rules:

      - id: impl.staffing-latitude
        labels: [seats]
        class: must
        kind: latitude
        text: >-
          Beyond this schema's `class: floor` rules, everything is your per-run judgment:
          how you staff, sequence, and run the cycles; teammates or subagents per seat is
          your call.

      - id: impl.dm-entry-gate
        labels: [scope-entry]
        class: must
        kind: duty
        text: >-
          Gate entry honestly: the run gates on a capability entry with selected work rows
          carrying ratified scope, and opens with its contract stated at the run-open
          confirmation.

      - id: impl.design-phase-fires-on-gap
        labels: [scope-entry]
        class: must
        kind: duty
        text: >-
          Fire the design phase on any gap the sufficiency check names — before any code is
          written.

      - id: impl.dm-surface-rounds
        labels: [reporting, attempt-economy]
        class: must
        kind: duty
        text: >-
          Surface rounds consumed and seats spawned at each checkpoint.

      - id: impl.dm-landing-whole
        labels: [landing]
        class: must
        kind: duty
        text: >-
          Execute the acceptance landing whole at user acceptance.

      - id: impl.dm-close-verdict
        labels: [reporting, landing]
        class: must
        kind: duty
        text: >-
          Close the run with a verdict against the done condition.

      - id: impl.seat-sufficiency-independence
        labels: [independence, seats]
        class: must
        text: >-
          The sufficiency seat authored none of the spec, store, or baselines it grades, and
          will not design or build this batch. Exempt from plan approval, like every grading
          seat.

      - id: impl.design-seats-staffing
        labels: [seats]
        class: advisory
        kind: latitude
        text: >-
          Design-seat staffing is your call: typically ${design_seat} for design deltas,
          ${architect_seat} for a store delta, ${qa_seat} for the **TEST:** cases.

      - id: impl.design-gaps-only
        labels: [independence, scope-entry]
        class: must
        text: >-
          Design seats author exactly the named gaps, nothing more, each on a plan you
          approved — rung-justified per the pointer skill.
        pointer: "mochiko:patterns-plan-minimalism"

      - id: impl.builder-never-designs
        labels: [independence, seats]
        class: must
        text: >-
          ${builder_seat} stays the builder and never designs its own gaps.

      - id: impl.seat-card-author-independence
        labels: [independence, seats]
        class: must
        text: >-
          The card-authoring seat is a design-class seat, never the builder who will execute
          the cards; ${qa_seat} authors the **TEST:** cases within its slicing.

      - id: impl.builder-decompose-disclose
        labels: [seats, evidence]
        class: must
        text: >-
          Builders decompose each card into concrete tasks at build time, disclosed in the
          cycle report, and build test-first — on a plan you approved.

      - id: impl.seat-verification-independence
        labels: [independence, seats]
        class: must
        text: >-
          Verification seats are never the implementer. They execute against real
          infrastructure and read the code and its evidence: per-cycle grading, the final
          validation, the code-minimalism lens.

      - id: impl.verification-design-time-grades
        labels: [independence, seats]
        class: must
        text: >-
          The same verification-seat independence covers this run's design-time grades: the
          cycle-card review before the card confirm (its grade covering buildability) and the
          judgment content of any build-time baseline-delta.md entry.

      - id: impl.landing-verifier-folds
        labels: [independence, landing]
        class: must
        text: >-
          The landing verification seat checks the graded folds; a lane run adds the
          map-delta boundary check — the accepted work made no map write beyond the marked
          delta.

      - id: impl.seat-gap-finder-blind
        labels: [independence, seats]
        class: must
        text: >-
          The gap-finding seat is a fresh ${gap_finder_seat}, dispatched blind: never a seat
          that built these cycles or saw this feature's design-time test cases.

  - id: impl.sec.reserved
    title: Reserved to the user — never the run's
    intent: >-
      Decisions held by the user: gates, rulings, and escalations no seat may take.
    rules:

      - id: impl.gate-design-checkpoint
        labels: [user-gate, landing]
        class: floor
        kind: gate
        text: >-
          The design checkpoint is the user's. Where the check named gaps, no code is written
          before the user signs the design and the store delta — the store delta signed on a
          rendered diagram plus its named AX-XXX row changes (no render surface: present the
          source plus the changed-element table, and record it). The user may stop at the
          checkpoint and resume the build later.

      - id: impl.gate-card-confirm
        labels: [user-gate]
        class: floor
        kind: gate
        text: >-
          The card confirm is the user's: a blocking checkpoint where the user rules the
          slicing before build.

      - id: impl.gate-final-acceptance
        labels: [user-gate]
        class: floor
        kind: gate
        text: >-
          Final acceptance is the user's: accept / amend / reject closes the run.

      - id: impl.user-runopen-rulings
        labels: [user-gate, scope-entry]
        class: must
        kind: reservation
        text: >-
          Reserved to the user at run-open: each store trip (ruled there, or deferred on the
          record) · each in-flight conflict · any sufficiency clause the grader could not
          clear.

      - id: impl.infeasible-card-escalation
        labels: [user-gate]
        class: must
        kind: routing
        text: >-
          An infeasible card is escalated to the user as a business-level scope decision.

      - id: impl.adopt-first-user-call
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          Two calls are never the builder's: a commodity-category adopt-first ruling and an
          IP-XXX provisioning call each halt the cycle to the user's checkpoint.
        pointer: "mochiko:patterns-adopt-first"

      - id: impl.ambiguity-escalation
        labels: [user-gate]
        class: must
        kind: routing
        text: >-
          Requirement ambiguity, or a judgment call a producer flags, goes to the user —
          investigable gaps excepted.

      - id: impl.scope-escalation-fail
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          Scope escalation is the user's: work bigger than the run was framed stays FAIL
          unless the user accepts it.

  - id: impl.sec.tools
    title: Tools bindings
    intent: >-
      Paths, schemas, skills, and templates the run binds to.
    rules:

      - id: impl.tools-referenced-never-restated
        extends: common.tools-referenced-never-restated
        class: must

      - id: impl.sufficiency-binding-verdict
        labels: [scope-entry]
        class: must
        kind: gate
        text: >-
          The sufficiency check runs at entry — per row, per card under delta scope. The
          verdict is binding: per row, sufficient or a gap list; gaps fire the design phase
          over exactly those gaps and nothing else. The pointer skill owns the clause set,
          the gap forms, the absent-baseline branch, and the trip-vs-gap distinction.
        pointer: "mochiko:review-sufficiency"

      - id: impl.sufficiency-disputed-clause
        labels: [user-gate]
        class: must
        kind: routing
        text: >-
          A disputed sufficiency clause defaults to gap and goes to the user — the grader
          never clears alone.

      - id: impl.sufficiency-report
        labels: [evidence, reporting]
        class: must
        kind: binding
        text: >-
          The verdict lands as sufficiency-report.md in the feature dir: the store-consult
          result and any no-delta claim, the trips for the user at run-open, the
          quickstart.md null path where no real external-integration surface exists, and any
          [MODIFY] amendment named against a delivered feature.

      - id: impl.absent-surfaces
        labels: [scope-entry]
        class: must
        kind: routing
        text: >-
          Absent surfaces are surfaced to the user, never auto-resolved, and never fail the
          run: a missing governance region is surfaced. A missing or stale
          .mochiko/memory/codebase-analysis.md on brownfield: offer /mochiko:setup, or
          proceed greenfield with the warning logged. A store with no ruled content: offer
          the /mochiko:architecture bootstrap. The check still runs, grading absent surfaces
          per its absent-baseline branch.

      - id: impl.briefs-name-rules-files
        labels: [scope-entry, seats]
        class: must
        when: {governance_region: present}
        text: >-
          Every code-touching brief names the relevant ${rules_dir}/ files as an obligated
          read.

      - id: impl.design-outputs-home
        labels: [landing]
        class: must
        kind: binding
        text: >-
          Design outputs land at ${features_dir}/FEAT-XXX/ as deltas beside their baselines
          (data-model.md, contracts/; a prose baseline's delta in appliable before/after
          form), plus the store delta where the structural trigger fired — structure and
          scope per mochiko:patterns-system-design, grammar and lifecycle per
          mochiko:authoring-architecture-store.

      - id: impl.design-review-pair
        labels: [independence, floor-pointer]
        class: must
        text: >-
          A non-author seat grades the design-phase output before the design checkpoint —
          mochiko:review-plan-artifacts for conformance to the gap list and card quality
          (blocking), mochiko:review-feasibility for buildability and contradiction.

      - id: impl.design-absent-baseline-seed
        labels: [scope-entry]
        class: must
        when: {baseline: absent}
        text: >-
          The phase's first duty is the seed — an empty scaffold stating so where no code is
          delivered; reconstructed from delivered code, and confirmed with the user at the
          checkpoint, where it exists. The seed is the baseline write; this feature's design
          still lands as deltas, never merged into the seed.

      - id: impl.design-map-assertion
        labels: [landing]
        class: must
        text: >-
          The design phase asserts the design-implied dependencies and sharpened extent onto
          the capability's entry with provenance, and fills the architecture link when a
          store delta exists; status stays as the scope source set it; intended-vs-designed
          drift goes to the checkpoint. Where the check named a [MODIFY] amendment, the phase
          writes that marked delta on the affected delivered feature's entry.
        pointer: "mochiko:authoring-feature-map"

      - id: impl.midrun-refire
        labels: [scope-entry]
        class: must
        kind: routing
        text: >-
          A builder hitting undesigned structure halts that cycle; the design phase re-fires
          scoped to the discovery — same grade, same checkpoint. The deviation gate anchors
          to the signed delta once one exists.

      - id: impl.epic-design-always-fires
        labels: [scope-entry, seats]
        class: must
        when: {scope: [epic]}
        text: >-
          The design phase always fires, for the joint spine at ${epics_dir}/EPIC-XXX/: the
          joint design plan, the joint architecture and seam design, and batch ordering.
          Spine artifacts follow templates/artifact-format.md.
        pointer: "mochiko:authoring-epic"

      - id: impl.epic-seam-owners
        labels: [seats]
        class: must
        when: {scope: [epic]}
        text: >-
          Every cross-member seam owner is named at design time — no later-lander default.

      - id: impl.epic-shared-baseline-single-pen
        labels: [seats, landing]
        class: must
        when: {scope: [epic]}
        text: >-
          A shared-baseline delta is authored once, under a single pen-holder; every
          shared-write surface rides the transport floor.

      - id: impl.cards-template
        labels: [floor-pointer]
        class: must
        kind: binding
        text: >-
          tasks.md holds cycle cards from the tasks template — rendered by
          mochiko-cli template tasks; when the binary is absent, its schema ${tasks_schema}
          Read raw is the first-class source of truth. The pointer skill owns the slicing
          judgment and the **TEST:** grammar.
        pointer: "mochiko:patterns-vertical-tdd"

      - id: impl.card-contents
        labels: [evidence]
        class: must
        kind: binding
        text: >-
          Per card: stories and feature rationale, dependencies, acceptance criteria by ID, a
          **TEST:** real-infrastructure gate, and the cycle's brownfield exposure — no task
          lists, no file paths; the builder decomposes at build time. A UX-bearing card's
          **TEST:** gate names the FLOW-XXX paths it verifies.

      - id: impl.zero-gap-map-assertion
        labels: [landing]
        class: must
        text: >-
          On the zero-gap path the card-authoring seat makes the map-entry assertion the
          design phase would have made, surfacing drift at the confirm.

      - id: impl.card-review-before-confirm
        labels: [independence]
        class: must
        text: >-
          The verification seat reviews the cards before the card confirm — quality per
          mochiko:review-plan-artifacts, buildability its own judgment.

      - id: impl.epic-card-sequence
        labels: [seats]
        class: must
        when: {scope: [epic]}
        text: >-
          The run builds one merged sequential card sequence from the joint design — shared
          foundation cycles first, then in-epic dependency order — with feature-tagged cards
          whose reports land in each member's ${features_dir}/FEAT-XXX/.

      - id: impl.craft-build-bindings
        labels: [floor-pointer]
        class: must
        kind: binding
        text: >-
          Build binds mochiko:executing-tdd-cycle — its cycle-report.md (disclosed
          decomposition, honest difficulties, deviations, domain_deps_added) is the run's
          uncertainty carrier · mochiko:brownfield-integration on touches to existing code ·
          mochiko:patterns-code-minimalism at decomposition, rungs disclosed.

      - id: impl.craft-verify-bindings
        labels: [floor-pointer, evidence]
        class: must
        kind: binding
        text: >-
          Verify binds mochiko:testing-end-user — evidence captured, never assumed — plus the
          per-cycle lens mochiko:review-code-minimalism: the verification seat reads the
          diff, the cycle report, and the codebase around the diff; reuse claims never on
          trust.

      - id: impl.design-inputs
        labels: [scope-entry]
        class: must
        kind: binding
        text: >-
          Design inputs are sufficiency-report.md and the design-phase deltas where they
          exist — including the signed store delta, the anchor for the deviation check and
          the built-vs-signed diff — at ${features_dir}/FEAT-XXX/; the product baselines at
          ${product_dir}/ (data-model.md, contracts/, constraints-and-decisions.md, and the
          architecture store, whose concern rows carry the NFR-XXX targets the built code
          must meet); spec.md for the cards' cited acceptance criteria.

      - id: impl.progress-surface
        labels: [evidence, reporting]
        class: must
        kind: binding
        text: >-
          tasks.md's per-card checkboxes are the progress surface, flipped as cycles
          complete.

      - id: impl.reports-envelope
        labels: [reporting]
        class: must
        kind: binding
        text: >-
          All reports land in ${features_dir}/FEAT-XXX/ (a product-lane run:
          ${product_dir}/lane-<slug>/): the sufficiency report, cycle reports, verification
          reports, the final-validation report, the built-vs-signed diff. Every one follows
          templates/report-format.md (machine-first frontmatter, ultra register, clean =
          frontmatter-only; bounce an envelope-breaking report per its rule 9), and each
          producing seat's brief names the envelope path. Repeat runs append, dated; delta
          files overwrite only via the graded fold.

      - id: impl.gates-full-suite
        labels: [evidence]
        class: must
        text: >-
          Quality gates run the full repository suite.

      - id: impl.regression-sweep
        labels: [evidence, landing]
        class: must
        text: >-
          The final validation additionally runs the accumulated **TEST:** gates of
          previously delivered features in this feature's territory — their durable gate sets
          at ${features_dir}/FEAT-XXX/gates.md plus the cases on their cards — and this
          feature's gates exercise any seam whose earlier side is already delivered (seam
          ownership sits with the later-landing feature, mochiko:authoring-feature-map). An
          epic runs the accumulated gates once, over the union of member territories. A
          failure here fails the run like any other regression.

      - id: impl.cold-verification
        labels: [evidence]
        class: must
        text: >-
          The final validation builds and runs the quality gates from a dependency-cold
          snapshot of the uncommitted working state
          (`git ls-files -co --exclude-standard :!.claude/worktrees` copied to
          `.claude/worktrees/mochiko-<purpose>/`); ensure the `/.claude/worktrees` ignore
          entry exists first. Results are part of the acceptance evidence. One snapshot
          covers a whole epic.

      - id: impl.gap-finding-scope
        labels: [scope-entry, evidence]
        class: must
        text: >-
          The gap-finding pass runs on selection-scope and epic runs only (an epic: once,
          over the union of member territories); a delta-scope or lane run skips it, and its
          final-validation report states the skip — never a silent no-op.

      - id: impl.gap-finding-blind-dispatch
        labels: [independence]
        class: must
        text: >-
          Gap-finding dispatch is two-message and blind. The first message carries only
          spec.md, the sufficiency report and design deltas where they exist, Screens &
          Flows, and the baselines data-model.md, contracts/, and the store's NFR-XXX concern
          rows — never the code, tasks.md, the **TEST:** cases, or any report. The seat
          states its derived expectations; only then does probing begin. Its brief carries
          the model-tiering rule, and its delegated reads stay inside the same fence.
        pointer: "mochiko:testing-gap-finding"

      - id: impl.mutation-lens
        labels: [evidence, seats]
        class: must
        when: {depth: [high]}
        text: >-
          The mutation lens runs on the verification seat, which already holds code sight;
          skips are disclosed — the run owes mutation results or a stated skip.

      - id: impl.finding-kinds
        labels: [evidence]
        class: must
        kind: routing
        text: >-
          Findings split by kind: spec-required behavior broken — evidence captured, clause
          cited — fails the final validation; a beyond-spec finding is advisory.

      - id: impl.finding-kind-disputed
        labels: [user-gate]
        class: must
        kind: routing
        text: >-
          Each finding's kind is confirmed at the checkpoint against the cited clause; a
          disputed kind defaults advisory and goes to the user — the finder never gates
          alone.

      - id: impl.delivered-territory-routing
        labels: [landing]
        class: must
        kind: routing
        text: >-
          A gap in a previously delivered feature's territory is not this run's rework: it
          routes to a /mochiko:feature delta card, cited in the report.

      - id: impl.beyond-spec-disposition
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          Each beyond-spec finding's disposition is the user's: fix now, book to BACKLOG.md,
          or accept as designed.

      - id: impl.store-landing
        labels: [landing]
        class: must
        text: >-
          A built structural change folds into the architecture store in three parts: the
          delta's elements flip built and their FEAT-XXX keys clear (transcription — rides
          this run's landing audit) · the touched rows' As-built: and Drift: fields are
          written as judgment and independently graded · the orphan check runs — an in-flight
          element keying no open feature is flagged, never left. The store skill regenerates
          the derived root ARCHITECTURE.md; it is never hand-edited here.
        pointer: "mochiko:authoring-architecture-store"

      - id: impl.km-landing
        labels: [landing]
        class: must
        when: {km_file: present}
        text: >-
          The same landing carries the knowledge-management obligations of
          .mochiko/memory/knowledge-management.md.

      - id: impl.baseline-delta-grammar
        labels: [landing, evidence]
        class: must
        kind: binding
        text: >-
          Work discovered to touch a product baseline authors baseline-delta.md in the
          feature dir at discovery: a minimal, enumerated, appliable delta. A build-time
          technical decision (a D-XXX, C-XXX, or IP-XXX row at decomposition) is written the
          same way, never in place, against constraints-and-decisions.md; its judgment
          content is graded by the landing verification seat before the user's acceptance —
          the landing's three-way diff stays a transcription check only.

      - id: impl.landing-selection
        labels: [landing]
        class: must
        when: {scope: [selection]}
        text: >-
          The landing executes the store landing plus the map's graduation batch: this run's
          delivered work rows fold into the capability's extent lines and vanish (pending
          rows persist) · status set delivered, dated, never regressing · the FEATURES.md
          index line updates · the specs-index row is touched — a spec reads closed exactly
          when all its selected rows have folded (derived, never asserted). No separate
          feature-close stage exists.
        pointer: "mochiko:authoring-feature-map"

      - id: impl.landing-epic
        labels: [landing]
        class: must
        when: {scope: [epic]}
        text: >-
          The landing executes each member's graduation batch, plus the epic close: the
          [EPIC-XXX] row markers vanish, the manifest is stamped delivered (dated), the spine
          directory persists as record. Multi-spec closure is compositional: each spec closes
          on its own rows, however many specs one landing touches.
        pointer: "mochiko:authoring-epic"

      - id: impl.landing-delta
        labels: [landing]
        class: must
        when: {scope: [delta]}
        text: >-
          The landing executes the entry's marked delta fold.
        pointer: "mochiko:authoring-feature-map"

      - id: impl.landing-lane
        labels: [landing]
        class: must
        when: {scope: [lane]}
        text: >-
          The landing adds no map work to the store landing and the graded folds: a product
          lane owns no capability entry, so the map takes no write — no graduation batch, no
          status flip, no extent-line fold — and the map-delta boundary check of
          impl.landing-verifier-folds reads as zero writes. The lane directory at
          ${product_dir}/lane-<slug>/ persists as record.
        pointer: "mochiko:authoring-feature-map"

      - id: impl.graded-fold
        labels: [landing]
        class: floor
        text: >-
          Every touched baseline folds exactly once, via a graded fold — a three-way diff
          (pre-fold baseline + delta vs folded result; delta applied whole, nothing else
          changed), checked by the landing verification seat. An epic's shared-baseline delta
          folds once from the spine; a single-member baseline from its feature delta. One
          carve: the store's fold IS the store landing — status flips, graded
          As-built:/Drift: writes, and the orphan check, not a three-way diff. A delta whose
          baseline file is absent folds into a fresh ${product_dir}/ file (empty pre-fold
          side), the absence surfaced as a seeding gap.

      - id: impl.gates-fold
        labels: [landing]
        class: must
        text: >-
          The landing folds the gap findings ruled fix-now or backlog into
          ${features_dir}/FEAT-XXX/gates.md (minted if absent), ${qa_seat} authoring each in
          the **TEST:** grammar; findings the user accepted as designed do not fold.

      - id: impl.register
        extends: common.register
        class: must
        kind: binding

  - id: impl.sec.ways-of-working
    title: Ways of Working
    intent: >-
      How the run sequences, verifies, and reports; model routing for its seats.
    rules:

      - id: impl.author-grader-default-fail
        extends: common.author-grader-default-fail
        class: floor

      - id: impl.plan-approval-producers
        labels: [seats, independence]
        class: must
        text: >-
          Every seat that writes code or artifacts plans first and works only on a plan you
          approved; grading, verification, and fact-finding seats are exempt.

      - id: impl.escalation-batching
        labels: [user-gate, reporting]
        class: must
        kind: routing
        text: >-
          Reserved-to-user questions accumulate and land as one batch at the cycle
          checkpoint; only a question the build cannot proceed without interrupts mid-cycle.
          Never sit on a build-blocking one.

      - id: impl.finding-severity-routing
        labels: [reporting]
        class: must
        kind: routing
        text: >-
          Advisory verifier findings ride the escalation cadence: a Minor finding defaults to
          a BACKLOG.md booking, never an in-cycle fix; an Important-or-above finding blocks
          the cycle and joins the checkpoint batch.

      - id: impl.model-tiering
        extends: common.model-tiering
        class: must
        kind: routing

      - id: impl.delta-reverification
        labels: [evidence]
        class: must
        text: >-
          Re-verification is scoped to the delta: a test-only or records-only change gets a
          delta-grade of the changed surface, never a full gate re-sweep. A delta round
          re-runs no quality gates — the prior evidence stands while the graded head is
          unmoved; the graded object is the code tree (`git rev-parse HEAD:<code-dir>`), so a
          records-only commit does not move it.

      - id: impl.no-git-mutations
        labels: [user-gate]
        class: must
        text: >-
          Suggest commits; never run git mutations, never push (an ephemeral, self-removed
          verification snapshot is not a mutation of refs, index, tracked content, or
          history).

      - id: impl.acceptance-plain-text
        labels: [user-gate]
        class: must
        text: >-
          The user's ruling at each blocking gate — the design checkpoint, the card confirm,
          final acceptance — is plain blocking text, never a timed prompt.

  - id: impl.sec.boundaries
    title: Boundaries — the non-waivable floor
    intent: >-
      Floor obligations no seat and no in-run ruling can waive.
    rules:

      - id: impl.baselines-never-in-place
        labels: [landing]
        class: floor
        text: >-
          Baselines are never edited in place. They change only through the landing's graded
          fold. The design phase writes deltas beside them; a build-time technical decision
          takes the same path. One carve, and only one: a store write at the design
          checkpoint's user sign-off is legal, and only as in-flight-class delta elements.
          Ruled truth in the store is never edited in place either — the signed delta stands
          beside it until the landing folds it.

      - id: impl.deviation-gate
        labels: [user-gate]
        class: floor
        kind: gate
        text: >-
          A cycle that adds or removes a box, adds, removes, or redirects an arrow, or moves
          a responsibility across a boundary of the signed delta stops and is presented —
          build as approved, or amend the delta by the user's ruling first. Never design
          around it silently.

      - id: impl.constitution-supremacy
        labels: [user-gate]
        class: floor
        text: >-
          Feature work never overrules the constitution. A governance conflict conforms, or
          is amended or waived through governance-ledger.md — the user's ruling.

      - id: impl.constraint-challenge
        labels: [user-gate, floor-pointer]
        class: floor
        text: >-
          A ratified constraint is never silently overridden. A commodity-category check that
          collides with one files a constraint-challenge finding — the constraint's text, the
          real requirement it plausibly restates, the candidate it excludes — reserved to the
          user. Only the colliding decision pauses; the run proceeds elsewhere.
        pointer: "mochiko:patterns-adopt-first"

      - id: impl.attempt-per-grade
        labels: [attempt-economy]
        class: floor
        kind: bound
        text: >-
          A cycle consumes an attempt every time a verification seat grades it, whatever the
          round is called. Default ${attempt_bound_cycle} per cycle, redeclarable only at
          run-open.

      - id: impl.attempt-exemption-user-only
        labels: [attempt-economy, user-gate]
        class: floor
        kind: reservation
        text: >-
          Exempting a round from the attempt count is the user's call, never yours.

      - id: impl.no-progress-stop
        labels: [attempt-economy]
        class: floor
        kind: bound
        text: >-
          Two consecutive rounds with unchanged findings is a no-progress stop: halt the
          cycle, present state.

      - id: impl.epic-member-halt
        labels: [attempt-economy, user-gate]
        class: floor
        kind: bound
        when: {scope: [epic]}
        # C4: floor — always read, always delivered. `when:` gates when the
        # obligation APPLIES, never whether it is delivered. Re-evaluated
        # whenever the run's shape changes (a seat added mid-run re-activates it).
        text: >-
          Exhaustion or no-progress halts member-scoped; the disposition — carve the member
          out (its rows return to pending, the run continues) or hold the whole run — is the
          user's.

      - id: impl.gap-rework-bound
        labels: [attempt-economy, user-gate]
        class: floor
        kind: bound
        text: >-
          Gap-rework at final validation is the attempt economy at run scale: default
          ${gap_rework_bound} rounds, redeclarable only at run-open; a finding that localizes
          to one cycle's territory charges that cycle's remaining attempts instead. Bound
          exhaustion, or a round with unchanged findings, halts the run and presents state —
          the disposition is the user's.

      - id: impl.gates-never-triaged
        labels: [evidence]
        class: floor
        text: >-
          Gates are never severity-triaged. A failed **TEST:** gate or quality gate fails the
          cycle, per the done condition.

      - id: impl.minimalism-advisory
        labels: [evidence]
        class: floor
        text: >-
          minimalism: findings stay advisory at any severity.

      - id: impl.lane-never-widens
        labels: [scope-entry]
        class: floor
        when: {scope: [lane]}
        # C4: floor — always read, always delivered. `when:` gates when the
        # obligation APPLIES, never whether it is delivered. Re-evaluated
        # whenever the run's shape changes (a seat added mid-run re-activates it).
        text: >-
          The lane never widens in place. A product-lane run discovering it stands on an
          in-flight feature's territory files the finding to that run and aborts.

      - id: impl.sound-loop-floor
        labels: [floor-pointer, independence]
        class: floor
        text: >-
          A judgment-authored write to a governing surface obliges the sound loop: a seat
          produces on a plan you approved, an independent non-author seat reviews, the user
          rules. This run's seat wiring already carries it end to end.
        pointer: "mochiko:patterns-sound-loop"

      - id: impl.transport-floor
        extends: common.transport-floor
        class: floor
        when: {seats: multi}
        # C4: floor — always read, always delivered. `when:` gates when the
        # obligation APPLIES, never whether it is delivered. Re-evaluated
        # whenever the run's shape changes (a seat added mid-run re-activates it).

  - id: impl.sec.fail-conditions
    title: Not done — default FAIL
    intent: >-
      The kind: fail set — any one standing fails the run; the .md Not-done line cites the count this render prints.
    rules:

      - id: impl.fail.sufficiency-unrecorded
        labels: [reporting]
        class: floor
        kind: fail
        enforces: [impl.sufficiency-report]
        text: >-
          The sufficiency verdict was never recorded as a report.

      - id: impl.fail.design-skipped
        labels: [user-gate]
        class: floor
        kind: fail
        enforces: [impl.design-phase-fires-on-gap, impl.gate-design-checkpoint]
        text: >-
          Gaps were found but the design phase was skipped, or its design and store delta
          were never signed by the user.

      - id: impl.fail.card-independence
        labels: [independence]
        class: floor
        kind: fail
        enforces: [impl.seat-card-author-independence, impl.gate-card-confirm]
        text: >-
          A cycle card built by the seat that authored it, or built before the card confirm.

      - id: impl.fail.card-unchecked
        labels: [evidence]
        class: floor
        kind: fail
        enforces: [impl.progress-surface]
        text: >-
          A cycle card left unchecked.

      - id: impl.fail.quality-gate
        labels: [evidence]
        class: floor
        kind: fail
        enforces: [impl.gates-full-suite, impl.gates-never-triaged]
        text: >-
          A failing quality gate.

      - id: impl.fail.no-evidence
        labels: [evidence]
        class: floor
        kind: fail
        enforces: [impl.craft-verify-bindings]
        text: >-
          Verification claimed without real-infrastructure evidence.

      - id: impl.fail.regression
        labels: [evidence]
        class: floor
        kind: fail
        enforces: [impl.regression-sweep]
        text: >-
          A regression in a previously delivered feature's gates.

      - id: impl.fail.baseline-in-place
        labels: [landing]
        class: floor
        kind: fail
        enforces: [impl.baselines-never-in-place, impl.baseline-delta-grammar]
        text: >-
          A product baseline edited in place at build time, instead of through a graded
          baseline-delta.md entry.

      - id: impl.fail.deviation-unresolved
        labels: [user-gate]
        class: floor
        kind: fail
        enforces: [impl.deviation-gate]
        text: >-
          An architecture deviation neither built as approved nor amended with the user's
          consent.

      - id: impl.fail.store-landing-incomplete
        labels: [landing]
        class: floor
        kind: fail
        enforces: [impl.store-landing]
        text: >-
          A signed store delta landed without its built-vs-signed diff, or an in-flight
          element left neither flipped built nor keyed to an open feature.

      - id: impl.fail.ungraded-fold
        labels: [landing]
        class: floor
        kind: fail
        enforces: [impl.graded-fold]
        text: >-
          A touched baseline accepted without its graded fold.

      - id: impl.fail.gap-finding-missing
        labels: [evidence]
        class: floor
        kind: fail
        when: {scope: [selection, epic]}
        # C4: floor — always read, always delivered. `when:` gates when the
        # obligation APPLIES, never whether it is delivered. Re-evaluated
        # whenever the run's shape changes (a seat added mid-run re-activates it).
        enforces: [impl.gap-finding-scope]
        text: >-
          A run without its gap-finding pass.

      - id: impl.fail.skip-unstated
        labels: [reporting]
        class: floor
        kind: fail
        when: {scope: [delta, lane]}
        # C4: floor — always read, always delivered. `when:` gates when the
        # obligation APPLIES, never whether it is delivered. Re-evaluated
        # whenever the run's shape changes (a seat added mid-run re-activates it).
        enforces: [impl.gap-finding-scope]
        text: >-
          A run whose final-validation report does not state its skipped gap-finding pass.

      - id: impl.fail.spec-gap-unresolved
        labels: [evidence]
        class: floor
        kind: fail
        enforces: [impl.finding-kinds]
        text: >-
          A gap finding showing spec-required behavior broken, left unresolved.

      - id: impl.fail.no-acceptance
        extends: common.no-acceptance
        class: floor
        kind: fail
        enforces: [impl.gate-final-acceptance]
