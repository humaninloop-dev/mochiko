# Command content schema for /mochiko:setup — SOURCE OF TRUTH for the command's
# rule-shaped content (command-content-schema D1/D7, DECISIONS.md 2026-08-26; grammar
# amended by command-schema-ontology D1–D8, DECISIONS.md 2026-08-27). The command .md
# instructs a raw, full Read of this file at command fire; the model interprets it live —
# no build step, no binary on the read path (GI-020). Narrative (Identity & Mission,
# Adaptive Goal Protocol prose) stays in plugins/mochiko/commands/setup.md.
#
# Grammar (D6, as amended by D14 and by command-schema-ontology D1–D8):
# sections: list, each {id, title, intent, rules}; rule blocks
# {id, labels, class, kind?, when?, enforces?, extends?, text, pointer?} nest under their section.
#   section id  setup.sec.<slug> — minted once like rule IDs (D11); title verbatim from
#           the group it carries; intent one line, navigation only — sections never grow a
#           second prose surface (narrative stays in the .md).
#   id      dotted slug — a NAME, never a summary; minted once, frozen (D11). A reword
#           keeps its ID; a split mints children recording the parent; a merge retires
#           the losers under a top-level tombstones: key.
#           FAIL clauses live under the setup.fail.* segment.
#   labels  values from plugins/mochiko/schemas/command-labels.yaml (D8).
#   class   floor = non-waivable, must-survive under the pair audit (M3) ·
#           must = binding obligation · advisory = may change without supersession ceremony.
#   kind    one of constraint · duty · gate · reservation · binding · bound · routing ·
#           fail · latitude. CONSTRAINT IS THE DEFAULT — an absent kind: reads constraint
#           and is never written. kind crosscuts sections; it does not re-group them.
#           kind: fail is the operative selector for the Not-done set (never defaulted on
#           a setup.fail.* ID), and the .md Not-done line counts exactly that set.
#   when    a conjunction of dimension: value terms from this schema's conditions: block —
#           declared vocabulary only, no boolean algebra, no negation beyond a declared
#           value, no free-form strings. It carries WHETHER the rule binds, never the
#           rule's internal logic: a rule-level activation guard lives in when: alone and
#           leaves the text (single-homing), while intra-rule branches, exceptions, and
#           carve-outs stay prose. On a class: floor rule, when: gates when the obligation
#           APPLIES — a floor is always read and always delivered, whatever its when:.
#   enforces  on kind: fail nodes only — the local rule IDs this end-state predicate is the
#           contrapositive of. An empty list is legal ONLY with a one-line reason (the
#           obligation lives in a pointer skill), so absence is a statement, never an omission.
#   extends  common.<slug> — inherits text, labels, and pointer ONLY from that block in
#           plugins/mochiko/schemas/common.yaml, which the .md instructs Read raw in the
#           same first action. class, kind, when, and enforces are ALWAYS local; a locally
#           declared text/labels/pointer replaces the inherited one; ${var} placeholders in
#           inherited text substitute from THIS schema's vars:; the stub's setup.* ID
#           stays the citable ID.
#   text    carries ${var} placeholders substituted from vars: at read (D5). Verbatim
#           command strings carry no placeholders.
#   provenance  decision anchors live in .mochiko/provenance.yaml (D16, repo-side —
#           not shipped), keyed by rule ID; never read by the run; an anchored
#           rule still leaves only by recorded supersession-by-ruling.
#   pointer the skill that owns the floor or procedure — the rule holds the pointer,
#           never the procedure. Multi-skill bindings name every skill in text.
# Top-level conditions: declares every run-shape dimension this schema's rules use — the
#   name, its closed value set (or presence), and its resolution point: entry-derived ·
#   surface-presence · moment-resolved(<moment>) · user-ruled · standing-trigger. A
#   moment-resolved dimension is resolved at the named moment; rules gated on it are
#   inapplicable until it resolves.
# Top-level moments: declares the named anchor points this schema's rules reference, each
#   with one navigation line. The list is UNORDERED — relative sequence stays the .md
#   protocol's narrative and the lead's latitude, and no precedence between moments is
#   claimed or checkable.
# Referential closure (D15): a rule's text is self-contained — every reference resolves
#   within the block or the schema's addressable namespace (${var} · setup.* IDs ·
#   setup.sec.* · common.* blocks · class:/kind: values · conditions:/moments: names ·
#   labels · pointer: skills · file paths). A parenthetical setup.<slug> citation is the
#   dependency idiom and must resolve to a live node or a tombstone (D5). Deixis ("these
#   rules", "this section", "above"/"below", document-shape remarks) is a defect — quoted
#   alone, the reference dangles. The checker lints a curated marker list (warning-class).
#   "this schema" and "the run" are legal self-reference.
#
# Rule grain (D12): one block per independently-citable obligation.
# Advisory checker: scripts/check-command-schema.py (D13) — exit-code signal only.
kind: command
command: setup

vars:
  explore_model: haiku
  memory_dir: .mochiko/memory
  product_dir: .mochiko/product
  # plugin_root is the harness-substituted plugin root — declared here once so rule
  # text stays placeholder-closed (D5); it resolves at read like any command's
  # ${CLAUDE_PLUGIN_ROOT} reference.
  plugin_root: "${CLAUDE_PLUGIN_ROOT}"

conditions:
  mode:
    values: [greenfield, brownfield, amend]
    resolution: user-ruled
    note: >-
      proposed from what the workspace shows; the user rules it whenever it is
      ambiguous (setup.user-mode-ruling).
  seats:
    values: [single, multi]
    resolution: standing-trigger
    note: fires the moment the run composes more than one seat, and re-fires on a seat added mid-run.

moments:
  interrogation: The inline agenda-then-catalog stage, worked card by card with the user.
  ratification: The user's ratification of the synthesis — before any surface is authored.
  acceptance: The user's final acceptance of the surface set, flagged proposal by flagged proposal.
  close: Where the feature map and the bootstrapped surfaces must exist.

sections:
  - id: setup.sec.roles
    title: Roles & Responsibilities — seat wiring
    intent: >-
      How the run is led and staffed, and the independence its grading seats carry.
    rules:

      - id: setup.staffing-latitude
        labels: [seats]
        class: must
        kind: latitude
        text: >-
          Teammates or subagents per seat is your call.

      - id: setup.interrogation-inline
        labels: [seats]
        class: must
        kind: duty
        text: >-
          Run the interrogation yourself, inline — the agenda's dimensions worked
          adaptively via mochiko:analysis-iterative, then the catalog deck, card by card,
          recommend-then-arbitrate (agenda and deck named in setup.interrogation-inputs).
        pointer: "mochiko:analysis-iterative"

      - id: setup.stress-test-cold-seat
        labels: [independence, user-gate]
        class: must
        text: >-
          The synthesis (${memory_dir}/governance-intent.md) is your pen, so its
          pre-ratification stress-test is always a cold seat, or the user's recorded
          waiver.

      - id: setup.blind-map-dispatch
        labels: [independence, seats]
        class: floor
        text: >-
          The pre-ratification stress-test seat is spawned in two messages — first the
          setup topic / project identity and goal only, never the synthesis path
          (${memory_dir}/governance-intent.md), so it builds its Phase 0 angle map blind
          to what the interrogation concluded; its map returns before you send the
          synthesis path and the cold read begins. In a pair, both seats build their maps
          independently.

  - id: setup.sec.reserved
    title: Reserved to the user — never the run's
    intent: >-
      Decisions held by the user: gates, rulings, and escalations no seat may take.
    rules:

      - id: setup.coverage-survivor-routing
        labels: [user-gate]
        class: must
        kind: routing
        text: >-
          A coverage finding surviving the pre-ratification stress-test
          (setup.blind-map-dispatch) questions the setup's scope, not a card — present
          each gap as a candidate topic; the user rules the path: explore now (re-enter
          mochiko:analysis-iterative on that angle; the re-elicited intent lands in the
          GI-XXX namespace), rule inline, or defer. A gap that overlaps an agenda
          dimension keeps the ordinary interrogation-follow-up path.

      - id: setup.user-mode-ruling
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          The mode when ambiguous — greenfield / brownfield / amend — is the user's
          ruling.

      - id: setup.user-card-rulings
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          Every interrogation card ruling, module ruling, and waiver is the user's.

      - id: setup.gate-synthesis-ratification
        labels: [user-gate]
        class: floor
        kind: gate
        text: >-
          Synthesis ratification is the user's.

      - id: setup.user-conflict-rulings
        labels: [user-gate]
        class: must
        kind: reservation
        when: {mode: [brownfield]}
        text: >-
          Detected reality vs declared intent conflicts are the user's — confronted in
          the open, never silently resolved.

      - id: setup.user-map-confirmation
        labels: [user-gate]
        class: must
        kind: reservation
        when: {mode: [brownfield]}
        text: >-
          Confirmation of the reconstructed feature map, entry by entry, is the user's.

      - id: setup.gate-final-acceptance
        labels: [user-gate]
        class: floor
        kind: gate
        text: >-
          Final acceptance of the surface set is the user's, flagged proposal by flagged
          proposal.

  - id: setup.sec.tools
    title: Tools bindings
    intent: >-
      Surfaces, inputs, templates, and hand-offs the run binds to.
    rules:

      - id: setup.surface-set
        labels: [binding, floor-pointer]
        class: must
        kind: binding
        text: >-
          The surface set: the marked governance region in CLAUDE.md
          (`<!-- mochiko:governance:begin/end -->`) · `paths`-scoped
          .claude/rules/mochiko/*.md · skill pointers ·
          ${memory_dir}/governance-ledger.md · the trace summary. Composition and read
          scope: mochiko:authoring-constitution.
        pointer: "mochiko:authoring-constitution"

      - id: setup.synthesis-artifact
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The synthesis: ${memory_dir}/governance-intent.md, GI-XXX namespace, from the
          governance-intent template (rendered by mochiko-cli template governance-intent,
          or its schema plugins/mochiko/schemas/governance-intent.yaml Read raw when the
          binary is absent — the shipped schema is the first-class source of truth) — the
          durable amend baseline.

      - id: setup.interrogation-inputs
        labels: [binding, scope-entry]
        class: must
        kind: binding
        text: >-
          Interrogation inputs:
          ${plugin_root}/skills/authoring-constitution/references/ —
          INTERROGATION-AGENDA.md, the catalog/ deck, DOMAIN-DEPENDENCIES.md; brownfield
          analysis via mochiko:analysis-codebase into
          ${memory_dir}/codebase-analysis.md.
        pointer: "mochiko:analysis-codebase"

      - id: setup.constitution-superseded
        labels: [binding]
        class: must
        text: >-
          A ${memory_dir}/constitution.md on disk is superseded — delete on sight, say
          so in one line.

      - id: setup.km-module-scaffold
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The knowledge-management module adopted → scaffold per
          templates/constitution-modules/knowledge-management.md, including the
          project-pinned copy at ${memory_dir}/knowledge-management.md; its
          never-overwrite floor holds.

      - id: setup.feature-map-brownfield
        labels: [landing]
        class: must
        when: {mode: [brownfield]}
        text: >-
          The analysis (setup.interrogation-inputs) extends into a feature-map
          reconstruction — delivered capabilities derived from the code (routes, UI
          surfaces, services), confirmed with the user, landing as the initial
          FEATURES.md + .mochiko/features/ entries with `delivered` status and the
          reconstructed-from-code mark (shape: the features-index and feature-entry
          templates — mochiko-cli template features-index and
          mochiko-cli template feature-entry, or their schemas
          plugins/mochiko/schemas/features-index.yaml and
          plugins/mochiko/schemas/feature-entry.yaml Read raw when the binary is absent,
          the shipped schemas being the first-class source of truth; map machinery and
          the first-touch re-verify obligation: mochiko:authoring-feature-map).
        pointer: "mochiko:authoring-feature-map"

      - id: setup.feature-map-greenfield
        labels: [landing]
        class: must
        when: {mode: [greenfield]}
        text: >-
          Scaffold the empty FEATURES.md index.

      - id: setup.baselines-bootstrap
        labels: [landing]
        class: must
        text: >-
          `Assumed`: the brownfield analysis also bootstraps the product baselines —
          data-model.md · contracts/ · constraints-and-decisions.md · quickstart.md — at
          ${product_dir}/ (ARCHITECTURE.md stays repo root, now as the store's derived
          index) — from the delivered code; greenfield seeds those baselines at the
          first implement run's design phase instead.

      - id: setup.store-scaffold-unconditional
        labels: [binding]
        class: must
        text: >-
          The architecture store's scaffold is unconditional — on every path,
          ${product_dir}/architecture/ is created where it does not exist, with a
          spine.md stub whose header carries the `Scope:` line
          (setup.architecture-scope-handoff) and an empty concerns.md beside it, so the
          store's layout is complete from birth; greenfield's stub is simply a header
          with no topology under it, and the scaffold creates only what is missing —
          never writing over a store that already carries content.

      - id: setup.architecture-scope-handoff
        labels: [binding]
        class: must
        text: >-
          The run reads which surface types the product carries — backend-service ·
          frontend-web · mobile · desktop, composed for a full-stack or monorepo
          product — and declares them on the `Scope:` line in the header of
          ${product_dir}/architecture/spine.md, written as a stub by the unconditional
          store scaffold (setup.store-scaffold-unconditional) — so every setup run
          leaves the scope declared; the derived index (repo-root ARCHITECTURE.md)
          renders it. The declaration is write-if-absent: where the `Scope:` line is
          missing it is declared, and an existing line is left alone. The store carries
          the scope — setup does not hold it. It is a handoff, not a ruling: the /mochiko:architecture
          desk deals the shelves that scope selects, and the user may override it at the
          desk by an ordinary store write to that same line. No architecture stance is
          taken in the run.

      - id: setup.register
        extends: common.register
        class: must
        kind: binding

      - id: setup.next-step
        labels: [reporting]
        class: advisory
        kind: routing
        text: >-
          Next step: /mochiko:specify for the first feature, and /mochiko:architecture
          for the product's architecture baseline — peer doors, neither ahead of the
          other (+ /mochiko:brainstorm when knowledge-management was adopted).

  - id: setup.sec.ways-of-working
    title: Ways of Working
    intent: >-
      How the run plans, grades, and reports; model routing for its seats.
    rules:

      - id: setup.model-tiering
        extends: common.model-tiering
        class: must
        kind: routing

      - id: setup.plan-approval-producers
        extends: common.plan-approval-producers
        class: must

      - id: setup.author-grader-default-fail
        extends: common.author-grader-default-fail
        class: floor

      - id: setup.no-git-mutations
        extends: common.no-git-mutations
        class: floor

      - id: setup.acceptance-plain-text
        extends: common.acceptance-plain-text
        class: floor

  - id: setup.sec.boundaries
    title: Boundaries — the non-waivable floor
    intent: >-
      Floor obligations no seat and no in-run ruling can waive.
    rules:

      - id: setup.transport-floor
        extends: common.transport-floor
        class: floor
        when: {seats: multi}
        # C4: floor — always read, always delivered. `when:` gates when the
        # obligation APPLIES, never whether it is delivered. Re-evaluated
        # whenever the run's shape changes (a seat added mid-run re-activates it).

      - id: setup.durables-never-deleted
        labels: [binding, stewardship]
        class: floor
        text: >-
          Never offer to delete the synthesis ${memory_dir}/governance-intent.md or the
          ledger ${memory_dir}/governance-ledger.md.

      - id: setup.governance-region-ownership
        labels: [binding]
        class: floor
        text: >-
          The governance region in CLAUDE.md (`<!-- mochiko:governance:begin/end -->`)
          is setup-owned and idempotently regenerated; everything outside those markers
          is user content, never touched.

      - id: setup.carve-outs-preserved
        labels: [binding]
        class: floor
        text: >-
          The governance-surfaces template's marked carve-outs are preserved verbatim,
          never regenerated over the user's values: the `mochiko:domain-registry` block
          in the domain-layer rules file under .claude/rules/mochiko/, and the
          `mochiko:output-style` pair — the switch line in the CLAUDE.md governance
          region plus .claude/rules/mochiko/output-style.md.
        pointer: "mochiko:authoring-constitution"

      - id: setup.map-never-overwrite
        labels: [landing]
        class: floor
        text: >-
          The never-overwrite floor covers every feature-map write the run makes — the
          brownfield reconstruction (setup.feature-map-brownfield) and the greenfield
          scaffold (setup.feature-map-greenfield) are its instances, not its extent —
          and an amend run makes none.

      - id: setup.store-ruled-content-never-here
        labels: [binding, stewardship]
        class: floor
        text: >-
          The store's ruled content is never authored in the run, on any path: a file
          holding only a `Scope:` header is scaffold, not ruled content, and the first
          /mochiko:architecture visit is what elicits it (greenfield) or reconstructs it
          from what exists and confirms it with the user (brownfield) — those two paths
          are instances of its reach, not its extent.

  - id: setup.sec.fail-conditions
    title: Not done — default FAIL
    intent: >-
      The kind: fail set — any one standing fails the run; the .md Not-done line hard-codes this set's count.
    rules:

      - id: setup.fail.pre-ratification-authoring
        labels: [user-gate]
        class: floor
        kind: fail
        enforces: [setup.gate-synthesis-ratification]
        text: >-
          A surface authored before the intent was ratified.

      - id: setup.fail.unclosed-trace
        labels: [evidence]
        class: floor
        kind: fail
        # D6 empty-with-reason: the intent→surface trace obligation is owned by
        # mochiko:authoring-constitution, bound at setup.surface-set — no local rule
        # states it.
        enforces: []
        text: >-
          An unclosed trace from ratified intent to authored surfaces.

      - id: setup.fail.author-graded
        labels: [independence]
        class: floor
        kind: fail
        enforces: [setup.author-grader-default-fail, setup.stress-test-cold-seat]
        text: >-
          The governance surface set never graded by anyone but its author.

      - id: setup.fail.floor-category-uncovered
        labels: [user-gate]
        class: floor
        kind: fail
        # D6 empty-with-reason: the Essential Floor category set is owned by
        # mochiko:authoring-constitution, carried on this node's own pointer: — no
        # local rule enumerates it.
        enforces: []
        text: >-
          A floor category with neither principle nor recorded waiver.
        pointer: "mochiko:authoring-constitution"

      - id: setup.fail.no-acceptance
        extends: common.no-acceptance
        class: floor
        kind: fail
        enforces: [setup.gate-final-acceptance]

      - id: setup.fail.no-feature-map
        labels: [landing]
        class: floor
        kind: fail
        enforces: [setup.feature-map-brownfield, setup.feature-map-greenfield, setup.user-map-confirmation]
        text: >-
          No feature map at close — brownfield reconstruction unconfirmed, greenfield
          index unscaffolded, or, on an amend, a missing map neither surfaced nor
          offered.

tombstones:
  - id: setup.sec.harness
    disposition: "superseded → rules redistributed across the D4 six-set (command-md-scaffold-standardization D3/D4/D5)"
  - id: setup.sec.bindings
    disposition: "superseded → rules redistributed across the D4 six-set (command-md-scaffold-standardization D3/D4/D5)"
