# Command content schema for /mochiko:setup — SOURCE OF TRUTH for the command's
# rule-shaped content (command-content-schema D1/D7; setup converted under the D10
# per-command rollout ruling, DECISIONS.md 2026-08-26). The command .md instructs a raw,
# full Read of this file at command fire; the model interprets it live — no build step,
# no binary on the read path (GI-020). Narrative (Identity & Mission, Adaptive Goal
# Protocol prose) stays in plugins/mochiko/commands/setup.md.
#
# Grammar (D6, as amended by D14): sections: list, each {id, title, intent, rules};
# rule blocks {id, labels, class, text, pointer?} nest under their section.
#   section id  setup.sec.<slug> — minted once like rule IDs (D11); title verbatim from
#           the command group it carries; intent one line, navigation only — sections
#           never grow a second prose surface (narrative stays in the .md).
#   id      dotted slug — a NAME, never a summary; minted once, frozen (D11). A reword
#           keeps its ID; a split mints children recording the parent; a merge retires
#           the losers under a top-level tombstones: key.
#           FAIL clauses live under the setup.fail.* segment.
#   labels  values from plugins/mochiko/schemas/command-labels.yaml (D8).
#   class   floor = non-waivable, must-survive under the pair audit (M3) ·
#           must = binding obligation · advisory = may change without supersession ceremony.
#   text    carries ${var} placeholders substituted from vars: at read (D5). Verbatim
#           command strings carry no placeholders.
#   provenance  decision anchors live in .mochiko/provenance.yaml (D16, repo-side —
#           not shipped), keyed by rule ID; never read by the run; an anchored
#           rule still leaves only by recorded supersession-by-ruling.
#   pointer the skill that owns the floor or procedure — the rule holds the pointer,
#           never the procedure. Multi-skill bindings name every skill in text.
# Referential closure (D15): a rule's text is self-contained — every reference resolves
#   within the block or the schema's addressable namespace (${var} · setup.* IDs ·
#   setup.sec.* · class: values · labels · pointer: skills · file
#   paths). Deixis ("these rules", "this section", "above"/"below", document-shape
#   remarks) is a defect — quoted alone, the reference dangles. The checker lints a
#   curated marker list (warning-class). "this schema" and "the run" are legal
#   self-reference.
#
# Rule grain (D12): one block per independently-citable obligation.
# Advisory checker: scripts/check-command-schema.py (D13) — exit-code signal only.
kind: command
command: setup

vars:
  explore_model: haiku
  memory_dir: .mochiko/memory
  product_dir: .mochiko/product
  # plugin_root is the harness-substituted plugin root — declared here once so rule
  # text stays placeholder-closed (D5); it resolves at read like any command's
  # ${CLAUDE_PLUGIN_ROOT} reference.
  plugin_root: "${CLAUDE_PLUGIN_ROOT}"

sections:
  - id: setup.sec.roles
    title: Roles & Responsibilities — seat wiring
    intent: >-
      How the run is led and staffed, and the independence its grading seats carry.
    rules:

      - id: setup.staffing-latitude
        labels: [seats]
        class: must
        text: >-
          Teammates or subagents per seat is your call.

      - id: setup.interrogation-inline
        labels: [seats]
        class: must
        text: >-
          Run the interrogation yourself, inline — the agenda's dimensions worked
          adaptively via mochiko:analysis-iterative, then the catalog deck, card by card,
          recommend-then-arbitrate (agenda and deck named in setup.interrogation-inputs).
        pointer: "mochiko:analysis-iterative"

      - id: setup.stress-test-cold-seat
        labels: [independence, user-gate]
        class: must
        text: >-
          The synthesis (${memory_dir}/governance-intent.md) is your pen, so its
          pre-ratification stress-test is always a cold seat, or the user's recorded
          waiver.

      - id: setup.blind-map-dispatch
        labels: [independence, seats]
        class: floor
        text: >-
          The pre-ratification stress-test seat is spawned in two messages — first the
          setup topic / project identity and goal only, never the synthesis path
          (${memory_dir}/governance-intent.md), so it builds its Phase 0 angle map blind
          to what the interrogation concluded; its map returns before you send the
          synthesis path and the cold read begins. In a pair, both seats build their maps
          independently.

  - id: setup.sec.reserved
    title: Reserved to the user — never the run's
    intent: >-
      Decisions held by the user: gates, rulings, and escalations no seat may take.
    rules:

      - id: setup.coverage-survivor-routing
        labels: [user-gate]
        class: must
        text: >-
          A coverage finding surviving the pre-ratification stress-test
          (setup.blind-map-dispatch) questions the setup's scope, not a card — present
          each gap as a candidate topic; the user rules the path: explore now (re-enter
          mochiko:analysis-iterative on that angle; the re-elicited intent lands in the
          GI-XXX namespace), rule inline, or defer. A gap that overlaps an agenda
          dimension keeps the ordinary interrogation-follow-up path.

      - id: setup.user-mode-ruling
        labels: [user-gate]
        class: must
        text: >-
          The mode when ambiguous — greenfield / brownfield / amend — is the user's
          ruling.

      - id: setup.user-card-rulings
        labels: [user-gate]
        class: must
        text: >-
          Every interrogation card ruling, module ruling, and waiver is the user's.

      - id: setup.gate-synthesis-ratification
        labels: [user-gate]
        class: floor
        text: >-
          Synthesis ratification is the user's.

      - id: setup.user-conflict-rulings
        labels: [user-gate]
        class: must
        text: >-
          Detected reality vs declared intent conflicts (brownfield) are the user's —
          confronted in the open, never silently resolved.

      - id: setup.user-map-confirmation
        labels: [user-gate]
        class: must
        text: >-
          Confirmation of the reconstructed feature map, entry by entry (brownfield), is
          the user's.

      - id: setup.gate-final-acceptance
        labels: [user-gate]
        class: floor
        text: >-
          Final acceptance of the surface set is the user's, flagged proposal by flagged
          proposal.

  - id: setup.sec.tools
    title: Tools bindings
    intent: >-
      Surfaces, inputs, templates, and hand-offs the run binds to.
    rules:

      - id: setup.surface-set
        labels: [binding, floor-pointer]
        class: must
        text: >-
          The surface set: the marked governance region in CLAUDE.md
          (`<!-- mochiko:governance:begin/end -->`) · `paths`-scoped
          .claude/rules/mochiko/*.md · skill pointers ·
          ${memory_dir}/governance-ledger.md · the trace summary. Composition and read
          scope: mochiko:authoring-constitution.
        pointer: "mochiko:authoring-constitution"

      - id: setup.synthesis-artifact
        labels: [binding]
        class: must
        text: >-
          The synthesis: ${memory_dir}/governance-intent.md, GI-XXX namespace, from the
          governance-intent template (rendered by mochiko-cli template governance-intent,
          or its schema plugins/mochiko/schemas/governance-intent.yaml Read raw when the
          binary is absent — the shipped schema is the first-class source of truth) — the
          durable amend baseline.

      - id: setup.interrogation-inputs
        labels: [binding, scope-entry]
        class: must
        text: >-
          Interrogation inputs:
          ${plugin_root}/skills/authoring-constitution/references/ —
          INTERROGATION-AGENDA.md, the catalog/ deck, DOMAIN-DEPENDENCIES.md; brownfield
          analysis via mochiko:analysis-codebase into
          ${memory_dir}/codebase-analysis.md.
        pointer: "mochiko:analysis-codebase"

      - id: setup.constitution-superseded
        labels: [binding]
        class: must
        text: >-
          A ${memory_dir}/constitution.md on disk is superseded — delete on sight, say
          so in one line.

      - id: setup.km-module-scaffold
        labels: [binding]
        class: must
        text: >-
          The knowledge-management module adopted → scaffold per
          templates/constitution-modules/knowledge-management.md, including the
          project-pinned copy at ${memory_dir}/knowledge-management.md; its
          never-overwrite floor holds.

      - id: setup.feature-map-brownfield
        labels: [landing]
        class: must
        text: >-
          Brownfield → the analysis (setup.interrogation-inputs) extends into a
          feature-map reconstruction — delivered capabilities derived from the code
          (routes, UI surfaces, services), confirmed with the user, landing as the
          initial FEATURES.md + .mochiko/features/ entries with `delivered` status and
          the reconstructed-from-code mark (shape: the features-index and feature-entry
          templates — mochiko-cli template features-index and
          mochiko-cli template feature-entry, or their schemas
          plugins/mochiko/schemas/features-index.yaml and
          plugins/mochiko/schemas/feature-entry.yaml Read raw when the binary is absent,
          the shipped schemas being the first-class source of truth; map machinery and
          the first-touch re-verify obligation: mochiko:authoring-feature-map).
        pointer: "mochiko:authoring-feature-map"

      - id: setup.feature-map-greenfield
        labels: [landing]
        class: must
        text: >-
          Greenfield → scaffold the empty FEATURES.md index.

      - id: setup.baselines-bootstrap
        labels: [landing]
        class: must
        text: >-
          `Assumed` (feature-sizing record, open thread 4 — setup reconstruction burden
          + partial-baseline poisoning risk): the brownfield analysis also bootstraps the
          product baselines — data-model.md · contracts/ ·
          constraints-and-decisions.md · quickstart.md — at ${product_dir}/
          (ARCHITECTURE.md stays repo root, now as the store's derived index) — from the
          delivered code; greenfield seeds those baselines at the first implement run's
          design phase instead.

      - id: setup.store-scaffold-unconditional
        labels: [binding]
        class: must
        text: >-
          The architecture store's scaffold is unconditional — on both the greenfield
          and brownfield paths, ${product_dir}/architecture/ is created with a spine.md
          stub whose header carries the `Scope:` line
          (setup.architecture-scope-handoff) and an empty concerns.md beside it, so the
          store's layout is complete from birth; greenfield's stub is simply a header
          with no topology under it.

      - id: setup.architecture-scope-handoff
        labels: [binding]
        class: must
        text: >-
          The run reads which surface types the product carries — backend-service ·
          frontend-web · mobile · desktop, composed for a full-stack or monorepo
          product — and declares them on the `Scope:` line in the header of
          ${product_dir}/architecture/spine.md, written as a stub by the unconditional
          store scaffold (setup.store-scaffold-unconditional) — so every setup run,
          greenfield or brownfield, leaves the scope declared; the derived index
          (repo-root ARCHITECTURE.md) renders it. The store carries the scope — setup
          does not hold it. It is a handoff, not a ruling: the /mochiko:architecture
          desk deals the shelves that scope selects, and the user may override it at the
          desk by an ordinary store write to that same line. No architecture stance is
          taken in the run.

      - id: setup.register
        labels: [reporting]
        class: must
        text: >-
          User-facing prose per templates/output-style.md.

      - id: setup.next-step
        labels: [reporting]
        class: advisory
        text: >-
          Next step: /mochiko:specify for the first feature, and /mochiko:architecture
          for the product's architecture baseline — peer doors, neither ahead of the
          other (+ /mochiko:brainstorm when knowledge-management was adopted).

  - id: setup.sec.ways-of-working
    title: Ways of Working
    intent: >-
      How the run plans, grades, and reports; model routing for its seats.
    rules:

      - id: setup.model-tiering
        labels: [seats, floor-pointer]
        class: must
        text: >-
          Exploration and fact-finding dispatches ride
          mochiko:patterns-model-tiering's class key — locate/enumerate reads to a native
          Explore subagent spawned model: ${explore_model}, interpretive or
          absence-driven reads on the session tier — and every seat brief carries the
          routing rule; referenced, never restated.
        pointer: "mochiko:patterns-model-tiering"

      - id: setup.plan-approval-producers
        labels: [seats, independence]
        class: must
        text: >-
          Any seat that writes artifacts plans first and works only on a plan you
          approved; grading and fact-finding seats are exempt.

      - id: setup.author-grader-default-fail
        labels: [independence]
        class: floor
        text: >-
          No output is cleared by its author; grading reads the authored surfaces
          themselves — never the author's report — default FAIL.

      - id: setup.no-git-mutations
        labels: [user-gate]
        class: floor
        text: >-
          Suggest commits; never run git mutations, never push.

      - id: setup.acceptance-plain-text
        labels: [user-gate]
        class: floor
        text: >-
          User acceptance is plain blocking text, never a timed prompt.

  - id: setup.sec.boundaries
    title: Boundaries — the non-waivable floor
    intent: >-
      Floor obligations no seat and no in-run ruling can waive.
    rules:

      - id: setup.transport-floor
        labels: [floor-pointer, seats]
        class: floor
        text: >-
          When the run composes more than one seat, mochiko:patterns-transport-floor
          governs its composition and messaging under a split trigger — message legs on
          any multi-seat messaging, topology legs on shared writes — non-waivable once
          triggered; referenced, never restated.
        pointer: "mochiko:patterns-transport-floor"

      - id: setup.durables-never-deleted
        labels: [binding, stewardship]
        class: floor
        text: >-
          Never offer to delete the synthesis ${memory_dir}/governance-intent.md or the
          ledger ${memory_dir}/governance-ledger.md.

      - id: setup.governance-region-ownership
        labels: [binding]
        class: floor
        text: >-
          The governance region in CLAUDE.md (`<!-- mochiko:governance:begin/end -->`)
          is setup-owned and idempotently regenerated; everything outside those markers
          is user content, never touched.

      - id: setup.carve-outs-preserved
        labels: [binding]
        class: floor
        text: >-
          The governance-surfaces template's marked carve-outs are preserved verbatim,
          never regenerated over the user's values: the `mochiko:domain-registry` block
          in the domain-layer rules file under .claude/rules/mochiko/, and the
          `mochiko:output-style` pair — the switch line in the CLAUDE.md governance
          region plus .claude/rules/mochiko/output-style.md.
        pointer: "mochiko:authoring-constitution"

      - id: setup.map-never-overwrite
        labels: [landing]
        class: floor
        text: >-
          The never-overwrite floor covers both feature-map writes — the brownfield
          reconstruction (setup.feature-map-brownfield) and the greenfield scaffold
          (setup.feature-map-greenfield).

      - id: setup.store-ruled-content-never-here
        labels: [binding, stewardship]
        class: floor
        text: >-
          The store's ruled content is never authored in the run, on either path: a file
          holding only a `Scope:` header is scaffold, not ruled content, and the first
          /mochiko:architecture visit is what elicits it (greenfield) or reconstructs it
          from what exists and confirms it with the user (brownfield).

  - id: setup.sec.fail-conditions
    title: Not done — default FAIL
    intent: >-
      The fail-condition set — any one standing fails the run; the .md Not-done line hard-codes this set's count.
    rules:

      - id: setup.fail.pre-ratification-authoring
        labels: [fail-condition, user-gate]
        class: floor
        text: >-
          A surface authored before the intent was ratified.

      - id: setup.fail.unclosed-trace
        labels: [fail-condition, evidence]
        class: floor
        text: >-
          An unclosed trace from ratified intent to authored surfaces.

      - id: setup.fail.author-graded
        labels: [fail-condition, independence]
        class: floor
        text: >-
          The governance surface set never graded by anyone but its author.

      - id: setup.fail.floor-category-uncovered
        labels: [fail-condition, user-gate]
        class: floor
        text: >-
          A floor category with neither principle nor recorded waiver.
        pointer: "mochiko:authoring-constitution"

      - id: setup.fail.no-acceptance
        labels: [fail-condition, user-gate]
        class: floor
        text: >-
          User acceptance not given.

      - id: setup.fail.no-feature-map
        labels: [fail-condition, landing]
        class: floor
        text: >-
          No feature map at close — brownfield reconstruction unconfirmed, or greenfield
          index unscaffolded.

tombstones:
  - id: setup.sec.harness
    disposition: "superseded → rules redistributed across the D4 six-set (command-md-scaffold-standardization D3/D4/D5)"
  - id: setup.sec.bindings
    disposition: "superseded → rules redistributed across the D4 six-set (command-md-scaffold-standardization D3/D4/D5)"
