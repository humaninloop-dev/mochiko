# Skill content schema for mochiko:authoring-constitution. The SKILL.md body instructs a raw,
# full Read of this file at skill invoke — beside
# plugins/mochiko/schemas/skill-authoring-common.yaml, one declared first action — and its
# "Rules — load the schema first" section carries the reading grammar. Two semantics live only
# here:
#   class   floor = non-waivable · must = binding obligation · advisory = guidance, not binding.
#   conditions:  each dimension declares its resolution point (entry-derived · surface-presence);
#           a rule gated on an unresolved dimension is inapplicable until it resolves.
kind: skill
skill: authoring-constitution

vars:
  template: "governance-surfaces"
  artifact: "governance surface set"
  grader: "`validation-constitution`"

conditions:
  mode:
    values: [greenfield, brownfield, amend]
    resolution: entry-derived
    note: the authoring mode the driving command's brief names.
  synthesis:
    values: presence
    resolution: surface-presence
    note: a ratified `.mochiko/memory/governance-intent.md` exists.
  rules_file_in_set:
    values: presence
    resolution: surface-presence
    note: the authored surface set includes at least one `.claude/rules/mochiko/` rules file.

sections:
  - id: authoring-constitution.sec.independence
    title: Independence — produced set, independent grade
    intent: >-
      Who grades the surface set, and the seat separation the grade rides on.
    rules:

      - id: authoring-constitution.independent-grade
        extends: authoring-common.independent-grade
        class: must
        kind: routing

      - id: authoring-constitution.never-co-mounted
        labels: [independence, boundary]
        class: must
        text: >-
          The grading validator runs as a separate agent, never co-mounted with this
          skill; the sequencing, the produce→validate→revise loop, and the human gates are
          owned by the command lead that drives this skill, not by this skill.

  - id: authoring-constitution.sec.scope
    title: Scope — what this skill never does
    intent: >-
      The jurisdiction lines away from grading, eliciting, and analyzing.
    rules:

      - id: authoring-constitution.grading-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Reviewing or grading an existing surface set is the independent validator's job
          (`validation-constitution`), run by a different agent.

      - id: authoring-constitution.eliciting-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Eliciting what governance should contain is the interrogation session's job
          (lead-conducted, upstream) — this skill formulates a ratified synthesis, it does
          not interview.

      - id: authoring-constitution.analysis-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Analyzing the codebase is `analysis-codebase`'s — run it first; brownfield mode
          consumes its output.

      - id: authoring-constitution.no-sync-section
        labels: [single-home]
        class: must
        text: >-
          The authored set carries no CLAUDE.md-synchronization section: governance lives
          ON CLAUDE.md — the sync-a-copy problem died with the dissolved artifact.

      - id: authoring-constitution.roadmap-stub
        labels: [boundary]
        class: advisory
        text: >-
          Producing `evolution-roadmap.md` (the improvement plan) is the roadmap cluster's
          job, not ported yet — reference `.mochiko/memory/evolution-roadmap.md` as a
          documented stub.

  - id: authoring-constitution.sec.inputs
    title: Inputs — the synthesis and the content sources
    intent: >-
      What authoring consumes, where its principle material comes from, and the gate on a
      missing input.
    rules:

      - id: authoring-constitution.ratified-synthesis-only
        labels: [fence, boundary]
        class: floor
        text: >-
          Governance is authored from a ratified session synthesis —
          `.mochiko/memory/governance-intent.md`, produced by the setup lead's
          interrogation session and confirmed by the user before authoring begins. The
          synthesis owns selection (which principles, with which waivers and modules);
          this skill owns formulation (wording, enforcement mechanics, surface routing).

      - id: authoring-constitution.content-source-bindings
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The content sources bind: the type-shelved principle deck
          (`references/catalog/`) · `references/ESSENTIAL-FLOOR.md` (the canonical four
          floor categories) · `references/COMPLIANCE-MODULES.md` (audit-evidence variants,
          attached via the synthesis's fact profile) ·
          `references/EMERGENT-CEILING-PATTERNS.md` (brownfield's existing-pattern
          library).
        pointer: "references/catalog/README.md"

      - id: authoring-constitution.missing-synthesis-stop
        labels: [fence]
        class: floor
        kind: gate
        when: {synthesis: absent}
        text: >-
          A missing synthesis means say so and stop — authoring without it reproduces
          exactly the producer-decides-selection failure the synthesis exists to prevent.

      - id: authoring-constitution.three-source-rule
        labels: [evidence]
        class: must
        text: >-
          Every principle's source is one of three per `references/catalog/README.md` —
          floor-asserted, deck-kept, or minted-tracing-to-elicited-intent — with every
          ruling recorded; a dropped card is a recorded ruling. Referenced, never
          restated.
        pointer: "references/catalog/README.md"

      - id: authoring-constitution.arbitrated-shelf-frame
        labels: [boundary]
        class: must
        text: >-
          The type shelves are arbitrated architecture opinion, dealt
          recommend-then-arbitrate — never asserted; the frame binds per
          `references/catalog/backend-service.md`. Referenced, never restated.
        pointer: "references/catalog/backend-service.md"

  - id: authoring-constitution.sec.artifact
    title: Artifact — the surface set's binding grammar
    intent: >-
      What the authored governance set is, how principles trace, route, and formulate, and
      the ownership fences on regeneration.
    rules:

      - id: authoring-constitution.no-constitution-file
        labels: [single-home]
        class: floor
        text: >-
          There is no `constitution.md` — governance lands on the surfaces Claude Code
          natively loads, each at its disclosure level.

      - id: authoring-constitution.surface-set-binding
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The surface set binds: the `CLAUDE.md` governance region (between
          `<!-- mochiko:governance:begin -->` / `<!-- mochiko:governance:end -->`) ·
          `.claude/rules/mochiko/*.md` scope-bound rules files · skill pointers ·
          `.mochiko/memory/governance-ledger.md`.

      - id: authoring-constitution.every-principle-traces
        labels: [evidence]
        class: floor
        kind: duty
        text: >-
          Every authored principle carries its GI trace — on `CLAUDE.md` as an HTML
          comment beside the line, and always in the ledger as the
          `GI-XXX (floor-asserted: CARD-ID | deck-kept: CARD-ID | minted | module:
          <module>-<obligation>)` key, the canonical trace record.

      - id: authoring-constitution.realized-or-flagged
        labels: [evidence]
        class: floor
        text: >-
          Every principle-bearing synthesis element becomes a principle on some surface,
          or is surfaced as a flagged proposal — never silently dropped.

      - id: authoring-constitution.universal-routing
        labels: [artifact-grammar]
        class: must
        kind: routing
        text: >-
          Universal principles (governing every session's work) land as short imperative
          lines in the `CLAUDE.md` region — one to a few lines each, detail and metadata
          to the ledger; the always-on budget is the scarcest resource. Universal
          principles never route to unconditional rules files — rules delivery to spawned
          producers cannot be assumed, while `CLAUDE.md` is doc-confirmed for every spawn
          path.

      - id: authoring-constitution.scope-bound-routing
        labels: [artifact-grammar]
        class: must
        kind: routing
        text: >-
          Scope-bound principles land as a `paths`-scoped rules file under
          `.claude/rules/mochiko/` — one concern per file, operative rules in the body,
          `paths` globs covering every path whose code can violate the concern, tested
          with the per-layer violation test (worked reasoning and the kinako example: the
          template's Shape 2 preamble).

      - id: authoring-constitution.rules-inject-on-read-caveat
        labels: [artifact-grammar]
        class: must
        kind: duty
        when: {rules_file_in_set: present}
        text: >-
          Rules files inject on Read, not Write — whenever the set includes any rules
          file, emit the region's standing new-file read line, naming the actual scoped
          paths (Shape 1 carries the line and its observed-behavior wording).

      - id: authoring-constitution.procedure-shaped-routing
        labels: [artifact-grammar]
        class: must
        kind: routing
        text: >-
          Procedure-shaped standards route to a pointer at the skill that carries the
          procedure — the index line names it; mint a new skill only for a
          session-minted procedure.

      - id: authoring-constitution.two-modes-one-core
        labels: [artifact-grammar]
        class: must
        text: >-
          Two modes, one shared core authored once, identically, in both — greenfield
          formulates the synthesis's deck rulings and minted intents; brownfield codifies
          what already exists and requires `.mochiko/memory/codebase-analysis.md`
          (produced upstream by `analysis-codebase`). Floor cards are authored at the row
          the synthesis's declared depth level selects.

      - id: authoring-constitution.two-arm-schema-binding
        extends: authoring-common.two-arm-template
        class: must
        kind: binding

      - id: authoring-constitution.markers-only-regeneration
        labels: [fence]
        class: floor
        text: >-
          Regenerate only what sits between the governance markers — user content outside
          them is untouchable. Rules files and the ledger are setup-owned and regenerated
          whole, except the two preserved blocks.

      - id: authoring-constitution.preserved-blocks
        labels: [fence]
        class: floor
        text: >-
          The preserved blocks — the `mochiko:domain-registry` block and the
          `mochiko:output-style` switch line, plus any line the user added to the Shape-5
          output-style rules file — are read from the existing values and re-emitted
          unchanged; regenerating the defaults over them silently reverts the user's own
          settings. The style line is written default-on only when the region is first
          authored.

      - id: authoring-constitution.amend-preserves-verbatim
        labels: [artifact-grammar]
        class: must
        when: {mode: amend}
        text: >-
          Amend preserves untouched principles verbatim (their GI-IDs are stable) and
          bumps the region's semver; a `.mochiko/memory/constitution.md` on disk is
          superseded — the lead deletes it, never author into it.

      - id: authoring-constitution.three-part-rule
        labels: [artifact-grammar]
        class: floor
        text: >-
          Every principle carries three components, recorded in its ledger entry —
          Enforcement (how compliance is verified), Testability (what pass/fail looks
          like), Rationale (why the constraint exists); a principle without all three is
          incomplete and is not accepted.

      - id: authoring-constitution.enforcement-fits-team-reality
        labels: [evidence]
        class: must
        text: >-
          Enforcement MUST fit the team reality recorded in the synthesis — a solo
          project cannot lean on "code review MUST verify"; give it tooling and CI
          instead. Native surfaces are context, not enforcement — the teeth are CI,
          hooks, review, audit.

      - id: authoring-constitution.operative-constraint-only
        labels: [single-home]
        class: must
        text: >-
          The surface (region line or rules-file rule) carries the operative constraint
          only — RFC 2119 keywords, short, GI trace comment; the ledger carries the full
          Three-Part record keyed by GI-ID. Both shapes live in the `governance-surfaces`
          schema (the Shape 1 line, the Shape 3 record) and are never restated.

      - id: authoring-constitution.floor-categories-accounted
        labels: [artifact-grammar]
        class: floor
        text: >-
          Every governance set accounts for all four Essential Floor categories — with a
          principle or a recorded waiver; a floor category with neither is a defect in
          either mode. A `high`-only check absent at `low` is not a missing category —
          its category is still present through its other rows.

      - id: authoring-constitution.waivers-authored-not-skipped
        labels: [artifact-grammar]
        class: floor
        text: >-
          A waived standard gets a waiver record in the ledger — standard, justification,
          optional revisit trigger, trace; permanent pending the D4.1 revisit, and
          legal-mandate module obligations are never waivable (D4.2). Absence is always
          deliberate and auditable.

      - id: authoring-constitution.brownfield-ceiling-test
        labels: [evidence]
        class: must
        when: {mode: brownfield}
        text: >-
          Codify only patterns that are intentionally good — "Would I recommend this for
          a new project?"; if no, it is technical debt, not ceiling. A ceiling pattern no
          synthesis element sanctions is a flagged proposal, and ceiling principles trace
          like any other.

      - id: authoring-constitution.evolution-notes-always-brownfield
        labels: [artifact-grammar]
        class: must
        when: {mode: brownfield}
        text: >-
          The `evolution-notes` module attaches always in brownfield — future maintainers
          must be able to tell codified-existing-capability from aspirational
          MUST-implement targets; that distinction lives in its ledger section.

      - id: authoring-constitution.essential-floor-canonical-home
        labels: [single-home, artifact-grammar]
        class: must
        kind: duty
        text: >-
          The four floor categories' canonical definition and their MUST-address check
          sets live in `references/ESSENTIAL-FLOOR.md` — edited there, nowhere else;
          referenced, never restated.
        pointer: "references/ESSENTIAL-FLOOR.md"

      - id: authoring-constitution.depth-dial-breadth-invariant
        labels: [artifact-grammar]
        class: must
        text: >-
          The two-row `low`/`high` depth form and the breadth invariant bind per
          `references/ESSENTIAL-FLOOR.md` — referenced, never restated.
        pointer: "references/ESSENTIAL-FLOOR.md"

      - id: authoring-constitution.floor-doctrine
        labels: [artifact-grammar]
        class: must
        text: >-
          The floor doctrine binds per `references/catalog/universal-floor.md`: one
          project-wide depth level, user-declared, one-way `low`→`high`, no watcher; the
          `low` row sits on the retrofit-cost cut line. Referenced, never restated.
        pointer: "references/catalog/universal-floor.md"

      - id: authoring-constitution.floor-cards-content-sets
        labels: [artifact-grammar]
        class: must
        kind: duty
        text: >-
          The four FLOOR cards' two-row content sets and per-category waiver postures
          bind per `references/catalog/universal-floor.md` — authored at the declared
          level's row; referenced, never restated.
        pointer: "references/catalog/universal-floor.md"

      - id: authoring-constitution.module-mechanical-attachment
        labels: [artifact-grammar]
        class: must
        text: >-
          Compliance modules attach mechanically from the fact profile — fact-triggered,
          never from appetite — additive-only and level-blind, per
          `references/COMPLIANCE-MODULES.md`. Referenced, never restated.
        pointer: "references/COMPLIANCE-MODULES.md"

      - id: authoring-constitution.s4-fail-safe
        labels: [evidence]
        class: must
        kind: duty
        text: >-
          The S4 fail-safe binds per `references/COMPLIANCE-MODULES.md` — named
          elicitation, consequence-stated confirmation, the brownfield cross-check
          confronted in the open, the temporal backstop — and a compliance amend event is
          MAJOR. Referenced, never restated.
        pointer: "references/COMPLIANCE-MODULES.md"

      - id: authoring-constitution.domain-dependency-admissibility
        labels: [evidence]
        class: must
        text: >-
          Domain-dependency admissibility binds per
          `references/DOMAIN-DEPENDENCIES.md` — both criteria, domain-relevance filters
          first, the trust level cited, pointers re-verified never snapshots. Referenced,
          never restated.
        pointer: "references/DOMAIN-DEPENDENCIES.md"

  - id: authoring-constitution.sec.output
    title: Output — what every governance set ships
    intent: >-
      The mandatory content the set carries and the closure the validator checks.
    rules:

      - id: authoring-constitution.trace-summary-in-output
        labels: [reporting]
        class: must
        kind: duty
        text: >-
          The trace summary — the manifest mapping every GI element to its primary
          enforceable home plus companion entries, and every surface element back to its
          GI element — is emitted as part of the output, not as an afterthought; the
          independent validator grades trace closure over it.

      - id: authoring-constitution.index-and-ledger-closure
        labels: [evidence]
        class: must
        kind: duty
        text: >-
          Every principle, regardless of home, gets an index line in the region and a
          ledger entry (Three-Part + trace); index → home → ledger must close, and the
          validator checks it.

      - id: authoring-constitution.region-content-set
        labels: [artifact-grammar]
        class: must
        kind: duty
        text: >-
          The region carries: the ratified stamp (version · ratified date · floor ·
          declared depth level · attached modules, semver per the template's amendment
          policy — Shape 3) · the principle index (one line per principle, pointer to its home
          when the home is not the region) · the universal principles as short
          imperative lines, floor principles first and marked `(NON-NEGOTIABLE)`, each
          authored at the row the declared depth level selects (a `high`-only check is
          absent at `low`) · the technology stack from the synthesis's real-commands and
          existing-practices elements, brownfield populating from the codebase analysis.

      - id: authoring-constitution.quality-gates-actual-commands
        labels: [artifact-grammar, evidence]
        class: must
        kind: duty
        text: >-
          The quality-gates summary carries the blocking checks with actual commands,
          never placeholder tokens; coverage pre-seeds from the FLOOR-TEST card's
          threshold unless the session overrode it, and gates for waived categories are
          omitted — the waiver record covers the absence.

      - id: authoring-constitution.output-style-file-every-run
        labels: [artifact-grammar]
        class: must
        kind: duty
        text: >-
          One unconditional rules file ships every run, routed from no principle: the
          output-style rules file per the template's Shape 5, scoped over the
          deliverable-authoring paths — edit-time reinforcement of the register, never
          the carrier that reaches creates.

      - id: authoring-constitution.ledger-riders-and-trace-manifest
        labels: [artifact-grammar]
        class: must
        kind: duty
        text: >-
          The ledger ships its sections per the template's Shape 3, with the riders: the
          waiver table says "None." when nothing is waived · every waiver carries its
          recorded justification per the D4 model · legal-mandate module obligations are
          never waived (D4.2) · fact-profile changes (module attach/detach) and un-waives
          are governance events routed back through setup's amend mode.

  - id: authoring-constitution.sec.reserved
    title: Reserved — selection is never this seat's
    intent: >-
      Decisions the synthesis and the user own.
    rules:

      - id: authoring-constitution.no-unsanctioned-selection
        labels: [user-gate]
        class: floor
        text: >-
          No unsanctioned selection: never add, remove, merge, or reinterpret principles
          beyond the synthesis. A genuine problem — a contradiction, a missing principle
          the project clearly needs, elicited intent that resists enforceable
          formulation — becomes a flagged proposal (what you propose, why, and which
          synthesis element it touches), ruled on by the user at the acceptance gate;
          never a silent fix, never authored vagueness.

      - id: authoring-constitution.never-route-unselected-modules
        labels: [user-gate]
        class: floor
        text: >-
          Never route module content the synthesis didn't select — an unselected module
          attached "to be safe" is unsanctioned selection. Modules attach per the
          synthesis's module selections, their content routed by surface like everything
          else, and each module's validator checklist fragment applies to its routed
          content.

      - id: authoring-constitution.domain-dependency-growth-gate
        labels: [user-gate]
        class: must
        kind: gate
        text: >-
          Registry growth takes an explicit ruling BEFORE the entry per
          `references/DOMAIN-DEPENDENCIES.md` — the cycle checkpoint MUST NOT
          auto-approve while `domain_deps_added` is non-empty, and the registry lives
          only in the marked block, preserved verbatim. Referenced, never restated.
        pointer: "references/DOMAIN-DEPENDENCIES.md"
