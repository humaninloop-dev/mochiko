# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
kind: skill
skill: review-seat-plan
vars:
  verdict: PASS
sections:
  - id: review-seat-plan.sec.independence
    title: Independence — who grades a plan, and at what remove
    intent: >-
      The fresh peer the plan goes to, the persona it is spawned from, and the two ways the
      criteria reach it.
    rules:
      - id: review-seat-plan.author-grader
        class: floor
        extends: review-common.author-grader
      - id: review-seat-plan.fresh-peer-grader
        labels: [independence]
        class: floor
        kind: binding
        text: >-
          A seat's plan is graded by a fresh spawn of the same persona type as its author — a
          `staff-engineer` plan by a fresh `staff-engineer`, a `technical-analyst` plan by a fresh
          `technical-analyst` — never the author's own context, and never the lead. A producer
          spawned without a mochiko persona is graded by a fresh generic seat carrying this
          skill's render. `devils-advocate` is not a seat in this loop.
        anchor: 2026-09-03 producer-plan-enforcement D3
      - id: review-seat-plan.two-way-delivery
        labels: [binding]
        class: must
        kind: binding
        text: >-
          Delivery runs two ways at once: this skill is model-invoked by its description, and
          every grader brief names it besides, with the render pasted — the grader's persona
          varies, so the criteria cannot ride a persona's preloaded `skills:` list. Until the
          install refresh lands, the grader Reads the repo pair by path instead, and the run
          records which path that grade used.
        anchor: 2026-09-03 producer-plan-enforcement D4
  - id: review-seat-plan.sec.scope
    title: Scope — the plan before the work, not the artifact after it
    intent: What this skill grades, and the leg it adds to rather than replaces.
    rules:
      - id: review-seat-plan.plan-not-artifact
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          What is graded is the seat's plan, before its work is spent — never the artifact that
          plan describes. The grade is additive to the sound loop's leg 2 and never a substitute:
          the produced artifact is still graded by a non-author seat before the user's gate.
        anchor: 2026-09-03 producer-plan-enforcement D5
      - id: review-seat-plan.its-command-states-them
        class: must
        extends: review-common.its-command-states-them
      - id: review-seat-plan.never-excess
        class: must
        extends: review-common.never-excess
  - id: review-seat-plan.sec.inputs
    title: Inputs — the plan verbatim, and the tree behind its claims
    intent: How the plan reaches the grader, and what the grader must check itself.
    rules:
      - id: review-seat-plan.plan-verbatim
        labels: [fence, evidence]
        class: floor
        text: >-
          The plan reaches the grader as the seat's own verbatim text in the brief — never a
          summary, and never the author's report of it. The brief also names the seat's assigned
          scope and the other seats' declared write sets, which items 1 and 2 are graded against.
          The plan is persisted nowhere; that brief is the only home it has.
        anchor: 2026-09-03 producer-plan-enforcement D2
      - id: review-seat-plan.no-on-trust
        labels: [evidence]
        class: must
        kind: duty
        text: >-
          A claim the plan makes about the tree is checked against the tree: where the plan says
          something already exists, is already reused, or already carries a shape, the grader
          reads what the plan says it read. An on-trust claim is a finding under item 3, never a
          pass.
  - id: review-seat-plan.sec.verdict
    title: Verdict — default FAIL against seven items
    intent: The posture, the seven criteria, and who re-grades a revision.
    rules:
      - id: review-seat-plan.default-fail
        class: floor
        extends: review-common.default-fail
      - id: review-seat-plan.seven-items
        labels: [verdict]
        class: must
        kind: binding
        text: >-
          Seven items, 1 through 6 blocking and 7 advisory. (1) Scope fidelity — the plan covers
          exactly the brief's assigned scope (named gap, card, or deliverable); anything beyond,
          or anything owed and missing, fails it outright. (2) Write set declared — every path
          the seat will create or change is listed, disjoint from other seats' declared sets, none
          outside the brief's surfaces. (3) Reads named — where the plan claims something
          already exists or should be reused, it names what it read to know that; no on-trust
          claims. (4) Rung claims present — design seats: each design element carries its
          simplest-execution rung claim per `mochiko:patterns-plan-minimalism`, presence blocking
          and the claim's honesty advisory; builders: each task names the test it will write
          first. (5) Stops and hand-offs named — user-reserved questions appear as questions,
          never as decisions; the verification seat or `**TEST:**` gate the work hands to is
          named; the attempt bound is acknowledged. (6) No self-clearing step — no step where
          the seat grades, accepts, or lands its own output. (7) Size bound — a plan the grader
          cannot read in one sitting is a finding, never a FAIL.
        anchor: 2026-09-03 producer-plan-enforcement D5
      - id: review-seat-plan.fail-cites-fix
        labels: [verdict]
        class: must
        text: >-
          A FAIL cites the item it failed and gives the fix. A verdict naming no item and no fix
          is not something the seat can revise against, and is not a grade.
      - id: review-seat-plan.same-grader-regrades
        labels: [independence]
        class: must
        kind: binding
        text: >-
          After a FAIL the same grader seat re-grades the revision, resumed — it owns the fix
          list; a fresh grader only where that seat is gone. The re-plan bound, its shared
          counter, and the escalation past it belong to the dispatching command; they are
          referenced, never restated here.
        anchor: 2026-09-03 producer-plan-enforcement D6
  - id: review-seat-plan.sec.output
    title: Output — one line to the lead, and nothing persisted
    intent: The grammar the verdict lands in, and the layer it lands beneath.
    rules:
      - id: review-seat-plan.verdict-to-lead
        labels: [reporting, binding]
        class: must
        kind: binding
        text: >-
          The verdict returns to the lead in one grammar and nowhere else: `PLAN GRADE: <seat> ·
          PASS|FAIL · <items failed: fixes>`. The lead carries it into the close report's
          disclosure-line `plans:` segment. The plan itself is never written to disk, so this line
          and that segment are the whole of what survives the round.
        anchor: 2026-09-03 producer-plan-enforcement D2
      - id: review-seat-plan.verdict-is-input
        class: must
        extends: review-common.verdict-is-input
  - id: review-seat-plan.sec.reserved
    title: Reserved — the approval is the lead's, the second miss is the user's
    intent: The two dispositions no grader takes for itself.
    rules:
      - id: review-seat-plan.approval-is-the-leads
        labels: [user-gate]
        class: floor
        kind: reservation
        text: >-
          The approval is the lead's alone: it approves only on a PASS, and it may send a PASSed
          plan back with feedback on its own judgment. A second consumption of the re-plan bound
          goes to the user — re-plan again, re-staff, or narrow the scope — and is never the
          grader's call.
        anchor: 2026-09-03 producer-plan-enforcement D6
