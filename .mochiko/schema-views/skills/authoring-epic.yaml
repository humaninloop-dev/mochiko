# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
kind: skill
skill: authoring-epic
vars:
  artifact: epic
  grader: the cluster reviewers of the design-phase and implement runs that consume it
sections:
  - id: authoring-epic.sec.independence
    title: Independence — never grades its own output
    intent: Who grades what the epic run produces.
    rules:
      - id: authoring-epic.independent-grade
        class: must
        kind: routing
        extends: authoring-common.independent-grade
  - id: authoring-epic.sec.scope
    title: Scope — the epic object and nothing else
    intent: What this skill single-sources, and the jurisdiction lines away from it.
    rules:
      - id: authoring-epic.single-sources-epic-shape
        labels: [single-home, boundary]
        class: must
        text: >-
          This skill single-sources the epic's shape — the manifest and spine files, the
          mint/overlap guard, and close semantics; the commands that consume it (`implement`,
          `feature`, `specify`) reference this skill and never restate it.
      - id: authoring-epic.map-grammar-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          The `[EPIC-XXX]` row marker and within-epic seam-owner bookkeeping are
          `mochiko:authoring-feature-map`'s — this skill names the seam owner in the spine, the
          map writes it.
      - id: authoring-epic.run-mechanics-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Gate shapes, cycle sequencing, and landing steps live in `implement.md` — this skill
          authors the epic object and single-sources only what the run consumes.
      - id: authoring-epic.transport-routing
        labels: [boundary, floor-pointer]
        class: must
        kind: routing
        text: >-
          Worktree isolation vs single pen-holder is `mochiko:patterns-transport-floor`'s
          composition steer — referenced, never restated.
        pointer: mochiko:patterns-transport-floor
      - id: authoring-epic.delta-batching-parked
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Batching delta-scope cards or non-feature product-lane work is a parked open thread —
          not epic scope.
      - id: authoring-epic.specify-proposes-never-mints
        labels: [boundary]
        class: must
        text: >-
          `/mochiko:specify` selection may propose an epic when one derivation spans capabilities
          — it never mints one.
  - id: authoring-epic.sec.inputs
    title: Inputs
    intent: Read duties this skill would carry before authoring.
    note: >-
      Deliberately empty — no input-side obligation exists at census grain (census-authoring
      §B: inputs 0).
    rules: []
  - id: authoring-epic.sec.artifact
    title: Artifact — the epic's binding grammar and write mechanics
    intent: Identity, the two faces, the spine's contents, and the mint discipline.
    rules:
      - id: authoring-epic.identity-grammar
        labels: [artifact-grammar]
        class: must
        text: Epic identity is `EPIC-XXX` — sequential, the same id family as `FEAT-XXX`.
      - id: authoring-epic.one-type-two-faces
        labels: [artifact-grammar]
        class: must
        text: >-
          One epic type, two faces — the manifest is the product view, the spine is the tech
          view the implement run consumes; there is no product/tech split into separate epic
          types.
      - id: authoring-epic.transient-role
        labels: [artifact-grammar]
        class: floor
        text: >-
          The epic's role is transient: at delivery the member rows fold into their capabilities'
          extents and the epic closes, while the directory persists as readable record — never
          as a living map layer. The map stays two-typed (durable capabilities + transient work
          rows); an epic is not a third type.
        anchor: 2026-08-14 multi-feature-plan-implement D3
      - id: authoring-epic.home-directory-is-registry
        labels: [binding, single-home]
        class: must
        kind: binding
        text: >-
          Home is `.mochiko/epics/EPIC-XXX/`; no separate epics index exists — the directory is
          the registry, and the `/mochiko:feature` desk lists it.
      - id: authoring-epic.design-phase-always-fires
        labels: [artifact-grammar]
        class: floor
        text: >-
          An epic run always fires the design phase for the joint spine — one design-phase plan
          over all members (spine artifacts + each member's artifact list) — whatever the
          sufficiency verdict said.
        anchor: 2026-08-26 plan-stage-utility D1
      - id: authoring-epic.one-signed-store-delta
        labels: [artifact-grammar, user-gate]
        class: floor
        text: >-
          The epic's joint architecture output is one signed store delta for the whole epic —
          rendered once, signed off once.
        anchor: 2026-08-19 product-architecture-schema D10
      - id: authoring-epic.seam-owner-named
        labels: [artifact-grammar]
        class: must
        text: >-
          Each cross-member seam names its owner explicitly in the spine — members land
          simultaneously, so no later-lander default applies; the assignment lives in the spine,
          and the map writes it at close.
        anchor: 2026-08-14 multi-feature-plan-implement D13
      - id: authoring-epic.ordering
        labels: [artifact-grammar]
        class: must
        text: 'Ordering: shared-foundation first, then in-epic dependency order.'
      - id: authoring-epic.member-deltas-stay-per-feature
        labels: [single-home]
        class: must
        text: >-
          Per-feature design deltas stay in each member's `.mochiko/features/FEAT-XXX/` dir,
          linked from the manifest — downstream machinery keeps reading the per-feature dirs it
          already reads.
      - id: authoring-epic.shared-baseline-single-pen-holder
        labels: [artifact-grammar, single-home]
        class: floor
        text: >-
          A product baseline touched by two or more members gets one joint delta authored in the
          spine under a single pen-holder; a baseline touched by one member keeps its per-feature
          delta. The landing folds each baseline exactly once — spine delta for shared
          baselines, feature delta otherwise.
        anchor: 2026-08-14 multi-feature-plan-implement D10
      - id: authoring-epic.transport-floor-binding
        labels: [binding, floor-pointer]
        class: must
        kind: binding
        text: >-
          The transport floor's composition steer governs every epic shared-write surface —
          spine files and shared baseline deltas: concurrent writers get worktree isolation or a
          single pen-holder, disclosed at run open.
        pointer: mochiko:patterns-transport-floor
      - id: authoring-epic.mint-once
        labels: [single-home]
        class: floor
        text: >-
          Mint-once: every workflow resolves `EPIC-XXX` by lookup — re-minting does not exist.
        anchor: 2026-08-14 multi-feature-plan-implement D4
      - id: authoring-epic.one-open-epic-per-pending-rows
        labels: [single-home]
        class: floor
        text: A feature's pending rows belong to at most one open epic at a time.
        anchor: 2026-08-14 multi-feature-plan-implement D4
      - id: authoring-epic.implement-resolves-by-lookup
        labels: [artifact-grammar]
        class: must
        text: An implement run resolves its `EPIC-XXX` by lookup and mints nothing.
        anchor: 2026-08-26 plan-stage-utility D4
      - id: authoring-epic.selection-scope-only
        labels: [artifact-grammar]
        class: floor
        text: >-
          Every member enters as selection scope — a spec-accepted selection or growth rows;
          delta-scope cards (bug/improvement deltas on delivered capabilities) cannot join an
          epic.
        anchor: 2026-08-14 multi-feature-plan-implement D11
  - id: authoring-epic.sec.output
    title: Output — the manifest and the close
    intent: What the epic emits and how it lands.
    rules:
      - id: authoring-epic.manifest-required-fields
        labels: [artifact-grammar]
        class: must
        kind: binding
        text: >-
          `manifest.md` carries: members — each `FEAT-XXX` linked to its
          `.mochiko/features/FEAT-XXX/` dir · status — `open` / `delivered` / `closed-partial`
          · the why-together line — the relatedness stated at the desk mint that opened it.
      - id: authoring-epic.close-semantics
        labels: [artifact-grammar]
        class: must
        kind: duty
        text: >-
          One acceptance landing executes each member's graduation batch plus the epic close: the
          `[EPIC-XXX]` markers vanish with the folded rows, the manifest is stamped `delivered`
          and dated, and the directory stays in place as record — no move, no trail file.
  - id: authoring-epic.sec.reserved
    title: Reserved — the desk's door, the user's rulings
    intent: Decisions no run takes on its own.
    rules:
      - id: authoring-epic.desk-only-mint-door
        labels: [user-gate, single-home]
        class: floor
        text: >-
          The `/mochiko:feature` desk owns the epic's life — mint, membership change, status
          view, close — and is the only mint door.
        anchor: 2026-08-26 plan-stage-utility D4
      - id: authoring-epic.overlap-surfaces-to-user
        labels: [user-gate]
        class: floor
        kind: reservation
        text: >-
          A mint resolves against open epics first: any membership overlap with an existing epic
          surfaces to the user — join it, or rule on the overlap — never a silent duplicate.
        anchor: 2026-08-14 multi-feature-plan-implement D4
      - id: authoring-epic.halt-disposition-user-owned
        labels: [user-gate]
        class: floor
        kind: reservation
        text: >-
          A member that exhausts its attempt bound or hits the no-progress stop halts
          member-scoped; the disposition — carve the member out (its rows return to `pending`,
          the epic continues, manifest status `closed-partial`) or hold the whole run — is
          reserved to the user, never the lead's: carve-out breaks the one-unit promise.
        anchor: 2026-08-14 multi-feature-plan-implement D7
