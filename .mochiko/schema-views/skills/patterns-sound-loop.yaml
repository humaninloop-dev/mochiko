# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
kind: skill
skill: patterns-sound-loop
conditions:
  trigger:
    values: [fired, clear]
    resolution: entry-derived
    note: >-
      fired = both parts of the two-part test true of the output about to be produced
      (judgment-authored AND governing surface); clear otherwise.
  stakes:
    values: [money, data, security, availability, wrong-answer, cosmetic]
    resolution: entry-derived
    note: >-
      the harm class of the run's product work, or of the product work a planning output steers
      — specify's spec and its map delta, the feature desk's map writes, the architecture desk's
      store writes — the worst kind of thing that breaks if it is wrong. Proposed with its cited
      line by the command's entry grading seat where it has one, else by the lead; raised never
      lowered by the lead or the planning quick reader; ruled by the user at the command's
      existing confirmation point. Absent where the reviewed object is neither — governance
      surfaces, brainstorm records, plugin primitives and the other surfaces
      `patterns-sound-loop.kind-keyed-library-wide` names.
sections:
  - id: patterns-sound-loop.sec.trigger
    title: Trigger — two parts, no size threshold
    intent: >-
      When the floor fires, the door-independence of the test, and the surfaces its second part
      reads.
    rules:
      - id: patterns-sound-loop.two-part-trigger
        labels: [trigger]
        class: floor
        kind: gate
        text: >-
          The floor fires when both are true of the output about to be produced: (1)
          judgment-authored — producing it required real judgment; (2) governing surface —
          downstream work will read it as truth. Both true, the three legs are obligatory; either
          false, lead-inline freedom stands as chartered. There is no size threshold: a small
          judgment-authored write on a governing surface trips the floor as surely as a 10-file
          rewrite — magnitude never gates it. Stakes, a harm kind, never gates it either: it
          keys the depth of the legs after the trigger fires, never whether they fire
          (`patterns-sound-loop.stakes-band`).
        anchor: 2026-08-13 charter-ritual-balance
      - id: patterns-sound-loop.kind-keyed-library-wide
        labels: [trigger]
        class: must
        text: >-
          The floor is kind-keyed and library-wide: any session, any command, whatever door the
          work entered through. The stakes key and band bind product-run reviews and the reviews
          of three planning outputs — `/mochiko:specify`'s spec and its map delta,
          `/mochiko:feature`'s map writes, `/mochiko:architecture`'s store writes; a store write
          made inside `/mochiko:implement`'s design phase follows implement's run stakes. Every
          other review whose object is not product work — a plugin primitive, a governance
          surface, a brainstorm record, a product baseline, an epic, `gates.md`, an operating doc,
          crate code, a migration — has no harm class and no band, and runs in its fixed form;
          the gate jobs keep theirs.
        anchor: 2026-08-13 charter-ritual-balance
      - id: patterns-sound-loop.governing-surface-table
        labels: [trigger, binding]
        class: must
        kind: binding
        text: >-
          Governing surfaces and their per-member regime — plugin primitives
          (`plugins/mochiko/`): the primitive-edits ceremony (strip → record → author≠grader
          audit), no net-new obligation · product code: `/mochiko:implement` seats, none · specs
          (`.mochiko/specs/`): the `/mochiko:specify` loop, none · governance surfaces: the
          `/mochiko:setup` loop, none · capability map (`FEATURES.md` + entries): specify-side
          derivation graded, desk-side writes carried no loop — full floor, net-new bite ·
          product baselines (the rest of `.mochiko/product/`): no loop outside pipeline runs —
          full floor, net-new bite · architecture store (`.mochiko/product/architecture/`): desk
          judgment writes take the tech-lead review leg, a design phase's `proposed` writes graded
          by the design review pair beneath the user's sign-off
          (`mochiko:authoring-architecture-store`); full floor satisfied by the desk's own loop
          where it runs — the bite is any store write outside it.
        pointer: mochiko:authoring-architecture-store
        anchor: 2026-08-13 charter-ritual-balance
      - id: patterns-sound-loop.stakes-key
        labels: [trigger, binding]
        class: must
        kind: binding
        text: >-
          The stakes key is the harm class of the run's product work: the worst kind of thing that
          breaks if the run is wrong, read at run-open from one cited line, from a closed list —
          money · data (loss or corruption) · security (or trust) · availability ·
          wrong-answer (shown) · cosmetic. A planning output borrows the class of the product
          work it steers, with no list of its own: a spec takes its feature's class, read from its
          own spec lines — at specify's intent confirm, before any spec line exists, from the
          confirmed intent synthesis that lands verbatim as the spec's Intent section; a
          feature-map or architecture-store change takes the highest class among the capabilities
          or store elements it touches, a harm read and never a row count; where one review grades
          two outputs, as specify's stress-test grades the spec and its map delta, the higher
          label governs. The command's entry grading seat proposes it where the command has one,
          the lead where none exists; the lead carries it to the run-open line — on a planning
          output, the command's existing confirmation point — and may raise it, never lower it;
          the planning quick reader may raise it; no seat lowers it; the user rules it. Where no
          line can be cited, the class reads as money, data or security — the band where nothing
          thins. The key is never a count of files, cards, rows, gaps or users. The word is
          "stakes": the governance `depth` dial keys code standards and is never read to size
          process.
        anchor: 2026-10-27 implement-lead-adaptive-rigor D3
      - id: patterns-sound-loop.stakes-band
        labels: [trigger, ladder]
        class: must
        text: >-
          The class sets the band. Money, data, security: no step outside the floor thins,
          whatever any probe says. Availability, wrong-answer, cosmetic: any `class: must`
          verification step the command keys on `stakes` may thin, and only the four non-leg steps
          — the gap-finding pass, the design audit, the code-minimalism lens, the design-stage
          blind list — may be skipped, stated; each on a clean cold smoke, per the plan the user
          ruled at run-open, the smoke's procedure `mochiko:testing-end-user`'s. Stakes keys the
          depth of the legs after the trigger fires, never whether they fire: a review leg thins,
          never vanishes. The standard thin plan (`references/STANDARD-THIN-PLAN.md`) is the
          worked example the lead cites by name in the run-open line instead of inventing one —
          an example, never a menu. On the three planning outputs there is no smoke precondition,
          since a document has nothing to run: at availability, wrong-answer or cosmetic the full
          review may take the planning quick read (`patterns-sound-loop.planning-quick-read`) and
          the command's blind list may be skipped, each stated, the cited label line standing
          where a smoke result would; the plan check lightens, never vanishes.
        when: {stakes: [money, data, security, availability, wrong-answer, cosmetic]}
        pointer: references/STANDARD-THIN-PLAN.md
        anchor: 2026-10-27 implement-lead-adaptive-rigor D5
  - id: patterns-sound-loop.sec.scope
    title: Scope — the door moves, the ritual never drops
    intent: How out-of-remit demands are hosted without lowering the floor.
    rules:
      - id: patterns-sound-loop.out-of-remit-hosting
        labels: [boundary]
        class: must
        text: >-
          When the user explicitly asks a command to host work outside its key responsibilities,
          it adapts rather than refuses: it names the boundary crossing, then serves the demand
          with the home command's rituals imported — the three legs at minimum. Adaptation moves
          the door, never lowers the ritual.
        anchor: 2026-08-13 charter-ritual-balance
  - id: patterns-sound-loop.sec.discipline
    title: Discipline — the legs, the exemptions, the wiring
    intent: The producing and reviewing legs, the exact exemption set, and who sits where.
    rules:
      - id: patterns-sound-loop.leg-1-seat-produces
        labels: [ladder, independence]
        class: floor
        text: >-
          Leg 1 — production sits with a seat, never the lead: the producing seat plans first,
          read-only, in a plan-only dispatch, and stops; a fresh peer of its persona type grades
          the plan per `mochiko:review-seat-plan`; the lead approves only a passed plan and
          resumes the seat to work. The plan grade is additive to leg 2, never a substitute.
        when: {trigger: fired}
        anchor: 2026-08-13 charter-ritual-balance
      - id: patterns-sound-loop.leg-2-non-author-review
        labels: [ladder, independence]
        class: floor
        text: >-
          Leg 2 — independent review: the produced artifact is graded by a non-author seat
          before the user's gate; the user's ruling alone never substitutes for the review leg.
        when: {trigger: fired}
        anchor: 2026-08-13 charter-ritual-balance
      - id: patterns-sound-loop.exemptions-exactly-three
        labels: [boundary]
        class: must
        text: >-
          Only three kinds of write never trip the trigger: mechanical execution of an existing
          ruling · transcription of user decisions · fix-on-sight integrity repairs (typos,
          status agreement, dead pointers).
        anchor: 2026-08-13 charter-ritual-balance
      - id: patterns-sound-loop.store-carve
        labels: [boundary, evidence]
        class: must
        text: >-
          On the architecture store the exemption carve runs exactly down the middle of a landing:
          status flips and orphan cleanup are transcription and never trip, while the `As-built:`
          and `Drift:` writes are judgment and are graded — the natural mistake is to wave the
          whole landing through as bookkeeping.
        anchor: 2026-08-19 product-architecture-schema
      - id: patterns-sound-loop.no-delta-card-exemption
        labels: [boundary]
        class: floor
        text: >-
          There is no delta-card exemption: every desk-authored delta card — bug and improvement
          alike — takes the review leg at the desk before dispatch. The review leg only: card
          authorship stays with the desk.
        anchor: 2026-08-13 charter-ritual-balance
      - id: patterns-sound-loop.default-seat-wiring
        labels: [binding, independence]
        class: must
        kind: binding
        text: >-
          Default seat wiring — map work (capability map): `product-manager` produces,
          `devils-advocate` reviews · architecture / baseline touches: `principal-architect`
          produces, `tech-lead` reviews · desk delta cards: desk-authored (review leg only),
          `devils-advocate` reviews · specs and product code: existing command wiring, unchanged.
          The lead may swap personas for cause — disclosed at close.
        when: {trigger: fired}
        anchor: 2026-08-13 charter-ritual-balance
      - id: patterns-sound-loop.map-review-spec-less
        labels: [boundary]
        class: must
        text: >-
          Map review runs spec-less: capability tests per `mochiko:patterns-map-minimalism`,
          entry/delta legality per `mochiko:authoring-feature-map`, derivation honesty against
          whatever stories exist — no spec required.
        when: {trigger: fired}
        anchor: 2026-08-13 charter-ritual-balance
      - id: patterns-sound-loop.never-thins
        labels: [boundary, evidence]
        class: floor
        text: >-
          At any stakes, none of these thins or is skipped: the user's gates · outcome honesty,
          no output cleared by its author · the trail · one non-author read of the built thing
          before acceptance · the machine-checked record layer · every step that guards a shared
          record — the baseline diff review's mechanical legs, the built-vs-signed store diff,
          the landing verifier on any run that wrote a record, the sufficiency check at entry ·
          `**TEST:**` execution on real infrastructure · probe breadth. A code revert undoes
          code, never a shared record or a ruling taken from the user.
        anchor: 2026-10-27 implement-lead-adaptive-rigor D5
      - id: patterns-sound-loop.review-form-invariants
        labels: [independence]
        class: floor
        text: >-
          For the input-job reviews of a run's product work — implement's cycle grades, its
          final validation, the design phase's drafts, and the same job in any command that
          reviews product work — the form is the lead's per run, named in the run-open line,
          bound by five invariants: (1) the reader never authored what it reads; (2) it reads the
          surface itself, never the author's report; (3) it starts at FAIL; (4) it runs at or
          above the tier the work was produced at, its model named on the spawn; (5) where the
          form is a blind hunt, the reader stays blind — the two-message dispatch, nothing of
          the author's reasoning in its brief. The input jobs `author-grader-consolidation` D8
          names keep its conditions besides — save the completed-hunt rule the planning quick
          read drops — and nothing else binds the form. Invariants (1)–(4) bind the planning
          quick read as well, whose form is fixed by `patterns-sound-loop.planning-quick-read`,
          never the lead's free pick. The gate jobs keep their fixed forms: the primitive-edit
          audit and setup's governance validation. Named forms — a cold pair review, one blind
          seat solo, a delta read of the changed surface, the smoke probe, a plan-QA leg — are
          examples, never a menu; a form the lead invents is legal when it meets the five and is
          named in the line.
        anchor: 2026-10-27 implement-lead-adaptive-rigor D4
      - id: patterns-sound-loop.raise-free-lower-ruled
        labels: [ladder, user-gate]
        class: must
        text: >-
          Raising rigor is always free and needs no line. After run-open the read moves up on
          in-run evidence — a consumed attempt, a failed gate, a deviation, a money, data or
          security surface found in the diff, which voids the thinning outright — by the lead's
          own hand; it never moves down except by the user's checkpoint ruling.
        anchor: 2026-10-27 implement-lead-adaptive-rigor D2
      - id: patterns-sound-loop.planning-quick-read
        labels: [independence, evidence]
        class: floor
        text: >-
          On the three planning outputs `patterns-sound-loop.kind-keyed-library-wide` names, a
          change ruled availability, wrong-answer or cosmetic may skip the full review — the
          completed open hunt of specify's stress-test, of the feature desk's card grade, of the
          architecture desk's store grade — and takes the planning quick read in its place: one
          read, before the user rules, by a seat that authored none of the change, of what the run
          wrote, a new output read whole. It keeps every hard check of the full review it replaces
          and every check that guards the record — the prototype walk and its drift check on a
          UX-bearing feature, the agreement of spec, stories, derivation and map delta, the joined
          IDs, sameness of meaning against the visit file — and drops only its open hunt — in
          specify, the hunt for missing requirements, ambiguities and edge cases — which it
          reports as "open hunt not run", never as "no gaps". Invariants (1)–(4) of
          `patterns-sound-loop.review-form-invariants` bind it. Its reader may raise the label
          when the change touches a money, data or security surface: the raise voids the skip and
          the full review runs, while a blind list already skipped is not re-run, the full
          review's open hunt covering missing journeys. Each command's grading rule names its own
          hard checks.
        anchor: 2026-10-28 stakes-non-product-surfaces D1
  - id: patterns-sound-loop.sec.inputs
    title: Inputs
    intent: Read duties this floor would carry before it fires.
    note: >-
      Deliberately empty — the floor obligates no read before it fires; the trigger evaluates
      the write at hand (census-patterns §B: SL rows 1–14).
    rules: []
  - id: patterns-sound-loop.sec.disclosure
    title: Disclosure — the pinned line and its honesty rule
    intent: The one line every close report carries, and who may be named in it.
    rules:
      - id: patterns-sound-loop.disclosure-line
        labels: [reporting]
        class: must
        kind: duty
        text: >-
          Every visit/run close report carries one line, pinned grammar: `floor: tripped|clear ·
          seats: <who produced> / <who reviewed> · plans: <seat>:PASS|FAIL(n)[ dirty]… ·
          stakes: <class>|n/a · thinned: <step>(<cover>)…|none`. The `plans:` segment carries
          one entry per producing seat — `n` the re-plan rounds consumed on the run's one shared
          counter, and `dirty` appended where the seat changed the tree while planning. The
          `stakes:` segment carries the ruled harm class, `n/a` only where the reviewed object is
          neither product work nor one of the three planning outputs
          `patterns-sound-loop.kind-keyed-library-wide` names; the `thinned:` segment names each
          step thinned or skipped with what still covered its failure kind, `none` where nothing
          thinned. When clear: `floor: clear` alone — no seats, plans, stakes or thinned
          segment, since no seats existed to name.
        anchor: 2026-08-13 charter-ritual-balance
      - id: patterns-sound-loop.only-real-seats
        labels: [reporting, evidence]
        class: floor
        text: >-
          A report may only name a seat that actually existed; otherwise the lead speaks as
          itself. The known under-classification risk — calling judgment work "mechanical" to
          stay inline — is what the disclosure line makes auditable, visit by visit.
        anchor: 2026-08-13 charter-ritual-balance
      - id: patterns-sound-loop.trail-of-lowerings
        labels: [reporting, evidence]
        class: floor
        kind: duty
        text: >-
          Every thinned or skipped step is proposed in the run-open line and recorded, one line
          per lowering, in the command's final report file — the step, the smoke result it rode
          on, and what still covers the failure kind. A thinning or skip not stated fails the run
          under the command's own fail rule. A raise needs no line.
        anchor: 2026-10-27 implement-lead-adaptive-rigor D1
  - id: patterns-sound-loop.sec.reserved
    title: Reserved — the user gate stays
    intent: The ruling layer the floor works beneath, never above.
    rules:
      - id: patterns-sound-loop.leg-3-user-gate-stays
        labels: [ladder, user-gate]
        class: floor
        kind: reservation
        text: >-
          Leg 3 — the user gate stays: rulings reserved to the user remain theirs; the floor
          adds review beneath the gate, never a machine gate above it.
        when: {trigger: fired}
        anchor: 2026-08-13 charter-ritual-balance
      - id: patterns-sound-loop.user-rules-the-plan
        labels: [user-gate]
        class: floor
        kind: reservation
        text: >-
          The stakes read, the review form and the plan of thinnings are the user's ruling at the
          command's existing run-open confirmation — one line on it, never a new gate. A
          lowering after run-open is the user's checkpoint ruling, never the lead's alone.
        anchor: 2026-10-27 implement-lead-adaptive-rigor D2
