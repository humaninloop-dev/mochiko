kind: skill
skill: analysis-codebase
sections:
  - id: analysis-codebase.sec.independence
    title: Independence — none bound
    intent: Seat separations this producer would carry.
    note: >-
      Deliberately empty — the census records no independence obligation at D12 grain; grading
      the produced analysis is the consuming session's checkpoint, not a seat-split this skill
      owns.
    rules: []
  - id: analysis-codebase.sec.scope
    title: Scope — assess-status only, and the parked modes
    intent: >-
      The canonical-definition boundary, what is out of scope, and where the other modes live.
    rules:
      - id: analysis-codebase.essential-floor-canonical-definition
        labels: [boundary, floor-pointer]
        class: floor
        kind: binding
        text: >-
          The four Essential-Floor categories — Security, Testing, Error Handling, Observability
          — are defined canonically in
          `../authoring-constitution/references/ESSENTIAL-FLOOR.md`. Governance owns
          require-floor; this skill owns the other half, assess-status: detect each category's
          present / partial / absent state in the existing codebase, with file-cited evidence. Do
          not redefine the categories here — read the canonical definition, then assess against
          the indicators it carries.
        pointer: ../authoring-constitution/references/ESSENTIAL-FLOOR.md
        anchor: 2026-08-10 validator-scope-and-verbosity
      - id: analysis-codebase.collision-inventory-out-of-scope
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Collision detection and the JSON inventory are the spec/design-cluster Brownfield mode,
          not wired this run; the deeper collision-risk inventory is not produced here. For domain
          entities, locate where they live (models/, schema files, ORM annotations) and document
          what is found.
        anchor: 2026-08-26 plan-stage-utility D1
      - id: analysis-codebase.when-not-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Greenfield projects have no existing code to analyze — go straight to
          `mochiko:authoring-constitution`. Single-file scripts and documentation-only reviews
          take standard file reading; before the project directory exists there is nothing to
          analyze; skip analysis when the user already provided complete context (tech stack and
          patterns documented).
      - id: analysis-codebase.context-gathering-scope-note
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          The context-gathering sub-procedure runs inside Setup-Brownfield; the standalone
          Context-report mode lives in the constitution-context cluster and is not wired —
          findings land in `.mochiko/memory/codebase-analysis.md`, never a separate report file.
          Procedure: `references/CONTEXT-GATHERING.md`, referenced never restated.
        pointer: references/CONTEXT-GATHERING.md
  - id: analysis-codebase.sec.inputs
    title: Inputs — the deterministic layer
    intent: What the detection script settles and what stays model judgment.
    rules:
      - id: analysis-codebase.determinism-boundary
        labels: [evidence, boundary]
        class: must
        text: >-
          `detect-stack.sh` is the deterministic layer (pure `bash` + `jq`, reads project files,
          JSON to stdout — no kernel, no network); framework and architecture inference and the
          Essential-Floor assessment are the model-judgment layer on top. Keep the boundary
          explicit.
  - id: analysis-codebase.sec.verdict
    title: Verdict — the intent-blind status read
    intent: The present / partial / absent grammar and its posture.
    rules:
      - id: analysis-codebase.intent-blind-waiver-blind
        labels: [verdict]
        class: floor
        text: >-
          The assessment is intent-blind and waiver-blind by design. Report what IS — the same
          codebase gets the same status regardless of anything the session later rules.
        anchor: 2026-08-10 validator-scope-and-verbosity
      - id: analysis-codebase.never-soften-never-waive
        labels: [verdict]
        class: floor
        text: >-
          Do not soften an `absent` to `partial` because the project "is young", and do not mark a
          category "waived" — waivers are governance rulings, not codebase facts.
        anchor: 2026-08-10 validator-scope-and-verbosity
      - id: analysis-codebase.only-report-what-is-found
        labels: [verdict, evidence]
        class: must
        text: >-
          Only report what is found — no inventing findings, no documenting assumptions, no
          assuming a framework without code-pattern evidence.
        anchor: 2026-07-25 skill-succinctness-strip
  - id: analysis-codebase.sec.output
    title: Output — the analysis artifact and what it seeds
    intent: >-
      The deliverable's production binding, envelope, completeness set, and downstream consumer.
    rules:
      - id: analysis-codebase.deliverable-two-arm-binding
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The deliverable is `.mochiko/memory/codebase-analysis.md`, following the
          `codebase-analysis` schema — invoke `mochiko-cli template codebase-analysis`.
        anchor: 2026-08-16 schema-based-template-guidance D8
      - id: analysis-codebase.artifact-envelope-slimmed-legible
        labels: [binding, reporting]
        class: must
        kind: binding
        text: >-
          The artifact follows the deliverable envelope (`artifact-format.md`) slimmed but
          legible: findings in tables with file-cited evidence, one line per check; the judgment
          prose (strengths, recommendations) stays prose — the G2 gate reader needs it.
        pointer: ../../templates/artifact-format.md
      - id: analysis-codebase.brownfield-quality-checklist
        labels: [reporting, evidence]
        class: must
        kind: duty
        text: >-
          Before finalizing the analysis: project identity complete (name, language, framework,
          entry points) · directory structure documented with purposes · architecture pattern
          identified with evidence · naming conventions documented (files, variables, functions,
          classes) · all four Essential-Floor categories assessed present/partial/absent,
          file-cited · domain entities extracted with relationships · external dependencies
          documented · strengths to preserve identified (minimum 2–3) · inconsistencies
          documented with severity · recommendations provided for constitution focus · file
          paths cited for all findings · output written to
          `.mochiko/memory/codebase-analysis.md`.
      - id: analysis-codebase.capability-signals-seed-feature-map
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The extracted capability signals (routes, UI surfaces, services) seed setup's
          feature-map reconstruction — map machinery: `mochiko:authoring-feature-map`.
        pointer: mochiko:authoring-feature-map
  - id: analysis-codebase.sec.reserved
    title: Reserved — interpretation is the session's
    intent: What this analysis never decides.
    rules:
      - id: analysis-codebase.interpretation-reserved-to-session
        labels: [boundary]
        class: must
        kind: reservation
        text: >-
          Downstream, the setup session interprets the statuses against the asserted floor (an
          `absent` category becomes an open confrontation, resolved as a MUST-implement principle
          or a recorded waiver) — that interpretation belongs to the session and the
          constitution, never to this analysis.
        anchor: 2026-08-10 validator-scope-and-verbosity
