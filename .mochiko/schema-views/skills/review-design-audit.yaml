# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
kind: skill
skill: review-design-audit
conditions:
  ux_bearing:
    values:
      - 'yes'
      - 'no'
    resolution: entry-derived
    note: the spec's intent-stage UX-bearing ruling for the feature under validation.
sections:
  - id: review-design-audit.sec.independence
    title: Independence — the verification seat, never the builder
    intent: Who runs the lens and who never does.
    rules:
      - id: review-design-audit.author-grader
        class: floor
        extends: review-common.author-grader
      - id: review-design-audit.seat-qa-engineer
        labels: [independence]
        class: must
        kind: binding
        text: >-
          The lens runs on the verification seat, `mochiko:qa-engineer` — never the builder who
          wrote the UI and never the blind gap-finding seat, whose fence forbids code sight.
        pointer: mochiko:qa-engineer
        anchor: 2026-09-19 impeccable-design-integration D3
  - id: review-design-audit.sec.scope
    title: Scope — the design-audit lens only
    intent: Where the lens runs and the neighbouring lenses it never absorbs.
    rules:
      - id: review-design-audit.final-validation-ux-only
        labels: [boundary]
        class: must
        text: >-
          Runs once, at final validation, over a UX-bearing feature's built UI — identically at
          both depth levels; depth never adds or removes a leg.
        when: {ux_bearing: 'yes'}
        anchor: 2026-09-19 impeccable-design-integration D13
      - id: review-design-audit.not-critique
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Grading the built UI against the direction contract is the critique lens in
          `mochiko:testing-gap-finding`, on the blind seat — never this lens.
        pointer: mochiko:testing-gap-finding
      - id: review-design-audit.not-a11y-verification
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Verifying the accessibility standard of record is the audit lens's pass/fail legs —
          `**TEST:**` cases on the UX-bearing cards, executed by `mochiko:testing-end-user`; this
          lens originates no accessibility finding.
        pointer: mochiko:testing-end-user
        anchor: 2026-09-19 impeccable-design-integration D11
      - id: review-design-audit.not-test-execution
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          The pass/fail half of the audit — the UX-bearing cards' `**TEST:**` legs — runs
          through `mochiko:testing-end-user`; this lens originates findings only, and never
          re-runs a declared case.
        pointer: mochiko:testing-end-user
      - id: review-design-audit.not-code-minimalism
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Ladder discipline in the produced code is `mochiko:review-code-minimalism`, per cycle
          — never this lens.
        pointer: mochiko:review-code-minimalism
  - id: review-design-audit.sec.inputs
    title: Inputs — the standards and the running build
    intent: What the lens grades against and what it reads.
    rules:
      - id: review-design-audit.standard-binding
        labels: [binding, evidence]
        class: must
        kind: binding
        text: >-
          The standards are the spec's Screens & Flows Direction block and SCR/FLOW manifest, and
          the design baseline at `.mochiko/product/design/` — pointed at, never restated. Before
          the baseline holds a system part, the Direction block's declared tokens stand in.
      - id: review-design-audit.built-ui-real-infra
        labels: [evidence]
        class: must
        text: >-
          The lens reads the built UI running on real infrastructure, at the viewports the
          Direction block's Contract declares, plus the feature's code — never the prototype.
      - id: review-design-audit.legs-walked
        labels: [evidence, reporting]
        class: must
        kind: duty
        text: >-
          All four legs — performance, `harden`, `polish`, slop tells — are walked, or a leg's
          skip is stated with its reason; an unstated skip reads as a clean leg.
  - id: review-design-audit.sec.verdict
    title: Verdict semantics — advisory
    intent: What a finding is and what it can never do.
    rules:
      - id: review-design-audit.advisory-never-failing
        labels: [verdict]
        class: floor
        text: >-
          A `design-audit:` finding never fails a cycle or the final validation — advisory to
          the lead's checkpoint verdict.
        anchor: 2026-09-19 impeccable-design-integration D8
      - id: review-design-audit.baseline-divergence-drift
        labels: [verdict]
        class: must
        text: >-
          A value diverging from the design baseline is a finding carried to the landing fold as a
          `Drift:` candidate; the lens never writes the baseline.
        anchor: 2026-09-19 impeccable-design-integration D7
      - id: review-design-audit.evidence-per-finding
        labels: [evidence]
        class: must
        text: >-
          Every finding carries one line of evidence — a measured value, a screenshot path, or a
          file and line; a finding without evidence is dropped, never reported.
  - id: review-design-audit.sec.output
    title: Output — the findings block
    intent: The one shape findings leave in.
    rules:
      - id: review-design-audit.design-audit-entries-form
        labels: [reporting]
        class: must
        kind: binding
        text: >-
          One `design-audit:` entry per finding in the final-validation report: leg, the SCR-XXX
          or FLOW-XXX it sits on, one-line evidence. No findings — an empty block; never narrate
          a clean audit.
  - id: review-design-audit.sec.reserved
    title: Reserved — the lead's checkpoint, the user's ruling
    intent: Decisions this lens never takes.
    rules:
      - id: review-design-audit.verdict-is-input
        class: must
        kind: reservation
        extends: review-common.verdict-is-input
      - id: review-design-audit.disposition-at-checkpoint
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          The user rules each finding fix-now, backlog, or accept at the final checkpoint; the
          lens never fixes what it finds.
