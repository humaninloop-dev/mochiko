# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
kind: skill
skill: patterns-plan-minimalism
sections:
  - id: patterns-plan-minimalism.sec.trigger
    title: Trigger — the three firing sites
    intent: Where the ladder fires, and the shape of the epic site.
    rules:
      - id: patterns-plan-minimalism.three-firing-sites
        labels: [boundary]
        class: must
        text: >-
          The ladder fires at three generation-time sites inside the implement run's design phase:
          what the design phase authors — scoped to the sufficiency gap list, signed by the user
          at the design checkpoint — each producing seat's plan, and the epic joint design-phase
          plan.
        anchor: 2026-08-26 plan-stage-utility
      - id: patterns-plan-minimalism.epic-joint-plan-one-plan
        labels: [single-home]
        class: must
        text: >-
          The epic joint design-phase plan is one plan over all members — never per-member plans
          stitched together.
        anchor: 2026-08-26 plan-stage-utility
  - id: patterns-plan-minimalism.sec.scope
    title: Scope — what is not this ladder's jurisdiction, and who grades
    intent: The sibling routes away from the ladder, and the grading split over its claims.
    rules:
      - id: patterns-plan-minimalism.not-for-routes
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Not this ladder's jurisdiction: build-time code — the code-shaping ladder is
          `mochiko:patterns-code-minimalism`, downstream at card decomposition; a delta-scope run
          — no design phase fires by default, and its deliverable is the desk-confirmed delta
          card, already minimal.
      - id: patterns-plan-minimalism.grading-routing
        labels: [boundary, reporting]
        class: must
        kind: routing
        text: >-
          `mochiko:review-plan-artifacts` grades the disclosed rung claims at review —
          rung-honesty advisory, gap-list conformance blocking.
  - id: patterns-plan-minimalism.sec.discipline
    title: Discipline — the walk's binding rules
    intent: >-
      The stop rule, the rung scopes, and the floor bounds; the five rungs themselves are the
      body's sequenced procedure.
    rules:
      - id: patterns-plan-minimalism.stop-at-first-failing-rung
        labels: [ladder]
        class: must
        text: >-
          Per design element (component, entity, contract, mechanism, flow, constraint), stop at
          the first rung that fails, before it enters the package; descend only when the rung
          above genuinely holds, and say why in one line when it doesn't.
        anchor: 2026-08-12 plan-structure-yagni
      - id: patterns-plan-minimalism.rung-scope
        labels: [ladder]
        class: must
        text: >-
          Rungs 1, 4, and 5 apply to every element without exception; rungs 2 and 3 apply to
          design elements — shape and reuse are design judgments.
        anchor: 2026-08-12 plan-structure-yagni
      - id: patterns-plan-minimalism.rung-1-never-deletes
        labels: [ladder]
        class: floor
        text: >-
          Rung 1 never deletes a ratified requirement or an asserted floor obligation — the
          ladder removes speculation, never scope or safety.
        anchor: 2026-08-12 plan-structure-yagni
      - id: patterns-plan-minimalism.floor-both-ways
        labels: [ladder]
        class: floor
        text: >-
          The floor both ways: rung 1's "required" reads ratified requirements AND asserted floor
          obligations — production-floor categories, compliance-module obligations, and
          NFR-derived floor elements (security controls, error and data-loss handling,
          observability, accessibility). Strictness against speculation survives; the floor never
          enters the package through imagination, and never leaves it to reach a cheaper rung.
        anchor: 2026-08-12 plan-structure-yagni
  - id: patterns-plan-minimalism.sec.inputs
    title: Inputs — read before you claim
    intent: The read every reuse claim stands on.
    rules:
      - id: patterns-plan-minimalism.read-before-claim
        labels: [evidence, floor-pointer]
        class: must
        kind: duty
        text: >-
          A rung-2 or rung-3 claim is made only after reading the baselines and current state —
          never on trust; a reuse claim with no read behind it is not a rung stop. An adoptable
          proven component (per `mochiko:patterns-adopt-first`) satisfies rung 3's "already
          exists".
        pointer: mochiko:patterns-adopt-first
        anchor: 2026-08-15 build-vs-off-the-shelf
  - id: patterns-plan-minimalism.sec.disclosure
    title: Disclosure — the rung claim's grammar
    intent: How every rung stop is stated, and how silence reads.
    rules:
      - id: patterns-plan-minimalism.disclosure-grammar
        labels: [reporting]
        class: must
        kind: duty
        text: >-
          Every rung claim is disclosed where it fires, one line per element: `<element> — rung
          N (one-line why)` — the lead across what the design phase authors, each seat in its
          plan. An undisclosed element reads as rung-skipped at review.
        anchor: 2026-08-12 plan-structure-yagni
  - id: patterns-plan-minimalism.sec.reserved
    title: Reserved
    intent: Decisions no run takes on its own.
    note: >-
      Deliberately empty — no decision in this ladder is reserved above the run at census grain
      (census-patterns §B: PM rows 1–10).
    rules: []
