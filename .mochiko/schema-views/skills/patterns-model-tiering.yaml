# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
kind: skill
skill: patterns-model-tiering
sections:
  - id: patterns-model-tiering.sec.trigger
    title: Trigger — the class key
    intent: Which dispatch lane fires for each read class; the key both tiers ride.
    rules:
      - id: patterns-model-tiering.class-key-cheap-tier
        labels: [boundary]
        class: must
        text: >-
          Cheap tier — dispatch native `Explore` with `model: haiku`, disposable per gap: locate
          a file, symbol, config key, or line; enumerate a bounded, spot-checkable set (files,
          frontmatter values, pattern matches); targeted read of a named span, quoted verbatim;
          deterministic checks (stack detection, presence tests, exact-command output).
        anchor: 2026-08-16 model-tiered-seats
      - id: patterns-model-tiering.class-key-session-tier
        labels: [boundary, floor-pointer]
        class: floor
        text: >-
          Session tier — the dispatching seat reads it itself, or a strong seat does:
          interpretive reading (what a design implies, whether patterns conflict, what quality a
          surface has); any gap where absence would drive a decision — a weak negative that
          would mislead a producer stays on the strong tier; an enumeration whose completeness
          would drive a decision (the cheap tier takes only spot-checkable enumerations); and all
          producing, reviewing, and grading work — never tiered down (model-tiered-seats D5);
          the sound-loop floor (`mochiko:patterns-sound-loop`) governs those seats.
        pointer: mochiko:patterns-sound-loop
        anchor: 2026-08-16 model-tiered-seats
  - id: patterns-model-tiering.sec.scope
    title: Scope — dispatch tier only
    intent: The jurisdiction line away from the seat roster.
    rules:
      - id: patterns-model-tiering.rostered-seats-never-retier
        labels: [boundary]
        class: floor
        text: >-
          This floor governs dispatch tier only — rostered personas keep their declared models;
          retiering a rostered seat is deferred to its own reliability-gated brainstorm
          (model-tiered-seats D5), never done ad hoc.
        anchor: 2026-08-16 model-tiered-seats
  - id: patterns-model-tiering.sec.discipline
    title: Discipline — the cheap rung and the dispatch ladder
    intent: What makes a dispatch cheap, and the ladder every gap sits on.
    rules:
      - id: patterns-model-tiering.cheap-rung-explore-haiku
        labels: [binding]
        class: must
        text: >-
          The cheap rung is the native `Explore` agent spawned via the Agent tool with an explicit
          `model: haiku` override. The native agent inherits the session model when spawned bare,
          so a bare spawn is not cheap; and a plugin-scoped seat cannot be spawned from agent-team
          teammates, so the native agent is the only rung that resolves from every dispatcher
          (model-tiered-seats D4 as amended by the 2026-08-19 explorer-retarget ruling).
        anchor: 2026-08-19 explorer-retarget-native
      - id: patterns-model-tiering.dispatch-ladder
        labels: [ladder]
        class: must
        text: >-
          Direct tool call → cheap `Explore` (haiku) → session-tier read: each gap sits on the
          lowest rung where the answer can be trusted. A one-file read the dispatcher already
          knows the path of is a direct tool call, not a spawn; a sweep across many files is the
          cheap `Explore`; a judgment read is session tier. A spawn that costs more than the read
          it saves has failed the ladder.
        anchor: 2026-08-16 model-tiered-seats
      - id: patterns-model-tiering.disposable-per-gap
        labels: [boundary]
        class: must
        text: >-
          Disposable per gap — one gap per dispatch, discard after. Never a standing "librarian"
          seat: a standing seat re-pays its transcript across gate pauses (model-tiered-seats
          D4/F5).
        anchor: 2026-08-16 model-tiered-seats
      - id: patterns-model-tiering.override-is-the-pin
        labels: [binding]
        class: floor
        kind: duty
        text: >-
          The override is the pin — every cheap dispatch MUST pass `model: haiku` explicitly on
          the Agent tool call; a spawn without the override inherits the session tier and has
          failed this floor.
        anchor: 2026-08-19 explorer-retarget-native
  - id: patterns-model-tiering.sec.inputs
    title: Inputs — how cheap returns are read
    intent: What a cheap negative is worth, and when it re-routes.
    rules:
      - id: patterns-model-tiering.weak-negative-watch
        labels: [evidence]
        class: must
        text: >-
          A cheap "not found" is method-scoped ("not found by `<method>` over `<scope>`"), never a
          verdict of nonexistence; if that absence would drive a decision, the class key already
          routed it session-tier — re-route on sight.
        anchor: 2026-08-16 model-tiered-seats
  - id: patterns-model-tiering.sec.disclosure
    title: Disclosure — the brief and the return
    intent: What the dispatch brief pins, what comes back, and the line every seat brief carries.
    rules:
      - id: patterns-model-tiering.fact-finder-brief
        labels: [binding, evidence]
        class: must
        kind: binding
        text: >-
          The dispatch brief states the one gap and constrains the return: terse spot-checkable
          facts with `file:line` provenance, verbatim quotes never paraphrase, absence reported
          method-scoped, no interpretation. The brief carries this because the native agent has no
          persona pinning it.
        anchor: 2026-08-19 explorer-retarget-native
      - id: patterns-model-tiering.terse-return
        labels: [evidence, reporting]
        class: must
        text: >-
          The explorer returns the smallest decisive facts with `file:line` provenance; the bulk
          read stays inside the disposable context (the context-health test, model-tiered-seats
          D1).
        anchor: 2026-08-16 model-tiered-seats
      - id: patterns-model-tiering.brief-obligation
        labels: [reporting]
        class: floor
        kind: duty
        text: >-
          The lead carries this rule into every seat brief — one line directing the seat to
          route its own locate/enumerate reads to a native `Explore` subagent spawned `model:
          haiku` per this skill. Spawned teammates never load `skills:` frontmatter, so the brief
          line is the only channel that reaches them — a run whose seat briefs omit it has not
          applied this floor.
        anchor: 2026-08-16 model-tiered-seats
  - id: patterns-model-tiering.sec.reserved
    title: Reserved
    intent: Decisions no run takes on its own.
    note: >-
      Deliberately empty — the one reserved decision class (retiering a rostered seat) rides
      `patterns-model-tiering.rostered-seats-never-retier` in `sec.scope` (census-patterns §B: MT
      rows 1–11).
    rules: []
