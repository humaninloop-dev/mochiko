# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
kind: skill
skill: patterns-design-direction
sections:
  - id: patterns-design-direction.sec.trigger
    title: Trigger — once per UX-bearing spec, before the screens
    intent: When the direction is set, and when this skill does not fire.
    rules:
      - id: patterns-design-direction.fires-before-screens
        labels: [trigger]
        class: must
        text: >-
          Fires once per surface of a UX-bearing spec, before that surface's first story screen is
          drawn, and again only when a later story changes a surface's mode or world; a spec ruled
          not UX-bearing takes the waiver line and this skill does not fire.
        anchor: 2026-09-19 impeccable-design-integration D1
  - id: patterns-design-direction.sec.scope
    title: Scope — direction only, never the prototype, the build, or the accessibility standard
    intent: The sibling routes, the accessibility fence, and the baseline fence.
    rules:
      - id: patterns-design-direction.no-accessibility-content
        labels: [boundary, floor-pointer]
        class: floor
        text: >-
          This skill carries no accessibility content and restates no accessibility obligation.
          The standard of record is the Essential Floor line carried by
          `mochiko:patterns-code-minimalism`; a direction neither weakens nor restates it.
        anchor: 2026-09-19 impeccable-design-integration D11
      - id: patterns-design-direction.no-baseline-write
        labels: [single-home, fence]
        class: floor
        text: >-
          Nothing here writes `.mochiko/product/design/`. Mode and contract are per surface and
          live only in the spec's Screens & Flows; declared tokens are intent, and the baseline's
          design-system part is written from shipped code at landing, never from this block.
        anchor: 2026-09-19 impeccable-design-integration D7
      - id: patterns-design-direction.prototype-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Rendering the direction as screens and flows is `mochiko:authoring-prototype`; this
          skill decides the direction and never draws the prototype.
      - id: patterns-design-direction.craft-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Executing the direction at the edit is `mochiko:patterns-craft-floor`, loaded by the
          building seat; the Direction block written here is what it reads.
  - id: patterns-design-direction.sec.discipline
    title: Discipline — the design laws, the mode, and the checklist
    intent: >-
      The three laws, the per-surface mode, the checklist's walk, the evidence fence, and platform
      routing; the modes, the checklist items, and the folds are the body's procedure.
    rules:
      - id: patterns-design-direction.brief-wins
        labels: [single-home]
        class: floor
        text: >-
          The brief wins: pinned aesthetics, eras, materials, fonts, and palettes — from the
          stories, the Intent rulings, or the baseline's brand commitments — are honored even
          against a saturated-pattern warning. Redirecting a clear brief toward the designer's own
          taste is failure.
        anchor: 2026-09-19 impeccable-design-integration D3
      - id: patterns-design-direction.refinement-preserves
        labels: [boundary]
        class: must
        text: >-
          Refinement preserves; redesign replaces. A refinement keeps the incumbent identity,
          behavior, copy, and everything outside scope; a redesign keeps product truth, content,
          function, native affordances, and constraints and replaces the look outright — never
          polish on a discarded look.
      - id: patterns-design-direction.visual-authority-evidence
        labels: [evidence]
        class: must
        text: >-
          Visual authority is evidence, not a filename: an empty or absent design baseline does
          not make a product greenfield. The shipped UI, its tokens, and its assets are read
          first, and the Incumbent world field names preserve, expand, or replace on that
          evidence.
      - id: patterns-design-direction.mode-per-surface
        labels: [single-home]
        class: must
        text: >-
          The mode is chosen from the surface, never from the product — a tool's landing page is
          Persuade, its docs are Read — one mode per surface, named in that surface's Direction
          block.
      - id: patterns-design-direction.checklist-walked
        labels: [ladder]
        class: must
        kind: duty
        text: >-
          The shape checklist is walked every time — both rounds and the onboard, clarify, and
          adapt folds; an item that does not apply is marked n/a in one line, never skipped
          silently. Answers come from the stories, the Intent rulings, and the baseline first;
          only a material gap becomes a question, never an invented answer.
      - id: patterns-design-direction.evidence-fence
        labels: [fence]
        class: must
        text: >-
          Claims, testimonials, benchmarks, customers, and pricing are never invented where the
          baseline's evidence fence says the evidence is absent; illustrative content is labelled
          synthetic wherever a visitor could mistake it for the real thing.
        anchor: 2026-09-19 impeccable-design-integration D6
      - id: patterns-design-direction.platform-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Native guidance routes on the value in the `## Platform` section of the design baseline
          (`.mochiko/product/design/design.md`, truth part): `ios` loads `references/ios.md`,
          `android` loads `references/android.md`, `adaptive` loads both; `web` and `desktop`
          route none. An unrecognized value warns. With no baseline or no value, say "no platform
          value in the design baseline — no native guidance routed" and default nothing.
        anchor: 2026-09-19 impeccable-design-integration D6
  - id: patterns-design-direction.sec.inputs
    title: Inputs — what is read before the direction is chosen
    intent: The read duty, and where audience and purpose already live.
    rules:
      - id: patterns-design-direction.reads-first
        labels: [fence]
        class: must
        kind: duty
        text: >-
          Before choosing, read the design baseline at `.mochiko/product/design/` — its truth
          part (brand commitments, voice, principles, evidence fence, platform) and its system
          part where one exists — the spec's Intent rulings and stories, and the shipped UI
          where one exists. Audience and purpose are read where the intent stage and the product
          desk hold them, never asked again.
  - id: patterns-design-direction.sec.disclosure
    title: Disclosure — the Direction block
    intent: The one artifact this skill writes, and its fields.
    rules:
      - id: patterns-design-direction.direction-block
        labels: [artifact-grammar, binding]
        class: must
        kind: binding
        text: >-
          The output is one Direction block per surface the spec's screens serve — a surface
          being a route or artifact with a mode of its own — at the head of the spec's Screens &
          Flows, each headed `### Direction — <surface> (<SCR range>)` and carrying five fields,
          one line each: `Mode` (one of Persuade, Operate, Read, Experience) · `Register`
          (bolder, quieter, distill, or held, with its reason) · `Contract` (thesis · own world
          · story · first viewport · viewports — the surface's shipped viewports, declared
          here by the adapt fold and nowhere else) · `Declared tokens (intent)` (type, color,
          spacing, and motion named as intent, or "none — honors the baseline") · `Incumbent
          world` (preserve, expand, or replace, with its evidence). Its shape is the `spec`
          template's — render `mochiko-cli template spec`.
        anchor: 2026-09-19 impeccable-design-integration D3
  - id: patterns-design-direction.sec.reserved
    title: Reserved — decisions the designer never takes
    intent: What goes to the user as a question with its evidence.
    rules:
      - id: patterns-design-direction.replace-reserved
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          Replacing an incumbent visual world, and any claim beyond the evidence fence, is the
          user's ruling — surfaced as a question with its evidence, never decided by the
          designer.
