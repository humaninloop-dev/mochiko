# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
kind: skill
skill: review-sufficiency
vars:
  verdict: sufficient
conditions:
  scope:
    values: [selection, delta]
    resolution: entry-derived
    note: >-
      selection scope grades per selected work row; delta scope grades per delta card under the
      three-clause collapse.
sections:
  - id: review-sufficiency.sec.independence
    title: Independence — who is never whom
    intent: Author/grader separation for the sufficiency seat.
    rules:
      - id: review-sufficiency.author-grader
        class: floor
        extends: review-common.author-grader
        anchor: 2026-08-26 plan-stage-utility
  - id: review-sufficiency.sec.scope
    title: Scope — the grading unit
    intent: What one grade covers under each scope, and what collapses away under delta scope.
    rules:
      - id: review-sufficiency.unit-and-collapse
        labels: [boundary]
        class: must
        text: >-
          Selection scope grades per selected work row — the work row is the map's unit of
          scope. Delta scope grades per delta card, and only three clauses apply: criteria
          testable · touched surfaces identified (contract and data exposure) · store consult
          and trip check run.
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.clause9-delta-inapplicable
        labels: [boundary]
        class: must
        text: >-
          The delivered-feature exposure clause does not apply under delta scope — the desk's
          delta card is itself the `[MODIFY]` instrument, carrying the marked delta on the entry
          and folding at landing; a delta fix discovered structural re-fires the design phase
          rather than clearing here.
        when: {scope: delta}
        anchor: 2026-08-26 plan-stage-utility
  - id: review-sufficiency.sec.inputs
    title: Inputs — the read fence
    intent: What is read, what is never read, and the one carve the fence admits.
    rules:
      - id: review-sufficiency.fence-read-set
        labels: [fence, binding]
        class: must
        kind: binding
        text: >-
          Read the feature's `spec.md` (its Screens & Flows manifest included), the product
          architecture store, the product baselines (`data-model.md`, `contracts/`,
          `constraints-and-decisions.md`), and the capability map entries at
          `.mochiko/features/FEAT-XXX-<slug>.md`.
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.fence-never-reads
        labels: [fence]
        class: floor
        text: >-
          Never read the code, `tasks.md`, `**TEST:**` cases, cycle reports, or this batch's own
          `FEAT-XXX/` run-output directory — all are downstream of this verdict, and reading
          them makes the check circular.
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.clause10-carve
        labels: [fence]
        class: must
        kind: latitude
        text: >-
          An in-flight collision under the in-flight exposure clause licenses reading the
          colliding feature's design-phase deltas and owning spec — the sole run-output read the
          fence admits, scoped to the colliding surface, never extended to that feature's code,
          cards, or cycle reports.
        anchor: 2026-08-26 plan-stage-utility
  - id: review-sufficiency.sec.verdict
    title: Verdict — the clause set and its posture
    intent: >-
      The gate semantics, the ten clauses with their gap forms, and the floors that keep a grade
      honest.
    rules:
      - id: review-sufficiency.binding-gate
        labels: [verdict]
        class: must
        kind: gate
        text: >-
          A `sufficient` verdict licenses cards and build directly; any gap scopes the in-run
          design phase to exactly the named gaps, nothing else.
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.every-applicable-clause
        labels: [verdict]
        class: floor
        text: >-
          A unit is sufficient only when every applicable clause holds — a clause that cannot be
          graded is a gap, never a pass.
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.clause-testable-criteria
        labels: [verdict]
        class: must
        kind: duty
        text: >-
          Testable criteria — every acceptance scenario and SC-XXX has a stateable oracle. No
          stateable oracle = gap.
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.clause-contract-exposure
        labels: [verdict]
        class: must
        kind: duty
        text: >-
          Contract exposure — every touched API surface named, then graded against baseline
          `contracts/`: named-and-locatable (the baseline publishes a continuation point the
          surface attaches to) = no gap; named-and-unattachable (no seam exists to attach it) =
          gap.
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.clause-data-exposure
        labels: [verdict]
        class: must
        kind: duty
        text: >-
          Data exposure — every touched entity named, then graded against baseline
          `data-model.md` on the same locatable / unattachable split.
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.clause-structural-trigger
        labels: [verdict]
        class: must
        kind: duty
        text: >-
          Structural trigger — store consulted, trip check run, and either a no-delta claim
          recordable or a delta needed (gap). Spine elements whose `Derived from` cites the row's
          own feature or epic delta are excluded from the no-delta evidence: a row never satisfies
          this clause with its own planned structure.
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.clause-nfr-targets
        labels: [verdict]
        class: must
        kind: duty
        text: >-
          NFR targets — the applicable store concern rows identified and their targets stated.
          Targets absent = gap. A row plausibly bearing NFR load (user-facing latency, data
          volume, auth surface, availability) with no identifiable concern row = gap.
        when: {scope: selection}
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.clause-commodity-exposure
        labels: [verdict]
        class: must
        kind: duty
        text: >-
          Commodity exposure — any storage, queueing, caching, auth, search, or serialization
          need named and adopt-first answerable. A stated mechanism with no weighed alternatives
          is not resolved; unresolved = gap.
        when: {scope: selection}
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.clause-dependency-order
        labels: [verdict]
        class: must
        kind: duty
        text: Dependency order — in-batch row dependencies resolvable. Unresolvable = gap.
        when: {scope: selection}
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.clause-ux-trace
        labels: [verdict]
        class: must
        kind: duty
        text: >-
          UX trace — where the spec carries a Screens & Flows manifest: every FEAT-tagged
          SCR-XXX's data shown has a nameable serving contract surface, and every FLOW-XXX action
          a mutation path. Existing = cited; new = gap. No manifest = n/a.
        when: {scope: selection}
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.clause-delivered-feature
        labels: [verdict]
        class: must
        kind: duty
        text: >-
          Delivered-feature exposure — keyed on the row's status, never the capability's. A
          touched surface owned by a delivered row is never zero-gap: it auto-fires the design
          phase, its `[MODIFY]` amendment is named in this report, and the amendment is written as
          the marked delta on the affected feature's map entry.
        when: {scope: selection}
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.clause-in-flight
        labels: [verdict]
        class: must
        kind: duty
        text: >-
          In-flight exposure — keyed on the row's status. A touched surface owned by an
          in-flight row obliges reading that feature's deltas and owning spec: need covered →
          cite the planned contract, no gap · adjacent → gap, the design phase authors the
          proposed delta sequenced behind that delivery · conflicting → reserved to the user at
          run-open. No locks — conflict routing is a question to the user, never a hold on the
          touched feature; only silent contradiction is prohibited.
        when: {scope: selection}
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.absent-baseline
        labels: [verdict]
        class: must
        text: >-
          An absent baseline file grades its touched surfaces new (gap), never n/a. The design
          phase's first duty is then the seed: empty scaffolds where no code is delivered,
          reconstruct-and-confirm with the user at the design checkpoint where delivered code
          exists.
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.verdict-routing
        labels: [verdict]
        class: must
        kind: gate
        text: >-
          The verdict is binding at entry — a gap list routes to the design phase, zero gaps
          routes to cards and build.
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.default-fail
        class: floor
        extends: review-common.default-fail
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.na-justified
        labels: [verdict]
        class: floor
        text: >-
          Every clause graded, or flagged n/a with its justification — never silently dropped.
          The UX-trace clause's no-manifest n/a and the delivered-feature clause's delta-scope n/a
          are the only structural ones.
        anchor: 2026-08-26 plan-stage-utility
  - id: review-sufficiency.sec.output
    title: Output — the report contract
    intent: Where the verdict lands and what the report carries.
    rules:
      - id: review-sufficiency.report-binding
        labels: [reporting, binding]
        class: must
        kind: binding
        text: >-
          The verdict lands as `sufficiency-report.md` in the feature dir
          (`.mochiko/features/FEAT-XXX/`), under the `templates/report-format.md` envelope. It
          carries: the per-unit verdicts · the gap list, each gap keyed to its clause · the
          store-consult result and any no-delta claim · store trips awaiting the user's
          disposition at run-open · in-flight conflicts routed to the user · any `[MODIFY]`
          amendment naming · the `quickstart.md` null-path record where no real
          external-integration surface exists.
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.evidence-floor
        labels: [evidence]
        class: floor
        text: >-
          Verdict and dispositions land in the report — review evidence living only in
          conversation is a floor violation.
        anchor: 2026-08-26 plan-stage-utility
  - id: review-sufficiency.sec.reserved
    title: Reserved — decisions this seat never takes
    intent: What routes to the lead and what only the user rules.
    rules:
      - id: review-sufficiency.trips-user-ruled
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          A store trip — a touched row standing `open` or `not-now` — never becomes a gap. It
          rides the verdict report and is dispositioned by the user at run-open: warn and record;
          a recorded deferral is a legal escape, a silent skip is not.
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.disputed-clause-gap
        labels: [user-gate]
        class: floor
        kind: reservation
        text: >-
          A disputed clause defaults to gap and the dispute goes to the user; the grader never
          clears alone.
        anchor: 2026-08-26 plan-stage-utility
      - id: review-sufficiency.verdict-is-input
        class: floor
        kind: reservation
        extends: review-common.verdict-is-input
        anchor: 2026-08-26 plan-stage-utility
