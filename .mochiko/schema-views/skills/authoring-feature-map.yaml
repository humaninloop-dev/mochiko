# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
kind: skill
skill: authoring-feature-map
vars:
  template: features-index
  artifact: derivation and map delta
  grader: '`mochiko:review-specifications`'
sections:
  - id: authoring-feature-map.sec.independence
    title: Independence — author, never grader
    intent: Who grades the produced map artifacts, and never this seat.
    rules:
      - id: authoring-feature-map.independent-grade
        class: must
        kind: routing
        extends: authoring-common.independent-grade
  - id: authoring-feature-map.sec.scope
    title: Scope — the map's jurisdiction
    intent: What this skill authors, what it routes, and the altitude it never crosses.
    rules:
      - id: authoring-feature-map.stories-inform-never-define
        labels: [boundary]
        class: must
        text: >-
          Stories inform which capabilities exist and sharpen their extents; they never define
          them.
        anchor: 2026-08-13 pm-role-and-feature-derivation D1
      - id: authoring-feature-map.discipline-single-home
        labels: [boundary, floor-pointer]
        class: must
        kind: binding
        text: >-
          The derivation discipline — the capability tests, extend-beats-mint, the soft cap,
          merge mechanics, and domains — lives in `mochiko:patterns-map-minimalism`, referenced
          never restated; this skill authors what that discipline rules in.
        pointer: mochiko:patterns-map-minimalism
        anchor: 2026-08-13 pm-role-and-feature-derivation D4
      - id: authoring-feature-map.map-side-altitude
        labels: [boundary]
        class: must
        text: >-
          A work row is a map-side increment; the product-baseline deltas under
          `.mochiko/product/` (the appliable before/after form) are a different altitude —
          implement's surface, untouched here.
        anchor: 2026-08-10 feature-sizing-and-entry-points D9
      - id: authoring-feature-map.stories-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Authoring or rewriting user stories is `mochiko:authoring-user-stories`; entries trace
          stories by ID, and a story that fits no capability is a filter verdict, not a rewrite.
      - id: authoring-feature-map.architecture-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Architecture is not authored here — the entry links to the store's spine components
          and never restates the component view.
      - id: authoring-feature-map.backlog-boundary
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Defects, tooling, and process work live in `BACKLOG.md` where KM exists (a non-KM
          product has no queue; lane runs accept direct requests — the stated degrade path,
          never silently assumed away). Extent-growth improvement ideas are the exception: they
          ride the map as pending work rows or obligation lines — the map is the capability
          backlog.
        anchor: 2026-08-10 feature-sizing-and-entry-points D13
  - id: authoring-feature-map.sec.inputs
    title: Inputs — read before you build on it
    intent: The read duties owed before deriving against live or reconstructed territory.
    rules:
      - id: authoring-feature-map.in-flight-territory-read
        labels: [fence, evidence]
        class: must
        kind: duty
        text: >-
          In-flight territory obligates a read into the owning run's artifacts — build against
          the planned contract or escalate a conflict, never contradict silently.
        anchor: 2026-08-10 feature-map-layer D19
      - id: authoring-feature-map.reconstructed-reverify
        labels: [evidence]
        class: must
        kind: duty
        text: >-
          First touch of a reconstructed entry re-verifies it against the code before building on
          it.
        anchor: 2026-08-10 feature-map-layer D12
  - id: authoring-feature-map.sec.artifact
    title: Artifact — the map's binding grammar
    intent: The row types, invariants, write mechanics, and density the living map is held to.
    rules:
      - id: authoring-feature-map.letter-is-spirit
        class: floor
        extends: authoring-common.letter-is-spirit
        anchor: 2026-08-10 validator-scope-and-verbosity
      - id: authoring-feature-map.capability-work-row
        labels: [artifact-grammar]
        class: floor
        text: >-
          The map holds one surface, two row types. A capability is the durable entry — the only
          thing called a feature: what the product does, in the system's own language.
        anchor: 2026-08-13 pm-role-and-feature-derivation D2
      - id: authoring-feature-map.work-rows-transient
        labels: [artifact-grammar]
        class: floor
        text: >-
          A work row is a transient delivery increment under its capability — story-shaped
          allowed, never a standing feature; at its delivery landing it folds into the
          capability's extent and vanishes.
        anchor: 2026-08-13 pm-role-and-feature-derivation D2
      - id: authoring-feature-map.frame-first
        labels: [artifact-grammar]
        class: must
        text: >-
          Derivation is frame-first: before any story is drafted, the product frame names the
          capabilities the territory touches as a hypothesis — nouns and verbs only, never a
          list of stories — and stories are authored inside it; where a story and the frame
          conflict, the story wins and the frame adjusts.
        anchor: 2026-08-13 pm-role-and-feature-derivation D5
      - id: authoring-feature-map.one-living-map
        labels: [binding, single-home]
        class: must
        kind: binding
        text: >-
          There is one living map, no per-spec copy: a succinct repo-root `FEATURES.md` index —
          one line per capability, work rows as sublines — over per-capability entry files at
          `.mochiko/features/FEAT-XXX-<slug>.md`.
        anchor: 2026-08-10 feature-map-layer D5
      - id: authoring-feature-map.features-index-two-arm
        class: must
        kind: binding
        extends: authoring-common.two-arm-template
        anchor: 2026-08-16 schema-based-template-guidance D8
      - id: authoring-feature-map.feature-entry-two-arm
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The per-capability entry shape is the `feature-entry` schema: invoke `mochiko-cli
          template feature-entry`.
        anchor: 2026-08-16 schema-based-template-guidance D8
      - id: authoring-feature-map.four-touchpoints
        labels: [artifact-grammar]
        class: must
        text: >-
          The map has four touchpoints. Specify proposes — frame at intent, then confirm-frame,
          cut rows, filter, and selection after stories. The design phase confirms and hardens
          alongside architecture — on a zero-gap verdict, where no design phase runs, the
          card-authoring seat performs the dependency and extent assertion instead. Implement's
          acceptance landing folds delivered rows into extent — status and index edits are
          bookkeeping inside that landing, never a separate close stage. `/mochiko:feature`
          stewards — stub minting, retire, integrity grooming, and the growth door that cuts
          rows on existing capabilities.
        anchor: 2026-08-26 plan-stage-utility D1
      - id: authoring-feature-map.envelope-binding
        class: must
        kind: binding
        extends: authoring-common.envelope-binding
      - id: authoring-feature-map.map-density
        labels: [artifact-grammar]
        class: must
        kind: bound
        text: >-
          Capability statements run 1–3 lines; extent, work-row, and obligation entries one line
          each — a record, not an essay.
      - id: authoring-feature-map.one-home
        labels: [artifact-grammar, single-home]
        class: floor
        text: >-
          Exactly one home: every accepted story maps to exactly one capability; other
          capabilities it touches carry extend obligations on their entries — never a second
          home.
        anchor: 2026-08-13 pm-role-and-feature-derivation D2
      - id: authoring-feature-map.complete-disposition
        labels: [artifact-grammar]
        class: floor
        text: >-
          Complete disposition: every drafted story is either homed to a capability or rejected by
          the filter with the why recorded in the story file — no silent drops, no orphans.
        anchor: 2026-08-13 pm-role-and-feature-derivation D2
      - id: authoring-feature-map.row-level-closure
        labels: [artifact-grammar]
        class: floor
        text: >-
          Dependency closure runs at the row level: a selected work row must be buildable given
          only the rows ordered before it, per the map's relations; a row in one capability
          depending on a row in another orders those two capability-batch runs; no forward
          dependencies.
        anchor: 2026-08-13 pm-role-and-feature-derivation D7
      - id: authoring-feature-map.map-owns-status
        labels: [artifact-grammar, single-home]
        class: floor
        text: >-
          The map owns status. Capability status is `proposed / in-flight / delivered / retired`
          — one home, no copies; work rows carry a delivery state (`pending` / `live`), not a
          status of their own; story files derive status by following their FEAT-ID, and the only
          story-native status is `rejected`.
        anchor: 2026-08-13 pm-role-and-feature-derivation D2
      - id: authoring-feature-map.delivered-sticky-rows-fold
        labels: [artifact-grammar]
        class: floor
        text: >-
          Delivered is sticky; delivered rows fold. A `live` work row folds into its capability's
          extent at its delivery landing, then vanishes; a `pending` row persists on the entry as
          open obligation — deferred work never silently disappears; a `delivered` capability
          keeps its status while it carries live rows, the change riding on the row until its
          landing folds it — status never regresses.
        anchor: 2026-08-13 pm-role-and-feature-derivation D2
      - id: authoring-feature-map.retired-terminal
        labels: [artifact-grammar]
        class: floor
        text: >-
          `retired` is terminal: entry kept, dated, provenance intact — never deleted. An epic
          member's pending or live work row carries an inline `[EPIC-XXX]` marker that vanishes
          with the row at its graduation fold.
        anchor: 2026-08-10 feature-map-layer
      - id: authoring-feature-map.capability-writes-sacred
        labels: [artifact-grammar, user-gate]
        class: floor
        text: >-
          Capability writes are sacred: minting, merging, retiring, or changing a capability's
          status lands only through specify or a user grooming ruling, never as desk bookkeeping.
          Cutting work rows is delivery bookkeeping the desk may do; `/mochiko:feature`
          stewardship writes — stub minting, retire, grooming fixes — land directly.
        anchor: 2026-08-13 pm-role-and-feature-derivation D8
      - id: authoring-feature-map.acceptance-batch
        labels: [artifact-grammar]
        class: floor
        text: >-
          During a run, proposed entries and cut rows live in the spec workspace; the
          delivery-status write (in-flight flips, row folds) is one atomic batch at that work's
          acceptance landing, and a rejected spec never touched the map. Reads happen any time.
        anchor: 2026-08-10 feature-sizing-and-entry-points
      - id: authoring-feature-map.integrity-fix-on-sight
        labels: [artifact-grammar, evidence]
        class: floor
        kind: duty
        text: >-
          Map integrity is fixed on sight: no dangling FEAT-IDs; index lines and entry files agree
          on status; every work row names its spec or lane run; every `live` row or `in-flight`
          status points at an open spec or a live lane run — live from dispatch until its
          acceptance landing. A row whose run ended without folding, a closed spec still pointed
          at, and a specs-index row contradicting the map are defects.
        anchor: 2026-08-13 pm-role-and-feature-derivation D6
      - id: authoring-feature-map.entries-index-never-rewrite
        labels: [artifact-grammar, single-home]
        class: floor
        text: >-
          Entries index, never rewrite: story trace and SC references cite IDs; the spec's own
          sections stay the single source of their text.
        anchor: 2026-08-13 pm-role-and-feature-derivation D6
      - id: authoring-feature-map.growth-rides-work-row
        labels: [artifact-grammar]
        class: must
        text: Growth on a delivered capability rides a marked work row, never an in-place edit.
        anchor: 2026-08-13 pm-role-and-feature-derivation D8
      - id: authoring-feature-map.pre-acceptance-workspace
        labels: [artifact-grammar]
        class: must
        text: >-
          Pre-acceptance derivation is unratified thought — it stays in the spec workspace,
          never written to the live map.
        anchor: 2026-08-10 feature-map-layer D5
      - id: authoring-feature-map.phase-row-stands-alone
        labels: [artifact-grammar]
        class: must
        text: >-
          A work row cut as a phase must stand alone as a working increment, never a horizontal
          layer.
        anchor: 2026-08-10 pm-requirements-stacking
      - id: authoring-feature-map.stubs-are-hypotheses
        labels: [artifact-grammar]
        class: must
        text: >-
          Stubs are unratified hypotheses — never derive from stub text; derive from stories and
          let a match be confirmation. A pre-filled stub fakes ratification and anchors the
          deriver on unratified text.
        anchor: 2026-08-10 pm-requirements-stacking D2
      - id: authoring-feature-map.selectability-specify-only
        labels: [artifact-grammar]
        class: floor
        text: >-
          Selectability is specify-derivation-only; `/mochiko:feature` parks and grooms, never
          matures — no stub is matured or made selectable outside specify's derivation.
        anchor: 2026-08-10 pm-requirements-stacking D2a
      - id: authoring-feature-map.stub-dependency-unverified
        labels: [artifact-grammar, evidence]
        class: must
        text: >-
          A stub dependency is flagged-unverified judgment, never an asserted map relation —
          stubs have no shape to verify.
        anchor: 2026-08-10 pm-requirements-stacking D4
      - id: authoring-feature-map.sc-mapping
        labels: [artifact-grammar]
        class: must
        text: >-
          Every SC-XXX maps to a verifying capability; deferred SCs and one-sided seams ride the
          owning entry's Obligations line; within an epic, a cross-member seam's owner is the
          spine's design-time assignment (`mochiko:authoring-epic`), never the later-lander
          default.
        anchor: 2026-08-10 feature-map-layer D21
  - id: authoring-feature-map.sec.output
    title: Output — what leaves the seat
    intent: The acceptance batch and the selection card the derivation hands up.
    rules:
      - id: authoring-feature-map.acceptance-batch-specs-index
        labels: [reporting, binding]
        class: must
        text: >-
          The acceptance batch includes the specs-index row (`.mochiko/specs/index.md`), agreeing
          with the map.
      - id: authoring-feature-map.selection-card
        labels: [reporting]
        class: must
        kind: binding
        text: >-
          The selection card carries the recommendation, the deferred-SC list, a per-capability
          completeness line (pending rows · folded rows · deferred SCs), work rows grouped per
          capability, and ordering; territory-touching capabilities' parked stubs and pending rows
          are re-surfaced on the card.
        anchor: 2026-08-10 pm-requirements-stacking D3
      - id: authoring-feature-map.story-trace-provenance
        labels: [evidence, artifact-grammar]
        class: must
        text: Derivation-minted stubs carry story-trace provenance.
        anchor: 2026-08-10 pm-requirements-stacking D2a
  - id: authoring-feature-map.sec.reserved
    title: Reserved — the user's rulings
    intent: Decisions this seat never takes.
    rules:
      - id: authoring-feature-map.selection-user-ruling
        labels: [user-gate]
        class: floor
        kind: reservation
        text: >-
          Selecting which work rows build now is the user's ruling, always — this skill prepares
          the selection card and recommends.
        anchor: 2026-08-13 pm-role-and-feature-derivation D5
      - id: authoring-feature-map.escalation-never-forced-cut
        labels: [user-gate]
        class: floor
        kind: reservation
        text: >-
          A dependency-blocked row or stub escalates as a recommendation for the user — a row
          via asserted map relation, a stub via flagged-unverified judgment — never a forced
          cut.
        anchor: 2026-08-10 pm-requirements-stacking D4
