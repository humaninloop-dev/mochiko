# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
kind: skill
skill: patterns-code-minimalism
sections:
  - id: patterns-code-minimalism.sec.trigger
    title: Trigger — where the ladder fires
    intent: The one firing site, and what the ladder governs there.
    rules:
      - id: patterns-code-minimalism.fires-at-decomposition
        labels: [boundary]
        class: must
        kind: gate
        text: >-
          The ladder fires at build-time card decomposition (`mochiko:executing-tdd-cycle`, step
          2), before any red-phase test — it governs whether and how much code exists, not how
          the code that exists is written.
        anchor: 2026-08-05 ponytail-concepts-integration
  - id: patterns-code-minimalism.sec.scope
    title: Scope — what is not this ladder's jurisdiction
    intent: The sibling disciplines this ladder routes to and never absorbs.
    rules:
      - id: patterns-code-minimalism.not-for-routes
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Not this ladder's jurisdiction: inside red/green/refactor, the green-phase "minimum code
          to make the failing test pass" rule (`mochiko:executing-tdd-cycle`) is a different,
          later discipline; architecture-level topology sizing is
          `mochiko:patterns-system-design`'s judgment, upstream.
  - id: patterns-code-minimalism.sec.discipline
    title: Discipline — the walk's binding rules
    intent: >-
      The stop rule and the bounds no rung choice escapes; the seven rungs themselves are the
      body's sequenced procedure.
    rules:
      - id: patterns-code-minimalism.card-criteria-are-the-floor
        labels: [boundary]
        class: must
        text: >-
          The card's acceptance criteria are the floor of what to build — the ladder decides how
          cheaply to meet them, never whether to meet them; cutting scope from the card is not a
          rung.
      - id: patterns-code-minimalism.stop-at-first-rung
        labels: [ladder]
        class: must
        text: >-
          Stop at the first rung that applies; descend only when the rung above genuinely does not
          apply — and be able to say why, in one line, when it doesn't.
        anchor: 2026-08-05 ponytail-concepts-integration
      - id: patterns-code-minimalism.adopt-first-binding-constraint
        labels: [ladder, floor-pointer]
        class: must
        text: >-
          A design-committed adopt-first choice reaches these cards as a binding constraint, not a
          rung to re-open — the design-time discipline is `mochiko:patterns-adopt-first`.
        pointer: mochiko:patterns-adopt-first
        anchor: 2026-08-26 plan-stage-utility
      - id: patterns-code-minimalism.lazy-not-negligent
        labels: [ladder]
        class: floor
        text: >-
          Lazy, not negligent: no rung ever sacrifices a floor obligation (security, testing,
          error/data-loss handling, observability — the project's asserted Essential Floor) or
          accessibility (named explicitly because the floor carries no a11y card yet, pending the
          frontend shelf). Code is small because it is necessary, never golfed: a guard, a
          validation, an a11y attribute is rung-7 code that must exist — the ladder deletes
          speculation, not safety.
        anchor: 2026-08-05 ponytail-concepts-integration
      - id: patterns-code-minimalism.one-intensity
        labels: [ladder]
        class: floor
        text: >-
          The ladder ships at one strength — no off/lite/full/ultra dial exists. Per-project
          variance rides the recorded-waiver machinery, never a mode line.
        anchor: 2026-08-05 ponytail-concepts-integration
  - id: patterns-code-minimalism.sec.inputs
    title: Inputs — read before you rank
    intent: What is read before any rung is claimed.
    rules:
      - id: patterns-code-minimalism.rung-zero-read-before-rank
        labels: [evidence, floor-pointer]
        class: must
        kind: duty
        text: >-
          Rung zero: trace the real flow of the code being touched before rung 1 — rung 2 is
          unanswerable without having looked. Brownfield touches ride
          `mochiko:brownfield-integration` (the read-before-write procedure lives there, not
          here).
        pointer: mochiko:brownfield-integration
  - id: patterns-code-minimalism.sec.disclosure
    title: Disclosure — the rung claim and its grader
    intent: Where rung choices land and who grades them.
    rules:
      - id: patterns-code-minimalism.rung-disclosed-in-cycle-report
        labels: [reporting]
        class: must
        kind: duty
        text: >-
          The chosen rung per task is disclosed in the cycle report's decomposition, where the
          verification seat grades it against this skill (`mochiko:review-code-minimalism`).
        anchor: 2026-08-05 ponytail-concepts-integration
  - id: patterns-code-minimalism.sec.reserved
    title: Reserved — rulings the ladder never takes
    intent: Decisions that route to a ruling, never to a rung.
    rules:
      - id: patterns-code-minimalism.new-dep-not-a-rung
        labels: [user-gate, ladder]
        class: floor
        kind: reservation
        text: >-
          Adding a NEW dependency is not a rung — it rides the domain-registry ruling where the
          `DOMAIN-DEPENDENCIES.md` catalog applies, and is never auto-approved.
        pointer: ../authoring-constitution/references/DOMAIN-DEPENDENCIES.md
        anchor: 2026-08-05 ponytail-concepts-integration
