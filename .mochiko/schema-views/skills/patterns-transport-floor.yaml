# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
kind: skill
skill: patterns-transport-floor
conditions:
  messaging:
    values: presence
    resolution: surface-presence
    note: the run carries cross-seat or lead-relayed messaging.
  shared_write_surface:
    values: presence
    resolution: surface-presence
    note: two or more seats are able to write one artifact.
sections:
  - id: patterns-transport-floor.sec.trigger
    title: Trigger — two lanes, each non-waivable when it fires
    intent: When the floor's lanes fire, and what firing does.
    rules:
      - id: patterns-transport-floor.message-lane-trigger
        labels: [trigger]
        class: floor
        kind: gate
        text: >-
          The message lane fires on any multi-seat run with cross-seat or lead-relayed messaging
          — shared writes or not; a lead relaying a mid-flight ruling to a single recipient
          already trips it, and review-pair and cross-examination exchanges are message-lane
          territory. When it fires, the four message legs bind — the `when: {messaging:
          present}` rules of `patterns-transport-floor.sec.discipline`.
        when: {messaging: present}
        anchor: 2026-08-14 teammate-message-races
      - id: patterns-transport-floor.topology-lane-trigger
        labels: [trigger]
        class: floor
        kind: gate
        text: >-
          The topology lane fires when a shared write surface exists — two or more seats able to
          write one artifact. When it fires, the three topology legs bind — the `when:
          {shared_write_surface: present}` rules of `patterns-transport-floor.sec.discipline`.
        when: {shared_write_surface: present}
        anchor: 2026-08-14 teammate-message-races
      - id: patterns-transport-floor.neither-lane-waivable
        labels: [trigger]
        class: floor
        text: >-
          When a lane fires, its legs bind: the trigger scopes the obligation, and an untriggered
          run keeps its chartered freedom. Neither lane is waivable once fired — a lead cannot
          legally depart the floor mid-crisis, which is exactly the shape a waivable floor would
          sanction.
        anchor: 2026-08-14 teammate-message-races
  - id: patterns-transport-floor.sec.scope
    title: Scope — use, never the choice
    intent: The jurisdiction lines away from this floor.
    rules:
      - id: patterns-transport-floor.governs-use-never-choice
        labels: [boundary]
        class: must
        text: >-
          This floor governs transport use, never the neutral transport choice — a seat may be a
          teammate or a subagent, the lead's per-seat call (realignment D5). Sizing questions —
          whether an artifact should exist or how small it should be — belong to the three
          minimalism siblings, another axis.
        anchor: 2026-08-14 teammate-message-races
      - id: patterns-transport-floor.cross-session-cited-in-scope-only
        labels: [boundary]
        class: advisory
        text: >-
          Cross-session messaging is a different transport — neither delivery nor ordering is
          guaranteed; cite it only when cross-session work is in scope.
        anchor: 2026-08-14 teammate-message-races
  - id: patterns-transport-floor.sec.discipline
    title: Discipline — the seven legs and the platform floor
    intent: >-
      The binding legs, each carrying its lane, plus the version and ordering facts the floor
      designs around.
    rules:
      - id: patterns-transport-floor.composition-steer
        labels: [ladder]
        class: floor
        text: >-
          When a lead is about to compose concurrent writers on one surface, only two shapes are
          in-floor: worktree-isolated writers (isolation makes the surface non-shared) or one
          pen-holder seat with the other seats routing deltas to it. Any other composition is out
          of floor — re-shape at composition time, never police with use-discipline a shape that
          need not exist.
        when: {shared_write_surface: present}
        anchor: 2026-08-14 teammate-message-races D4
      - id: patterns-transport-floor.single-writer-per-surface
        labels: [ladder, single-home]
        class: floor
        text: >-
          Every artifact has exactly one seat holding the pen at any moment; pen hand-offs are
          explicit.
        when: {shared_write_surface: present}
        anchor: 2026-08-14 teammate-message-races
      - id: patterns-transport-floor.mesh-hold
        labels: [ladder]
        class: floor
        text: >-
          A received message is a hand-off, never a start signal; work starts on the lead's
          explicit open.
        when: {messaging: present}
        anchor: 2026-08-14 teammate-message-races
      - id: patterns-transport-floor.content-pinned-supersession
        labels: [ladder]
        class: floor
        kind: duty
        text: >-
          An order quotes the exact text it lands, and a superseding order names what it voids; no
          order asserts disk state or relies on message sequence.
        when: {messaging: present}
        anchor: 2026-08-14 teammate-message-races
      - id: patterns-transport-floor.quiesce-before-cold-grade
        labels: [ladder]
        class: floor
        text: A grader reads a declared-frozen state; writers hold until the verdict.
        when: {shared_write_surface: present}
        anchor: 2026-08-14 teammate-message-races
      - id: patterns-transport-floor.no-ritual-sends
        labels: [ladder]
        class: floor
        text: >-
          Idle-ping-with-queued-inbox is normal; a resend exists only as a supersession that names
          what it voids.
        when: {messaging: present}
        anchor: 2026-08-14 teammate-message-races
      - id: patterns-transport-floor.fan-in-confirmation
        labels: [ladder]
        class: floor
        kind: duty
        text: >-
          The lead counts expected deliverables and confirms each arrived before treating a
          fan-out complete or converging; an idle signal without its deliverable means pull the
          output, never assume it.
        when: {messaging: present}
        anchor: 2026-08-14 teammate-message-races
      - id: patterns-transport-floor.version-floor
        labels: [binding]
        class: floor
        kind: bound
        text: >-
          Agent-teams work assumes ≥ v2.1.224. Below it, `SendMessage` reported success when the
          write to a teammate's inbox had actually failed — masked-failure sends, fixed in the
          v2.1.224 changelog.
        anchor: 2026-08-14 teammate-message-races
      - id: patterns-transport-floor.ordering-undocumented
        labels: [evidence]
        class: must
        text: >-
          Teammate delivery is documented-automatic (send success = the mailbox write succeeded,
          ≥ v2.1.224); ordering is undocumented — design around it rather than trusting it.
          Doc anchor: the agent-teams best-practices ownership-split line — "Two teammates
          editing the same file leads to overwrites. Break the work so each teammate owns a
          different set of files" (code.claude.com/docs/en/agent-teams), which directly grounds
          `patterns-transport-floor.composition-steer` and
          `patterns-transport-floor.single-writer-per-surface`.
        anchor: 2026-08-14 teammate-message-races
  - id: patterns-transport-floor.sec.inputs
    title: Inputs — none bound
    intent: Surfaces read before the floor binds.
    note: >-
      Deliberately empty — the census records no pre-read duty for this member; the floor
      consumes the run's own composition facts, not a bound surface.
    rules: []
  - id: patterns-transport-floor.sec.disclosure
    title: Disclosure — none owed
    intent: Report and artifact bindings this floor would carry.
    note: >-
      Deliberately empty — this floor binds conduct, not a report grammar; no disclosure
      obligation exists at census grain.
    rules: []
  - id: patterns-transport-floor.sec.reserved
    title: Reserved — nothing left to reserve
    intent: Decisions no run takes on its own.
    note: >-
      Deliberately empty — non-waivability once fired leaves nothing seat-decidable to reserve,
      and no user gate exists at census grain.
    rules: []
