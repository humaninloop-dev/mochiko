# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
kind: skill
skill: patterns-craft-floor
sections:
  - id: patterns-craft-floor.sec.trigger
    title: Trigger — immediately before a UX-bearing edit
    intent: When the floor loads, and when it does not.
    rules:
      - id: patterns-craft-floor.loads-before-ux-edit
        labels: [trigger]
        class: must
        text: >-
          Loaded immediately before any edit on a UX-bearing cycle card — a card carrying
          `SCR-XXX` or `FLOW-XXX` trace — including small refinements; never for planning-only
          work, and not for a card with no UI trace.
        anchor: 2026-09-19 impeccable-design-integration D8
  - id: patterns-craft-floor.sec.scope
    title: Scope — procedure beside the code floor, never a direction of its own
    intent: The code floor this sits beside, the taste it never takes, and who grades.
    rules:
      - id: patterns-craft-floor.code-floor-in-view
        labels: [boundary, floor-pointer]
        class: floor
        text: >-
          `patterns-code-minimalism.lazy-not-negligent` stays binding at the same edit: the
          Essential Floor and the accessibility standard of record are defined there and in the
          compliance module, never here. This floor adds design bans beside them and never
          displaces or restates them.
        pointer: mochiko:patterns-code-minimalism
        anchor: 2026-09-19 impeccable-design-integration D11
      - id: patterns-craft-floor.decides-nothing
        labels: [boundary]
        class: floor
        text: >-
          This floor makes no taste choice: register, visual world, type and color intent, and
          motion stance come from the surface's Direction block. Where the edit needs a choice the
          contract does not make, stop and surface it — never invent the answer.
        anchor: 2026-09-19 impeccable-design-integration D3
      - id: patterns-craft-floor.grading-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Grading the built UI is not this skill's: the critique lens in
          `mochiko:testing-gap-finding` and the design-audit lens grade it after the build; this
          floor never grades its own edit.
  - id: patterns-craft-floor.sec.discipline
    title: Discipline — the contract, the tokens, the bans, the dial, the bound
    intent: >-
      The binding rules over the edit; the bans, the refuse list, the verify list, the folds, and
      the dial are the body's procedure.
    rules:
      - id: patterns-craft-floor.contract-wins
        labels: [single-home]
        class: must
        text: >-
          The Direction block and the baseline's brand commitments override this floor's defaults:
          the refuse list is defaults the contract can earn back; the ban list is not.
      - id: patterns-craft-floor.honor-baseline-tokens
        labels: [single-home]
        class: must
        text: >-
          Where the design baseline's system part names a token, type step, color role, spacing
          step, component, or motion rule, the edit uses it; where it is empty, the contract's
          declared tokens are the values; where both are silent, reuse the project's existing
          value for the same role — a genuinely new value is disclosed, never slipped in.
      - id: patterns-craft-floor.bans-absolute
        labels: [ladder]
        class: must
        text: >-
          The bans hold on every surface and every mode; no brief, contract, or baseline earns one
          back.
      - id: patterns-craft-floor.register-dial
        labels: [ladder]
        class: must
        text: >-
          The register is executed as the Direction block names it — bolder, quieter, distill,
          or held — scoped to the named target; nothing outside the target changes, and no
          color, font, or system primitive the surface does not already own appears unasked.
      - id: patterns-craft-floor.verify-bounded
        labels: [evidence]
        class: must
        kind: bound
        text: >-
          The verify list is checked on the built result in one batched inspection across the
          declared viewports; every fix lands in one batch, with at most one confirm round, then
          stop — no open-ended polish loop.
        anchor: 2026-09-19 impeccable-design-integration D8
      - id: patterns-craft-floor.platform-native
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          On the design baseline's `Platform` value, the native reference governs structure,
          navigation, and controls: `../patterns-design-direction/references/ios.md` for `ios`,
          `android.md` for `android`, both for `adaptive`; `web`, `desktop`, or no value routes
          none and defaults nothing.
        anchor: 2026-09-19 impeccable-design-integration D6
  - id: patterns-craft-floor.sec.inputs
    title: Inputs — the contract, the trace, the tokens
    intent: What is read before the edit.
    rules:
      - id: patterns-craft-floor.reads-before-edit
        labels: [fence]
        class: must
        kind: duty
        text: >-
          Before the edit, read the surface's Direction block in the spec's Screens & Flows, the
          card's SCR/FLOW trace, and the design baseline's system part at
          `.mochiko/product/design/` where one exists.
  - id: patterns-craft-floor.sec.disclosure
    title: Disclosure — stops and new values
    intent: What the building seat reports from the floor.
    rules:
      - id: patterns-craft-floor.stops-disclosed
        labels: [reporting]
        class: must
        text: >-
          Every stop for a choice the contract did not make, and every new value introduced, is
          disclosed in the cycle report, one line each.
  - id: patterns-craft-floor.sec.reserved
    title: Reserved
    intent: Decisions this floor never takes.
    note: >-
      Deliberately empty — the taste choices this floor never takes are made upstream in the
      Direction block, and `patterns-craft-floor.decides-nothing` routes any gap there; nothing is
      reserved to the user at the edit itself.
    rules: []
