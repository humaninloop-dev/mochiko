# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
kind: skill
skill: authoring-architecture-store
vars:
  template: architecture-store
conditions:
  delta:
    values: presence
    resolution: surface-presence
    note: an approved architecture-store delta existed for the landing feature.
  structure_built:
    values: presence
    resolution: surface-presence
    note: the built work changed structure.
  ruled_content:
    values: presence
    resolution: surface-presence
    note: >-
      ruled (non-derived) store content exists — a scaffold-only or absent store reads absent.
sections:
  - id: authoring-architecture-store.sec.independence
    title: Independence — who grades a store write
    intent: The review leg a judgment write takes before the user's ruling.
    rules:
      - id: authoring-architecture-store.sound-loop-on-judgment-writes
        labels: [independence, floor-pointer]
        class: floor
        kind: binding
        text: >-
          Judgment writes — baseline authoring, shelf-walk stance batches, amendments, and every
          `As-built:`/`Drift:` write — take the independent review leg before the user's ruling,
          per `mochiko:patterns-sound-loop`; status flips and orphan cleanup are transcription and
          ride the landing audit. Do not relabel judgment as mechanical to skip the leg.
        pointer: mochiko:patterns-sound-loop
        anchor: 2026-08-19 product-architecture-schema
  - id: authoring-architecture-store.sec.scope
    title: Scope — what this skill routes away
    intent: The jurisdiction lines toward the sibling skills and the map machinery.
    rules:
      - id: authoring-architecture-store.diagram-craft-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Feature-level diagram craft — altitude, container-delta diagrams, which flows earn a
          sequence diagram — belongs to `mochiko:patterns-system-design`; the store says where a
          delta lands and what status it carries, never how to draw it.
      - id: authoring-architecture-store.stance-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Forming a stance — which stance a row takes, what walk order applies, what a floor
          card binds — belongs to `mochiko:patterns-architecture-shelves`; the store owns the
          field, that skill owns the judgment that fills it.
      - id: authoring-architecture-store.mint-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Capabilities and work rows are never minted here — a fired upgrade trigger is flagged
          in the store and routed to the `/mochiko:feature` growth door: the architecture lens
          proposes; the map machinery disposes.
  - id: authoring-architecture-store.sec.inputs
    title: Inputs — what a probe reads
    intent: The read duties and read bounds behind drift claims.
    rules:
      - id: authoring-architecture-store.drift-probe-scoped
        labels: [fence, evidence]
        class: must
        kind: bound
        text: >-
          The drift probe is scoped — rows touched since the last desk visit, plus a sample of
          the retrofit-expensive rows; never all rows every visit.
      - id: authoring-architecture-store.as-built-against-code
        labels: [evidence]
        class: floor
        kind: duty
        text: '`As-built:` claims are checked against actual code, never against recollection.'
  - id: authoring-architecture-store.sec.artifact
    title: Artifact — the store's binding grammar and write mechanics
    intent: What the store is, the shapes its content takes, and the duties every write carries.
    rules:
      - id: authoring-architecture-store.one-home-one-writer
        labels: [single-home, binding]
        class: floor
        text: >-
          One home. One writer. The product's architecture lives at
          `.mochiko/product/architecture/`, and every write to it goes through this skill.
        anchor: 2026-08-19 product-architecture-schema D3
      - id: authoring-architecture-store.store-layout
        labels: [binding, artifact-grammar]
        class: must
        kind: binding
        text: >-
          The store layout binds: `spine.md` (topology deep view) · `concerns.md` (the `AX-XXX`
          ledger) · `concerns/AX-XXX-<slug>.md` (graduated concerns) · the derived
          `ARCHITECTURE.md` index at the repo root — never inside the store directory.
      - id: authoring-architecture-store.scope-line-durable-home
        labels: [single-home, artifact-grammar]
        class: must
        text: >-
          `spine.md` opens with a `Scope:` line naming the surface types the store covers —
          shelf scope's durable home: the shelf walk reads it rather than re-asking.
      - id: authoring-architecture-store.element-grammar
        labels: [artifact-grammar]
        class: must
        text: >-
          Spine elements carry `SPN-XXX` (unique store-wide), a kind — `container` · `boundary`
          · `flow` — a name, and a status; concern rows carry `AX-XXX` (unique store-wide), a
          name, a `Stance`, and a `Status`. Everything past that core is free-form — the schema
          constrains the skeleton, never the voice.
      - id: authoring-architecture-store.two-arm-schema-binding
        class: must
        kind: binding
        extends: authoring-common.two-arm-template
        anchor: 2026-08-16 schema-based-template-guidance D8
      - id: authoring-architecture-store.nfr-one-home
        labels: [single-home]
        class: must
        text: >-
          `NFR-XXX` targets live on the concern row they belong to — one home per concern:
          stance, pattern, target, and as-built together. The ids survive unchanged, and each
          target names its business source, so `FR-XXX / SC-XXX → NFR-XXX` trace chains keep
          resolving.
        anchor: 2026-08-19 product-architecture-schema D12
      - id: authoring-architecture-store.work-pointers-only
        labels: [artifact-grammar, single-home]
        class: must
        text: >-
          `Work:` holds pointers only (`FEAT-XXX`, `EPIC-XXX`) — the work itself lives on the
          feature map.
      - id: authoring-architecture-store.present-tense-no-history
        labels: [artifact-grammar]
        class: must
        text: >-
          Spine and rows are written in the present tense, with no history narration — the
          lifecycle statuses carry the change story. A row's own `Ruling` and `Rationale` belong
          on the row; rationale already living in a decision record or landing report is linked,
          never restated.
      - id: authoring-architecture-store.lifecycle-statuses
        labels: [artifact-grammar]
        class: must
        text: >-
          Seven lifecycle statuses — `ruled` · `proposed` · `in-flight` · `modifying` ·
          `removing` · `built` · `removed`; each `proposed` and in-flight-class element MUST
          name the key of the run that owns the change — `FEAT-XXX`, `EPIC-XXX` or `lane-<slug>`
          — and `ruled`, `built` and `removed` carry none. Readers: `proposed` is nothing
          promised and reads absent; the in-flight class (`in-flight` · `modifying` ·
          `removing`) is planned contract; `removed` reads absent. A removed concern row keeps its
          heading and `**Status**: removed`, no body; a removed spine element keeps its table row
          reduced to id, kind, name and status, and is not drawn; either id stays taken. Status is
          the build-lifecycle axis only — stance is a separate axis and never implies one.
      - id: authoring-architecture-store.full-ax-table
        labels: [artifact-grammar, evidence]
        class: must
        text: >-
          The index carries the spine thumbnail and the full AX summary table — every row. The
          sufficiency check and the design phase read the trip check there, so a missing row is an
          invisible row.
        anchor: 2026-08-19 product-architecture-schema D4
      - id: authoring-architecture-store.graduation-by-depth
        labels: [artifact-grammar]
        class: must
        text: >-
          A concern row earns its own file only on real depth — extend beats mint; when a row
          graduates, the ledger keeps it as a one-line summary plus a link, never losing the row.
      - id: authoring-architecture-store.landing-diff-on-delta
        labels: [evidence]
        class: floor
        kind: duty
        text: >-
          The landing diff fires because an approved delta existed for the feature — independent
          of what was built. Never gate the diff on whether structure was built.
        when: {delta: present}
        anchor: 2026-08-19 product-architecture-schema D10
      - id: authoring-architecture-store.diff-both-directions
        labels: [evidence]
        class: floor
        kind: duty
        text: >-
          The landing diff runs both directions — was every signed add, remove, redirect, and
          boundary-move actually built, AND was anything structural built that the signed delta
          did not carry. Grading built topology against the signed delta is a capability this duty
          owns, taking that delta as its input.
        anchor: 2026-08-19 product-architecture-schema D10
      - id: authoring-architecture-store.fold-duty
        labels: [artifact-grammar]
        class: must
        kind: duty
        text: >-
          The fold fires when the built work changed structure: the landing flip, read from the
          pinned-base diff — `in-flight` and `modifying` elements to `built`, their keys
          cleared, each `removing` element to its `removed` stub — then `As-built:` and `Drift:`
          on every touched row, and the index regenerated.
        when: {structure_built: present}
        anchor: 2026-08-19 product-architecture-schema D10
      - id: authoring-architecture-store.orphan-rule
        labels: [artifact-grammar]
        class: must
        text: >-
          Every `proposed` and in-flight-class element keys an open feature, epic or lane; an
          element whose key names a closed, retired, or nonexistent owner is an orphan — the
          health view flags it, the sufficiency check lists it for the user at run-open, the
          landing verifier flags one keyed to its own run, and desk visits clean it.
        anchor: 2026-08-19 product-architecture-schema D10
      - id: authoring-architecture-store.first-visit-bootstrap
        labels: [evidence]
        class: must
        kind: duty
        text: >-
          The first desk visit to a repo with no ruled store content reconstructs one from what
          exists — read what the repo already says, reconstruct the spine and AX rows with every
          reconstructed element marked derived (never ruled), confirm with the user, and archive
          the absorbed sources to `.mochiko/archive/product-baselines/<date>/`. Never fails, never
          silently invents.
        when: {ruled_content: absent}
        anchor: 2026-08-19 product-architecture-schema D16
      - id: authoring-architecture-store.artifact-home
        labels: [binding]
        class: floor
        kind: binding
        text: >-
          Every store write goes to a declared file: render `mochiko-cli home
          .mochiko/product/architecture` before the first one. `spine.md` and `concerns.md` are
          the hand-written pair, `concerns/<AX-ID>.md` is a graduated row's file in the sub-home,
          and the repo-root index is the derived view this skill regenerates rather than authors.
          Take the spine's per-section budgets from `mochiko-cli template architecture-spine`.
        anchor: 2026-09-13 hook-enforced-artifact-schema D1
  - id: authoring-architecture-store.sec.output
    title: Output — the derived index and the health view
    intent: The projection every write regenerates and the bar it must clear.
    rules:
      - id: authoring-architecture-store.index-regenerated-every-write
        labels: [single-home]
        class: floor
        kind: duty
        text: >-
          The root `ARCHITECTURE.md` is a projection of the store, regenerated on every store
          write — this skill is its single writer. It is never hand-maintained, and
          index-vs-store disagreement is a defect fixed by regenerating, never by editing the
          index.
        anchor: 2026-08-19 product-architecture-schema D4
      - id: authoring-architecture-store.health-view-binding
        labels: [artifact-grammar, reporting]
        class: must
        kind: binding
        text: >-
          The health view is a section of the index and no separate artifact exists — five
          counts, each naming its rows: open rows (walked, no stance formed) · stale `not-now`
          triggers (deferrals whose revisit condition has gone unreviewed) · fired triggers
          awaiting routing · orphan elements · the drift register (rows whose `Drift:` field
          names a live divergence).
      - id: authoring-architecture-store.readability-bar
        labels: [artifact-grammar]
        class: must
        kind: bound
        text: >-
          A reader new to the repo can place any file or component in the system from the index
          alone; an index too thin for that is regenerated with more of the spine, never padded
          with hand-written prose.
  - id: authoring-architecture-store.sec.reserved
    title: Reserved — the user's gates and dispositions
    intent: Decisions a run never takes on its own.
    rules:
      - id: authoring-architecture-store.diff-user-dispositioned
        labels: [user-gate, reporting]
        class: floor
        kind: reservation
        text: >-
          The landing diff reports — each difference named, approved-versus-built, and
          dispositioned by the user; it never silently reconciles.
        anchor: 2026-08-19 product-architecture-schema D10
      - id: authoring-architecture-store.drift-user-disposition
        labels: [user-gate]
        class: floor
        kind: reservation
        text: >-
          Drift findings land in the row's `Drift:` field and take a user disposition at the desk
          — the store bends to the code, the code bends to the store, or the divergence is
          accepted and recorded; the probe reports, it never silently reconciles.
      - id: authoring-architecture-store.bootstrap-confirmation-gate
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          The bootstrap confirmation is a real user gate, not a formality — a derived baseline
          inherits the brownfield caveat that a partial or wrong read poisons everything
          downstream. A pipeline run that meets a store with no ruled content offers the bootstrap
          rather than failing.
        anchor: 2026-08-19 product-architecture-schema D16
      - id: authoring-architecture-store.sign-off-flips-proposed
        labels: [user-gate]
        class: floor
        kind: gate
        text: >-
          A delivery run writes its store changes in place as `proposed (<key>)` — a new
          element, an amended one with its new text in place, a removed one cut to its heading (a
          spine row: to its id, kind, name and status) — and nothing it writes before the user's
          sign-off is promised. The sign-off, on the rendered diagram, the changed-element table
          and the pinned-base diff, is the user's; it flips each `proposed (<key>)` by that diff
          — absent at the base to `in-flight (<key>)`, changed from it to `modifying (<key>)`,
          cut to its heading to `removing (<key>)` — through this skill, which regenerates the
          index. The signed store delta is the store at the sign-off base, or the checkpoint table
          where no commit is made. A run that ends before its checkpoint reverts its `proposed`
          elements by the diff. No sign-off, no in-flight element.
        anchor: 2026-09-24 delta-files-vs-direct-baseline-edits D7
tombstones:
  - id: authoring-architecture-store.sign-off-is-write-gate
    disposition: >-
      superseded by authoring-architecture-store.sign-off-flips-proposed — the sign-off is the
      gate between `proposed` and the in-flight class, not between nothing and a write (D7); a
      delivery run writes its store changes in place before sign-off as `proposed` (D1). The
      successor also takes the store carve of impl.baselines-never-in-place. (2026-09-24
      delta-files-vs-direct-baseline-edits D7)
