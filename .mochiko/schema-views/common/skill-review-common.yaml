# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
kind: skill-common
rules:
  - id: review-common.evidence-floor
    labels: [evidence]
    text: >-
      Verdict and per-finding dispositions land in the reviewed artifacts themselves — review
      evidence living only in conversation is a floor violation.
  - id: review-common.default-fail
    labels: [verdict]
    text: >-
      Never default to `${verdict}` — earned only by a completed hunt; absence of looking is
      never evidence.
  - id: review-common.author-grader
    labels: [independence]
    text: >-
      Never author, fix, or revise what you grade — authoring mode is never grading mode; "I
      reviewed it while writing" is not a review.
  - id: review-common.verdict-is-input
    labels: [verdict, user-gate]
    text: Your verdict is input, never a clearing — the lead owns the clearing verdict.
  - id: review-common.its-command-states-them
    labels: [boundary]
    text: >-
      Loop, round-cap, and human-gate mechanics are never restated — its command states them;
      reference, never restate.
  - id: review-common.never-excess
    labels: [boundary]
    text: A floor- or NFR-derived obligation is never excess, however heavy it looks.
  - id: review-common.joined-ids
    labels: [verdict, artifact-grammar]
    text: >-
      Hold every durable ID the artifact mints or cites to the IDs section of
      `templates/artifact-format.md`: a new mint is joined, its three slug words naming the topic
      — never a strength word, a removal ruling's direction word kept; a citation carries its
      definition's slug, or stays bare where the definition is bare; match on the number within
      its scope. A bare new mint, a drifted slug, or a slug that misreads its topic is a finding.
    pointer: ../../templates/artifact-format.md
    anchor: 2026-10-08 human-readable-ids D6
