# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
kind: command-common
rules:
  - id: common.register
    labels: [reporting]
    text: User-facing prose follows templates/output-style.md.
  - id: common.no-git-mutations
    labels: [user-gate]
    text: Suggest commits; never run git mutations, never push.
  - id: common.acceptance-plain-text
    labels: [user-gate]
    text: User rulings and acceptance are plain blocking text, never a timed prompt.
  - id: common.transport-floor
    labels: [floor-pointer, seats]
    text: >-
      mochiko:patterns-transport-floor governs composition and messaging under a split trigger —
      message legs on any multi-seat messaging, topology legs on shared writes — non-waivable
      once triggered. Trigger test, floor legs, composition-safe shapes, and disclosure live there
      — referenced, never restated.
    pointer: mochiko:patterns-transport-floor
  - id: common.no-acceptance
    labels: [user-gate]
    text: User acceptance not given.
  - id: common.model-tiering
    labels: [seats, floor-pointer]
    text: >-
      Exploration and fact-finding dispatches ride mochiko:patterns-model-tiering's class key —
      locate/enumerate reads to a native Explore subagent spawned model: ${explore_model},
      interpretive or absence-driven reads on the session tier — and every seat brief carries
      the routing rule; referenced, never restated.
    pointer: mochiko:patterns-model-tiering
  - id: common.author-grader-default-fail
    labels: [independence]
    text: >-
      No output is cleared by its author; grading reads the authored surfaces themselves — never
      the author's report — default FAIL.
  - id: common.tools-referenced-never-restated
    labels: [floor-pointer]
    text: >-
      Every tool binding is referenced, never restated — its procedure lives in its home skill
      or template.
  - id: common.plan-approval-producers
    labels: [seats, independence]
    text: >-
      Any seat that writes artifacts plans first, read-only, in a plan-only dispatch, and stops; a
      fresh peer of its persona type — a generic seat for a persona-less producer — grades the
      plan per `mochiko:review-seat-plan`; the lead approves only a passed plan and resumes the
      seat to work; grading and fact-finding seats are exempt.
  - id: common.gate-loop-bound
    labels: [user-gate, independence]
    text: >-
      A gate verdict of FAIL allows one fix and one re-audit — by the same grader seat resumed,
      reading only what the fix touched and what it could have broken; a second FAIL halts the
      landing and goes to the user with both fix lists, fix again or drop; no run raises this
      bound. Beyond the extending command, `.claude/rules/mochiko/primitive-edits.md` and
      `validation-primitive-edit.gate-loop-bound` cite this id — a rename or tombstone sweeps
      them.
    anchor: 2026-09-19 author-grader-consolidation D6
