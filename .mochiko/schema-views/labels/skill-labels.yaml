# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
kind: skill-labels
labels:
  independence: Who is never whom — author/grader separation, non-author seats, blind dispatch.
  user-gate: A decision or checkpoint reserved to the user — never the run's own call.
  evidence: >-
    What must be captured, run, or shown — real-infrastructure proof, sweeps, disclosed claims.
  floor-pointer: >-
    A binding that points at a skill-owned floor or procedure — the pointer, never the restated
    procedure.
  reporting: Where reports land, what they state, and the register they use.
  binding: >-
    A path, schema, workspace, or surface the skill binds to — where its artifacts live and what
    shapes them.
  verdict: The clearing grammar — vocabulary, criteria, default posture, overrides.
  boundary: A sibling or jurisdiction line — what the skill consumes or routes but never grades.
  fence: A read-boundary — surfaces the skill must read, and surfaces it must never read.
  artifact-grammar: >-
    The produced artifact's binding shape — ID grammars, lifecycle enums, row/field forms,
    required sections.
  single-home: >-
    A one-home/one-writer/no-copies rule — where a thing lives once and every other surface
    links or derives.
  trigger: >-
    When a kind-keyed discipline fires — lane/two-part/commodity/skeleton firing conditions and
    their non-waivability once fired; marks rules ABOUT firing semantics, distinct from a rule's
    own `when:` guard.
  ladder: >-
    A ranked rung/leg/test structure's binding rules — stop-at-first, descend-with-why,
    walk-order, breadth/every-row obligations.
