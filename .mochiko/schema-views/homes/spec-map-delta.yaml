# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
home: spec-map-delta
title: The feature-map delta staged by a spec run
path: [.mochiko, specs, <slug>, map-delta]
bounds: whole-file
deliverables:
  - file: FEATURES.md
    template: features-index
    max_lines: 150
  - file: <FEAT-ID>.md
    template: feature-entry
  - file: README.md
    max_lines: 150
  - file: selection-card.md
    max_lines: 150
  - file: specs-index.md
    max_lines: 150
