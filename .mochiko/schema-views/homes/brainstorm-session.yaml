# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
home: brainstorm-session
title: One thinking session's home
path: [.mochiko, brainstorms, <slug>]
bounds: whole-file
deliverables:
  - file: record.md
    bound_reason: >-
      a decision record is as long as the session it records; the cold review grades it, and a
      line count invented for it would be enforced against work it cannot measure
  - file: synthesis.md
    bound_reason: >-
      a decision record is as long as the session it records; the cold review grades it, and a
      line count invented for it would be enforced against work it cannot measure
  - file: build-log.md
    form: log
    entry_max_lines: 60
  - file: wave<n>-<slug>.md
    max_lines: 300
subdirs: [inputs, research, referents]
reports:
  envelope: report-envelope
  by_type: {}
