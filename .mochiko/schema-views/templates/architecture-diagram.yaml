# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
template: architecture-diagram
title: Architecture Diagram
form: artifact-format.md
register: full
overview: >-
  One file of the architecture store's diagram set at `.mochiko/product/architecture/diagrams/`
  — one diagram per file, the whole file one entry under its `##` title. Any kind may earn a
  file — state machine, ER, sequence, flowchart, data flow, deployment — while the spine keeps
  its own container view and key-flow sequences. Authored per
  mochiko:authoring-architecture-store; diagram craft and taste per
  mochiko:patterns-system-design. The skeleton constrains the shape, never the voice.
sections:
  - name: Title
    required: true
    contract: >-
      The file's one `##` heading names the diagram; nothing sits above it, so the whole file is
      one entry.
    check: Is there exactly one `##` heading, naming the diagram, with nothing above it?
  - name: Diagram
    required: true
    contract: >-
      One Mermaid block. While a change is in flight its parts are delta-styled — new ·
      modified · removed — per mochiko:patterns-system-design.
    check: Is there exactly one Mermaid block?
  - name: Caption
    required: true
    contract: One line under the block saying what the reader should see in it.
    check: Is there a one-line caption?
  - name: Draws
    required: true
    contract: >-
      A `**Draws:**` line naming everything the diagram draws: a store element or concern row by
      its joined ID, a data-model entity by file and heading (`data-model.md § Vault`). The
      diagram is a view; each target's truth stays where it is cited.
    check: >-
      Does the Draws line cite each store target by its joined ID and each data-model entity by
      file and heading?
  - name: Lifecycle
    required: true
    contract: >-
      A `**Lifecycle:**` field of the file's own, holding one of the store's seven values —
      `ruled` · `proposed (<key>)` · `in-flight (<key>)` · `modifying (<key>)` · `removing
      (<key>)` · `built` · `removed` — with one open key at most. The file carries no stale
      flag: the index's health view is that flag's one home.
    check: >-
      Is there one Lifecycle line with a legal value and at most one open key, and no stale flag
      in the file?
skeleton: |
  ## [The diagram's title]

  ```mermaid
  flowchart TD
      [one diagram — state, ER, sequence, flowchart, data flow or deployment; delta-styled while a change is in flight]
  ```

  [One line: what the reader should see in it.]

  **Draws:** SPN-002-<slug> · AX-001-<slug> · `data-model.md § <Entity>`
  **Lifecycle:** ruled
