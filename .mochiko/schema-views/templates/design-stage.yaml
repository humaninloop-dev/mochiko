  - **Pieces**:
    - [a ruled piece, in plain words] · [user's words · lead's guess, ratified · blind list · handed in]
  - **Provenance**: [user's words · lead's guess, ratified · blind list · handed in]

  ## Defaults batch

  | Gap | Piece | Suggested default | What it costs | Ruling |
  |-----|-------|-------------------|---------------|--------|
  | [gap] | [piece] | [default] | [cost] | [confirmed · pulled into the ruled set] |

  ## Blind list

  | Difference | Ruling |
  |------------|--------|
