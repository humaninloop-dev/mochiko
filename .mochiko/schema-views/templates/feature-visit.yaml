# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
template: feature-visit
title: Feature Desk Visit
form: artifact-format.md
register: full
overview: >-
  `visit.md` — the record of one `/mochiko:feature` card visit for one capability or lane, in
  its own directory at `.mochiko/features/desk/<date-slug>/`, the slug carrying the joined FEAT id
  lower-cased or `lane-<slug>`; a visit that cuts cards on two capabilities writes one file for
  each. The lead writes the header and the ruled set as the stage rules them and passes the pen to
  the card's writer for the cards; the card's review grades the cards against the set, the
  capability entry's marked work row points here, and the dispatched run reads the cards and their
  set here. Written in the present tense; the skeleton constrains the shape, never the voice.
sections:
  - name: Header
    required: true
    contract: >-
      The visit goal and its done condition; the capability's joined FEAT id or the `lane-<slug>`
      the file is keyed to; any input handed in — the run's note from `/mochiko:implement`, a
      bug's report.
    check: >-
      Are the goal and its done condition stated, the key named, and every input handed in named?
  - name: Ruled set
    required: true
    contract: >-
      One entry per card: what kind it is — a bug, an improvement, a growth row or a lane card
      — the user's change in their own words, the one "I'd know it works if…" sentence or
      `open`, an open line carried as an open question and never filled in; on a bug, its
      reproduction as handed in; and the entry's provenance mark in the engine's vocabulary.
    check: >-
      Does every entry name its kind, quote the user's change, carry a sentence or `open`, give a
      bug's reproduction, and carry one provenance mark?
  - name: Defaults batch
    required: false
    contract: >-
      The choices the stage defaulted, as confirmed on one screen — each with its suggested
      default, what it costs, and the user's ruling.
    check: Does every batch row show its default and its cost beside the user's ruling?
  - name: Blind list
    required: false
    contract: >-
      Each difference between the blind list and the ruled set, with the user's ruling — in, or
      out with its why; on a visit that cuts a single bug or improvement card, one line saying the
      list was skipped.
    check: Is every difference ruled in or out, an out carrying its why, or the skip stated?
  - name: Cards
    required: true
    contract: >-
      Each card the ruled set holds, written by the card's writer after the pen passes, in the
      card shape `mochiko-cli template tasks` renders — never a second card grammar: a bug's
      acceptance its reproduction-failing test, an improvement's or a growth row's its 1–3
      acceptance criteria, a target number only where the user gave one.
    check: >-
      Is every ruled card here in the tasks template's card shape, each acceptance inside its
      entry in the ruled set?
  - name: Verdict
    required: true
    contract: The closing verdict against the done condition, one line.
    check: Is there a verdict against the done condition?
skeleton: |
  # Feature visit — [the visit goal, one line]

  **Goal**: [one line] · **Done when**: [the done condition]
  **Keyed to**: [FEAT-001-<slug> | lane-<slug>]
  **Handed in**: [the run's note from /mochiko:implement · a bug's report — or none]

  ## Ruled set

  ### [the card, in a few words] — [bug · improvement · growth row · lane card]

  - **Change**: "[the user's words]"
  - **I'd know it works if**: [one sentence — or `open`]
  - **Reproduction**: [as handed in — a bug only]
  - **Provenance**: [user's words · lead's guess, ratified · blind list · handed in]

  ## Defaults batch

  | Choice | Suggested default | What it costs | Ruling |
  |--------|-------------------|---------------|--------|
  | [a defaulted choice] | [default] | [cost] | [confirmed · pulled into the ruled set] |

  ## Blind list

  | Difference | Ruling |
  |------------|--------|
  | [a card, change or fork the list saw that the ruled set lacked] | [in · out — why] |

  ## Cards

  [Each card in the card shape `mochiko-cli template tasks` renders, written by the card's writer after the pen passes.]

  ## Verdict

  [Done or not done against the done condition, one line.]
