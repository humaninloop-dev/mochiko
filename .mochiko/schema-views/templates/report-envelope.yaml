# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
template: report-envelope
title: Report Envelope
form: report-format.md
register: ultra
overview: >-
  The envelope every mochiko report opens with, and the only part of a report this schema grades.
  A report lands in its home's `reports/` directory under a free name; its type is the
  frontmatter's `report:` field, drawn from the closed set below. Payload fields per type live in
  that type's own home — the producing skill's reference or a per-type template named by the
  home's `by_type` binding — never here. The prose set is closed: a failure narrative where the
  report carries a FAIL or blocking finding, notes of note where a non-obvious decision or blocker
  needs saying, and a null-exit reasoning block where the workflow defines one. A clean report is
  frontmatter-only, and an empty section is omitted rather than written as "None". Full shared
  rules: `templates/report-format.md`.
conformance:
  frontmatter:
    required: [report]
    enum:
      report: [cycle, verification, final-validation, review, feasibility, disclosure]
  placeholders: [<feature-id>, <n>]
  extra_headings: allow
sections:
  - name: Header
    required: true
    contract: >-
      The YAML frontmatter block, machine-first: `report:` from the closed type set, `feature:`
      where the run has one (a cycle report carries `cycle:` and `attempt:` instead of `round:`),
      `round:` where a lead counts rounds. Unknown extra fields are permitted; a missing required
      payload field is not. Governs no heading of its own.
    check: Is the frontmatter present, typed by `report:`, with every consumed datum a field?
  - name: Failure narrative
    heading: Failure narrative
    required: false
    max_lines: 15
    contract: >-
      Mandatory where the report carries a FAIL or a blocking finding, absent otherwise: what
      failed, why, and what was tried. Debug value concentrates here, which is why it is the one
      prose section that is ever required.
    check: Where the report fails, does the narrative say what failed, why, and what was tried?
  - name: Notes of note
    heading: Notes of note
    required: false
    max_lines: 15
    contract: >-
      Non-obvious decisions, difficulties, and flagged blockers — only when non-empty. A fact
      that fits a frontmatter field belongs in the field, not here.
    check: Are the notes non-obvious, or are they restating fields?
  - name: Null-exit reasoning
    heading: Null-exit reasoning
    required: false
    max_lines: 15
    contract: >-
      Present only where the workflow defines a null exit: why the run produced nothing, in the
      terms that workflow names.
    check: Where a null exit fired, is its reasoning stated in the workflow's own terms?
skeleton: |
  ---
  report: cycle
  feature: <feature-id>
  round: <n>
  ---

  ## Failure narrative

  ## Notes of note
