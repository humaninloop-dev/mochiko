# Derived view — regenerated by `mochiko-cli views emit` from the migration log. Never hand-edited.
template: architecture-spine
title: Architecture Spine
form: artifact-format.md
register: full
overview: >-
  `spine.md` — the product's topology deep view, one of the two hand-written files in the
  architecture store at `.mochiko/product/architecture/`. It carries the container diagram, the
  element table (containers, boundaries and flows, each with a lifecycle status), the sequence
  diagrams for qualifying flows, and the as-built notes a landing fold writes. The concern catalog
  is its sibling file, `concerns.md`, and the repo-root `ARCHITECTURE.md` is a derived view of
  both — regenerated on every store write, never hand-edited. Authored per
  mochiko:authoring-architecture-store; diagram craft and altitude per
  mochiko:patterns-system-design.
conformance:
  extra_headings: deny
sections:
  - name: Header
    required: true
    contract: >-
      Title "# Architecture Spine" plus the scope line naming the product shape the spine
      describes. Governs no heading of its own.
    check: Is the title present with a scope line?
  - name: Container diagram
    heading: Container diagram
    required: true
    max_lines: 30
    contract: >-
      One C4-container view as a mermaid block: the containers and how they communicate, with
      in-flight-class elements marked. One diagram, not a gallery — a second view earns its
      place only where the first cannot carry it.
    check: Is there exactly one container view, with in-flight elements marked?
  - name: Elements
    heading: Elements
    required: true
    max_lines: 40
    contract: >-
      The element table, one row per element: `SPN-XXX` id · kind (container | boundary | flow)
      · name · one-line responsibility · what it talks to and in which style · lifecycle
      status. One line per element; a row that needs a paragraph is hiding a concern row or a
      graduated file.
    check: Is every element one row with an id, a kind, a responsibility and a status?
  - name: Key flows
    heading: Key flows
    required: true
    max_lines: 30
    contract: >-
      Sequence diagrams for the flows that qualify — selection and altitude per
      mochiko:patterns-system-design. A flow that reads off the container diagram does not
      qualify.
    check: Does each diagram earn its place, or does the container view already say it?
  - name: As-built notes
    heading: As-built notes
    required: false
    max_lines: 15
    contract: >-
      What the landing fold recorded about the built state where it differs from the approved
      shape — one line per element, id-keyed. Drift itself lives on the element's row; this
      section is the fold's own note.
    check: Is each note one line, keyed to an element id?
skeleton: |
  # Architecture Spine

  **Scope**: backend-service

  ## Container diagram

  ```mermaid
  flowchart TD
      [containers and their communication; in-flight-class elements marked]
  ```

  ## Elements

  | ID | Kind | Name | Responsibility | Talks to (style) | Status |
  |----|------|------|----------------|------------------|--------|
  | SPN-001 | container | [name] | [one line] | SPN-002 (sync REST) | built |
  | SPN-002 | container | [name] | [one line] | SPN-003 (queue) | in-flight (FEAT-012) |
  | SPN-003 | boundary | [name] | [what changes across it — trust, ownership, tenancy] | — | ruled |

  ## Key flows

  [Sequence diagrams for qualifying flows — selection and altitude per mochiko:patterns-system-design.]

  ## As-built notes

  - SPN-002 — [what the fold found built, one line]
