# Derived view of the /mochiko:architecture command content schema — a projection of the migration log,
# regenerated by `mochiko-cli views emit` and never hand-edited. The command's rules are rendered
# at fire by `mochiko-cli`, never read from a file. Two semantics live only here:
#   class   floor = non-waivable · must = binding obligation · advisory = guidance, not binding.
#   conditions:  each dimension declares its resolution point (entry-derived · surface-presence ·
#           moment-resolved(<moment>) · user-ruled · standing-trigger); a moment-resolved
#           dimension is unresolved until its named moment — rules gated on it are inapplicable
#           until then.
kind: command
command: architecture
vars:
  producer_seat: principal-architect
  grader_seat: tech-lead
  explore_model: haiku
  store_dir: .mochiko/product/architecture
  store_schema: mochiko-cli template architecture-store
  shelf_schema: mochiko-cli doc architecture-shelf-backend
conditions:
  store_ruled_content:
    values: presence
    resolution: surface-presence
    note: >-
      absent covers both forms — no store, and scaffold-only (a spine.md holding just its Scope:
      header).
  km_file:
    values: presence
    resolution: surface-presence
    note: .mochiko/memory/knowledge-management.md.
  seats:
    values: [single, multi]
    resolution: standing-trigger
    note: >-
      fires the moment the visit composes more than one seat, and re-fires on a seat added
      mid-visit.
  visit_kind:
    values: [ruling, delta, other]
    resolution: entry-derived
    note: >-
      fixed by the converged visit goal: ruling — the visit rules a baseline, a stance or an
      amendment; delta — a feature's delta thinking, /mochiko:architecture <FEAT-ID>; other —
      a store query, a drift visit (its dispositions land on the rows as today) or a fired
      trigger's routing. Re-derived whenever the visit goal is re-converged: a query or drift
      visit that turns to ruling something re-converges its goal first, so the stage runs before
      any store write.
moments:
  visit-open: Store health surfaced from the derived index before the ask, every visit.
  close: The verdict against the visit's done condition, with store integrity intact.
  focus: >-
    Where the visit's focus set is worked with the user — after the one-line visit goal is
    agreed, before the principal-architect seat authors anything.
sections:
  - id: arch.sec.roles
    title: Roles & Responsibilities
    intent: The Delivery Manager's always-happens floor and the other seats' wiring.
    rules:
      - id: arch.staffing-latitude
        labels: [seats]
        class: must
        kind: latitude
        text: >-
          Beyond this schema's `class: floor` rules — the sound-loop floor arch.sound-loop-floor
          among them — everything is your per-visit judgment: how you staff, sequence, and run
          the visit is yours to shape.
      - id: arch.dm-health-first
        labels: [reporting, stewardship]
        class: floor
        kind: duty
        text: Surface health before the ask.
      - id: arch.dm-converge-goal
        labels: [scope-entry]
        class: floor
        kind: duty
        text: Converge every visit to a one-line goal and its done condition.
      - id: arch.dm-author-baseline
        labels: [scope-entry]
        class: floor
        kind: duty
        text: >-
          Author the baseline — greenfield elicits it; brownfield reconstructs and confirms it
          per arch.tools-brownfield-reconstruction — nothing absorbed is ever silently
          discarded.
        when: {store_ruled_content: absent}
      - id: arch.dm-shelf-walk
        labels: [evidence]
        class: floor
        kind: duty
        text: >-
          Walk shelf rows under the breadth invariant (arch.breadth-invariant), ordered by
          retrofit cost, dealt recommend-then-arbitrate (arch.recommend-then-arbitrate).
      - id: arch.dm-drift-dispatch
        labels: [evidence, user-gate, stewardship]
        class: floor
        kind: duty
        text: Dispatch the scoped drift probe and take each finding to a user disposition.
      - id: arch.dm-route-triggers
        labels: [reporting, user-gate, stewardship]
        class: floor
        kind: duty
        text: >-
          Route every fired upgrade trigger to /mochiko:feature's growth door — flagged in the
          health view until it is routed or the user rules it closed.
      - id: arch.dm-store-integrity-close
        labels: [landing, stewardship]
        class: floor
        kind: duty
        text: >-
          Keep store integrity intact at close — the derived index regenerated, orphans flagged,
          statuses agreeing across index and ledger; a `Scope:` line changed in the visit surfaces
          "shelf set changed — a setup amend is owed", no watcher.
      - id: arch.dm-km-landing
        labels: [landing, stewardship]
        class: floor
        kind: duty
        text: >-
          Execute the KM landing for desk-side writes, per
          .mochiko/memory/knowledge-management.md.
        when: {km_file: present}
      - id: arch.dm-close-verdict
        labels: [reporting, landing]
        class: floor
        kind: duty
        text: Close the visit with a verdict against its done condition.
      - id: arch.seat-architect-producer
        labels: [seats]
        class: must
        text: >-
          ${producer_seat} is the producing seat: the baseline, shelf-walk stance batches and
          amendments — the rows and spine elements a visit file rules — and the store's
          diagrams. Recommends with reasons; never rules. Plans first, read-only, in a plan-only
          dispatch, and works only on a plan a fresh peer passed and you approved.
      - id: arch.seat-tech-lead-grader
        labels: [seats, independence]
        class: must
        text: >-
          ${grader_seat} is the independent grader of the architect's judgment writes, before the
          user's ratification: it grades a drawing against the targets its `Draws:` line cites,
          and re-checks the outside claims the rows rest on under the review-seat duty of
          mochiko:review-brainstorm's `references/EXTERNAL-CLAIMS.md`, which its brief names.
          Status flips and orphan cleanup are transcription and ride the landing audit instead.
        anchor: 2026-08-19 product-architecture-schema D11
      - id: arch.seat-drift-probe-empirical
        labels: [seats, independence, evidence]
        class: must
        text: >-
          The drift-probe seat is an empirical read of the codebase grading the store's
          `As-built:` claims. Never the seat that wrote the claim; evidence, never memory.
      - id: arch.grader-checks-joined-ids
        labels: [independence]
        class: must
        text: >-
          ${grader_seat}'s grade of a store write also covers its AX, SPN and NFR IDs, against the
          IDs section of `templates/artifact-format.md`: each new row's ID joined, its slug naming
          the row's topic; each citation carrying its definition's slug, or bare where that
          definition is bare.
        anchor: 2026-10-08 human-readable-ids D6
      - id: arch.focus-blind-list
        labels: [independence, seats]
        class: must
        kind: duty
        text: >-
          Before the focus set closes, one fresh persona-less `general-purpose` seat spawned with
          `model: opus` draws the visit's blind list from the focus context (arch.focus-context),
          never the visit file, and returns the parts, concerns and forks it sees; a part the
          shelf lacks is how an off-shelf concern enters. One list per visit, skipped only on a
          single-row ask — the goal names one row and the user hands in its direction.
        when: {visit_kind: [ruling, delta]}
        anchor: 2026-10-11 architecture-brainstorm-interview D4
      - id: arch.rows-from-visit-file
        labels: [seats, independence]
        class: must
        kind: duty
        text: >-
          At the set's close the ${producer_seat} seat authors the rows and spine elements from
          the visit file in the same visit, each row linking the file as its rationale home, and
          ${grader_seat} grades them against the file for sameness of meaning — additive to the
          user's word on the row text, never a substitute; the visit does not close until the rows
          are in.
        when: {visit_kind: ruling}
        anchor: 2026-10-11 architecture-brainstorm-interview D3
  - id: arch.sec.reserved
    title: Reserved to the user — never the desk's
    intent: 'Decisions held by the user: gates, rulings, and escalations no seat may take.'
    rules:
      - id: arch.user-reserved-rulings
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          Reserved to the user: every row stance, the baseline confirmation, every amendment, each
          drift finding's disposition, the shelf-scope override, the capability mint at
          /mochiko:feature's growth door (arch.dispatch-feature-growth-door), and the
          governance-ledger waiver a true floor drop needs.
        anchor: 2026-08-19 product-architecture-schema
      - id: arch.gate-focus-confirm
        labels: [user-gate]
        class: must
        kind: gate
        text: >-
          Confirming the ruled set is the user's, on a screen of its own — never the goal's or
          the rows' — and the ${producer_seat} seat authors nothing before it.
        when: {visit_kind: [ruling, delta]}
        anchor: 2026-10-11 architecture-brainstorm-interview
      - id: arch.ruling-places
        labels: [user-gate]
        class: must
        kind: binding
        text: >-
          The desk's rulings outside its focus stage take the asking line (arch.asking-line), each
          with its next writer set. Writer on: each drift finding's disposition
          (arch.dm-drift-dispatch), the rows written from it and ${grader_seat}'s grade
          (arch.seat-tech-lead-grader) checking the meaning kept; a shelf-scope override
          (arch.shelf-scope-source), landing as the exact text of the store write to the `Scope:`
          line. Writer off: a fired trigger the user rules closed (arch.dm-route-triggers). The
          governance-ledger waiver a true floor drop needs (arch.floor-precedence) stays a yes /
          no gate, its writer held — the ledger records it through /mochiko:setup
          (arch.dispatch-setup-waiver).
        anchor: 2026-10-15 engine-follow-up D10
  - id: arch.sec.tools
    title: Tools
    intent: >-
      The store, its skills and schemas, the probes, and the dispatch targets the desk binds to.
    rules:
      - id: arch.tools-referenced-never-restated
        class: must
        extends: common.tools-referenced-never-restated
      - id: arch.tools-store
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The store lives at ${store_dir}/: `spine.md` (the topology deep view — containers,
          boundaries, communication styles), the `concerns.md` ledger of `AX-XXX` rows, a row
          graduating to its own file at ${store_dir}/concerns/AX-XXX-<slug>.md only when it
          carries real depth — extend beats mint — and the diagram set, one file per diagram
          in ${store_dir}/diagrams/. Repo-root `ARCHITECTURE.md` is the store's derived index —
          spine thumbnail, AX summary table, diagrams section, health view — and is a rendered
          projection, never a second store.
      - id: arch.tools-store-skill
        labels: [floor-pointer]
        class: must
        kind: binding
        text: >-
          mochiko:authoring-architecture-store is the store's owner: AX and spine grammar, the
          element lifecycle (`ruled` → `proposed (<key>)` → at sign-off `in-flight (<key>)` /
          `modifying (<key>)` / `removing (<key>)` → `built`, or `removed` for a removal; the
          key `FEAT-XXX`, `EPIC-XXX` or `lane-<slug>`), the stance vocabulary (`decided` ·
          `not-now` · `n-a` · `open`), row graduation, the diagram set and its stale compare,
          the fold at landings, the health view, and the index regeneration.
        pointer: mochiko:authoring-architecture-store
      - id: arch.tools-shelves-skill
        labels: [floor-pointer]
        class: must
        kind: binding
        text: >-
          mochiko:patterns-architecture-shelves is the opinion carrier: the per-surface shelves as
          data, their suggested defaults and upgrade-trigger patterns, and the
          recommend-then-arbitrate deal.
        pointer: mochiko:patterns-architecture-shelves
      - id: arch.shelf-scope-source
        labels: [binding, user-gate]
        class: must
        kind: binding
        text: >-
          Shelf scope is read from the `Scope:` line in `spine.md`'s header — declared there by
          /mochiko:setup and overridable at the desk by an ordinary store write to that line, the
          user's ruling like any other. The store carries the scope; a full-stack or monorepo
          product composes the shelves its scope names.
      - id: arch.tools-system-design
        labels: [floor-pointer]
        class: must
        kind: binding
        text: >-
          mochiko:patterns-system-design carries altitude and diagram craft for the spine, the
          store's diagram set and the deltas features draft against it.
        pointer: mochiko:patterns-system-design
      - id: arch.tools-store-schema
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The store shape is ${store_schema}, the shelf data ${shelf_schema}. A small required
          core; the schema constrains the skeleton, never the voice.
      - id: arch.tools-brownfield-reconstruction
        labels: [scope-entry, user-gate]
        class: must
        text: >-
          The first visit to an existing repo derives the store from what exists — repo
          `ARCHITECTURE.md` prose, any per-feature `architecture.md` files, `nfrs.md`, structural
          `D-XXX` rows — presents it for confirmation, then archives the absorbed sources,
          unchanged, to .mochiko/archive/product-baselines/<date>/ under the names that home
          declares — the prose as `ARCHITECTURE-prose.md`, each per-feature file as
          `<FEAT-ID>-architecture.md`, `nfrs.md`, and the constraints file whose structural rows
          were absorbed as `constraints-and-decisions.md`. The derivation is `Assumed` — code
          and prose read as they stand, and a partial source can poison the baseline it seeds: say
          so when you present it.
        anchor: 2026-08-19 product-architecture-schema D16
      - id: arch.tools-drift-probe-scope
        labels: [evidence, user-gate, stewardship]
        class: must
        text: >-
          The scoped drift probe covers rows touched since the last desk visit plus a sample of
          the retrofit-expensive rows; never all rows every visit. Findings land in the touched
          row's `Drift:` field and take a user disposition at the desk.
      - id: arch.dispatch-feature-growth-door
        labels: [user-gate]
        class: must
        kind: routing
        text: >-
          /mochiko:feature is the dispatch target for a fired upgrade trigger: it arrives at the
          growth door as a candidate under the capability-write test; extend-beats-mint applies
          and the user rules the mint — the architecture lens proposes, the map machinery
          disposes.
        anchor: 2026-08-19 product-architecture-schema D13
      - id: arch.dispatch-setup-waiver
        labels: [user-gate]
        class: must
        kind: routing
        text: >-
          /mochiko:setup is the dispatch target for a governance-ledger waiver when a
          floor-asserted obligation must truly drop (arch.floor-precedence).
      - id: arch.dispatch-implement-delivery
        labels: [scope-entry]
        class: must
        kind: routing
        text: /mochiko:implement owns all delivery; the desk runs none of it.
        anchor: 2026-08-26 plan-stage-utility
      - id: arch.register
        labels: [reporting, binding]
        class: must
        kind: binding
        extends: common.register
      - id: arch.focus-stage
        labels: [scope-entry, user-gate]
        class: must
        kind: duty
        text: >-
          At the focus moment the parts this visit decides are worked with the user on the
          thinking stage with its ruled-set contract on: the visit goal is its opening, the focus
          set with the defaults batch as confirmed is the ruled set, saved in the visit file, and
          the ${producer_seat} seat is the next writer. The set's close sits inside the visit's
          done condition, never beside it.
        when: {visit_kind: [ruling, delta]}
        anchor: 2026-10-11 architecture-brainstorm-interview D1
      - id: arch.focus-unit
        labels: [user-gate, binding]
        class: must
        kind: binding
        text: >-
          The user rules each focus item as three things: the part — a store element, an AX row,
          a shelf row or a spine area — the direction for it in their own words, and one
          sentence on how they would know it is right, or `open`. The sentence lands in the visit
          file always, as the upgrade trigger on a `not-now` row and as the first line of
          `Rationale` on a `decided` one; a target number comes only from the user, and an `open`
          sentence stays open on the row, never filled in by the ${producer_seat} seat.
        anchor: 2026-10-11 architecture-brainstorm-interview D2
      - id: arch.focus-context
        labels: [evidence, binding]
        class: must
        kind: binding
        text: >-
          To propose a focus you read — and the blind seat is given — the visit goal, the
          store's `Scope:` line, the derived index, any brainstorm record named, `FEATURES.md`
          with the capability entries in the visit's territory, the codebase analysis where one
          exists and, for a feature's delta, its spec; on a greenfield baseline, where the index
          is a scaffold, the product's own description and the capability map carry the context.
        when: {visit_kind: [ruling, delta]}
        anchor: 2026-10-11 architecture-brainstorm-interview D4
      - id: arch.visit-file
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The visit keeps its state in one visit file, `visit.md`, which you write as the visit
          goes to the shape `mochiko-cli template architecture-visit` renders; you hold its pen,
          the ${producer_seat} seat the store's.
        when: {visit_kind: [ruling, delta]}
        anchor: 2026-10-11 architecture-brainstorm-interview D3
      - id: arch.first-visit-stage
        labels: [scope-entry]
        class: must
        text: >-
          The first visit's focus stage is the baseline's elicitation: greenfield, the shelf rows
          and the blind list supply its candidates and the user's directions become the baseline's
          rulings; brownfield, the reconstructed derivation is its fact base, the stage picks
          which derived elements get a fork of their own and which the batch confirms, and its
          close is the confirm step.
        when: {store_ruled_content: absent}
        anchor: 2026-10-11 architecture-brainstorm-interview
      - id: arch.feature-delta-visit
        labels: [scope-entry]
        class: must
        text: >-
          A feature's delta visit, `/mochiko:architecture <FEAT-ID>`, closes in a visit file keyed
          to the feature — its directory's slug carrying the joined FEAT id lower-cased, its
          header naming it — and the desk writes nothing to the store for it and no link on the
          feature's capability entry.
        when: {visit_kind: delta}
        anchor: 2026-10-11 architecture-brainstorm-interview D5
  - id: arch.sec.ways-of-working
    title: Ways of Working
    intent: >-
      How the desk reports, references, separates authors from graders, arbitrates, and routes its
      dispatches.
    rules:
      - id: arch.proactive-report-first
        labels: [reporting, stewardship]
        class: must
        kind: duty
        text: Proactive report first — health before the ask, every visit.
      - id: arch.reference-never-restate
        labels: [floor-pointer]
        class: must
        text: >-
          Reference, never restate — the store grammar lives in
          mochiko:authoring-architecture-store, the opinions in the shelf data, the delivery
          bounds in the pipeline commands; the desk points at them and adds nothing.
      - id: arch.author-grader-separation
        labels: [independence]
        class: floor
        text: >-
          Author ≠ grader — wherever a seat produces (baseline, stance batch, amendment,
          diagram), no output is cleared by its author; a producing seat plans first, read-only,
          in a plan-only dispatch, and works only on a plan a fresh peer of its persona type
          passed per `mochiko:review-seat-plan` and you approved.
        anchor: 2026-09-03 producer-plan-enforcement D8
      - id: arch.recommend-then-arbitrate
        labels: [user-gate]
        class: must
        text: >-
          Recommend, then arbitrate — a shelf row is dealt with its suggested default and the
          reasoning behind it, and the user forms the stance. A default is never applied by
          silence.
        anchor: 2026-08-19 product-architecture-schema D5
      - id: arch.model-tiering
        labels: [seats, floor-pointer]
        class: must
        kind: routing
        text: >-
          Exploration and fact-finding dispatches ride the class-keyed tiering floor:
          locate/enumerate reads go to a native Explore subagent spawned model: ${explore_model},
          interpretive or absence-driven reads stay session tier — the drift probe grades claims
          against code and is interpretive, so it stays session tier and sends only its
          locate/enumerate legs down. Every seat brief carries the routing rule. Class key,
          dispatch ladder, and brief obligation: mochiko:patterns-model-tiering, referenced never
          restated.
        pointer: mochiko:patterns-model-tiering
        anchor: 2026-08-16 model-tiered-seats
      - id: arch.single-writer-store
        labels: [seats, stewardship]
        class: must
        text: >-
          Single writer on the store — one seat holds the pen per visit; the derived index is
          regenerated by the store skill mochiko:authoring-architecture-store on every store
          write, never hand-edited alongside it.
      - id: arch.no-git-mutations
        class: must
        extends: common.no-git-mutations
      - id: arch.rulings-plain-text
        class: must
        extends: common.acceptance-plain-text
      - id: arch.artifact-home
        labels: [binding]
        class: floor
        kind: binding
        text: >-
          The store's files have a declared home: render `mochiko-cli home
          .mochiko/product/architecture` before the first write. `spine.md` binds the
          `architecture-spine` template and `concerns.md` binds `architecture-concerns`: each
          takes its shape from `mochiko-cli template <kind>` and its bound from the home — per
          `##` entry, the templates' section budgets replaced, no whole-file bound; a graduated
          row's file is `<AX-ID>.md` in `concerns/`, under that sub-home's whole-file bound, and a
          diagram's file `<slug>.md` in `diagrams/`, bound per entry. The visit file's home is
          `.mochiko/architecture/desk/<date-slug>/`, outside the store — render `mochiko-cli
          home` on it before its first write. The repo-root index is derived, never hand-written.
        anchor: 2026-09-13 hook-enforced-artifact-schema D1
      - id: arch.focus-batch
        labels: [user-gate, evidence]
        class: must
        text: >-
          The stage's defaults batch holds the shelf rows in play with no stance yet — `open`,
          or newly in scope — each shown with its suggested default, what it costs and what
          argues against it; a `decided`, `not-now` or `n-a` row is never re-dealt by a batch and
          changes only as a focus item the user pulls in — an amendment demand, a fired trigger
          or a drift finding. Focus items and batch rows are each walked in retrofit-cost order.
        anchor: 2026-10-11 architecture-brainstorm-interview D1
      - id: arch.outside-claims
        labels: [evidence]
        class: must
        text: >-
          An outside claim a focus item hangs on — a provider limit, a price, a platform
          behaviour — is taken from its live source, never from memory, and the visit file
          records that source, or `unknown`, beside the item.
        anchor: 2026-10-11 architecture-brainstorm-interview
      - id: arch.desk-redraw
        labels: [stewardship]
        class: must
        kind: duty
        text: >-
          A store change ruled at the visit redraws, during the visit and inside the ruled set,
          every diagram it touches.
        when: {visit_kind: ruling}
        anchor: 2026-10-11 architecture-brainstorm-interview D8
      - id: arch.diagram-signoff
        labels: [user-gate, evidence]
        class: must
        text: >-
          A diagram is signed off on its Mermaid text, which you confirm parses before the
          sign-off — by the render surface where one exists, else by its author's own read.
          Where the session can render it, the user sees the picture beside the text; where it
          cannot, a one-line note says it was not rendered here, that it renders where it is
          viewed, and which read confirmed the parse; publishing to a hosted service to render it
          waits for the user's yes, a local preview preferred.
        anchor: 2026-10-11 architecture-brainstorm-interview D9
      - id: arch.asking-line
        class: must
        extends: common.asking-line
        anchor: 2026-10-15 engine-follow-up D10
  - id: arch.sec.boundaries
    title: Boundaries — the non-waivable floor
    intent: Floor obligations no seat and no in-visit ruling can waive.
    rules:
      - id: arch.truth-user-ruling
        labels: [user-gate]
        class: floor
        kind: reservation
        text: >-
          Architecture truth is the user's ruling. The desk elicits, recommends, and records; a
          stance, a baseline, or an amendment lands only on the user's word. A row left unruled
          stays `open` and shows in the health view — it never acquires a stance by default, by
          silence, or by the desk's own judgment.
        anchor: 2026-08-19 product-architecture-schema D5
      - id: arch.breadth-invariant
        labels: [evidence, floor-pointer]
        class: floor
        text: >-
          The breadth invariant: every shelf row in scope is walked. A row may close in two
          seconds — `n-a`, one line, done — but it is never silently skipped, and the walk
          order is by retrofit cost: tenancy, auth, and data partitioning before flags and
          experimentation. A shelf scope narrowed at the desk is the user's explicit override,
          recorded as one.
        pointer: mochiko:patterns-architecture-shelves
        anchor: 2026-08-19 product-architecture-schema D5
      - id: arch.floor-precedence
        labels: [user-gate]
        class: floor
        text: >-
          Where a governance floor card asserts the category, `n-a — genuinely never` is
          unavailable on that row: the legal moves are a stance within the obligation, `n-a —
          handled elsewhere` with its required pointer, or a narrowing. A true drop is a
          governance event and routes to a governance-ledger.md waiver through /mochiko:setup —
          never granted at the shelf. An arbitrated constitution card binds code-layer structure
          and a shelf row binds product topology; a genuine conflict between them is the user's.
        anchor: 2026-08-19 product-architecture-schema D14
      - id: arch.na-handled-elsewhere-pointer
        labels: [evidence]
        class: floor
        text: >-
          `n-a — handled elsewhere` carries its pointer. The reason axis is not decoration: a
          concern another repo or system owns names that owner. Only genuinely never may stand
          without one.
      - id: arch.derived-index-never-hand-maintained
        labels: [floor-pointer, landing, stewardship]
        class: floor
        text: >-
          The derived index is never hand-maintained. The store is the single source; the root
          `ARCHITECTURE.md` is regenerated from it by the store skill
          mochiko:authoring-architecture-store on every write. An index-vs-ledger disagreement is
          a defect fixed on sight, never reconciled by editing the index.
        pointer: mochiko:authoring-architecture-store
        anchor: 2026-08-19 product-architecture-schema
      - id: arch.drift-empirical
        labels: [evidence, independence, stewardship]
        class: floor
        text: >-
          Drift is empirical. An `As-built:` claim is graded against the code by a seat that reads
          it, never affirmed from memory or from the ruling that preceded it. An ungraded claim is
          reported as ungraded.
      - id: arch.no-depth-dial-coupling
        labels: [scope-entry]
        class: floor
        text: >-
          The desk never reads the governance low/high depth level: shelf scope and per-row
          stances are its only adaptiveness, and `not-now` is the per-dimension depth valve. The
          governance dial governs a floor row's rigor; the desk governs its stance — two
          instruments, two axes.
        anchor: 2026-08-19 product-architecture-schema D9
      - id: arch.no-delivery-harness
        labels: [scope-entry]
        class: floor
        text: >-
          No delivery harness at the desk. The desk rules architecture and routes work; it plans
          and builds none of it. Delivery leaves for /mochiko:feature or the pipeline, and the
          boundary is audited from the store delta the work leaves behind.
      - id: arch.no-silent-store-mutations
        labels: [evidence, stewardship]
        class: floor
        text: >-
          No silent store mutations. Every write is visible in the store and in the regenerated
          index; an integrity defect — an orphan element, a dead `Work:` pointer, a status
          disagreement — is fixed on sight and surfaced, never quietly corrected.
      - id: arch.sound-loop-floor
        labels: [floor-pointer, independence]
        class: floor
        text: >-
          A judgment-authored write to a governing surface obliges the loop: a seat produces on a
          plan a fresh peer passed and you approved, an independent non-author seat reviews before
          the user's gate — the user's ruling alone never substitutes for the review leg — and
          every baseline, stance batch, and amendment takes that review leg. Status flips and
          orphan cleanup are transcription and ride the landing audit. Trigger test, exemptions,
          seat wiring, and disclosure: mochiko:patterns-sound-loop, referenced never restated.
        pointer: mochiko:patterns-sound-loop
        anchor: 2026-08-13 charter-ritual-balance
      - id: arch.transport-floor
        class: floor
        when: {seats: multi}
        extends: common.transport-floor
      - id: arch.thinking-stage
        class: floor
        extends: common.thinking-stage
        anchor: 2026-10-11 implement-brainstorm-led D3
  - id: arch.sec.fail-conditions
    title: Not done — default FAIL
    intent: >-
      The kind: fail set — any one standing fails the visit; the .md Not-done line cites the
      count this render prints.
    rules:
      - id: arch.fail.no-verdict
        labels: [reporting]
        class: floor
        kind: fail
        text: A visit that ends with no stated done-condition verdict.
        enforces: [arch.dm-converge-goal, arch.dm-close-verdict]
      - id: arch.fail.write-outside-focus
        labels: [user-gate]
        class: floor
        kind: fail
        text: >-
          A desk visit's store write — a baseline, a stance batch, an amendment or a diagram —
          with no ruled set behind it in a visit file, or one outside that set.
        enforces: [arch.focus-stage, arch.visit-file, arch.rows-from-visit-file, arch.gate-focus-confirm]
        anchor: 2026-10-11 architecture-brainstorm-interview
