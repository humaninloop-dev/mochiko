# Derived view of the /mochiko:setup command content schema — a projection of the migration log,
# regenerated by `mochiko-cli views emit` and never hand-edited. The command's rules are rendered
# at fire by `mochiko-cli`, never read from a file. Two semantics live only here:
#   class   floor = non-waivable · must = binding obligation · advisory = guidance, not binding.
#   conditions:  each dimension declares its resolution point (entry-derived · surface-presence ·
#           moment-resolved(<moment>) · user-ruled · standing-trigger); a moment-resolved
#           dimension is unresolved until its named moment — rules gated on it are inapplicable
#           until then.
kind: command
command: setup
vars:
  explore_model: haiku
  memory_dir: .mochiko/memory
  product_dir: .mochiko/product
  plugin_root: ${CLAUDE_PLUGIN_ROOT}
conditions:
  mode:
    values: [greenfield, brownfield, amend]
    resolution: user-ruled
    note: >-
      proposed from what the workspace shows; the user rules it whenever it is ambiguous
      (setup.user-mode-ruling).
  seats:
    values: [single, multi]
    resolution: standing-trigger
    note: >-
      fires the moment the run composes more than one seat, and re-fires on a seat added mid-run.
moments:
  interrogation: The inline agenda-then-catalog stage, worked card by card with the user.
  ratification: The user's ratification of the synthesis — before any surface is authored.
  acceptance: >-
    The user's final acceptance of the surface set, flagged proposal by flagged proposal.
  close: Where the feature map and the bootstrapped surfaces must exist.
sections:
  - id: setup.sec.roles
    title: Roles & Responsibilities — seat wiring
    intent: How the run is led and staffed, and the independence its grading seats carry.
    rules:
      - id: setup.staffing-latitude
        labels: [seats]
        class: must
        kind: latitude
        text: Teammates or subagents per seat is your call.
      - id: setup.interrogation-inline
        labels: [seats]
        class: must
        kind: duty
        text: >-
          Run the interrogation yourself, inline — the agenda's dimensions worked adaptively via
          mochiko:analysis-iterative, then the catalog deck, card by card,
          recommend-then-arbitrate (agenda and deck named in setup.interrogation-inputs).
        pointer: mochiko:analysis-iterative
      - id: setup.stress-test-cold-seat
        labels: [independence, user-gate]
        class: must
        text: >-
          The synthesis (${memory_dir}/governance-intent.md) is your pen, so its pre-ratification
          stress-test is always a cold seat, or the user's recorded waiver.
      - id: setup.blind-map-dispatch
        labels: [independence, seats]
        class: floor
        text: >-
          The pre-ratification stress-test seat is spawned in two messages — first the setup
          topic / project identity and goal only, never the synthesis path
          (${memory_dir}/governance-intent.md), so it builds its Phase 0 angle map blind to what
          the interrogation concluded; its map returns before you send the synthesis path and the
          cold read begins. In a pair, both seats build their maps independently.
  - id: setup.sec.reserved
    title: Reserved to the user — never the run's
    intent: 'Decisions held by the user: gates, rulings, and escalations no seat may take.'
    rules:
      - id: setup.coverage-survivor-routing
        labels: [user-gate]
        class: must
        kind: routing
        text: >-
          A coverage finding surviving the pre-ratification stress-test (setup.blind-map-dispatch)
          questions the setup's scope, not a card — present each gap as a candidate topic; the
          user rules the path: explore now (re-enter mochiko:analysis-iterative on that angle; the
          re-elicited intent lands in the GI-XXX namespace), rule inline, or defer. A gap that
          overlaps an agenda dimension keeps the ordinary interrogation-follow-up path.
      - id: setup.user-mode-ruling
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          The mode when ambiguous — greenfield / brownfield / amend — is the user's ruling.
      - id: setup.user-card-rulings
        labels: [user-gate]
        class: must
        kind: reservation
        text: Every interrogation card ruling, module ruling, and waiver is the user's.
      - id: setup.gate-synthesis-ratification
        labels: [user-gate]
        class: floor
        kind: gate
        text: Synthesis ratification is the user's.
      - id: setup.user-conflict-rulings
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          Detected reality vs declared intent conflicts are the user's — confronted in the open,
          never silently resolved.
        when: {mode: [brownfield]}
      - id: setup.user-map-confirmation
        labels: [user-gate]
        class: must
        kind: reservation
        text: Confirmation of the reconstructed feature map, entry by entry, is the user's.
        when: {mode: [brownfield]}
      - id: setup.gate-final-acceptance
        labels: [user-gate]
        class: floor
        kind: gate
        text: >-
          Final acceptance of the surface set is the user's, flagged proposal by flagged proposal.
  - id: setup.sec.tools
    title: Tools bindings
    intent: Surfaces, inputs, templates, and hand-offs the run binds to.
    rules:
      - id: setup.surface-set
        labels: [binding, floor-pointer]
        class: must
        kind: binding
        text: >-
          The surface set: the marked governance region in CLAUDE.md (`<!--
          mochiko:governance:begin/end -->`) · `paths`-scoped .claude/rules/mochiko/*.md · skill
          pointers · ${memory_dir}/governance-ledger.md · the trace summary. Composition and
          read scope: mochiko:authoring-constitution.
        pointer: mochiko:authoring-constitution
      - id: setup.synthesis-artifact
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The synthesis: ${memory_dir}/governance-intent.md, GI-XXX namespace, from the
          governance-intent template (rendered by mochiko-cli template governance-intent) — the
          durable amend baseline.
      - id: setup.interrogation-inputs
        labels: [binding, scope-entry]
        class: must
        kind: binding
        text: >-
          Interrogation inputs: ${plugin_root}/skills/authoring-constitution/references/ —
          INTERROGATION-AGENDA.md, the catalog/ deck, DOMAIN-DEPENDENCIES.md; brownfield analysis
          via mochiko:analysis-codebase into ${memory_dir}/codebase-analysis.md.
        pointer: mochiko:analysis-codebase
      - id: setup.constitution-superseded
        labels: [binding]
        class: must
        text: >-
          A ${memory_dir}/constitution.md on disk is superseded — delete on sight, say so in one
          line.
      - id: setup.km-module-scaffold
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The knowledge-management module adopted → scaffold per
          templates/constitution-modules/knowledge-management.md, including the project-pinned
          copy at ${memory_dir}/knowledge-management.md; its never-overwrite floor holds.
      - id: setup.feature-map-brownfield
        labels: [landing]
        class: must
        text: >-
          The analysis (setup.interrogation-inputs) extends into a feature-map reconstruction —
          delivered capabilities derived from the code (routes, UI surfaces, services), confirmed
          with the user, landing as the initial FEATURES.md + .mochiko/features/ entries with
          `delivered` status and the reconstructed-from-code mark (shape: the features-index and
          feature-entry templates — mochiko-cli template features-index and mochiko-cli template
          feature-entry; map machinery and the first-touch re-verify obligation:
          mochiko:authoring-feature-map).
        when: {mode: [brownfield]}
        pointer: mochiko:authoring-feature-map
      - id: setup.feature-map-greenfield
        labels: [landing]
        class: must
        text: Scaffold the empty FEATURES.md index.
        when: {mode: [greenfield]}
      - id: setup.baselines-bootstrap
        labels: [landing]
        class: must
        text: >-
          `Assumed`: the brownfield analysis also bootstraps the product baselines —
          data-model.md · contracts/ · constraints-and-decisions.md · quickstart.md — at
          ${product_dir}/ (ARCHITECTURE.md stays repo root, now as the store's derived index) —
          from the delivered code; greenfield seeds those baselines at the first implement run's
          design phase instead.
        anchor: 2026-08-26 plan-stage-utility
      - id: setup.store-scaffold-unconditional
        labels: [binding]
        class: must
        text: >-
          The architecture store's scaffold is unconditional — on every path,
          ${product_dir}/architecture/ is created where it does not exist, with a spine.md stub
          whose header carries the `Scope:` line (setup.architecture-scope-handoff) and an empty
          concerns.md beside it, so the store's layout is complete from birth; greenfield's stub
          is simply a header with no topology under it, and the scaffold creates only what is
          missing — never writing over a store that already carries content.
        anchor: 2026-08-19 product-architecture-schema
      - id: setup.architecture-scope-handoff
        labels: [binding]
        class: must
        text: >-
          The run reads which surface types the product carries — backend-service ·
          frontend-web · mobile · desktop, composed for a full-stack or monorepo product — and
          declares them on the `Scope:` line in the header of
          ${product_dir}/architecture/spine.md, written as a stub by the unconditional store
          scaffold (setup.store-scaffold-unconditional) — so every setup run leaves the scope
          declared; the derived index (repo-root ARCHITECTURE.md) renders it. The declaration is
          write-if-absent: where the `Scope:` line is missing it is declared, and an existing line
          is left alone. The store carries the scope — setup does not hold it. It is a handoff,
          not a ruling: the /mochiko:architecture desk deals the shelves that scope selects, and
          the user may override it at the desk by an ordinary store write to that same line. No
          architecture stance is taken in the run.
        anchor: 2026-08-19 product-architecture-schema
      - id: setup.register
        class: must
        kind: binding
        extends: common.register
      - id: setup.next-step
        labels: [reporting]
        class: advisory
        kind: routing
        text: >-
          Next step: /mochiko:specify for the first feature, and /mochiko:architecture for the
          product's architecture baseline — peer doors, neither ahead of the other (+
          /mochiko:brainstorm when knowledge-management was adopted).
  - id: setup.sec.ways-of-working
    title: Ways of Working
    intent: How the run plans, grades, and reports; model routing for its seats.
    rules:
      - id: setup.model-tiering
        class: must
        kind: routing
        extends: common.model-tiering
        anchor: 2026-08-16 model-tiered-seats
      - id: setup.plan-approval-producers
        class: must
        extends: common.plan-approval-producers
      - id: setup.author-grader-default-fail
        class: floor
        extends: common.author-grader-default-fail
      - id: setup.no-git-mutations
        class: floor
        extends: common.no-git-mutations
      - id: setup.acceptance-plain-text
        class: floor
        extends: common.acceptance-plain-text
  - id: setup.sec.boundaries
    title: Boundaries — the non-waivable floor
    intent: Floor obligations no seat and no in-run ruling can waive.
    rules:
      - id: setup.transport-floor
        class: floor
        when: {seats: multi}
        extends: common.transport-floor
      - id: setup.durables-never-deleted
        labels: [binding, stewardship]
        class: floor
        text: >-
          Never offer to delete the synthesis ${memory_dir}/governance-intent.md or the ledger
          ${memory_dir}/governance-ledger.md.
      - id: setup.governance-region-ownership
        labels: [binding]
        class: floor
        text: >-
          The governance region in CLAUDE.md (`<!-- mochiko:governance:begin/end -->`) is
          setup-owned and idempotently regenerated; everything outside those markers is user
          content, never touched.
      - id: setup.carve-outs-preserved
        labels: [binding]
        class: floor
        text: >-
          The governance-surfaces template's marked carve-outs are preserved verbatim, never
          regenerated over the user's values: the `mochiko:domain-registry` block in the
          domain-layer rules file under .claude/rules/mochiko/, and the `mochiko:output-style`
          pair — the switch line in the CLAUDE.md governance region plus
          .claude/rules/mochiko/output-style.md.
        pointer: mochiko:authoring-constitution
      - id: setup.map-never-overwrite
        labels: [landing]
        class: floor
        text: >-
          The never-overwrite floor covers every feature-map write the run makes — the
          brownfield reconstruction (setup.feature-map-brownfield) and the greenfield scaffold
          (setup.feature-map-greenfield) are its instances, not its extent — and an amend run
          makes none.
      - id: setup.store-ruled-content-never-here
        labels: [binding, stewardship]
        class: floor
        text: >-
          The store's ruled content is never authored in the run, on any path: a file holding only
          a `Scope:` header is scaffold, not ruled content, and the first /mochiko:architecture
          visit is what elicits it (greenfield) or reconstructs it from what exists and confirms
          it with the user (brownfield) — those two paths are instances of its reach, not its
          extent.
        anchor: 2026-08-19 product-architecture-schema
  - id: setup.sec.fail-conditions
    title: Not done — default FAIL
    intent: >-
      The kind: fail set — any one standing fails the run; the .md Not-done line cites the count
      this render prints.
    rules:
      - id: setup.fail.pre-ratification-authoring
        labels: [user-gate]
        class: floor
        kind: fail
        text: A surface authored before the intent was ratified.
        enforces: [setup.gate-synthesis-ratification]
        anchor: 2026-08-26 command-content-schema D7
      - id: setup.fail.unclosed-trace
        labels: [evidence]
        class: floor
        kind: fail
        text: An unclosed trace from ratified intent to authored surfaces.
        enforces: []
        note: >-
          the intent→surface trace obligation is owned by mochiko:authoring-constitution, bound
          at setup.surface-set — no local rule states it.
        anchor: 2026-08-26 command-content-schema D7
      - id: setup.fail.author-graded
        labels: [independence]
        class: floor
        kind: fail
        text: The governance surface set never graded by anyone but its author.
        enforces: [setup.author-grader-default-fail, setup.stress-test-cold-seat]
        anchor: 2026-08-26 command-content-schema D7
      - id: setup.fail.floor-category-uncovered
        labels: [user-gate]
        class: floor
        kind: fail
        text: A floor category with neither principle nor recorded waiver.
        pointer: mochiko:authoring-constitution
        enforces: []
        note: >-
          the Essential Floor category set is owned by mochiko:authoring-constitution, carried on
          this node's own pointer: — no local rule enumerates it.
        anchor: 2026-08-26 command-content-schema D7
      - id: setup.fail.no-acceptance
        class: floor
        kind: fail
        extends: common.no-acceptance
        enforces: [setup.gate-final-acceptance]
        anchor: 2026-08-26 command-content-schema D7
      - id: setup.fail.no-feature-map
        labels: [landing]
        class: floor
        kind: fail
        text: >-
          No feature map at close — brownfield reconstruction unconfirmed, greenfield index
          unscaffolded, or, on an amend, a missing map neither surfaced nor offered.
        enforces: [setup.feature-map-brownfield, setup.feature-map-greenfield, setup.user-map-confirmation]
        anchor: 2026-08-26 command-content-schema D7
tombstones:
  - id: setup.sec.harness
    disposition: >-
      superseded → rules redistributed across the D4 six-set
      (command-md-scaffold-standardization D3/D4/D5)
  - id: setup.sec.bindings
    disposition: >-
      superseded → rules redistributed across the D4 six-set
      (command-md-scaffold-standardization D3/D4/D5)
