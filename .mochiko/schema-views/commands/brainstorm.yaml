# Derived view of the /mochiko:brainstorm command content schema — a projection of the migration log,
# regenerated by `mochiko-cli views emit` and never hand-edited. The command's rules are rendered
# at fire by `mochiko-cli`, never read from a file. Two semantics live only here:
#   class   floor = non-waivable · must = binding obligation · advisory = guidance, not binding.
#   conditions:  each dimension declares its resolution point (entry-derived · surface-presence ·
#           moment-resolved(<moment>) · user-ruled · standing-trigger); a moment-resolved
#           dimension is unresolved until its named moment — rules gated on it are inapplicable
#           until then.
kind: command
command: brainstorm
vars:
  record_path: .mochiko/brainstorms/<slug>/record.md
  index_path: .mochiko/brainstorms/index.md
  km_path: .mochiko/memory/knowledge-management.md
  explore_model: haiku
conditions:
  km_file:
    values: presence
    resolution: surface-presence
    note: the knowledge-management file at ${km_path}.
  seats:
    values: [single, multi]
    resolution: standing-trigger
    note: >-
      fires the moment the run composes more than one seat, and re-fires on a seat added mid-run.
  size:
    values: [small, standard, too-big]
    resolution: moment-resolved(frame-hardened)
    note: >-
      small — no fog and a few forks · standard — the full flow · too-big — fog dominates;
      ruled by the user at frame hardening (brainstorm.size-users-ruling).
moments:
  session-open: Where the index is read and the session is entered as open.
  cold-review: >-
    Where the review seat reads the frozen record cold, its blind angle map already landed.
  acceptance: The user's acceptance of the record.
  close: Where the index is updated with where the outcome landed and the KM close ritual runs.
  frame-hardened: >-
    Where the user's first reply confirms or corrects the frame card and rules the size.
sections:
  - id: brainstorm.sec.roles
    title: Roles & Responsibilities — seat wiring
    intent: Lead role, seat staffing, and the review independence the session's seats carry.
    rules:
      - id: brainstorm.lead-inline-questioning
        labels: [seats]
        class: must
        kind: duty
        text: >-
          You are the lead. Plan the run and orchestrate it toward the run's goal; run the
          questioning yourself, inline, via mochiko:analysis-iterative.
        pointer: mochiko:analysis-iterative
      - id: brainstorm.staffing-latitude
        labels: [seats]
        class: must
        kind: latitude
        text: Teammates or subagents per seat is your call.
      - id: brainstorm.record-review-independence
        labels: [independence, seats]
        class: must
        text: >-
          The record at ${record_path} is yours, so its review seat is always someone else,
          reading the frozen record cold from the file.
      - id: brainstorm.blind-map-dispatch
        labels: [independence, seats]
        class: must
        text: >-
          At frame hardening a review seat is spawned with the frame's problem, destination and
          out-of-scope lines only — never ${record_path} or the session — and draws its blind
          angle map while questioning goes on without waiting for it; the fence is structural, not
          a trust ask. The same seat, or each seat of a pair, is resumed with ${record_path} for
          the end read; a fresh seat with the saved map takes it only if the first is gone.
        when: {size: [standard, too-big]}
        anchor: 2026-08-10 cold-review-gap-challenge D6
      - id: brainstorm.pair-maps-independent
        labels: [independence, seats]
        class: must
        text: In a review pair, each seat draws its own blind angle map independently.
        anchor: 2026-08-10 cold-review-gap-challenge D5
      - id: brainstorm.own-rules-win
        labels: [floor-pointer]
        class: must
        text: >-
          Where mochiko:analysis-iterative and brainstorm's own rules differ, brainstorm's rules
          win.
        anchor: 2026-10-06 brainstorm-target-state D19
      - id: brainstorm.small-session-review
        labels: [independence, seats]
        class: must
        text: >-
          The review seat's first message carries the topic and goal line only, never
          ${record_path}; its blind angle map lands before ${record_path} is sent and the cold
          read begins. The fence is structural, not a trust ask.
        when: {size: small}
        anchor: 2026-10-06 brainstorm-target-state D11
      - id: brainstorm.blind-second-list
        labels: [independence, seats]
        class: must
        kind: duty
        text: >-
          On a fork costly to undo, a fresh seat — never the review seat — gets the frame and
          the question but not your options, and returns the roads it sees; the user sees where
          its list and yours differ before ruling.
        when: {size: [standard, too-big]}
        anchor: 2026-10-06 brainstorm-target-state D7
  - id: brainstorm.sec.reserved
    title: Reserved to the user — never the run's
    intent: 'Decisions held by the user: acceptance, waivers, and the rulings no seat may take.'
    rules:
      - id: brainstorm.coverage-survivor-routing
        labels: [user-gate]
        class: must
        kind: routing
        text: >-
          A surviving coverage finding is a candidate that questions the topic itself, not a fold
          — present each gap as a candidate topic; the user rules the path: explore now
          (re-enter mochiko:analysis-iterative on that angle; the resulting decision lands in
          ${record_path}'s same `D…` namespace), rule inline, or defer.
        anchor: 2026-08-10 cold-review-gap-challenge D3
      - id: brainstorm.user-record-acceptance
        labels: [user-gate]
        class: floor
        kind: gate
        text: Record acceptance is reserved to the user — their word, never yours.
      - id: brainstorm.user-survivor-challenge
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          The disposition of any review survivor that challenges a user ruling is reserved to the
          user.
      - id: brainstorm.user-review-waiver
        labels: [user-gate]
        class: must
        kind: reservation
        text: The waiver, if the review is to be skipped, is reserved to the user.
      - id: brainstorm.user-pen-boundary
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          Any amendment to a user-ruled decision, and any new decision, is reserved to the user
          — their word, never yours.
      - id: brainstorm.frame-changes-users-word
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          After the frame hardens, a line changes only by the user's word — when a fact breaks
          it, the user changes their mind, or a decision rules something out — one line at a
          time, each change stamped in the record; a changed destination re-checks the decisions
          already made against it.
        anchor: 2026-10-06 brainstorm-target-state D3
      - id: brainstorm.size-users-ruling
        labels: [user-gate, scope-entry]
        class: must
        kind: reservation
        text: >-
          The size is yours to propose on the frame card and the user's to rule in the reply that
          confirms the frame; it may be raised at any time and is never lowered without the user's
          word.
        anchor: 2026-10-06 brainstorm-target-state D11
      - id: brainstorm.user-steers
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          In any reply the user may edit the decision map, pick which askable question comes next,
          pull a default out to its own turn, or stop the session; moving anything out of scope is
          a frame change and takes the user's word.
        anchor: 2026-10-06 brainstorm-target-state
  - id: brainstorm.sec.tools
    title: Tools bindings
    intent: Paths, templates, and skills the session binds to.
    rules:
      - id: brainstorm.deliverable-record
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The deliverable is ${record_path} — kebab-case `<slug>` derived at the start,
          decisions in one `D1…` namespace.
      - id: brainstorm.record-as-you-go
        labels: [evidence]
        class: must
        text: ${record_path} is written as the session progresses, never reconstructed at the end.
      - id: brainstorm.index-bookkeeping
        labels: [binding, landing]
        class: must
        text: >-
          Read ${index_path} before opening; enter the session on open (status: open); update at
          acceptance or supersession with where the outcome landed.
      - id: brainstorm.km-close-ritual
        labels: [landing]
        class: must
        text: Run the close ritual of ${km_path}.
        when: {km_file: present}
      - id: brainstorm.synthesis-on-request
        labels: [binding]
        class: must
        kind: binding
        text: >-
          A synthesis is written on request only, after acceptance — beside ${record_path},
          stamped *derived — record canonical*; under a review waiver, stamped *derived,
          unchecked*.
      - id: brainstorm.register
        labels: [binding, reporting]
        class: must
        kind: binding
        extends: common.register
      - id: brainstorm.next-step-offer
        labels: [landing, user-gate]
        class: must
        kind: routing
        text: >-
          Pipeline entry (e.g. /mochiko:specify when the record is honestly a feature description)
          is an offer after acceptance, never a default.
      - id: brainstorm.decision-cards
        labels: [binding]
        class: must
        kind: binding
        text: >-
          Each decision's one home in ${record_path} is a card titled by its name, with fixed
          parts — statement · why · rejected roads · accepted risk · how it was decided ·
          changed at review; everything else in the record points at the card by name with at most
          a one-line gist.
        anchor: 2026-10-06 brainstorm-target-state D9
      - id: brainstorm.facts-quoted
        labels: [evidence]
        class: must
        text: >-
          A fact enters the record as a quoted source line with its path and line number; your
          reading of it is written apart and marked as a reading.
        anchor: 2026-10-06 brainstorm-target-state D5
  - id: brainstorm.sec.ways-of-working
    title: Ways of Working
    intent: >-
      How the session questions, reviews cold, bounds its rounds, and reports; model routing for
      its seats.
    rules:
      - id: brainstorm.model-tiering
        class: must
        kind: routing
        extends: common.model-tiering
        anchor: 2026-08-16 model-tiered-seats
      - id: brainstorm.plan-approval-producers
        class: must
        extends: common.plan-approval-producers
      - id: brainstorm.author-grader-default-fail
        class: floor
        extends: common.author-grader-default-fail
      - id: brainstorm.non-coverage-survivors
        labels: [user-gate]
        class: must
        kind: routing
        text: >-
          A non-coverage survivor that offers a real choice, is costly to get wrong, or challenges
          a ruling of the user's gets its own turn in the question form; your repairs of facts,
          counts and wording go to the user in one named batch, and a survivor that changes
          nothing is listed with its reason.
      - id: brainstorm.reopen-born-verify
        labels: [attempt-economy]
        class: must
        kind: bound
        text: >-
          A decision born from a coverage-survivor reopen gets one bounded verify round —
          internal consistency and record-fitness, no fresh cold read, no blind-map coverage hunt
          against it, and no second reopen off it.
        anchor: 2026-08-10 cold-review-gap-challenge D4
      - id: brainstorm.no-git-mutations
        class: must
        extends: common.no-git-mutations
      - id: brainstorm.acceptance-plain-text
        class: must
        extends: common.acceptance-plain-text
      - id: brainstorm.artifact-home
        labels: [binding]
        class: floor
        kind: binding
        text: >-
          Session artifacts go only where the log declares: render `mochiko-cli home
          .mochiko/brainstorms/<slug>` before the first write and hold what it returns.
          `record.md`, `synthesis.md`, `build-log.md` and `wave<n>-<slug>.md` are the closed set;
          other working material rides `inputs/`, `research/` or `referents/`; a report lands in
          `reports/` under its envelope type. A name the set does not carry is raised to the user,
          never invented mid-session, and the index entry is written in the index home, not here.
        anchor: 2026-09-13 hook-enforced-artifact-schema D1
      - id: brainstorm.light-orient
        labels: [scope-entry]
        class: must
        text: >-
          Before your first message, read ${index_path}, the records the topic names and the
          user's earlier rulings on it — no user turn, no sweep of code or consumers; fact work
          waits until the decisions show which facts they need.
        anchor: 2026-10-06 brainstorm-target-state D1
      - id: brainstorm.frame-card
        labels: [scope-entry]
        class: must
        kind: duty
        text: >-
          Your first message is a frame card of six lines — problem (naming who has it) ·
          destination · must not break · betting on · out of scope · proposed size — each
          marked as the user's words or your guess, with no confidence percentage. A line you
          cannot fill even as a guess is asked on its own before the card is shown.
        anchor: 2026-10-06 brainstorm-target-state D2
      - id: brainstorm.frame-hardens
        labels: [user-gate, scope-entry]
        class: must
        text: >-
          No deciding starts before the frame hardens at the user's first reply to the card, every
          guessed line confirmed, corrected or struck; a line the user cannot answer yet is marked
          open and becomes an early decision.
        anchor: 2026-10-06 brainstorm-target-state D3
      - id: brainstorm.decision-map
        labels: [reporting]
        class: must
        kind: duty
        text: >-
          The first question arrives with a decision map in three parts — askable now (sharply
          stated, by name) · in fog (with what each hangs on) · out of scope — never put to
          the user for approval. Each later turn carries one status line (decided · askable now
          · in fog), the full map shown again when it changes, and every item you add or graduate
          changes visibly.
        anchor: 2026-10-06 brainstorm-target-state D4
      - id: brainstorm.blind-map-fold
        labels: [evidence]
        class: must
        kind: duty
        text: >-
          When the blind map lands, fold its load-bearing angles into the decision map, each
          marked as from the blind map, and list the angles you drop for the end read; a ruling
          already made that a late angle bears on goes back to the user.
        when: {size: [standard, too-big]}
        anchor: 2026-10-06 brainstorm-target-state D10
      - id: brainstorm.fact-before-decision
        labels: [evidence]
        class: must
        text: >-
          No decision is put to the user before the fact it hangs on is in hand, its source
          attached — you find what the repo, the platform or the docs can answer while other
          questions go on. A fact only the user holds is asked as a labelled fact question, never
          dressed as a decision; one that cannot be found is stated as unknown and the decision
          carries it as open.
        anchor: 2026-10-06 brainstorm-target-state D5
      - id: brainstorm.own-turn-or-batch
        labels: [user-gate]
        class: must
        text: >-
          A decision gets its own turn when it is a real choice or a wrong pick is costly to undo;
          every other one is a default, shown by name in one line when it arises and confirmed in
          one batch at wrap-up — a default other questions hang on is confirmed before them.
        anchor: 2026-10-06 brainstorm-target-state D6
      - id: brainstorm.options-rule
        labels: [user-gate]
        class: must
        text: >-
          Every fork carries at least two real options, one of them the cheaper shape — do less,
          reuse, or do nothing — and names the rejected road with its reason.
        anchor: 2026-10-06 brainstorm-target-state D7
      - id: brainstorm.ratified-yes
        labels: [user-gate]
        class: must
        text: >-
          A yes to your pick stands and is recorded as ratified in the decision's
          how-it-was-decided part, with no new confidence mark; after three ratified rulings in a
          row, say so and put the next fork in another form — the case against first, or a weak
          lean in place of a firm pick.
        anchor: 2026-10-06 brainstorm-target-state D8
      - id: brainstorm.vague-answer-reasked
        labels: [user-gate]
        class: must
        text: >-
          "Whatever you think" is not a ruling: re-ask it as a choice between two concrete
          options. An answer that sounds like convention, not a want, draws one probe — what
          would you want if you need not justify it.
        anchor: 2026-10-06 brainstorm-target-state D8
      - id: brainstorm.dependency-order
        labels: [user-gate]
        class: must
        text: >-
          No question is put before what it hangs on is settled, and each says in one line what it
          unblocks; which askable question goes first is your judgment.
        anchor: 2026-10-06 brainstorm-target-state D12
      - id: brainstorm.question-form
        labels: [reporting]
        class: must
        text: >-
          When options are put, the question uses plain words and names decisions, never bare ids;
          each option is one sentence with one concrete example, and the question carries the case
          against your pick and a one-line recommendation, all on one screen. An open question to
          an unsure user stays allowed.
        anchor: 2026-10-06 brainstorm-target-state D13
      - id: brainstorm.show-before-asking
        labels: [evidence]
        class: must
        kind: duty
        text: >-
          A question about how something looks or behaves comes with a rough artifact inside the
          message — a mock, a worked scenario with real numbers, or a replay on a past case —
          never a file or code; anything heavier, such as a clickable prototype, is built only on
          the user's request.
        anchor: 2026-10-06 brainstorm-target-state D14
      - id: brainstorm.stop-rule
        labels: [attempt-economy]
        class: must
        text: >-
          Deciding is finished only when the map is empty — nothing askable, every patch of fog
          ruled, deferred by the user's word or handed to a later session, no open frame line, the
          defaults batch confirmed, and any blind map that was started landed, each of its angles
          folded or listed as dropped; a session the user stops records what is left as open and
          says the destination was not reached. If the map has not shrunk for three questions
          running, say so and offer to step back to the frame.
        anchor: 2026-10-06 brainstorm-target-state D15
      - id: brainstorm.fix-one-card-verify-once
        labels: [attempt-economy]
        class: must
        kind: bound
        text: >-
          A fix edits the one card it touches and adds a line under its changed-at-review part;
          the review seat verifies the fixes once, reading only the changed cards and their gists,
          and a second failed verify goes to the user.
        anchor: 2026-10-06 brainstorm-target-state D17
      - id: brainstorm.accept-screens
        labels: [user-gate]
        class: must
        kind: duty
        text: >-
          The record does not freeze for review before the user has confirmed or changed one
          screen — the decisions by name with their gists, the defaults batch, what is out of
          scope, the open questions, and each untested bet with how it would be tested; after
          review, one screen shows what changed. Acceptance is the user's explicit word; anything
          vaguer is asked once more.
        anchor: 2026-10-06 brainstorm-target-state D18
      - id: brainstorm.size-shapes
        labels: [scope-entry]
        class: must
        text: >-
          The session rules the askable forks and hands the fog to named later sessions, written
          where the project keeps its open threads in the fog's own wording.
        when: {size: too-big}
        anchor: 2026-10-06 brainstorm-target-state D11
  - id: brainstorm.sec.boundaries
    title: Boundaries — the non-waivable floor
    intent: Floor obligations no seat and no in-run ruling can waive.
    rules:
      - id: brainstorm.transport-floor
        class: floor
        when: {seats: multi}
        extends: common.transport-floor
  - id: brainstorm.sec.fail-conditions
    title: Not done — default FAIL
    intent: >-
      The kind: fail set — any one standing fails the run; the .md Not-done line cites the count
      this render prints.
    rules:
      - id: brainstorm.fail.record-unaccepted
        labels: [user-gate]
        class: floor
        kind: fail
        text: An unaccepted record.
        enforces: [brainstorm.user-record-acceptance]
        anchor: 2026-08-26 command-content-schema D10
      - id: brainstorm.fail.unreviewed-no-waiver
        labels: [independence]
        class: floor
        kind: fail
        text: An unreviewed record with no recorded waiver.
        enforces: [brainstorm.record-review-independence, brainstorm.user-review-waiver]
        anchor: 2026-08-26 command-content-schema D10
      - id: brainstorm.fail.survivor-undispositioned
        labels: [user-gate]
        class: floor
        kind: fail
        text: An undispositioned review survivor.
        enforces: [brainstorm.coverage-survivor-routing, brainstorm.non-coverage-survivors]
        anchor: 2026-08-26 command-content-schema D10
      - id: brainstorm.fail.index-mismatch
        labels: [landing]
        class: floor
        kind: fail
        text: An index entry in ${index_path} missing or contradicting the record's status.
        enforces: [brainstorm.index-bookkeeping]
        anchor: 2026-08-26 command-content-schema D10
tombstones:
  - id: brainstorm.sec.harness
    disposition: >-
      superseded → rules redistributed across the D4 six-set
      (command-md-scaffold-standardization D3/D4/D5)
  - id: brainstorm.sec.bindings
    disposition: >-
      superseded → rules redistributed across the D4 six-set
      (command-md-scaffold-standardization D3/D4/D5)
