# Derived view of the /mochiko:specify command content schema — a projection of the migration log,
# regenerated by `mochiko-cli views emit` and never hand-edited. The command's rules are rendered
# at fire by `mochiko-cli`, never read from a file. Two semantics live only here:
#   class   floor = non-waivable · must = binding obligation · advisory = guidance, not binding.
#   conditions:  each dimension declares its resolution point (entry-derived · surface-presence ·
#           moment-resolved(<moment>) · user-ruled · standing-trigger); a moment-resolved
#           dimension is unresolved until its named moment — rules gated on it are inapplicable
#           until then.
kind: command
command: specify
vars:
  pm_seat: product-manager
  explore_model: haiku
  specs_dir: .mochiko/specs
  spec_schema: mochiko-cli template spec
  feature_entry_schema: mochiko-cli template feature-entry
  features_index_schema: mochiko-cli template features-index
  rules_dir: .claude/rules/mochiko
conditions:
  ux_bearing:
    values:
      - 'yes'
      - 'no'
    resolution: moment-resolved(intent)
    note: ruled in the intent stage; rules gated on it are inapplicable until it resolves.
  feature_map:
    values: presence
    resolution: surface-presence
    note: FEATURES.md plus the entries in the intent's territory.
  governance_region:
    values: presence
    resolution: surface-presence
    note: the marked governance region in CLAUDE.md.
  km_file:
    values: presence
    resolution: surface-presence
    note: .mochiko/memory/knowledge-management.md.
  seats:
    values: [single, multi]
    resolution: standing-trigger
    note: >-
      fires the moment the run composes more than one seat, and re-fires on a seat added mid-run.
  slate_source:
    values: [forks, handed-in]
    resolution: moment-resolved(story-stage)
    note: >-
      handed-in — the user hands in the story set (their own lines, or a named brainstorm record
      that leaves none open) and skips the forks, never the close; forks — otherwise; ruled as
      the stage opens.
moments:
  intent: The adaptive-probe stage that closes in the user-confirmed intent synthesis.
  stories-confirm: The post-stories step where the capability frame is confirmed or adjusted.
  derivation: Where work rows are cut under their capabilities and the map delta is staged.
  selection: Where the user picks which work rows build now, from the selection card.
  acceptance: The user's accept / amend / reject, which executes the staged map write batch.
  story-stage: >-
    Where the story set is worked with the user into a slate — after the intent synthesis is
    confirmed, before any story is authored.
  slate-confirm: >-
    The user's confirmation of the slate — every candidate row ruled in or out, the blind list's
    differences ruled, nothing open.
sections:
  - id: spec.sec.roles
    title: Roles & Responsibilities — seat wiring
    intent: Seat staffing, the producing seats' duties, and grading independence across the run.
    rules:
      - id: spec.lead-latitude
        labels: [seats]
        class: must
        kind: latitude
        text: >-
          You are the lead: plan the run and orchestrate it toward the Goal state in
          plugins/mochiko/commands/specify.md; teammates or subagents per seat is your call.
      - id: spec.capability-frame-at-intent
        labels: [seats, scope-entry]
        class: must
        text: >-
          Within the intent stage, once the map and intent are read, the ${pm_seat} seat states
          the capability frame — which capabilities the territory touches and an extend-vs-mint
          hypothesis per the capability tests (mochiko:patterns-map-minimalism) — as nouns +
          verbs only, never enumerating stories, agreed with the user. The agreed frame lands in
          the confirmed Intent section.
        pointer: mochiko:patterns-map-minimalism
        anchor: 2026-08-13 pm-role-and-feature-derivation D5
      - id: spec.confirm-frame-post-stories
        labels: [seats, scope-entry]
        class: must
        text: >-
          After stories, the ${pm_seat} seat — via mochiko:authoring-feature-map and
          mochiko:patterns-map-minimalism — first confirms or adjusts the intent-stage
          capability frame against what the stories revealed; stories win any conflict.
        pointer: mochiko:authoring-feature-map
        anchor: 2026-08-13 pm-role-and-feature-derivation D5
      - id: spec.cut-work-rows
        labels: [seats, scope-entry]
        class: must
        text: >-
          After the frame confirm (spec.confirm-frame-post-stories), the ${pm_seat} seat cuts the
          work rows (story-shaped is fine) grouped under their capabilities, extending an existing
          capability's extent or minting a new one per the extend-vs-mint tests, and maps every
          SC-XXX to its verifying capability or row.
        pointer: mochiko:patterns-map-minimalism
      - id: spec.filter-rejections-recorded
        labels: [evidence, reporting]
        class: must
        text: >-
          The ${pm_seat} seat runs the filter: a story that earns no place on the map is rejected
          with the why recorded in its story file, never silently dropped. After authoring, the
          filter runs on homing and dedup only, and a rejection of a row ruled `in` goes to the
          user as an escalation.
      - id: spec.epic-proposal-optional
        labels: [seats]
        class: must
        kind: latitude
        text: >-
          When one derivation spans capabilities such that its work rows want one coordinated
          multi-feature run, the ${pm_seat} seat may propose an epic as part of the selection card
          — a proposal only, never a mint.
        anchor: 2026-08-14 multi-feature-plan-implement D4
      - id: spec.pm-recommends-never-selects
        labels: [user-gate, independence]
        class: floor
        text: The ${pm_seat} seat recommends, never selects.
        anchor: 2026-08-13 pm-role-and-feature-derivation D5
      - id: spec.stress-test-one-pass
        labels: [independence, evidence]
        class: must
        text: >-
          The stress-test grades spec + stories + capability/row derivation + map delta in one
          pass — derivation honesty, filter rejections justified, dedup against the actual map,
          granularity respected, capabilities and rows well-formed — its map-delta baseline the
          map's git state at run open.
      - id: spec.stress-test-prototype-walk
        labels: [independence, evidence]
        class: must
        text: >-
          The stress-test also walks the prototype (served, or opened directly via the no-server
          degrade path): every FLOW-XXX clickable end-to-end, every SCR-XXX reachable, every P1
          acceptance scenario carrying a click path; manifest↔prototype drift is a blocking gap.
        when: {ux_bearing: 'yes'}
        anchor: 2026-08-02 ux-mocking-in-specify D7
      - id: spec.lead-holds-story-stage
        labels: [seats, user-gate]
        class: must
        text: >-
          You run the story stage yourself, inline in the main conversation, with the capability
          frame in hand; no teammate holds a conversation with the user. The requirements-analyst
          seat authors the stories from the confirmed slate.
        anchor: 2026-10-10 specify-brainstorm-discovery D3
      - id: spec.blind-journey-list
        labels: [independence, seats]
        class: must
        kind: duty
        text: >-
          Before the slate closes, one fresh `general-purpose` teammate spawned with `model: opus`
          gets the confirmed intent synthesis and the capability frame — never the slate or the
          conversation — and returns the journeys it sees; each difference from the slate is a
          candidate row the user rules in or out. One list per spec run.
        anchor: 2026-10-10 specify-brainstorm-discovery D4
      - id: spec.analyst-brief-and-pen
        labels: [seats, user-gate]
        class: must
        text: >-
          At the slate confirm you write the slate into `spec.md` — transcription of the user's
          rulings, not authoring — before the requirements-analyst seat opens it, then pass the
          pen explicitly; its brief carries each row with the user's own words quoted, its seed,
          and the `out` rows with their whys. After the pen passes, a row change the user rules
          reaches the seat as the exact row text to land, written as mechanical execution.
        anchor: 2026-10-10 specify-brainstorm-discovery
      - id: spec.pm-vets-slate-once
        labels: [seats, evidence]
        class: must
        text: >-
          At the slate's close the ${pm_seat} seat vets every candidate row once for map fit —
          duplicates of pending rows or stubs, extend-vs-mint — and returns the vet beside the
          blind journey list, before the user confirms the slate.
        pointer: mochiko:patterns-map-minimalism
        anchor: 2026-10-10 specify-brainstorm-discovery
  - id: spec.sec.reserved
    title: Reserved to the user — never the run's
    intent: 'Decisions held by the user: gates, rulings, and escalations no seat may take.'
    rules:
      - id: spec.reserved-to-user
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          Reserved to the user: the feature framing when `$ARGUMENTS` is empty · intent
          confirmation (the capability frame included) · clarification answers only they can
          settle · clicking each story's prototype screens as they land (their reactions fold
          back into story and screen together) · ruling on an escalated filter disagreement.
      - id: spec.selection-card
        labels: [user-gate, reporting]
        class: must
        kind: binding
        text: >-
          The user picks which work rows build now, from the ${pm_seat} seat's selection card —
          the rows grouped per capability, recommendation, row-level dependency order, the
          deferred-SC list, and, per capability in the spec's territory, the completeness view
          (pending work rows — cut but undelivered — plus parked stubs and kills), visible at
          the moment of choice.
        anchor: 2026-08-13 pm-role-and-feature-derivation D5
      - id: spec.gate-selection
        labels: [user-gate]
        class: floor
        kind: gate
        text: The selection — which work rows build now — is the user's.
        anchor: 2026-08-13 pm-role-and-feature-derivation D5
      - id: spec.gate-acceptance
        labels: [user-gate, landing]
        class: floor
        kind: gate
        text: >-
          Spec acceptance (accept / amend / reject) is the user's, covering intent, requirements,
          experience, derivation, and selection whole — acceptance is what executes the map
          write batch; a rejected spec never touched the map.
        anchor: 2026-08-10 feature-map-layer D5
      - id: spec.filter-disagreement-escalates
        labels: [user-gate]
        class: must
        kind: routing
        text: >-
          A producer disagreement — a rejected story held load-bearing — escalates to the
          user.
      - id: spec.slate-rulings-users
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          Which stories the spec carries is the user's: every slate row is ruled in or out by the
          user, a floor-obligated row's strike included. Which capabilities, the filter and
          selection advice stay the ${pm_seat} seat's.
        anchor: 2026-10-10 specify-brainstorm-discovery D1
      - id: spec.gate-slate-confirm
        labels: [user-gate]
        class: must
        kind: gate
        text: >-
          Confirming the slate is the user's, at the slate-confirm moment, on a screen of its own,
          never the intent screen, that shows every row with its disposition and each `out` with
          its why. No story is authored before it.
        anchor: 2026-10-10 specify-brainstorm-discovery D6
  - id: spec.sec.tools
    title: Tools bindings
    intent: Paths, schemas, skills, and templates the run binds to.
    rules:
      - id: spec.deliverable
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The deliverable is ${specs_dir}/<spec>/ — spec.md from the spec template (rendered by
          `${spec_schema}`) plus the stories/US-*.md files; <spec> a kebab-case slug derived from
          the feature description; never offer to delete it. Uncertainty lives in spec.md's
          Assumptions and Open Questions sections.
      - id: spec.intent-stage-first
        labels: [scope-entry]
        class: must
        text: >-
          The intent stage runs before any authoring: the adaptive-probe agenda via
          mochiko:analysis-iterative — scope boundary · delivery intent · depth-rigor
          expectation · UX-bearing (does the feature carry a user-facing surface to prototype) ·
          constraints · out-of-scope.
        pointer: mochiko:analysis-iterative
      - id: spec.map-obligated-read
        labels: [scope-entry, evidence]
        class: must
        text: >-
          The existing feature map is an obligated read at the intent stage, per
          mochiko:authoring-feature-map's intent-stage agenda: FEATURES.md plus the entries in the
          intent's territory.
        when: {feature_map: present}
        pointer: mochiko:authoring-feature-map
      - id: spec.missing-map-surfaced
        labels: [scope-entry, user-gate]
        class: must
        kind: routing
        text: >-
          A missing feature map is surfaced — offer /mochiko:setup, which scaffolds the empty
          index; reconstruction of delivered capabilities is not setup's — never silently
          tolerated.
        when: {feature_map: absent}
      - id: spec.unrefined-stubs
        labels: [scope-entry]
        class: must
        text: >-
          Map entries marked unrefined are unratified hypotheses, never extension anchors:
          derivation ignores stub text, deriving frame-first with stories informing; a stub
          matching a framed or derived capability is confirmation, a stub matching nothing stays
          parked or is retired (procedure: mochiko:authoring-feature-map).
        pointer: mochiko:authoring-feature-map
      - id: spec.intent-synthesis-governs
        labels: [scope-entry, reporting]
        class: must
        kind: binding
        text: >-
          The confirmed intent synthesis governs the run and lands verbatim as the spec's Intent
          section.
      - id: spec.frame-greenfield-inputs
        labels: [scope-entry]
        class: advisory
        text: >-
          On a thin greenfield intent the capability frame draws on the intent conversation, the
          product description's domain nouns, and the capability tests
          (mochiko:patterns-map-minimalism).
        pointer: mochiko:patterns-map-minimalism
      - id: spec.whole-feature-prototype
        labels: [evidence]
        class: must
        text: >-
          The whole feature is prototyped at specify time; FEAT-tags land at derivation as a
          re-tag pass over the SCR/FLOW manifest — unselected features' screens greyed
          coming-soon, a filter-rejected story's screens kept greyed and marked rejected.
        when: {ux_bearing: 'yes'}
        anchor: 2026-08-02 ux-mocking-in-specify D8
      - id: spec.feature-map-craft
        labels: [floor-pointer, binding]
        class: must
        kind: binding
        text: >-
          Feature-map craft — derivation, the filter, capability and work-row authoring (the
          feature-entry template — `${feature_entry_schema}`), index lines (the features-index
          template — `${features_index_schema}`), delta grammar, SC re-homing, and the
          acceptance-time write rules — the ${specs_dir}/index.md row included; spec-index
          stewardship rides the skill — all per mochiko:authoring-feature-map.
        pointer: mochiko:authoring-feature-map
      - id: spec.map-minimalism-binding
        labels: [floor-pointer]
        class: must
        kind: binding
        text: >-
          The capability tests, extend-vs-mint, and the frame discipline bind per
          mochiko:patterns-map-minimalism.
        pointer: mochiko:patterns-map-minimalism
      - id: spec.prototype-craft
        labels: [floor-pointer, binding]
        class: must
        kind: binding
        text: >-
          The Screens & Flows section and prototype/ app per mochiko:authoring-prototype — one
          Direction block per surface, per mochiko:patterns-design-direction, at its head,
          SCR-XXX/FLOW-XXX manifest grammar, low-fi discipline (binding flows, advisory pixels),
          bun-servable static HTML with the no-server degrade path, the design baseline and design
          system honored where they exist; not UX-bearing takes the waiver line "No UX surface —
          prototype waived at intent." instead.
        pointer: mochiko:authoring-prototype
        anchor: 2026-08-02 ux-mocking-in-specify D1
      - id: spec.governance-briefs
        labels: [seats, scope-entry]
        class: must
        text: >-
          Name the relevant ${rules_dir}/ files as an obligated read in each author's brief —
          `paths`-scoped rules do not fire for from-scratch authoring.
        when: {governance_region: present}
      - id: spec.governance-region-absent
        labels: [scope-entry]
        class: must
        kind: routing
        text: >-
          A missing CLAUDE.md governance region is surfaced (offer /mochiko:setup), never
          auto-resolved.
        when: {governance_region: absent}
      - id: spec.km-landing
        labels: [landing]
        class: must
        text: >-
          Spec acceptance is a landing — run the .mochiko/memory/knowledge-management.md landing
          ritual (close/move any BACKLOG item the spec discharges, touch ROADMAP.md) and its
          command-boundary invariants fix-on-sight; the acceptance-time map write batch lands in
          the same moment.
        when: {km_file: present}
      - id: spec.migration-frozen-specs
        labels: [binding]
        class: must
        kind: binding
        text: >-
          Existing slice-form specs are valid frozen history; only new runs take the
          ${specs_dir}/<spec>/ workspace form.
      - id: spec.register
        class: must
        kind: binding
        extends: common.register
      - id: spec.next-step
        labels: [scope-entry]
        class: must
        kind: routing
        text: >-
          Next step: /mochiko:implement — one run per capability-batch (a capability's selected
          work rows), in the rows' dependency order; that run opens with a sufficiency check at
          its entry.
        anchor: 2026-08-26 plan-stage-utility D1
      - id: spec.story-stage
        labels: [scope-entry, user-gate]
        class: must
        text: >-
          No story fork is put before the intent synthesis is confirmed; at the story-stage moment
          the story set is worked with the user and closes in a ruled slate. The slate rules what
          the spec carries, never what builds now — that stays the selection gate's.
        anchor: 2026-10-10 specify-brainstorm-discovery D1
      - id: spec.slate-unit
        labels: [user-gate]
        class: must
        text: >-
          The user rules each slate row as a one-breath story line — who, does what, why —
          with its priority and a seed test: one sentence on how they would know it works, or
          `test: open` when they have none yet. Acceptance scenarios, requirements and success
          criteria come after, inside the ruled lines, and the acceptance screen shows each seed
          beside the Independent Test expanded from it.
        anchor: 2026-10-10 specify-brainstorm-discovery D2
      - id: spec.slate-home
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The slate lives in the spec's `## User Stories` index, its `out` rows in the `### Struck
          candidates` sub-table, to the grammar `${spec_schema}` renders — the header line, the
          Test column, the two-phase Disposition. It carries no `deferred` value: later is `in`,
          authored, and left unselected at the selection card.
        anchor: 2026-10-10 specify-brainstorm-discovery
      - id: spec.slate-binds-authoring
        labels: [scope-entry, evidence]
        class: must
        text: >-
          Story files are authored for `in` rows only — a row `in — waiver pending` waits —
          each keeping the meaning of its row's line and seed, and the slate's count is the
          feature's. A story the slate lacks is proposed to the user as a row, never authored
          before the user rules it in.
        anchor: 2026-10-10 specify-brainstorm-discovery
      - id: spec.stage-inputs-in-hand
        labels: [scope-entry]
        class: must
        text: >-
          A brainstorm record named in `$ARGUMENTS`, or stories already in story form, open the
          story stage as facts, and only what they leave open is asked; there is no size gate, and
          a decisive user gets confirmations and a fast wrap-up. With nothing in hand there is no
          skip: the stage runs.
        anchor: 2026-10-10 specify-brainstorm-discovery
      - id: spec.handed-in-slate
        labels: [scope-entry, user-gate]
        class: must
        text: >-
          The handed-in lines become `in` rows marked `handed in`, the skip recorded in the
          slate's header line, never in the Intent; the forks are skipped, never the blind journey
          list, the slate-close vet or the slate confirm.
        when: {slate_source: handed-in}
        anchor: 2026-10-10 specify-brainstorm-discovery
      - id: spec.slate-not-the-frame
        labels: [scope-entry]
        class: must
        text: >-
          The slate is not the capability frame: the frame still comes first, at intent, nouns and
          verbs only; the story stage runs inside it, and stories still win a conflict with it at
          the post-stories confirm (spec.confirm-frame-post-stories).
        anchor: 2026-10-10 specify-brainstorm-discovery
      - id: spec.floor-obligated-rows
        labels: [user-gate, scope-entry]
        class: must
        text: >-
          A story the production floor obligates (auth, deletion, recovery) is put with the floor
          named as its fact. Its legal strikes are `out — handled elsewhere: <pointer>` and a
          narrowing — the row kept `in`, its line rewritten in the user's words, the cut noted
          after the line; a true drop is a waiver through `/mochiko:setup` amend mode: the row is
          held `in — waiver pending`, unauthored, and acceptance blocks until it becomes `out
          — waived: <ledger reference>` or the user restores it to `in`.
        anchor: 2026-10-10 specify-brainstorm-discovery
  - id: spec.sec.ways-of-working
    title: Ways of Working
    intent: >-
      How the run sequences its stages, prototypes, and reports; model routing for its seats.
    rules:
      - id: spec.model-tiering
        class: must
        kind: routing
        extends: common.model-tiering
        anchor: 2026-08-16 model-tiered-seats
      - id: spec.intent-probe-discipline
        labels: [user-gate]
        class: must
        text: >-
          Intent runs as probes, never a questionnaire; it closes in a one-screen synthesis the
          user confirms. In the intent and story stages alike, flag ratification streaks before
          treating adoptions as engagement; in the story stage a vague answer is re-asked as a
          choice between two concrete options.
      - id: spec.frame-hypothesis-not-anchor
        labels: [scope-entry]
        class: must
        text: >-
          The capability frame is a hypothesis, not an anchor: it dictates neither story
          boundaries nor journeys (stories stay journey-driven), and stories win any conflict with
          it, resolved at the post-stories confirm step (spec.confirm-frame-post-stories).
        anchor: 2026-08-13 pm-role-and-feature-derivation D5
      - id: spec.lockstep-prototyping
        labels: [user-gate, evidence]
        class: must
        text: >-
          Stories and their screens co-evolve as one unit — the skeleton nav frame first, built
          from the confirmed slate, then each story's screens and flows land while that story is
          under discussion; the user clicks through while the story is wet, never a batch render
          after the text settles. A click that changes a story's line or test goes back to the
          user as a one-line amendment to its slate row.
        when: {ux_bearing: 'yes'}
        anchor: 2026-08-02 ux-mocking-in-specify D2
      - id: spec.plan-approval
        class: must
        extends: common.plan-approval-producers
      - id: spec.author-grader-default-fail
        class: floor
        extends: common.author-grader-default-fail
      - id: spec.no-git-mutations
        class: must
        extends: common.no-git-mutations
      - id: spec.acceptance-plain-text
        class: must
        extends: common.acceptance-plain-text
      - id: spec.artifact-home
        labels: [binding]
        class: floor
        kind: binding
        text: >-
          A spec run writes into declared homes only: render `mochiko-cli home
          .mochiko/specs/<slug>` before the first write. `spec.md` binds the `spec` template,
          whose per-section budgets come from `mochiko-cli template spec` before drafting;
          `stories/`, `contracts/`, `prototype/` and `map-delta/` are the admitted
          sub-directories, each with its own declared set. A file name the home does not carry is
          raised to the user rather than created beside the ones that are.
        anchor: 2026-09-13 hook-enforced-artifact-schema D1
      - id: spec.story-forks
        labels: [user-gate]
        class: must
        text: >-
          Put one fork per turn, its fact in hand first, with at least two real options — one
          the do-less shape, fewer stories or none for that journey — and a one-row mock of the
          story as it would read; a candidate gets its own turn only when it is a real choice or
          costly to undo, the rest named in one line as they arise and confirmed together on the
          slate screen. Each turn carries one status line over the candidate journeys: ruled ·
          askable · in fog.
        when: {slate_source: forks}
        anchor: 2026-10-10 specify-brainstorm-discovery
      - id: spec.slate-provenance
        labels: [evidence]
        class: must
        text: >-
          Each slate row carries one provenance mark after its line in the Story cell: `blind
          list` for a row the blind journey list added; `handed in` for a row taken from story
          lines the user handed in or from a named brainstorm record, whatever the slate's source;
          any other row, ruled through the forks, `user's words` or `lead's guess, ratified`.
        anchor: 2026-10-10 specify-brainstorm-discovery
      - id: spec.story-stage-stop-rule
        labels: [attempt-economy]
        class: must
        kind: bound
        text: >-
          The story stage closes only when every candidate — the blind list's differences
          included — is ruled in or out and nothing is open; if the candidate set has not shrunk
          for three turns running, say so and offer to step back to the intent synthesis.
        anchor: 2026-10-10 specify-brainstorm-discovery
      - id: spec.own-rules-win
        labels: [floor-pointer]
        class: must
        text: >-
          Where mochiko:analysis-iterative and specify's own rules differ, specify's rules win.
        anchor: 2026-10-10 specify-brainstorm-discovery D5
  - id: spec.sec.boundaries
    title: Boundaries — the non-waivable floor
    intent: Floor obligations no seat and no in-run ruling can waive.
    rules:
      - id: spec.transport-floor
        class: floor
        when: {seats: multi}
        extends: common.transport-floor
      - id: spec.staged-derivation
        labels: [landing]
        class: floor
        text: >-
          All derivation output stages in the spec workspace; the live map stays untouched until
          acceptance.
        anchor: 2026-08-10 feature-map-layer D5
      - id: spec.epic-mint-desk-only
        labels: [user-gate]
        class: floor
        kind: routing
        text: >-
          The user takes an epic proposal to /mochiko:feature's desk to form, the only door that
          mints; the run never mints an epic (mochiko:authoring-epic).
        pointer: mochiko:authoring-epic
        anchor: 2026-08-26 plan-stage-utility D4
  - id: spec.sec.fail-conditions
    title: Not done — default FAIL
    intent: >-
      The kind: fail set — any one standing fails the run; the .md Not-done line cites the count
      this render prints.
    rules:
      - id: spec.fail.blocking-gap
        labels: [evidence]
        class: floor
        kind: fail
        text: A blocking gap open.
        enforces: [spec.stress-test-one-pass]
        anchor: 2026-08-26 command-content-schema D10
      - id: spec.fail.intent-unconfirmed
        labels: [user-gate]
        class: floor
        kind: fail
        text: An Intent section never confirmed by the user before authoring.
        enforces: [spec.intent-stage-first, spec.reserved-to-user]
        anchor: 2026-08-26 command-content-schema D10
      - id: spec.fail.map-unread
        labels: [scope-entry]
        class: floor
        kind: fail
        text: The feature map not read at intent, or a missing map silently tolerated.
        enforces: [spec.map-obligated-read, spec.missing-map-surfaced]
        anchor: 2026-08-26 command-content-schema D10
      - id: spec.fail.story-unhomed
        labels: [evidence]
        class: floor
        kind: fail
        text: >-
          A drafted story neither homed to exactly one work row nor rejected with a recorded why.
        enforces: [spec.cut-work-rows, spec.filter-rejections-recorded]
        anchor: 2026-08-26 command-content-schema D10
      - id: spec.fail.screens-flows
        labels: [evidence]
        class: floor
        kind: fail
        text: >-
          A Screens & Flows section absent (the waiver line counts), or ruled UX-bearing with a
          surface lacking its Direction block or with no clickable prototype, or
          manifest↔prototype drift unresolved.
        enforces: [spec.prototype-craft, spec.stress-test-prototype-walk]
        anchor: 2026-08-26 command-content-schema D10
      - id: spec.fail.selection-unruled
        labels: [user-gate]
        class: floor
        kind: fail
        text: A Feature Selection section absent, or the selection not ruled by the user.
        enforces: [spec.gate-selection, spec.selection-card]
        anchor: 2026-08-26 command-content-schema D10
      - id: spec.fail.premature-map-write
        labels: [landing]
        class: floor
        kind: fail
        text: The live map written before acceptance.
        enforces: [spec.staged-derivation, spec.gate-acceptance]
        anchor: 2026-08-26 command-content-schema D10
      - id: spec.fail.self-graded
        labels: [independence]
        class: floor
        kind: fail
        text: The spec never graded by anyone but its authors.
        enforces: [spec.author-grader-default-fail]
        anchor: 2026-08-26 command-content-schema D10
      - id: spec.fail.no-acceptance
        class: floor
        kind: fail
        extends: common.no-acceptance
        enforces: [spec.gate-acceptance]
        anchor: 2026-08-26 command-content-schema D10
      - id: spec.fail.story-outside-slate
        labels: [user-gate]
        class: floor
        kind: fail
        text: A story file with no confirmed slate behind it, or one outside the confirmed slate.
        enforces: [spec.story-stage, spec.slate-binds-authoring, spec.gate-slate-confirm]
        anchor: 2026-10-10 specify-brainstorm-discovery D1
tombstones:
  - id: spec.sec.harness
    disposition: >-
      superseded → rules redistributed across the D4 six-set
      (command-md-scaffold-standardization D3/D4/D5)
  - id: spec.sec.bindings
    disposition: >-
      superseded → rules redistributed across the D4 six-set
      (command-md-scaffold-standardization D3/D4/D5)
