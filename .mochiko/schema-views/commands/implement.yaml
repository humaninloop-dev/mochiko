# Derived view of the /mochiko:implement command content schema — a projection of the migration log,
# regenerated by `mochiko-cli views emit` and never hand-edited. The command's rules are rendered
# at fire by `mochiko-cli`, never read from a file. Two semantics live only here:
#   class   floor = non-waivable · must = binding obligation · advisory = guidance, not binding.
#   conditions:  each dimension declares its resolution point (entry-derived · surface-presence ·
#           moment-resolved(<moment>) · user-ruled · standing-trigger); a moment-resolved
#           dimension is unresolved until its named moment — rules gated on it are inapplicable
#           until then.
kind: command
command: implement
vars:
  attempt_bound_cycle: '3'
  gap_rework_bound: '2'
  builder_seat: staff-engineer
  design_seat: technical-analyst
  architect_seat: principal-architect
  qa_seat: qa-engineer
  gap_finder_seat: devils-advocate
  explore_model: haiku
  features_dir: .mochiko/features
  product_dir: .mochiko/product
  epics_dir: .mochiko/epics
  rules_dir: .claude/rules/mochiko
  tasks_schema: mochiko-cli template tasks
  designer_seat: product-designer
conditions:
  scope:
    values: [selection, delta, epic, lane]
    resolution: entry-derived
    note: the batch's scope type, fixed at the run-open confirmation.
  depth:
    values: [low, high]
    resolution: entry-derived
    note: the governance depth level, read from the governance region at entry.
  km_file:
    values: presence
    resolution: surface-presence
    note: .mochiko/memory/knowledge-management.md.
  governance_region:
    values: presence
    resolution: surface-presence
    note: the marked governance region in CLAUDE.md.
  baseline:
    values: presence
    resolution: surface-presence
    note: the product baseline a design gap targets; checked at the entry sufficiency check.
  seats:
    values: [single, multi]
    resolution: standing-trigger
    note: >-
      fires the moment the run composes more than one seat, and re-fires on a seat added mid-run.
  ux_bearing:
    values: presence
    resolution: surface-presence
    note: the batch's spec carries a Screens & Flows SCR/FLOW manifest.
moments:
  run-open: >-
    The confirmation that closes entry — batch, scope type, attempt bounds, done condition.
  entry: The gating and the sufficiency check, before the run-open confirmation.
  design-checkpoint: The user's sign-off on the design phase's output and the store delta.
  card-confirm: The user's ruling on the cycle slicing, before any card is built.
  cycle-checkpoint: The per-cycle grading point where escalations and findings land as one batch.
  final-validation: >-
    The whole-build verification pass — regression sweep, cold verification, gap finding.
  landing: The acceptance-time execution of folds, graduations, and the store landing.
  acceptance: The user's accept / amend / reject that closes the run.
sections:
  - id: impl.sec.roles
    title: Roles & Responsibilities — seat wiring
    intent: Seat staffing, independence, and authorship separation across the run's seats.
    rules:
      - id: impl.staffing-latitude
        labels: [seats]
        class: must
        kind: latitude
        text: >-
          Beyond this schema's `class: floor` rules, everything is your per-run judgment: how you
          staff, sequence, and run the cycles; teammates or subagents per seat is your call.
      - id: impl.dm-entry-gate
        labels: [scope-entry]
        class: must
        kind: duty
        text: >-
          Gate entry honestly: the run gates on a capability entry with selected work rows
          carrying ratified scope, and opens with its contract stated at the run-open
          confirmation.
      - id: impl.design-phase-fires-on-gap
        labels: [scope-entry]
        class: must
        kind: duty
        text: >-
          Fire the design phase on any gap the sufficiency check names — before any code is
          written.
        anchor: 2026-08-26 plan-stage-utility
      - id: impl.dm-surface-rounds
        labels: [reporting, attempt-economy]
        class: must
        kind: duty
        text: Surface rounds consumed and seats spawned at each checkpoint.
      - id: impl.dm-landing-whole
        labels: [landing]
        class: must
        kind: duty
        text: Execute the acceptance landing whole at user acceptance.
      - id: impl.dm-close-verdict
        labels: [reporting, landing]
        class: must
        kind: duty
        text: Close the run with a verdict against the done condition.
      - id: impl.seat-sufficiency-independence
        labels: [independence, seats]
        class: must
        text: >-
          The sufficiency seat authored none of the spec, store, or baselines it grades, and will
          not design or build this batch. Exempt from plan approval, like every grading seat.
      - id: impl.design-seats-staffing
        labels: [seats]
        class: advisory
        kind: latitude
        text: >-
          Design-seat staffing is your call: typically ${design_seat} for the design-phase
          baseline writes, ${architect_seat} for the store's `proposed` elements and the run's
          architecture.md drawing, ${qa_seat} for the **TEST:** cases.
      - id: impl.design-gaps-only
        labels: [independence, scope-entry]
        class: must
        text: >-
          Design seats author exactly the named gaps, nothing more, each on a plan a fresh peer
          passed and you approved — rung-justified per the pointer skill.
        pointer: mochiko:patterns-plan-minimalism
      - id: impl.builder-never-designs
        labels: [independence, seats]
        class: must
        text: ${builder_seat} stays the builder and never designs its own gaps.
      - id: impl.seat-card-author-independence
        labels: [independence, seats]
        class: must
        text: >-
          The card-authoring seat is a design-class seat, never the builder who will execute the
          cards; ${qa_seat} authors the **TEST:** cases within its slicing.
      - id: impl.builder-decompose-disclose
        labels: [seats, evidence]
        class: must
        text: >-
          Builders decompose each card into concrete tasks at build time, disclosed in the cycle
          report, and build test-first — on a plan a fresh peer passed and you approved.
      - id: impl.seat-verification-independence
        labels: [independence, seats]
        class: must
        text: >-
          Verification seats are never the implementer. They execute against real infrastructure
          and read the code and its evidence: per-cycle grading, the final validation, the
          code-minimalism lens.
      - id: impl.verification-design-time-grades
        labels: [independence, seats]
        class: must
        text: >-
          The same verification-seat independence covers this run's design-time grades: the
          cycle-card review before the card confirm (its grade covering buildability) and the
          judgment content of any build-raised baseline entry (impl.baseline-entry-grammar).
      - id: impl.landing-verifier-folds
        labels: [independence, landing]
        class: must
        text: >-
          The landing verification seat checks the landing flip of impl.baseline-diff-review —
          `in-flight` and `modifying` entries to `built`, each `removing` entry to its stub
          (heading kept, `**Lifecycle:** removed`, no body, no key); a lane run adds the map-delta
          boundary check — the accepted work made no map write beyond the marked delta.
      - id: impl.seat-gap-finder-blind
        labels: [independence, seats]
        class: must
        text: >-
          The gap-finding seat is a fresh ${gap_finder_seat}, dispatched blind: never a seat that
          built these cycles or saw this feature's design-time test cases.
  - id: impl.sec.reserved
    title: Reserved to the user — never the run's
    intent: 'Decisions held by the user: gates, rulings, and escalations no seat may take.'
    rules:
      - id: impl.gate-design-checkpoint
        labels: [user-gate, landing]
        class: floor
        kind: gate
        text: >-
          The design checkpoint is the user's. Where the check named gaps, no code is written
          before the user signs the design and the store delta — the store delta signed on a
          rendered diagram plus its named AX-XXX row changes and the pinned-base diff of the
          baselines (no render surface: present the source plus the changed-element table, and
          record it). The checkpoint's closing act is the flip: each `proposed (<key>)` entry of
          the run, in every baseline and the store, flips by the pinned-base diff — absent at
          the base to `in-flight (<key>)`, changed from it to `modifying (<key>)`, cut to its
          heading to `removing (<key>)` — the store's through
          mochiko:authoring-architecture-store; the sign-off base is then pinned per
          impl.base-pins. The user may stop at the checkpoint and resume the build later.
        anchor: 2026-08-26 plan-stage-utility
      - id: impl.gate-card-confirm
        labels: [user-gate]
        class: floor
        kind: gate
        text: >-
          The card confirm is the user's: a blocking checkpoint where the user rules the slicing
          before build.
        anchor: 2026-08-26 plan-stage-utility
      - id: impl.gate-final-acceptance
        labels: [user-gate]
        class: floor
        kind: gate
        text: 'Final acceptance is the user''s: accept / amend / reject closes the run.'
        anchor: 2026-08-13 charter-plan-implement
      - id: impl.user-runopen-rulings
        labels: [user-gate, scope-entry]
        class: must
        kind: reservation
        text: >-
          Reserved to the user at run-open: each store trip (ruled there, or deferred on the
          record) · each in-flight conflict · any sufficiency clause the grader could not clear.
      - id: impl.infeasible-card-escalation
        labels: [user-gate]
        class: must
        kind: routing
        text: An infeasible card is escalated to the user as a business-level scope decision.
      - id: impl.adopt-first-user-call
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          Two calls are never the builder's: a commodity-category adopt-first ruling and an IP-XXX
          provisioning call each halt the cycle to the user's checkpoint.
        pointer: mochiko:patterns-adopt-first
      - id: impl.ambiguity-escalation
        labels: [user-gate]
        class: must
        kind: routing
        text: >-
          Requirement ambiguity, or a judgment call a producer flags, goes to the user —
          investigable gaps excepted.
      - id: impl.scope-escalation-fail
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          Scope escalation is the user's: work bigger than the run was framed stays FAIL unless
          the user accepts it.
      - id: impl.design-first-write
        labels: [user-gate, landing]
        class: floor
        kind: reservation
        text: >-
          Where the design baseline's system part is still empty at landing, the fold's first
          system-part write is the user's: at final acceptance the proposed write and every
          critique-advisory finding are presented for the user's signature before the baseline
          takes them; a finding the user declines to sign lands as Drift:, never as baseline. A
          system part seeded at setup was signed there.
        when: {ux_bearing: present}
        anchor: 2026-09-19 impeccable-design-integration D7
  - id: impl.sec.tools
    title: Tools bindings
    intent: Paths, schemas, skills, and templates the run binds to.
    rules:
      - id: impl.tools-referenced-never-restated
        class: must
        extends: common.tools-referenced-never-restated
      - id: impl.sufficiency-binding-verdict
        labels: [scope-entry]
        class: must
        kind: gate
        text: >-
          The sufficiency check runs at entry — per row, per card under delta scope. The verdict
          is binding: per row, sufficient or a gap list; gaps fire the design phase over exactly
          those gaps and nothing else. The pointer skill owns the clause set, the gap forms, the
          absent-baseline branch, and the trip-vs-gap distinction.
        pointer: mochiko:review-sufficiency
        anchor: 2026-08-26 plan-stage-utility
      - id: impl.sufficiency-disputed-clause
        labels: [user-gate]
        class: must
        kind: routing
        text: >-
          A disputed sufficiency clause defaults to gap and goes to the user — the grader never
          clears alone.
      - id: impl.sufficiency-report
        labels: [evidence, reporting]
        class: must
        kind: binding
        text: >-
          The verdict lands as sufficiency-report.md in the feature dir: the run-open base commit
          (impl.base-pins), with any uncommitted product change already in the tree listed as
          pre-existing; the store-consult result and any no-delta claim, the trips for the user at
          run-open, the quickstart.md null path where no real external-integration surface exists,
          and any [MODIFY] amendment named against a delivered feature.
      - id: impl.absent-surfaces
        labels: [scope-entry]
        class: must
        kind: routing
        text: >-
          Absent surfaces are surfaced to the user, never auto-resolved, and never fail the run: a
          missing governance region is surfaced. A missing or stale
          .mochiko/memory/codebase-analysis.md on brownfield: offer /mochiko:setup, or proceed
          greenfield with the warning logged. A store with no ruled content: offer the
          /mochiko:architecture bootstrap. The check still runs, grading absent surfaces per its
          absent-baseline branch.
      - id: impl.briefs-name-rules-files
        labels: [scope-entry, seats]
        class: must
        text: >-
          Every code-touching brief names the relevant ${rules_dir}/ files as an obligated read.
        when: {governance_region: present}
      - id: impl.design-outputs-home
        labels: [landing]
        class: must
        kind: binding
        text: >-
          Design outputs are written in place in the product baselines at ${product_dir}/ under
          the run's lifecycle marker (impl.baseline-entry-grammar) — data-model.md, contracts/,
          constraints-and-decisions.md, quickstart.md, the design baseline's truth part, and the
          store's `proposed` elements where the structural trigger fired. The run's home keeps
          only architecture.md, the drawing the user signs: the C4-container delta diagram, the
          sequence diagrams for qualifying flows, the deployment view where IP-XXX rows exist, and
          the checkpoint table of changed elements — no register text, no current-state
          narrative. Structure and scope per mochiko:patterns-system-design, grammar and lifecycle
          per mochiko:authoring-architecture-store.
      - id: impl.design-review-pair
        labels: [independence, floor-pointer]
        class: must
        text: >-
          A non-author seat grades the design-phase output before the design checkpoint —
          mochiko:review-plan-artifacts for conformance to the gap list and card quality
          (blocking), mochiko:review-feasibility for buildability and contradiction.
      - id: impl.design-absent-baseline-seed
        labels: [scope-entry]
        class: must
        text: >-
          The phase's first duty is the seed — an empty scaffold stating so where no code is
          delivered; reconstructed from delivered code, and confirmed with the user at the
          checkpoint, where it exists. The seed is the baseline write, its entries `proposed
          (<key>)` like every design-phase write; the checkpoint card lists the seed entries apart
          from this feature's design entries, so the design is never merged into the seed.
        when: {baseline: absent}
      - id: impl.design-map-assertion
        labels: [landing]
        class: must
        text: >-
          The design phase asserts the design-implied dependencies and sharpened extent onto the
          capability's entry with provenance, and fills the architecture link when a store delta
          exists; status stays as the scope source set it; intended-vs-designed drift goes to the
          checkpoint. Where the check named a [MODIFY] amendment, the phase writes that marked
          delta on the affected delivered feature's entry.
        pointer: mochiko:authoring-feature-map
      - id: impl.midrun-refire
        labels: [scope-entry]
        class: must
        kind: routing
        text: >-
          A builder hitting undesigned structure halts that cycle; the design phase re-fires
          scoped to the discovery — same grade, same checkpoint. The deviation gate anchors to
          the signed delta once one exists.
        anchor: 2026-08-26 plan-stage-utility
      - id: impl.epic-design-always-fires
        labels: [scope-entry, seats]
        class: must
        text: >-
          The design phase always fires, for the joint spine at ${epics_dir}/EPIC-XXX/: the joint
          design plan, the joint architecture and seam design, and batch ordering. Spine artifacts
          follow templates/artifact-format.md.
        when: {scope: [epic]}
        pointer: mochiko:authoring-epic
      - id: impl.epic-seam-owners
        labels: [seats]
        class: must
        text: Every cross-member seam owner is named at design time — no later-lander default.
        when: {scope: [epic]}
      - id: impl.epic-shared-baseline-single-pen
        labels: [seats, landing]
        class: must
        text: >-
          A product baseline touched by two or more members is edited in place under one
          pen-holder at a time per file, its entries keyed `EPIC-XXX`; every shared-write surface
          rides the transport floor.
        when: {scope: [epic]}
      - id: impl.cards-template
        labels: [floor-pointer]
        class: must
        kind: binding
        text: >-
          tasks.md holds cycle cards from the tasks template — rendered by ${tasks_schema}. The
          pointer skill owns the slicing judgment and the **TEST:** grammar.
        pointer: mochiko:patterns-vertical-tdd
      - id: impl.card-contents
        labels: [evidence]
        class: must
        kind: binding
        text: >-
          Per card: stories and feature rationale, dependencies, acceptance criteria by ID, a
          **TEST:** real-infrastructure gate, and the cycle's brownfield exposure — no task
          lists, no file paths; the builder decomposes at build time. A UX-bearing card's
          **TEST:** gate names the FLOW-XXX paths it verifies, and carries the audit lens's
          pass/fail legs — the accessibility standard of record by pointer, never restated ·
          the measurable asserts · responsive checks at the viewports the Direction block's
          Contract declares — authored by ${qa_seat} at design time, examples in
          mochiko:patterns-vertical-tdd's references/TEST-GRAMMAR.md.
        anchor: 2026-09-19 impeccable-design-integration D8
      - id: impl.zero-gap-map-assertion
        labels: [landing]
        class: must
        text: >-
          On the zero-gap path the card-authoring seat makes the map-entry assertion the design
          phase would have made, surfacing drift at the confirm.
      - id: impl.card-review-before-confirm
        labels: [independence]
        class: must
        text: >-
          The verification seat reviews the cards before the card confirm — quality per
          mochiko:review-plan-artifacts, buildability its own judgment.
      - id: impl.epic-card-sequence
        labels: [seats]
        class: must
        text: >-
          The run builds one merged sequential card sequence from the joint design — shared
          foundation cycles first, then in-epic dependency order — with feature-tagged cards
          whose reports land in each member's ${features_dir}/FEAT-XXX/.
        when: {scope: [epic]}
      - id: impl.craft-build-bindings
        labels: [floor-pointer]
        class: must
        kind: binding
        text: >-
          Build binds mochiko:executing-tdd-cycle — its cycle-report.md (disclosed
          decomposition, honest difficulties, deviations, domain_deps_added) is the run's
          uncertainty carrier · mochiko:brownfield-integration on touches to existing code ·
          mochiko:patterns-code-minimalism at decomposition, rungs disclosed.
      - id: impl.craft-verify-bindings
        labels: [floor-pointer, evidence]
        class: must
        kind: binding
        text: >-
          Verify binds mochiko:testing-end-user — evidence captured, never assumed — plus the
          per-cycle lens mochiko:review-code-minimalism: the verification seat reads the diff, the
          cycle report, and the codebase around the diff; reuse claims never on trust.
      - id: impl.design-inputs
        labels: [scope-entry]
        class: must
        kind: binding
        text: >-
          Design inputs are sufficiency-report.md and, where the design phase ran, the run's
          architecture.md drawing at ${features_dir}/FEAT-XXX/ and its marked entries in the
          product baselines, read in the pinned-base diff — the signed store delta among them
          (the store at the sign-off base, or the checkpoint table), the anchor for the deviation
          check and the built-vs-signed diff; the product baselines at ${product_dir}/
          (data-model.md, contracts/, constraints-and-decisions.md, the design baseline at
          ${product_dir}/design/, and the architecture store, whose concern rows carry the NFR-XXX
          targets the built code must meet); spec.md for the cards' cited acceptance criteria.
      - id: impl.progress-surface
        labels: [evidence, reporting]
        class: must
        kind: binding
        text: tasks.md's per-card checkboxes are the progress surface, flipped as cycles complete.
      - id: impl.reports-envelope
        labels: [reporting]
        class: must
        kind: binding
        text: >-
          All reports land in the owning home's `reports/` directory —
          ${features_dir}/FEAT-XXX/reports/ (a product-lane run:
          ${product_dir}/lane-<slug>/reports/, an epic run: the epic home's): the sufficiency
          report, cycle reports, verification reports, the final-validation report, the
          built-vs-signed diff. Every one carries the `report-envelope` frontmatter
          (machine-first, typed by `report:`, ultra register, clean = frontmatter-only; bounce an
          envelope-breaking report per templates/report-format.md rule 9), and each producing
          seat's brief names the home's `reports/` path. Repeat runs append, dated; the run's
          architecture.md drawing is overwritten per run.
      - id: impl.gates-full-suite
        labels: [evidence]
        class: must
        text: Quality gates run the full repository suite.
      - id: impl.regression-sweep
        labels: [evidence, landing]
        class: must
        text: >-
          The final validation additionally runs the accumulated **TEST:** gates of previously
          delivered features in this feature's territory — their durable gate sets at
          ${features_dir}/FEAT-XXX/gates.md plus the cases on their cards — and this feature's
          gates exercise any seam whose earlier side is already delivered (seam ownership sits
          with the later-landing feature, mochiko:authoring-feature-map). An epic runs the
          accumulated gates once, over the union of member territories. A failure here fails the
          run like any other regression.
      - id: impl.cold-verification
        labels: [evidence]
        class: must
        text: >-
          The final validation builds and runs the quality gates from a dependency-cold snapshot
          of the uncommitted working state (`git ls-files -co --exclude-standard
          :!.claude/worktrees` copied to `.claude/worktrees/mochiko-<purpose>/`); ensure the
          `/.claude/worktrees` ignore entry exists first. Results are part of the acceptance
          evidence. One snapshot covers a whole epic.
      - id: impl.gap-finding-scope
        labels: [scope-entry, evidence]
        class: must
        text: >-
          The gap-finding pass runs on selection-scope and epic runs only (an epic: once, over the
          union of member territories); a delta-scope or lane run skips it, and its
          final-validation report states the skip — never a silent no-op.
        anchor: 2026-08-19 qa-gap-finding-verification
      - id: impl.gap-finding-blind-dispatch
        labels: [independence]
        class: must
        text: >-
          Gap-finding dispatch is two-message and blind. The first message carries only spec.md,
          the sufficiency report and the signed architecture.md drawing where one exists, Screens
          & Flows, and the baselines data-model.md, contracts/, the design baseline, and the
          store's NFR-XXX concern rows — their `built` and in-flight-class entries only, never a
          `proposed` one — never the code, tasks.md, the **TEST:** cases, or any report. The
          seat states its derived expectations; only then does probing begin. Its brief carries
          the model-tiering rule, and its delegated reads stay inside the same fence.
        pointer: mochiko:testing-gap-finding
        anchor: 2026-08-19 qa-gap-finding-verification
      - id: impl.mutation-lens
        labels: [evidence, seats]
        class: must
        text: >-
          The mutation lens runs on the verification seat, which already holds code sight; skips
          are disclosed — the run owes mutation results or a stated skip.
        when: {depth: [high]}
        anchor: 2026-08-19 qa-gap-finding-verification
      - id: impl.finding-kinds
        labels: [evidence]
        class: must
        kind: routing
        text: >-
          Findings split by kind: spec-required behavior broken — evidence captured, clause
          cited — fails the final validation; a beyond-spec finding is advisory.
        anchor: 2026-08-19 qa-gap-finding-verification
      - id: impl.finding-kind-disputed
        labels: [user-gate]
        class: must
        kind: routing
        text: >-
          Each finding's kind is confirmed at the checkpoint against the cited clause; a disputed
          kind defaults advisory and goes to the user — the finder never gates alone.
        anchor: 2026-08-19 qa-gap-finding-verification
      - id: impl.delivered-territory-routing
        labels: [landing]
        class: must
        kind: routing
        text: >-
          A gap in a previously delivered feature's territory is not this run's rework: it routes
          to a /mochiko:feature delta card, cited in the report.
        anchor: 2026-08-19 qa-gap-finding-verification
      - id: impl.beyond-spec-disposition
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          Each beyond-spec finding's disposition is the user's: fix now, book to BACKLOG.md, or
          accept as designed.
        anchor: 2026-08-19 qa-gap-finding-verification
      - id: impl.store-landing
        labels: [landing]
        class: must
        text: >-
          A built structural change lands in the architecture store in three parts: the landing
          flip over the run's elements — `in-flight` and `modifying` to `built`, the key
          cleared, each `removing` element to its `removed` stub (transcription — rides this
          run's landing audit) · the touched rows' As-built: and Drift: fields are written as
          judgment and independently graded · the orphan check runs — a `proposed` or
          in-flight-class element keying no open feature, epic or lane is flagged, never left. The
          store skill regenerates the derived root ARCHITECTURE.md; it is never hand-edited here.
        pointer: mochiko:authoring-architecture-store
      - id: impl.km-landing
        labels: [landing]
        class: must
        text: >-
          The same landing carries the knowledge-management obligations of
          .mochiko/memory/knowledge-management.md.
        when: {km_file: present}
      - id: impl.landing-selection
        labels: [landing]
        class: must
        text: >-
          The landing executes the store landing plus the map's graduation batch: this run's
          delivered work rows fold into the capability's extent lines and vanish (pending rows
          persist) · status set delivered, dated, never regressing · the FEATURES.md index line
          updates · the specs-index row is touched — a spec reads closed exactly when all its
          selected rows have folded (derived, never asserted). No separate feature-close stage
          exists.
        when: {scope: [selection]}
        pointer: mochiko:authoring-feature-map
      - id: impl.landing-epic
        labels: [landing]
        class: must
        text: >-
          The landing executes each member's graduation batch, plus the epic close: the [EPIC-XXX]
          row markers vanish, the manifest is stamped delivered (dated), the spine directory
          persists as record. Multi-spec closure is compositional: each spec closes on its own
          rows, however many specs one landing touches.
        when: {scope: [epic]}
        pointer: mochiko:authoring-epic
      - id: impl.landing-delta
        labels: [landing]
        class: must
        text: The landing executes the entry's marked delta fold.
        when: {scope: [delta]}
        pointer: mochiko:authoring-feature-map
      - id: impl.landing-lane
        labels: [landing]
        class: must
        text: >-
          The landing adds no map work to the store landing and the baseline landing flip: a
          product lane owns no capability entry, so the map takes no write — no graduation
          batch, no status flip, no extent-line fold — and the map-delta boundary check of
          impl.landing-verifier-folds reads as zero writes. The lane directory at
          ${product_dir}/lane-<slug>/ persists as record.
        when: {scope: [lane]}
        pointer: mochiko:authoring-feature-map
      - id: impl.gates-fold
        labels: [landing]
        class: must
        text: >-
          The landing folds the gap findings ruled fix-now or backlog into
          ${features_dir}/FEAT-XXX/gates.md (minted if absent), ${qa_seat} authoring each in the
          **TEST:** grammar; findings the user accepted as designed do not fold.
      - id: impl.register
        class: must
        kind: binding
        extends: common.register
      - id: impl.craft-floor-binding
        labels: [floor-pointer]
        class: must
        kind: binding
        text: >-
          On a card carrying SCR-XXX/FLOW-XXX trace, ${builder_seat} loads the pointer skill
          immediately before any edit, small refinements included, and never for planning-only
          work.
        when: {ux_bearing: present}
        pointer: mochiko:patterns-craft-floor
        anchor: 2026-09-19 impeccable-design-integration D8
      - id: impl.design-finish
        labels: [evidence]
        class: must
        kind: routing
        text: >-
          On a UX-bearing batch the final validation carries the design finish: the gap-finding
          pass runs its critique lens, the run's depth level in the finder's brief, and ${qa_seat}
          runs mochiko:review-design-audit. The pointer skill owns the lens's blocking/advisory
          split and its depth keying. A blocking critique finding is spec-required under
          impl.finding-kinds; an advisory one is its own kind, critique-advisory — neither
          spec-required nor beyond-spec, it takes no beyond-spec disposition and rides to the
          design landing fold; a disputed kind goes to the user as impl.finding-kind-disputed
          routes it. Critique rework spends at most one fix round and one confirm round inside
          impl.gap-rework-bound — never a bound beside it, never raising it.
        when: {ux_bearing: present}
        pointer: mochiko:testing-gap-finding
        anchor: 2026-09-19 impeccable-design-integration D8
      - id: impl.design-landing
        labels: [landing]
        class: must
        text: >-
          A UX-bearing landing folds the built UI into the design baseline: ${designer_seat}
          derives the system part from shipped code, never from intent, reconciles it against the
          direction contract's declared tokens, writes the shipped values, and marks each
          divergence, each critique-advisory finding, and each accepted design-audit Drift:
          candidate as Drift:. The write is judgment, graded by the landing verification seat. The
          setup lead writes only its empty scaffold; ${designer_seat} is the only writer of its
          content, on two paths: a build-raised entry in the truth part, written in place under
          its lifecycle marker (impl.baseline-entry-grammar), and this fold.
        when: {ux_bearing: present}
        anchor: 2026-09-19 impeccable-design-integration D7
      - id: impl.baseline-entry-grammar
        labels: [landing, evidence]
        class: must
        kind: binding
        text: >-
          Every product-baseline entry a run writes or amends carries a `**Lifecycle:**` field of
          its own, apart from any stance field (the store's lifecycle field is its `Status`; a
          constraints entry's `**Status:**` stays its stance). The key is the run's owner:
          `FEAT-XXX` for a feature run, `EPIC-XXX` for an epic's shared write, `lane-<slug>` for a
          product-lane run. Before the design checkpoint every run write reads `proposed (<key>)`:
          a new entry, an amended one with its new text in place, a removed one with its heading
          and marker kept and its body cut. The sign-off flips each by the pinned-base diff —
          absent at the base to `in-flight (<key>)`, changed from it to `modifying (<key>)`, cut
          to its heading to `removing (<key>)`. A build-time decision is written directly in that
          post-sign form — new `in-flight`, amended `modifying`, removed `removing` — its
          judgment graded by the landing verification seat. At landing `in-flight` and `modifying`
          flip to `built`, the key cleared; a `removing` entry becomes its stub (heading kept,
          `**Lifecycle:** removed`, no body, no key, its id still taken). An entry with no
          `**Lifecycle:**` field reads `built`. Readers: `proposed` is nothing promised and reads
          absent; the in-flight class (`in-flight` · `modifying` · `removing`) is planned
          contract; `removed` reads absent; `built` or no field is delivered. A new entry takes
          the next free id of the product file's own sequence at write time, a `removed` stub's id
          counting as taken — no feature-local sequence, no renumbering at landing. The why
          lives on the entry (a constraints entry's `Source` · `Shaped by` · `Impact`; a
          build-raised entry's `**Raised:**` and one-line `**Weighed:**`), never in a ledger; the
          commit message is not a carrier. Prior text is never kept beside the new — the
          pinned-base diff shows it. Where the marker sits: in data-model.md and quickstart.md the
          `**Lifecycle:**` line is the first line under the entry heading; in
          constraints-and-decisions.md it is the same first line, above the stance line
          (`**Class:** … · **Status:** …`), never sharing it; a build-raised entry's
          `**Raised:** <cycle>` and `**Weighed:** <why, one line>` follow it directly, one line
          each. A contracts/ .md entry is the heading of the clause that changes, at the level its
          sibling clauses use, `**Lifecycle:**` its first line; api.yaml takes an `x-lifecycle`
          key on the changed operation or schema, with the same values, a removed one keeping only
          its summary and `x-lifecycle: removed`. The architecture store takes no separate field
          and keeps its own `**Name**:` form: a spine element's lifecycle is its Status column,
          with Raised and Weighed columns filled on a build-raised element; a concern row's is its
          `- **Status**:` field, followed on a build-raised row by `- **Raised**:` and `-
          **Weighed**:`; a removed concern keeps its heading and `- **Status**: removed`, a
          removed spine row its id, kind, name and status, not drawn. Every brief to a seat that
          writes or amends a product baseline carries this rule as an obligated read.
        anchor: 2026-09-24 delta-files-vs-direct-baseline-edits D2
      - id: impl.baseline-diff-review
        labels: [landing, evidence]
        class: floor
        text: >-
          Every review of a run's baseline change reads `git diff <base> -- ${product_dir}/` —
          the committed and uncommitted change since the pinned base (impl.base-pins), whoever
          committed it: in the design phase the design review pair reads it as part of the package
          it grades; at build time the landing verification seat grades the judgment content of
          build-raised entries. At landing, in order: the unmarked-write test runs on the diff
          before any landing write; the duplicate-id check passes over every id in each touched
          baseline, and the second run to land renumbers its own entries; then the landing flip,
          read from the diff, never from markers alone — `in-flight` and `modifying` to `built`,
          the key cleared, each `removing` entry to its stub (heading kept, `**Lifecycle:**
          removed`, no body, no key, its id still taken) — over every baseline and the store
          alike, an NFR-only concern-row change included whether or not structure was built,
          sweeping the counts, summary rows, relationship tables and validation-rule lists the
          diff touched. An entry still keyed to the run after the flip is flagged; an abandoned
          run's changes are found by the same diff and reverted.
        anchor: 2026-09-24 delta-files-vs-direct-baseline-edits D3
      - id: impl.base-pins
        labels: [evidence, landing]
        class: must
        kind: binding
        text: >-
          Two base commits pin every baseline review. The run-open pin: the run's lead takes the
          HEAD commit at entry, before spawning the sufficiency seat, and names it in that seat's
          brief; the seat writes it into sufficiency-report.md, listing any uncommitted product
          change already in the tree as pre-existing; run-open restates it, and the run's log
          records it. The sign-off pin: the commit the checkpoint card asks the user to make —
          suggested, never run (impl.no-git-mutations) — or, where none is made, the flipped
          entry set the card records (the checkpoint table of the run's architecture.md where it
          has one), which the built-vs-signed diff and impl.deviation-gate then read as the signed
          state. The deviation gate and the built-vs-signed diff read against the sign-off pin;
          every other baseline review reads against the run-open pin. Both pins go into the
          final-validation report. A groom of a baseline during a run is deferred past the landing
          or, by the user's ruling, lands as its own commit that the reviews read around — `git
          diff <base>..<groom>^` for the change before it, `git diff <groom>` for the change after
          it — and carries no lifecycle marker.
        anchor: 2026-09-24 delta-files-vs-direct-baseline-edits D3
  - id: impl.sec.ways-of-working
    title: Ways of Working
    intent: How the run sequences, verifies, and reports; model routing for its seats.
    rules:
      - id: impl.author-grader-default-fail
        class: floor
        extends: common.author-grader-default-fail
      - id: impl.plan-approval-producers
        labels: [seats, independence]
        class: must
        text: >-
          Every seat that writes code or artifacts plans first, read-only, in a plan-only
          dispatch, and stops; a fresh peer of its persona type — a generic seat for a
          persona-less producer — grades the plan per `mochiko:review-seat-plan`, and you
          approve only a passed plan and resume the seat to work; grading, verification, and
          fact-finding seats are exempt.
      - id: impl.escalation-batching
        labels: [user-gate, reporting]
        class: must
        kind: routing
        text: >-
          Reserved-to-user questions accumulate and land as one batch at the cycle checkpoint;
          only a question the build cannot proceed without interrupts mid-cycle. Never sit on a
          build-blocking one.
      - id: impl.finding-severity-routing
        labels: [reporting]
        class: must
        kind: routing
        text: >-
          Advisory verifier findings ride the escalation cadence: a Minor finding defaults to a
          BACKLOG.md booking, never an in-cycle fix; an Important-or-above finding blocks the
          cycle and joins the checkpoint batch.
      - id: impl.model-tiering
        class: must
        kind: routing
        extends: common.model-tiering
        anchor: 2026-08-16 model-tiered-seats
      - id: impl.delta-reverification
        labels: [evidence]
        class: must
        text: >-
          Re-verification is scoped to the delta: a test-only or records-only change gets a
          delta-grade of the changed surface, never a full gate re-sweep. A delta round re-runs no
          quality gates — the prior evidence stands while the graded head is unmoved; the graded
          object is the code tree (`git rev-parse HEAD:<code-dir>`), so a records-only commit does
          not move it.
      - id: impl.no-git-mutations
        labels: [user-gate]
        class: must
        text: >-
          Suggest commits; never run git mutations, never push (an ephemeral, self-removed
          verification snapshot is not a mutation of refs, index, tracked content, or history).
      - id: impl.acceptance-plain-text
        labels: [user-gate]
        class: must
        text: >-
          The user's ruling at each blocking gate — the design checkpoint, the card confirm,
          final acceptance — is plain blocking text, never a timed prompt.
      - id: impl.artifact-home
        labels: [binding]
        class: floor
        kind: binding
        text: >-
          Build-run artifacts have a declared home: render `mochiko-cli home
          ${features_dir}/FEAT-XXX` — an epic run, the epic home; a lane run, the lane home —
          before the first write. `tasks.md` binds the `tasks` template; every report lands in
          that home's `reports/` typed by its envelope; `implement-log.md` is bounded per entry,
          never per file. A name the home's set does not carry is raised to the lead, never minted
          from a sibling run.
        anchor: 2026-09-13 hook-enforced-artifact-schema D1
  - id: impl.sec.boundaries
    title: Boundaries — the non-waivable floor
    intent: Floor obligations no seat and no in-run ruling can waive.
    rules:
      - id: impl.deviation-gate
        labels: [user-gate]
        class: floor
        kind: gate
        text: >-
          A cycle that adds or removes a box, adds, removes, or redirects an arrow, or moves a
          responsibility across a boundary of the signed delta stops and is presented — build as
          approved, or amend the delta by the user's ruling first. Never design around it
          silently.
      - id: impl.constitution-supremacy
        labels: [user-gate]
        class: floor
        text: >-
          Feature work never overrules the constitution. A governance conflict conforms, or is
          amended or waived through governance-ledger.md — the user's ruling.
      - id: impl.constraint-challenge
        labels: [user-gate, floor-pointer]
        class: floor
        text: >-
          A ratified constraint is never silently overridden. A commodity-category check that
          collides with one files a constraint-challenge finding — the constraint's text, the
          real requirement it plausibly restates, the candidate it excludes — reserved to the
          user. Only the colliding decision pauses; the run proceeds elsewhere.
        pointer: mochiko:patterns-adopt-first
      - id: impl.attempt-per-grade
        labels: [attempt-economy]
        class: floor
        kind: bound
        text: >-
          A cycle consumes an attempt every time a verification seat grades it, whatever the round
          is called. Default ${attempt_bound_cycle} per cycle, redeclarable only at run-open.
        anchor: 2026-08-26 command-content-schema D12
      - id: impl.attempt-exemption-user-only
        labels: [attempt-economy, user-gate]
        class: floor
        kind: reservation
        text: Exempting a round from the attempt count is the user's call, never yours.
        anchor: 2026-08-26 command-content-schema D12
      - id: impl.no-progress-stop
        labels: [attempt-economy]
        class: floor
        kind: bound
        text: >-
          Two consecutive rounds with unchanged findings is a no-progress stop: halt the cycle,
          present state.
        anchor: 2026-08-26 command-content-schema D12
      - id: impl.epic-member-halt
        labels: [attempt-economy, user-gate]
        class: floor
        kind: bound
        text: >-
          Exhaustion or no-progress halts member-scoped; the disposition — carve the member out
          (its rows return to pending, the run continues) or hold the whole run — is the user's.
        when: {scope: [epic]}
        anchor: 2026-08-26 command-content-schema D12
      - id: impl.gap-rework-bound
        labels: [attempt-economy, user-gate]
        class: floor
        kind: bound
        text: >-
          Gap-rework at final validation is the attempt economy at run scale: default
          ${gap_rework_bound} rounds, redeclarable only at run-open; a finding that localizes to
          one cycle's territory charges that cycle's remaining attempts instead. Bound exhaustion,
          or a round with unchanged findings, halts the run and presents state — the disposition
          is the user's.
        anchor: 2026-08-26 command-content-schema D12
      - id: impl.gates-never-triaged
        labels: [evidence]
        class: floor
        text: >-
          Gates are never severity-triaged. A failed **TEST:** gate or quality gate fails the
          cycle, per the done condition.
      - id: impl.minimalism-advisory
        labels: [evidence]
        class: floor
        text: 'minimalism: findings stay advisory at any severity.'
      - id: impl.lane-never-widens
        labels: [scope-entry]
        class: floor
        text: >-
          The lane never widens in place. A product-lane run discovering it stands on an in-flight
          feature's territory files the finding to that run and aborts.
        when: {scope: [lane]}
      - id: impl.sound-loop-floor
        labels: [floor-pointer, independence]
        class: floor
        text: >-
          A judgment-authored write to a governing surface obliges the sound loop: a seat produces
          on a plan a fresh peer passed and you approved, an independent non-author seat reviews,
          the user rules. This run's seat wiring already carries it end to end.
        pointer: mochiko:patterns-sound-loop
        anchor: 2026-09-03 producer-plan-enforcement D8
      - id: impl.transport-floor
        class: floor
        when: {seats: multi}
        extends: common.transport-floor
      - id: impl.design-audit-advisory
        labels: [evidence]
        class: floor
        text: >-
          design-audit: findings stay advisory at any severity. They land in the final-validation
          report's `design-audit:` block — a clean audit omits the block; only a declined or
          skipped audit states its reason there. A finding that diverges from the design baseline
          is a Drift: candidate at the design landing fold.
        when: {ux_bearing: present}
        anchor: 2026-09-19 impeccable-design-integration D8
      - id: impl.baselines-in-place-marked
        labels: [landing]
        class: floor
        text: >-
          Product baselines are edited in place. A seat that needs one to say something new — in
          the design phase, or at a build-time technical decision — writes it into the product
          file itself at ${product_dir}/ (data-model.md, constraints-and-decisions.md, contracts/,
          quickstart.md, the design baseline's truth part, and the architecture store), on the
          run's working tree, each written or amended entry under the run's lifecycle marker
          (impl.baseline-entry-grammar). No per-feature or epic copy of a baseline, no
          baseline-delta.md ledger, no fold: the change is the diff against the run's pinned base
          (impl.base-pins), reviewed per impl.baseline-diff-review. A write into an absent
          baseline creates the file in place. The design baseline's system part takes no
          design-phase or build-time write: it lands from shipped code per impl.design-landing.
          The rule binds feature, epic and product-lane runs; an out-of-run fix that ships a
          baseline edit and its code in one commit writes `built` directly, no marker.
        anchor: 2026-09-24 delta-files-vs-direct-baseline-edits D1
  - id: impl.sec.fail-conditions
    title: Not done — default FAIL
    intent: >-
      The kind: fail set — any one standing fails the run; the .md Not-done line cites the count
      this render prints.
    rules:
      - id: impl.fail.sufficiency-unrecorded
        labels: [reporting]
        class: floor
        kind: fail
        text: The sufficiency verdict was never recorded as a report.
        enforces: [impl.sufficiency-report]
        anchor: 2026-08-26 command-content-schema D7
      - id: impl.fail.design-skipped
        labels: [user-gate]
        class: floor
        kind: fail
        text: >-
          Gaps were found but the design phase was skipped, or its design and store delta were
          never signed by the user.
        enforces: [impl.design-phase-fires-on-gap, impl.gate-design-checkpoint]
        anchor: 2026-08-26 command-content-schema D7
      - id: impl.fail.card-independence
        labels: [independence]
        class: floor
        kind: fail
        text: A cycle card built by the seat that authored it, or built before the card confirm.
        enforces: [impl.seat-card-author-independence, impl.gate-card-confirm]
        anchor: 2026-08-26 command-content-schema D7
      - id: impl.fail.card-unchecked
        labels: [evidence]
        class: floor
        kind: fail
        text: A cycle card left unchecked.
        enforces: [impl.progress-surface]
        anchor: 2026-08-26 command-content-schema D7
      - id: impl.fail.quality-gate
        labels: [evidence]
        class: floor
        kind: fail
        text: A failing quality gate.
        enforces: [impl.gates-full-suite, impl.gates-never-triaged]
        anchor: 2026-08-26 command-content-schema D7
      - id: impl.fail.no-evidence
        labels: [evidence]
        class: floor
        kind: fail
        text: Verification claimed without real-infrastructure evidence.
        enforces: [impl.craft-verify-bindings]
        anchor: 2026-08-26 command-content-schema D7
      - id: impl.fail.regression
        labels: [evidence]
        class: floor
        kind: fail
        text: A regression in a previously delivered feature's gates.
        enforces: [impl.regression-sweep]
        anchor: 2026-08-26 command-content-schema D7
      - id: impl.fail.deviation-unresolved
        labels: [user-gate]
        class: floor
        kind: fail
        text: >-
          An architecture deviation neither built as approved nor amended with the user's consent.
        enforces: [impl.deviation-gate]
        anchor: 2026-08-26 command-content-schema D7
      - id: impl.fail.store-landing-incomplete
        labels: [landing]
        class: floor
        kind: fail
        text: >-
          A signed store delta landed without its built-vs-signed diff, or an in-flight-class
          element left neither flipped (to `built`, or to its `removed` stub) nor keyed to an open
          feature, epic or lane.
        enforces: [impl.store-landing]
        anchor: 2026-08-26 command-content-schema D7
      - id: impl.fail.gap-finding-missing
        labels: [evidence]
        class: floor
        kind: fail
        text: A run without its gap-finding pass.
        when: {scope: [selection, epic]}
        enforces: [impl.gap-finding-scope]
        anchor: 2026-08-26 command-content-schema D7
      - id: impl.fail.skip-unstated
        labels: [reporting]
        class: floor
        kind: fail
        text: A run whose final-validation report does not state its skipped gap-finding pass.
        when: {scope: [delta, lane]}
        enforces: [impl.gap-finding-scope]
        anchor: 2026-08-26 command-content-schema D7
      - id: impl.fail.spec-gap-unresolved
        labels: [evidence]
        class: floor
        kind: fail
        text: A gap finding showing spec-required behavior broken, left unresolved.
        enforces: [impl.finding-kinds]
        anchor: 2026-08-26 command-content-schema D7
      - id: impl.fail.no-acceptance
        class: floor
        kind: fail
        extends: common.no-acceptance
        enforces: [impl.gate-final-acceptance]
        anchor: 2026-08-26 command-content-schema D7
      - id: impl.fail.unmarked-baseline-write
        labels: [landing]
        class: floor
        kind: fail
        text: >-
          A hunk in the run's pinned-base diff of ${product_dir}/ outside an entry marked for the
          run's key — a pre-sign removal is a marked entry with its body cut, so a bare deletion
          hunk is unmarked. Excepted: hunks already in the tree at run-open, recorded as
          pre-existing on the run-open pin, and hunks inside an entry marked for another open key.
        enforces: [impl.baselines-in-place-marked, impl.baseline-entry-grammar]
        anchor: 2026-09-24 delta-files-vs-direct-baseline-edits D3
      - id: impl.fail.unreviewed-baseline-diff
        labels: [landing]
        class: floor
        kind: fail
        text: >-
          A touched baseline accepted without its pinned-base diff review — the non-author
          grade, the unmarked-write test, the duplicate-id check and the landing flip.
        enforces: [impl.baseline-diff-review]
        anchor: 2026-09-24 delta-files-vs-direct-baseline-edits D3
tombstones:
  - id: impl.baselines-never-in-place
    disposition: >-
      superseded by impl.baselines-in-place-marked — baselines are edited in place under the
      run's lifecycle marker (D1); the graded fold and the per-feature delta copies go. Its store
      carve (a store write only at the checkpoint's sign-off) moves to
      authoring-architecture-store.sign-off-flips-proposed (0029); its "ruled truth never edited
      in place" leaves by D1/D2 — a ruled entry is amended in place as `modifying`, the prior
      text in the pinned-base diff. (2026-09-24 delta-files-vs-direct-baseline-edits D1)
  - id: impl.baseline-delta-grammar
    disposition: >-
      superseded by impl.baseline-entry-grammar — a baseline change is an entry written in place
      under its lifecycle marker (D1/D2), not a feature-dir delta. Its landing-seat grade of
      build-time judgment moves to the successor and to impl.baseline-diff-review; its "three-way
      diff stays a transcription check" has nothing left to check, since no transcription remains
      (D3c). (2026-09-24 delta-files-vs-direct-baseline-edits D2)
  - id: impl.graded-fold
    disposition: >-
      superseded by impl.baseline-diff-review — no fold remains to grade: the change is the
      pinned-base diff, reviewed by a non-author seat (D3c). Its store carve survives in
      impl.store-landing and the landing flip; its design carve in impl.design-landing; its
      absent-file clause in review-sufficiency.absent-baseline and
      impl.design-absent-baseline-seed, the file created in place per
      impl.baselines-in-place-marked; its epic clause in
      authoring-epic.shared-baseline-single-pen-holder. The three-way transcription check goes
      with the transcription. (2026-09-24 delta-files-vs-direct-baseline-edits D3)
  - id: impl.fail.baseline-in-place
    disposition: >-
      superseded by impl.fail.unmarked-baseline-write — an in-place edit is now the rule (D1);
      the fail is a write outside the run's marked entries (D3c, verify N1). (2026-09-24
      delta-files-vs-direct-baseline-edits D3)
  - id: impl.fail.ungraded-fold
    disposition: >-
      superseded by impl.fail.unreviewed-baseline-diff — no fold remains to grade; the review is
      of the pinned-base diff (D3c). (2026-09-24 delta-files-vs-direct-baseline-edits D3)
