<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledgerline — Invoice editor (SCR-004)</title>
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body>
  <header class="appbar">
    <span class="brand">Ledgerline</span>
    <nav>
      <a href="../index.html">Dashboard</a>
      <a href="scr-002-client-list.html">Clients</a>
      <a href="scr-004-invoice-editor.html">New invoice</a>
      <a href="scr-007-reminder-settings.html">Reminders</a>
    </nav>
  </header>
  <main>
    <h1>Draft invoice <span class="feat-tag">SCR-004 · FEAT-003</span></h1>
    <div class="card">
      <form action="scr-005-invoice-detail.html" method="get">
        <label>Client</label>
        <select><option>Baker Electric</option><option>Ada Plumbing LLC</option><option>Cedar Remodel Co</option></select>
        <label>Line items</label>
        <table>
          <thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr></thead>
          <tbody>
            <tr><td><input value="Panel upgrade — labor"></td><td><input value="8"></td><td><input value="75.00"></td><td>$600.00</td></tr>
            <tr><td><input value="Breakers &amp; materials"></td><td><input value="1"></td><td><input value="200.00"></td><td>$200.00</td></tr>
          </tbody>
        </table>
        <a class="btn" href="scr-004-invoice-editor.html">+ Add line item</a>
        <div class="row" style="margin-top:12px">
          <div><label>Tax rate (%)</label><input value="7.75"></div>
          <div><label>Due date</label><input type="date" value="2026-07-31"></div>
        </div>
        <p class="muted">Subtotal $800.00 · Tax (7.75%) $62.00 · <strong>Total $862.00</strong></p>
        <p class="muted">An invoice with no line items, or a due date in the past, is rejected on save.</p>
        <div style="margin-top:12px">
          <button class="btn primary" type="submit">Save draft</button>
          <a class="btn" href="../index.html">Cancel</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
