# An entry marks its rule as PROTECTED CONTENT: the rule leaves its schema only
# by recorded supersession-by-ruling (GI-005/GI-006). Anchor form:
#   "YYYY-MM-DD <session-slug> [D#]" — date+slug resolve against a live
# DECISIONS.md row (checker-verified); a trailing D# is human-readable only.
# A key naming a rule ID absent from its schema is a dangling entry (checker
# finding). Change traces (what left, when, why) live in .mochiko/strips/.
# Renamed command-provenance → primitive-provenance at v0.100.0 — skill-schema
