  - op: import-document
    kind: template
    name: governance-surfaces
    content:
      template: governance-surfaces
      title: Governance Surfaces (the dissolved constitution — Shapes 1-5)
      form: artifact-format.md
      register: full
      overview: |
        GOVERNANCE SURFACES TEMPLATE — the canonical shapes of the dissolved constitution
        =================================================================================
        There is NO constitution.md. Governance is a SET, authored by `authoring-constitution` and graded as one deliverable
        by `validation-constitution`:

          1. A marked governance region in CLAUDE.md          (always-on; short-form only)
          2. `paths`-scoped rules files under .claude/rules/mochiko/   (scope-on-touch)
          3. Skill pointers                                    (procedure lives in skills)
          4. The governance ledger at .mochiko/memory/governance-ledger.md  (setup/amend + validator only)
          5. The trace summary manifest                        (the validator's grading surface)

        Ownership (D8): the region between the markers — and everything under .claude/rules/mochiko/ and
        the ledger — is setup-owned and idempotently REGENERATED on re-runs and amends. Content outside
        the markers is user territory: NEVER touched. TWO carve-outs, both preserved verbatim across
        regenerations: (1) a domain-dependency registry block (`mochiko:domain-registry` markers) inside
        a layer-scoped rules file — implement-time additions live there
        (`authoring-constitution/references/DOMAIN-DEPENDENCIES.md`); (2) the output-style switch line
        (`mochiko:output-style` markers) in Governance operations — setup writes it default-on ONCE, and
        every later regeneration keeps whatever per-surface values the user set. Regenerating it back to
        the defaults silently reverts a user's ruling, which is the failure the carve-out exists to
        prevent (style home: `templates/output-style.md`). HTML comments in CLAUDE.md are
        stripped before context injection (doc-confirmed) — trace stamps there are context-free; comment
        handling in rules files is undocumented, so the ledger is always the canonical metadata record.
      sections:
        - name: Shape 1 — the CLAUDE.md governance region
          required: true
          contract: |
            Regenerated in place between the markers. Everything short-form: one line per entry, detail in
            the ledger, module detail behind pointers.

            ```markdown
            <!-- mochiko:governance:begin -->
            ## Governance

            **Ratified:** v[X.Y.Z] · [YYYY-MM-DD] · production floor · depth: [low | high] · modules: [attached compliance modules, or "none"] <!-- GI-001 (fact profile) · GI-0XX (depth level) -->

            ### Principles

            <!-- Universal principles: the operative line IS the governance. Scope-bound and
                 procedure-shaped principles: the line is an index entry pointing at the home. -->
            - [Imperative universal principle, RFC 2119, one line] [(NON-NEGOTIABLE) for floor principles] <!-- GI-XXX -->
            - [Imperative universal principle] <!-- GI-XXX -->
            - [Concern name] — see `.claude/rules/mochiko/[file].md` <!-- GI-XXX -->
            - [Procedure name] — follow skill `[skill-name]` when [trigger] <!-- GI-XXX -->

            ### Technology stack

            - [Language/runtime + version] · [framework] · [key mandated choices, one line each] <!-- GI-XXX -->

            ### Quality gates

            - `[actual command]` MUST pass before merge <!-- GI-XXX -->
            - Coverage ≥ [floor card's coverage threshold, session-overridable]% on new code (`[actual command]`) <!-- GI-XXX -->

            ### Governance operations

            - Ledger (waivers · amendment policy · exceptions · Three-Part metadata): `.mochiko/memory/governance-ledger.md`
            - Amend via `/mochiko:setup` (fact-profile changes — module attach/detach — and un-waives are governance events)
            <!-- mochiko:output-style:begin -->
            - Writing style — conversation: `full` · reports: `ultra` *(internal agent hand-offs)* · documents: `full`. Terse and plain-English by default. Set any of the three to `off`, `lite`, `full`, or `ultra` and your choice is kept when this section is regenerated; "normal mode" turns it off for one session.
            <!-- mochiko:output-style:end -->
            [- Path-scoped rules inject on **Read**, not Write (observed behavior, kinako dogfood 2026-07-19) — before creating a new file under [the actual scoped paths, e.g. `src/`, `tests/`], read the matching `.claude/rules/mochiko/` file or read back the file you created <!-- standing line: emit whenever the set includes any rules file -->]
            [- Operating docs (knowledge-management module): sessions in `.mochiko/brainstorms/` + `index.md`; rulings land in `DECISIONS.md`; open threads in `BACKLOG.md`; direction in `ROADMAP.md`; landing ritual + invariants at `.mochiko/memory/knowledge-management.md`; groom: `mochiko:grooming-operating-docs` <!-- GI-XXX -->]
            [- Release gates: [one-line summary] — detail in the ledger <!-- GI-XXX -->]
            <!-- mochiko:governance:end -->
            ```
          check: >-
            Is the CLAUDE.md governance region present between the begin/end markers with no
            setup-owned content outside them; a Ratified stamp line (version · date · production
            floor + declared depth · modules); a one-line-per-principle index that closes
            index->home->ledger both ways; universal principles as short RFC 2119 lines with floor
            principles first and marked (NON-NEGOTIABLE); technology-stack lines with actual
            mandated choices (no placeholders); a quality-gates summary with actual commands; a
            governance-operations block (ledger pointer + amend route); and the preserved
            carve-outs (mochiko:output-style pair, mochiko:domain-registry block) still carrying
            their pre-run values?
        - name: Shape 2 — a scope-bound rules file
          required: false
          contract: |
            One concern per file (`.claude/rules/mochiko/<concern>.md`). The `paths` globs must be honest to the concern — and honest cuts both
            ways: a glob that matches everything is a universal principle wearing a costume (those belong in
            the region), while globs that stop at the mechanism's home layer silently exempt code that can
            violate the concern. Cover **every path whose code can violate the rule** — including layers that
            orchestrate the governed operation through ports/interfaces, not just the layer that implements
            it (kinako dogfood 2026-07-19: storage invariants scoped to domain+infrastructure missed the
            application layer's use cases persisting through ports).

            ```markdown
            ---
            paths:
              - "[honest glob, e.g. src/api/**/*.py]"
              - "[second glob if the concern truly spans]"
            ---

            # [Concern name] <!-- GI-XXX -->

            - [Operative rule, RFC 2119]
            - [Operative rule]
            - [Operative rule]

            Metadata (enforcement · testability · rationale): `.mochiko/memory/governance-ledger.md`, GI-XXX.
            ```
          check: >-
            For every rules file that exists, do its `paths` globs cover every path whose code can
            violate the concern (per-layer violation test against the kept architecture card, not
            just the mechanism's home layer), is it one concern per file with RFC 2119 operative
            rules, and does it point to the ledger for metadata rather than restating it?
        - name: Shape 3 — the governance ledger
          required: true
          contract: |
            Read by setup/amend runs and the validator only — never force-loaded into working sessions.

            ```markdown
            # Governance Ledger

            **Governance Floor:** production (asserted) · **Depth level:** [low | high] (user-declared, one-way; `high` terminal) · **Modules:** [attached compliance modules with strata, or "none"] · **Trace:** GI-001 (fact profile) · GI-0XX (depth level)
            **Version:** [X.Y.Z] (must match the region stamp)

            ## Waivers

            Any asserted standard, with a recorded justification (D4); permanent pending the D4.1 revisit.
            **Legal-mandate module obligations are unwaivable (D4.2)** — a waiver row naming one is a
            validator FAIL.

            | Standard | Justification | Revisit trigger (optional) | Trace |
            |----------|---------------|----------------------------|-------|
            | [floor category / card / non-legal module obligation, or "None."] | [recorded reason] | [or "permanent (D4.1 pending)"] | GI-XXX |

            ## Amendment policy

            - Route: `/mochiko:setup` amend mode; fact-profile changes (module attach/detach), un-waives,
              and the depth-level flip (a `high`-mode rerun) are governance events — the declaration and any
              later flip are recorded as amendment-log rows, no new ledger structure.
            - Semver: MAJOR — principle removal / incompatible redefinition / floor-level change /
              depth-level flip (`low`→`high`) / module attach or detach · MINOR — new principle or waiver
              change · PATCH — clarification.
            - Approvers: [from the synthesis's team reality]

            ## Exception registry

            | Exception | Principle (GI-ID) | Granted | Expires/revisit |
            |-----------|-------------------|---------|-----------------|
            | [none yet] | | | |

            [## Domain-dependency policy (only when `layer-rules` is adopted)]
            [Qualification criteria (domain-relevance filters first, then ubiquity) · trust-signal
            hierarchy: `authoring-constitution/references/DOMAIN-DEPENDENCIES.md` · add-process + gate
            (human ruling before registry entry; `domain_deps_added` cycle-report disclosure — the
            checkpoint never auto-approves while it is non-empty). The list itself lives ONLY in the domain
            rules file's `mochiko:domain-registry` block — preserved across regenerations, no ledger copy.]

            ## Principles (Three-Part metadata, keyed by GI-ID)

            ### GI-XXX — [Principle Name] · home: [CLAUDE.md | rules/mochiko/<file>.md | skill:<name>]

            **Enforcement**:
            - [How compliance is verified — specific commands or processes]

            **Testability**:
            - Pass: [criterion] · Fail: [criterion]

            **Rationale**: [Failure mode prevented; success enabled.]

            **Trace**: GI-XXX (floor-asserted: CARD-ID | deck-kept: CARD-ID | minted | module: <module>-<obligation>)

            [## Evolution notes (brownfield — the evolution-notes module's ledger section)]
            [Floor status table · gap references · session confrontation rulings.]

            ## Amendment log

            | Version | Date | Change | GI delta |
            |---------|------|--------|----------|
            | [X.Y.Z] | [date] | ratified | [elements] |
            ```
          check: >-
            Is the ledger complete per Shape 3 — a Governance Floor header (production floor +
            declared depth + modules or none + fact-profile trace), Waivers (each with
            standard/justification/revisit-or-permanent/trace, none naming a legal-mandate
            obligation), Amendment policy, Exception registry, Three-Part records keyed by GI-ID
            each carrying Enforcement + Testability + Rationale + a real Trace stamp, and an
            amendment log whose version matches the region stamp?
        - name: Shape 4 — the trace summary manifest
          required: true
          contract: |
            Emitted by the producer with every authoring round; presented at the acceptance gate; the
            validator's grading surface. One row per principle-bearing GI element:

            ```markdown
            ## Trace summary

            | GI-ID | Principle | Source | Primary home | Companions present |
            |-------|-----------|--------|--------------|--------------------|
            | GI-003 | [name] | deck-kept: CARD-ID | CLAUDE.md region line | index ✓ · ledger ✓ |
            | GI-004 | [name] | minted | rules/mochiko/api.md | index ✓ · ledger ✓ |
            | GI-005 | [name] | floor-asserted: CARD-ID | skill:mochiko:executing-tdd-cycle | index ✓ · ledger ✓ |

            Flagged proposals: [none | list — each awaiting the user's ruling at acceptance]
            Waivers: [none | GI-IDs]
            ```
          check: >-
            Is the trace summary manifest present with one row per principle-bearing GI element
            (GI-ID · principle · source · primary home · companions present), plus the
            flagged-proposals and waivers lines?
        - name: Shape 5 — the output-style rules file
          required: false
          contract: |
            A Shape-2 file with fixed content (`.claude/rules/mochiko/output-style.md`), emitted every run rather than routed from a principle, scoped
            over the paths where pipeline deliverables are authored. It is **edit-time reinforcement, never
            the carrier**:

            - **For:** a producer *editing* an existing deliverable, which reads the file at touch time and
              writes in the right register.
            - **NOT for:** reaching file **creates**. `paths` rules inject on **Read, not Write** — the same
              observed behavior the region's standing new-file line records — so a file written from scratch
              never triggers this one. The always-loaded governance region is what reaches creates; this file
              is the second delivery, never the only one. (Anyone re-opening that question: it was ruled, not
              overlooked.)
            - **Create-or-join:** the `.claude/rules/mochiko/` scaffold is shared. Whichever concern lands
              first creates the directory and the region's index line; every later concern joins it, one file
              per concern.

            ```markdown
            ---
            paths:
              - ".mochiko/specs/**"
            ---

            # Writing style

            - Documents here are written `full` by default — dense, articles droppable, fragments fine. The
              **Writing style** line in `CLAUDE.md`'s Governance section is the authority whenever it differs.
            - Never compress: IDs, identifiers, paths, commands, contract clauses, numeric targets and error
              strings — verbatim.
            - Stop compressing wherever it would leave a requirement, criterion or constraint ambiguous. A
              human signs these off, so plain English beats terse every time the two pull apart.
            ```

            Preserved like the switch line: written once, refreshed only to track the region's Writing-style
            values, and any line the user adds to it survives every regeneration. Full rules ship with
            mochiko (the `output-style` template; deliverable envelope `artifact-format.md` rule 11) — this
            file cites them and never restates them.
          check: >-
            If an output-style rules file exists, is it a Shape-2 file scoped over the deliverable
            paths, marked edit-time reinforcement (not the carrier), preserved across
            regenerations with any user-added line surviving, and does it cite the shipped
            output-style rules rather than restating them?
      skeleton: |
        governance-surfaces is a SET of five distinct surfaces, not a single fill-in document. Author
        each surface to the canonical shape carried verbatim in its section above:
          1. CLAUDE.md governance region (Shape 1) — regenerated between the mochiko:governance markers.
          2. `.claude/rules/mochiko/<concern>.md` scope-bound rules files (Shape 2) — one concern each.
          3. `.mochiko/memory/governance-ledger.md` (Shape 3) — the full ledger.
          4. The trace summary manifest (Shape 4) — emitted each authoring round.
          5. `.claude/rules/mochiko/output-style.md` (Shape 5) — the preserved output-style rules file.
        The fillable block for each surface is the fenced markdown inside its section's contract.
  - op: import-document
    kind: template
    name: spec
    content:
      template: spec
      title: Feature Specification
      form: artifact-format.md
      register: full
      overview: |
        The feature specification deliverable (spec.md). Dense by construction, human-legible.
        Follows the deliverable envelope (artifact-format.md). Omit empty sections. Section density
        norms: Overview <= 3 lines; stories per authoring-user-stories (scenarios one line each, 2-3
        per story); FR/SC/edge-case entries one line each; entities conceptual and compact.
      sections:
        - name: Intent
          required: true
          density: one line per ruling
          contract: |
            The confirmed one-screen synthesis from the intent stage — elicited rulings, one line
            each, confirmed by the user before authoring began. Governs the authoring depth, the
            feature derivation, and the stress-test rigor. Omit a line only if the probe was
            genuinely not applicable. Lines: Scope boundary; Delivery (whole vs subset now, first
            shippable value, sequencing constraints); Depth / rigor; UX-bearing (yes -> Screens &
            Flows + prototype obligated; no -> the waiver line); Constraints; Out of scope.
          check: >-
            Is the Intent present with its six ruling lines (scope boundary, delivery,
            depth/rigor, UX-bearing, constraints, out of scope), each confirmed with the user, or
            a per-line not-applicable note?
        - name: Overview
          required: true
          density: <= 3 lines
          contract: |
            A compact synthesis of what the feature is. No more than three lines.
          check: Is the Overview present and <= 3 lines?
        - name: User Stories
          required: true
          contract: |
            An INDEX only. Story content lives in per-story files: stories/US-*.md — each carries the
            story text, its acceptance scenarios, and its FEAT-ID mapping. The only story-native
            status is `rejected` (the derivation filter's verdict, with the why, recorded in the story
            file); every other status is derived by following the story's FEAT-ID to the feature map.
            One row per story. Columns: ID (linked to stories/US-N.md), Story (one breath), Priority
            (P1/P2/P3), Feature (FEAT-XXX or —), Disposition (homed | rejected — why).
          check: >-
            Is the User Stories section an index (one linked row per story, no inline story
            bodies), with each row carrying priority, FEAT-ID (or —), and disposition, and every
            rejected row a one-line why?
        - name: Edge Cases
          required: true
          density: one line each
          contract: |
            The boundary and failure conditions the feature must handle — one line each.
          check: Are edge cases enumerated, one line each?
        - name: Functional Requirements
          required: true
          density: one line each
          contract: |
            Technology-agnostic functional requirements (FR-XXX), one line each, per
            authoring-requirements. RFC 2119 language.
          check: >-
            Are functional requirements present in FR-XXX form, one line each,
            technology-agnostic?
        - name: Key Entities
          required: true
          contract: |
            The feature's domain nouns — conceptual and compact, not an OpenAPI schema.
          check: Are key entities listed conceptually and compactly?
        - name: Success Criteria
          required: true
          density: one line each
          contract: |
            Measurable success criteria (SC-XXX), one line each, per authoring-requirements.
          check: Are success criteria present in SC-XXX form and measurable?
        - name: Screens & Flows
          required: true
          contract: |
            Authored per mochiko:authoring-prototype from the Intent section's UX-bearing ruling. Not
            UX-bearing -> the single line "No UX surface — prototype waived at intent." and nothing
            else. UX-bearing -> both tables + the prototype pointer, in full. The manifest is binding
            (screens, data, actions); the prototype's pixels are advisory. Feature column lands at
            derivation as a re-tag pass (FEAT-XXX per row); screens of unselected features greyed
            coming-soon; a filter-rejected story's screens kept, greyed, marked rejected.
          good: |
            UX-bearing form:

            | ID | Screen | Purpose | Data shown | Feature |
            |----|--------|---------|------------|---------|
            | SCR-001 | [name] | [one line] | [fields/collections rendered] | FEAT-001 |

            | ID | Flow | Steps | Story scenario | Feature |
            |----|------|-------|----------------|---------|
            | FLOW-001 | [name] | SCR-001 -> [action] -> SCR-002 | US-1 / [scenario] | FEAT-001 |

            **Prototype:** `prototype/` — clickable low-fi rendering of this manifest; serve with bun
            or open `prototype/index.html` directly. Flows and data are binding; layout and styling
            advisory.
          check: >-
            If the spec is UX-bearing, are both the SCR-XXX and FLOW-XXX tables present with a
            Feature column and the prototype pointer? If not UX-bearing, is the single waiver line
            present and nothing else?
        - name: Feature Selection
          required: true
          contract: |
            Authored per mochiko:authoring-feature-map after stories are drafted. Derivation output
            (proposed entries, deltas, index-line drafts) stages in this spec workspace; the live map
            is written only at spec acceptance, as one atomic batch. The selection itself is the
            user's ruling — the derived table and filter verdicts are the producer's, the Selected
            line records the user's choice. Three sub-parts: Derived features (table: FEAT-ID,
            Feature, New/delta, Stories, SCs verified); Filter rejections (one line per rejected story
            — the why verbatim from its story file; omit when none); Selection (Selected build-now in
            dependency order; Deferred proposed entries carrying their SCs + seam obligations;
            Deferred SCs — the ones covered only by unselected features, shown at the moment of
            choice, never discovered at close).
          check: >-
            Does Feature Selection carry the derived-features table, the filter rejections (or
            none), and a Selection recording the user's ruling with deferred features and deferred
            SCs surfaced?
        - name: Assumptions
          required: false
          contract: |
            Assumptions the specification rests on. Omit if empty.
          check: Are material assumptions recorded (or the section omitted when none)?
        - name: Open Questions
          required: false
          contract: |
            Unresolved questions carried out of authoring. Omit if empty.
          check: Are open questions recorded (or the section omitted when none)?
      skeleton: |
        # {{spec_title}}

        > Spec: {{spec_id}}
        > Created: {{created}}
        > Status: {{status}}

        ---

        ## Intent

        - **Scope boundary:** {{intent_scope}}
        - **Delivery:** {{intent_delivery}}
        - **Depth / rigor:** {{intent_depth}}
        - **UX-bearing:** {{intent_ux_bearing}}
        - **Constraints:** {{intent_constraints}}
        - **Out of scope:** {{intent_out_of_scope}}

        ---

        ## Overview

        {{overview}}

        ---

        ## User Stories

        | ID | Story (one breath) | Priority | Feature | Disposition |
        |----|--------------------|----------|---------|-------------|
        | [US-1](stories/US-1.md) | {{story_hook}} | P1 | FEAT-XXX | homed |
        | [US-2](stories/US-2.md) | {{story_hook}} | P2 | — | rejected — {{why, one line}} |

        ---

        ## Edge Cases

        {{edge_cases}}

        ---

        ## Functional Requirements

        {{functional_requirements}}

        ---

        ## Key Entities

        {{key_entities}}

        ---

        ## Success Criteria

        {{success_criteria}}

        ---

        ## Screens & Flows

        {{screens_and_flows}}

        ---

        ## Feature Selection

        ### Derived features

        | FEAT-ID | Feature | New / delta | Stories | SCs verified |
        |---------|---------|-------------|---------|--------------|
        | FEAT-XXX | [name] | new (`proposed`) | US-1, US-3 | SC-1, SC-2 |
        | FEAT-YYY | [name] | delta on delivered | US-2 | SC-3 |

        ### Filter rejections

        - US-4 — rejected: {{why, one line}}

        ### Selection

        - **Selected (build now, dependency order):** FEAT-XXX, FEAT-YYY
        - **Deferred (`proposed` on the map):** FEAT-ZZZ — carries SC-4, SC-5 and [seam obligations]
        - **Deferred SCs:** SC-4, SC-5 — wait until FEAT-ZZZ builds

        ---

        ## Assumptions

        {{assumptions}}

        ---

        ## Open Questions

        {{open_questions}}
  - op: import-document
    kind: template
    name: tasks
    content:
      template: tasks
      title: Implementation Cycles (cycle cards)
      form: artifact-format.md
      register: full
      overview: |
        This file is CYCLE CARDS, not a task list. Each card is a coherent bundle of named test cases
        (the card's content); the builder decomposes each card into concrete tasks at build time, with
        the code in view — the decomposition is disclosed in the cycle report, never pre-written here.
        Cite spec/design content by ID (US-#, FR-#, SC-#, C-#) — never re-quote it; each test case cites
        the ID(s) it covers. Structure and slicing judgment come from mochiko:patterns-vertical-tdd (the
        cycle-card shape). The card's checkbox is the progress surface, flipped when the cycle's named
        cases show green against real infrastructure.
      sections:
        - name: Header
          required: true
          contract: |
            Title "# Implementation Cycles: [FEAT-XXX — FEATURE NAME]" plus two generated-from
            pointers: (1) the spec folder and the design inputs the cards were authored from —
            spec.md, features/FEAT-XXX/sufficiency-report.md, and whichever of
            constraints-and-decisions.md, data-model.md, contracts/ and the signed store delta the
            design phase produced (on a zero-gap verdict no design phase ran, so the cards are
            authored from spec.md, the report, and the product baselines); (2) Structure:
            mochiko:patterns-vertical-tdd (cycle-card shape, slicing judgment).
          check: >-
            Is the header present with the FEAT-XXX title and both provenance pointers (source
            artifacts and the patterns-vertical-tdd structure note)?
        - name: Overview
          required: true
          contract: |
            Metric table (Metric | Value): Cycles = [N]; Stories covered = [US-# list — every P1/P2
            story on at least one card]. There is no foundation/feature split in the count.
          check: >-
            Does the Overview table report the cycle count and the covered US-# list, with every
            P1/P2 story on at least one card?
        - name: Cycle Format
          required: true
          contract: |
            Each card is one vertical increment: a coherent bundle of named test cases (expected behaviour,
            in the `**TEST:**` grammar — see patterns-vertical-tdd/references/TEST-GRAMMAR.md for the
            canonical Setup/Action/Assert/Capture grammar) that demonstrate together. The builder
            implements the card test-first (red/green/refactor per mochiko:executing-tdd-cycle,
            decomposition at build time), and the cycle is done when its named cases show green against
            real infrastructure. The card's checkbox is the progress surface, flipped when the bundle's
            cases pass. Where the work opens a new end-to-end path (greenfield / new path), the first
            cycle is a walking skeleton; growth on an already-standing path skips it. There is no
            foundation/feature card type — `[P]` parallel eligibility derives from a card's
            dependencies, not from a type column. Each named test case cites the spec/design ID(s) it
            covers.
          check: >-
            Does the Cycle Format explain the card as a bundle of named test cases, the test-first
            flow, cycle-done when named cases pass on real infrastructure, the
            checkbox-as-progress rule, the walking-skeleton first cycle where a new end-to-end
            path opens, no foundation/feature type with `[P]` derived from dependencies, and
            per-case ID citation?
        - name: Cycle Cards
          required: true
          contract: |
            Cards are listed directly, not grouped by foundation/feature type. Each card carries:
            checkbox + title; Stories (US-# — why these stories/cases form one demonstrable bundle,
            <= 2 lines); Depends on; Case (Simple | Split — why, one line | Merge — why, one line);
            Brownfield exposure (none | extends `path` | modifies `path` — cycle-level surfaces only);
            and the closing `**TEST:**` bundle — one or more named test cases, each opening with
            `**Covers**: <spec/design IDs>` (the acceptance-ID citation lives per-case, never a standalone
            Acceptance-criteria field) then Setup/Action/Assert/Capture fields per TEST-GRAMMAR.md.
            Where a new end-to-end path opens, the first card is a walking skeleton (thinnest path, one
            trivial case green). `[P]` marks parallel-eligible cards, derived from dependencies.
          good: |
            SAMPLE (illustration only — replace with actual cycles; DO NOT keep the samples in the generated tasks.md):

            ### - [ ] Cycle 1: Walking skeleton — [thinnest end-to-end path]
            - **Stories:** US-1 — thinnest end-to-end path through all layers, one trivial case green; establishes the production-shaped stack [<= 2 lines]
            - **Depends on:** —
            - **Case:** Simple
            - **Brownfield exposure:** none

            **TEST:** [entity] round-trips through the full stack
            - **Covers**: US-1 / SC-1
            - **Action**: `curl -X POST localhost:3000/api/[entity] -d '{"name":"Test"}'`
            - **Assert**: Response status: 201
            - **Assert**: Console contains "[entity]_id"
            - **Capture**: console

            ### - [ ] Cycle 2: [Feature bundle title] `[P]`
            - **Stories:** US-2 — [why these stories/cases form one demonstrable bundle, <= 2 lines]
            - **Depends on:** C1
            - **Case:** [Simple | Split — why | Merge — why]
            - **Brownfield exposure:** extends `src/models/[entity].py`

            **TEST:** [behavior] works end to end via API
            - **Covers**: US-2 / SC-2 scenario 1
            - **Setup**: Seed prerequisite [entity] data
            - **Action**: `curl -X POST localhost:3000/api/[endpoint] -d '{"[field]":"value"}'`
            - **Assert**: Response status: 200
            - **Assert**: Console contains "[expected field]"
            - **Capture**: console

            **TEST:** [behavior] rejects [invalid case]
            - **Covers**: US-2 / SC-2 scenario 2
            - **Setup**: Seed prerequisite [entity] data
            - **Action**: `curl -X POST localhost:3000/api/[endpoint] -d '{"[field]":"invalid"}'`
            - **Assert**: Response status: 400
            - **Capture**: console
          check: >-
            Are cards listed directly (no foundation/feature grouping), each a bundle of named
            `**TEST:**` cases with per-case `**Covers**:` IDs (never a standalone
            acceptance-criteria field), carrying Stories/Depends-on/Case/Brownfield-exposure; is
            the first cycle a walking skeleton where a new end-to-end path opens; is `[P]` used
            only where dependencies allow; and is no illustrative sample or pre-written task list
            / file path left in?
      skeleton: |
        # Implementation Cycles: [FEAT-XXX — FEATURE NAME]

        > Generated from the spec folder and the design inputs the cards were authored from: spec.md, features/FEAT-XXX/sufficiency-report.md, and whichever of constraints-and-decisions.md, data-model.md, contracts/ and the signed store delta the design phase produced
        > Structure: `mochiko:patterns-vertical-tdd` (cycle-card shape, slicing judgment)

        ## Overview

        | Metric | Value |
        |--------|-------|
        | Cycles | [N] |
        | Stories covered | [US-# list — every P1/P2 story on at least one card] |

        ## Cycle Format

        Each card is one vertical increment: a coherent bundle of **named test cases** (expected behaviour,
        in the `**TEST:**` grammar — see [`TEST-GRAMMAR.md`](../skills/patterns-vertical-tdd/references/TEST-GRAMMAR.md)
        for the canonical Setup/Action/Assert/Capture grammar) that demonstrate together. The builder
        implements the card test-first (red/green/refactor per `mochiko:executing-tdd-cycle`,
        decomposition at build time), and the cycle is done when its named cases show green against real
        infrastructure. **The card's checkbox is the progress surface**, flipped when the bundle's cases
        pass. Where the work opens a new end-to-end path (greenfield / new path), the **first cycle is a
        walking skeleton**; growth on an already-standing path skips it. There is no foundation/feature
        card type — `[P]` parallel eligibility derives from a card's dependencies, not from a type
        column. Each named test case cites the spec/design ID(s) it covers.

        ---

        ### - [ ] Cycle 1: Walking skeleton — [thinnest end-to-end path]

        - **Stories:** US-# — [thinnest end-to-end path through all layers; establishes the production-shaped stack, <= 2 lines]
        - **Depends on:** —
        - **Case:** Simple
        - **Brownfield exposure:** none

        **TEST:** [behavior] round-trips through the full stack
        - **Covers**: US-# / SC-#
        - **Action**: `[command]`
        - **Assert**: [expected]
        - **Capture**: console

        ---

        ### - [ ] Cycle N: [Feature bundle title] `[P]`

        - **Stories:** US-# — [why these stories/cases form one demonstrable bundle, <= 2 lines]
        - **Depends on:** [cycle refs]
        - **Case:** [Simple | Split | Merge]
        - **Brownfield exposure:** [none | extends `path` | modifies `path`]

        **TEST:** [behavior] works end to end via real infrastructure
        - **Covers**: US-# / SC-#
        - **Setup**: [preconditions]
        - **Action**: `[command]`
        - **Assert**: [expected]
        - **Capture**: console
  - op: import-document
    kind: shelf
    name: architecture-shelf-backend
    content:
      shelf: backend-service
      title: Backend / Service Shelf (SaaS / PLG)
      dealt_to: backend, service, fullstack (API side)
      status: seeded
      provenance: memory-asserted
      revisit: |
        Whole-shelf revisit condition: shelf content is re-reviewed when the desk skill's first live run
        completes, and thereafter whenever a desk visit finds a default argued against twice in one
        project (the arguing-twice signal means the default is stale or the segment moved). The store
        steward (the principal-architect seat) owns freshness — no calendar cadence, event-keyed only.
      spine_opinions:
        - id: SPINE-OP-1
          opinion: >-
            Modular monolith first; extract a service only when change-rate or scale pays for it.
          provenance: memory-asserted
        - id: SPINE-OP-2
          opinion: One Postgres, tenant-scoped, before polyglot storage.
          provenance: memory-asserted
        - id: SPINE-OP-3
          opinion: Background jobs via queue before an event bus.
          provenance: memory-asserted
      dimensions:
        - id: 1
          dimension: Identity & auth
          default: Managed IdP or framework auth; SSO a deferred-not-forgotten row
          provenance: memory-asserted
          floor_bound: FLOOR-SEC
        - id: 2
          dimension: Multi-tenancy
          default: Pooled, `tenant_id` + row-level scoping; silo only when compliance pays
          provenance: memory-asserted
        - id: 3
          dimension: Authorization
          default: RBAC per tenant, coarse roles first
          provenance: memory-asserted
        - id: 4
          dimension: Billing & entitlements
          default: >-
            Stripe-class provider; entitlements decoupled from billing events; self-serve
            trial→upgrade
          provenance: memory-asserted
        - id: 5
          dimension: Observability
          default: Structured logs + error tracking + traces from day one
          provenance: memory-asserted
          floor_bound: FLOOR-OBS
        - id: 6
          dimension: Product analytics
          default: Event taxonomy `{object}_{action}`; activation funnel instrumented (PLG core)
          provenance: memory-asserted
        - id: 7
          dimension: Feature flags & rollout
          default: Flags before branches for risky surfaces
          provenance: memory-asserted
        - id: 8
          dimension: Data lifecycle
          default: Migrations discipline · backups · PII classification · delete/export path
          provenance: memory-asserted
        - id: 9
          dimension: Background work
          default: Job queue + scheduler, idempotent jobs
          provenance: memory-asserted
        - id: 10
          dimension: API surface
          default: Internal vs public split; versioning + webhooks when public
          provenance: memory-asserted
        - id: 11
          dimension: Notifications
          default: Transactional email provider; in-app later
          provenance: memory-asserted
        - id: 12
          dimension: Deployment & environments
          default: PaaS-first, staging + prod, IaC when the team pays for it
          provenance: memory-asserted
        - id: 13
          dimension: Security baseline
          default: Secrets handling · rate limiting · audit log
          provenance: memory-asserted
          floor_bound: FLOOR-SEC
      gaps:
        - surface: frontend-web
          status: planned
        - surface: mobile
          status: planned
        - surface: desktop
          status: planned
