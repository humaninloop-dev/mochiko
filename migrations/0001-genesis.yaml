grammar: 1
id: 0001-genesis
sequence: 1
intent: >-
  Import the v0.103.0 schema corpus as the log's baseline, carrying the provenance sidecar's
  anchors on their rules.
anchor: 2026-09-03 cli-schema-delivery D2
hash: sha256:361cf5d61ee69a856dcb49c7014c305cd00595fa8eef9cdcaa87de2239ef39cd
changes:
  - op: import-document
    kind: command
    name: architecture
    content:
      kind: command
      command: architecture
      vars:
        producer_seat: principal-architect
        grader_seat: tech-lead
        explore_model: haiku
        store_dir: .mochiko/product/architecture
        store_schema: plugins/mochiko/schemas/architecture-store.yaml
        shelf_schema: plugins/mochiko/schemas/architecture-shelf-backend.yaml
      conditions:
        store_ruled_content:
          values: presence
          resolution: surface-presence
          note: 'absent covers both forms — no store, and scaffold-only (a spine.md holding just its Scope: header).'
        km_file:
          values: presence
          resolution: surface-presence
          note: .mochiko/memory/knowledge-management.md.
        seats:
          values: [single, multi]
          resolution: standing-trigger
          note: >-
            fires the moment the visit composes more than one seat, and re-fires on a seat added
            mid-visit.
      moments:
        visit-open: Store health surfaced from the derived index before the ask, every visit.
        close: The verdict against the visit's done condition, with store integrity intact.
      sections:
        - id: arch.sec.roles
          title: Roles & Responsibilities
          intent: The Delivery Manager's always-happens floor and the other seats' wiring.
          rules:
            - id: arch.staffing-latitude
              labels: [seats]
              class: must
              kind: latitude
              text: 'Beyond this schema''s `class: floor` rules — the sound-loop floor arch.sound-loop-floor among them — everything is your per-visit judgment: how you staff, sequence, and run the visit is yours to shape.'
            - id: arch.dm-health-first
              labels: [reporting, stewardship]
              class: floor
              kind: duty
              text: Surface health before the ask.
            - id: arch.dm-converge-goal
              labels: [scope-entry]
              class: floor
              kind: duty
              text: Converge every visit to a one-line goal and its done condition.
            - id: arch.dm-author-baseline
              labels: [scope-entry]
              class: floor
              kind: duty
              text: >-
                Author the baseline — greenfield elicits it; brownfield reconstructs and
                confirms it per arch.tools-brownfield-reconstruction — nothing absorbed is ever
                silently discarded.
              when: {store_ruled_content: absent}
            - id: arch.dm-shelf-walk
              labels: [evidence]
              class: floor
              kind: duty
              text: >-
                Walk shelf rows under the breadth invariant (arch.breadth-invariant), ordered by
                retrofit cost, dealt recommend-then-arbitrate (arch.recommend-then-arbitrate).
            - id: arch.dm-drift-dispatch
              labels: [evidence, user-gate, stewardship]
              class: floor
              kind: duty
              text: Dispatch the scoped drift probe and take each finding to a user disposition.
            - id: arch.dm-route-triggers
              labels: [reporting, user-gate, stewardship]
              class: floor
              kind: duty
              text: >-
                Route every fired upgrade trigger to /mochiko:feature's growth door — flagged in
                the health view until it is routed or the user rules it closed.
            - id: arch.dm-store-integrity-close
              labels: [landing, stewardship]
              class: floor
              kind: duty
              text: >-
                Keep store integrity intact at close — the derived index regenerated, orphans
                flagged, statuses agreeing across index and ledger.
            - id: arch.dm-km-landing
              labels: [landing, stewardship]
              class: floor
              kind: duty
              text: >-
                Execute the KM landing for desk-side writes, per
                .mochiko/memory/knowledge-management.md.
              when: {km_file: present}
            - id: arch.dm-close-verdict
              labels: [reporting, landing]
              class: floor
              kind: duty
              text: Close the visit with a verdict against its done condition.
            - id: arch.seat-architect-producer
              labels: [seats]
              class: must
              text: '${producer_seat} is the producing seat: baseline authoring, shelf-walk stance batches, amendments, and delta authoring. Recommends with reasons; never rules. Plans first and works only on a plan you approved.'
            - id: arch.seat-tech-lead-grader
              labels: [seats, independence]
              class: must
              text: >-
                ${grader_seat} is the independent grader of the architect's judgment writes,
                before the user's ratification. Status flips and orphan cleanup are transcription
                and ride the landing audit instead.
              anchor: 2026-08-19 product-architecture-schema D11
            - id: arch.seat-drift-probe-empirical
              labels: [seats, independence, evidence]
              class: must
              text: >-
                The drift-probe seat is an empirical read of the codebase grading the store's
                `As-built:` claims. Never the seat that wrote the claim; evidence, never memory.
        - id: arch.sec.reserved
          title: Reserved to the user — never the desk's
          intent: 'Decisions held by the user: gates, rulings, and escalations no seat may take.'
          rules:
            - id: arch.user-reserved-rulings
              labels: [user-gate]
              class: must
              kind: reservation
              text: 'Reserved to the user: every row stance, the baseline confirmation, every amendment, each drift finding''s disposition, the shelf-scope override, the capability mint at /mochiko:feature''s growth door (arch.dispatch-feature-growth-door), and the governance-ledger waiver a true floor drop needs.'
              anchor: 2026-08-19 product-architecture-schema
        - id: arch.sec.tools
          title: Tools
          intent: >-
            The store, its skills and schemas, the probes, and the dispatch targets the desk binds
            to.
          rules:
            - id: arch.tools-referenced-never-restated
              class: must
              extends: common.tools-referenced-never-restated
            - id: arch.tools-store
              labels: [binding]
              class: must
              kind: binding
              text: 'The store lives at ${store_dir}/: `spine.md` (the topology deep view — containers, boundaries, communication styles) and the `concerns.md` ledger of `AX-XXX` rows, a row graduating to its own file at ${store_dir}/concerns/AX-XXX-<slug>.md only when it carries real depth — extend beats mint. Repo-root `ARCHITECTURE.md` is the store''s derived index — spine thumbnail, AX summary table, health view — and is a rendered projection, never a second store.'
            - id: arch.tools-store-skill
              labels: [floor-pointer]
              class: must
              kind: binding
              text: 'mochiko:authoring-architecture-store is the store''s owner: AX and spine grammar, the element lifecycle (`ruled` → `in-flight (FEAT-XXX)` / `modifying (FEAT-XXX)` / `removing (FEAT-XXX)` → `built`), the stance vocabulary (`decided` · `not-now` · `n-a` · `open`), row graduation, the fold at landings, the health view, and the index regeneration.'
              pointer: mochiko:authoring-architecture-store
            - id: arch.tools-shelves-skill
              labels: [floor-pointer]
              class: must
              kind: binding
              text: 'mochiko:patterns-architecture-shelves is the opinion carrier: the per-surface shelves as data, their suggested defaults and upgrade-trigger patterns, and the recommend-then-arbitrate deal.'
              pointer: mochiko:patterns-architecture-shelves
            - id: arch.shelf-scope-source
              labels: [binding, user-gate]
              class: must
              kind: binding
              text: >-
                Shelf scope is read from the `Scope:` line in `spine.md`'s header — declared
                there by /mochiko:setup and overridable at the desk by an ordinary store write to
                that line, the user's ruling like any other. The store carries the scope; a
                full-stack or monorepo product composes the shelves its scope names.
            - id: arch.tools-system-design
              labels: [floor-pointer]
              class: must
              kind: binding
              text: >-
                mochiko:patterns-system-design carries altitude and diagram craft for the spine
                and for the deltas features draft against it.
              pointer: mochiko:patterns-system-design
            - id: arch.tools-store-schema
              labels: [binding]
              class: must
              kind: binding
              text: >-
                The store shape is ${store_schema}, the shelf data ${shelf_schema} (rendered by
                mochiko-cli, or Read raw when the binary is absent — the shipped schema is the
                first-class source of truth). A small required core; the schema constrains the
                skeleton, never the voice.
            - id: arch.tools-brownfield-reconstruction
              labels: [scope-entry, user-gate]
              class: must
              text: 'The first visit to an existing repo derives the store from what exists — repo `ARCHITECTURE.md` prose, any per-feature `architecture.md` files, `nfrs.md`, structural `D-XXX` rows — presents it for confirmation, then archives the absorbed sources to .mochiko/archive/product-baselines/<date>/. The derivation inherits the setup-bootstrap `Assumed` caveat and its partial-baseline poisoning risk: say so when you present it.'
              anchor: 2026-08-19 product-architecture-schema D16
            - id: arch.tools-drift-probe-scope
              labels: [evidence, user-gate, stewardship]
              class: must
              text: >-
                The scoped drift probe covers rows touched since the last desk visit plus a sample
                of the retrofit-expensive rows; never all rows every visit. Findings land in the
                touched row's `Drift:` field and take a user disposition at the desk.
            - id: arch.dispatch-feature-growth-door
              labels: [user-gate]
              class: must
              kind: routing
              text: '/mochiko:feature is the dispatch target for a fired upgrade trigger: it arrives at the growth door as a candidate under the capability-write test; extend-beats-mint applies and the user rules the mint — the architecture lens proposes, the map machinery disposes.'
              anchor: 2026-08-19 product-architecture-schema D13
            - id: arch.dispatch-setup-waiver
              labels: [user-gate]
              class: must
              kind: routing
              text: >-
                /mochiko:setup is the dispatch target for a governance-ledger waiver when a
                floor-asserted obligation must truly drop (arch.floor-precedence).
            - id: arch.dispatch-implement-delivery
              labels: [scope-entry]
              class: must
              kind: routing
              text: /mochiko:implement owns all delivery; the desk runs none of it.
              anchor: 2026-08-26 plan-stage-utility
            - id: arch.register
              labels: [reporting, binding]
              class: must
              kind: binding
              extends: common.register
        - id: arch.sec.ways-of-working
          title: Ways of Working
          intent: >-
            How the desk reports, references, separates authors from graders, arbitrates, and
            routes its dispatches.
          rules:
            - id: arch.proactive-report-first
              labels: [reporting, stewardship]
              class: must
              kind: duty
              text: Proactive report first — health before the ask, every visit.
            - id: arch.reference-never-restate
              labels: [floor-pointer]
              class: must
              text: >-
                Reference, never restate — the store grammar lives in
                mochiko:authoring-architecture-store, the opinions in the shelf data, the delivery
                bounds in the pipeline commands; the desk points at them and adds nothing.
            - id: arch.author-grader-separation
              labels: [independence]
              class: floor
              text: >-
                Author ≠ grader — wherever a seat produces (baseline, stance batch, amendment,
                delta), no output is cleared by its author; a producing seat plans first and works
                only on a plan you approved.
            - id: arch.recommend-then-arbitrate
              labels: [user-gate]
              class: must
              text: >-
                Recommend, then arbitrate — a shelf row is dealt with its suggested default and
                the reasoning behind it, and the user forms the stance. A default is never applied
                by silence.
              anchor: 2026-08-19 product-architecture-schema D5
            - id: arch.model-tiering
              labels: [seats, floor-pointer]
              class: must
              kind: routing
              text: 'Exploration and fact-finding dispatches ride the class-keyed tiering floor: locate/enumerate reads go to a native Explore subagent spawned model: ${explore_model}, interpretive or absence-driven reads stay session tier — the drift probe grades claims against code and is interpretive, so it stays session tier and sends only its locate/enumerate legs down. Every seat brief carries the routing rule. Class key, dispatch ladder, and brief obligation: mochiko:patterns-model-tiering, referenced never restated.'
              pointer: mochiko:patterns-model-tiering
              anchor: 2026-08-16 model-tiered-seats
            - id: arch.single-writer-store
              labels: [seats, stewardship]
              class: must
              text: >-
                Single writer on the store — one seat holds the pen per visit; the derived index
                is regenerated by the store skill mochiko:authoring-architecture-store on every
                store write, never hand-edited alongside it.
            - id: arch.no-git-mutations
              class: must
              extends: common.no-git-mutations
            - id: arch.rulings-plain-text
              class: must
              extends: common.acceptance-plain-text
        - id: arch.sec.boundaries
          title: Boundaries — the non-waivable floor
          intent: Floor obligations no seat and no in-visit ruling can waive.
          rules:
            - id: arch.truth-user-ruling
              labels: [user-gate]
              class: floor
              kind: reservation
              text: >-
                Architecture truth is the user's ruling. The desk elicits, recommends, and
                records; a stance, a baseline, or an amendment lands only on the user's word. A
                row left unruled stays `open` and shows in the health view — it never acquires a
                stance by default, by silence, or by the desk's own judgment.
              anchor: 2026-08-19 product-architecture-schema D5
            - id: arch.breadth-invariant
              labels: [evidence, floor-pointer]
              class: floor
              text: 'The breadth invariant: every shelf row in scope is walked. A row may close in two seconds — `n-a`, one line, done — but it is never silently skipped, and the walk order is by retrofit cost: tenancy, auth, and data partitioning before flags and experimentation. A shelf scope narrowed at the desk is the user''s explicit override, recorded as one.'
              pointer: mochiko:patterns-architecture-shelves
              anchor: 2026-08-19 product-architecture-schema D5
            - id: arch.floor-precedence
              labels: [user-gate]
              class: floor
              text: 'Where a governance floor card asserts the category, `n-a — genuinely never` is unavailable on that row: the legal moves are a stance within the obligation, `n-a — handled elsewhere` with its required pointer, or a narrowing. A true drop is a governance event and routes to a governance-ledger.md waiver through /mochiko:setup — never granted at the shelf. An arbitrated constitution card binds code-layer structure and a shelf row binds product topology; a genuine conflict between them is the user''s.'
              anchor: 2026-08-19 product-architecture-schema D14
            - id: arch.na-handled-elsewhere-pointer
              labels: [evidence]
              class: floor
              text: '`n-a — handled elsewhere` carries its pointer. The reason axis is not decoration: a concern another repo or system owns names that owner. Only genuinely never may stand without one.'
            - id: arch.derived-index-never-hand-maintained
              labels: [floor-pointer, landing, stewardship]
              class: floor
              text: >-
                The derived index is never hand-maintained. The store is the single source; the
                root `ARCHITECTURE.md` is regenerated from it by the store skill
                mochiko:authoring-architecture-store on every write. An index-vs-ledger
                disagreement is a defect fixed on sight, never reconciled by editing the index.
              pointer: mochiko:authoring-architecture-store
              anchor: 2026-08-19 product-architecture-schema
            - id: arch.drift-empirical
              labels: [evidence, independence, stewardship]
              class: floor
              text: >-
                Drift is empirical. An `As-built:` claim is graded against the code by a seat that
                reads it, never affirmed from memory or from the ruling that preceded it. An
                ungraded claim is reported as ungraded.
            - id: arch.no-depth-dial-coupling
              labels: [scope-entry]
              class: floor
              text: 'The desk never reads the governance low/high depth level: shelf scope and per-row stances are its only adaptiveness, and `not-now` is the per-dimension depth valve. The governance dial governs a floor row''s rigor; the desk governs its stance — two instruments, two axes.'
              anchor: 2026-08-19 product-architecture-schema D9
            - id: arch.no-delivery-harness
              labels: [scope-entry]
              class: floor
              text: >-
                No delivery harness at the desk. The desk rules architecture and routes work; it
                plans and builds none of it. Delivery leaves for /mochiko:feature or the pipeline,
                and the boundary is audited from the store delta the work leaves behind.
            - id: arch.no-silent-store-mutations
              labels: [evidence, stewardship]
              class: floor
              text: >-
                No silent store mutations. Every write is visible in the store and in the
                regenerated index; an integrity defect — an orphan element, a dead `Work:`
                pointer, a status disagreement — is fixed on sight and surfaced, never quietly
                corrected.
            - id: arch.sound-loop-floor
              labels: [floor-pointer, independence]
              class: floor
              text: 'A judgment-authored write to a governing surface obliges the loop: a seat produces on a plan you approved, an independent non-author seat reviews before the user''s gate — the user''s ruling alone never substitutes for the review leg — and every baseline, stance batch, and amendment takes that review leg. Status flips and orphan cleanup are transcription and ride the landing audit. Trigger test, exemptions, seat wiring, and disclosure: mochiko:patterns-sound-loop, referenced never restated.'
              pointer: mochiko:patterns-sound-loop
              anchor: 2026-08-13 charter-ritual-balance
            - id: arch.transport-floor
              class: floor
              when: {seats: multi}
              extends: common.transport-floor
        - id: arch.sec.fail-conditions
          title: Not done — default FAIL
          intent: 'The kind: fail set — any one standing fails the visit; the .md Not-done line hard-codes this set''s count.'
          rules:
            - id: arch.fail.no-verdict
              labels: [reporting]
              class: floor
              kind: fail
              text: A visit that ends with no stated done-condition verdict.
              enforces: [arch.dm-converge-goal, arch.dm-close-verdict]
  - op: import-document
    kind: command
    name: brainstorm
    content:
      kind: command
      command: brainstorm
      vars:
        record_path: .mochiko/brainstorms/<slug>/record.md
        index_path: .mochiko/brainstorms/index.md
        km_path: .mochiko/memory/knowledge-management.md
        explore_model: haiku
      conditions:
        km_file:
          values: presence
          resolution: surface-presence
          note: the knowledge-management file at ${km_path}.
        seats:
          values: [single, multi]
          resolution: standing-trigger
          note: >-
            fires the moment the run composes more than one seat, and re-fires on a seat added
            mid-run.
      moments:
        session-open: Where the index is read and the session is entered as open.
        cold-review: The blind two-message dispatch and the cold read of the frozen record.
        acceptance: The user's acceptance of the record.
        close: >-
          Where the index is updated with where the outcome landed and the KM close ritual runs.
      sections:
        - id: brainstorm.sec.roles
          title: Roles & Responsibilities — seat wiring
          intent: Lead role, seat staffing, and the review independence the session's seats carry.
          rules:
            - id: brainstorm.lead-inline-questioning
              labels: [seats]
              class: must
              kind: duty
              text: >-
                You are the lead. Plan the run and orchestrate it toward the run's goal; run the
                questioning yourself, inline, via mochiko:analysis-iterative — one question per
                turn, format adapted to the user's state.
              pointer: mochiko:analysis-iterative
            - id: brainstorm.staffing-latitude
              labels: [seats]
              class: must
              kind: latitude
              text: Teammates or subagents per seat is your call.
            - id: brainstorm.record-review-independence
              labels: [independence, seats]
              class: must
              text: >-
                The record at ${record_path} is yours, so its review seat is always someone else,
                reading the frozen record cold from the file.
            - id: brainstorm.blind-map-dispatch
              labels: [independence, seats]
              class: must
              text: >-
                A review seat is spawned in two messages — first the topic statement and goal
                line only, never ${record_path}, so it builds its Phase 0 angle map with no sight
                of what the session decided; its map returns before you send ${record_path} and
                the cold read begins. The anchoring fence is structural, not a trust ask.
              anchor: 2026-08-10 cold-review-gap-challenge D6
            - id: brainstorm.pair-maps-independent
              labels: [independence, seats]
              class: must
              text: In a review pair, both seats build their Phase 0 angle maps independently.
              anchor: 2026-08-10 cold-review-gap-challenge D5
        - id: brainstorm.sec.reserved
          title: Reserved to the user — never the run's
          intent: 'Decisions held by the user: acceptance, waivers, and the rulings no seat may take.'
          rules:
            - id: brainstorm.coverage-survivor-routing
              labels: [user-gate]
              class: must
              kind: routing
              text: 'A surviving coverage finding is a candidate that questions the topic itself, not a fold — present each gap as a candidate topic; the user rules the path: explore now (re-enter mochiko:analysis-iterative on that angle; the resulting decision lands in ${record_path}''s same `D…` namespace), rule inline, or defer.'
              anchor: 2026-08-10 cold-review-gap-challenge D3
            - id: brainstorm.user-record-acceptance
              labels: [user-gate]
              class: floor
              kind: gate
              text: Record acceptance is reserved to the user — their word, never yours.
            - id: brainstorm.user-survivor-challenge
              labels: [user-gate]
              class: must
              kind: reservation
              text: >-
                The disposition of any review survivor that challenges a user ruling is reserved
                to the user.
            - id: brainstorm.user-review-waiver
              labels: [user-gate]
              class: must
              kind: reservation
              text: The waiver, if the review is to be skipped, is reserved to the user.
            - id: brainstorm.user-pen-boundary
              labels: [user-gate]
              class: must
              kind: reservation
              text: >-
                Any amendment to a user-ruled decision, and any new decision, is reserved to the
                user — their word, never yours.
        - id: brainstorm.sec.tools
          title: Tools bindings
          intent: Paths, templates, and skills the session binds to.
          rules:
            - id: brainstorm.deliverable-record
              labels: [binding]
              class: must
              kind: binding
              text: >-
                The deliverable is ${record_path} — kebab-case `<slug>` derived at the start,
                decisions in one `D1…` namespace.
            - id: brainstorm.record-as-you-go
              labels: [evidence]
              class: must
              text: >-
                ${record_path} is written as the session progresses, never reconstructed at the
                end.
            - id: brainstorm.index-bookkeeping
              labels: [binding, landing]
              class: must
              text: 'Read ${index_path} before opening; enter the session on open (status: open); update at acceptance or supersession with where the outcome landed.'
            - id: brainstorm.km-close-ritual
              labels: [landing]
              class: must
              text: Run the close ritual of ${km_path}.
              when: {km_file: present}
            - id: brainstorm.synthesis-on-request
              labels: [binding]
              class: must
              kind: binding
              text: >-
                A synthesis is written on request only, after acceptance — beside
                ${record_path}, stamped *derived — record canonical*; under a review waiver,
                stamped *derived, unchecked*.
            - id: brainstorm.register
              labels: [binding, reporting]
              class: must
              kind: binding
              extends: common.register
            - id: brainstorm.next-step-offer
              labels: [landing, user-gate]
              class: must
              kind: routing
              text: >-
                Pipeline entry (e.g. /mochiko:specify when the record is honestly a feature
                description) is an offer after acceptance, never a default.
        - id: brainstorm.sec.ways-of-working
          title: Ways of Working
          intent: >-
            How the session questions, reviews cold, bounds its rounds, and reports; model routing
            for its seats.
          rules:
            - id: brainstorm.model-tiering
              class: must
              kind: routing
              extends: common.model-tiering
              anchor: 2026-08-16 model-tiered-seats
            - id: brainstorm.plan-approval-producers
              class: must
              extends: common.plan-approval-producers
            - id: brainstorm.author-grader-default-fail
              class: floor
              extends: common.author-grader-default-fail
            - id: brainstorm.non-coverage-survivors
              labels: [user-gate]
              class: must
              kind: routing
              text: >-
                Non-coverage survivors keep the ordinary fold / repair / ruling path and may be
                dispositioned in batches.
            - id: brainstorm.reopen-born-verify
              labels: [attempt-economy]
              class: must
              kind: bound
              text: >-
                A decision born from a coverage-survivor reopen gets one bounded verify round —
                internal consistency and record-fitness, no fresh cold read, no blind-map coverage
                hunt against it, and no second reopen off it.
              anchor: 2026-08-10 cold-review-gap-challenge D4
            - id: brainstorm.no-git-mutations
              class: must
              extends: common.no-git-mutations
            - id: brainstorm.acceptance-plain-text
              class: must
              extends: common.acceptance-plain-text
        - id: brainstorm.sec.boundaries
          title: Boundaries — the non-waivable floor
          intent: Floor obligations no seat and no in-run ruling can waive.
          rules:
            - id: brainstorm.transport-floor
              class: floor
              when: {seats: multi}
              extends: common.transport-floor
        - id: brainstorm.sec.fail-conditions
          title: Not done — default FAIL
          intent: 'The kind: fail set — any one standing fails the run; the .md Not-done line hard-codes this set''s count.'
          rules:
            - id: brainstorm.fail.record-unaccepted
              labels: [user-gate]
              class: floor
              kind: fail
              text: An unaccepted record.
              enforces: [brainstorm.user-record-acceptance]
              anchor: 2026-08-26 command-content-schema D10
            - id: brainstorm.fail.unreviewed-no-waiver
              labels: [independence]
              class: floor
              kind: fail
              text: An unreviewed record with no recorded waiver.
              enforces: [brainstorm.record-review-independence, brainstorm.user-review-waiver]
              anchor: 2026-08-26 command-content-schema D10
            - id: brainstorm.fail.survivor-undispositioned
              labels: [user-gate]
              class: floor
              kind: fail
              text: An undispositioned review survivor.
              enforces: [brainstorm.coverage-survivor-routing, brainstorm.non-coverage-survivors]
              anchor: 2026-08-26 command-content-schema D10
            - id: brainstorm.fail.index-mismatch
              labels: [landing]
              class: floor
              kind: fail
              text: An index entry in ${index_path} missing or contradicting the record's status.
              enforces: [brainstorm.index-bookkeeping]
              anchor: 2026-08-26 command-content-schema D10
      tombstones:
        - id: brainstorm.sec.harness
          disposition: >-
            superseded → rules redistributed across the D4 six-set
            (command-md-scaffold-standardization D3/D4/D5)
        - id: brainstorm.sec.bindings
          disposition: >-
            superseded → rules redistributed across the D4 six-set
            (command-md-scaffold-standardization D3/D4/D5)
  - op: import-document
    kind: command
    name: feature
    content:
      kind: command
      command: feature
      vars:
        architect_seat: principal-architect
        explore_model: haiku
        features_dir: .mochiko/features
        product_dir: .mochiko/product
        tasks_schema: plugins/mochiko/schemas/tasks.yaml
      conditions:
        km_file:
          values: presence
          resolution: surface-presence
          note: .mochiko/memory/knowledge-management.md.
        seats:
          values: [single, multi]
          resolution: standing-trigger
          note: >-
            fires the moment the visit composes more than one seat, and re-fires on a seat added
            mid-visit.
      moments:
        visit-open: Map health surfaced before the ask, every visit.
        close: The verdict against the visit's done condition, with map integrity intact.
      sections:
        - id: feat.sec.roles
          title: Roles & Responsibilities
          intent: >-
            Desk seat wiring — the Delivery Manager's always-happens floor and the other seats.
          rules:
            - id: feat.staffing-latitude
              labels: [seats]
              class: must
              kind: latitude
              text: >-
                The bare minimum that must always happen is carried as the Delivery Manager rules
                in feat.sec.roles; everything beyond it is your per-visit judgment — below the
                sound-loop floor (feat.sound-loop-floor), how you staff, sequence, and run the
                visit is yours to shape (the lead-owned-process-flexibility posture, applied to a
                standing desk).
              anchor: 2026-08-13 charter-ritual-balance
            - id: feat.dm-health-first
              labels: [reporting]
              class: must
              kind: duty
              text: Surface map health before the ask.
            - id: feat.dm-converge-goal
              labels: [scope-entry]
              class: must
              kind: duty
              text: Converge every visit to a one-line goal and its done condition.
            - id: feat.dm-map-integrity
              labels: [stewardship, landing]
              class: must
              kind: duty
              text: >-
                Keep map integrity intact at close — no dangling entries, no orphaned deltas,
                statuses agreeing.
            - id: feat.dm-route-honestly
              labels: [scope-entry, evidence]
              class: must
              kind: duty
              text: >-
                Route honestly by the capability-write test (feat.capability-write-test); keying a
                raw report to its surface is triage judgment, audited from the resulting map
                delta, never claimed mechanical.
            - id: feat.dm-complete-card
              labels: [scope-entry]
              class: must
              kind: duty
              text: Hand every dispatched run a complete card.
            - id: feat.dm-epic-stewardship
              labels: [stewardship, landing]
              class: must
              kind: duty
              text: >-
                Steward open epics across visits — mint (mint-once, overlap-guarded), membership
                change, status, and close.
            - id: feat.dm-km-landing
              labels: [landing]
              class: must
              kind: duty
              text: >-
                Execute the KM landing for desk-side writes, per
                .mochiko/memory/knowledge-management.md.
              when: {km_file: present}
            - id: feat.dm-close-verdict
              labels: [reporting, landing]
              class: must
              kind: duty
              text: Close the visit with a verdict against its done condition.
            - id: feat.pm-seat
              labels: [seats]
              class: must
              text: >-
                The PM seat owns the extend-vs-mint verdict, grooming proposals when the soft cap
                trips (merge lookalikes, retire dead entries), and the what-next line. It
                recommends with reasons; it never rules.
            - id: feat.architect-dormancy
              labels: [seats]
              class: must
              text: '${architect_seat} holds domain co-sign, dormant until the first cap-trip; no live duty on today''s maps. The seat is not idle elsewhere: its standing home is /mochiko:architecture, where it stewards the architecture store — the dormancy is this desk''s, not the seat''s.'
              anchor: 2026-08-19 product-architecture-schema
            - id: feat.dispatched-runs-own-delivery
              labels: [seats]
              class: must
              text: >-
                Dispatched runs own all delivery. /mochiko:implement owns its bounds, verification
                seats, and evidence rules; the desk runs none of it.
        - id: feat.sec.reserved
          title: Reserved to the user — never the desk's
          intent: 'Decisions held by the user: gates, rulings, and escalations no seat may take.'
          rules:
            - id: feat.user-reserved
              labels: [user-gate]
              class: must
              kind: reservation
              text: The user holds retire and merge rulings, route overrides, and every selection.
        - id: feat.sec.tools
          title: Tools
          intent: Map, product, and dispatch bindings the desk points at.
          rules:
            - id: feat.tools-referenced-never-restated
              class: must
              extends: common.tools-referenced-never-restated
            - id: feat.map-files
              labels: [binding, evidence]
              class: must
              kind: binding
              text: >-
                The map files are the repo-root FEATURES.md index and the per-capability entry
                files at ${features_dir}/FEAT-XXX-<slug>.md; per-capability run artifacts live at
                ${features_dir}/FEAT-XXX/. A map query is answered from the actual files in the
                territory asked about, never from memory of them.
            - id: feat.map-minimalism-binding
              labels: [floor-pointer]
              class: must
              kind: binding
              text: >-
                mochiko:patterns-map-minimalism owns the capability tests, extend-vs-mint, the
                soft cap and its grooming trigger, merge mechanics, and the `unrefined` stub mark.
              pointer: mochiko:patterns-map-minimalism
            - id: feat.feature-map-binding
              labels: [floor-pointer]
              class: must
              kind: binding
              text: >-
                mochiko:authoring-feature-map owns the entry shape, delta grammar, the
                lane-liveness invariant (its home), and the fold-at-landing rules.
              pointer: mochiko:authoring-feature-map
            - id: feat.epic-binding
              labels: [floor-pointer]
              class: must
              kind: binding
              text: >-
                mochiko:authoring-epic owns the epic's manifest + spine shape, the mint /
                membership-overlap guard, and close semantics; the desk stewards the epic (mint,
                membership change, status view, close) through it.
              pointer: mochiko:authoring-epic
            - id: feat.epic-dispatch
              labels: [scope-entry]
              class: must
              kind: routing
              text: >-
                A multi-feature epic dispatches to /mochiko:implement as one run over its members;
                delivery and its bounds stay the run's, never the desk's.
            - id: feat.capability-write-test
              labels: [scope-entry]
              class: must
              kind: routing
              text: 'The capability-write test is the routing instrument: does the work touch a capability (mint, merge, retire, capability-status) or only its work rows? Capabilities route out; rows the desk may cut.'
              anchor: 2026-08-13 pm-role-and-feature-derivation
            - id: feat.stable-ground-triage
              labels: [scope-entry]
              class: must
              kind: routing
              text: 'Stable-ground triage keys a report to its surface, then checks the ground from the files: a single owning capability `delivered` → the delta lane, card on the entry · a single owning capability `in-flight` → not lane work, the finding files to the owning run · no single owner → the product lane, single-flight.'
            - id: feat.delta-cards
              labels: [binding, scope-entry, evidence]
              class: must
              kind: binding
              text: 'One delta card per the tasks template''s card shape (rendered by `mochiko-cli template tasks`, or its schema ${tasks_schema} Read raw when the binary is absent — the shipped schema is the first-class source of truth): a bug''s acceptance is its reproduction-failing test, an improvement carries 1–3 acceptance criteria; plus the minimal enumerated baseline-delta.md in appliable before/after form when a product-baseline touch is known at intake. Each card — bug and improvement alike — takes the sound-loop review leg (feat.sound-loop-floor) before dispatch.'
            - id: feat.product-surface
              labels: [binding, reporting, landing]
              class: must
              kind: binding
              text: >-
                Product baselines live at ${product_dir}/ (data-model.md, contracts/,
                constraints-and-decisions.md, quickstart.md, and architecture/ — the
                architecture store, whose derived index is repo-root ARCHITECTURE.md);
                product-lane runs at ${product_dir}/lane-<slug>/. Across repeat runs, cards and
                reports append (dated); delta files overwrite only via the graded fold.
              anchor: 2026-08-19 product-architecture-schema
            - id: feat.architecture-intake
              labels: [scope-entry, user-gate]
              class: must
              kind: routing
              text: 'A fired upgrade trigger arrives at the desk from /mochiko:architecture as a candidate capability or work row and is routed like any other demand: the capability-write test (feat.capability-write-test) decides the door, extend-beats-mint applies, and the user rules the mint. No new door and no auto-mint — the architecture lens proposes, the map machinery disposes.'
              anchor: 2026-08-19 product-architecture-schema
            - id: feat.dispatch-scope-split
              labels: [scope-entry, landing]
              class: must
              kind: routing
              text: '/mochiko:implement is the dispatch target for a dispatched capability-batch that scales itself, in the scope its door sets: growth-door rows enter selection scope (the batch covers the cut rows; its landing folds them into the capability''s extent), a bug/improvement delta card stays delta scope (the desk-confirmed card is implement''s delta entry; its landing is the delta fold) — the same split /mochiko:implement names at its Entry.'
              anchor: 2026-08-26 plan-stage-utility
            - id: feat.dispatch-specify
              labels: [scope-entry]
              class: must
              kind: routing
              text: >-
                /mochiko:specify is the dispatch target for anything the capability-write test
                (feat.capability-write-test) routes out.
            - id: feat.km-relation
              labels: [binding, landing]
              class: must
              kind: binding
              text: >-
                Where .mochiko/memory/knowledge-management.md exists, BACKLOG.md is the defect
                queue and lane acceptance is a landing event; without it, lane runs accept direct
                requests — the stated degrade path, never silently assumed.
            - id: feat.register
              labels: [binding, reporting]
              class: must
              kind: binding
              extends: common.register
        - id: feat.sec.ways-of-working
          title: Ways of Working
          intent: How the desk reports, reviews, routes, and tiers its dispatches.
          rules:
            - id: feat.proactive-report
              labels: [reporting]
              class: must
              kind: duty
              text: Proactive report first — health before the ask, every visit.
            - id: feat.reference-never-restate
              labels: [floor-pointer]
              class: must
              text: >-
                Reference, never restate — the dispatched run's bounds, verification seats, and
                evidence rules live in /mochiko:implement and the skills it binds; the desk points
                at them and adds nothing.
            - id: feat.author-grader
              labels: [independence, seats]
              class: must
              text: >-
                Wherever a seat produces (delta card, baseline-delta.md, grooming proposal), no
                output is cleared by its author; a producing seat plans first and works only on a
                plan you approved.
            - id: feat.advisory-front-door
              labels: [scope-entry]
              class: must
              kind: routing
              text: >-
                /mochiko:specify stays directly invocable; the desk is the default entry when the
                user is unsure and the only door for growth, bug, and improvement intake. It is a
                routing service you can always use, never a gate you must pass.
            - id: feat.model-tiering
              class: must
              kind: routing
              extends: common.model-tiering
              anchor: 2026-08-16 model-tiered-seats
            - id: feat.single-flight-lane
              labels: [scope-entry]
              class: must
              text: 'The product lane is single-flight: one live product-lane run at a time.'
            - id: feat.no-git-mutations
              class: must
              extends: common.no-git-mutations
            - id: feat.rulings-plain-text
              class: must
              extends: common.acceptance-plain-text
        - id: feat.sec.boundaries
          title: Boundaries — the non-waivable floor
          intent: Floor obligations no visit and no seat can waive.
          rules:
            - id: feat.capability-writes-sacred
              labels: [user-gate, scope-entry, stewardship]
              class: floor
              kind: reservation
              text: 'Capability writes are sacred: minting, merging, retiring, or changing a capability''s status happens only through /mochiko:specify or a user grooming ruling — never at the desk.'
              anchor: 2026-08-13 pm-role-and-feature-derivation
            - id: feat.grooming-door-ceiling
              labels: [user-gate, stewardship]
              class: floor
              kind: routing
              text: >-
                The grooming-ruling door covers merge, retire, status change, and extent-tidying
                of existing entries; wholesale or from-scratch re-derivation is specify's
                derivation work — route to /mochiko:specify.
              anchor: 2026-08-13 charter-ritual-balance
            - id: feat.out-of-remit-hosting
              labels: [user-gate]
              class: floor
              text: 'When the user explicitly asks the desk to host work outside the grooming-ruling door''s remit (feat.grooming-door-ceiling), name the boundary crossing and serve with the home command''s rituals imported — the door moves, the ritual never drops (adaptation rule: mochiko:patterns-sound-loop).'
              pointer: mochiko:patterns-sound-loop
              anchor: 2026-08-13 charter-ritual-balance
            - id: feat.growth-door
              labels: [scope-entry]
              class: floor
              kind: routing
              text: 'Work rows are delivery bookkeeping the desk may cut through the growth door: an extend verdict only, with acceptance criteria on the card. A fired architecture upgrade trigger enters by this same door and takes the same tests (feat.architecture-intake, feat.capability-write-test).'
              anchor: 2026-08-13 pm-role-and-feature-derivation
            - id: feat.growth-routes-to-specify
              labels: [scope-entry]
              class: floor
              kind: routing
              text: >-
                Mint-or-uncertain routes to /mochiko:specify; several rows, a new UX surface, or
                cross-capability reach routes to specify regardless.
            - id: feat.lane-never-widens
              labels: [scope-entry]
              class: floor
              text: >-
                The lane never widens in place — a mid-run outgrowth aborts and re-routes, and a
                report that lands on an `in-flight` capability's territory files to that run
                instead.
            - id: feat.no-delivery-harness
              labels: [scope-entry, evidence]
              class: floor
              text: >-
                No delivery harness at the desk — dispatch only. Every admitted demand leaves as
                a /mochiko:implement capability-batch — growth-door rows in selection scope, a
                bug/improvement delta card in delta scope; the run owns the delivery, and the
                boundary is audited from the map delta the work leaves behind.
              anchor: 2026-08-26 plan-stage-utility
            - id: feat.no-self-graded-writes
              labels: [independence]
              class: floor
              text: No self-graded writes.
            - id: feat.no-silent-map-mutations
              labels: [stewardship, evidence]
              class: floor
              text: >-
                No silent map mutations — an integrity defect is fixed on sight, and every write
                is visible on the map.
            - id: feat.sound-loop-floor
              labels: [floor-pointer, independence]
              class: floor
              text: 'A judgment-authored write to a governing surface obliges the loop: a seat produces on a plan you approved, an independent non-author seat reviews before the user''s gate — the user''s ruling alone never substitutes for the review leg — and every desk delta card, bug and improvement alike, takes that review leg before dispatch. Trigger test, exemptions, seat wiring, and disclosure: mochiko:patterns-sound-loop, referenced never restated.'
              pointer: mochiko:patterns-sound-loop
              anchor: 2026-08-13 charter-ritual-balance
            - id: feat.transport-floor
              class: floor
              when: {seats: multi}
              extends: common.transport-floor
            - id: feat.stub-parking
              labels: [scope-entry, stewardship]
              class: floor
              text: 'Stub parking is parking, not a spec-bypass: a parked capability hypothesis is a name plus a one-breath hook, marked `unrefined`; it earns selectability only through /mochiko:specify''s derivation, never at the desk.'
              anchor: 2026-08-13 pm-role-and-feature-derivation
        - id: feat.sec.fail-conditions
          title: Not done — default FAIL
          intent: 'The kind: fail set — any one standing fails the visit; the .md Not-done line hard-codes this set''s count.'
          rules:
            - id: feat.fail.no-verdict
              labels: [reporting]
              class: floor
              kind: fail
              text: A visit ended with no stated done-condition verdict.
              enforces: [feat.dm-converge-goal, feat.dm-close-verdict]
              anchor: 2026-08-13 pm-role-and-feature-derivation
  - op: import-document
    kind: command
    name: implement
    content:
      kind: command
      command: implement
      vars:
        attempt_bound_cycle: '3'
        gap_rework_bound: '2'
        builder_seat: staff-engineer
        design_seat: technical-analyst
        architect_seat: principal-architect
        qa_seat: qa-engineer
        gap_finder_seat: devils-advocate
        explore_model: haiku
        features_dir: .mochiko/features
        product_dir: .mochiko/product
        epics_dir: .mochiko/epics
        rules_dir: .claude/rules/mochiko
        tasks_schema: plugins/mochiko/schemas/tasks.yaml
      conditions:
        scope:
          values: [selection, delta, epic, lane]
          resolution: entry-derived
          note: the batch's scope type, fixed at the run-open confirmation.
        depth:
          values: [low, high]
          resolution: entry-derived
          note: the governance depth level, read from the governance region at entry.
        km_file:
          values: presence
          resolution: surface-presence
          note: .mochiko/memory/knowledge-management.md.
        governance_region:
          values: presence
          resolution: surface-presence
          note: the marked governance region in CLAUDE.md.
        baseline:
          values: presence
          resolution: surface-presence
          note: the product baseline a design gap targets; checked at the entry sufficiency check.
        seats:
          values: [single, multi]
          resolution: standing-trigger
          note: >-
            fires the moment the run composes more than one seat, and re-fires on a seat added
            mid-run.
      moments:
        run-open: >-
          The confirmation that closes entry — batch, scope type, attempt bounds, done
          condition.
        entry: The gating and the sufficiency check, before the run-open confirmation.
        design-checkpoint: The user's sign-off on the design phase's output and the store delta.
        card-confirm: The user's ruling on the cycle slicing, before any card is built.
        cycle-checkpoint: >-
          The per-cycle grading point where escalations and findings land as one batch.
        final-validation: >-
          The whole-build verification pass — regression sweep, cold verification, gap finding.
        landing: The acceptance-time execution of folds, graduations, and the store landing.
        acceptance: The user's accept / amend / reject that closes the run.
      sections:
        - id: impl.sec.roles
          title: Roles & Responsibilities — seat wiring
          intent: Seat staffing, independence, and authorship separation across the run's seats.
          rules:
            - id: impl.staffing-latitude
              labels: [seats]
              class: must
              kind: latitude
              text: 'Beyond this schema''s `class: floor` rules, everything is your per-run judgment: how you staff, sequence, and run the cycles; teammates or subagents per seat is your call.'
            - id: impl.dm-entry-gate
              labels: [scope-entry]
              class: must
              kind: duty
              text: 'Gate entry honestly: the run gates on a capability entry with selected work rows carrying ratified scope, and opens with its contract stated at the run-open confirmation.'
            - id: impl.design-phase-fires-on-gap
              labels: [scope-entry]
              class: must
              kind: duty
              text: >-
                Fire the design phase on any gap the sufficiency check names — before any code
                is written.
              anchor: 2026-08-26 plan-stage-utility
            - id: impl.dm-surface-rounds
              labels: [reporting, attempt-economy]
              class: must
              kind: duty
              text: Surface rounds consumed and seats spawned at each checkpoint.
            - id: impl.dm-landing-whole
              labels: [landing]
              class: must
              kind: duty
              text: Execute the acceptance landing whole at user acceptance.
            - id: impl.dm-close-verdict
              labels: [reporting, landing]
              class: must
              kind: duty
              text: Close the run with a verdict against the done condition.
            - id: impl.seat-sufficiency-independence
              labels: [independence, seats]
              class: must
              text: >-
                The sufficiency seat authored none of the spec, store, or baselines it grades, and
                will not design or build this batch. Exempt from plan approval, like every grading
                seat.
            - id: impl.design-seats-staffing
              labels: [seats]
              class: advisory
              kind: latitude
              text: 'Design-seat staffing is your call: typically ${design_seat} for design deltas, ${architect_seat} for a store delta, ${qa_seat} for the **TEST:** cases.'
            - id: impl.design-gaps-only
              labels: [independence, scope-entry]
              class: must
              text: >-
                Design seats author exactly the named gaps, nothing more, each on a plan you
                approved — rung-justified per the pointer skill.
              pointer: mochiko:patterns-plan-minimalism
            - id: impl.builder-never-designs
              labels: [independence, seats]
              class: must
              text: ${builder_seat} stays the builder and never designs its own gaps.
            - id: impl.seat-card-author-independence
              labels: [independence, seats]
              class: must
              text: >-
                The card-authoring seat is a design-class seat, never the builder who will execute
                the cards; ${qa_seat} authors the **TEST:** cases within its slicing.
            - id: impl.builder-decompose-disclose
              labels: [seats, evidence]
              class: must
              text: >-
                Builders decompose each card into concrete tasks at build time, disclosed in the
                cycle report, and build test-first — on a plan you approved.
            - id: impl.seat-verification-independence
              labels: [independence, seats]
              class: must
              text: 'Verification seats are never the implementer. They execute against real infrastructure and read the code and its evidence: per-cycle grading, the final validation, the code-minimalism lens.'
            - id: impl.verification-design-time-grades
              labels: [independence, seats]
              class: must
              text: 'The same verification-seat independence covers this run''s design-time grades: the cycle-card review before the card confirm (its grade covering buildability) and the judgment content of any build-time baseline-delta.md entry.'
            - id: impl.landing-verifier-folds
              labels: [independence, landing]
              class: must
              text: >-
                The landing verification seat checks the graded folds; a lane run adds the
                map-delta boundary check — the accepted work made no map write beyond the marked
                delta.
            - id: impl.seat-gap-finder-blind
              labels: [independence, seats]
              class: must
              text: 'The gap-finding seat is a fresh ${gap_finder_seat}, dispatched blind: never a seat that built these cycles or saw this feature''s design-time test cases.'
        - id: impl.sec.reserved
          title: Reserved to the user — never the run's
          intent: 'Decisions held by the user: gates, rulings, and escalations no seat may take.'
          rules:
            - id: impl.gate-design-checkpoint
              labels: [user-gate, landing]
              class: floor
              kind: gate
              text: 'The design checkpoint is the user''s. Where the check named gaps, no code is written before the user signs the design and the store delta — the store delta signed on a rendered diagram plus its named AX-XXX row changes (no render surface: present the source plus the changed-element table, and record it). The user may stop at the checkpoint and resume the build later.'
              anchor: 2026-08-26 plan-stage-utility
            - id: impl.gate-card-confirm
              labels: [user-gate]
              class: floor
              kind: gate
              text: 'The card confirm is the user''s: a blocking checkpoint where the user rules the slicing before build.'
              anchor: 2026-08-26 plan-stage-utility
            - id: impl.gate-final-acceptance
              labels: [user-gate]
              class: floor
              kind: gate
              text: 'Final acceptance is the user''s: accept / amend / reject closes the run.'
              anchor: 2026-08-13 charter-plan-implement
            - id: impl.user-runopen-rulings
              labels: [user-gate, scope-entry]
              class: must
              kind: reservation
              text: 'Reserved to the user at run-open: each store trip (ruled there, or deferred on the record) · each in-flight conflict · any sufficiency clause the grader could not clear.'
            - id: impl.infeasible-card-escalation
              labels: [user-gate]
              class: must
              kind: routing
              text: >-
                An infeasible card is escalated to the user as a business-level scope decision.
            - id: impl.adopt-first-user-call
              labels: [user-gate]
              class: must
              kind: reservation
              text: 'Two calls are never the builder''s: a commodity-category adopt-first ruling and an IP-XXX provisioning call each halt the cycle to the user''s checkpoint.'
              pointer: mochiko:patterns-adopt-first
            - id: impl.ambiguity-escalation
              labels: [user-gate]
              class: must
              kind: routing
              text: >-
                Requirement ambiguity, or a judgment call a producer flags, goes to the user —
                investigable gaps excepted.
            - id: impl.scope-escalation-fail
              labels: [user-gate]
              class: must
              kind: reservation
              text: 'Scope escalation is the user''s: work bigger than the run was framed stays FAIL unless the user accepts it.'
        - id: impl.sec.tools
          title: Tools bindings
          intent: Paths, schemas, skills, and templates the run binds to.
          rules:
            - id: impl.tools-referenced-never-restated
              class: must
              extends: common.tools-referenced-never-restated
            - id: impl.sufficiency-binding-verdict
              labels: [scope-entry]
              class: must
              kind: gate
              text: 'The sufficiency check runs at entry — per row, per card under delta scope. The verdict is binding: per row, sufficient or a gap list; gaps fire the design phase over exactly those gaps and nothing else. The pointer skill owns the clause set, the gap forms, the absent-baseline branch, and the trip-vs-gap distinction.'
              pointer: mochiko:review-sufficiency
              anchor: 2026-08-26 plan-stage-utility
            - id: impl.sufficiency-disputed-clause
              labels: [user-gate]
              class: must
              kind: routing
              text: >-
                A disputed sufficiency clause defaults to gap and goes to the user — the grader
                never clears alone.
            - id: impl.sufficiency-report
              labels: [evidence, reporting]
              class: must
              kind: binding
              text: 'The verdict lands as sufficiency-report.md in the feature dir: the store-consult result and any no-delta claim, the trips for the user at run-open, the quickstart.md null path where no real external-integration surface exists, and any [MODIFY] amendment named against a delivered feature.'
            - id: impl.absent-surfaces
              labels: [scope-entry]
              class: must
              kind: routing
              text: 'Absent surfaces are surfaced to the user, never auto-resolved, and never fail the run: a missing governance region is surfaced. A missing or stale .mochiko/memory/codebase-analysis.md on brownfield: offer /mochiko:setup, or proceed greenfield with the warning logged. A store with no ruled content: offer the /mochiko:architecture bootstrap. The check still runs, grading absent surfaces per its absent-baseline branch.'
            - id: impl.briefs-name-rules-files
              labels: [scope-entry, seats]
              class: must
              text: >-
                Every code-touching brief names the relevant ${rules_dir}/ files as an obligated
                read.
              when: {governance_region: present}
            - id: impl.design-outputs-home
              labels: [landing]
              class: must
              kind: binding
              text: >-
                Design outputs land at ${features_dir}/FEAT-XXX/ as deltas beside their baselines
                (data-model.md, contracts/; a prose baseline's delta in appliable before/after
                form), plus the store delta where the structural trigger fired — structure and
                scope per mochiko:patterns-system-design, grammar and lifecycle per
                mochiko:authoring-architecture-store.
            - id: impl.design-review-pair
              labels: [independence, floor-pointer]
              class: must
              text: >-
                A non-author seat grades the design-phase output before the design checkpoint —
                mochiko:review-plan-artifacts for conformance to the gap list and card quality
                (blocking), mochiko:review-feasibility for buildability and contradiction.
            - id: impl.design-absent-baseline-seed
              labels: [scope-entry]
              class: must
              text: >-
                The phase's first duty is the seed — an empty scaffold stating so where no code
                is delivered; reconstructed from delivered code, and confirmed with the user at
                the checkpoint, where it exists. The seed is the baseline write; this feature's
                design still lands as deltas, never merged into the seed.
              when: {baseline: absent}
            - id: impl.design-map-assertion
              labels: [landing]
              class: must
              text: >-
                The design phase asserts the design-implied dependencies and sharpened extent onto
                the capability's entry with provenance, and fills the architecture link when a
                store delta exists; status stays as the scope source set it; intended-vs-designed
                drift goes to the checkpoint. Where the check named a [MODIFY] amendment, the
                phase writes that marked delta on the affected delivered feature's entry.
              pointer: mochiko:authoring-feature-map
            - id: impl.midrun-refire
              labels: [scope-entry]
              class: must
              kind: routing
              text: >-
                A builder hitting undesigned structure halts that cycle; the design phase re-fires
                scoped to the discovery — same grade, same checkpoint. The deviation gate
                anchors to the signed delta once one exists.
              anchor: 2026-08-26 plan-stage-utility
            - id: impl.epic-design-always-fires
              labels: [scope-entry, seats]
              class: must
              text: 'The design phase always fires, for the joint spine at ${epics_dir}/EPIC-XXX/: the joint design plan, the joint architecture and seam design, and batch ordering. Spine artifacts follow templates/artifact-format.md.'
              when: {scope: [epic]}
              pointer: mochiko:authoring-epic
            - id: impl.epic-seam-owners
              labels: [seats]
              class: must
              text: >-
                Every cross-member seam owner is named at design time — no later-lander default.
              when: {scope: [epic]}
            - id: impl.epic-shared-baseline-single-pen
              labels: [seats, landing]
              class: must
              text: >-
                A shared-baseline delta is authored once, under a single pen-holder; every
                shared-write surface rides the transport floor.
              when: {scope: [epic]}
            - id: impl.cards-template
              labels: [floor-pointer]
              class: must
              kind: binding
              text: >-
                tasks.md holds cycle cards from the tasks template — rendered by mochiko-cli
                template tasks; when the binary is absent, its schema ${tasks_schema} Read raw is
                the first-class source of truth. The pointer skill owns the slicing judgment and
                the **TEST:** grammar.
              pointer: mochiko:patterns-vertical-tdd
            - id: impl.card-contents
              labels: [evidence]
              class: must
              kind: binding
              text: 'Per card: stories and feature rationale, dependencies, acceptance criteria by ID, a **TEST:** real-infrastructure gate, and the cycle''s brownfield exposure — no task lists, no file paths; the builder decomposes at build time. A UX-bearing card''s **TEST:** gate names the FLOW-XXX paths it verifies.'
            - id: impl.zero-gap-map-assertion
              labels: [landing]
              class: must
              text: >-
                On the zero-gap path the card-authoring seat makes the map-entry assertion the
                design phase would have made, surfacing drift at the confirm.
            - id: impl.card-review-before-confirm
              labels: [independence]
              class: must
              text: >-
                The verification seat reviews the cards before the card confirm — quality per
                mochiko:review-plan-artifacts, buildability its own judgment.
            - id: impl.epic-card-sequence
              labels: [seats]
              class: must
              text: >-
                The run builds one merged sequential card sequence from the joint design —
                shared foundation cycles first, then in-epic dependency order — with
                feature-tagged cards whose reports land in each member's
                ${features_dir}/FEAT-XXX/.
              when: {scope: [epic]}
            - id: impl.craft-build-bindings
              labels: [floor-pointer]
              class: must
              kind: binding
              text: >-
                Build binds mochiko:executing-tdd-cycle — its cycle-report.md (disclosed
                decomposition, honest difficulties, deviations, domain_deps_added) is the run's
                uncertainty carrier · mochiko:brownfield-integration on touches to existing code
                · mochiko:patterns-code-minimalism at decomposition, rungs disclosed.
            - id: impl.craft-verify-bindings
              labels: [floor-pointer, evidence]
              class: must
              kind: binding
              text: 'Verify binds mochiko:testing-end-user — evidence captured, never assumed — plus the per-cycle lens mochiko:review-code-minimalism: the verification seat reads the diff, the cycle report, and the codebase around the diff; reuse claims never on trust.'
            - id: impl.design-inputs
              labels: [scope-entry]
              class: must
              kind: binding
              text: >-
                Design inputs are sufficiency-report.md and the design-phase deltas where they
                exist — including the signed store delta, the anchor for the deviation check and
                the built-vs-signed diff — at ${features_dir}/FEAT-XXX/; the product baselines
                at ${product_dir}/ (data-model.md, contracts/, constraints-and-decisions.md, and
                the architecture store, whose concern rows carry the NFR-XXX targets the built
                code must meet); spec.md for the cards' cited acceptance criteria.
            - id: impl.progress-surface
              labels: [evidence, reporting]
              class: must
              kind: binding
              text: >-
                tasks.md's per-card checkboxes are the progress surface, flipped as cycles
                complete.
            - id: impl.reports-envelope
              labels: [reporting]
              class: must
              kind: binding
              text: 'All reports land in ${features_dir}/FEAT-XXX/ (a product-lane run: ${product_dir}/lane-<slug>/): the sufficiency report, cycle reports, verification reports, the final-validation report, the built-vs-signed diff. Every one follows templates/report-format.md (machine-first frontmatter, ultra register, clean = frontmatter-only; bounce an envelope-breaking report per its rule 9), and each producing seat''s brief names the envelope path. Repeat runs append, dated; delta files overwrite only via the graded fold.'
            - id: impl.gates-full-suite
              labels: [evidence]
              class: must
              text: Quality gates run the full repository suite.
            - id: impl.regression-sweep
              labels: [evidence, landing]
              class: must
              text: >-
                The final validation additionally runs the accumulated **TEST:** gates of
                previously delivered features in this feature's territory — their durable gate
                sets at ${features_dir}/FEAT-XXX/gates.md plus the cases on their cards — and
                this feature's gates exercise any seam whose earlier side is already delivered
                (seam ownership sits with the later-landing feature,
                mochiko:authoring-feature-map). An epic runs the accumulated gates once, over the
                union of member territories. A failure here fails the run like any other
                regression.
            - id: impl.cold-verification
              labels: [evidence]
              class: must
              text: >-
                The final validation builds and runs the quality gates from a dependency-cold
                snapshot of the uncommitted working state (`git ls-files -co --exclude-standard
                :!.claude/worktrees` copied to `.claude/worktrees/mochiko-<purpose>/`); ensure the
                `/.claude/worktrees` ignore entry exists first. Results are part of the acceptance
                evidence. One snapshot covers a whole epic.
            - id: impl.gap-finding-scope
              labels: [scope-entry, evidence]
              class: must
              text: 'The gap-finding pass runs on selection-scope and epic runs only (an epic: once, over the union of member territories); a delta-scope or lane run skips it, and its final-validation report states the skip — never a silent no-op.'
              anchor: 2026-08-19 qa-gap-finding-verification
            - id: impl.gap-finding-blind-dispatch
              labels: [independence]
              class: must
              text: >-
                Gap-finding dispatch is two-message and blind. The first message carries only
                spec.md, the sufficiency report and design deltas where they exist, Screens &
                Flows, and the baselines data-model.md, contracts/, and the store's NFR-XXX
                concern rows — never the code, tasks.md, the **TEST:** cases, or any report. The
                seat states its derived expectations; only then does probing begin. Its brief
                carries the model-tiering rule, and its delegated reads stay inside the same
                fence.
              pointer: mochiko:testing-gap-finding
              anchor: 2026-08-19 qa-gap-finding-verification
            - id: impl.mutation-lens
              labels: [evidence, seats]
              class: must
              text: >-
                The mutation lens runs on the verification seat, which already holds code sight;
                skips are disclosed — the run owes mutation results or a stated skip.
              when: {depth: [high]}
              anchor: 2026-08-19 qa-gap-finding-verification
            - id: impl.finding-kinds
              labels: [evidence]
              class: must
              kind: routing
              text: 'Findings split by kind: spec-required behavior broken — evidence captured, clause cited — fails the final validation; a beyond-spec finding is advisory.'
              anchor: 2026-08-19 qa-gap-finding-verification
            - id: impl.finding-kind-disputed
              labels: [user-gate]
              class: must
              kind: routing
              text: >-
                Each finding's kind is confirmed at the checkpoint against the cited clause; a
                disputed kind defaults advisory and goes to the user — the finder never gates
                alone.
              anchor: 2026-08-19 qa-gap-finding-verification
            - id: impl.delivered-territory-routing
              labels: [landing]
              class: must
              kind: routing
              text: 'A gap in a previously delivered feature''s territory is not this run''s rework: it routes to a /mochiko:feature delta card, cited in the report.'
              anchor: 2026-08-19 qa-gap-finding-verification
            - id: impl.beyond-spec-disposition
              labels: [user-gate]
              class: must
              kind: reservation
              text: 'Each beyond-spec finding''s disposition is the user''s: fix now, book to BACKLOG.md, or accept as designed.'
              anchor: 2026-08-19 qa-gap-finding-verification
            - id: impl.store-landing
              labels: [landing]
              class: must
              text: 'A built structural change folds into the architecture store in three parts: the delta''s elements flip built and their FEAT-XXX keys clear (transcription — rides this run''s landing audit) · the touched rows'' As-built: and Drift: fields are written as judgment and independently graded · the orphan check runs — an in-flight element keying no open feature is flagged, never left. The store skill regenerates the derived root ARCHITECTURE.md; it is never hand-edited here.'
              pointer: mochiko:authoring-architecture-store
            - id: impl.km-landing
              labels: [landing]
              class: must
              text: >-
                The same landing carries the knowledge-management obligations of
                .mochiko/memory/knowledge-management.md.
              when: {km_file: present}
            - id: impl.baseline-delta-grammar
              labels: [landing, evidence]
              class: must
              kind: binding
              text: 'Work discovered to touch a product baseline authors baseline-delta.md in the feature dir at discovery: a minimal, enumerated, appliable delta. A build-time technical decision (a D-XXX, C-XXX, or IP-XXX row at decomposition) is written the same way, never in place, against constraints-and-decisions.md; its judgment content is graded by the landing verification seat before the user''s acceptance — the landing''s three-way diff stays a transcription check only.'
            - id: impl.landing-selection
              labels: [landing]
              class: must
              text: 'The landing executes the store landing plus the map''s graduation batch: this run''s delivered work rows fold into the capability''s extent lines and vanish (pending rows persist) · status set delivered, dated, never regressing · the FEATURES.md index line updates · the specs-index row is touched — a spec reads closed exactly when all its selected rows have folded (derived, never asserted). No separate feature-close stage exists.'
              when: {scope: [selection]}
              pointer: mochiko:authoring-feature-map
            - id: impl.landing-epic
              labels: [landing]
              class: must
              text: 'The landing executes each member''s graduation batch, plus the epic close: the [EPIC-XXX] row markers vanish, the manifest is stamped delivered (dated), the spine directory persists as record. Multi-spec closure is compositional: each spec closes on its own rows, however many specs one landing touches.'
              when: {scope: [epic]}
              pointer: mochiko:authoring-epic
            - id: impl.landing-delta
              labels: [landing]
              class: must
              text: The landing executes the entry's marked delta fold.
              when: {scope: [delta]}
              pointer: mochiko:authoring-feature-map
            - id: impl.landing-lane
              labels: [landing]
              class: must
              text: 'The landing adds no map work to the store landing and the graded folds: a product lane owns no capability entry, so the map takes no write — no graduation batch, no status flip, no extent-line fold — and the map-delta boundary check of impl.landing-verifier-folds reads as zero writes. The lane directory at ${product_dir}/lane-<slug>/ persists as record.'
              when: {scope: [lane]}
              pointer: mochiko:authoring-feature-map
            - id: impl.graded-fold
              labels: [landing]
              class: floor
              text: 'Every touched baseline folds exactly once, via a graded fold — a three-way diff (pre-fold baseline + delta vs folded result; delta applied whole, nothing else changed), checked by the landing verification seat. An epic''s shared-baseline delta folds once from the spine; a single-member baseline from its feature delta. One carve: the store''s fold IS the store landing — status flips, graded As-built:/Drift: writes, and the orphan check, not a three-way diff. A delta whose baseline file is absent folds into a fresh ${product_dir}/ file (empty pre-fold side), the absence surfaced as a seeding gap.'
            - id: impl.gates-fold
              labels: [landing]
              class: must
              text: >-
                The landing folds the gap findings ruled fix-now or backlog into
                ${features_dir}/FEAT-XXX/gates.md (minted if absent), ${qa_seat} authoring each in
                the **TEST:** grammar; findings the user accepted as designed do not fold.
            - id: impl.register
              class: must
              kind: binding
              extends: common.register
        - id: impl.sec.ways-of-working
          title: Ways of Working
          intent: How the run sequences, verifies, and reports; model routing for its seats.
          rules:
            - id: impl.author-grader-default-fail
              class: floor
              extends: common.author-grader-default-fail
            - id: impl.plan-approval-producers
              labels: [seats, independence]
              class: must
              text: >-
                Every seat that writes code or artifacts plans first and works only on a plan you
                approved; grading, verification, and fact-finding seats are exempt.
            - id: impl.escalation-batching
              labels: [user-gate, reporting]
              class: must
              kind: routing
              text: >-
                Reserved-to-user questions accumulate and land as one batch at the cycle
                checkpoint; only a question the build cannot proceed without interrupts mid-cycle.
                Never sit on a build-blocking one.
            - id: impl.finding-severity-routing
              labels: [reporting]
              class: must
              kind: routing
              text: 'Advisory verifier findings ride the escalation cadence: a Minor finding defaults to a BACKLOG.md booking, never an in-cycle fix; an Important-or-above finding blocks the cycle and joins the checkpoint batch.'
            - id: impl.model-tiering
              class: must
              kind: routing
              extends: common.model-tiering
              anchor: 2026-08-16 model-tiered-seats
            - id: impl.delta-reverification
              labels: [evidence]
              class: must
              text: 'Re-verification is scoped to the delta: a test-only or records-only change gets a delta-grade of the changed surface, never a full gate re-sweep. A delta round re-runs no quality gates — the prior evidence stands while the graded head is unmoved; the graded object is the code tree (`git rev-parse HEAD:<code-dir>`), so a records-only commit does not move it.'
            - id: impl.no-git-mutations
              labels: [user-gate]
              class: must
              text: >-
                Suggest commits; never run git mutations, never push (an ephemeral, self-removed
                verification snapshot is not a mutation of refs, index, tracked content, or
                history).
            - id: impl.acceptance-plain-text
              labels: [user-gate]
              class: must
              text: >-
                The user's ruling at each blocking gate — the design checkpoint, the card
                confirm, final acceptance — is plain blocking text, never a timed prompt.
        - id: impl.sec.boundaries
          title: Boundaries — the non-waivable floor
          intent: Floor obligations no seat and no in-run ruling can waive.
          rules:
            - id: impl.baselines-never-in-place
              labels: [landing]
              class: floor
              text: 'Baselines are never edited in place. They change only through the landing''s graded fold. The design phase writes deltas beside them; a build-time technical decision takes the same path. One carve, and only one: a store write at the design checkpoint''s user sign-off is legal, and only as in-flight-class delta elements. Ruled truth in the store is never edited in place either — the signed delta stands beside it until the landing folds it.'
            - id: impl.deviation-gate
              labels: [user-gate]
              class: floor
              kind: gate
              text: >-
                A cycle that adds or removes a box, adds, removes, or redirects an arrow, or moves
                a responsibility across a boundary of the signed delta stops and is presented —
                build as approved, or amend the delta by the user's ruling first. Never design
                around it silently.
            - id: impl.constitution-supremacy
              labels: [user-gate]
              class: floor
              text: >-
                Feature work never overrules the constitution. A governance conflict conforms, or
                is amended or waived through governance-ledger.md — the user's ruling.
            - id: impl.constraint-challenge
              labels: [user-gate, floor-pointer]
              class: floor
              text: >-
                A ratified constraint is never silently overridden. A commodity-category check
                that collides with one files a constraint-challenge finding — the constraint's
                text, the real requirement it plausibly restates, the candidate it excludes —
                reserved to the user. Only the colliding decision pauses; the run proceeds
                elsewhere.
              pointer: mochiko:patterns-adopt-first
            - id: impl.attempt-per-grade
              labels: [attempt-economy]
              class: floor
              kind: bound
              text: >-
                A cycle consumes an attempt every time a verification seat grades it, whatever the
                round is called. Default ${attempt_bound_cycle} per cycle, redeclarable only at
                run-open.
              anchor: 2026-08-26 command-content-schema D12
            - id: impl.attempt-exemption-user-only
              labels: [attempt-economy, user-gate]
              class: floor
              kind: reservation
              text: Exempting a round from the attempt count is the user's call, never yours.
              anchor: 2026-08-26 command-content-schema D12
            - id: impl.no-progress-stop
              labels: [attempt-economy]
              class: floor
              kind: bound
              text: 'Two consecutive rounds with unchanged findings is a no-progress stop: halt the cycle, present state.'
              anchor: 2026-08-26 command-content-schema D12
            - id: impl.epic-member-halt
              labels: [attempt-economy, user-gate]
              class: floor
              kind: bound
              text: >-
                Exhaustion or no-progress halts member-scoped; the disposition — carve the
                member out (its rows return to pending, the run continues) or hold the whole run
                — is the user's.
              when: {scope: [epic]}
              anchor: 2026-08-26 command-content-schema D12
            - id: impl.gap-rework-bound
              labels: [attempt-economy, user-gate]
              class: floor
              kind: bound
              text: 'Gap-rework at final validation is the attempt economy at run scale: default ${gap_rework_bound} rounds, redeclarable only at run-open; a finding that localizes to one cycle''s territory charges that cycle''s remaining attempts instead. Bound exhaustion, or a round with unchanged findings, halts the run and presents state — the disposition is the user''s.'
              anchor: 2026-08-26 command-content-schema D12
            - id: impl.gates-never-triaged
              labels: [evidence]
              class: floor
              text: >-
                Gates are never severity-triaged. A failed **TEST:** gate or quality gate fails
                the cycle, per the done condition.
            - id: impl.minimalism-advisory
              labels: [evidence]
              class: floor
              text: 'minimalism: findings stay advisory at any severity.'
            - id: impl.lane-never-widens
              labels: [scope-entry]
              class: floor
              text: >-
                The lane never widens in place. A product-lane run discovering it stands on an
                in-flight feature's territory files the finding to that run and aborts.
              when: {scope: [lane]}
            - id: impl.sound-loop-floor
              labels: [floor-pointer, independence]
              class: floor
              text: 'A judgment-authored write to a governing surface obliges the sound loop: a seat produces on a plan you approved, an independent non-author seat reviews, the user rules. This run''s seat wiring already carries it end to end.'
              pointer: mochiko:patterns-sound-loop
            - id: impl.transport-floor
              class: floor
              when: {seats: multi}
              extends: common.transport-floor
        - id: impl.sec.fail-conditions
          title: Not done — default FAIL
          intent: 'The kind: fail set — any one standing fails the run; the .md Not-done line hard-codes this set''s count.'
          rules:
            - id: impl.fail.sufficiency-unrecorded
              labels: [reporting]
              class: floor
              kind: fail
              text: The sufficiency verdict was never recorded as a report.
              enforces: [impl.sufficiency-report]
              anchor: 2026-08-26 command-content-schema D7
            - id: impl.fail.design-skipped
              labels: [user-gate]
              class: floor
              kind: fail
              text: >-
                Gaps were found but the design phase was skipped, or its design and store delta
                were never signed by the user.
              enforces: [impl.design-phase-fires-on-gap, impl.gate-design-checkpoint]
              anchor: 2026-08-26 command-content-schema D7
            - id: impl.fail.card-independence
              labels: [independence]
              class: floor
              kind: fail
              text: >-
                A cycle card built by the seat that authored it, or built before the card confirm.
              enforces: [impl.seat-card-author-independence, impl.gate-card-confirm]
              anchor: 2026-08-26 command-content-schema D7
            - id: impl.fail.card-unchecked
              labels: [evidence]
              class: floor
              kind: fail
              text: A cycle card left unchecked.
              enforces: [impl.progress-surface]
              anchor: 2026-08-26 command-content-schema D7
            - id: impl.fail.quality-gate
              labels: [evidence]
              class: floor
              kind: fail
              text: A failing quality gate.
              enforces: [impl.gates-full-suite, impl.gates-never-triaged]
              anchor: 2026-08-26 command-content-schema D7
            - id: impl.fail.no-evidence
              labels: [evidence]
              class: floor
              kind: fail
              text: Verification claimed without real-infrastructure evidence.
              enforces: [impl.craft-verify-bindings]
              anchor: 2026-08-26 command-content-schema D7
            - id: impl.fail.regression
              labels: [evidence]
              class: floor
              kind: fail
              text: A regression in a previously delivered feature's gates.
              enforces: [impl.regression-sweep]
              anchor: 2026-08-26 command-content-schema D7
            - id: impl.fail.baseline-in-place
              labels: [landing]
              class: floor
              kind: fail
              text: >-
                A product baseline edited in place at build time, instead of through a graded
                baseline-delta.md entry.
              enforces: [impl.baselines-never-in-place, impl.baseline-delta-grammar]
              anchor: 2026-08-26 command-content-schema D7
            - id: impl.fail.deviation-unresolved
              labels: [user-gate]
              class: floor
              kind: fail
              text: >-
                An architecture deviation neither built as approved nor amended with the user's
                consent.
              enforces: [impl.deviation-gate]
              anchor: 2026-08-26 command-content-schema D7
            - id: impl.fail.store-landing-incomplete
              labels: [landing]
              class: floor
              kind: fail
              text: >-
                A signed store delta landed without its built-vs-signed diff, or an in-flight
                element left neither flipped built nor keyed to an open feature.
              enforces: [impl.store-landing]
              anchor: 2026-08-26 command-content-schema D7
            - id: impl.fail.ungraded-fold
              labels: [landing]
              class: floor
              kind: fail
              text: A touched baseline accepted without its graded fold.
              enforces: [impl.graded-fold]
              anchor: 2026-08-26 command-content-schema D7
            - id: impl.fail.gap-finding-missing
              labels: [evidence]
              class: floor
              kind: fail
              text: A run without its gap-finding pass.
              when: {scope: [selection, epic]}
              enforces: [impl.gap-finding-scope]
              anchor: 2026-08-26 command-content-schema D7
            - id: impl.fail.skip-unstated
              labels: [reporting]
              class: floor
              kind: fail
              text: >-
                A run whose final-validation report does not state its skipped gap-finding pass.
              when: {scope: [delta, lane]}
              enforces: [impl.gap-finding-scope]
              anchor: 2026-08-26 command-content-schema D7
            - id: impl.fail.spec-gap-unresolved
              labels: [evidence]
              class: floor
              kind: fail
              text: A gap finding showing spec-required behavior broken, left unresolved.
              enforces: [impl.finding-kinds]
              anchor: 2026-08-26 command-content-schema D7
            - id: impl.fail.no-acceptance
              class: floor
              kind: fail
              extends: common.no-acceptance
              enforces: [impl.gate-final-acceptance]
              anchor: 2026-08-26 command-content-schema D7
  - op: import-document
    kind: command
    name: setup
    content:
      kind: command
      command: setup
      vars:
        explore_model: haiku
        memory_dir: .mochiko/memory
        product_dir: .mochiko/product
        plugin_root: ${CLAUDE_PLUGIN_ROOT}
      conditions:
        mode:
          values: [greenfield, brownfield, amend]
          resolution: user-ruled
          note: >-
            proposed from what the workspace shows; the user rules it whenever it is ambiguous
            (setup.user-mode-ruling).
        seats:
          values: [single, multi]
          resolution: standing-trigger
          note: >-
            fires the moment the run composes more than one seat, and re-fires on a seat added
            mid-run.
      moments:
        interrogation: The inline agenda-then-catalog stage, worked card by card with the user.
        ratification: The user's ratification of the synthesis — before any surface is authored.
        acceptance: >-
          The user's final acceptance of the surface set, flagged proposal by flagged proposal.
        close: Where the feature map and the bootstrapped surfaces must exist.
      sections:
        - id: setup.sec.roles
          title: Roles & Responsibilities — seat wiring
          intent: How the run is led and staffed, and the independence its grading seats carry.
          rules:
            - id: setup.staffing-latitude
              labels: [seats]
              class: must
              kind: latitude
              text: Teammates or subagents per seat is your call.
            - id: setup.interrogation-inline
              labels: [seats]
              class: must
              kind: duty
              text: >-
                Run the interrogation yourself, inline — the agenda's dimensions worked
                adaptively via mochiko:analysis-iterative, then the catalog deck, card by card,
                recommend-then-arbitrate (agenda and deck named in setup.interrogation-inputs).
              pointer: mochiko:analysis-iterative
            - id: setup.stress-test-cold-seat
              labels: [independence, user-gate]
              class: must
              text: >-
                The synthesis (${memory_dir}/governance-intent.md) is your pen, so its
                pre-ratification stress-test is always a cold seat, or the user's recorded waiver.
            - id: setup.blind-map-dispatch
              labels: [independence, seats]
              class: floor
              text: >-
                The pre-ratification stress-test seat is spawned in two messages — first the
                setup topic / project identity and goal only, never the synthesis path
                (${memory_dir}/governance-intent.md), so it builds its Phase 0 angle map blind to
                what the interrogation concluded; its map returns before you send the synthesis
                path and the cold read begins. In a pair, both seats build their maps
                independently.
        - id: setup.sec.reserved
          title: Reserved to the user — never the run's
          intent: 'Decisions held by the user: gates, rulings, and escalations no seat may take.'
          rules:
            - id: setup.coverage-survivor-routing
              labels: [user-gate]
              class: must
              kind: routing
              text: 'A coverage finding surviving the pre-ratification stress-test (setup.blind-map-dispatch) questions the setup''s scope, not a card — present each gap as a candidate topic; the user rules the path: explore now (re-enter mochiko:analysis-iterative on that angle; the re-elicited intent lands in the GI-XXX namespace), rule inline, or defer. A gap that overlaps an agenda dimension keeps the ordinary interrogation-follow-up path.'
            - id: setup.user-mode-ruling
              labels: [user-gate]
              class: must
              kind: reservation
              text: >-
                The mode when ambiguous — greenfield / brownfield / amend — is the user's
                ruling.
            - id: setup.user-card-rulings
              labels: [user-gate]
              class: must
              kind: reservation
              text: Every interrogation card ruling, module ruling, and waiver is the user's.
            - id: setup.gate-synthesis-ratification
              labels: [user-gate]
              class: floor
              kind: gate
              text: Synthesis ratification is the user's.
            - id: setup.user-conflict-rulings
              labels: [user-gate]
              class: must
              kind: reservation
              text: >-
                Detected reality vs declared intent conflicts are the user's — confronted in the
                open, never silently resolved.
              when: {mode: [brownfield]}
            - id: setup.user-map-confirmation
              labels: [user-gate]
              class: must
              kind: reservation
              text: Confirmation of the reconstructed feature map, entry by entry, is the user's.
              when: {mode: [brownfield]}
            - id: setup.gate-final-acceptance
              labels: [user-gate]
              class: floor
              kind: gate
              text: >-
                Final acceptance of the surface set is the user's, flagged proposal by flagged
                proposal.
        - id: setup.sec.tools
          title: Tools bindings
          intent: Surfaces, inputs, templates, and hand-offs the run binds to.
          rules:
            - id: setup.surface-set
              labels: [binding, floor-pointer]
              class: must
              kind: binding
              text: 'The surface set: the marked governance region in CLAUDE.md (`<!-- mochiko:governance:begin/end -->`) · `paths`-scoped .claude/rules/mochiko/*.md · skill pointers · ${memory_dir}/governance-ledger.md · the trace summary. Composition and read scope: mochiko:authoring-constitution.'
              pointer: mochiko:authoring-constitution
            - id: setup.synthesis-artifact
              labels: [binding]
              class: must
              kind: binding
              text: 'The synthesis: ${memory_dir}/governance-intent.md, GI-XXX namespace, from the governance-intent template (rendered by mochiko-cli template governance-intent, or its schema plugins/mochiko/schemas/governance-intent.yaml Read raw when the binary is absent — the shipped schema is the first-class source of truth) — the durable amend baseline.'
            - id: setup.interrogation-inputs
              labels: [binding, scope-entry]
              class: must
              kind: binding
              text: 'Interrogation inputs: ${plugin_root}/skills/authoring-constitution/references/ — INTERROGATION-AGENDA.md, the catalog/ deck, DOMAIN-DEPENDENCIES.md; brownfield analysis via mochiko:analysis-codebase into ${memory_dir}/codebase-analysis.md.'
              pointer: mochiko:analysis-codebase
            - id: setup.constitution-superseded
              labels: [binding]
              class: must
              text: >-
                A ${memory_dir}/constitution.md on disk is superseded — delete on sight, say so
                in one line.
            - id: setup.km-module-scaffold
              labels: [binding]
              class: must
              kind: binding
              text: >-
                The knowledge-management module adopted → scaffold per
                templates/constitution-modules/knowledge-management.md, including the
                project-pinned copy at ${memory_dir}/knowledge-management.md; its never-overwrite
                floor holds.
            - id: setup.feature-map-brownfield
              labels: [landing]
              class: must
              text: 'The analysis (setup.interrogation-inputs) extends into a feature-map reconstruction — delivered capabilities derived from the code (routes, UI surfaces, services), confirmed with the user, landing as the initial FEATURES.md + .mochiko/features/ entries with `delivered` status and the reconstructed-from-code mark (shape: the features-index and feature-entry templates — mochiko-cli template features-index and mochiko-cli template feature-entry, or their schemas plugins/mochiko/schemas/features-index.yaml and plugins/mochiko/schemas/feature-entry.yaml Read raw when the binary is absent, the shipped schemas being the first-class source of truth; map machinery and the first-touch re-verify obligation: mochiko:authoring-feature-map).'
              when: {mode: [brownfield]}
              pointer: mochiko:authoring-feature-map
            - id: setup.feature-map-greenfield
              labels: [landing]
              class: must
              text: Scaffold the empty FEATURES.md index.
              when: {mode: [greenfield]}
            - id: setup.baselines-bootstrap
              labels: [landing]
              class: must
              text: '`Assumed`: the brownfield analysis also bootstraps the product baselines — data-model.md · contracts/ · constraints-and-decisions.md · quickstart.md — at ${product_dir}/ (ARCHITECTURE.md stays repo root, now as the store''s derived index) — from the delivered code; greenfield seeds those baselines at the first implement run''s design phase instead.'
              anchor: 2026-08-26 plan-stage-utility
            - id: setup.store-scaffold-unconditional
              labels: [binding]
              class: must
              text: >-
                The architecture store's scaffold is unconditional — on every path,
                ${product_dir}/architecture/ is created where it does not exist, with a spine.md
                stub whose header carries the `Scope:` line (setup.architecture-scope-handoff) and
                an empty concerns.md beside it, so the store's layout is complete from birth;
                greenfield's stub is simply a header with no topology under it, and the scaffold
                creates only what is missing — never writing over a store that already carries
                content.
              anchor: 2026-08-19 product-architecture-schema
            - id: setup.architecture-scope-handoff
              labels: [binding]
              class: must
              text: 'The run reads which surface types the product carries — backend-service · frontend-web · mobile · desktop, composed for a full-stack or monorepo product — and declares them on the `Scope:` line in the header of ${product_dir}/architecture/spine.md, written as a stub by the unconditional store scaffold (setup.store-scaffold-unconditional) — so every setup run leaves the scope declared; the derived index (repo-root ARCHITECTURE.md) renders it. The declaration is write-if-absent: where the `Scope:` line is missing it is declared, and an existing line is left alone. The store carries the scope — setup does not hold it. It is a handoff, not a ruling: the /mochiko:architecture desk deals the shelves that scope selects, and the user may override it at the desk by an ordinary store write to that same line. No architecture stance is taken in the run.'
              anchor: 2026-08-19 product-architecture-schema
            - id: setup.register
              class: must
              kind: binding
              extends: common.register
            - id: setup.next-step
              labels: [reporting]
              class: advisory
              kind: routing
              text: 'Next step: /mochiko:specify for the first feature, and /mochiko:architecture for the product''s architecture baseline — peer doors, neither ahead of the other (+ /mochiko:brainstorm when knowledge-management was adopted).'
        - id: setup.sec.ways-of-working
          title: Ways of Working
          intent: How the run plans, grades, and reports; model routing for its seats.
          rules:
            - id: setup.model-tiering
              class: must
              kind: routing
              extends: common.model-tiering
              anchor: 2026-08-16 model-tiered-seats
            - id: setup.plan-approval-producers
              class: must
              extends: common.plan-approval-producers
            - id: setup.author-grader-default-fail
              class: floor
              extends: common.author-grader-default-fail
            - id: setup.no-git-mutations
              class: floor
              extends: common.no-git-mutations
            - id: setup.acceptance-plain-text
              class: floor
              extends: common.acceptance-plain-text
        - id: setup.sec.boundaries
          title: Boundaries — the non-waivable floor
          intent: Floor obligations no seat and no in-run ruling can waive.
          rules:
            - id: setup.transport-floor
              class: floor
              when: {seats: multi}
              extends: common.transport-floor
            - id: setup.durables-never-deleted
              labels: [binding, stewardship]
              class: floor
              text: >-
                Never offer to delete the synthesis ${memory_dir}/governance-intent.md or the
                ledger ${memory_dir}/governance-ledger.md.
            - id: setup.governance-region-ownership
              labels: [binding]
              class: floor
              text: >-
                The governance region in CLAUDE.md (`<!-- mochiko:governance:begin/end -->`) is
                setup-owned and idempotently regenerated; everything outside those markers is user
                content, never touched.
            - id: setup.carve-outs-preserved
              labels: [binding]
              class: floor
              text: 'The governance-surfaces template''s marked carve-outs are preserved verbatim, never regenerated over the user''s values: the `mochiko:domain-registry` block in the domain-layer rules file under .claude/rules/mochiko/, and the `mochiko:output-style` pair — the switch line in the CLAUDE.md governance region plus .claude/rules/mochiko/output-style.md.'
              pointer: mochiko:authoring-constitution
            - id: setup.map-never-overwrite
              labels: [landing]
              class: floor
              text: >-
                The never-overwrite floor covers every feature-map write the run makes — the
                brownfield reconstruction (setup.feature-map-brownfield) and the greenfield
                scaffold (setup.feature-map-greenfield) are its instances, not its extent — and
                an amend run makes none.
            - id: setup.store-ruled-content-never-here
              labels: [binding, stewardship]
              class: floor
              text: 'The store''s ruled content is never authored in the run, on any path: a file holding only a `Scope:` header is scaffold, not ruled content, and the first /mochiko:architecture visit is what elicits it (greenfield) or reconstructs it from what exists and confirms it with the user (brownfield) — those two paths are instances of its reach, not its extent.'
              anchor: 2026-08-19 product-architecture-schema
        - id: setup.sec.fail-conditions
          title: Not done — default FAIL
          intent: 'The kind: fail set — any one standing fails the run; the .md Not-done line hard-codes this set''s count.'
          rules:
            - id: setup.fail.pre-ratification-authoring
              labels: [user-gate]
              class: floor
              kind: fail
              text: A surface authored before the intent was ratified.
              enforces: [setup.gate-synthesis-ratification]
              anchor: 2026-08-26 command-content-schema D7
            - id: setup.fail.unclosed-trace
              labels: [evidence]
              class: floor
              kind: fail
              text: An unclosed trace from ratified intent to authored surfaces.
              enforces: []
              note: >-
                the intent→surface trace obligation is owned by mochiko:authoring-constitution,
                bound at setup.surface-set — no local rule states it.
              anchor: 2026-08-26 command-content-schema D7
            - id: setup.fail.author-graded
              labels: [independence]
              class: floor
              kind: fail
              text: The governance surface set never graded by anyone but its author.
              enforces: [setup.author-grader-default-fail, setup.stress-test-cold-seat]
              anchor: 2026-08-26 command-content-schema D7
            - id: setup.fail.floor-category-uncovered
              labels: [user-gate]
              class: floor
              kind: fail
              text: A floor category with neither principle nor recorded waiver.
              pointer: mochiko:authoring-constitution
              enforces: []
              note: 'the Essential Floor category set is owned by mochiko:authoring-constitution, carried on this node''s own pointer: — no local rule enumerates it.'
              anchor: 2026-08-26 command-content-schema D7
            - id: setup.fail.no-acceptance
              class: floor
              kind: fail
              extends: common.no-acceptance
              enforces: [setup.gate-final-acceptance]
              anchor: 2026-08-26 command-content-schema D7
            - id: setup.fail.no-feature-map
              labels: [landing]
              class: floor
              kind: fail
              text: >-
                No feature map at close — brownfield reconstruction unconfirmed, greenfield
                index unscaffolded, or, on an amend, a missing map neither surfaced nor offered.
              enforces: [setup.feature-map-brownfield, setup.feature-map-greenfield, setup.user-map-confirmation]
              anchor: 2026-08-26 command-content-schema D7
      tombstones:
        - id: setup.sec.harness
          disposition: >-
            superseded → rules redistributed across the D4 six-set
            (command-md-scaffold-standardization D3/D4/D5)
        - id: setup.sec.bindings
          disposition: >-
            superseded → rules redistributed across the D4 six-set
            (command-md-scaffold-standardization D3/D4/D5)
  - op: import-document
    kind: command
    name: specify
    content:
      kind: command
      command: specify
      vars:
        pm_seat: product-manager
        explore_model: haiku
        specs_dir: .mochiko/specs
        spec_schema: plugins/mochiko/schemas/spec.yaml
        feature_entry_schema: plugins/mochiko/schemas/feature-entry.yaml
        features_index_schema: plugins/mochiko/schemas/features-index.yaml
        rules_dir: .claude/rules/mochiko
      conditions:
        ux_bearing:
          values:
            - 'yes'
            - 'no'
          resolution: moment-resolved(intent)
          note: ruled in the intent stage; rules gated on it are inapplicable until it resolves.
        feature_map:
          values: presence
          resolution: surface-presence
          note: FEATURES.md plus the entries in the intent's territory.
        governance_region:
          values: presence
          resolution: surface-presence
          note: the marked governance region in CLAUDE.md.
        km_file:
          values: presence
          resolution: surface-presence
          note: .mochiko/memory/knowledge-management.md.
        seats:
          values: [single, multi]
          resolution: standing-trigger
          note: >-
            fires the moment the run composes more than one seat, and re-fires on a seat added
            mid-run.
      moments:
        intent: The adaptive-probe stage that closes in the user-confirmed intent synthesis.
        stories-confirm: >-
          The post-stories step where the capability frame is confirmed or adjusted.
        derivation: Where work rows are cut under their capabilities and the map delta is staged.
        selection: Where the user picks which work rows build now, from the selection card.
        acceptance: The user's accept / amend / reject, which executes the staged map write batch.
      sections:
        - id: spec.sec.roles
          title: Roles & Responsibilities — seat wiring
          intent: >-
            Seat staffing, the producing seats' duties, and grading independence across the run.
          rules:
            - id: spec.lead-latitude
              labels: [seats]
              class: must
              kind: latitude
              text: 'You are the lead: plan the run and orchestrate it toward the Goal state in plugins/mochiko/commands/specify.md; teammates or subagents per seat is your call.'
            - id: spec.capability-frame-at-intent
              labels: [seats, scope-entry]
              class: must
              text: >-
                Within the intent stage, once the map and intent are read, the ${pm_seat} seat
                states the capability frame — which capabilities the territory touches and an
                extend-vs-mint hypothesis per the capability tests
                (mochiko:patterns-map-minimalism) — as nouns + verbs only, never enumerating
                stories, agreed with the user. The agreed frame lands in the confirmed Intent
                section.
              pointer: mochiko:patterns-map-minimalism
              anchor: 2026-08-13 pm-role-and-feature-derivation D5
            - id: spec.confirm-frame-post-stories
              labels: [seats, scope-entry]
              class: must
              text: >-
                After stories, the ${pm_seat} seat — via mochiko:authoring-feature-map and
                mochiko:patterns-map-minimalism — first confirms or adjusts the intent-stage
                capability frame against what the stories revealed; stories win any conflict.
              pointer: mochiko:authoring-feature-map
              anchor: 2026-08-13 pm-role-and-feature-derivation D5
            - id: spec.cut-work-rows
              labels: [seats, scope-entry]
              class: must
              text: >-
                After the frame confirm (spec.confirm-frame-post-stories), the ${pm_seat} seat
                cuts the work rows (story-shaped is fine) grouped under their capabilities,
                extending an existing capability's extent or minting a new one per the
                extend-vs-mint tests, and maps every SC-XXX to its verifying capability or row.
              pointer: mochiko:patterns-map-minimalism
            - id: spec.filter-rejections-recorded
              labels: [evidence, reporting]
              class: must
              text: 'The ${pm_seat} seat runs the filter: a story that earns no place on the map is rejected with the why recorded in its story file, never silently dropped.'
            - id: spec.epic-proposal-optional
              labels: [seats]
              class: must
              kind: latitude
              text: >-
                When one derivation spans capabilities such that its work rows want one
                coordinated multi-feature run, the ${pm_seat} seat may propose an epic as part of
                the selection card — a proposal only, never a mint.
              anchor: 2026-08-14 multi-feature-plan-implement D4
            - id: spec.pm-recommends-never-selects
              labels: [user-gate, independence]
              class: floor
              text: The ${pm_seat} seat recommends, never selects.
              anchor: 2026-08-13 pm-role-and-feature-derivation D5
            - id: spec.stress-test-one-pass
              labels: [independence, evidence]
              class: must
              text: >-
                The stress-test grades spec + stories + capability/row derivation + map delta in
                one pass — derivation honesty, filter rejections justified, dedup against the
                actual map, granularity respected, capabilities and rows well-formed — its
                map-delta baseline the map's git state at run open.
            - id: spec.stress-test-prototype-walk
              labels: [independence, evidence]
              class: must
              text: 'The stress-test also walks the prototype (served, or opened directly via the no-server degrade path): every FLOW-XXX clickable end-to-end, every SCR-XXX reachable, every P1 acceptance scenario carrying a click path; manifest↔prototype drift is a blocking gap.'
              when: {ux_bearing: 'yes'}
              anchor: 2026-08-02 ux-mocking-in-specify D7
        - id: spec.sec.reserved
          title: Reserved to the user — never the run's
          intent: 'Decisions held by the user: gates, rulings, and escalations no seat may take.'
          rules:
            - id: spec.reserved-to-user
              labels: [user-gate]
              class: must
              kind: reservation
              text: 'Reserved to the user: the feature framing when `$ARGUMENTS` is empty · intent confirmation (the capability frame included) · clarification answers only they can settle · clicking each story''s prototype screens as they land (their reactions fold back into story and screen together) · ruling on an escalated filter disagreement.'
            - id: spec.selection-card
              labels: [user-gate, reporting]
              class: must
              kind: binding
              text: >-
                The user picks which work rows build now, from the ${pm_seat} seat's selection
                card — the rows grouped per capability, recommendation, row-level dependency
                order, the deferred-SC list, and, per capability in the spec's territory, the
                completeness view (pending work rows — cut but undelivered — plus parked stubs
                and kills), visible at the moment of choice.
              anchor: 2026-08-13 pm-role-and-feature-derivation D5
            - id: spec.gate-selection
              labels: [user-gate]
              class: floor
              kind: gate
              text: The selection — which work rows build now — is the user's.
              anchor: 2026-08-13 pm-role-and-feature-derivation D5
            - id: spec.gate-acceptance
              labels: [user-gate, landing]
              class: floor
              kind: gate
              text: >-
                Spec acceptance (accept / amend / reject) is the user's, covering intent,
                requirements, experience, derivation, and selection whole — acceptance is what
                executes the map write batch; a rejected spec never touched the map.
              anchor: 2026-08-10 feature-map-layer D5
            - id: spec.filter-disagreement-escalates
              labels: [user-gate]
              class: must
              kind: routing
              text: >-
                A producer disagreement — a rejected story held load-bearing — escalates to
                the user.
        - id: spec.sec.tools
          title: Tools bindings
          intent: Paths, schemas, skills, and templates the run binds to.
          rules:
            - id: spec.deliverable
              labels: [binding]
              class: must
              kind: binding
              text: >-
                The deliverable is ${specs_dir}/<spec>/ — spec.md from the spec template
                (rendered by `mochiko-cli template spec`, or its schema ${spec_schema} Read raw
                when the binary is absent — the shipped schema is the first-class source of
                truth) plus the stories/US-*.md files; <spec> a kebab-case slug derived from the
                feature description; never offer to delete it. Uncertainty lives in spec.md's
                Assumptions and Open Questions sections.
            - id: spec.intent-stage-first
              labels: [scope-entry]
              class: must
              text: 'The intent stage runs before any authoring: the adaptive-probe agenda via mochiko:analysis-iterative — scope boundary · delivery intent · depth-rigor expectation · UX-bearing (does the feature carry a user-facing surface to prototype) · constraints · out-of-scope.'
              pointer: mochiko:analysis-iterative
            - id: spec.map-obligated-read
              labels: [scope-entry, evidence]
              class: must
              text: 'The existing feature map is an obligated read at the intent stage, per mochiko:authoring-feature-map''s intent-stage agenda: FEATURES.md plus the entries in the intent''s territory.'
              when: {feature_map: present}
              pointer: mochiko:authoring-feature-map
            - id: spec.missing-map-surfaced
              labels: [scope-entry, user-gate]
              class: must
              kind: routing
              text: >-
                A missing feature map is surfaced — offer /mochiko:setup, whose brownfield
                analysis reconstructs it — never silently tolerated.
              when: {feature_map: absent}
            - id: spec.unrefined-stubs
              labels: [scope-entry]
              class: must
              text: 'Map entries marked unrefined are unratified hypotheses, never extension anchors: derivation ignores stub text, deriving frame-first with stories informing; a stub matching a framed or derived capability is confirmation, a stub matching nothing stays parked or is retired (procedure: mochiko:authoring-feature-map).'
              pointer: mochiko:authoring-feature-map
            - id: spec.intent-synthesis-governs
              labels: [scope-entry, reporting]
              class: must
              kind: binding
              text: >-
                The confirmed intent synthesis governs the run and lands verbatim as the spec's
                Intent section.
            - id: spec.frame-greenfield-inputs
              labels: [scope-entry]
              class: advisory
              text: >-
                On a thin greenfield intent the capability frame draws on the intent conversation,
                the product description's domain nouns, and the capability tests
                (mochiko:patterns-map-minimalism).
              pointer: mochiko:patterns-map-minimalism
            - id: spec.whole-feature-prototype
              labels: [evidence]
              class: must
              text: >-
                The whole feature is prototyped at specify time; FEAT-tags land at derivation as a
                re-tag pass over the SCR/FLOW manifest — unselected features' screens greyed
                coming-soon, a filter-rejected story's screens kept greyed and marked rejected.
              when: {ux_bearing: 'yes'}
              anchor: 2026-08-02 ux-mocking-in-specify D8
            - id: spec.feature-map-craft
              labels: [floor-pointer, binding]
              class: must
              kind: binding
              text: >-
                Feature-map craft — derivation, the filter, capability and work-row authoring
                (the feature-entry template — `mochiko-cli template feature-entry`, or its
                schema ${feature_entry_schema} Read raw when the binary is absent, the shipped
                schema being the first-class source of truth), index lines (the features-index
                template — `mochiko-cli template features-index`, or its schema
                ${features_index_schema} Read raw when the binary is absent, likewise the
                first-class source), delta grammar, SC re-homing, and the acceptance-time write
                rules — the ${specs_dir}/index.md row included; spec-index stewardship rides the
                skill — all per mochiko:authoring-feature-map.
              pointer: mochiko:authoring-feature-map
            - id: spec.map-minimalism-binding
              labels: [floor-pointer]
              class: must
              kind: binding
              text: >-
                The capability tests, extend-vs-mint, and the frame discipline bind per
                mochiko:patterns-map-minimalism.
              pointer: mochiko:patterns-map-minimalism
            - id: spec.prototype-craft
              labels: [floor-pointer, binding]
              class: must
              kind: binding
              text: >-
                The Screens & Flows section and prototype/ app per mochiko:authoring-prototype —
                SCR-XXX/FLOW-XXX manifest grammar, low-fi discipline (binding flows, advisory
                pixels), bun-servable static HTML with the no-server degrade path, design system
                honored where one exists; not UX-bearing takes the waiver line "No UX surface —
                prototype waived at intent." instead.
              pointer: mochiko:authoring-prototype
              anchor: 2026-08-02 ux-mocking-in-specify D1
            - id: spec.governance-briefs
              labels: [seats, scope-entry]
              class: must
              text: >-
                Name the relevant ${rules_dir}/ files as an obligated read in each author's brief
                — `paths`-scoped rules do not fire for from-scratch authoring.
              when: {governance_region: present}
            - id: spec.governance-region-absent
              labels: [scope-entry]
              class: must
              kind: routing
              text: >-
                A missing CLAUDE.md governance region is surfaced (offer /mochiko:setup), never
                auto-resolved.
              when: {governance_region: absent}
            - id: spec.km-landing
              labels: [landing]
              class: must
              text: >-
                Spec acceptance is a landing — run the .mochiko/memory/knowledge-management.md
                landing ritual (close/move any BACKLOG item the spec discharges, touch ROADMAP.md)
                and its command-boundary invariants fix-on-sight; the acceptance-time map write
                batch lands in the same moment.
              when: {km_file: present}
            - id: spec.migration-frozen-specs
              labels: [binding]
              class: must
              kind: binding
              text: >-
                Existing slice-form specs are valid frozen history; only new runs take the
                ${specs_dir}/<spec>/ workspace form.
            - id: spec.register
              class: must
              kind: binding
              extends: common.register
            - id: spec.next-step
              labels: [scope-entry]
              class: must
              kind: routing
              text: 'Next step: /mochiko:implement — one run per capability-batch (a capability''s selected work rows), in the rows'' dependency order; that run opens with a sufficiency check at its entry.'
              anchor: 2026-08-26 plan-stage-utility D1
        - id: spec.sec.ways-of-working
          title: Ways of Working
          intent: >-
            How the run sequences its stages, prototypes, and reports; model routing for its
            seats.
          rules:
            - id: spec.model-tiering
              class: must
              kind: routing
              extends: common.model-tiering
              anchor: 2026-08-16 model-tiered-seats
            - id: spec.intent-probe-discipline
              labels: [user-gate]
              class: must
              text: >-
                Intent runs as probes, never a questionnaire; it closes in a one-screen synthesis
                the user confirms; flag ratification streaks before treating adoptions as
                engagement.
            - id: spec.frame-hypothesis-not-anchor
              labels: [scope-entry]
              class: must
              text: 'The capability frame is a hypothesis, not an anchor: it dictates neither story boundaries nor journeys (stories stay journey-driven), and stories win any conflict with it, resolved at the post-stories confirm step (spec.confirm-frame-post-stories).'
              anchor: 2026-08-13 pm-role-and-feature-derivation D5
            - id: spec.lockstep-prototyping
              labels: [user-gate, evidence]
              class: must
              text: >-
                Stories and their screens co-evolve as one unit — skeleton nav frame first, then
                each story's screens and flows land while that story is under discussion; the user
                clicks through while the story is wet, never a batch render after the text
                settles.
              when: {ux_bearing: 'yes'}
              anchor: 2026-08-02 ux-mocking-in-specify D2
            - id: spec.plan-approval
              class: must
              extends: common.plan-approval-producers
            - id: spec.author-grader-default-fail
              class: floor
              extends: common.author-grader-default-fail
            - id: spec.no-git-mutations
              class: must
              extends: common.no-git-mutations
            - id: spec.acceptance-plain-text
              class: must
              extends: common.acceptance-plain-text
        - id: spec.sec.boundaries
          title: Boundaries — the non-waivable floor
          intent: Floor obligations no seat and no in-run ruling can waive.
          rules:
            - id: spec.transport-floor
              class: floor
              when: {seats: multi}
              extends: common.transport-floor
            - id: spec.staged-derivation
              labels: [landing]
              class: floor
              text: >-
                All derivation output stages in the spec workspace; the live map stays untouched
                until acceptance.
              anchor: 2026-08-10 feature-map-layer D5
            - id: spec.epic-mint-desk-only
              labels: [user-gate]
              class: floor
              kind: routing
              text: >-
                The user takes an epic proposal to /mochiko:feature's desk to form, the only door
                that mints; the run never mints an epic (mochiko:authoring-epic).
              pointer: mochiko:authoring-epic
              anchor: 2026-08-26 plan-stage-utility D4
        - id: spec.sec.fail-conditions
          title: Not done — default FAIL
          intent: 'The kind: fail set — any one standing fails the run; the .md Not-done line hard-codes this set''s count.'
          rules:
            - id: spec.fail.blocking-gap
              labels: [evidence]
              class: floor
              kind: fail
              text: A blocking gap open.
              enforces: [spec.stress-test-one-pass]
              anchor: 2026-08-26 command-content-schema D10
            - id: spec.fail.intent-unconfirmed
              labels: [user-gate]
              class: floor
              kind: fail
              text: An Intent section never confirmed by the user before authoring.
              enforces: [spec.intent-stage-first, spec.reserved-to-user]
              anchor: 2026-08-26 command-content-schema D10
            - id: spec.fail.map-unread
              labels: [scope-entry]
              class: floor
              kind: fail
              text: The feature map not read at intent, or a missing map silently tolerated.
              enforces: [spec.map-obligated-read, spec.missing-map-surfaced]
              anchor: 2026-08-26 command-content-schema D10
            - id: spec.fail.story-unhomed
              labels: [evidence]
              class: floor
              kind: fail
              text: >-
                A drafted story neither homed to exactly one work row nor rejected with a recorded
                why.
              enforces: [spec.cut-work-rows, spec.filter-rejections-recorded]
              anchor: 2026-08-26 command-content-schema D10
            - id: spec.fail.screens-flows
              labels: [evidence]
              class: floor
              kind: fail
              text: >-
                A Screens & Flows section absent (the waiver line counts), or ruled UX-bearing
                with no clickable prototype, or manifest↔prototype drift unresolved.
              enforces: [spec.prototype-craft, spec.stress-test-prototype-walk]
              anchor: 2026-08-26 command-content-schema D10
            - id: spec.fail.selection-unruled
              labels: [user-gate]
              class: floor
              kind: fail
              text: A Feature Selection section absent, or the selection not ruled by the user.
              enforces: [spec.gate-selection, spec.selection-card]
              anchor: 2026-08-26 command-content-schema D10
            - id: spec.fail.premature-map-write
              labels: [landing]
              class: floor
              kind: fail
              text: The live map written before acceptance.
              enforces: [spec.staged-derivation, spec.gate-acceptance]
              anchor: 2026-08-26 command-content-schema D10
            - id: spec.fail.self-graded
              labels: [independence]
              class: floor
              kind: fail
              text: The spec never graded by anyone but its authors.
              enforces: [spec.author-grader-default-fail]
              anchor: 2026-08-26 command-content-schema D10
            - id: spec.fail.no-acceptance
              class: floor
              kind: fail
              extends: common.no-acceptance
              enforces: [spec.gate-acceptance]
              anchor: 2026-08-26 command-content-schema D10
      tombstones:
        - id: spec.sec.harness
          disposition: >-
            superseded → rules redistributed across the D4 six-set
            (command-md-scaffold-standardization D3/D4/D5)
        - id: spec.sec.bindings
          disposition: >-
            superseded → rules redistributed across the D4 six-set
            (command-md-scaffold-standardization D3/D4/D5)
  - op: import-document
    kind: skill
    name: analysis-codebase
    content:
      kind: skill
      skill: analysis-codebase
      sections:
        - id: analysis-codebase.sec.independence
          title: Independence — none bound
          intent: Seat separations this producer would carry.
          note: >-
            Deliberately empty — the census records no independence obligation at D12 grain;
            grading the produced analysis is the consuming session's checkpoint, not a seat-split
            this skill owns.
          rules: []
        - id: analysis-codebase.sec.scope
          title: Scope — assess-status only, and the parked modes
          intent: >-
            The canonical-definition boundary, what is out of scope, and where the other modes
            live.
          rules:
            - id: analysis-codebase.essential-floor-canonical-definition
              labels: [boundary, floor-pointer]
              class: floor
              kind: binding
              text: 'The four Essential-Floor categories — Security, Testing, Error Handling, Observability — are defined canonically in `../authoring-constitution/references/ESSENTIAL-FLOOR.md`. Governance owns require-floor; this skill owns the other half, assess-status: detect each category''s present / partial / absent state in the existing codebase, with file-cited evidence. Do not redefine the categories here — read the canonical definition, then assess against the indicators it carries.'
              pointer: ../authoring-constitution/references/ESSENTIAL-FLOOR.md
              anchor: 2026-08-10 validator-scope-and-verbosity
            - id: analysis-codebase.collision-inventory-out-of-scope
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Collision detection and the JSON inventory are the spec/design-cluster Brownfield
                mode, not wired this run; the deeper collision-risk inventory is not produced
                here. For domain entities, locate where they live (models/, schema files, ORM
                annotations) and document what is found.
              anchor: 2026-08-26 plan-stage-utility D1
            - id: analysis-codebase.when-not-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Greenfield projects have no existing code to analyze — go straight to
                `mochiko:authoring-constitution`. Single-file scripts and documentation-only
                reviews take standard file reading; before the project directory exists there is
                nothing to analyze; skip analysis when the user already provided complete context
                (tech stack and patterns documented).
            - id: analysis-codebase.context-gathering-scope-note
              labels: [boundary]
              class: must
              kind: routing
              text: 'The context-gathering sub-procedure runs inside Setup-Brownfield; the standalone Context-report mode lives in the constitution-context cluster and is not wired — findings land in `.mochiko/memory/codebase-analysis.md`, never a separate report file. Procedure: `references/CONTEXT-GATHERING.md`, referenced never restated.'
              pointer: references/CONTEXT-GATHERING.md
        - id: analysis-codebase.sec.inputs
          title: Inputs — the deterministic layer
          intent: What the detection script settles and what stays model judgment.
          rules:
            - id: analysis-codebase.determinism-boundary
              labels: [evidence, boundary]
              class: must
              text: '`detect-stack.sh` is the deterministic layer (pure `bash` + `jq`, reads project files, JSON to stdout — no kernel, no network); framework and architecture inference and the Essential-Floor assessment are the model-judgment layer on top. Keep the boundary explicit.'
        - id: analysis-codebase.sec.verdict
          title: Verdict — the intent-blind status read
          intent: The present / partial / absent grammar and its posture.
          rules:
            - id: analysis-codebase.intent-blind-waiver-blind
              labels: [verdict]
              class: floor
              text: >-
                The assessment is intent-blind and waiver-blind by design. Report what IS — the
                same codebase gets the same status regardless of anything the session later rules.
              anchor: 2026-08-10 validator-scope-and-verbosity
            - id: analysis-codebase.never-soften-never-waive
              labels: [verdict]
              class: floor
              text: >-
                Do not soften an `absent` to `partial` because the project "is young", and do not
                mark a category "waived" — waivers are governance rulings, not codebase facts.
              anchor: 2026-08-10 validator-scope-and-verbosity
            - id: analysis-codebase.only-report-what-is-found
              labels: [verdict, evidence]
              class: must
              text: >-
                Only report what is found — no inventing findings, no documenting assumptions,
                no assuming a framework without code-pattern evidence.
              anchor: 2026-07-25 skill-succinctness-strip
        - id: analysis-codebase.sec.output
          title: Output — the analysis artifact and what it seeds
          intent: >-
            The deliverable's production binding, envelope, completeness set, and downstream
            consumer.
          rules:
            - id: analysis-codebase.deliverable-two-arm-binding
              labels: [binding]
              class: must
              kind: binding
              text: >-
                The deliverable is `.mochiko/memory/codebase-analysis.md`, following the
                `codebase-analysis` schema — invoke `mochiko-cli template codebase-analysis`
                when the binary is available; otherwise Read
                `plugins/mochiko/schemas/codebase-analysis.yaml` raw.
              pointer: ../../schemas/codebase-analysis.yaml
              anchor: 2026-08-16 schema-based-template-guidance D8
            - id: analysis-codebase.artifact-envelope-slimmed-legible
              labels: [binding, reporting]
              class: must
              kind: binding
              text: 'The artifact follows the deliverable envelope (`artifact-format.md`) slimmed but legible: findings in tables with file-cited evidence, one line per check; the judgment prose (strengths, recommendations) stays prose — the G2 gate reader needs it.'
              pointer: ../../templates/artifact-format.md
            - id: analysis-codebase.brownfield-quality-checklist
              labels: [reporting, evidence]
              class: must
              kind: duty
              text: 'Before finalizing the analysis: project identity complete (name, language, framework, entry points) · directory structure documented with purposes · architecture pattern identified with evidence · naming conventions documented (files, variables, functions, classes) · all four Essential-Floor categories assessed present/partial/absent, file-cited · domain entities extracted with relationships · external dependencies documented · strengths to preserve identified (minimum 2–3) · inconsistencies documented with severity · recommendations provided for constitution focus · file paths cited for all findings · output written to `.mochiko/memory/codebase-analysis.md`.'
            - id: analysis-codebase.capability-signals-seed-feature-map
              labels: [binding]
              class: must
              kind: binding
              text: 'The extracted capability signals (routes, UI surfaces, services) seed setup''s feature-map reconstruction — map machinery: `mochiko:authoring-feature-map`.'
              pointer: mochiko:authoring-feature-map
        - id: analysis-codebase.sec.reserved
          title: Reserved — interpretation is the session's
          intent: What this analysis never decides.
          rules:
            - id: analysis-codebase.interpretation-reserved-to-session
              labels: [boundary]
              class: must
              kind: reservation
              text: >-
                Downstream, the setup session interprets the statuses against the asserted floor
                (an `absent` category becomes an open confrontation, resolved as a MUST-implement
                principle or a recorded waiver) — that interpretation belongs to the session and
                the constitution, never to this analysis.
              anchor: 2026-08-10 validator-scope-and-verbosity
  - op: import-document
    kind: skill
    name: authoring-architecture-store
    content:
      kind: skill
      skill: authoring-architecture-store
      vars:
        template: architecture-store
      conditions:
        delta:
          values: presence
          resolution: surface-presence
          note: an approved architecture-store delta existed for the landing feature.
        structure_built:
          values: presence
          resolution: surface-presence
          note: the built work changed structure.
        ruled_content:
          values: presence
          resolution: surface-presence
          note: >-
            ruled (non-derived) store content exists — a scaffold-only or absent store reads
            absent.
      sections:
        - id: authoring-architecture-store.sec.independence
          title: Independence — who grades a store write
          intent: The review leg a judgment write takes before the user's ruling.
          rules:
            - id: authoring-architecture-store.sound-loop-on-judgment-writes
              labels: [independence, floor-pointer]
              class: floor
              kind: binding
              text: >-
                Judgment writes — baseline authoring, shelf-walk stance batches, amendments, and
                every `As-built:`/`Drift:` write — take the independent review leg before the
                user's ruling, per `mochiko:patterns-sound-loop`; status flips and orphan cleanup
                are transcription and ride the landing audit. Do not relabel judgment as
                mechanical to skip the leg.
              pointer: mochiko:patterns-sound-loop
              anchor: 2026-08-19 product-architecture-schema
        - id: authoring-architecture-store.sec.scope
          title: Scope — what this skill routes away
          intent: The jurisdiction lines toward the sibling skills and the map machinery.
          rules:
            - id: authoring-architecture-store.diagram-craft-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Feature-level diagram craft — altitude, container-delta diagrams, which flows
                earn a sequence diagram — belongs to `mochiko:patterns-system-design`; the store
                says where a delta lands and what status it carries, never how to draw it.
            - id: authoring-architecture-store.stance-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Forming a stance — which stance a row takes, what walk order applies, what a
                floor card binds — belongs to `mochiko:patterns-architecture-shelves`; the store
                owns the field, that skill owns the judgment that fills it.
            - id: authoring-architecture-store.mint-routing
              labels: [boundary]
              class: must
              kind: routing
              text: 'Capabilities and work rows are never minted here — a fired upgrade trigger is flagged in the store and routed to the `/mochiko:feature` growth door: the architecture lens proposes; the map machinery disposes.'
        - id: authoring-architecture-store.sec.inputs
          title: Inputs — what a probe reads
          intent: The read duties and read bounds behind drift claims.
          rules:
            - id: authoring-architecture-store.drift-probe-scoped
              labels: [fence, evidence]
              class: must
              kind: bound
              text: >-
                The drift probe is scoped — rows touched since the last desk visit, plus a
                sample of the retrofit-expensive rows; never all rows every visit.
            - id: authoring-architecture-store.as-built-against-code
              labels: [evidence]
              class: floor
              kind: duty
              text: '`As-built:` claims are checked against actual code, never against recollection.'
        - id: authoring-architecture-store.sec.artifact
          title: Artifact — the store's binding grammar and write mechanics
          intent: >-
            What the store is, the shapes its content takes, and the duties every write carries.
          rules:
            - id: authoring-architecture-store.one-home-one-writer
              labels: [single-home, binding]
              class: floor
              text: >-
                One home. One writer. The product's architecture lives at
                `.mochiko/product/architecture/`, and every write to it goes through this skill.
              anchor: 2026-08-19 product-architecture-schema D3
            - id: authoring-architecture-store.store-layout
              labels: [binding, artifact-grammar]
              class: must
              kind: binding
              text: 'The store layout binds: `spine.md` (topology deep view) · `concerns.md` (the `AX-XXX` ledger) · `concerns/AX-XXX-<slug>.md` (graduated concerns) · the derived `ARCHITECTURE.md` index at the repo root — never inside the store directory.'
            - id: authoring-architecture-store.scope-line-durable-home
              labels: [single-home, artifact-grammar]
              class: must
              text: '`spine.md` opens with a `Scope:` line naming the surface types the store covers — shelf scope''s durable home: the shelf walk reads it rather than re-asking.'
            - id: authoring-architecture-store.element-grammar
              labels: [artifact-grammar]
              class: must
              text: >-
                Spine elements carry `SPN-XXX` (unique store-wide), a kind — `container` ·
                `boundary` · `flow` — a name, and a status; concern rows carry `AX-XXX` (unique
                store-wide), a name, a `Stance`, and a `Status`. Everything past that core is
                free-form — the schema constrains the skeleton, never the voice.
            - id: authoring-architecture-store.two-arm-schema-binding
              class: must
              kind: binding
              extends: authoring-common.two-arm-template
              anchor: 2026-08-16 schema-based-template-guidance D8
            - id: authoring-architecture-store.nfr-one-home
              labels: [single-home]
              class: must
              text: '`NFR-XXX` targets live on the concern row they belong to — one home per concern: stance, pattern, target, and as-built together. The ids survive unchanged, and each target names its business source, so `FR-XXX / SC-XXX → NFR-XXX` trace chains keep resolving.'
              anchor: 2026-08-19 product-architecture-schema D12
            - id: authoring-architecture-store.work-pointers-only
              labels: [artifact-grammar, single-home]
              class: must
              text: '`Work:` holds pointers only (`FEAT-XXX`, `EPIC-XXX`) — the work itself lives on the feature map.'
            - id: authoring-architecture-store.present-tense-no-history
              labels: [artifact-grammar]
              class: must
              text: >-
                Spine and rows are written in the present tense, with no history narration — the
                lifecycle statuses carry the change story. A row's own `Ruling` and `Rationale`
                belong on the row; rationale already living in a decision record or landing report
                is linked, never restated.
            - id: authoring-architecture-store.lifecycle-statuses
              labels: [artifact-grammar]
              class: must
              text: >-
                Five lifecycle statuses — `ruled` · `in-flight` · `modifying` · `removing` ·
                `built`; each in-flight-class element MUST name the `FEAT-XXX` that owns the
                change, and status is the build-lifecycle axis only — stance is a separate axis
                and never implies one.
            - id: authoring-architecture-store.full-ax-table
              labels: [artifact-grammar, evidence]
              class: must
              text: >-
                The index carries the spine thumbnail and the full AX summary table — every row.
                The sufficiency check and the design phase read the trip check there, so a missing
                row is an invisible row.
              anchor: 2026-08-19 product-architecture-schema D4
            - id: authoring-architecture-store.graduation-by-depth
              labels: [artifact-grammar]
              class: must
              text: >-
                A concern row earns its own file only on real depth — extend beats mint; when a
                row graduates, the ledger keeps it as a one-line summary plus a link, never losing
                the row.
            - id: authoring-architecture-store.landing-diff-on-delta
              labels: [evidence]
              class: floor
              kind: duty
              text: >-
                The landing diff fires because an approved delta existed for the feature —
                independent of what was built. Never gate the diff on whether structure was built.
              when: {delta: present}
              anchor: 2026-08-19 product-architecture-schema D10
            - id: authoring-architecture-store.diff-both-directions
              labels: [evidence]
              class: floor
              kind: duty
              text: >-
                The landing diff runs both directions — was every signed add, remove, redirect,
                and boundary-move actually built, AND was anything structural built that the
                signed delta did not carry. Grading built topology against the signed delta is a
                capability this duty owns, taking that delta as its input.
              anchor: 2026-08-19 product-architecture-schema D10
            - id: authoring-architecture-store.fold-duty
              labels: [artifact-grammar]
              class: must
              kind: duty
              text: 'The fold fires when the built work changed structure: flip in-flight-class elements to `built`, clear their `FEAT-XXX` keys, update `As-built:` and `Drift:` on every touched row, regenerate the index.'
              when: {structure_built: present}
              anchor: 2026-08-19 product-architecture-schema D10
            - id: authoring-architecture-store.orphan-rule
              labels: [artifact-grammar]
              class: must
              text: >-
                Every in-flight-class element keys an open feature; an element whose `FEAT-XXX`
                names a closed, retired, or nonexistent feature is an orphan — the health view
                flags it, and desk visits clean it.
              anchor: 2026-08-19 product-architecture-schema D10
            - id: authoring-architecture-store.first-visit-bootstrap
              labels: [evidence]
              class: must
              kind: duty
              text: >-
                The first desk visit to a repo with no ruled store content reconstructs one from
                what exists — read what the repo already says, reconstruct the spine and AX rows
                with every reconstructed element marked derived (never ruled), confirm with the
                user, and archive the absorbed sources to
                `.mochiko/archive/product-baselines/<date>/`. Never fails, never silently invents.
              when: {ruled_content: absent}
              anchor: 2026-08-19 product-architecture-schema D16
        - id: authoring-architecture-store.sec.output
          title: Output — the derived index and the health view
          intent: The projection every write regenerates and the bar it must clear.
          rules:
            - id: authoring-architecture-store.index-regenerated-every-write
              labels: [single-home]
              class: floor
              kind: duty
              text: >-
                The root `ARCHITECTURE.md` is a projection of the store, regenerated on every
                store write — this skill is its single writer. It is never hand-maintained, and
                index-vs-store disagreement is a defect fixed by regenerating, never by editing
                the index.
              anchor: 2026-08-19 product-architecture-schema D4
            - id: authoring-architecture-store.health-view-binding
              labels: [artifact-grammar, reporting]
              class: must
              kind: binding
              text: 'The health view is a section of the index and no separate artifact exists — five counts, each naming its rows: open rows (walked, no stance formed) · stale `not-now` triggers (deferrals whose revisit condition has gone unreviewed) · fired triggers awaiting routing · orphan elements · the drift register (rows whose `Drift:` field names a live divergence).'
            - id: authoring-architecture-store.readability-bar
              labels: [artifact-grammar]
              class: must
              kind: bound
              text: >-
                A reader new to the repo can place any file or component in the system from the
                index alone; an index too thin for that is regenerated with more of the spine,
                never padded with hand-written prose.
        - id: authoring-architecture-store.sec.reserved
          title: Reserved — the user's gates and dispositions
          intent: Decisions a run never takes on its own.
          rules:
            - id: authoring-architecture-store.sign-off-is-write-gate
              labels: [user-gate]
              class: floor
              kind: gate
              text: 'Ruled truth is never edited in place by a delivery run — a design-time write is legal only as an in-flight-class delta, and only after the user''s sign-off on the rendered diagram plus the named row changes: the sign-off IS the write gate. No sign-off, no store write.'
              anchor: 2026-08-19 product-architecture-schema D10
            - id: authoring-architecture-store.diff-user-dispositioned
              labels: [user-gate, reporting]
              class: floor
              kind: reservation
              text: >-
                The landing diff reports — each difference named, approved-versus-built, and
                dispositioned by the user; it never silently reconciles.
              anchor: 2026-08-19 product-architecture-schema D10
            - id: authoring-architecture-store.drift-user-disposition
              labels: [user-gate]
              class: floor
              kind: reservation
              text: >-
                Drift findings land in the row's `Drift:` field and take a user disposition at the
                desk — the store bends to the code, the code bends to the store, or the
                divergence is accepted and recorded; the probe reports, it never silently
                reconciles.
            - id: authoring-architecture-store.bootstrap-confirmation-gate
              labels: [user-gate]
              class: must
              kind: reservation
              text: >-
                The bootstrap confirmation is a real user gate, not a formality — a derived
                baseline inherits the brownfield caveat that a partial or wrong read poisons
                everything downstream. A pipeline run that meets a store with no ruled content
                offers the bootstrap rather than failing.
              anchor: 2026-08-19 product-architecture-schema D16
  - op: import-document
    kind: skill
    name: authoring-constitution
    content:
      kind: skill
      skill: authoring-constitution
      vars:
        template: governance-surfaces
        artifact: governance surface set
        grader: '`validation-constitution`'
      conditions:
        mode:
          values: [greenfield, brownfield, amend]
          resolution: entry-derived
          note: the authoring mode the driving command's brief names.
        synthesis:
          values: presence
          resolution: surface-presence
          note: a ratified `.mochiko/memory/governance-intent.md` exists.
        rules_file_in_set:
          values: presence
          resolution: surface-presence
          note: >-
            the authored surface set includes at least one `.claude/rules/mochiko/` rules file.
      sections:
        - id: authoring-constitution.sec.independence
          title: Independence — produced set, independent grade
          intent: Who grades the surface set, and the seat separation the grade rides on.
          rules:
            - id: authoring-constitution.independent-grade
              class: must
              kind: routing
              extends: authoring-common.independent-grade
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-constitution.never-co-mounted
              labels: [independence, boundary]
              class: must
              text: >-
                The grading validator runs as a separate agent, never co-mounted with this skill;
                the sequencing, the produce→validate→revise loop, and the human gates are
                owned by the command lead that drives this skill, not by this skill.
              anchor: 2026-07-25 skill-succinctness-strip
        - id: authoring-constitution.sec.scope
          title: Scope — what this skill never does
          intent: The jurisdiction lines away from grading, eliciting, and analyzing.
          rules:
            - id: authoring-constitution.grading-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Reviewing or grading an existing surface set is the independent validator's job
                (`validation-constitution`), run by a different agent.
            - id: authoring-constitution.eliciting-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Eliciting what governance should contain is the interrogation session's job
                (lead-conducted, upstream) — this skill formulates a ratified synthesis, it does
                not interview.
            - id: authoring-constitution.analysis-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Analyzing the codebase is `analysis-codebase`'s — run it first; brownfield mode
                consumes its output.
            - id: authoring-constitution.no-sync-section
              labels: [single-home]
              class: must
              text: 'The authored set carries no CLAUDE.md-synchronization section: governance lives ON CLAUDE.md — the sync-a-copy problem died with the dissolved artifact.'
            - id: authoring-constitution.roadmap-stub
              labels: [boundary]
              class: advisory
              text: >-
                Producing `evolution-roadmap.md` (the improvement plan) is the roadmap cluster's
                job, not ported yet — reference `.mochiko/memory/evolution-roadmap.md` as a
                documented stub.
        - id: authoring-constitution.sec.inputs
          title: Inputs — the synthesis and the content sources
          intent: >-
            What authoring consumes, where its principle material comes from, and the gate on a
            missing input.
          rules:
            - id: authoring-constitution.ratified-synthesis-only
              labels: [fence, boundary]
              class: floor
              text: >-
                Governance is authored from a ratified session synthesis —
                `.mochiko/memory/governance-intent.md`, produced by the setup lead's interrogation
                session and confirmed by the user before authoring begins. The synthesis owns
                selection (which principles, with which waivers and modules); this skill owns
                formulation (wording, enforcement mechanics, surface routing).
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-constitution.content-source-bindings
              labels: [binding]
              class: must
              kind: binding
              text: 'The content sources bind: the type-shelved principle deck (`references/catalog/`) · `references/ESSENTIAL-FLOOR.md` (the canonical four floor categories) · `references/COMPLIANCE-MODULES.md` (audit-evidence variants, attached via the synthesis''s fact profile) · `references/EMERGENT-CEILING-PATTERNS.md` (brownfield''s existing-pattern library).'
              pointer: references/catalog/README.md
            - id: authoring-constitution.missing-synthesis-stop
              labels: [fence]
              class: floor
              kind: gate
              text: >-
                A missing synthesis means say so and stop — authoring without it reproduces
                exactly the producer-decides-selection failure the synthesis exists to prevent.
              when: {synthesis: absent}
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-constitution.three-source-rule
              labels: [evidence]
              class: must
              text: >-
                Every principle's source is one of three per `references/catalog/README.md` —
                floor-asserted, deck-kept, or minted-tracing-to-elicited-intent — with every
                ruling recorded; a dropped card is a recorded ruling. Referenced, never restated.
              pointer: references/catalog/README.md
            - id: authoring-constitution.arbitrated-shelf-frame
              labels: [boundary]
              class: must
              text: >-
                The type shelves are arbitrated architecture opinion, dealt
                recommend-then-arbitrate — never asserted; the frame binds per
                `references/catalog/backend-service.md`. Referenced, never restated.
              pointer: references/catalog/backend-service.md
        - id: authoring-constitution.sec.artifact
          title: Artifact — the surface set's binding grammar
          intent: >-
            What the authored governance set is, how principles trace, route, and formulate, and
            the ownership fences on regeneration.
          rules:
            - id: authoring-constitution.no-constitution-file
              labels: [single-home]
              class: floor
              text: >-
                There is no `constitution.md` — governance lands on the surfaces Claude Code
                natively loads, each at its disclosure level.
              anchor: 2026-07-18 constitution-native-surfaces
            - id: authoring-constitution.surface-set-binding
              labels: [binding]
              class: must
              kind: binding
              text: 'The surface set binds: the `CLAUDE.md` governance region (between `<!-- mochiko:governance:begin -->` / `<!-- mochiko:governance:end -->`) · `.claude/rules/mochiko/*.md` scope-bound rules files · skill pointers · `.mochiko/memory/governance-ledger.md`.'
            - id: authoring-constitution.every-principle-traces
              labels: [evidence]
              class: floor
              kind: duty
              text: 'Every authored principle carries its GI trace — on `CLAUDE.md` as an HTML comment beside the line, and always in the ledger as the `GI-XXX (floor-asserted: CARD-ID | deck-kept: CARD-ID | minted | module: <module>-<obligation>)` key, the canonical trace record.'
            - id: authoring-constitution.realized-or-flagged
              labels: [evidence]
              class: floor
              text: >-
                Every principle-bearing synthesis element becomes a principle on some surface, or
                is surfaced as a flagged proposal — never silently dropped.
            - id: authoring-constitution.universal-routing
              labels: [artifact-grammar]
              class: must
              kind: routing
              text: >-
                Universal principles (governing every session's work) land as short imperative
                lines in the `CLAUDE.md` region — one to a few lines each, detail and metadata
                to the ledger; the always-on budget is the scarcest resource. Universal principles
                never route to unconditional rules files — rules delivery to spawned producers
                cannot be assumed, while `CLAUDE.md` is doc-confirmed for every spawn path.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-constitution.scope-bound-routing
              labels: [artifact-grammar]
              class: must
              kind: routing
              text: 'Scope-bound principles land as a `paths`-scoped rules file under `.claude/rules/mochiko/` — one concern per file, operative rules in the body, `paths` globs covering every path whose code can violate the concern, tested with the per-layer violation test (worked reasoning and the kinako example: the template''s Shape 2 preamble).'
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-constitution.rules-inject-on-read-caveat
              labels: [artifact-grammar]
              class: must
              kind: duty
              text: >-
                Rules files inject on Read, not Write — whenever the set includes any rules
                file, emit the region's standing new-file read line, naming the actual scoped
                paths (Shape 1 carries the line and its observed-behavior wording).
              when: {rules_file_in_set: present}
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-constitution.procedure-shaped-routing
              labels: [artifact-grammar]
              class: must
              kind: routing
              text: >-
                Procedure-shaped standards route to a pointer at the skill that carries the
                procedure — the index line names it; mint a new skill only for a session-minted
                procedure.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-constitution.two-modes-one-core
              labels: [artifact-grammar]
              class: must
              text: >-
                Two modes, one shared core authored once, identically, in both — greenfield
                formulates the synthesis's deck rulings and minted intents; brownfield codifies
                what already exists and requires `.mochiko/memory/codebase-analysis.md` (produced
                upstream by `analysis-codebase`). Floor cards are authored at the row the
                synthesis's declared depth level selects.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-constitution.two-arm-schema-binding
              class: must
              kind: binding
              extends: authoring-common.two-arm-template
              anchor: 2026-08-16 schema-based-template-guidance D8
            - id: authoring-constitution.markers-only-regeneration
              labels: [fence]
              class: floor
              text: >-
                Regenerate only what sits between the governance markers — user content outside
                them is untouchable. Rules files and the ledger are setup-owned and regenerated
                whole, except the two preserved blocks.
              anchor: 2026-07-18 constitution-native-surfaces D8
            - id: authoring-constitution.preserved-blocks
              labels: [fence]
              class: floor
              text: >-
                The preserved blocks — the `mochiko:domain-registry` block and the
                `mochiko:output-style` switch line, plus any line the user added to the Shape-5
                output-style rules file — are read from the existing values and re-emitted
                unchanged; regenerating the defaults over them silently reverts the user's own
                settings. The style line is written default-on only when the region is first
                authored.
              anchor: 2026-07-18 constitution-native-surfaces D8
            - id: authoring-constitution.amend-preserves-verbatim
              labels: [artifact-grammar]
              class: must
              text: >-
                Amend preserves untouched principles verbatim (their GI-IDs are stable) and bumps
                the region's semver; a `.mochiko/memory/constitution.md` on disk is superseded —
                the lead deletes it, never author into it.
              when: {mode: amend}
              anchor: 2026-07-18 constitution-native-surfaces D8
            - id: authoring-constitution.three-part-rule
              labels: [artifact-grammar]
              class: floor
              text: >-
                Every principle carries three components, recorded in its ledger entry —
                Enforcement (how compliance is verified), Testability (what pass/fail looks like),
                Rationale (why the constraint exists); a principle without all three is incomplete
                and is not accepted.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-constitution.enforcement-fits-team-reality
              labels: [evidence]
              class: must
              text: >-
                Enforcement MUST fit the team reality recorded in the synthesis — a solo project
                cannot lean on "code review MUST verify"; give it tooling and CI instead. Native
                surfaces are context, not enforcement — the teeth are CI, hooks, review, audit.
            - id: authoring-constitution.operative-constraint-only
              labels: [single-home]
              class: must
              text: >-
                The surface (region line or rules-file rule) carries the operative constraint only
                — RFC 2119 keywords, short, GI trace comment; the ledger carries the full
                Three-Part record keyed by GI-ID. Both shapes live in the `governance-surfaces`
                schema (the Shape 1 line, the Shape 3 record) and are never restated.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-constitution.floor-categories-accounted
              labels: [artifact-grammar]
              class: floor
              text: >-
                Every governance set accounts for all four Essential Floor categories — with a
                principle or a recorded waiver; a floor category with neither is a defect in
                either mode. A `high`-only check absent at `low` is not a missing category — its
                category is still present through its other rows.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-constitution.waivers-authored-not-skipped
              labels: [artifact-grammar]
              class: floor
              text: >-
                A waived standard gets a waiver record in the ledger — standard, justification,
                optional revisit trigger, trace; permanent pending the D4.1 revisit, and
                legal-mandate module obligations are never waivable (D4.2). Absence is always
                deliberate and auditable.
              anchor: 2026-08-11 production-floor-adaptive-depth
            - id: authoring-constitution.brownfield-ceiling-test
              labels: [evidence]
              class: must
              text: >-
                Codify only patterns that are intentionally good — "Would I recommend this for a
                new project?"; if no, it is technical debt, not ceiling. A ceiling pattern no
                synthesis element sanctions is a flagged proposal, and ceiling principles trace
                like any other.
              when: {mode: brownfield}
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-constitution.evolution-notes-always-brownfield
              labels: [artifact-grammar]
              class: must
              text: >-
                The `evolution-notes` module attaches always in brownfield — future maintainers
                must be able to tell codified-existing-capability from aspirational MUST-implement
                targets; that distinction lives in its ledger section.
              when: {mode: brownfield}
            - id: authoring-constitution.essential-floor-canonical-home
              labels: [single-home, artifact-grammar]
              class: must
              kind: duty
              text: >-
                The four floor categories' canonical definition and their MUST-address check sets
                live in `references/ESSENTIAL-FLOOR.md` — edited there, nowhere else;
                referenced, never restated.
              pointer: references/ESSENTIAL-FLOOR.md
            - id: authoring-constitution.depth-dial-breadth-invariant
              labels: [artifact-grammar]
              class: must
              text: >-
                The two-row `low`/`high` depth form and the breadth invariant bind per
                `references/ESSENTIAL-FLOOR.md` — referenced, never restated.
              pointer: references/ESSENTIAL-FLOOR.md
              anchor: 2026-08-11 production-floor-adaptive-depth D1
            - id: authoring-constitution.floor-doctrine
              labels: [artifact-grammar]
              class: must
              text: 'The floor doctrine binds per `references/catalog/universal-floor.md`: one project-wide depth level, user-declared, one-way `low`→`high`, no watcher; the `low` row sits on the retrofit-cost cut line. Referenced, never restated.'
              pointer: references/catalog/universal-floor.md
              anchor: 2026-08-11 production-floor-adaptive-depth D5
            - id: authoring-constitution.floor-cards-content-sets
              labels: [artifact-grammar]
              class: must
              kind: duty
              text: >-
                The four FLOOR cards' two-row content sets and per-category waiver postures bind
                per `references/catalog/universal-floor.md` — authored at the declared level's
                row; referenced, never restated.
              pointer: references/catalog/universal-floor.md
              anchor: 2026-08-11 production-floor-adaptive-depth
            - id: authoring-constitution.module-mechanical-attachment
              labels: [artifact-grammar]
              class: must
              text: >-
                Compliance modules attach mechanically from the fact profile — fact-triggered,
                never from appetite — additive-only and level-blind, per
                `references/COMPLIANCE-MODULES.md`. Referenced, never restated.
              pointer: references/COMPLIANCE-MODULES.md
              anchor: 2026-08-11 production-floor-adaptive-depth D7
            - id: authoring-constitution.s4-fail-safe
              labels: [evidence]
              class: must
              kind: duty
              text: >-
                The S4 fail-safe binds per `references/COMPLIANCE-MODULES.md` — named
                elicitation, consequence-stated confirmation, the brownfield cross-check
                confronted in the open, the temporal backstop — and a compliance amend event is
                MAJOR. Referenced, never restated.
              pointer: references/COMPLIANCE-MODULES.md
            - id: authoring-constitution.domain-dependency-admissibility
              labels: [evidence]
              class: must
              text: >-
                Domain-dependency admissibility binds per `references/DOMAIN-DEPENDENCIES.md` —
                both criteria, domain-relevance filters first, the trust level cited, pointers
                re-verified never snapshots. Referenced, never restated.
              pointer: references/DOMAIN-DEPENDENCIES.md
              anchor: 2026-07-21 domain-dependency-allowlist
        - id: authoring-constitution.sec.output
          title: Output — what every governance set ships
          intent: The mandatory content the set carries and the closure the validator checks.
          rules:
            - id: authoring-constitution.trace-summary-in-output
              labels: [reporting]
              class: must
              kind: duty
              text: >-
                The trace summary — the manifest mapping every GI element to its primary
                enforceable home plus companion entries, and every surface element back to its GI
                element — is emitted as part of the output, not as an afterthought; the
                independent validator grades trace closure over it.
            - id: authoring-constitution.index-and-ledger-closure
              labels: [evidence]
              class: must
              kind: duty
              text: >-
                Every principle, regardless of home, gets an index line in the region and a ledger
                entry (Three-Part + trace); index → home → ledger must close, and the
                validator checks it.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-constitution.region-content-set
              labels: [artifact-grammar]
              class: must
              kind: duty
              text: 'The region carries: the ratified stamp (version · ratified date · floor · declared depth level · attached modules, semver per the template''s amendment policy — Shape 3) · the principle index (one line per principle, pointer to its home when the home is not the region) · the universal principles as short imperative lines, floor principles first and marked `(NON-NEGOTIABLE)`, each authored at the row the declared depth level selects (a `high`-only check is absent at `low`) · the technology stack from the synthesis''s real-commands and existing-practices elements, brownfield populating from the codebase analysis.'
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-constitution.quality-gates-actual-commands
              labels: [artifact-grammar, evidence]
              class: must
              kind: duty
              text: >-
                The quality-gates summary carries the blocking checks with actual commands, never
                placeholder tokens; coverage pre-seeds from the FLOOR-TEST card's threshold unless
                the session overrode it, and gates for waived categories are omitted — the
                waiver record covers the absence.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-constitution.output-style-file-every-run
              labels: [artifact-grammar]
              class: must
              kind: duty
              text: 'One unconditional rules file ships every run, routed from no principle: the output-style rules file per the template''s Shape 5, scoped over the deliverable-authoring paths — edit-time reinforcement of the register, never the carrier that reaches creates.'
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-constitution.ledger-riders-and-trace-manifest
              labels: [artifact-grammar]
              class: must
              kind: duty
              text: 'The ledger ships its sections per the template''s Shape 3, with the riders: the waiver table says "None." when nothing is waived · every waiver carries its recorded justification per the D4 model · legal-mandate module obligations are never waived (D4.2) · fact-profile changes (module attach/detach) and un-waives are governance events routed back through setup''s amend mode.'
              anchor: 2026-07-25 skill-succinctness-strip
        - id: authoring-constitution.sec.reserved
          title: Reserved — selection is never this seat's
          intent: Decisions the synthesis and the user own.
          rules:
            - id: authoring-constitution.no-unsanctioned-selection
              labels: [user-gate]
              class: floor
              text: 'No unsanctioned selection: never add, remove, merge, or reinterpret principles beyond the synthesis. A genuine problem — a contradiction, a missing principle the project clearly needs, elicited intent that resists enforceable formulation — becomes a flagged proposal (what you propose, why, and which synthesis element it touches), ruled on by the user at the acceptance gate; never a silent fix, never authored vagueness.'
            - id: authoring-constitution.never-route-unselected-modules
              labels: [user-gate]
              class: floor
              text: >-
                Never route module content the synthesis didn't select — an unselected module
                attached "to be safe" is unsanctioned selection. Modules attach per the
                synthesis's module selections, their content routed by surface like everything
                else, and each module's validator checklist fragment applies to its routed
                content.
            - id: authoring-constitution.domain-dependency-growth-gate
              labels: [user-gate]
              class: must
              kind: gate
              text: >-
                Registry growth takes an explicit ruling BEFORE the entry per
                `references/DOMAIN-DEPENDENCIES.md` — the cycle checkpoint MUST NOT auto-approve
                while `domain_deps_added` is non-empty, and the registry lives only in the marked
                block, preserved verbatim. Referenced, never restated.
              pointer: references/DOMAIN-DEPENDENCIES.md
              anchor: 2026-07-21 domain-dependency-allowlist
  - op: import-document
    kind: skill
    name: authoring-epic
    content:
      kind: skill
      skill: authoring-epic
      vars:
        artifact: epic
        grader: the cluster reviewers of the design-phase and implement runs that consume it
      sections:
        - id: authoring-epic.sec.independence
          title: Independence — never grades its own output
          intent: Who grades what the epic run produces.
          rules:
            - id: authoring-epic.independent-grade
              class: must
              kind: routing
              extends: authoring-common.independent-grade
        - id: authoring-epic.sec.scope
          title: Scope — the epic object and nothing else
          intent: What this skill single-sources, and the jurisdiction lines away from it.
          rules:
            - id: authoring-epic.single-sources-epic-shape
              labels: [single-home, boundary]
              class: must
              text: >-
                This skill single-sources the epic's shape — the manifest and spine files, the
                mint/overlap guard, and close semantics; the commands that consume it
                (`implement`, `feature`, `specify`) reference this skill and never restate it.
            - id: authoring-epic.map-grammar-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                The `[EPIC-XXX]` row marker and within-epic seam-owner bookkeeping are
                `mochiko:authoring-feature-map`'s — this skill names the seam owner in the
                spine, the map writes it.
            - id: authoring-epic.run-mechanics-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Gate shapes, cycle sequencing, and landing steps live in `implement.md` — this
                skill authors the epic object and single-sources only what the run consumes.
            - id: authoring-epic.transport-routing
              labels: [boundary, floor-pointer]
              class: must
              kind: routing
              text: >-
                Worktree isolation vs single pen-holder is `mochiko:patterns-transport-floor`'s
                composition steer — referenced, never restated.
              pointer: mochiko:patterns-transport-floor
            - id: authoring-epic.delta-batching-parked
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Batching delta-scope cards or non-feature product-lane work is a parked open
                thread — not epic scope.
            - id: authoring-epic.specify-proposes-never-mints
              labels: [boundary]
              class: must
              text: '`/mochiko:specify` selection may propose an epic when one derivation spans capabilities — it never mints one.'
        - id: authoring-epic.sec.inputs
          title: Inputs
          intent: Read duties this skill would carry before authoring.
          note: 'Deliberately empty — no input-side obligation exists at census grain (census-authoring §B: inputs 0).'
          rules: []
        - id: authoring-epic.sec.artifact
          title: Artifact — the epic's binding grammar and write mechanics
          intent: Identity, the two faces, the spine's contents, and the mint discipline.
          rules:
            - id: authoring-epic.identity-grammar
              labels: [artifact-grammar]
              class: must
              text: Epic identity is `EPIC-XXX` — sequential, the same id family as `FEAT-XXX`.
            - id: authoring-epic.one-type-two-faces
              labels: [artifact-grammar]
              class: must
              text: >-
                One epic type, two faces — the manifest is the product view, the spine is the
                tech view the implement run consumes; there is no product/tech split into separate
                epic types.
            - id: authoring-epic.transient-role
              labels: [artifact-grammar]
              class: floor
              text: 'The epic''s role is transient: at delivery the member rows fold into their capabilities'' extents and the epic closes, while the directory persists as readable record — never as a living map layer. The map stays two-typed (durable capabilities + transient work rows); an epic is not a third type.'
              anchor: 2026-08-14 multi-feature-plan-implement D3
            - id: authoring-epic.home-directory-is-registry
              labels: [binding, single-home]
              class: must
              kind: binding
              text: >-
                Home is `.mochiko/epics/EPIC-XXX/`; no separate epics index exists — the
                directory is the registry, and the `/mochiko:feature` desk lists it.
            - id: authoring-epic.design-phase-always-fires
              labels: [artifact-grammar]
              class: floor
              text: >-
                An epic run always fires the design phase for the joint spine — one design-phase
                plan over all members (spine artifacts + each member's artifact list) — whatever
                the sufficiency verdict said.
              anchor: 2026-08-26 plan-stage-utility D1
            - id: authoring-epic.one-signed-store-delta
              labels: [artifact-grammar, user-gate]
              class: floor
              text: >-
                The epic's joint architecture output is one signed store delta for the whole epic
                — rendered once, signed off once.
              anchor: 2026-08-19 product-architecture-schema D10
            - id: authoring-epic.seam-owner-named
              labels: [artifact-grammar]
              class: must
              text: >-
                Each cross-member seam names its owner explicitly in the spine — members land
                simultaneously, so no later-lander default applies; the assignment lives in the
                spine, and the map writes it at close.
              anchor: 2026-08-14 multi-feature-plan-implement D13
            - id: authoring-epic.ordering
              labels: [artifact-grammar]
              class: must
              text: 'Ordering: shared-foundation first, then in-epic dependency order.'
            - id: authoring-epic.member-deltas-stay-per-feature
              labels: [single-home]
              class: must
              text: >-
                Per-feature design deltas stay in each member's `.mochiko/features/FEAT-XXX/` dir,
                linked from the manifest — downstream machinery keeps reading the per-feature
                dirs it already reads.
            - id: authoring-epic.shared-baseline-single-pen-holder
              labels: [artifact-grammar, single-home]
              class: floor
              text: >-
                A product baseline touched by two or more members gets one joint delta authored in
                the spine under a single pen-holder; a baseline touched by one member keeps its
                per-feature delta. The landing folds each baseline exactly once — spine delta
                for shared baselines, feature delta otherwise.
              anchor: 2026-08-14 multi-feature-plan-implement D10
            - id: authoring-epic.transport-floor-binding
              labels: [binding, floor-pointer]
              class: must
              kind: binding
              text: 'The transport floor''s composition steer governs every epic shared-write surface — spine files and shared baseline deltas: concurrent writers get worktree isolation or a single pen-holder, disclosed at run open.'
              pointer: mochiko:patterns-transport-floor
            - id: authoring-epic.mint-once
              labels: [single-home]
              class: floor
              text: 'Mint-once: every workflow resolves `EPIC-XXX` by lookup — re-minting does not exist.'
              anchor: 2026-08-14 multi-feature-plan-implement D4
            - id: authoring-epic.one-open-epic-per-pending-rows
              labels: [single-home]
              class: floor
              text: A feature's pending rows belong to at most one open epic at a time.
              anchor: 2026-08-14 multi-feature-plan-implement D4
            - id: authoring-epic.implement-resolves-by-lookup
              labels: [artifact-grammar]
              class: must
              text: An implement run resolves its `EPIC-XXX` by lookup and mints nothing.
              anchor: 2026-08-26 plan-stage-utility D4
            - id: authoring-epic.selection-scope-only
              labels: [artifact-grammar]
              class: floor
              text: >-
                Every member enters as selection scope — a spec-accepted selection or growth
                rows; delta-scope cards (bug/improvement deltas on delivered capabilities) cannot
                join an epic.
              anchor: 2026-08-14 multi-feature-plan-implement D11
        - id: authoring-epic.sec.output
          title: Output — the manifest and the close
          intent: What the epic emits and how it lands.
          rules:
            - id: authoring-epic.manifest-required-fields
              labels: [artifact-grammar]
              class: must
              kind: binding
              text: '`manifest.md` carries: members — each `FEAT-XXX` linked to its `.mochiko/features/FEAT-XXX/` dir · status — `open` / `delivered` / `closed-partial` · the why-together line — the relatedness stated at the desk mint that opened it.'
            - id: authoring-epic.close-semantics
              labels: [artifact-grammar]
              class: must
              kind: duty
              text: 'One acceptance landing executes each member''s graduation batch plus the epic close: the `[EPIC-XXX]` markers vanish with the folded rows, the manifest is stamped `delivered` and dated, and the directory stays in place as record — no move, no trail file.'
        - id: authoring-epic.sec.reserved
          title: Reserved — the desk's door, the user's rulings
          intent: Decisions no run takes on its own.
          rules:
            - id: authoring-epic.desk-only-mint-door
              labels: [user-gate, single-home]
              class: floor
              text: >-
                The `/mochiko:feature` desk owns the epic's life — mint, membership change,
                status view, close — and is the only mint door.
              anchor: 2026-08-26 plan-stage-utility D4
            - id: authoring-epic.overlap-surfaces-to-user
              labels: [user-gate]
              class: floor
              kind: reservation
              text: 'A mint resolves against open epics first: any membership overlap with an existing epic surfaces to the user — join it, or rule on the overlap — never a silent duplicate.'
              anchor: 2026-08-14 multi-feature-plan-implement D4
            - id: authoring-epic.halt-disposition-user-owned
              labels: [user-gate]
              class: floor
              kind: reservation
              text: 'A member that exhausts its attempt bound or hits the no-progress stop halts member-scoped; the disposition — carve the member out (its rows return to `pending`, the epic continues, manifest status `closed-partial`) or hold the whole run — is reserved to the user, never the lead''s: carve-out breaks the one-unit promise.'
              anchor: 2026-08-14 multi-feature-plan-implement D7
  - op: import-document
    kind: skill
    name: authoring-feature-map
    content:
      kind: skill
      skill: authoring-feature-map
      vars:
        template: features-index
        artifact: derivation and map delta
        grader: '`mochiko:review-specifications`'
      sections:
        - id: authoring-feature-map.sec.independence
          title: Independence — author, never grader
          intent: Who grades the produced map artifacts, and never this seat.
          rules:
            - id: authoring-feature-map.independent-grade
              class: must
              kind: routing
              extends: authoring-common.independent-grade
        - id: authoring-feature-map.sec.scope
          title: Scope — the map's jurisdiction
          intent: What this skill authors, what it routes, and the altitude it never crosses.
          rules:
            - id: authoring-feature-map.stories-inform-never-define
              labels: [boundary]
              class: must
              text: >-
                Stories inform which capabilities exist and sharpen their extents; they never
                define them.
              anchor: 2026-08-13 pm-role-and-feature-derivation D1
            - id: authoring-feature-map.discipline-single-home
              labels: [boundary, floor-pointer]
              class: must
              kind: binding
              text: >-
                The derivation discipline — the capability tests, extend-beats-mint, the soft
                cap, merge mechanics, and domains — lives in `mochiko:patterns-map-minimalism`,
                referenced never restated; this skill authors what that discipline rules in.
              pointer: mochiko:patterns-map-minimalism
              anchor: 2026-08-13 pm-role-and-feature-derivation D4
            - id: authoring-feature-map.map-side-altitude
              labels: [boundary]
              class: must
              text: >-
                A work row is a map-side increment; the product-baseline deltas under
                `.mochiko/product/` (the appliable before/after form) are a different altitude —
                implement's surface, untouched here.
              anchor: 2026-08-10 feature-sizing-and-entry-points D9
            - id: authoring-feature-map.stories-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Authoring or rewriting user stories is `mochiko:authoring-user-stories`; entries
                trace stories by ID, and a story that fits no capability is a filter verdict, not
                a rewrite.
            - id: authoring-feature-map.architecture-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Architecture is not authored here — the entry links to the store's spine
                components and never restates the component view.
            - id: authoring-feature-map.backlog-boundary
              labels: [boundary]
              class: must
              kind: routing
              text: 'Defects, tooling, and process work live in `BACKLOG.md` where KM exists (a non-KM product has no queue; lane runs accept direct requests — the stated degrade path, never silently assumed away). Extent-growth improvement ideas are the exception: they ride the map as pending work rows or obligation lines — the map is the capability backlog.'
              anchor: 2026-08-10 feature-sizing-and-entry-points D13
        - id: authoring-feature-map.sec.inputs
          title: Inputs — read before you build on it
          intent: The read duties owed before deriving against live or reconstructed territory.
          rules:
            - id: authoring-feature-map.in-flight-territory-read
              labels: [fence, evidence]
              class: must
              kind: duty
              text: >-
                In-flight territory obligates a read into the owning run's artifacts — build
                against the planned contract or escalate a conflict, never contradict silently.
              anchor: 2026-08-10 feature-map-layer D19
            - id: authoring-feature-map.reconstructed-reverify
              labels: [evidence]
              class: must
              kind: duty
              text: >-
                First touch of a reconstructed entry re-verifies it against the code before
                building on it.
              anchor: 2026-08-10 feature-map-layer D12
        - id: authoring-feature-map.sec.artifact
          title: Artifact — the map's binding grammar
          intent: >-
            The row types, invariants, write mechanics, and density the living map is held to.
          rules:
            - id: authoring-feature-map.letter-is-spirit
              class: floor
              extends: authoring-common.letter-is-spirit
              anchor: 2026-08-10 validator-scope-and-verbosity
            - id: authoring-feature-map.capability-work-row
              labels: [artifact-grammar]
              class: floor
              text: 'The map holds one surface, two row types. A capability is the durable entry — the only thing called a feature: what the product does, in the system''s own language.'
              anchor: 2026-08-13 pm-role-and-feature-derivation D2
            - id: authoring-feature-map.work-rows-transient
              labels: [artifact-grammar]
              class: floor
              text: >-
                A work row is a transient delivery increment under its capability — story-shaped
                allowed, never a standing feature; at its delivery landing it folds into the
                capability's extent and vanishes.
              anchor: 2026-08-13 pm-role-and-feature-derivation D2
            - id: authoring-feature-map.frame-first
              labels: [artifact-grammar]
              class: must
              text: 'Derivation is frame-first: before any story is drafted, the product frame names the capabilities the territory touches as a hypothesis — nouns and verbs only, never a list of stories — and stories are authored inside it; where a story and the frame conflict, the story wins and the frame adjusts.'
              anchor: 2026-08-13 pm-role-and-feature-derivation D5
            - id: authoring-feature-map.one-living-map
              labels: [binding, single-home]
              class: must
              kind: binding
              text: 'There is one living map, no per-spec copy: a succinct repo-root `FEATURES.md` index — one line per capability, work rows as sublines — over per-capability entry files at `.mochiko/features/FEAT-XXX-<slug>.md`.'
              anchor: 2026-08-10 feature-map-layer D5
            - id: authoring-feature-map.features-index-two-arm
              class: must
              kind: binding
              extends: authoring-common.two-arm-template
              anchor: 2026-08-16 schema-based-template-guidance D8
            - id: authoring-feature-map.feature-entry-two-arm
              labels: [binding]
              class: must
              kind: binding
              text: 'The per-capability entry shape is the `feature-entry` schema: invoke `mochiko-cli template feature-entry` when the binary is available; otherwise Read `plugins/mochiko/schemas/feature-entry.yaml` raw.'
              anchor: 2026-08-16 schema-based-template-guidance D8
            - id: authoring-feature-map.four-touchpoints
              labels: [artifact-grammar]
              class: must
              text: >-
                The map has four touchpoints. Specify proposes — frame at intent, then
                confirm-frame, cut rows, filter, and selection after stories. The design phase
                confirms and hardens alongside architecture — on a zero-gap verdict, where no
                design phase runs, the card-authoring seat performs the dependency and extent
                assertion instead. Implement's acceptance landing folds delivered rows into extent
                — status and index edits are bookkeeping inside that landing, never a separate
                close stage. `/mochiko:feature` stewards — stub minting, retire, integrity
                grooming, and the growth door that cuts rows on existing capabilities.
              anchor: 2026-08-26 plan-stage-utility D1
            - id: authoring-feature-map.envelope-binding
              class: must
              kind: binding
              extends: authoring-common.envelope-binding
            - id: authoring-feature-map.map-density
              labels: [artifact-grammar]
              class: must
              kind: bound
              text: >-
                Capability statements run 1–3 lines; extent, work-row, and obligation entries
                one line each — a record, not an essay.
            - id: authoring-feature-map.one-home
              labels: [artifact-grammar, single-home]
              class: floor
              text: 'Exactly one home: every accepted story maps to exactly one capability; other capabilities it touches carry extend obligations on their entries — never a second home.'
              anchor: 2026-08-13 pm-role-and-feature-derivation D2
            - id: authoring-feature-map.complete-disposition
              labels: [artifact-grammar]
              class: floor
              text: 'Complete disposition: every drafted story is either homed to a capability or rejected by the filter with the why recorded in the story file — no silent drops, no orphans.'
              anchor: 2026-08-13 pm-role-and-feature-derivation D2
            - id: authoring-feature-map.row-level-closure
              labels: [artifact-grammar]
              class: floor
              text: 'Dependency closure runs at the row level: a selected work row must be buildable given only the rows ordered before it, per the map''s relations; a row in one capability depending on a row in another orders those two capability-batch runs; no forward dependencies.'
              anchor: 2026-08-13 pm-role-and-feature-derivation D7
            - id: authoring-feature-map.map-owns-status
              labels: [artifact-grammar, single-home]
              class: floor
              text: >-
                The map owns status. Capability status is `proposed / in-flight / delivered /
                retired` — one home, no copies; work rows carry a delivery state (`pending` /
                `live`), not a status of their own; story files derive status by following their
                FEAT-ID, and the only story-native status is `rejected`.
              anchor: 2026-08-13 pm-role-and-feature-derivation D2
            - id: authoring-feature-map.delivered-sticky-rows-fold
              labels: [artifact-grammar]
              class: floor
              text: >-
                Delivered is sticky; delivered rows fold. A `live` work row folds into its
                capability's extent at its delivery landing, then vanishes; a `pending` row
                persists on the entry as open obligation — deferred work never silently
                disappears; a `delivered` capability keeps its status while it carries live rows,
                the change riding on the row until its landing folds it — status never
                regresses.
              anchor: 2026-08-13 pm-role-and-feature-derivation D2
            - id: authoring-feature-map.retired-terminal
              labels: [artifact-grammar]
              class: floor
              text: '`retired` is terminal: entry kept, dated, provenance intact — never deleted. An epic member''s pending or live work row carries an inline `[EPIC-XXX]` marker that vanishes with the row at its graduation fold.'
              anchor: 2026-08-10 feature-map-layer
            - id: authoring-feature-map.capability-writes-sacred
              labels: [artifact-grammar, user-gate]
              class: floor
              text: 'Capability writes are sacred: minting, merging, retiring, or changing a capability''s status lands only through specify or a user grooming ruling, never as desk bookkeeping. Cutting work rows is delivery bookkeeping the desk may do; `/mochiko:feature` stewardship writes — stub minting, retire, grooming fixes — land directly.'
              anchor: 2026-08-13 pm-role-and-feature-derivation D8
            - id: authoring-feature-map.acceptance-batch
              labels: [artifact-grammar]
              class: floor
              text: >-
                During a run, proposed entries and cut rows live in the spec workspace; the
                delivery-status write (in-flight flips, row folds) is one atomic batch at that
                work's acceptance landing, and a rejected spec never touched the map. Reads happen
                any time.
              anchor: 2026-08-10 feature-sizing-and-entry-points
            - id: authoring-feature-map.integrity-fix-on-sight
              labels: [artifact-grammar, evidence]
              class: floor
              kind: duty
              text: 'Map integrity is fixed on sight: no dangling FEAT-IDs; index lines and entry files agree on status; every work row names its spec or lane run; every `live` row or `in-flight` status points at an open spec or a live lane run — live from dispatch until its acceptance landing. A row whose run ended without folding, a closed spec still pointed at, and a specs-index row contradicting the map are defects.'
              anchor: 2026-08-13 pm-role-and-feature-derivation D6
            - id: authoring-feature-map.entries-index-never-rewrite
              labels: [artifact-grammar, single-home]
              class: floor
              text: 'Entries index, never rewrite: story trace and SC references cite IDs; the spec''s own sections stay the single source of their text.'
              anchor: 2026-08-13 pm-role-and-feature-derivation D6
            - id: authoring-feature-map.growth-rides-work-row
              labels: [artifact-grammar]
              class: must
              text: >-
                Growth on a delivered capability rides a marked work row, never an in-place edit.
              anchor: 2026-08-13 pm-role-and-feature-derivation D8
            - id: authoring-feature-map.pre-acceptance-workspace
              labels: [artifact-grammar]
              class: must
              text: >-
                Pre-acceptance derivation is unratified thought — it stays in the spec
                workspace, never written to the live map.
              anchor: 2026-08-10 feature-map-layer D5
            - id: authoring-feature-map.phase-row-stands-alone
              labels: [artifact-grammar]
              class: must
              text: >-
                A work row cut as a phase must stand alone as a working increment, never a
                horizontal layer.
              anchor: 2026-08-10 pm-requirements-stacking
            - id: authoring-feature-map.stubs-are-hypotheses
              labels: [artifact-grammar]
              class: must
              text: >-
                Stubs are unratified hypotheses — never derive from stub text; derive from
                stories and let a match be confirmation. A pre-filled stub fakes ratification and
                anchors the deriver on unratified text.
              anchor: 2026-08-10 pm-requirements-stacking D2
            - id: authoring-feature-map.selectability-specify-only
              labels: [artifact-grammar]
              class: floor
              text: >-
                Selectability is specify-derivation-only; `/mochiko:feature` parks and grooms,
                never matures — no stub is matured or made selectable outside specify's
                derivation.
              anchor: 2026-08-10 pm-requirements-stacking D2a
            - id: authoring-feature-map.stub-dependency-unverified
              labels: [artifact-grammar, evidence]
              class: must
              text: >-
                A stub dependency is flagged-unverified judgment, never an asserted map relation
                — stubs have no shape to verify.
              anchor: 2026-08-10 pm-requirements-stacking D4
            - id: authoring-feature-map.sc-mapping
              labels: [artifact-grammar]
              class: must
              text: >-
                Every SC-XXX maps to a verifying capability; deferred SCs and one-sided seams ride
                the owning entry's Obligations line; within an epic, a cross-member seam's owner
                is the spine's design-time assignment (`mochiko:authoring-epic`), never the
                later-lander default.
              anchor: 2026-08-10 feature-map-layer D21
        - id: authoring-feature-map.sec.output
          title: Output — what leaves the seat
          intent: The acceptance batch and the selection card the derivation hands up.
          rules:
            - id: authoring-feature-map.acceptance-batch-specs-index
              labels: [reporting, binding]
              class: must
              text: >-
                The acceptance batch includes the specs-index row (`.mochiko/specs/index.md`),
                agreeing with the map.
            - id: authoring-feature-map.selection-card
              labels: [reporting]
              class: must
              kind: binding
              text: >-
                The selection card carries the recommendation, the deferred-SC list, a
                per-capability completeness line (pending rows · folded rows · deferred SCs),
                work rows grouped per capability, and ordering; territory-touching capabilities'
                parked stubs and pending rows are re-surfaced on the card.
              anchor: 2026-08-10 pm-requirements-stacking D3
            - id: authoring-feature-map.story-trace-provenance
              labels: [evidence, artifact-grammar]
              class: must
              text: Derivation-minted stubs carry story-trace provenance.
              anchor: 2026-08-10 pm-requirements-stacking D2a
        - id: authoring-feature-map.sec.reserved
          title: Reserved — the user's rulings
          intent: Decisions this seat never takes.
          rules:
            - id: authoring-feature-map.selection-user-ruling
              labels: [user-gate]
              class: floor
              kind: reservation
              text: >-
                Selecting which work rows build now is the user's ruling, always — this skill
                prepares the selection card and recommends.
              anchor: 2026-08-13 pm-role-and-feature-derivation D5
            - id: authoring-feature-map.escalation-never-forced-cut
              labels: [user-gate]
              class: floor
              kind: reservation
              text: >-
                A dependency-blocked row or stub escalates as a recommendation for the user — a
                row via asserted map relation, a stub via flagged-unverified judgment — never a
                forced cut.
              anchor: 2026-08-10 pm-requirements-stacking D4
  - op: import-document
    kind: skill
    name: authoring-prototype
    content:
      kind: skill
      skill: authoring-prototype
      vars:
        template: spec
        artifact: prototype
        grader: '`mochiko:review-specifications`'
      conditions:
        design_system:
          values: presence
          resolution: surface-presence
          note: a design system or component library discoverable in the project.
      sections:
        - id: authoring-prototype.sec.independence
          title: Independence — author, never grader
          intent: Who grades the produced prototype, and never this seat.
          rules:
            - id: authoring-prototype.independent-grade
              class: must
              kind: routing
              extends: authoring-common.independent-grade
        - id: authoring-prototype.sec.scope
          title: Scope — what this skill renders, and never touches
          intent: The jurisdiction lines around a specification artifact.
          rules:
            - id: authoring-prototype.no-ux-surface-waiver
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                A feature with no UX surface — the intent ruling says not UX-bearing — takes
                the waiver line in the spec instead; never manufacture screens for an API or batch
                job.
              anchor: 2026-08-02 ux-mocking-in-specify
            - id: authoring-prototype.stories-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Authoring the stories themselves is `mochiko:authoring-user-stories` — the
                prototype renders stories, never invents or rewrites them.
            - id: authoring-prototype.throwaway-never-migrates
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                The prototype is a specification artifact — its code is throwaway by design and
                never migrates into production UI.
              anchor: 2026-08-02 ux-mocking-in-specify
            - id: authoring-prototype.upstream-untouched
              labels: [fence]
              class: floor
              text: >-
                Stories, requirements, and acceptance criteria are untouched — the prototype
                renders them, never edits them.
              anchor: 2026-08-02 ux-mocking-in-specify
        - id: authoring-prototype.sec.inputs
          title: Inputs
          intent: What is read before authoring.
          note: 'Deliberately empty — no schema-bound read duty; the stories and the design-system discovery ride the procedure prose (census: inputs 0).'
          rules: []
        - id: authoring-prototype.sec.artifact
          title: Artifact — the app, the manifest, and their agreement
          intent: >-
            The binding grammar of the two coupled artifacts and the invariants they are held to.
          rules:
            - id: authoring-prototype.letter-is-spirit
              class: floor
              extends: authoring-common.letter-is-spirit
              anchor: 2026-08-10 validator-scope-and-verbosity
            - id: authoring-prototype.two-coupled-artifacts
              labels: [binding, artifact-grammar]
              class: must
              kind: binding
              text: 'The output is two coupled artifacts: the prototype app at `.mochiko/specs/<feature>/prototype/` — plain static HTML/CSS with minimal inline JS for navigation only — and the spec''s Screens & Flows manifest: `SCR-XXX` rows (screen, purpose, data shown, FEAT tag) and `FLOW-XXX` rows (click-path steps, the story acceptance scenario each keys to, FEAT tag). The manifest is the contract surface downstream stages trace to; the HTML is its clickable rendering.'
              anchor: 2026-08-02 ux-mocking-in-specify
            - id: authoring-prototype.spec-two-arm
              class: must
              kind: binding
              extends: authoring-common.two-arm-template
              anchor: 2026-08-16 schema-based-template-guidance D8
            - id: authoring-prototype.envelope-binding
              class: must
              kind: binding
              extends: authoring-common.envelope-binding
            - id: authoring-prototype.static-degrade-path
              labels: [artifact-grammar]
              class: floor
              text: 'The app is plain static HTML: servable with `bun` (e.g. `bunx serve prototype/`) AND — the degrade path — openable directly from the filesystem with no server at all. No build step, no framework, no install required to view; serving is convenience, never a prerequisite.'
              anchor: 2026-08-02 ux-mocking-in-specify
            - id: authoring-prototype.authority-split
              labels: [artifact-grammar]
              class: floor
              text: 'Authority split — binding flows, advisory pixels. What screens exist, what each shows, and what the user can do (the manifest) is binding: downstream design must serve every screen''s data and route every action. How it looks is deliberately rough and advisory: layout, styling, and copy may all improve at build time without ceremony.'
              anchor: 2026-08-02 ux-mocking-in-specify
            - id: authoring-prototype.skeleton-first
              labels: [artifact-grammar]
              class: must
              text: 'Skeleton first: before any story screen, a nav frame — the app shell, navigation structure, and route stubs for every anticipated screen — so story screens fill into a stable frame instead of thrashing earlier ones.'
              anchor: 2026-08-02 ux-mocking-in-specify
            - id: authoring-prototype.lockstep
              labels: [artifact-grammar]
              class: must
              text: 'Lockstep, story by story: screens are authored with their story, as one unit of thought — never batched after all stories are drafted.'
              anchor: 2026-08-02 ux-mocking-in-specify
            - id: authoring-prototype.flow-keys-scenario
              labels: [artifact-grammar]
              class: must
              text: >-
                Every `FLOW-XXX` names the story acceptance scenario it renders (Given/When/Then
                to the click path that walks it); a flow keyed to nothing is scope invention, and
                a P1 scenario with no flow is a manifest gap.
              anchor: 2026-08-02 ux-mocking-in-specify
            - id: authoring-prototype.manifest-html-agreement
              labels: [artifact-grammar, evidence]
              class: must
              text: 'Manifest and HTML agree in both directions: every `SCR-XXX` is a reachable page, every `FLOW-XXX` is clickable end-to-end in the served app; drift between the tables and the HTML is a defect, mechanically checkable by walking the app.'
              anchor: 2026-08-02 ux-mocking-in-specify
            - id: authoring-prototype.low-fi-discipline
              labels: [artifact-grammar]
              class: must
              text: 'Low-fi discipline: grey boxes, system fonts, placeholder data with honest shape — realistic fields, realistic cardinality (five rows, not one). No polish, no animation, no pixel perfection — over-fidelity invites sign-off on looks the build won''t honor, and makes the advisory half read as binding.'
              anchor: 2026-08-02 ux-mocking-in-specify
            - id: authoring-prototype.design-system-honored
              labels: [artifact-grammar]
              class: must
              text: 'Design system honored when one exists: use its tokens and primitives (colors, spacing, component names) so screens read as the product''s family — at low fidelity, not faithful reproduction. No design system means neutral grey-box defaults; never invent a new visual language.'
              when: {design_system: present}
              anchor: 2026-08-02 ux-mocking-in-specify
            - id: authoring-prototype.feat-retag-pass
              labels: [artifact-grammar]
              class: must
              kind: duty
              text: >-
                FEAT tags land as a re-tag pass over the SCR/FLOW manifest once feature derivation
                completes — tags cannot exist during lockstep authoring. Every row then carries
                the FEAT tag of the feature its story homes to; screens outside the current
                selection stay present but visibly greyed coming-soon — the app stays a coherent
                whole, not a stub maze.
              anchor: 2026-08-10 feature-map-layer
            - id: authoring-prototype.rejected-stories-visible
              labels: [artifact-grammar]
              class: must
              text: >-
                A filter-rejected story's screens are kept, greyed with the same coming-soon
                grammar, and marked rejected with a pointer to the rejection recorded in the story
                file — never silently deleted; the walkable record of what was considered and
                declined survives.
              anchor: 2026-08-10 feature-map-layer
            - id: authoring-prototype.structure-binding
              labels: [artifact-grammar, binding]
              class: must
              text: 'One file per screen, named by its `SCR-XXX` id; navigation is plain `<a href>` / `<form action>` — a flow is walkable by clicking, no JS state machine — and navigation never dead-ends: coming-soon and rejected screens stay reachable.'
              anchor: 2026-08-02 ux-mocking-in-specify
        - id: authoring-prototype.sec.output
          title: Output — findings leave as findings
          intent: What the authoring surfaces upward rather than resolving silently.
          rules:
            - id: authoring-prototype.scope-invention-surfaced
              labels: [reporting]
              class: must
              text: >-
                A screen need the stories do not cover is scope invention — surfaced as a story
                finding, never silently rendered.
              anchor: 2026-08-02 ux-mocking-in-specify
        - id: authoring-prototype.sec.reserved
          title: Reserved
          intent: Decisions this seat never takes.
          note: 'Deliberately empty — no decision is reserved at this seat; selection and story rulings live upstream of the prototype (census: reserved 0).'
          rules: []
  - op: import-document
    kind: skill
    name: authoring-requirements
    content:
      kind: skill
      skill: authoring-requirements
      sections:
        - id: authoring-requirements.sec.independence
          title: Independence
          intent: Who is never whom around this layer.
          note: 'Deliberately empty — no independence machinery binds this layer; the spec is graded downstream by its own reviewers (census: independence 0).'
          rules: []
        - id: authoring-requirements.sec.scope
          title: Scope — business requirements, nothing downstream
          intent: The PM-frame boundary and what routes away from this layer.
          rules:
            - id: authoring-requirements.pm-frame-boundary
              labels: [boundary]
              class: floor
              text: 'Authored inside the product-manager''s frame: the PM owns which capabilities (features, the story filter, selection advice — map machinery: `mochiko:authoring-feature-map`); this craft owns how well the requirements are written. Neither edits the other''s verdicts.'
              anchor: 2026-08-10 feature-map-layer D15
            - id: authoring-requirements.implementation-planning-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Implementation planning is not requirements work — use design docs or
                architecture decisions instead.
            - id: authoring-requirements.architecture-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Technical architecture decisions belong in ADRs or technical design documents, not
                in requirements.
            - id: authoring-requirements.validated-requirements-routing
              labels: [boundary]
              class: must
              kind: routing
              text: Where requirements already exist and are validated, do not duplicate the work.
            - id: authoring-requirements.api-endpoints-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                API endpoint specifications belong to the design track, not business requirements
                — keep concrete endpoint contracts out of FRs.
              anchor: 2026-08-26 plan-stage-utility
            - id: authoring-requirements.data-model-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Data model design belongs to the design track; describe entities only conceptually
                here (Key Entities), never as schemas.
              anchor: 2026-08-26 plan-stage-utility
            - id: authoring-requirements.stories-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                User story authoring is `mochiko:authoring-user-stories` — this skill focuses on
                the underlying requirements.
        - id: authoring-requirements.sec.inputs
          title: Inputs
          intent: What is read before authoring.
          note: 'Deliberately empty — no schema-bound read duty; this layer consumes the feature description and stories through its command''s brief (census: inputs 0).'
          rules: []
        - id: authoring-requirements.sec.artifact
          title: Artifact — the requirements layer's binding grammar
          intent: >-
            The FR/SC/edge-case/entity forms and the floors that keep them technology-agnostic.
          rules:
            - id: authoring-requirements.technology-agnostic
              labels: [artifact-grammar]
              class: floor
              text: >-
                Requirements are technology-agnostic — WHAT the system does and WHY, never HOW
                it is implemented.
              anchor: 2026-09-01 skill-content-schema
            - id: authoring-requirements.constraint-states-capability
              labels: [artifact-grammar]
              class: floor
              text: >-
                A constraint states a capability, never a posture — a posture wearing constraint
                clothes names no product and passes the leakage check, yet freezes a design-time
                choice downstream seats then read as ratified.
              anchor: 2026-08-26 plan-stage-utility
            - id: authoring-requirements.envelope-binding
              class: must
              kind: binding
              extends: authoring-common.envelope-binding
            - id: authoring-requirements.density-bounds
              labels: [artifact-grammar]
              class: must
              kind: bound
              text: >-
                One-line FR/SC/edge-case entries, overview prose of three lines or fewer, empty
                sections omitted. Density is not a gap; a gap is missing substance.
            - id: authoring-requirements.fr-format
              labels: [artifact-grammar]
              class: must
              text: >-
                Functional requirements use the FR-XXX form with RFC 2119 keywords — MUST
                (absolute; no exceptions) · SHOULD (recommended; valid exceptions may exist) ·
                MAY (optional).
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-requirements.rfc2119-pointer
              labels: [binding]
              class: must
              kind: binding
              text: >-
                Detailed keyword usage lives in `references/RFC-2119-KEYWORDS.md` — referenced,
                never restated.
              pointer: references/RFC-2119-KEYWORDS.md
            - id: authoring-requirements.fr-numbering
              labels: [artifact-grammar]
              class: must
              text: >-
                FR numbering is sequential, three-digit padded, no gaps (FR-001, FR-002…);
                related requirements group together.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-requirements.edge-cases
              labels: [artifact-grammar]
              class: must
              kind: duty
              text: 'Identify 3–5 boundary conditions needing explicit handling, drawn from the five categories: system limits · invalid input · external failures · concurrent access · permission boundaries. Patterns, examples, and documentation formats live in `references/EDGE-CASES.md`.'
              pointer: references/EDGE-CASES.md
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-requirements.sc-format
              labels: [artifact-grammar]
              class: must
              kind: duty
              text: Define 3–5 measurable outcomes in SC-XXX form.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-requirements.sc-rules
              labels: [artifact-grammar]
              class: must
              text: >-
                Success criteria are technology-agnostic (no API metrics, database stats, or code
                coverage), user- and business-focused (observable by stakeholders), measurable
                (quantifiable where possible), and outcome-oriented (what changes, not what is
                built).
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-requirements.entities-conceptual
              labels: [artifact-grammar]
              class: must
              text: 'Entities are described conceptually and compactly: purpose in one line, attributes as concepts not columns, relationships not foreign keys; no data types, constraints, or indexes — the full model is `data-model.md`, downstream.'
              anchor: 2026-07-23 workflow-token-reduction
        - id: authoring-requirements.sec.output
          title: Output — checking the produced layer
          intent: The advisory check available over the finished artifact.
          rules:
            - id: authoring-requirements.validation-script
              labels: [evidence]
              class: advisory
              kind: binding
              text: 'A format validator is available — FR/SC numbering, RFC 2119 keywords, technology-agnostic language: `python scripts/validate-requirements.py .mochiko/specs/<feature>/spec.md`.'
              pointer: scripts/validate-requirements.py
              anchor: 2026-08-10 validator-scope-and-verbosity
        - id: authoring-requirements.sec.reserved
          title: Reserved — the user's rulings
          intent: Decisions this seat never takes.
          rules:
            - id: authoring-requirements.boundary-escalates-to-user
              labels: [user-gate]
              class: floor
              kind: reservation
              text: >-
                A disagreement across the PM-frame boundary escalates to the user — neither seat
                overrules the other.
              anchor: 2026-08-10 feature-map-layer D15
  - op: import-document
    kind: skill
    name: authoring-technical-requirements
    content:
      kind: skill
      skill: authoring-technical-requirements
      sections:
        - id: authoring-technical-requirements.sec.independence
          title: Independence — the grade is not self-asserted
          intent: Who grades the produced layer, and what a self-check never is.
          rules:
            - id: authoring-technical-requirements.grade-is-not-self-asserted
              labels: [independence, boundary]
              class: must
              kind: routing
              text: >-
                The layer-internal checks are producer self-checks, never the gate — the
                cross-artifact consistency grade is owned by `mochiko:review-plan-artifacts`, not
                self-asserted here.
              pointer: references/TRACEABILITY-PATTERNS.md
        - id: authoring-technical-requirements.sec.scope
          title: Scope — the constraint layer's seam
          intent: What this skill owns, routes downstream or upstream, and never authors.
          rules:
            - id: authoring-technical-requirements.business-requirements-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Writing business requirements is `mochiko:authoring-requirements`'s — never
                authored here.
            - id: authoring-technical-requirements.decision-technique-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                The decision technique — comparing alternatives, weighing trade-offs, ADR depth,
                the ≥2-alternatives discipline — lives in
                `mochiko:patterns-technical-decisions`; this skill owns the
                `constraints-and-decisions.md` artifact structure (the D-XXX field schema) and the
                C↔D traceability. Project-scope decisions (the knowledge-management layer —
                `DECISIONS.md` + `.mochiko/decisions/`) are not this artifact's; only
                feature-scope D-XXX records live here.
              pointer: mochiko:patterns-technical-decisions
            - id: authoring-technical-requirements.problem-space-not-solutions
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Designing solutions is not this skill's — it defines the problem space, not
                solutions.
            - id: authoring-technical-requirements.boundaries-not-preferences
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Choosing technologies is not this skill's — constraints document real
                boundaries, not preferences.
            - id: authoring-technical-requirements.slicing-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Slicing the build — cycle-card structuring — is
                `mochiko:patterns-vertical-tdd`, downstream of this layer.
              pointer: mochiko:patterns-vertical-tdd
            - id: authoring-technical-requirements.integration-boundary-downstream
              labels: [boundary]
              class: must
              kind: routing
              text: 'Declare here, author there — the per-endpoint integration boundary (the `x-integration` OpenAPI extension: system, protocol, criticality, failure modes, authentication) is authored on the wrapping operation in `mochiko:patterns-api-contracts`, never here.'
              pointer: mochiko:patterns-api-contracts
            - id: authoring-technical-requirements.sensitivity-downstream
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                The per-attribute data-sensitivity taxonomy (the four classification levels,
                encryption / retention / access / audit / masking, compliance mapping, and the
                canonical `data-model.md` template) is authored against the data model in
                `mochiko:patterns-entity-modeling`, never here.
              pointer: mochiko:patterns-entity-modeling
            - id: authoring-technical-requirements.design-ladder-binding
              labels: [binding, floor-pointer]
              class: must
              kind: binding
              text: >-
                Every element answers the design ladder (`mochiko:patterns-plan-minimalism`)
                before it enters the package; the simplest-execution stops are disclosed by the
                design phase as it authors, never re-derived here.
              pointer: mochiko:patterns-plan-minimalism
              anchor: 2026-08-26 plan-stage-utility D4
            - id: authoring-technical-requirements.rationalization-stop
              labels: [boundary]
              class: floor
              text: 'If any excuse in the Common Rationalizations table arises as a thought mid-authoring, STOP immediately — a shortcut is being rationalized; restart with the full process. No exceptions: not for "simple" systems, "well-understood" domains, "tight timelines", or a spec that seems complete and thorough.'
              anchor: 2026-07-25 skill-succinctness-strip
        - id: authoring-technical-requirements.sec.inputs
          title: Inputs — none bound
          intent: Surfaces read before authoring.
          note: >-
            Deliberately empty at census — this member binds no pre-read surface beyond its
            schema pair; the business specification arrives as the run's material, not a bound
            input.
          rules: []
        - id: authoring-technical-requirements.sec.artifact
          title: Artifact — the constraint layer's binding grammar
          intent: The produced surfaces' grammar, invariants, and write mechanics.
          rules:
            - id: authoring-technical-requirements.letter-is-spirit
              class: floor
              extends: authoring-common.letter-is-spirit
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-technical-requirements.business-source-floor
              labels: [evidence, artifact-grammar]
              class: floor
              text: >-
                Every element traces to a business source, every target is measurable, and every
                constraint accounts for its design impact.
              anchor: 2026-09-01 skill-content-schema
            - id: authoring-technical-requirements.deliverable-envelope
              class: must
              kind: binding
              extends: authoring-common.envelope-binding
            - id: authoring-technical-requirements.statement-carries-content
              labels: [artifact-grammar]
              class: must
              text: >-
                The statement carries the content — no Description field re-explains the ID
                line; entries are one line each; upstream text is cited by ID and never re-quoted;
                the summary tables at each artifact's head are its ID index, the reviewer coverage
                surface. Density is not a gap; a gap is missing substance.
              anchor: 2026-07-24 token-reduction-wave-2
            - id: authoring-technical-requirements.layer-prefixes
              labels: [artifact-grammar]
              class: must
              text: >-
                Each layer uses a distinct ID prefix and a distinct home —
                `constraints-and-decisions.md` carries C-XXX / D-XXX / IP-XXX plus the thin
                INT-XXX / DS-XXX declarations; NFR-XXX rows live on the architecture store's
                concern rows.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-technical-requirements.constraints-are-facts
              labels: [artifact-grammar, evidence]
              class: must
              text: >-
                Constraints are facts, not preferences. Each decision record MUST reference the
                constraints that shaped the choice.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-technical-requirements.impact-references-decisions
              labels: [artifact-grammar]
              class: must
              text: Each constraint impact field SHOULD reference the decisions it influences.
            - id: authoring-technical-requirements.no-exceptions-documentation
              labels: [evidence]
              class: floor
              text: 'No exceptions — not for "well-known" constraints, not for "obvious" technology choices, not even when the team has consensus: document the constraint and its source explicitly.'
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-technical-requirements.decision-slots-binding
              labels: [binding]
              class: must
              kind: binding
              text: >-
                Reach `mochiko:patterns-technical-decisions` to evaluate alternatives, and record
                its result in the D-XXX slots — this skill owns only the field schema and the
                C↔D traceability.
              pointer: mochiko:patterns-technical-decisions
            - id: authoring-technical-requirements.no-topology-decisions
              labels: [artifact-grammar, single-home]
              class: floor
              text: 'A topology choice — component boundaries, interaction style, responsibility placement — is recorded in the architecture store''s delta, whose ruling IS its decision record; it never becomes a D-XXX row here. The D-XXX rows in this artifact have one origin: this skill''s analysis-time author.'
              anchor: 2026-08-19 product-architecture-schema D12
            - id: authoring-technical-requirements.entangled-decision-route
              labels: [artifact-grammar]
              class: must
              text: >-
                Where a technology decision and a topology choice are genuinely entangled, record
                the technology decision here, let the store's delta carry the shape, and
                cross-cite by ID.
              anchor: 2026-08-19 product-architecture-schema D12
            - id: authoring-technical-requirements.platform-implies-ip
              labels: [artifact-grammar]
              class: must
              text: >-
                Every constraint that implies platform work gets an IP-XXX item — constraints
                document boundaries; IP-XXX items document what those boundaries require
                operationally.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-technical-requirements.nfr-store-home
              labels: [artifact-grammar, single-home]
              class: floor
              text: 'There is no `nfrs.md` — an NFR-XXX row lives as fields on its architecture-store concern row, so one concern has one home: stance, pattern, targets, as-built, drift together. The ids and the grammar are this skill''s (numeric target · measurement method · source · category); the row shape is the store''s (`plugins/mochiko/schemas/architecture-store.yaml`).'
              anchor: 2026-08-19 product-architecture-schema D12
            - id: authoring-technical-requirements.fast-is-not-a-requirement
              labels: [artifact-grammar, evidence]
              class: floor
              text: '"Fast" is not a requirement — "p95 response time < 200ms under 1000 concurrent users, measured by APM" is. Every NFR gets a number, a measurement method, and a source — no deferrals to "later during design", not for "standard" performance expectations or "obvious" availability targets.'
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-technical-requirements.integration-declarations
              labels: [artifact-grammar]
              class: must
              text: 'Flag which external systems the feature depends on and how critical each is — an INT-XXX row ("the feature MUST integrate with `<system>`; its unavailability is `<criticality>`"). Optimistic integration maps are incomplete: every external dependency fails eventually, so every INT-XXX declaration MUST carry through to documented failure modes and a fallback when its boundary is authored in `mochiko:patterns-api-contracts`.'
              anchor: 2026-08-26 plan-stage-utility D3
            - id: authoring-technical-requirements.sensitivity-declarations
              labels: [artifact-grammar]
              class: must
              text: >-
                Flag which data the feature treats as sensitive — a DS-XXX row ("the feature
                handles `<data>`, which is sensitive and MUST be classified and protected"). The
                row records that sensitive data is present and must be governed; the per-attribute
                classification is authored downstream.
              anchor: 2026-08-26 plan-stage-utility D3
            - id: authoring-technical-requirements.trace-nfr-to-business
              labels: [artifact-grammar, evidence]
              class: must
              text: >-
                NFR → FR/SC — an NFR's source is its business source, the FR-XXX or SC-XXX
                whose promise the target serves; the trace chain resolves FR-XXX / SC-XXX →
                NFR-XXX.
              anchor: 2026-08-26 plan-stage-utility D3
            - id: authoring-technical-requirements.trace-constraint-decision
              labels: [artifact-grammar]
              class: must
              text: >-
                C ↔ D — constraints reference the decisions they shape; decisions reference
                the constraints that shaped them.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-technical-requirements.trace-constraint-impact
              labels: [artifact-grammar]
              class: must
              text: C → impact — every constraint identifies what it restricts.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-technical-requirements.trace-infrastructure
              labels: [artifact-grammar]
              class: must
              text: >-
                C/NFR → IP — constraints and NFRs with infrastructure implications reference
                the IP-XXX items that provision them.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-technical-requirements.technology-agnostic
              labels: [artifact-grammar]
              class: must
              text: 'Describe WHAT the system must achieve, not HOW — "Must use PostgreSQL" becomes "Must support ACID transactions on relational data." Exception: constraints MAY name specific technologies when they reflect real infrastructure facts.'
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-technical-requirements.sequential-ids
              labels: [artifact-grammar]
              class: must
              text: >-
                ID sequences are sequential with no gaps, three-digit padded, per prefix
                (C-001…, D-001…, IP-001…, INT-001…, DS-001…).
            - id: authoring-technical-requirements.declaration-rows-complete
              labels: [artifact-grammar]
              class: must
              text: >-
                Every INT-XXX and DS-XXX declaration is present as a row, with its downstream home
                named.
              anchor: 2026-08-26 plan-stage-utility D3
            - id: authoring-technical-requirements.field-definitions
              labels: [artifact-grammar, binding]
              class: must
              kind: duty
              text: >-
                Author every C / D / IP / Declarations / NFR block to its required field set and
                the T2 statement-line form — field definitions, document templates, and the
                two-arm store-row shape live in `references/ARTIFACT-TEMPLATES.md`, referenced
                never restated.
              pointer: references/ARTIFACT-TEMPLATES.md
              anchor: 2026-07-24 token-reduction-wave-2
            - id: authoring-technical-requirements.never-compress-register
              labels: [artifact-grammar]
              class: must
              text: >-
                Register `full` — every ID, numeric target, and constraint clause is a
                never-compress item; compression stops wherever it would make a requirement
                ambiguous.
              pointer: references/ARTIFACT-TEMPLATES.md
            - id: authoring-technical-requirements.declaration-closure
              labels: [artifact-grammar]
              class: must
              text: >-
                A declaration with no named downstream home is incomplete, and a constraint with
                no source is a preference wearing a constraint's clothes — the
                constraint-vs-preference test lives in `references/ARTIFACT-TEMPLATES.md`.
              pointer: references/ARTIFACT-TEMPLATES.md
            - id: authoring-technical-requirements.layer-internal-consistency
              labels: [artifact-grammar]
              class: must
              text: >-
                Layer-internal consistency — every cross-referenced ID resolves to an actual
                entry, bidirectional references match, and no two constraints restrict
                incompatibly.
              pointer: references/TRACEABILITY-PATTERNS.md
        - id: authoring-technical-requirements.sec.output
          title: Output — completeness before finalizing
          intent: What is verified before the layer is handed on.
          rules:
            - id: authoring-technical-requirements.completeness-procedures
              labels: [evidence]
              class: must
              kind: duty
              text: >-
                Before finalizing, run the per-link completeness procedures — constraint
                sourcing, decision traceability, NFR measurability, infrastructure coverage, and
                INT/DS declaration closure — per `references/TRACEABILITY-PATTERNS.md`,
                referenced never restated.
              pointer: references/TRACEABILITY-PATTERNS.md
        - id: authoring-technical-requirements.sec.reserved
          title: Reserved — the user's pen
          intent: Decisions this seat never takes.
          rules:
            - id: authoring-technical-requirements.store-write-at-sign-off
              labels: [user-gate]
              class: floor
              kind: reservation
              text: >-
                A new or changed NFR target reaches the store the way every other store write does
                — drafted in the package, written at the user's sign-off.
              anchor: 2026-08-19 product-architecture-schema D10
  - op: import-document
    kind: skill
    name: authoring-user-stories
    content:
      kind: skill
      skill: authoring-user-stories
      sections:
        - id: authoring-user-stories.sec.independence
          title: Independence — none bound
          intent: Who is never whom while stories are authored.
          note: >-
            Deliberately empty at census — this member carries no independence rule of its own;
            the spec the stories land in is graded from the reviewer's side, not from here.
          rules: []
        - id: authoring-user-stories.sec.scope
          title: Scope — the story craft's seam
          intent: What this skill owns, routes away, and never authors.
          rules:
            - id: authoring-user-stories.pm-frame-boundary
              labels: [boundary]
              class: floor
              text: 'Authored inside the product-manager''s frame — the PM owns which capabilities (features, the story filter, selection advice — map machinery: `mochiko:authoring-feature-map`); this craft owns how well the stories are written. Neither edits the other''s verdicts.'
              anchor: 2026-08-10 feature-map-layer D15
            - id: authoring-user-stories.technical-tasks-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Technical implementation tasks are not stories — use task decomposition instead.
            - id: authoring-user-stories.bug-reports-routing
              labels: [boundary]
              class: must
              kind: routing
              text: Bug reports are not stories — use issue templates with reproduction steps.
            - id: authoring-user-stories.already-story-form
              labels: [boundary]
              class: must
              kind: routing
              text: When requirements are already in user story format, do not duplicate the work.
            - id: authoring-user-stories.architecture-decisions-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Architecture decisions — capture technical-decision rationale in the design
                track instead; this skill authors user stories, not technical choices.
              anchor: 2026-08-26 plan-stage-utility D1
            - id: authoring-user-stories.api-contracts-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                API contract design — define endpoints and schemas in the design track instead;
                this skill authors user stories, not interface contracts.
              anchor: 2026-08-26 plan-stage-utility D1
            - id: authoring-user-stories.rationalization-stop
              labels: [boundary]
              class: floor
              text: 'If any excuse in the Common Rationalizations table arises as a thought mid-authoring, STOP immediately — you are rationalizing; write complete stories with all required sections. No exceptions: not for "simple" features, "we''ll refine later", "tight deadlines", nor even if the user says "just give me quick stories".'
              anchor: 2026-07-25 skill-succinctness-strip
        - id: authoring-user-stories.sec.inputs
          title: Inputs — none bound
          intent: Surfaces read before authoring.
          note: >-
            Deliberately empty at census — this member binds no pre-read surface beyond its
            schema pair; the feature description arrives as the run's material, not a bound input.
          rules: []
        - id: authoring-user-stories.sec.artifact
          title: Artifact — the story set's binding grammar
          intent: The produced stories' form, caps, and field rules.
          rules:
            - id: authoring-user-stories.letter-is-spirit
              class: floor
              extends: authoring-common.letter-is-spirit
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-user-stories.independently-testable
              labels: [artifact-grammar]
              class: must
              text: >-
                Each story MUST be independently testable, with measurable acceptance criteria.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-user-stories.deliverable-envelope
              class: must
              kind: binding
              extends: authoring-common.envelope-binding
            - id: authoring-user-stories.story-structure
              labels: [artifact-grammar, binding]
              class: must
              kind: binding
              text: >-
                Generate 2–5 user stories per feature, landing in `spec.md`, each to the exact
                structure the SKILL.md format block renders — title with priority, the user
                journey, a "Why this priority" line, an Independent Test line, and numbered
                acceptance scenarios.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-user-stories.density-fields
              labels: [artifact-grammar]
              class: must
              text: >-
                Every field is dense — the journey ≤ 2 lines, the priority justification and
                the independent test one line each, and each acceptance scenario a single line
                (the T1 form). A scenario that needs a paragraph is hiding several scenarios or
                restating context the Given already carries.
              anchor: 2026-07-24 token-reduction-wave-2
            - id: authoring-user-stories.priority-justified
              labels: [artifact-grammar]
              class: must
              text: >-
                Every story carries a P1 / P2 / P3 priority with a one-line justification —
                detailed assignment guidance in `references/PRIORITY-DEFINITIONS.md`, referenced
                never restated.
              pointer: references/PRIORITY-DEFINITIONS.md
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-user-stories.scenario-count-bound
              labels: [artifact-grammar]
              class: must
              kind: bound
              text: >-
                Each story needs 2–3 acceptance scenarios — the happy path plus the key edge
                case(s); more than 3 means the story is compound or the scenarios overlap.
              anchor: 2026-07-24 token-reduction-wave-2
            - id: authoring-user-stories.scenarios-independently-verifiable
              labels: [artifact-grammar]
              class: must
              text: Scenarios must be independently verifiable.
            - id: authoring-user-stories.observable-outcomes
              labels: [artifact-grammar]
              class: must
              text: >-
                Use concrete, observable outcomes — never implementation details or technology
                references.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-user-stories.independent-test-required
              labels: [artifact-grammar, evidence]
              class: must
              text: >-
                Each story includes an Independent Test description naming how QA can verify the
                story in isolation, what data or setup is required, and what constitutes passing /
                failing — enabling parallel testing and clear verification.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: authoring-user-stories.validation-script
              labels: [binding]
              class: advisory
              kind: binding
              text: >-
                Validate format (priority markers + justification, Given/When/Then completeness,
                independent-test presence, header format) with `python
                scripts/validate-user-stories.py path/to/spec.md`.
              pointer: scripts/validate-user-stories.py
        - id: authoring-user-stories.sec.output
          title: Output — none beyond the artifact
          intent: Report contracts this skill carries.
          note: >-
            Deliberately empty at census — the story set lands in `spec.md` per the artifact
            rules; no separate report contract exists.
          rules: []
        - id: authoring-user-stories.sec.reserved
          title: Reserved — the user's clearing
          intent: Decisions this seat never takes.
          rules:
            - id: authoring-user-stories.boundary-dispute-escalates
              labels: [user-gate, boundary]
              class: floor
              kind: reservation
              text: >-
                A disagreement across the PM-frame boundary escalates to the user — never
                resolved by either craft editing the other's verdicts.
              anchor: 2026-08-10 feature-map-layer D15
  - op: import-document
    kind: skill
    name: brownfield-integration
    content:
      kind: skill
      skill: brownfield-integration
      sections:
        - id: brownfield-integration.sec.independence
          title: Independence — none bound
          intent: Seat separations this craft would carry.
          note: >-
            Deliberately empty — the census records no independence obligation at D12 grain;
            this is an implement-time consumption craft, not a grading seat.
          rules: []
        - id: brownfield-integration.sec.scope
          title: Scope — the consumed classification and its interface impact
          intent: >-
            What each marker is allowed to do to an existing interface, and what stays outside the
            task.
          rules:
            - id: brownfield-integration.consumes-classification-never-decides
              labels: [boundary]
              class: must
              text: >-
                Brownfield tasks arrive tagged `[EXTEND]` or `[MODIFY]` by the builder's own
                decomposition — classified from the cycle card's brownfield exposure line, which
                `patterns-vertical-tdd` declares at design time. This skill does not decide the
                classification — it is the implement-time discipline of consuming one safely.
              pointer: mochiko:patterns-vertical-tdd
              anchor: 2026-08-05 ponytail-concepts-integration
            - id: brownfield-integration.extend-interface-impact
              labels: [boundary]
              class: floor
              text: '`[EXTEND]` — new functions, new methods, new exports, alongside what exists: MUST NOT change existing function signatures, exports, or type contracts.'
              anchor: 2026-07-25 skill-succinctness-strip
            - id: brownfield-integration.modify-interface-impact
              labels: [boundary]
              class: floor
              text: '`[MODIFY]` — the specified sections only: MAY change function internals; MUST NOT change signatures unless the task explicitly says so.'
              anchor: 2026-07-25 skill-succinctness-strip
            - id: brownfield-integration.interface-preservation
              labels: [boundary]
              class: floor
              text: 'When extending existing code: do NOT rename existing variables, functions, or classes; DO add new exports alongside existing ones; DO follow the file''s established patterns for new code.'
              anchor: 2026-08-02 plan-task-granularity
            - id: brownfield-integration.refactoring-out-of-scope
              labels: [boundary]
              class: must
              text: >-
                Refactoring is out of scope for an extend/modify task — note the opportunity, do
                not act on it.
        - id: brownfield-integration.sec.inputs
          title: Inputs — read before write
          intent: What is read, identified, and checked before any code lands in an existing file.
          rules:
            - id: brownfield-integration.read-full-file-first
              labels: [fence]
              class: floor
              kind: duty
              text: >-
                Before writing any code in an existing file, read the full file — not just the
                section you plan to change — and understand the complete context. Skimming is
                not sufficient for brownfield work.
              anchor: 2026-08-02 plan-task-granularity
            - id: brownfield-integration.follow-file-conventions
              labels: [fence]
              class: must
              kind: duty
              text: 'Before writing, identify the file''s own patterns and match them exactly: naming conventions (variable, file, function) · error-handling patterns (try-catch, Result types, error callbacks) · import style (relative vs absolute, named vs default, ordering) · test patterns (describe/it nesting, assertion style, fixtures).'
              anchor: 2026-07-25 skill-succinctness-strip
            - id: brownfield-integration.conflict-detection-set
              labels: [evidence]
              class: must
              kind: duty
              text: 'Before adding new code, check for: name collisions (search the file for the function/class/variable name you plan to add) · import collisions (new imports must not shadow existing ones) · test-file alignment (adding to `user.ts`, check that `user.test.ts` exists and follow its patterns) · circular dependencies (new imports must not create circular reference chains).'
              anchor: 2026-07-25 skill-succinctness-strip
        - id: brownfield-integration.sec.verdict
          title: Verdict — the letter is the spirit
          intent: The posture that closes every shortcut.
          rules:
            - id: brownfield-integration.letter-is-spirit
              labels: [verdict]
              class: floor
              text: 'Violating the letter of the rules is violating the spirit of the rules — every shortcut in read-before-write discipline is a broken consumer waiting to surface. No exceptions: not for "obviously broken" code, not for "trivially better" patterns, not for "quick cleanup while I''m here", not even if the existing code has no tests or its naming is inconsistent. A red-flag thought is a rationalization in progress — the Rationalizations table rebuts each.'
              anchor: 2026-07-25 skill-succinctness-strip
        - id: brownfield-integration.sec.output
          title: Output — blockers land in the cycle report
          intent: Where surfaced conflicts go.
          rules:
            - id: brownfield-integration.flag-blockers-into-cycle-report
              labels: [reporting, boundary]
              class: must
              kind: routing
              text: 'Surface blockers rather than silently resolving them — they belong in the cycle report the run produces (owned by `executing-tdd-cycle`), not in a quiet workaround: existing code contradicting the task description · inconsistent in-file patterns (multiple conflicting conventions) · an `[EXTEND]` whose existing interface cannot support the addition without modification · existing tests that would break from the addition (interface leak) · a file with no tests where the task expects test-first development.'
              pointer: mochiko:executing-tdd-cycle
              anchor: 2026-07-25 skill-succinctness-strip
        - id: brownfield-integration.sec.reserved
          title: Reserved — the rewrite decision is never this seat's
          intent: What is surfaced, never silently resolved.
          rules:
            - id: brownfield-integration.extend-never-silently-modify
              labels: [boundary]
              class: floor
              text: >-
                Never treat an `[EXTEND]` task as a `[MODIFY]`. If the existing code cannot
                support the extension without changing its interface, surface it as a blocker —
                do not silently rewrite.
              anchor: 2026-08-02 plan-task-granularity
  - op: import-document
    kind: skill
    name: executing-tdd-cycle
    content:
      kind: skill
      skill: executing-tdd-cycle
      sections:
        - id: executing-tdd-cycle.sec.independence
          title: Independence — a self-report, never a verdict
          intent: What this skill's outputs are to the seats that grade them.
          rules:
            - id: executing-tdd-cycle.report-not-verdict
              labels: [independence]
              class: floor
              kind: reservation
              text: >-
                Evaluating checkpoint or validation reports, or deciding the clearing verdict, is
                never this skill's — the lead Reads the reports and owns that verdict. This
                skill produces its own report; it does not grade one.
              anchor: 2026-08-05 ponytail-concepts-integration D8
            - id: executing-tdd-cycle.flip-is-self-report
              labels: [independence, evidence]
              class: must
              kind: duty
              text: >-
                Flip the card's checkbox (`- [ ]` to `- [x]`) only after your tasks are complete
                and their tests pass. The `**TEST:**` gate is the verifier's; the lead treats the
                flip as your self-report, verified independently.
              anchor: 2026-08-05 ponytail-concepts-integration D8
        - id: executing-tdd-cycle.sec.scope
          title: Scope — one cycle, strict order, minimum code
          intent: >-
            The jurisdiction seams and the execution discipline of the cycle this skill is given.
          rules:
            - id: executing-tdd-cycle.slicing-boundary
              labels: [boundary]
              class: floor
              kind: routing
              text: >-
                Deciding what the cycles are — the slicing, the cards, their acceptance criteria
                and `**TEST:**` gates — is design-time work owned by
                `mochiko:patterns-vertical-tdd`. This skill executes the card it is given; it does
                not add, remove, re-scope, or reorder cycles.
              anchor: 2026-08-02 plan-task-granularity D2
            - id: executing-tdd-cycle.verifier-boundary
              labels: [boundary]
              class: floor
              kind: routing
              text: >-
                Running the quality gates (lint, build, test suite) and the final
                real-infrastructure verification that gates a cycle is the verifier's work
                (`testing-end-user`), never this skill's — this skill executes its own tasks and
                runs their tests; the `**TEST:**` gate belongs to the verifier.
              anchor: 2026-08-02 plan-task-granularity D2
            - id: executing-tdd-cycle.no-loop-state
              labels: [boundary]
              class: must
              text: >-
                This skill executes one cycle or one rework and produces one report — it neither
                drives the loop nor tracks cross-cycle state.
              anchor: 2026-08-11 guardrails-vs-detail
            - id: executing-tdd-cycle.strict-order
              labels: [ladder]
              class: floor
              text: Execute in strict order. No skipping steps. No reordering.
              anchor: 2026-08-02 plan-task-granularity D2
            - id: executing-tdd-cycle.decompose-at-build-time
              labels: [ladder]
              class: must
              kind: duty
              text: 'Decompose the card yourself, at build time, with the code in view: read the relevant existing code first, then cut tasks sized to a single reviewable change, each with a specific file path, ordered so tests precede the implementation they pin; classify each task extend/modify per the card''s brownfield exposure.'
              anchor: 2026-08-02 plan-task-granularity D2
            - id: executing-tdd-cycle.decompose-only-the-card
              labels: [boundary]
              class: must
              text: >-
                Decompose exactly what the card's acceptance criteria require — nothing the card
                didn't ask for.
              anchor: 2026-08-02 plan-task-granularity D2
            - id: executing-tdd-cycle.pre-code-ladder
              labels: [floor-pointer, ladder]
              class: floor
              kind: duty
              text: >-
                Before any red-phase test is written, run the pre-code ladder over each
                prospective task per `mochiko:patterns-code-minimalism` — stop at the first rung
                that applies, and disclose each task's rung in the cycle report's decomposition.
              pointer: mochiko:patterns-code-minimalism
              anchor: 2026-08-05 ponytail-concepts-integration D4
            - id: executing-tdd-cycle.red-phase-failure-verified
              labels: [evidence]
              class: floor
              kind: duty
              text: 'Red phase: write the test, run it to verify it fails, and verify the failure reason matches expectations — not a syntax error, import error, or wrong assertion. A test that passes without implementation is not testing what you think — rewrite it.'
              anchor: 2026-08-11 guardrails-vs-detail
            - id: executing-tdd-cycle.green-minimum
              labels: [ladder]
              class: must
              text: 'Green phase: write the minimum code to make the failing test pass, run the test to verify it passes, and do not add features, abstractions, or optimizations the card did not require.'
              anchor: 2026-08-11 guardrails-vs-detail
            - id: executing-tdd-cycle.brownfield-co-fire
              labels: [fence, floor-pointer]
              class: must
              kind: binding
              text: 'For extend- and modify-classified tasks: read the existing file first and invoke `brownfield-integration` — extend follows the file''s existing patterns; modify changes only what the task specifies.'
              pointer: mochiko:brownfield-integration
              anchor: 2026-08-11 guardrails-vs-detail
            - id: executing-tdd-cycle.refactor-scope
              labels: [boundary]
              class: must
              text: 'Refactor phase: remove duplication introduced in this cycle only — no refactoring code from previous cycles, no abstractions "for the future" — and re-run the tests after refactoring to confirm they still pass.'
              anchor: 2026-08-11 guardrails-vs-detail
            - id: executing-tdd-cycle.rework-only-failed
              labels: [boundary]
              class: must
              text: >-
                Rework only the reported-failing tasks, traced to the responsible IDs in your
                reported decomposition, through red/green/refactor; leave passing code untouched
                — tasks that passed are done — and write a new report with the `attempt`
                number incremented and the reworked tasks marked.
              anchor: 2026-08-02 plan-task-granularity D2
            - id: executing-tdd-cycle.fix-pass-test-first
              labels: [evidence]
              class: must
              kind: duty
              text: 'Fix pass: reproduce each reported failure with a failing test before changing any code, then make the narrowest change that turns it green — cycle boundaries do not constrain the fix, but scope strictly to the reported failure; this is not a refactoring opportunity. The report carries `cycle: fix`.'
              anchor: 2026-08-02 plan-task-granularity D2
            - id: executing-tdd-cycle.rationalization-stop
              labels: [ladder]
              class: floor
              text: 'If any Red-Flags thought arises, STOP immediately — rationalization in progress: return to the execution sequence and follow every step. No exceptions — not for "trivial" cards, "obvious" implementations, "tight deadlines", not even if the user says "just write the code".'
              anchor: 2026-08-11 guardrails-vs-detail
            - id: executing-tdd-cycle.failure-reason-discipline
              labels: [evidence]
              class: must
              text: 'The Common-Mistakes obligations bind as one set: verify the failure message matches expectation (a `ModuleNotFoundError` is not a test failure), and note out-of-scope opportunities in `Notes of note` instead of acting on them.'
              anchor: 2026-08-11 guardrails-vs-detail
        - id: executing-tdd-cycle.sec.inputs
          title: Inputs — the cycle card
          intent: How the card is read, and what card reading never becomes.
          rules:
            - id: executing-tdd-cycle.card-reading-binding
              labels: [fence, binding]
              class: must
              kind: binding
              text: >-
                Read the current card from the feature's `tasks.md` (under
                `.mochiko/specs/<feature>/`) per `references/TASK-PARSING.md` — stories,
                acceptance criteria (cited IDs resolved against the spec/design artifacts),
                dependencies, brownfield exposure, and `**TEST:**` gate; the current cycle is the
                first card in order whose checkbox is unchecked.
              pointer: references/TASK-PARSING.md
              anchor: 2026-08-16 vertical-tdd-complexity-and-qa-role
            - id: executing-tdd-cycle.card-parse-boundary
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Parse the card's `**TEST:**` blocks only to know what the cycle must prove —
                running the cases is `testing-end-user`'s work — and read the quality gates only
                to know they exist, per `references/TASK-PARSING.md`.
              pointer: references/TASK-PARSING.md
              anchor: 2026-08-16 vertical-tdd-complexity-and-qa-role
        - id: executing-tdd-cycle.sec.verdict
          title: Verdict — none owned
          intent: The clearing grammar this skill would carry.
          note: >-
            Deliberately empty — this executor's outcome grammar is the report field contract
            carried in `executing-tdd-cycle.sec.output`; the clearing verdict is the lead's
            (`executing-tdd-cycle.report-not-verdict`).
          rules: []
        - id: executing-tdd-cycle.sec.output
          title: Output — the disclosed decomposition and the cycle report
          intent: Where the decomposition lands and what the persisted report is.
          rules:
            - id: executing-tdd-cycle.decomposition-disclosed
              labels: [reporting]
              class: must
              text: >-
                The decomposition is disclosed in the cycle report (task list, paths, ordering),
                not written back into `tasks.md` — the card stays the artifact; your
                decomposition is execution detail.
              anchor: 2026-08-02 plan-task-granularity D2
            - id: executing-tdd-cycle.report-binding
              labels: [reporting, binding]
              class: must
              kind: binding
              text: 'Produce `cycle-report.md` per `references/CYCLE-REPORT-FORMAT.md`, machine-first: the YAML frontmatter is the report, the decomposition rides its structured fields, and a clean passing cycle needs no prose.'
              pointer: references/CYCLE-REPORT-FORMAT.md
              anchor: 2026-08-01 verbosity-caveman-ops-separation D4
            - id: executing-tdd-cycle.report-field-contract
              labels: [reporting, binding]
              class: must
              kind: binding
              text: >-
                The report's required frontmatter set, its local task IDs (`T{cycle}.{n}`), and
                the per-task `rung` field are defined in `references/CYCLE-REPORT-FORMAT.md`,
                referenced never restated.
              pointer: references/CYCLE-REPORT-FORMAT.md
            - id: executing-tdd-cycle.sanctioned-set-of-two
              labels: [reporting]
              class: floor
              text: 'The report''s sanctioned prose set is exactly two sections (`Notes of note` · the failure narrative), its register is bound, and prose on a clean report is a defect — per the rules in `references/CYCLE-REPORT-FORMAT.md`, the ruled restatement of `templates/report-format.md` in this payload home ([v0.44.0] KEPT: cut it only with a ruling that also re-homes the check).'
              pointer: references/CYCLE-REPORT-FORMAT.md
              anchor: 2026-08-01 verbosity-caveman-ops-separation D4
            - id: executing-tdd-cycle.verifier-owned-not-failure
              labels: [reporting, boundary]
              class: must
              text: 'A task you were never meant to run is not an execution failure: a verifier-owned `**TEST:**` gate belongs in `failed_tasks:` with its one-line reason and triggers no narrative, per `references/CYCLE-REPORT-FORMAT.md`.'
              pointer: references/CYCLE-REPORT-FORMAT.md
              anchor: 2026-08-01 verbosity-caveman-ops-separation D4
        - id: executing-tdd-cycle.sec.reserved
          title: Reserved — the lead's routing, the human's registry gate
          intent: Decisions this seat never takes.
          rules:
            - id: executing-tdd-cycle.lead-routing-reservation
              labels: [independence]
              class: floor
              kind: reservation
              text: >-
                Whether to rework, how many attempts are permitted, when to run a fix pass, which
                cycle runs next, and when to stop are the lead's routing decisions — not this
                skill's. You execute the cycle, rework, or fix you are given.
              anchor: 2026-08-07 executing-tdd-cycle
            - id: executing-tdd-cycle.domain-deps-checkpoint
              labels: [user-gate]
              class: floor
              kind: gate
              text: >-
                A non-empty `domain_deps_added` list always forces a human checkpoint — never
                auto-approved; the visibility floor's field contract lives in
                `references/CYCLE-REPORT-FORMAT.md`.
              pointer: references/CYCLE-REPORT-FORMAT.md
              anchor: 2026-07-21 domain-dependency-allowlist
  - op: import-document
    kind: skill
    name: patterns-adopt-first
    content:
      kind: skill
      skill: patterns-adopt-first
      conditions:
        firing_site:
          values: [design-phase, build-time]
          resolution: entry-derived
          note: >-
            which of the discipline's two firing sites this decision surfaced at — a
            design-phase decision, or a commodity need first surfacing at build-time
            decomposition.
      sections:
        - id: patterns-adopt-first.sec.trigger
          title: Trigger — the commodity-category test
          intent: When the discipline fires, and what never gates the check.
          rules:
            - id: patterns-adopt-first.commodity-trigger-test
              labels: [trigger]
              class: must
              kind: gate
              text: >-
                The trigger is the commodity-category test — ask of the capability being decided
                whether this problem is older than this product. Presumptively yes for the
                infrastructure categories storage · locking · serialization · queueing ·
                caching · auth · search; that list is a starting set, not a catalog — judgment
                extends it, and absence from the list is not an exemption.
              anchor: 2026-08-15 build-vs-off-the-shelf D2
            - id: patterns-adopt-first.framing-never-gates
              labels: [trigger]
              class: floor
              text: >-
                The author's framing never gates the check — a decision framed as "record
                granularity" or "which replace primitive" is still a storage decision, still a
                locking decision; the test runs against the capability, never the framing.
              anchor: 2026-08-15 build-vs-off-the-shelf D2
        - id: patterns-adopt-first.sec.scope
          title: Scope — jurisdiction lines and routes away
          intent: What this discipline decides, what routes elsewhere, and who grades what.
          rules:
            - id: patterns-adopt-first.in-process-scope-bound
              labels: [boundary]
              class: floor
              kind: routing
              text: >-
                Design and build seats own in-process libraries and self-hostable components only.
                Buying a managed service, a SaaS product, or a whole capability is a business call
                — it routes to an IP-XXX provisioning requirement and the PM/user, never decided
                here.
              anchor: 2026-08-15 build-vs-off-the-shelf D1
            - id: patterns-adopt-first.differentiating-domain-exempt
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                The product's differentiating domain — what the product exists to do — is
                presumptively not a commodity; the test is for the infrastructure underneath.
              anchor: 2026-08-15 build-vs-off-the-shelf D2
            - id: patterns-adopt-first.never-reopen-ruled-mechanism
              labels: [boundary]
              class: must
              text: >-
                A mechanism the design phase already ruled is never re-opened — the card carries
                that commitment, and the code ladder (`mochiko:patterns-code-minimalism`) shapes
                code without reopening the mechanism. A commodity need the design phase never
                ruled is the opposite case and takes
                `patterns-adopt-first.build-time-never-builder-decided`.
              anchor: 2026-08-26 plan-stage-utility
            - id: patterns-adopt-first.tooling-doctrine-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Project tooling defaults — "established, never hand-rolled" for linters, CI, and
                build tooling — are governance-floor doctrine, not a design- or build-time
                decision; that doctrine's home and this skill cross-point, never merge.
              anchor: 2026-08-15 build-vs-off-the-shelf D5
            - id: patterns-adopt-first.grader-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Who grades what — the disclosure line is `mochiko:review-plan-artifacts`'s
                BLOCKING named-sibling check at conformance strength; needed-but-should-have-
                been-adopted is `mochiko:review-feasibility` hunt class 7, blocking-capable;
                rationale-bite honesty is advisory, on the existing rung-honesty lane; the
                retrofit-cost gate is user-ruled by construction — no seat clears it.
              anchor: 2026-08-15 build-vs-off-the-shelf D2
            - id: patterns-adopt-first.siblings-boundary
              labels: [boundary]
              class: must
              kind: routing
              text: 'The minimalism ladders — `mochiko:patterns-plan-minimalism` (its rung 3 reads adoption as a way something already exists), `mochiko:patterns-code-minimalism`, `mochiko:patterns-map-minimalism` — size the artifact; this discipline asks who should have built it. The governance floor''s tooling doctrine (home queued at `authoring-constitution/references/STACK-TOOLING.md`) is the governance-axis sibling: that home carries tooling defaults, this skill the design- and build-time decision — cross-pointers only, no merge.'
              anchor: 2026-08-15 build-vs-off-the-shelf D5
        - id: patterns-adopt-first.sec.discipline
          title: Discipline — the two-part obligation and its limbs
          intent: 'The binding core: disclosure, rationale, the two-sided limb, and the constraint-challenge duty.'
          rules:
            - id: patterns-adopt-first.disclosure-floor
              labels: [evidence]
              class: floor
              kind: duty
              text: >-
                Every commodity-category decision's alternative set names at least one real
                off-the-shelf candidate, by product name, or carries an explicit "no shelf
                candidate exists" line. A missing line is itself a review finding — silence is
                not neutral.
              anchor: 2026-08-15 build-vs-off-the-shelf D2
            - id: patterns-adopt-first.rationale-bite
              labels: [evidence]
              class: floor
              text: >-
                Choosing custom is legitimate only against the named candidate — the choice
                rationale says, in writing, why custom beats it. A shelf row that sits in the
                options table and is then dropped from the rationale without a word is the defect
                this rule exists to catch.
              anchor: 2026-08-15 build-vs-off-the-shelf D2
            - id: patterns-adopt-first.two-sided-limb
              labels: [evidence]
              class: must
              kind: latitude
              text: 'The candidate is weighed, not deferred to — below the retrofit-cost line, a capability reasonably implementable in-house at under 100 lines is a legitimate custom-wins rationale: the BE-DEP red flag the backend dependency-discipline standard already names, read symmetrically. It argues against adopting a trivial dependency exactly as this discipline argues against hand-rolling a solved one — no precedence conflict; both say weigh it.'
              pointer: ../authoring-constitution/references/catalog/backend-service.md
              anchor: 2026-08-15 build-vs-off-the-shelf D2
            - id: patterns-adopt-first.constraint-challenge-finding
              labels: [evidence, user-gate]
              class: floor
              kind: duty
              text: 'A seat never silently overrides a ratified upstream constraint. When the shelf check collides with one — a spec constraint that excludes the candidate — the seat files a constraint-challenge finding carrying three parts: the constraint''s stated text, quoted; the real requirement it plausibly restates; the shelf candidate it excludes.'
              anchor: 2026-08-15 build-vs-off-the-shelf D3
        - id: patterns-adopt-first.sec.inputs
          title: Inputs
          intent: Read duties this discipline would carry before deciding.
          note: 'Deliberately empty — no input-side obligation exists at census grain (census-patterns §B: AF stubs 0, no read duty).'
          rules: []
        - id: patterns-adopt-first.sec.disclosure
          title: Disclosure — where claims and writes land
          intent: >-
            The disclosure-line grammar for named candidates and the landing surface for
            build-time writes.
          rules:
            - id: patterns-adopt-first.external-claims-binding
              labels: [binding, evidence]
              class: must
              kind: binding
              text: 'A named candidate is a claim about the world outside the repo — it carries the external-research disclosure line, `verified: <source>` or `memory-asserted`, verified at review. Grammar and mechanics live in the single source, referenced never restated.'
              pointer: ../review-brainstorm/references/EXTERNAL-CLAIMS.md
              anchor: 2026-08-15 build-vs-off-the-shelf D2
            - id: patterns-adopt-first.baseline-delta-landing
              labels: [binding]
              class: must
              kind: binding
              text: >-
                A build-time D-XXX / C-XXX / IP-XXX write lands as a `baseline-delta.md` entry
                graded as judgment before the user accepts it — never an in-place edit of a
                ruled baseline.
              when: {firing_site: build-time}
              anchor: 2026-08-26 plan-stage-utility
        - id: patterns-adopt-first.sec.reserved
          title: Reserved — the user's gates
          intent: Decisions no seat takes on its own.
          rules:
            - id: patterns-adopt-first.retrofit-cost-gate
              labels: [user-gate]
              class: floor
              kind: reservation
              text: >-
                Custom-over-shelf is user-ruled when the custom build is expensive to walk back
                — persisted formats, storage engines, locking/concurrency primitives,
                migration-bearing shapes — and seat-decidable with disclosure below that line.
                The split criterion is retrofit cost, deliberately the same principle the
                adaptive-depth ruling ratified.
              anchor: 2026-08-15 build-vs-off-the-shelf D4
            - id: patterns-adopt-first.build-time-never-builder-decided
              labels: [trigger, user-gate]
              class: floor
              kind: reservation
              text: >-
                A commodity-category ruling or an IP-XXX provisioning call that first surfaces at
                build-time decomposition is never the builder's to make — the builder halts the
                cycle and takes it to the user's checkpoint, where
                `patterns-adopt-first.disclosure-floor`, `patterns-adopt-first.rationale-bite`,
                and `patterns-adopt-first.constraint-challenge-finding` fire exactly as they do in
                the design phase.
              when: {firing_site: build-time}
              anchor: 2026-08-26 plan-stage-utility
            - id: patterns-adopt-first.collision-routes-to-user
              labels: [user-gate]
              class: must
              kind: reservation
              text: >-
                A constraint collision routes to the user, who rules — amend the spec, or
                sustain the constraint. Only the colliding decision pauses; the run proceeds
                elsewhere. These are expensive decisions; a human rules them.
              anchor: 2026-08-15 build-vs-off-the-shelf D3
  - op: import-document
    kind: skill
    name: patterns-architecture-shelves
    content:
      kind: skill
      skill: patterns-architecture-shelves
      sections:
        - id: patterns-architecture-shelves.sec.trigger
          title: Trigger — when the shelf comes back out
          intent: What fires a revisit of a dealt shelf.
          rules:
            - id: patterns-architecture-shelves.event-keyed-freshness
              labels: [trigger]
              class: advisory
              text: 'Shelf revisit is event-keyed, never calendrical — after the desk skill''s first live run, and thereafter whenever a desk visit finds a default argued against twice in one project: that signal means the default is stale or the segment moved. The store steward owns freshness.'
              anchor: 2026-08-19 product-architecture-schema
        - id: patterns-architecture-shelves.sec.scope
          title: Scope — what the shelf governs and what it never is
          intent: 'Jurisdiction lines: the desk''s axis, the store''s grammar, the siblings.'
          rules:
            - id: patterns-architecture-shelves.ax-grammar-routing
              labels: [boundary]
              class: must
              kind: routing
              text: 'Stances land as `AX-XXX` rows in the store — `mochiko:authoring-architecture-store` owns that grammar: row fields, ids, statuses, and the index are its, never redefined here.'
              anchor: 2026-08-19 product-architecture-schema
            - id: patterns-architecture-shelves.never-a-rigor-dial
              labels: [boundary]
              class: floor
              text: >-
                The shelf never reads the governance low/high depth level — a low-depth project
                walks the same shelf as a high-depth one; the shelf is not a rigor dial.
              anchor: 2026-08-19 product-architecture-schema
            - id: patterns-architecture-shelves.not-per-feature-design
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                The shelf sets the product's standing posture, never a per-feature design — a
                feature's structural delta is `mochiko:patterns-system-design`'s.
              anchor: 2026-08-19 product-architecture-schema
            - id: patterns-architecture-shelves.one-dial-one-system
              labels: [boundary]
              class: must
              text: >-
                Two instruments, two axes, stated openly — the governance depth dial governs how
                rigorous a floor row's obligation is; the desk governs what stance the product
                takes. One dial must not silently drive two systems, so it drives one and this
                skill drives the other.
              anchor: 2026-08-19 product-architecture-schema
        - id: patterns-architecture-shelves.sec.discipline
          title: Discipline — breadth, order, and the floor stratum
          intent: 'The binding core of the walk: every row, retrofit-cost order, honest gaps, floor-asserted precedence.'
          rules:
            - id: patterns-architecture-shelves.honest-gaps
              labels: [evidence]
              class: floor
              text: 'When the scoped surface has no seeded shelf — only the backend/service shelf is seeded today — the gap is named plainly, honest never silent, and the walk leans on the project''s own facts and the universal floor''s categories. A filtered backend list is never dealt to a non-backend surface: a frontend repo needs frontend depth, not backend leftovers.'
              anchor: 2026-08-19 product-architecture-schema
            - id: patterns-architecture-shelves.retrofit-cost-walk-order
              labels: [ladder]
              class: must
              kind: duty
              text: >-
                The shelf is walked in order of what costs most to retrofit, never in file order;
                retrofit cost is the whole ordering principle, and where a row sits between the
                poles is judgment made fresh against the project.
              anchor: 2026-08-19 product-architecture-schema
            - id: patterns-architecture-shelves.breadth-invariant
              labels: [ladder]
              class: floor
              text: 'Every row on the scoped shelf is walked — a row may close in two seconds, but it is never silently skipped: an unwalked row is invisible, a row walked and dismissed is a recorded decision. There is no magnitude scaling — a two-person MVP and a mature platform walk the same shelf; the per-row stance is the magnitude valve, and `not-now` is the per-dimension depth control.'
              anchor: 2026-08-19 product-architecture-schema
            - id: patterns-architecture-shelves.floor-asserted-rows
              labels: [floor-pointer, user-gate]
              class: floor
              text: >-
                Where a universal-floor card asserts a category — the rows carrying a
                `floor_bound` value in the shelf data; read the data for the live set, never work
                from a remembered list — `n-a — genuinely never` is unavailable at the desk.
                The legal moves are a stance within the obligation, `n-a — handled elsewhere`
                with its pointer, or narrowing the scope; a genuine drop is a governance waiver
                recorded in the ledger, never a shelf stance. This rule is the first stratum of
                the three-strata precedence;
                `patterns-architecture-shelves.card-shelf-conflict-users` and
                `patterns-architecture-shelves.one-dial-one-system` carry the second and third.
              anchor: 2026-08-19 product-architecture-schema
        - id: patterns-architecture-shelves.sec.inputs
          title: Inputs — the data and the scope line
          intent: What is read before dealing, and where scope durably lives.
          rules:
            - id: patterns-architecture-shelves.opinions-in-data
              labels: [binding]
              class: must
              kind: binding
              text: >-
                The opinions live in data — the backend shelf ships at
                `plugins/mochiko/schemas/architecture-shelf-backend.yaml`, Read raw; the judgment
                lives in this skill.
              pointer: ../../schemas/architecture-shelf-backend.yaml
              anchor: 2026-08-19 product-architecture-schema
            - id: patterns-architecture-shelves.scope-from-spine
              labels: [binding]
              class: must
              kind: binding
              text: 'The scope is read from `spine.md`''s `Scope:` line — setup''s scaffold wrote it there, and the desk overrides it there: the user knows their repo better than the setup answer does. The read scope is shown to the user for override, never silently assumed; that line is scope''s durable home, and the user is never re-asked at each walk.'
              anchor: 2026-08-19 product-architecture-schema
        - id: patterns-architecture-shelves.sec.disclosure
          title: Disclosure — the stance grammar and its provenance
          intent: What each dealt row states and carries.
          rules:
            - id: patterns-architecture-shelves.memory-asserted-provenance
              labels: [evidence]
              class: must
              kind: duty
              text: >-
                Every default is memory-asserted — common practice as the shelf's author knows
                it, not a verified external claim. Say so whenever a row's default carries weight
                in the decision.
              anchor: 2026-08-19 product-architecture-schema
            - id: patterns-architecture-shelves.stance-vocabulary
              labels: [artifact-grammar]
              class: must
              text: >-
                A stance is one of `decided` (a ruling exists — carries the ruling and its
                rationale) · `not-now` (real concern, consciously deferred) · `n-a` (permanently
                dismissed) · `open` (walked, no stance formed — the health view counts it).
              anchor: 2026-08-19 product-architecture-schema
            - id: patterns-architecture-shelves.na-reason-axis
              labels: [artifact-grammar]
              class: must
              kind: duty
              text: '`n-a` is always written with its reason suffixed — `n-a — genuinely never` (the concern does not apply to this product, ever) or `n-a — handled elsewhere` (the concern is real and another repo, system, or team owns it) — and the two are not interchangeable. `handled elsewhere` requires the pointer to that owner, not optional: without it the row is an unowned concern wearing a dismissal.'
              anchor: 2026-08-19 product-architecture-schema
            - id: patterns-architecture-shelves.not-now-carries-trigger
              labels: [artifact-grammar]
              class: must
              kind: duty
              text: >-
                Every `not-now` carries an upgrade trigger — the condition that reopens it; a
                deferral with no trigger is a row nobody will look at again.
              anchor: 2026-08-19 product-architecture-schema
        - id: patterns-architecture-shelves.sec.reserved
          title: Reserved — the user rules, the shelf never asserts
          intent: Decisions the desk never takes on its own.
          rules:
            - id: patterns-architecture-shelves.recommend-then-arbitrate
              labels: [user-gate]
              class: floor
              kind: reservation
              text: >-
                Every row is recommend-then-arbitrate — name the suggested default, say what it
                costs and what would argue against it, then the user rules. Architecture choice is
                per-project judgment, not a standard; an asserted default here would be an opinion
                wearing a rule's clothes.
              anchor: 2026-08-19 product-architecture-schema
            - id: patterns-architecture-shelves.card-shelf-conflict-users
              labels: [user-gate]
              class: must
              kind: reservation
              text: >-
                Arbitrated constitution cards and shelf rows bind different things — cards bind
                code-layer structure, shelf rows bind product topology and cross-cutting concerns,
                and they usually miss each other entirely. A genuine conflict is the user's to
                rule, never resolved at the desk.
              anchor: 2026-08-19 product-architecture-schema
  - op: import-document
    kind: skill
    name: patterns-code-minimalism
    content:
      kind: skill
      skill: patterns-code-minimalism
      sections:
        - id: patterns-code-minimalism.sec.trigger
          title: Trigger — where the ladder fires
          intent: The one firing site, and what the ladder governs there.
          rules:
            - id: patterns-code-minimalism.fires-at-decomposition
              labels: [boundary]
              class: must
              kind: gate
              text: >-
                The ladder fires at build-time card decomposition (`mochiko:executing-tdd-cycle`,
                step 2), before any red-phase test — it governs whether and how much code
                exists, not how the code that exists is written.
              anchor: 2026-08-05 ponytail-concepts-integration
        - id: patterns-code-minimalism.sec.scope
          title: Scope — what is not this ladder's jurisdiction
          intent: The sibling disciplines this ladder routes to and never absorbs.
          rules:
            - id: patterns-code-minimalism.not-for-routes
              labels: [boundary]
              class: must
              kind: routing
              text: 'Not this ladder''s jurisdiction: inside red/green/refactor, the green-phase "minimum code to make the failing test pass" rule (`mochiko:executing-tdd-cycle`) is a different, later discipline; architecture-level topology sizing is `mochiko:patterns-system-design`''s judgment, upstream.'
        - id: patterns-code-minimalism.sec.discipline
          title: Discipline — the walk's binding rules
          intent: >-
            The stop rule and the bounds no rung choice escapes; the seven rungs themselves are
            the body's sequenced procedure.
          rules:
            - id: patterns-code-minimalism.card-criteria-are-the-floor
              labels: [boundary]
              class: must
              text: >-
                The card's acceptance criteria are the floor of what to build — the ladder
                decides how cheaply to meet them, never whether to meet them; cutting scope from
                the card is not a rung.
            - id: patterns-code-minimalism.stop-at-first-rung
              labels: [ladder]
              class: must
              text: >-
                Stop at the first rung that applies; descend only when the rung above genuinely
                does not apply — and be able to say why, in one line, when it doesn't.
              anchor: 2026-08-05 ponytail-concepts-integration
            - id: patterns-code-minimalism.adopt-first-binding-constraint
              labels: [ladder, floor-pointer]
              class: must
              text: >-
                A design-committed adopt-first choice reaches these cards as a binding constraint,
                not a rung to re-open — the design-time discipline is
                `mochiko:patterns-adopt-first`.
              pointer: mochiko:patterns-adopt-first
              anchor: 2026-08-26 plan-stage-utility
            - id: patterns-code-minimalism.lazy-not-negligent
              labels: [ladder]
              class: floor
              text: 'Lazy, not negligent: no rung ever sacrifices a floor obligation (security, testing, error/data-loss handling, observability — the project''s asserted Essential Floor) or accessibility (named explicitly because the floor carries no a11y card yet, pending the frontend shelf). Code is small because it is necessary, never golfed: a guard, a validation, an a11y attribute is rung-7 code that must exist — the ladder deletes speculation, not safety.'
              anchor: 2026-08-05 ponytail-concepts-integration
            - id: patterns-code-minimalism.one-intensity
              labels: [ladder]
              class: floor
              text: >-
                The ladder ships at one strength — no off/lite/full/ultra dial exists.
                Per-project variance rides the recorded-waiver machinery, never a mode line.
              anchor: 2026-08-05 ponytail-concepts-integration
        - id: patterns-code-minimalism.sec.inputs
          title: Inputs — read before you rank
          intent: What is read before any rung is claimed.
          rules:
            - id: patterns-code-minimalism.rung-zero-read-before-rank
              labels: [evidence, floor-pointer]
              class: must
              kind: duty
              text: 'Rung zero: trace the real flow of the code being touched before rung 1 — rung 2 is unanswerable without having looked. Brownfield touches ride `mochiko:brownfield-integration` (the read-before-write procedure lives there, not here).'
              pointer: mochiko:brownfield-integration
        - id: patterns-code-minimalism.sec.disclosure
          title: Disclosure — the rung claim and its grader
          intent: Where rung choices land and who grades them.
          rules:
            - id: patterns-code-minimalism.rung-disclosed-in-cycle-report
              labels: [reporting]
              class: must
              kind: duty
              text: >-
                The chosen rung per task is disclosed in the cycle report's decomposition, where
                the verification seat grades it against this skill
                (`mochiko:review-code-minimalism`).
              anchor: 2026-08-05 ponytail-concepts-integration
        - id: patterns-code-minimalism.sec.reserved
          title: Reserved — rulings the ladder never takes
          intent: Decisions that route to a ruling, never to a rung.
          rules:
            - id: patterns-code-minimalism.new-dep-not-a-rung
              labels: [user-gate, ladder]
              class: floor
              kind: reservation
              text: >-
                Adding a NEW dependency is not a rung — it rides the domain-registry ruling
                where the `DOMAIN-DEPENDENCIES.md` catalog applies, and is never auto-approved.
              pointer: ../authoring-constitution/references/DOMAIN-DEPENDENCIES.md
              anchor: 2026-08-05 ponytail-concepts-integration
  - op: import-document
    kind: skill
    name: patterns-map-minimalism
    content:
      kind: skill
      skill: patterns-map-minimalism
      conditions:
        cap_trip:
          values: presence
          resolution: entry-derived
          note: >-
            the soft cap (roughly nine top-level capabilities) has tripped for this map — the
            grooming firing site.
      sections:
        - id: patterns-map-minimalism.sec.trigger
          title: Trigger — where the discipline fires
          intent: The firing sites, and the cap that trips grooming.
          rules:
            - id: patterns-map-minimalism.firing-sites
              labels: [trigger]
              class: must
              kind: gate
              text: >-
                The discipline fires at the PM's derivation (specify), the spec reviewer's grade,
                and `/mochiko:feature` grooming at cap-trip — whenever the feature map gains or
                grooms a capability.
              anchor: 2026-08-13 pm-role-and-feature-derivation D5
            - id: patterns-map-minimalism.soft-cap-trigger
              labels: [trigger, ladder]
              class: must
              kind: bound
              text: 'Past roughly nine top-level capabilities, a grooming pass runs — merge lookalikes, retire dead entries. The cap is a trigger, never a hard block: the map may exceed nine when the product honestly does that many kinds of things.'
              anchor: 2026-08-13 pm-role-and-feature-derivation D3
        - id: patterns-map-minimalism.sec.scope
          title: Scope — the discipline's altitude and its neighbors
          intent: What this skill owns, what the map skill owns, and what the tests never grade.
          rules:
            - id: patterns-map-minimalism.vocabulary-boundary
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                This skill owns the discipline; the capability/work-row vocabulary, file shapes,
                and fold mechanism live in `mochiko:authoring-feature-map` — within-capability
                roll-up is automatic there, rows folding into extent at delivery landing.
              anchor: 2026-08-13 pm-role-and-feature-derivation D4
            - id: patterns-map-minimalism.durable-layer-only
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                The tests grade the durable capability layer, never the transient work rows — a
                delivery increment under a capability may be story-shaped. Plan and code sizing
                are the sibling ladders at their own altitudes (`mochiko:patterns-plan-minimalism`
                · `mochiko:patterns-code-minimalism`).
              anchor: 2026-08-13 pm-role-and-feature-derivation D2
        - id: patterns-map-minimalism.sec.discipline
          title: Discipline — the tests, the precedence, the dormant tier
          intent: 'The binding core: honest fewness, the governing tests, extend-beats-mint, domains.'
          rules:
            - id: patterns-map-minimalism.fewness-never-hides
              labels: [evidence]
              class: floor
              text: >-
                Few is not sparse — fewness never hides a capability that passes the tests; the
                map is small because the product honestly does few kinds of things, never to sit
                under the cap.
              anchor: 2026-08-13 pm-role-and-feature-derivation D3
            - id: patterns-map-minimalism.three-governing-tests
              labels: [ladder]
              class: must
              kind: duty
              text: >-
                A candidate earns a capability only when the three governing tests all hold —
                system's-language · durability · new-kind-vs-more-of-same, taught in this
                skill's body.
              anchor: 2026-08-13 pm-role-and-feature-derivation D4
            - id: patterns-map-minimalism.noun-verbs-aid-only
              labels: [ladder]
              class: must
              text: >-
                noun + verbs is a heuristic aid, never a gate — a new verb on an existing noun
                signals extend-not-mint, but it never blocks a cross-cutting capability (an
                onboarding journey) that passes the governing tests.
              anchor: 2026-08-13 pm-role-and-feature-derivation D4
            - id: patterns-map-minimalism.extend-beats-mint
              labels: [ladder]
              class: floor
              text: >-
                A new story grows an existing capability first — the new-kind test decides —
                and a mint must argue against extending. An unargued mint is the story-mirroring
                defect the map exists to stop.
              anchor: 2026-08-13 pm-role-and-feature-derivation D3
            - id: patterns-map-minimalism.domains-dormant
              labels: [single-home]
              class: must
              text: 'Domains are the grouping tier — every capability lives in exactly one domain, minted only at cap-trip; a small map stays flat. The PM proposes names and the principal-architect co-signs — and the store''s domain-to-spine mapping line and the co-sign duty are deferred to the first real cap-trip: neither is built until a live map actually approaches the cap.'
              when: {cap_trip: present}
              anchor: 2026-08-13 pm-role-and-feature-derivation D4
        - id: patterns-map-minimalism.sec.inputs
          title: Inputs — what is read before a claim
          intent: The read that grounds a new-kind claim.
          rules:
            - id: patterns-map-minimalism.read-map-first
              labels: [evidence]
              class: must
              kind: duty
              text: >-
                The current map is read first — "new kind" is claimed against what is already
                there.
              anchor: 2026-08-13 pm-role-and-feature-derivation D4
        - id: patterns-map-minimalism.sec.disclosure
          title: Disclosure — what a map write preserves
          intent: The write mechanics a ruled merge or re-parenting carries.
          rules:
            - id: patterns-map-minimalism.merge-preserves-mechanics
              labels: [artifact-grammar]
              class: must
              text: >-
                A user-ruled merge preserves four mechanics — the absorbing ID survives while
                the merged entry flips `retired`, dated, with a merged-into pointer, never deleted
                · extents union under an honesty pass, no flattering over-claim · story traces
                and SC references consolidate onto the absorbing entry · pending rows and
                unfolded deltas transfer, no obligation dropped.
              anchor: 2026-08-13 pm-role-and-feature-derivation D12
            - id: patterns-map-minimalism.reparenting-navigation-only
              labels: [artifact-grammar]
              class: must
              text: Re-parenting under a domain header is navigation-only — no status semantics.
              anchor: 2026-08-13 pm-role-and-feature-derivation D12
        - id: patterns-map-minimalism.sec.reserved
          title: Reserved — the capability layer is the user's
          intent: The ruling no seat self-executes.
          rules:
            - id: patterns-map-minimalism.capability-layer-user-ruled
              labels: [user-gate]
              class: floor
              kind: reservation
              text: >-
                A mint, merge, or retire ruling is the user's — the skill shapes the
                recommendation, and merge and retire are always PM recommendations; the capability
                layer is never self-executed.
              anchor: 2026-08-13 pm-role-and-feature-derivation D5
  - op: import-document
    kind: skill
    name: patterns-model-tiering
    content:
      kind: skill
      skill: patterns-model-tiering
      sections:
        - id: patterns-model-tiering.sec.trigger
          title: Trigger — the class key
          intent: Which dispatch lane fires for each read class; the key both tiers ride.
          rules:
            - id: patterns-model-tiering.class-key-cheap-tier
              labels: [boundary]
              class: must
              text: 'Cheap tier — dispatch native `Explore` with `model: haiku`, disposable per gap: locate a file, symbol, config key, or line; enumerate a bounded, spot-checkable set (files, frontmatter values, pattern matches); targeted read of a named span, quoted verbatim; deterministic checks (stack detection, presence tests, exact-command output).'
              anchor: 2026-08-16 model-tiered-seats
            - id: patterns-model-tiering.class-key-session-tier
              labels: [boundary, floor-pointer]
              class: floor
              text: 'Session tier — the dispatching seat reads it itself, or a strong seat does: interpretive reading (what a design implies, whether patterns conflict, what quality a surface has); any gap where absence would drive a decision — a weak negative that would mislead a producer stays on the strong tier; an enumeration whose completeness would drive a decision (the cheap tier takes only spot-checkable enumerations); and all producing, reviewing, and grading work — never tiered down (model-tiered-seats D5); the sound-loop floor (`mochiko:patterns-sound-loop`) governs those seats.'
              pointer: mochiko:patterns-sound-loop
              anchor: 2026-08-16 model-tiered-seats
        - id: patterns-model-tiering.sec.scope
          title: Scope — dispatch tier only
          intent: The jurisdiction line away from the seat roster.
          rules:
            - id: patterns-model-tiering.rostered-seats-never-retier
              labels: [boundary]
              class: floor
              text: >-
                This floor governs dispatch tier only — rostered personas keep their declared
                models; retiering a rostered seat is deferred to its own reliability-gated
                brainstorm (model-tiered-seats D5), never done ad hoc.
              anchor: 2026-08-16 model-tiered-seats
        - id: patterns-model-tiering.sec.discipline
          title: Discipline — the cheap rung and the dispatch ladder
          intent: What makes a dispatch cheap, and the ladder every gap sits on.
          rules:
            - id: patterns-model-tiering.cheap-rung-explore-haiku
              labels: [binding]
              class: must
              text: 'The cheap rung is the native `Explore` agent spawned via the Agent tool with an explicit `model: haiku` override. The native agent inherits the session model when spawned bare, so a bare spawn is not cheap; and a plugin-scoped seat cannot be spawned from agent-team teammates, so the native agent is the only rung that resolves from every dispatcher (model-tiered-seats D4 as amended by the 2026-08-19 explorer-retarget ruling).'
              anchor: 2026-08-19 explorer-retarget-native
            - id: patterns-model-tiering.dispatch-ladder
              labels: [ladder]
              class: must
              text: 'Direct tool call → cheap `Explore` (haiku) → session-tier read: each gap sits on the lowest rung where the answer can be trusted. A one-file read the dispatcher already knows the path of is a direct tool call, not a spawn; a sweep across many files is the cheap `Explore`; a judgment read is session tier. A spawn that costs more than the read it saves has failed the ladder.'
              anchor: 2026-08-16 model-tiered-seats
            - id: patterns-model-tiering.disposable-per-gap
              labels: [boundary]
              class: must
              text: 'Disposable per gap — one gap per dispatch, discard after. Never a standing "librarian" seat: a standing seat re-pays its transcript across gate pauses (model-tiered-seats D4/F5).'
              anchor: 2026-08-16 model-tiered-seats
            - id: patterns-model-tiering.override-is-the-pin
              labels: [binding]
              class: floor
              kind: duty
              text: 'The override is the pin — every cheap dispatch MUST pass `model: haiku` explicitly on the Agent tool call; a spawn without the override inherits the session tier and has failed this floor.'
              anchor: 2026-08-19 explorer-retarget-native
        - id: patterns-model-tiering.sec.inputs
          title: Inputs — how cheap returns are read
          intent: What a cheap negative is worth, and when it re-routes.
          rules:
            - id: patterns-model-tiering.weak-negative-watch
              labels: [evidence]
              class: must
              text: >-
                A cheap "not found" is method-scoped ("not found by `<method>` over `<scope>`"),
                never a verdict of nonexistence; if that absence would drive a decision, the class
                key already routed it session-tier — re-route on sight.
              anchor: 2026-08-16 model-tiered-seats
        - id: patterns-model-tiering.sec.disclosure
          title: Disclosure — the brief and the return
          intent: >-
            What the dispatch brief pins, what comes back, and the line every seat brief carries.
          rules:
            - id: patterns-model-tiering.fact-finder-brief
              labels: [binding, evidence]
              class: must
              kind: binding
              text: 'The dispatch brief states the one gap and constrains the return: terse spot-checkable facts with `file:line` provenance, verbatim quotes never paraphrase, absence reported method-scoped, no interpretation. The brief carries this because the native agent has no persona pinning it.'
              anchor: 2026-08-19 explorer-retarget-native
            - id: patterns-model-tiering.terse-return
              labels: [evidence, reporting]
              class: must
              text: >-
                The explorer returns the smallest decisive facts with `file:line` provenance; the
                bulk read stays inside the disposable context (the context-health test,
                model-tiered-seats D1).
              anchor: 2026-08-16 model-tiered-seats
            - id: patterns-model-tiering.brief-obligation
              labels: [reporting]
              class: floor
              kind: duty
              text: 'The lead carries this rule into every seat brief — one line directing the seat to route its own locate/enumerate reads to a native `Explore` subagent spawned `model: haiku` per this skill. Spawned teammates never load `skills:` frontmatter, so the brief line is the only channel that reaches them — a run whose seat briefs omit it has not applied this floor.'
              anchor: 2026-08-16 model-tiered-seats
        - id: patterns-model-tiering.sec.reserved
          title: Reserved
          intent: Decisions no run takes on its own.
          note: 'Deliberately empty — the one reserved decision class (retiering a rostered seat) rides `patterns-model-tiering.rostered-seats-never-retier` in `sec.scope` (census-patterns §B: MT rows 1–11).'
          rules: []
  - op: import-document
    kind: skill
    name: patterns-plan-minimalism
    content:
      kind: skill
      skill: patterns-plan-minimalism
      sections:
        - id: patterns-plan-minimalism.sec.trigger
          title: Trigger — the three firing sites
          intent: Where the ladder fires, and the shape of the epic site.
          rules:
            - id: patterns-plan-minimalism.three-firing-sites
              labels: [boundary]
              class: must
              text: 'The ladder fires at three generation-time sites inside the implement run''s design phase: what the design phase authors — scoped to the sufficiency gap list, signed by the user at the design checkpoint — each producing seat''s plan, and the epic joint design-phase plan.'
              anchor: 2026-08-26 plan-stage-utility
            - id: patterns-plan-minimalism.epic-joint-plan-one-plan
              labels: [single-home]
              class: must
              text: >-
                The epic joint design-phase plan is one plan over all members — never per-member
                plans stitched together.
              anchor: 2026-08-26 plan-stage-utility
        - id: patterns-plan-minimalism.sec.scope
          title: Scope — what is not this ladder's jurisdiction, and who grades
          intent: The sibling routes away from the ladder, and the grading split over its claims.
          rules:
            - id: patterns-plan-minimalism.not-for-routes
              labels: [boundary]
              class: must
              kind: routing
              text: 'Not this ladder''s jurisdiction: build-time code — the code-shaping ladder is `mochiko:patterns-code-minimalism`, downstream at card decomposition; a delta-scope run — no design phase fires by default, and its deliverable is the desk-confirmed delta card, already minimal.'
            - id: patterns-plan-minimalism.grading-routing
              labels: [boundary, reporting]
              class: must
              kind: routing
              text: '`mochiko:review-plan-artifacts` grades the disclosed rung claims at review — rung-honesty advisory, gap-list conformance blocking.'
        - id: patterns-plan-minimalism.sec.discipline
          title: Discipline — the walk's binding rules
          intent: >-
            The stop rule, the rung scopes, and the floor bounds; the five rungs themselves are
            the body's sequenced procedure.
          rules:
            - id: patterns-plan-minimalism.stop-at-first-failing-rung
              labels: [ladder]
              class: must
              text: >-
                Per design element (component, entity, contract, mechanism, flow, constraint),
                stop at the first rung that fails, before it enters the package; descend only when
                the rung above genuinely holds, and say why in one line when it doesn't.
              anchor: 2026-08-12 plan-structure-yagni
            - id: patterns-plan-minimalism.rung-scope
              labels: [ladder]
              class: must
              text: >-
                Rungs 1, 4, and 5 apply to every element without exception; rungs 2 and 3 apply to
                design elements — shape and reuse are design judgments.
              anchor: 2026-08-12 plan-structure-yagni
            - id: patterns-plan-minimalism.rung-1-never-deletes
              labels: [ladder]
              class: floor
              text: >-
                Rung 1 never deletes a ratified requirement or an asserted floor obligation —
                the ladder removes speculation, never scope or safety.
              anchor: 2026-08-12 plan-structure-yagni
            - id: patterns-plan-minimalism.floor-both-ways
              labels: [ladder]
              class: floor
              text: 'The floor both ways: rung 1''s "required" reads ratified requirements AND asserted floor obligations — production-floor categories, compliance-module obligations, and NFR-derived floor elements (security controls, error and data-loss handling, observability, accessibility). Strictness against speculation survives; the floor never enters the package through imagination, and never leaves it to reach a cheaper rung.'
              anchor: 2026-08-12 plan-structure-yagni
        - id: patterns-plan-minimalism.sec.inputs
          title: Inputs — read before you claim
          intent: The read every reuse claim stands on.
          rules:
            - id: patterns-plan-minimalism.read-before-claim
              labels: [evidence, floor-pointer]
              class: must
              kind: duty
              text: >-
                A rung-2 or rung-3 claim is made only after reading the baselines and current
                state — never on trust; a reuse claim with no read behind it is not a rung stop.
                An adoptable proven component (per `mochiko:patterns-adopt-first`) satisfies rung
                3's "already exists".
              pointer: mochiko:patterns-adopt-first
              anchor: 2026-08-15 build-vs-off-the-shelf
        - id: patterns-plan-minimalism.sec.disclosure
          title: Disclosure — the rung claim's grammar
          intent: How every rung stop is stated, and how silence reads.
          rules:
            - id: patterns-plan-minimalism.disclosure-grammar
              labels: [reporting]
              class: must
              kind: duty
              text: 'Every rung claim is disclosed where it fires, one line per element: `<element> — rung N (one-line why)` — the lead across what the design phase authors, each seat in its plan. An undisclosed element reads as rung-skipped at review.'
              anchor: 2026-08-12 plan-structure-yagni
        - id: patterns-plan-minimalism.sec.reserved
          title: Reserved
          intent: Decisions no run takes on its own.
          note: 'Deliberately empty — no decision in this ladder is reserved above the run at census grain (census-patterns §B: PM rows 1–10).'
          rules: []
  - op: import-document
    kind: skill
    name: patterns-sound-loop
    content:
      kind: skill
      skill: patterns-sound-loop
      conditions:
        trigger:
          values: [fired, clear]
          resolution: entry-derived
          note: >-
            fired = both parts of the two-part test true of the output about to be produced
            (judgment-authored AND governing surface); clear otherwise.
      sections:
        - id: patterns-sound-loop.sec.trigger
          title: Trigger — two parts, no size threshold
          intent: >-
            When the floor fires, the door-independence of the test, and the surfaces its second
            part reads.
          rules:
            - id: patterns-sound-loop.two-part-trigger
              labels: [trigger]
              class: floor
              kind: gate
              text: 'The floor fires when both are true of the output about to be produced: (1) judgment-authored — producing it required real judgment; (2) governing surface — downstream work will read it as truth. Both true, the three legs are obligatory; either false, lead-inline freedom stands as chartered. There is no size threshold: a small judgment-authored write on a governing surface trips the floor as surely as a 10-file rewrite — magnitude never gates it.'
              anchor: 2026-08-13 charter-ritual-balance
            - id: patterns-sound-loop.kind-keyed-library-wide
              labels: [trigger]
              class: must
              text: 'The floor is kind-keyed and library-wide: any session, any command, whatever door the work entered through.'
              anchor: 2026-08-13 charter-ritual-balance
            - id: patterns-sound-loop.governing-surface-table
              labels: [trigger, binding]
              class: must
              kind: binding
              text: 'Governing surfaces and their per-member regime — plugin primitives (`plugins/mochiko/`): the primitive-edits ceremony (strip → record → author≠grader audit), no net-new obligation · product code: `/mochiko:implement` seats, none · specs (`.mochiko/specs/`): the `/mochiko:specify` loop, none · governance surfaces: the `/mochiko:setup` loop, none · capability map (`FEATURES.md` + entries): specify-side derivation graded, desk-side writes carried no loop — full floor, net-new bite · product baselines (the rest of `.mochiko/product/`): no loop outside pipeline runs — full floor, net-new bite · architecture store (`.mochiko/product/architecture/`): desk judgment writes take the tech-lead review leg, design-phase deltas graded by the design review pair beneath the user''s sign-off (`mochiko:authoring-architecture-store`); full floor satisfied by the desk''s own loop where it runs — the bite is any store write outside it.'
              pointer: mochiko:authoring-architecture-store
              anchor: 2026-08-13 charter-ritual-balance
        - id: patterns-sound-loop.sec.scope
          title: Scope — the door moves, the ritual never drops
          intent: How out-of-remit demands are hosted without lowering the floor.
          rules:
            - id: patterns-sound-loop.out-of-remit-hosting
              labels: [boundary]
              class: must
              text: 'When the user explicitly asks a command to host work outside its key responsibilities, it adapts rather than refuses: it names the boundary crossing, then serves the demand with the home command''s rituals imported — the three legs at minimum. Adaptation moves the door, never lowers the ritual.'
              anchor: 2026-08-13 charter-ritual-balance
        - id: patterns-sound-loop.sec.discipline
          title: Discipline — the legs, the exemptions, the wiring
          intent: The producing and reviewing legs, the exact exemption set, and who sits where.
          rules:
            - id: patterns-sound-loop.leg-1-seat-produces
              labels: [ladder, independence]
              class: floor
              text: 'Leg 1 — production sits with a seat, never the lead: the producing seat plans first; the lead gives feedback, approves the plan, and distributes work to seats.'
              when: {trigger: fired}
              anchor: 2026-08-13 charter-ritual-balance
            - id: patterns-sound-loop.leg-2-non-author-review
              labels: [ladder, independence]
              class: floor
              text: 'Leg 2 — independent review: the produced artifact is graded by a non-author seat before the user''s gate; the user''s ruling alone never substitutes for the review leg.'
              when: {trigger: fired}
              anchor: 2026-08-13 charter-ritual-balance
            - id: patterns-sound-loop.exemptions-exactly-three
              labels: [boundary]
              class: must
              text: 'Only three kinds of write never trip the trigger: mechanical execution of an existing ruling · transcription of user decisions · fix-on-sight integrity repairs (typos, status agreement, dead pointers).'
              anchor: 2026-08-13 charter-ritual-balance
            - id: patterns-sound-loop.store-carve
              labels: [boundary, evidence]
              class: must
              text: 'On the architecture store the exemption carve runs exactly down the middle of a landing: status flips and orphan cleanup are transcription and never trip, while the `As-built:` and `Drift:` writes are judgment and are graded — the natural mistake is to wave the whole landing through as bookkeeping.'
              anchor: 2026-08-19 product-architecture-schema
            - id: patterns-sound-loop.no-delta-card-exemption
              labels: [boundary]
              class: floor
              text: 'There is no delta-card exemption: every desk-authored delta card — bug and improvement alike — takes the review leg at the desk before dispatch. The review leg only: card authorship stays with the desk.'
              anchor: 2026-08-13 charter-ritual-balance
            - id: patterns-sound-loop.default-seat-wiring
              labels: [binding, independence]
              class: must
              kind: binding
              text: 'Default seat wiring — map work (capability map): `product-manager` produces, `devils-advocate` reviews · architecture / baseline touches: `principal-architect` produces, `tech-lead` reviews · desk delta cards: desk-authored (review leg only), `devils-advocate` reviews · specs and product code: existing command wiring, unchanged. The lead may swap personas for cause — disclosed at close.'
              when: {trigger: fired}
              anchor: 2026-08-13 charter-ritual-balance
            - id: patterns-sound-loop.map-review-spec-less
              labels: [boundary]
              class: must
              text: 'Map review runs spec-less: capability tests per `mochiko:patterns-map-minimalism`, entry/delta legality per `mochiko:authoring-feature-map`, derivation honesty against whatever stories exist — no spec required.'
              when: {trigger: fired}
              anchor: 2026-08-13 charter-ritual-balance
        - id: patterns-sound-loop.sec.inputs
          title: Inputs
          intent: Read duties this floor would carry before it fires.
          note: 'Deliberately empty — the floor obligates no read before it fires; the trigger evaluates the write at hand (census-patterns §B: SL rows 1–14).'
          rules: []
        - id: patterns-sound-loop.sec.disclosure
          title: Disclosure — the pinned line and its honesty rule
          intent: The one line every close report carries, and who may be named in it.
          rules:
            - id: patterns-sound-loop.disclosure-line
              labels: [reporting]
              class: must
              kind: duty
              text: 'Every visit/run close report carries one line, pinned grammar: `floor: tripped|clear · seats: <who produced> / <who reviewed>`. When clear: `floor: clear` alone — no seats segment, since no seats existed to name.'
              anchor: 2026-08-13 charter-ritual-balance
            - id: patterns-sound-loop.only-real-seats
              labels: [reporting, evidence]
              class: floor
              text: >-
                A report may only name a seat that actually existed; otherwise the lead speaks as
                itself. The known under-classification risk — calling judgment work "mechanical"
                to stay inline — is what the disclosure line makes auditable, visit by visit.
              anchor: 2026-08-13 charter-ritual-balance
        - id: patterns-sound-loop.sec.reserved
          title: Reserved — the user gate stays
          intent: The ruling layer the floor works beneath, never above.
          rules:
            - id: patterns-sound-loop.leg-3-user-gate-stays
              labels: [ladder, user-gate]
              class: floor
              kind: reservation
              text: 'Leg 3 — the user gate stays: rulings reserved to the user remain theirs; the floor adds review beneath the gate, never a machine gate above it.'
              when: {trigger: fired}
              anchor: 2026-08-13 charter-ritual-balance
  - op: import-document
    kind: skill
    name: patterns-transport-floor
    content:
      kind: skill
      skill: patterns-transport-floor
      conditions:
        messaging:
          values: presence
          resolution: surface-presence
          note: the run carries cross-seat or lead-relayed messaging.
        shared_write_surface:
          values: presence
          resolution: surface-presence
          note: two or more seats are able to write one artifact.
      sections:
        - id: patterns-transport-floor.sec.trigger
          title: Trigger — two lanes, each non-waivable when it fires
          intent: When the floor's lanes fire, and what firing does.
          rules:
            - id: patterns-transport-floor.message-lane-trigger
              labels: [trigger]
              class: floor
              kind: gate
              text: 'The message lane fires on any multi-seat run with cross-seat or lead-relayed messaging — shared writes or not; a lead relaying a mid-flight ruling to a single recipient already trips it, and review-pair and cross-examination exchanges are message-lane territory. When it fires, the four message legs bind — the `when: {messaging: present}` rules of `patterns-transport-floor.sec.discipline`.'
              when: {messaging: present}
              anchor: 2026-08-14 teammate-message-races
            - id: patterns-transport-floor.topology-lane-trigger
              labels: [trigger]
              class: floor
              kind: gate
              text: 'The topology lane fires when a shared write surface exists — two or more seats able to write one artifact. When it fires, the three topology legs bind — the `when: {shared_write_surface: present}` rules of `patterns-transport-floor.sec.discipline`.'
              when: {shared_write_surface: present}
              anchor: 2026-08-14 teammate-message-races
            - id: patterns-transport-floor.neither-lane-waivable
              labels: [trigger]
              class: floor
              text: 'When a lane fires, its legs bind: the trigger scopes the obligation, and an untriggered run keeps its chartered freedom. Neither lane is waivable once fired — a lead cannot legally depart the floor mid-crisis, which is exactly the shape a waivable floor would sanction.'
              anchor: 2026-08-14 teammate-message-races
        - id: patterns-transport-floor.sec.scope
          title: Scope — use, never the choice
          intent: The jurisdiction lines away from this floor.
          rules:
            - id: patterns-transport-floor.governs-use-never-choice
              labels: [boundary]
              class: must
              text: >-
                This floor governs transport use, never the neutral transport choice — a seat
                may be a teammate or a subagent, the lead's per-seat call (realignment D5). Sizing
                questions — whether an artifact should exist or how small it should be —
                belong to the three minimalism siblings, another axis.
              anchor: 2026-08-14 teammate-message-races
            - id: patterns-transport-floor.cross-session-cited-in-scope-only
              labels: [boundary]
              class: advisory
              text: >-
                Cross-session messaging is a different transport — neither delivery nor ordering
                is guaranteed; cite it only when cross-session work is in scope.
              anchor: 2026-08-14 teammate-message-races
        - id: patterns-transport-floor.sec.discipline
          title: Discipline — the seven legs and the platform floor
          intent: >-
            The binding legs, each carrying its lane, plus the version and ordering facts the
            floor designs around.
          rules:
            - id: patterns-transport-floor.composition-steer
              labels: [ladder]
              class: floor
              text: 'When a lead is about to compose concurrent writers on one surface, only two shapes are in-floor: worktree-isolated writers (isolation makes the surface non-shared) or one pen-holder seat with the other seats routing deltas to it. Any other composition is out of floor — re-shape at composition time, never police with use-discipline a shape that need not exist.'
              when: {shared_write_surface: present}
              anchor: 2026-08-14 teammate-message-races D4
            - id: patterns-transport-floor.single-writer-per-surface
              labels: [ladder, single-home]
              class: floor
              text: >-
                Every artifact has exactly one seat holding the pen at any moment; pen hand-offs
                are explicit.
              when: {shared_write_surface: present}
              anchor: 2026-08-14 teammate-message-races
            - id: patterns-transport-floor.mesh-hold
              labels: [ladder]
              class: floor
              text: >-
                A received message is a hand-off, never a start signal; work starts on the lead's
                explicit open.
              when: {messaging: present}
              anchor: 2026-08-14 teammate-message-races
            - id: patterns-transport-floor.content-pinned-supersession
              labels: [ladder]
              class: floor
              kind: duty
              text: >-
                An order quotes the exact text it lands, and a superseding order names what it
                voids; no order asserts disk state or relies on message sequence.
              when: {messaging: present}
              anchor: 2026-08-14 teammate-message-races
            - id: patterns-transport-floor.quiesce-before-cold-grade
              labels: [ladder]
              class: floor
              text: A grader reads a declared-frozen state; writers hold until the verdict.
              when: {shared_write_surface: present}
              anchor: 2026-08-14 teammate-message-races
            - id: patterns-transport-floor.no-ritual-sends
              labels: [ladder]
              class: floor
              text: >-
                Idle-ping-with-queued-inbox is normal; a resend exists only as a supersession that
                names what it voids.
              when: {messaging: present}
              anchor: 2026-08-14 teammate-message-races
            - id: patterns-transport-floor.fan-in-confirmation
              labels: [ladder]
              class: floor
              kind: duty
              text: >-
                The lead counts expected deliverables and confirms each arrived before treating a
                fan-out complete or converging; an idle signal without its deliverable means pull
                the output, never assume it.
              when: {messaging: present}
              anchor: 2026-08-14 teammate-message-races
            - id: patterns-transport-floor.version-floor
              labels: [binding]
              class: floor
              kind: bound
              text: >-
                Agent-teams work assumes ≥ v2.1.224. Below it, `SendMessage` reported success
                when the write to a teammate's inbox had actually failed — masked-failure sends,
                fixed in the v2.1.224 changelog.
              anchor: 2026-08-14 teammate-message-races
            - id: patterns-transport-floor.ordering-undocumented
              labels: [evidence]
              class: must
              text: 'Teammate delivery is documented-automatic (send success = the mailbox write succeeded, ≥ v2.1.224); ordering is undocumented — design around it rather than trusting it. Doc anchor: the agent-teams best-practices ownership-split line — "Two teammates editing the same file leads to overwrites. Break the work so each teammate owns a different set of files" (code.claude.com/docs/en/agent-teams), which directly grounds `patterns-transport-floor.composition-steer` and `patterns-transport-floor.single-writer-per-surface`.'
              anchor: 2026-08-14 teammate-message-races
        - id: patterns-transport-floor.sec.inputs
          title: Inputs — none bound
          intent: Surfaces read before the floor binds.
          note: >-
            Deliberately empty — the census records no pre-read duty for this member; the floor
            consumes the run's own composition facts, not a bound surface.
          rules: []
        - id: patterns-transport-floor.sec.disclosure
          title: Disclosure — none owed
          intent: Report and artifact bindings this floor would carry.
          note: >-
            Deliberately empty — this floor binds conduct, not a report grammar; no disclosure
            obligation exists at census grain.
          rules: []
        - id: patterns-transport-floor.sec.reserved
          title: Reserved — nothing left to reserve
          intent: Decisions no run takes on its own.
          note: >-
            Deliberately empty — non-waivability once fired leaves nothing seat-decidable to
            reserve, and no user gate exists at census grain.
          rules: []
  - op: import-document
    kind: skill
    name: patterns-vertical-tdd
    content:
      kind: skill
      skill: patterns-vertical-tdd
      conditions:
        new_end_to_end_path:
          values: presence
          resolution: entry-derived
          note: >-
            the work opens a genuinely new end-to-end path — greenfield, or a new path through
            the system.
      sections:
        - id: patterns-vertical-tdd.sec.trigger
          title: Trigger — where the slicing fires
          intent: The firing site inside the pipeline.
          rules:
            - id: patterns-vertical-tdd.design-time-inside-implement-run
              labels: [trigger]
              class: must
              text: >-
                This skill fires at design time inside the `/mochiko:implement` run — after the
                design phase, or directly on a zero-gap sufficiency verdict; never a separate plan
                run.
              anchor: 2026-08-26 plan-stage-utility
        - id: patterns-vertical-tdd.sec.scope
          title: Scope — slicing judgment, not build-time work
          intent: Jurisdiction and ownership lines.
          rules:
            - id: patterns-vertical-tdd.writes-no-task-lists
              labels: [boundary]
              class: floor
              text: >-
                This skill writes no task lists and no file paths — the card carries the what
                and why; the builder decomposes each card into concrete tasks, with file paths, at
                build time with the code in view (`mochiko:executing-tdd-cycle`, downstream).
              pointer: mochiko:executing-tdd-cycle
              anchor: 2026-08-02 plan-task-granularity D2
            - id: patterns-vertical-tdd.not-for-routes
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Not for bug fixes (single-change fixes need no cycle structure), for
                documentation-only or spike/research work, for decomposing a card into tasks
                (build-time, `mochiko:executing-tdd-cycle`), or for deriving or scoping features
                — the feature is the pipeline unit, owned by `mochiko:authoring-feature-map`,
                upstream (its vocabulary table disambiguates feature vs cycle); a cycle is a
                within-one-feature increment.
              anchor: 2026-08-10 feature-map-layer
            - id: patterns-vertical-tdd.grammar-owned-downstream-consume
              labels: [binding, single-home]
              class: must
              kind: binding
              text: >-
                The `**TEST:**` grammar — fields, action modifiers, assert patterns,
                classification — is single-homed in `references/TEST-GRAMMAR.md`; this skill
                owns it, and downstream parsers consume it, never redefine it.
              pointer: references/TEST-GRAMMAR.md
              anchor: 2026-08-16 vertical-tdd-complexity-and-qa-role D4
        - id: patterns-vertical-tdd.sec.discipline
          title: Discipline — the slicing invariants
          intent: What every cycle card must be.
          rules:
            - id: patterns-vertical-tdd.vertical-over-horizontal
              labels: [artifact-grammar]
              class: must
              text: >-
                Cycles slice vertically, never horizontally — a card whose test cases cannot be
                demonstrated on their own is not a cycle.
              anchor: 2026-08-16 vertical-tdd-complexity-and-qa-role D1
            - id: patterns-vertical-tdd.walking-skeleton-first
              labels: [trigger]
              class: must
              text: >-
                The first cycle is a walking skeleton — the thinnest end-to-end path through all
                layers with one trivial case green; it is the foundation, by construction. Growth
                or delta work on an already-standing path skips the skeleton.
              when: {new_end_to_end_path: present}
              anchor: 2026-08-16 vertical-tdd-complexity-and-qa-role D1
            - id: patterns-vertical-tdd.no-infra-only-cards
              labels: [artifact-grammar]
              class: floor
              text: >-
                There is no foundation/feature card type — all cycles are test-case bundles.
                Infrastructure a bundle needs emerges inside the first bundle that needs it (YAGNI
                at cycle grain); platform provisioning (IP-XXX) for the skeleton path lands in the
                skeleton cycle, the rest inside the first bundle that needs it. Infra-only cards
                are never minted.
              anchor: 2026-08-16 vertical-tdd-complexity-and-qa-role D3
            - id: patterns-vertical-tdd.parallel-derives-from-dependencies
              labels: [artifact-grammar]
              class: must
              text: >-
                Inter-card dependencies stay explicit and minimal; `[P]` parallel eligibility
                derives from dependencies, never from a type column.
              anchor: 2026-08-16 vertical-tdd-complexity-and-qa-role D3
            - id: patterns-vertical-tdd.test-gate
              labels: [evidence]
              class: floor
              kind: gate
              text: >-
                Every card closes with a `**TEST:**` gate — the cycle's named test cases run
                against real infrastructure, never a re-run of the automated tests. The gate is
                the demonstration the cycle is anchored on; a cycle that stops at the mock
                boundary has proven nothing.
              anchor: 2026-08-16 vertical-tdd-complexity-and-qa-role D4
        - id: patterns-vertical-tdd.sec.inputs
          title: Inputs — none bound
          intent: Surfaces read before slicing.
          note: >-
            Deliberately empty — no bound pre-read surface exists at census grain; the stories
            and design artifacts arrive as the run's material, not a bound input.
          rules: []
        - id: patterns-vertical-tdd.sec.disclosure
          title: Disclosure — the card is the artifact
          intent: What lands on the card, in what shape, and in what grammar.
          rules:
            - id: patterns-vertical-tdd.tasks-binding-two-arm
              labels: [binding]
              class: floor
              kind: binding
              text: 'The output is `tasks.md` in the cycle-card shape — the `tasks` schema is the canonical skeleton: invoke `mochiko-cli template tasks` when the binary is available; otherwise Read `plugins/mochiko/schemas/tasks.yaml` raw. Per card — stories + rationale, dependencies, the named test-case list (the card''s content), cycle-level brownfield exposure, and the Simple/Split/Merge case.'
              pointer: ../../schemas/tasks.yaml
              anchor: 2026-08-16 schema-based-template-guidance D8
            - id: patterns-vertical-tdd.case-and-rationale-on-card
              labels: [artifact-grammar]
              class: must
              text: >-
                The story→cycle decision — the Simple/Split/Merge case — and its one-line
                rationale live on the card (Stories line); there is no separate mapping artifact.
              anchor: 2026-08-16 vertical-tdd-complexity-and-qa-role D1
            - id: patterns-vertical-tdd.brownfield-exposure-line
              labels: [reporting]
              class: must
              kind: duty
              text: >-
                Each card carries a cycle-level brownfield exposure line — `none`, or the
                existing surfaces it extends/modifies; design-artifact brownfield markers
                translate into the line, so the classification survives design into the build.
            - id: patterns-vertical-tdd.cases-cite-ids
              labels: [evidence]
              class: must
              text: >-
                Each named test case cites the spec/design ID(s) it covers — never re-quoted
                content.
              anchor: 2026-08-16 vertical-tdd-complexity-and-qa-role D2
            - id: patterns-vertical-tdd.test-gate-must-includes
              labels: [evidence]
              class: must
              text: >-
                Every `**TEST:**` gate carries all four requirements — real infrastructure,
                tangible output, explicit steps, observable outcome — per
                `references/TEST-GRAMMAR.md`, referenced never restated.
              pointer: references/TEST-GRAMMAR.md
              anchor: 2026-08-16 vertical-tdd-complexity-and-qa-role D4
            - id: patterns-vertical-tdd.test-gate-field-set
              labels: [artifact-grammar]
              class: must
              text: >-
                A `**TEST:**` block is authored to its required field set — `Action` and
                `Assert` required, `Setup` and `Capture` optional — per
                `references/TEST-GRAMMAR.md`, referenced never restated.
              pointer: references/TEST-GRAMMAR.md
              anchor: 2026-08-16 vertical-tdd-complexity-and-qa-role D4
            - id: patterns-vertical-tdd.test-gate-runtime-classification-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                The producer authors the `**TEST:**` task and its fields; the runtime
                approval-mode decision (the CLI / GUI / SUBJECTIVE classification) belongs to the
                downstream verification step (`mochiko:testing-end-user`), never authored here —
                per `references/TEST-GRAMMAR.md`.
              pointer: references/TEST-GRAMMAR.md
              anchor: 2026-08-16 vertical-tdd-complexity-and-qa-role D4
        - id: patterns-vertical-tdd.sec.reserved
          title: Reserved — who holds which pen
          intent: The seat split no run re-decides.
          rules:
            - id: patterns-vertical-tdd.two-authors-one-card
              labels: [independence]
              class: must
              text: >-
                Two authors, one card — the design seat running this skill owns the slicing
                judgment (which bundles exist, Simple/Split/Merge, dependencies, the
                walking-skeleton call); the `qa-engineer` authors the test-case content (expected
                behaviour) in the grammar it later executes.
              anchor: 2026-08-16 vertical-tdd-complexity-and-qa-role D2
            - id: patterns-vertical-tdd.author-never-executing-builder
              labels: [independence, fence]
              class: floor
              text: >-
                The slicing seat is a design seat, never the builder who will execute the card —
                the card author is never the executing builder.
              anchor: 2026-08-26 plan-stage-utility
  - op: import-document
    kind: skill
    name: review-brainstorm
    content:
      kind: skill
      skill: review-brainstorm
      conditions:
        pairing:
          values: [pair, solo]
          resolution: entry-derived
          note: whether the spawn brief seats a counterpart reviewer.
        lens:
          values: [decision-quality, record-integrity]
          resolution: entry-derived
          note: the lens the spawn brief names.
        pass:
          values: [cold, verify]
          resolution: entry-derived
          note: >-
            which pass this invoke serves — the cold review, or the verify pass over folded
            dispositions.
      sections:
        - id: review-brainstorm.sec.independence
          title: Independence — never in the room
          intent: Seat separation and sequestration the cold reviewer carries.
          rules:
            - id: review-brainstorm.never-in-the-room
              labels: [independence]
              class: floor
              text: >-
                Never in the room — you review a session you took no part in, reading the frozen
                record cold.
            - id: review-brainstorm.blind-map-before-record-contact
              labels: [independence, evidence]
              class: floor
              kind: duty
              text: >-
                Phase 0 blind angle map from the topic only, produced as its own deliverable
                before record contact.
              anchor: 2026-08-10 cold-review-gap-challenge
            - id: review-brainstorm.cold-read-before-counterpart
              labels: [independence]
              class: must
              text: Cold read before counterpart contact — the attack formed independently.
            - id: review-brainstorm.author-grader
              class: floor
              extends: review-common.author-grader
        - id: review-brainstorm.sec.scope
          title: Scope & jurisdiction
          intent: What this review grades, routes, and never re-opens.
          rules:
            - id: review-brainstorm.lens-depth-never-jurisdiction
              labels: [boundary]
              class: must
              text: 'A lens brief (*decision-quality*: scenario stress, classes 1–4, steelmans · *record-integrity*: inconsistencies, fitness, the map audit) sets depth, never jurisdiction.'
            - id: review-brainstorm.never-excess
              class: must
              extends: review-common.never-excess
              anchor: 2026-08-13 architect-role-pushback-and-abstraction
            - id: review-brainstorm.reopen-born-verify-grade
              labels: [boundary]
              class: must
              text: Reopen-born decisions get the verify-pass grade, never a fresh cold read.
              anchor: 2026-08-10 cold-review-gap-challenge
            - id: review-brainstorm.contested-needs-new-angle
              labels: [boundary]
              class: floor
              text: >-
                Never raise a `Contested` decision unless the angle is genuinely new to the
                ruling.
            - id: review-brainstorm.its-command-states-them
              class: must
              kind: routing
              extends: review-common.its-command-states-them
              anchor: 2026-08-02 doctrine-purge-wave-1
        - id: review-brainstorm.sec.inputs
          title: Inputs & grounding
          intent: What is read, verified, and bound before findings form.
          rules:
            - id: review-brainstorm.grounding-excludes-session-artifacts
              labels: [fence]
              class: must
              text: Free repo grounding for the blind map — session artifacts excluded.
            - id: review-brainstorm.verify-load-bearing-claims
              labels: [evidence]
              class: must
              kind: duty
              text: Verify load-bearing claims against the record's fact-checker map or the files.
            - id: review-brainstorm.map-sample-audit
              labels: [evidence]
              class: must
              kind: duty
              text: Sample-audit the fact-checker map itself against the files.
              when: {lens: record-integrity}
            - id: review-brainstorm.external-claims-binding
              labels: [binding, floor-pointer]
              class: must
              kind: binding
              text: >-
                Outside-repo claims verify per `references/EXTERNAL-CLAIMS.md` (owned here) —
                referenced, never restated.
              pointer: references/EXTERNAL-CLAIMS.md
              anchor: 2026-08-04 external-research-in-review
            - id: review-brainstorm.cross-exam-binding
              labels: [binding, floor-pointer]
              class: must
              kind: binding
              text: 'Cross-examination runs per `references/CROSS-EXAM.md`; fact substrate: the record''s fact-checker map; fact authority: the seated fact-checker, else the files.'
              when: {pairing: pair}
              pointer: references/CROSS-EXAM.md
              anchor: 2026-08-04 external-research-in-review
        - id: review-brainstorm.sec.verdict
          title: Verdict — hunt, criteria, posture
          intent: What earns the status and how findings are judged.
          rules:
            - id: review-brainstorm.hunt-classes-per-decision
              labels: [evidence]
              class: must
              kind: duty
              text: >-
                Scenario stress plus all six hunt classes hunted per decision, as named in
                SKILL.md's Protocol.
            - id: review-brainstorm.excess-names-cheaper-shape
              labels: [verdict]
              class: must
              text: An excess-machinery finding names the cheaper shape.
              anchor: 2026-08-13 architect-role-pushback-and-abstraction
            - id: review-brainstorm.record-fitness-binding
              labels: [binding, floor-pointer]
              class: must
              kind: binding
              text: >-
                Fitness grades per `references/RECORD-FITNESS.md` — referenced, never restated.
              pointer: references/RECORD-FITNESS.md
            - id: review-brainstorm.coverage-severity-mapping
              labels: [verdict]
              class: must
              text: >-
                Coverage severity by whether a ruling would likely / plausibly / not have changed
                (Critical / Important / Minor).
              anchor: 2026-08-10 cold-review-gap-challenge
            - id: review-brainstorm.dismissed-angle-is-ruling
              labels: [verdict]
              class: must
              text: A dismissed angle is a ruling, not a gap.
              anchor: 2026-08-10 cold-review-gap-challenge
            - id: review-brainstorm.status-vocabulary-and-criteria
              labels: [verdict]
              class: must
              text: >-
                Recommended status is `ready` / `needs-revision` / `critical-gaps`;
                `critical-gaps` = a broken load-bearing claim, an unowned decision, a Critical
                coverage gap, or a record too thin to review.
              anchor: 2026-08-26 review-brainstorm-true-deletion-cut
            - id: review-brainstorm.unresolvable-is-commentary
              labels: [verdict]
              class: must
              text: A finding nothing could resolve is commentary, not a finding.
              anchor: 2026-08-26 review-brainstorm-true-deletion-cut
            - id: review-brainstorm.never-default-ready
              labels: [verdict]
              class: floor
              text: >-
                Never default to `ready` — zero findings means hunt harder, never manufacture.
              anchor: 2026-08-26 review-brainstorm-true-deletion-cut
            - id: review-brainstorm.unverifiable-claim-is-finding
              labels: [verdict, evidence]
              class: floor
              text: An unverifiable claim is a finding.
            - id: review-brainstorm.verify-pass-grade
              labels: [verdict]
              class: must
              text: >-
                Grade each fold against the updated record, quoting evidence; new surface only for
                fold-introduced contradictions. The verify pass belongs to the record-integrity
                lens in a pair, to you when solo.
              when: {pass: verify}
            - id: review-brainstorm.synthesis-fidelity-sample
              labels: [evidence]
              class: must
              kind: duty
              text: >-
                Fidelity-sample a requested `synthesis.md` — every ruling present, no confidence
                mark inflated, no rejected alternative resurrected.
        - id: review-brainstorm.sec.output
          title: Output — the survivor report
          intent: How findings leave the seat and where evidence lands.
          rules:
            - id: review-brainstorm.findings-formed-count-only
              labels: [reporting]
              class: must
              text: At findings-formed, the count only crosses — never the findings.
            - id: review-brainstorm.survivor-report-form
              labels: [reporting]
              class: must
              kind: binding
              text: 'The survivor report is a message: survivors with severity, the decision(s) touched, failure scenario or cited contradiction (coverage: the diff plus materiality), resolution path; tally ("N raised, M survived").'
              anchor: 2026-08-26 review-brainstorm-true-deletion-cut
            - id: review-brainstorm.evidence-floor
              class: floor
              extends: review-common.evidence-floor
              anchor: 2026-08-11 validator-scope-and-verbosity
        - id: review-brainstorm.sec.reserved
          title: Reserved — the lead's pen, the lead's verdict
          intent: Decisions this seat never takes.
          rules:
            - id: review-brainstorm.verdict-is-input
              class: floor
              kind: reservation
              extends: review-common.verdict-is-input
            - id: review-brainstorm.findings-through-leads-pen
              labels: [independence]
              class: floor
              kind: reservation
              text: Findings enter through the lead's pen — never your own edits to the record.
  - op: import-document
    kind: skill
    name: review-code-minimalism
    content:
      kind: skill
      skill: review-code-minimalism
      sections:
        - id: review-code-minimalism.sec.independence
          title: Independence — the verification seat, never the producer
          intent: Who grades and who never does.
          rules:
            - id: review-code-minimalism.author-grader
              class: floor
              extends: review-common.author-grader
        - id: review-code-minimalism.sec.scope
          title: Scope — the minimalism lens only
          intent: Where the lens runs and the surfaces it never grades.
          rules:
            - id: review-code-minimalism.per-cycle-lens-only
              labels: [boundary]
              class: must
              text: >-
                Runs inside the per-cycle verification the verification seat already performs —
                no separate stage, no final-pass sweep.
            - id: review-code-minimalism.not-general-code-review
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                General code review — naming, patterns, framework choices, correctness beyond
                tests — is out of scope; the lens grades ladder discipline only.
            - id: review-code-minimalism.not-test-gates
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Executing `**TEST:**` gates or quality gates belongs to
                `mochiko:testing-end-user`, never this lens.
              pointer: mochiko:testing-end-user
            - id: review-code-minimalism.not-design-time
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Design-time artifact review belongs to the design-phase and spec reviewers; the
                design-time sibling of this lens is the rung-honesty grade in
                `mochiko:review-plan-artifacts` against `mochiko:patterns-plan-minimalism`.
              anchor: 2026-08-26 plan-stage-utility
        - id: review-code-minimalism.sec.inputs
          title: Inputs — diff, report, codebase
          intent: The grading substrate and the reads it obliges.
          rules:
            - id: review-code-minimalism.standard-binding
              labels: [binding, floor-pointer]
              class: must
              kind: binding
              text: >-
                The grading standard is `mochiko:patterns-code-minimalism` — this skill carries
                the grading procedure, never a copy of the ladder.
              pointer: mochiko:patterns-code-minimalism
            - id: review-code-minimalism.diff-and-report-both-read
              labels: [fence, evidence]
              class: must
              text: >-
                The cycle's git diff AND `cycle-report.md` are both read — never one without the
                other; read the report file itself, never a relay of it.
            - id: review-code-minimalism.codebase-read-rungs-2-3-5
              labels: [evidence]
              class: floor
              kind: duty
              text: >-
                Never take reuse claims on trust — rungs 2 (reuse), 3 (stdlib), and 5 (installed
                dependency) carry a codebase-read obligation; diff plus disclosure alone cannot
                verify them.
              anchor: 2026-08-05 ponytail-concepts-integration
        - id: review-code-minimalism.sec.verdict
          title: Verdict semantics — advisory
          intent: What counts as a finding and what a finding can never do.
          rules:
            - id: review-code-minimalism.missing-rung-note-is-finding
              labels: [verdict]
              class: must
              text: A missing rung note is itself a finding.
            - id: review-code-minimalism.floor-line-check
              labels: [verdict]
              class: must
              kind: duty
              text: >-
                Code cut to reach a cheaper rung that a floor obligation or accessibility required
                is a finding — the standard's floor line is part of the standard.
            - id: review-code-minimalism.advisory-never-cycle-failing
              labels: [verdict]
              class: floor
              text: >-
                A `minimalism:` finding never fails a cycle — advisory to the lead's checkpoint
                verdict.
              anchor: 2026-08-05 ponytail-concepts-integration
        - id: review-code-minimalism.sec.output
          title: Output — the findings block
          intent: The one shape findings leave in.
          rules:
            - id: review-code-minimalism.minimalism-entries-form
              labels: [reporting]
              class: must
              kind: binding
              text: 'One `minimalism:` entry per finding in the verification report (format: `mochiko:testing-end-user`''s report templates): task ID, claimed rung, observed rung, one-line evidence. No findings — an empty block; never narrate a clean grade.'
        - id: review-code-minimalism.sec.reserved
          title: Reserved — the lead's checkpoint, the user's dispute
          intent: Decisions this lens never takes.
          rules:
            - id: review-code-minimalism.verdict-is-input
              class: must
              kind: reservation
              extends: review-common.verdict-is-input
            - id: review-code-minimalism.dispute-at-checkpoint-only
              labels: [user-gate]
              class: must
              kind: reservation
              text: >-
                A builder-vs-reviewer rung dispute escalates to the user only at the checkpoint,
                never as a mid-cycle stop; the lead decides rework-now or carry at that
                checkpoint.
  - op: import-document
    kind: skill
    name: review-feasibility
    content:
      kind: skill
      skill: review-feasibility
      vars:
        verdict: feasible
      conditions:
        store_delta:
          values: presence
          resolution: surface-presence
          note: a drafted architecture-store delta carried in the design-phase package.
      sections:
        - id: review-feasibility.sec.independence
          title: Independence — grader, never author
          intent: Who grades, and the one sanctioned channel back to the producer.
          rules:
            - id: review-feasibility.author-grader
              class: floor
              extends: review-common.author-grader
            - id: review-feasibility.interrogatory-round
              labels: [independence]
              class: advisory
              kind: latitude
              text: >-
                You may put questions to the producer — the interrogatory round in
                `references/FEASIBILITY-LENS.md` — and the verdict stays yours alone.
              pointer: references/FEASIBILITY-LENS.md
              anchor: 2026-08-13 architect-role-pushback-and-abstraction
        - id: review-feasibility.sec.scope
          title: Scope — the buildability seam
          intent: What this reviewer owns, routes to the sibling, and never grades.
          rules:
            - id: review-feasibility.sibling-split
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                The sibling `mochiko:review-plan-artifacts` owns coverage / measurability /
                consistency / presence; you own contradiction / impossibility / buildability.
            - id: review-feasibility.design-phase-only
              labels: [boundary]
              class: floor
              text: 'G1: design-phase artifacts only, never the constitution.'
            - id: review-feasibility.single-artifact-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                A single-artifact flaw is the sibling's — except class 7, the one remove-shaped
                class, which may fire from a single artifact; its rules live in
                `references/FEASIBILITY-LENS.md`.
              pointer: references/FEASIBILITY-LENS.md
            - id: review-feasibility.never-excess
              class: must
              extends: review-common.never-excess
              pointer: references/FEASIBILITY-LENS.md
              anchor: 2026-08-13 architect-role-pushback-and-abstraction
            - id: review-feasibility.architecture-pass-gate
              labels: [boundary, floor-pointer]
              class: must
              kind: gate
              text: >-
                The architecture pass is mandatory on a drafted store delta — A1–A3 per
                `references/FEASIBILITY-LENS.md`.
              when: {store_delta: present}
              pointer: references/FEASIBILITY-LENS.md
              anchor: 2026-07-30 architecture-design-primitive
            - id: review-feasibility.governance-conformance-only
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                A3 grades the topology's conformance to governance, never whether the governance
                itself is well-formed.
              pointer: references/FEASIBILITY-LENS.md
              anchor: 2026-07-30 architecture-design-primitive
            - id: review-feasibility.its-command-states-them
              class: must
              kind: routing
              extends: review-common.its-command-states-them
              anchor: 2026-08-02 doctrine-purge-wave-1
        - id: review-feasibility.sec.inputs
          title: Inputs — the lens and the external premises
          intent: What is loaded before hunting and how outside claims verify.
          rules:
            - id: review-feasibility.lens-load-first
              labels: [fence, floor-pointer]
              class: must
              kind: duty
              text: >-
                Load `references/FEASIBILITY-LENS.md` before hunting — the classes, worked
                examples, architecture pass, and reviewer guardrails live there, referenced never
                restated.
              pointer: references/FEASIBILITY-LENS.md
            - id: review-feasibility.external-claims-binding
              labels: [binding, evidence]
              class: must
              kind: binding
              text: >-
                External premises verify per `../review-brainstorm/references/EXTERNAL-CLAIMS.md`
                — referenced, never restated.
              pointer: ../review-brainstorm/references/EXTERNAL-CLAIMS.md
        - id: review-feasibility.sec.verdict
          title: Verdict — three states, earned
          intent: The clearing grammar, its posture, and the class rules that shape it.
          rules:
            - id: review-feasibility.default-fail
              class: floor
              extends: review-common.default-fail
            - id: review-feasibility.infeasible-never-flattens
              labels: [verdict]
              class: floor
              text: '`infeasible` never flattens into `needs-revision` — a fundamental conflict, one no revision closes, escalates to the human.'
            - id: review-feasibility.governance-two-exits
              labels: [verdict, user-gate]
              class: floor
              kind: routing
              text: 'Governance is never silently approved — two exits only: redesign to conform, or a user-ruled amendment/waiver via `governance-ledger.md`.'
              anchor: 2026-07-30 architecture-design-primitive
            - id: review-feasibility.verdict-vocabulary
              labels: [verdict]
              class: must
              text: 'Verdict: `feasible` · `needs-revision` (resolvable) · `infeasible` (fundamental).'
            - id: review-feasibility.skipped-lens-not-clean
              labels: [verdict, evidence]
              class: must
              text: A skipped lens is not a clean lens.
              pointer: references/FEASIBILITY-LENS.md
            - id: review-feasibility.seam-is-elements
              labels: [verdict]
              class: must
              text: The seam is between two elements, never merely between two files.
              pointer: references/FEASIBILITY-LENS.md
              anchor: 2026-08-19 product-architecture-schema
            - id: review-feasibility.class-seven-bound
              labels: [verdict]
              class: must
              kind: bound
              text: Class 7 blocks `feasible` but never alone earns `infeasible`.
              pointer: references/FEASIBILITY-LENS.md
              anchor: 2026-08-13 architect-role-pushback-and-abstraction
            - id: review-feasibility.adopt-first-excess
              labels: [verdict, floor-pointer]
              class: must
              text: >-
                A hand-built commodity with no rationale beating a named candidate is excess —
                trigger and floor at `mochiko:patterns-adopt-first`, never restated.
              pointer: mochiko:patterns-adopt-first
        - id: review-feasibility.sec.output
          title: Output — the filled report
          intent: Where the hunt, the findings, and the verdict land.
          rules:
            - id: review-feasibility.hunt-coverage-disclosure
              labels: [reporting, evidence]
              class: floor
              kind: duty
              text: >-
                Hunt coverage discloses as one line per class in the report, never a narrative.
              anchor: 2026-08-22 verbosity-envelope-enforcement
            - id: review-feasibility.evidence-floor
              class: floor
              extends: review-common.evidence-floor
              anchor: 2026-08-11 validator-scope-and-verbosity
            - id: review-feasibility.report-template-binding
              labels: [binding, reporting]
              class: floor
              kind: binding
              text: >-
                The filled report is `templates/feasibility-report-template.md` under the
                `templates/report-format.md` envelope.
              pointer: ../../templates/feasibility-report-template.md
              anchor: 2026-08-22 verbosity-envelope-enforcement
            - id: review-feasibility.findings-cite-ids
              labels: [evidence, reporting]
              class: must
              text: >-
                Findings cite the IDs in tension (`C-003 ↔ D-007`) with the four gate-fuel
                fields.
            - id: review-feasibility.gate-fuel-field-names
              labels: [reporting]
              class: must
              kind: binding
              text: >-
                Gate-fuel field names are the template's own — `gap` / `at` / `impact` / `fix`.
              pointer: ../../templates/feasibility-report-template.md
              anchor: 2026-08-22 verbosity-envelope-enforcement
        - id: review-feasibility.sec.reserved
          title: Reserved — the lead's clearing
          intent: Decisions this seat never takes.
          rules:
            - id: review-feasibility.verdict-is-input
              class: floor
              kind: reservation
              extends: review-common.verdict-is-input
  - op: import-document
    kind: skill
    name: review-governance-intent
    content:
      kind: skill
      skill: review-governance-intent
      vars:
        verdict: ready
      conditions:
        pairing:
          values: [pair, solo]
          resolution: entry-derived
          note: whether the spawn brief seats a counterpart reviewer.
        analysis:
          values: presence
          resolution: surface-presence
          note: the brownfield codebase analysis at `.mochiko/memory/codebase-analysis.md`.
      sections:
        - id: review-governance-intent.sec.independence
          title: Independence — you are the challenge
          intent: Seat separation and sequestration the intent reviewer carries.
          rules:
            - id: review-governance-intent.never-a-participant
              labels: [independence]
              class: floor
              text: >-
                Never a participant in the session — the session is recommend-then-arbitrate and
                unchallenged; you are the challenge, and in the session means not a reviewer.
            - id: review-governance-intent.author-grader
              class: floor
              extends: review-common.author-grader
            - id: review-governance-intent.sequestration
              labels: [independence]
              class: must
              text: >-
                Sequestration — the entire attack formed before counterpart contact; the lead
                withholds the counterpart's name until findings are formed.
        - id: review-governance-intent.sec.scope
          title: Scope & jurisdiction
          intent: When this review runs, what depth a lens sets, and what stays permanently out.
          rules:
            - id: review-governance-intent.pre-ratification-timing
              labels: [boundary]
              class: must
              text: You run before ratification, spawned at the sizing gate.
            - id: review-governance-intent.lens-depth-never-jurisdiction
              labels: [boundary]
              class: must
              text: A lens brief — coverage or coherence — sets depth, never jurisdiction.
            - id: review-governance-intent.report-out-of-lens-trips
              labels: [boundary]
              class: must
              kind: duty
              text: Report real out-of-lens trips.
            - id: review-governance-intent.solo-and-verify-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Solo, the whole surface is yours; the verify pass belongs to the coherence lens in
                a pair, to you automatically when solo.
            - id: review-governance-intent.authored-surfaces-out
              labels: [boundary]
              class: floor
              text: 'Permanently out of jurisdiction: the authored surface set and its Tier-2 grading (`mochiko:validation-constitution`, downstream — different artifact, different family).'
              anchor: 2026-08-11 validator-scope-and-verbosity
            - id: review-governance-intent.formulation-quality-excluded
              labels: [boundary]
              class: floor
              text: >-
                Formulation and enforceability quality of authored principles closed `Contested`
                (D1) — never re-raise.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: review-governance-intent.never-excess
              class: must
              extends: review-common.never-excess
            - id: review-governance-intent.its-command-states-them
              class: floor
              kind: routing
              extends: review-common.its-command-states-them
              anchor: 2026-08-02 doctrine-purge-wave-1
        - id: review-governance-intent.sec.inputs
          title: Inputs — the frozen synthesis and the fact routes
          intent: What is read, what stays frozen, and how each fact class verifies.
          rules:
            - id: review-governance-intent.frozen-window
              labels: [fence]
              class: must
              text: The synthesis is frozen from your spawn until dispositions land.
            - id: review-governance-intent.read-set-binding
              labels: [binding, fence]
              class: must
              kind: binding
              text: >-
                Read the frozen synthesis and the agenda at
                `../authoring-constitution/references/INTERROGATION-AGENDA.md` — its ten
                dimensions are the coverage yardstick.
              pointer: ../authoring-constitution/references/INTERROGATION-AGENDA.md
            - id: review-governance-intent.brownfield-analysis-read
              labels: [binding]
              class: must
              kind: binding
              text: Read `.mochiko/memory/codebase-analysis.md` beside the synthesis.
              when: {analysis: present}
            - id: review-governance-intent.cross-exam-binding
              labels: [binding, floor-pointer]
              class: must
              kind: binding
              text: >-
                Cross-examination — after the lead introduces the counterpart, the one-shot
                four-message exchange per `../review-brainstorm/references/CROSS-EXAM.md` (the
                single source, shared with `mochiko:review-brainstorm`); solo skips to the report.
              when: {pairing: pair}
              pointer: ../review-brainstorm/references/CROSS-EXAM.md
              anchor: 2026-07-25 skill-succinctness-strip
            - id: review-governance-intent.substrate-bindings
              labels: [binding]
              class: must
              kind: binding
              text: 'Substrate bindings — artifact: the frozen synthesis; fact substrate: `.mochiko/memory/codebase-analysis.md` plus the detect-stack baseline in brownfield, the files otherwise.'
              anchor: 2026-07-25 skill-succinctness-strip
            - id: review-governance-intent.reality-facts-checked
              labels: [evidence]
              class: must
              kind: routing
              text: >-
                A reality-surface fact is checked against the analysis or the files, never argued.
            - id: review-governance-intent.user-facts-flagged
              labels: [evidence, user-gate]
              class: must
              kind: routing
              text: >-
                A user-declared fact (team size, risk posture, lifespan, values) is checkable
                against nothing on disk — flag for the lead to route to the user as
                confirmation, never to argument.
            - id: review-governance-intent.external-facts-binding
              labels: [evidence, binding]
              class: must
              kind: routing
              text: >-
                An external-sourced fact — a floor-class claim fed from outside the repo —
                runs per `../review-brainstorm/references/EXTERNAL-CLAIMS.md`, never argued.
              pointer: ../review-brainstorm/references/EXTERNAL-CLAIMS.md
        - id: review-governance-intent.sec.verdict
          title: Verdict — the hunt and its criteria
          intent: What earns the status, the admissibility bars, and the mark discipline.
          rules:
            - id: review-governance-intent.unresolvable-is-commentary
              labels: [verdict]
              class: must
              text: Unresolvable = commentary, not a finding.
            - id: review-governance-intent.over-governance-admissibility
              labels: [verdict]
              class: must
              text: >-
                The over-governance hunt is in-jurisdiction, remove-shaped — a minted principle
                or intent no elicited fact justifies is a finding like any absence, admissible
                only naming the fact it fails to trace to or the lighter surface carrying the real
                need; it never reaches formulation quality.
            - id: review-governance-intent.status-vocabulary-and-criteria
              labels: [verdict]
              class: must
              text: 'Recommended status: `ready` (every hunt class actively worked, nothing blocking survived) / `needs-revision` (survivors resolvable by the session) / `critical-gaps` (a fact profile contradicted by its own risk declaration or detected reality, an unrecorded ruling — a missing or unrecorded depth-level declaration among them — or a synthesis too thin to review).'
              anchor: 2026-08-11 production-floor-adaptive-depth
            - id: review-governance-intent.default-fail
              class: floor
              extends: review-common.default-fail
              anchor: 2026-08-11 validator-scope-and-verbosity
            - id: review-governance-intent.too-thin-first-finding
              labels: [verdict]
              class: floor
              text: >-
                Too thin to attack — rulings without rationale, marks without basis — is
                itself the first finding.
              anchor: 2026-08-11 validator-scope-and-verbosity
            - id: review-governance-intent.contested-audit-first
              labels: [verdict]
              class: floor
              text: >-
                Honor `Contested` only after its rationale audit — an unaudited `Contested` is a
                shield, and a shield is a finding.
              anchor: 2026-08-11 validator-scope-and-verbosity
            - id: review-governance-intent.echo-rationales-outrank
              labels: [verdict, evidence]
              class: floor
              text: >-
                Marks are lead-self-reported; echo-rationales and adoption streaks outrank any
                mark.
              anchor: 2026-08-11 validator-scope-and-verbosity
            - id: review-governance-intent.declared-level-discipline
              labels: [verdict]
              class: floor
              text: 'The declared depth level is the user''s recorded ruling (D1/D2): challenge expression, waivers, and fact consistency; verify it exists in the ledger, was recommend-then-arbitrated, and greenfield got the low recommendation. Never flag it against real users or deployment state (D6 no-watcher), never grade stricter than the declared level.'
              anchor: 2026-08-11 production-floor-adaptive-depth
            - id: review-governance-intent.yardstick-never-taste
              labels: [verdict]
              class: floor
              text: >-
                The yardstick is the agenda, the asserted floor, and the synthesis's own internal
                consistency — never your governance taste.
              anchor: 2026-08-11 validator-scope-and-verbosity
            - id: review-governance-intent.no-in-session-confirmation
              labels: [verdict, independence]
              class: floor
              text: >-
                A session confirming its own synthesis is the gap this review closes — never
                soften on "the user already confirmed it in session".
              anchor: 2026-08-11 validator-scope-and-verbosity
        - id: review-governance-intent.sec.output
          title: Output — the survivor report
          intent: The finding contract and the one shape the report takes.
          rules:
            - id: review-governance-intent.finding-contract
              labels: [reporting, evidence]
              class: must
              text: 'Every finding: severity, the GI element(s) touched, a concrete failure scenario or cited contradiction, and a resolution path — the one question or check that settles it.'
            - id: review-governance-intent.survivor-report-form
              labels: [reporting]
              class: must
              kind: binding
              text: 'The survivor report is a message to the lead, no report files: your own survivors severity-classified, each with failure scenario and resolution path, unresolved counterpart objections, flagged counterpart duplicates; a tally ("N raised, M survived" — the fallen stay retrievable on ask).'
            - id: review-governance-intent.evidence-floor
              class: floor
              extends: review-common.evidence-floor
              anchor: 2026-08-11 validator-scope-and-verbosity
        - id: review-governance-intent.sec.reserved
          title: Reserved — the lead's verdict, the user's ratification
          intent: Decisions this seat never takes.
          rules:
            - id: review-governance-intent.verdict-is-input
              class: floor
              kind: reservation
              extends: review-common.verdict-is-input
            - id: review-governance-intent.ratification-user-owned
              labels: [user-gate]
              class: floor
              kind: reservation
              text: The user owns ratification; you never ratify.
              anchor: 2026-08-11 validator-scope-and-verbosity
            - id: review-governance-intent.findings-through-leads-pen
              labels: [independence]
              class: floor
              kind: reservation
              text: >-
                Findings enter through the lead's pen, dispositions in the Review section —
                never your own edits to the synthesis.
              anchor: 2026-08-11 validator-scope-and-verbosity
  - op: import-document
    kind: skill
    name: review-plan-artifacts
    content:
      kind: skill
      skill: review-plan-artifacts
      vars:
        verdict: ready
      conditions:
        incremental:
          values: presence
          resolution: entry-derived
          note: >-
            fires when the caller names {new} and {prior} artifact sets for an incremental pass.
      sections:
        - id: review-plan-artifacts.sec.independence
          title: Independence — who is never whom
          intent: Author/grader separation for the completeness seat.
          rules:
            - id: review-plan-artifacts.author-grader
              class: floor
              extends: review-common.author-grader
        - id: review-plan-artifacts.sec.scope
          title: Scope — jurisdiction and routing
          intent: What this review covers, what it hands off, and what never shrinks it.
          rules:
            - id: review-plan-artifacts.gap-list-scope
              labels: [binding, boundary]
              class: floor
              kind: binding
              text: >-
                The run's floor is the sufficiency report's gap list — the named gaps the design
                phase was scoped to close — never a fixed artifact set.
              anchor: 2026-08-26 plan-stage-utility
            - id: review-plan-artifacts.feasibility-handoff
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Coverage, measurability, presence, and consistency are this skill's;
                contradiction, buildability, NFR-design, and topology feasibility are
                `mochiko:review-feasibility`'s — hand such findings off, never grade them.
              pointer: mochiko:review-feasibility
              anchor: 2026-08-13 architect-role-pushback-and-abstraction
            - id: review-plan-artifacts.not-for
              labels: [boundary]
              class: must
              kind: routing
              text: 'Not for: code review (sole carve-out `mochiko:review-code-minimalism`, implement-side) · specs (`mochiko:review-specifications`) · the constitution (`mochiko:validation-constitution`) · artifacts still being drafted.'
              anchor: 2026-08-05 ponytail-concepts-integration
            - id: review-plan-artifacts.never-shrink
              labels: [boundary]
              class: floor
              text: >-
                Feature size, producer seniority, time pressure, and found-enough never shrink the
                review; a vague spec is a gap to flag, not permission to propagate, and "obvious"
                never exempts a constraint from documentation.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: review-plan-artifacts.incremental-consistency-scope
              labels: [boundary]
              class: must
              text: >-
                Full checks run on the {new} set; on the {prior} set the Cross-Artifact
                Consistency checklist only — spot-check entity names, requirement IDs, and
                decision references, flagging only inconsistencies between artifacts.
              when: {incremental: present}
              anchor: 2026-07-25 skill-succinctness-strip
            - id: review-plan-artifacts.no-prior-waiver
              labels: [boundary]
              class: must
              text: A thorough prior review never waives the consistency pass.
              when: {incremental: present}
              anchor: 2026-07-25 skill-succinctness-strip
            - id: review-plan-artifacts.escalate-full-reread
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Two or more consistency issues in one prior artifact escalate it to a full
                re-read.
              when: {incremental: present}
              anchor: 2026-07-25 skill-succinctness-strip
            - id: review-plan-artifacts.boundary-table
              labels: [boundary, floor-pointer]
              class: must
              kind: routing
              text: >-
                The seam with `mochiko:review-feasibility` is the boundary table of
                references/ARTIFACT-CHECKLISTS.md — this skill keeps the left column,
                `mochiko:review-feasibility` owns the right.
              pointer: references/ARTIFACT-CHECKLISTS.md
        - id: review-plan-artifacts.sec.inputs
          title: Inputs — what is read and what is run
          intent: Pre-asserts, checklist bindings, and the read duties the grade stands on.
          rules:
            - id: review-plan-artifacts.completeness-supplied-sets
              labels: [binding]
              class: must
              kind: binding
              text: >-
                Completeness is graded with the fixed mirror checklists of
                references/ARTIFACT-CHECKLISTS.md, over whichever artifact sets the caller
                supplies.
              pointer: references/ARTIFACT-CHECKLISTS.md
            - id: review-plan-artifacts.tier1-preassert
              labels: [evidence]
              class: floor
              kind: gate
              text: >-
                Tier-1 pre-assert first — `python scripts/check-artifacts.py
                .mochiko/specs/<feature>/<artifact>.md …` — a `failed` count is ground truth,
                folded straight into the issue list.
            - id: review-plan-artifacts.cycle-card-checks
              labels: [evidence]
              class: must
              kind: duty
              text: 'Cycle cards (`tasks.md`) take the complete check set: vertical integrity (each card an observable end-to-end behavior, never a horizontal layer) · `**TEST:**` gate present and in grammar (real infrastructure, never a test-suite re-run) · oracle semantics (Asserts graded semantically against the acceptance scenario / criteria they cite — the right expected behaviour, not merely present and in-grammar) · story traceability (every P1/P2 story on ≥1 card; Simple/Split/Merge case + rationale; cited spec/design IDs real) · dependency minimality (`[P]` only where truly independent) · brownfield exposure stated (`none` counts) · no task lists or file paths (pre-written decomposition is a finding — the builder decomposes at build time).'
              anchor: 2026-08-16 vertical-tdd-complexity-and-qa-role
            - id: review-plan-artifacts.cycle-card-check-mirror
              labels: [binding]
              class: must
              kind: binding
              text: >-
                The cycle-card check set mirrors the `tasks` `--check` view — `mochiko-cli
                template tasks --check`, or Read `plugins/mochiko/schemas/tasks.yaml` when the
                binary is absent.
              anchor: 2026-08-16 schema-based-template-guidance
            - id: review-plan-artifacts.incremental-read-bound
              labels: [boundary]
              class: must
              kind: bound
              text: No full re-read of a prior artifact — 1–2 minutes per artifact.
              when: {incremental: present}
              anchor: 2026-07-25 skill-succinctness-strip
            - id: review-plan-artifacts.analysis-checklists
              labels: [floor-pointer]
              class: must
              kind: duty
              text: >-
                The analysis checklist set (constraints-and-decisions) applies as
                references/ARTIFACT-CHECKLISTS.md states it; that file carries no
                `requirements.md` checklist.
              pointer: references/ARTIFACT-CHECKLISTS.md
            - id: review-plan-artifacts.store-delta-checklists
              labels: [floor-pointer]
              class: must
              kind: duty
              text: >-
                The store-delta checklist set applies when the package carries a store delta, else
                the no-delta claim checks — as references/ARTIFACT-CHECKLISTS.md states them,
                including the qualifying-flow guard (a P1 journey is the floor, never the cap),
                the floor-precedence legality row, and the deployment-view row.
              pointer: references/ARTIFACT-CHECKLISTS.md
              anchor: 2026-08-19 product-architecture-schema
            - id: review-plan-artifacts.design-cross-checklists
              labels: [floor-pointer]
              class: must
              kind: duty
              text: >-
                The design and cross-artifact consistency checklist sets apply as
                references/ARTIFACT-CHECKLISTS.md states them — Architecture Conformance keyed
                to the signed store delta, disclosure presence per the external-claims protocol.
              pointer: references/ARTIFACT-CHECKLISTS.md
        - id: review-plan-artifacts.sec.verdict
          title: Verdict — the clearing grammar and its posture
          intent: >-
            The blocking lenses, the mechanical count mapping, and the floors that keep a grade
            honest.
          rules:
            - id: review-plan-artifacts.conformance-blocking
              labels: [verdict]
              class: floor
              kind: gate
              text: 'Conformance is BLOCKING: every named gap closed, within the gap list''s depth.'
              anchor: 2026-08-26 plan-stage-utility
            - id: review-plan-artifacts.material-divergence-autofail
              labels: [verdict]
              class: floor
              text: >-
                Material divergence — an artifact no gap named, or an element class materially
                past the gap list — auto-FAILs the package (`critical-gaps`), overriding the
                count mapping.
              anchor: 2026-08-13 architect-role-pushback-and-abstraction
            - id: review-plan-artifacts.adopt-first-lens
              labels: [verdict, floor-pointer]
              class: must
              kind: gate
              text: 'The adopt-first disclosure lens is BLOCKING at conformance strength: a commodity-category decision naming neither a real shelf candidate nor "no shelf candidate exists" is a finding — trigger and floor at `mochiko:patterns-adopt-first`, never restated; rationale-beats-candidate stays advisory.'
              pointer: mochiko:patterns-adopt-first
            - id: review-plan-artifacts.rung-honesty-advisory
              labels: [verdict, floor-pointer]
              class: must
              text: 'Rung-claim honesty is advisory, never drives the verdict: each seat''s disclosed ladder stops are graded against `mochiko:patterns-plan-minimalism` — the standard, never restated; the independent excess hunt is `mochiko:review-feasibility`''s.'
              pointer: mochiko:patterns-plan-minimalism
              anchor: 2026-08-13 architect-role-pushback-and-abstraction
            - id: review-plan-artifacts.mechanical-verdict
              labels: [verdict]
              class: must
              text: >-
                The verdict comes mechanically from the issue counts per the Verdict Criteria of
                references/ISSUE-TEMPLATES.md, subject to the material-divergence override.
              pointer: references/ISSUE-TEMPLATES.md
            - id: review-plan-artifacts.default-fail
              class: floor
              extends: review-common.default-fail
            - id: review-plan-artifacts.letter-is-spirit
              labels: [verdict]
              class: floor
              text: 'The letter IS the spirit: never skip a check, never downgrade a severity to dodge a finding — rationalizing DOWN means it is probably higher.'
              anchor: 2026-07-25 skill-succinctness-strip
            - id: review-plan-artifacts.na-justified
              labels: [verdict]
              class: floor
              text: >-
                An inapplicable check is flagged N/A with justification, never silently dropped.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: review-plan-artifacts.critical-blocks
              labels: [verdict]
              class: floor
              text: A Critical or Important issue blocks — never "noted but not blocking".
              anchor: 2026-07-25 skill-succinctness-strip
            - id: review-plan-artifacts.severity-classification
              labels: [verdict, floor-pointer]
              class: must
              text: >-
                Severity levels and classification rules are the Severity Levels and
                Classification Rules of references/ISSUE-TEMPLATES.md — applied as stated, never
                re-derived.
              pointer: references/ISSUE-TEMPLATES.md
            - id: review-plan-artifacts.verdict-criteria
              labels: [verdict, floor-pointer]
              class: must
              text: >-
                The three-state verdict — `ready` / `needs-revision` / `critical-gaps` — maps
                from the issue counts per the Verdict Criteria of references/ISSUE-TEMPLATES.md.
              pointer: references/ISSUE-TEMPLATES.md
        - id: review-plan-artifacts.sec.output
          title: Output — report contracts
          intent: Where the grade lands and the shapes it lands in.
          rules:
            - id: review-plan-artifacts.issue-templates
              labels: [binding]
              class: must
              kind: binding
              text: Issues are classified and shaped per references/ISSUE-TEMPLATES.md.
              pointer: references/ISSUE-TEMPLATES.md
            - id: review-plan-artifacts.report-template
              labels: [reporting, binding]
              class: must
              kind: binding
              text: >-
                The report follows `mochiko:advocate-report-template` — evidence and an
                actionable fix per issue, the one-line `strengths:` field filled.
              pointer: mochiko:advocate-report-template
            - id: review-plan-artifacts.incremental-report
              labels: [reporting]
              class: must
              kind: binding
              text: 'The incremental report adds `incremental: true`, `full_review:` / `consistency_only:` scope lists, and pass/fail `consistency_checks:` frontmatter — entity_names · schemas · decisions_honored · architecture_conformance · sensitivity_annotations · integration_boundaries; a failed check also lands as a finding.'
              when: {incremental: present}
              anchor: 2026-09-01 skill-content-schema
            - id: review-plan-artifacts.evidence-floor
              class: floor
              extends: review-common.evidence-floor
              anchor: 2026-08-11 validator-scope-and-verbosity
            - id: review-plan-artifacts.tier1-forms-envelope
              labels: [binding]
              class: must
              kind: binding
              text: >-
                Tier-1 command forms and the exit-code contract are as
                references/ARTIFACT-CHECKLISTS.md states them; density is never itself a finding
                (the artifact-format envelope).
              pointer: references/ARTIFACT-CHECKLISTS.md
        - id: review-plan-artifacts.sec.reserved
          title: Reserved — decisions this seat never takes
          intent: What belongs to the caller and the lead, never to the grader.
          rules:
            - id: review-plan-artifacts.caller-names-sets
              labels: [boundary]
              class: must
              kind: reservation
              text: >-
                In incremental mode the caller names the {new} and {prior} sets — never this
                skill.
              when: {incremental: present}
              anchor: 2026-07-25 skill-succinctness-strip
            - id: review-plan-artifacts.contradiction-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                A contradiction between artifacts is reported — the lead routes it;
                design-vs-decided is Critical consistency here, a contradiction between
                requirements and constraints is `mochiko:review-feasibility`'s.
              when: {incremental: present}
              anchor: 2026-07-25 skill-succinctness-strip
            - id: review-plan-artifacts.unsure-targeted-review
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Unsure whether a prior artifact is still consistent — say so and recommend a
                targeted review, never silently clear it.
              when: {incremental: present}
              anchor: 2026-07-25 skill-succinctness-strip
  - op: import-document
    kind: skill
    name: review-specifications
    content:
      kind: skill
      skill: review-specifications
      conditions:
        manifest-present:
          values: presence
          resolution: surface-presence
          note: the spec carries a Screens & Flows SCR/FLOW manifest with its `prototype/` app.
      sections:
        - id: review-specifications.sec.independence
          title: Independence — who is never whom
          intent: Author/grader separation for the gap-finding seat.
          rules:
            - id: review-specifications.author-grader
              class: floor
              extends: review-common.author-grader
        - id: review-specifications.sec.scope
          title: Scope — jurisdiction and routing
          intent: What this review hunts, what it routes away, and what it never adds.
          rules:
            - id: review-specifications.what-not-how
              labels: [boundary]
              class: must
              text: >-
                WHAT is missing, never HOW to implement — product questions, never
                implementation questions; implementation detail, technical edge cases,
                architecture, and performance belong to later design work.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: review-specifications.not-for
              labels: [boundary]
              class: must
              kind: routing
              text: 'Not for: architecture/design review · code review (sole carve-out `mochiko:review-code-minimalism`, implement-side) · implementation planning · performance specs · no spec yet (`mochiko:authoring-requirements` first) · pre-spec enrichment of a sparse idea (`mochiko:analysis-iterative` — disjoint triggers by design).'
              anchor: 2026-08-05 ponytail-concepts-integration
            - id: review-specifications.excess-admissibility
              labels: [boundary]
              class: must
              text: >-
                An excess / unpaid-scope gap — no user need or ratified driver pays for it —
                is admissible only naming the driver it fails to trace to or the cheaper shape.
              anchor: 2026-08-13 architect-role-pushback-and-abstraction
            - id: review-specifications.never-excess
              class: must
              extends: review-common.never-excess
              anchor: 2026-08-13 architect-role-pushback-and-abstraction
            - id: review-specifications.feature-layer-same-report
              labels: [boundary]
              class: must
              text: >-
                The feature layer is graded with the spec, same reviewer, same report — only the
                story-reader sees derivation dishonesty.
              anchor: 2026-08-10 feature-map-layer
            - id: review-specifications.no-scope-creep
              labels: [boundary]
              class: floor
              text: 'Scope creep is not a gap: clarify existing features, never add new ones as "missing requirements".'
              anchor: 2026-08-11 validator-scope-and-verbosity
        - id: review-specifications.sec.inputs
          title: Inputs — what is read and how far the hunt reaches
          intent: Coverage duties, baselines, and the surfaces the hunt stands on.
          rules:
            - id: review-specifications.complete-coverage
              labels: [evidence]
              class: must
              kind: duty
              text: 'Coverage is complete, never sampled: every user story reviewed for completeness, every success criterion checked for measurability, edge cases hunted per main flow.'
            - id: review-specifications.external-claims
              labels: [evidence]
              class: must
              kind: binding
              text: >-
                A regulatory or product-legal assertion is a floor-class external claim — verify
                per ../review-brainstorm/references/EXTERNAL-CLAIMS.md; undisclosed is a gap.
              pointer: ../review-brainstorm/references/EXTERNAL-CLAIMS.md
            - id: review-specifications.map-git-baseline
              labels: [evidence]
              class: floor
              text: >-
                Grade staged feature-map writes against the git state of the map at run open,
                never a workspace copy.
              anchor: 2026-08-10 feature-map-layer
            - id: review-specifications.map-mirror
              labels: [binding, floor-pointer]
              class: must
              kind: binding
              text: >-
                Feature-map machinery is single-sourced in `mochiko:authoring-feature-map`; the
                feature-layer check list is the reviewer's mirror, never a second definition.
              pointer: mochiko:authoring-feature-map
            - id: review-specifications.sf-legal-shapes
              labels: [boundary]
              class: must
              text: 'A UX-bearing spec has two legal Screens & Flows shapes: a SCR/FLOW manifest with its `prototype/` app, or the waiver line "No UX surface — prototype waived at intent".'
              anchor: 2026-08-02 ux-mocking-in-specify
            - id: review-specifications.serve-and-click
              labels: [evidence]
              class: must
              kind: duty
              text: 'Serve the prototype and click it (bun, or open `prototype/index.html`) — adversarial, not ceremonial: a skeptic walking the app finds what a text read cannot.'
              when: {manifest-present: present}
              anchor: 2026-08-02 ux-mocking-in-specify
            - id: review-specifications.check-existing-first
              labels: [evidence]
              class: floor
              kind: duty
              text: >-
                Check existing patterns and decisions first — never ask what is already
                answered.
              anchor: 2026-08-11 validator-scope-and-verbosity
        - id: review-specifications.sec.verdict
          title: Verdict — the grading grammar
          intent: >-
            The hunt taxonomy, the check sets, and the severity grammar findings are graded by.
          rules:
            - id: review-specifications.gap-taxonomy
              labels: [verdict, binding]
              class: must
              kind: binding
              text: >-
                The six requirement-defect classes — missing requirements · ambiguities · edge
                cases · assumption gaps · contradictions · excess / unpaid scope — are the
                canonical hunt taxonomy `devils-advocate` leans on; hunt them across the
                user-facing categories (user expectations · business rules · scope boundaries ·
                success/failure states · permissions).
              anchor: 2026-07-25 skill-succinctness-strip
            - id: review-specifications.smuggled-posture
              labels: [verdict]
              class: must
              text: >-
                Implementation posture smuggled into a constraint ("files on disk" where the
                requirement is "locally computable") is an assumption-gap finding — it freezes a
                choice stakeholders never ratified.
            - id: review-specifications.feature-critical-checks
              labels: [verdict]
              class: must
              kind: duty
              text: 'Feature-layer Critical checks: derivation honesty (every feature traceable to supporting stories) · disposition completeness (every story homed to exactly one feature, or filter-rejected with the why recorded) · dedup by capability against the map files at baseline · delta legality (full grammar — what grows, in-flight mark, named spec; no `delivered` regressed) · SC re-homing (every SC-XXX on a verifying feature; deferred SCs and one-sided seams on the owning entry''s obligations line) · in-flight handling (touches read into the owning spec; resolved by reference, sequenced delta, or escalation — never silent contradiction).'
              anchor: 2026-08-10 feature-map-layer
            - id: review-specifications.feature-important-checks
              labels: [verdict]
              class: must
              kind: duty
              text: 'Feature-layer Important checks: granularity (one-breath capability, extent ≤ ~3 lines, or split) · entry well-formedness (entry-template shape, all fields) · selection-card honesty (deferred-SC list visible, agreeing with the SC split) · specs-index agreement (staged row matches staged writes — slug, FEAT-IDs, outcomes).'
              anchor: 2026-08-10 feature-map-layer
            - id: review-specifications.authority-split
              labels: [verdict]
              class: must
              text: 'Prototype authority split: flows, screens, and data shown are binding; layout and styling advisory — a cosmetic finding against a low-fi prototype is wrong-altitude.'
              when: {manifest-present: present}
              anchor: 2026-08-02 ux-mocking-in-specify
            - id: review-specifications.sf-critical-checks
              labels: [verdict]
              class: must
              kind: duty
              text: 'Screens & Flows Critical checks: screen reachability (every SCR-XXX renders a reachable page) · flow walkability (every FLOW-XXX clickable end-to-end, no dead ends) · scenario coverage (every P1 acceptance scenario has a FLOW click path) · flow traceability (every FLOW-XXX keyed to a real story scenario — no scope invention) · drift both directions (no page without a SCR row, no row without its page).'
              when: {manifest-present: present}
              anchor: 2026-08-02 ux-mocking-in-specify
            - id: review-specifications.sf-important-checks
              labels: [verdict]
              class: must
              kind: duty
              text: 'Screens & Flows Important checks: data-shape honesty (realistic fields/cardinality, enough to expose layout and flow problems) · FEAT tags (post-derivation rows FEAT-tagged; out-of-selection and filter-rejected screens greyed but reachable, rejected ones carrying the rejection pointer) · waiver second-guess (a waiver where stories imply screens, or a prototype the intent ruled out — graded against the Intent section''s UX-bearing ruling).'
              when: {manifest-present: present}
              anchor: 2026-08-02 ux-mocking-in-specify
            - id: review-specifications.severity-grammar
              labels: [verdict]
              class: must
              text: 'Severity grammar: Critical = cannot build without this answer, ask now · Important = will cause rework, should ask now · Minor = polish, log and defer.'
              anchor: 2026-07-25 skill-succinctness-strip
            - id: review-specifications.density-never-gap
              labels: [verdict]
              class: floor
              text: >-
                Density is never itself a gap (the `templates/artifact-format.md` envelope) —
                grade substance, never prose style; undisclosed overage past the envelope's size
                defaults is advisory per its rule 8.
              anchor: 2026-08-22 verbosity-envelope-enforcement
        - id: review-specifications.sec.output
          title: Output — questions and report contracts
          intent: The question craft and the shapes the findings land in.
          rules:
            - id: review-specifications.question-format
              labels: [reporting]
              class: must
              text: 'Every question is a decision the stakeholder can make: 2–3 concrete options, what each means for users, why it matters — specific, never vague.'
            - id: review-specifications.no-presupposed-mechanism
              labels: [reporting]
              class: must
              text: >-
                Never presuppose a mechanism in a question — "should we cache?" assumes caching.
            - id: review-specifications.clarifications-shape
              labels: [reporting, binding]
              class: must
              kind: binding
              text: >-
                Questions land in the Clarifications shape of
                `templates/advocate-report-template.md`, never a variant.
            - id: review-specifications.report-structure
              labels: [reporting, binding]
              class: must
              kind: binding
              text: >-
                Report structure (machine-first findings YAML, clarifications with options +
                impact, recommended verdict, one-line `strengths:`) is single-sourced at
                `templates/advocate-report-template.md`; no report path named → same structure
                inline.
            - id: review-specifications.evidence-floor
              class: floor
              extends: review-common.evidence-floor
              anchor: 2026-08-11 validator-scope-and-verbosity
            - id: review-specifications.gap-bound
              labels: [reporting]
              class: floor
              kind: bound
              text: >-
                5–7 Critical/Important gaps per round, related gaps grouped — never a 20-gap
                dump.
              anchor: 2026-08-11 validator-scope-and-verbosity
        - id: review-specifications.sec.reserved
          title: Reserved — the clearing this seat never issues
          intent: 'The verdict posture: input to the caller, never a clearing of its own.'
          rules:
            - id: review-specifications.input-not-verdict
              labels: [verdict, boundary]
              class: floor
              text: >-
                The output is gap-finding input, never a clearing PASS/FAIL verdict of its own.
  - op: import-document
    kind: skill
    name: review-sufficiency
    content:
      kind: skill
      skill: review-sufficiency
      vars:
        verdict: sufficient
      conditions:
        scope:
          values: [selection, delta]
          resolution: entry-derived
          note: >-
            selection scope grades per selected work row; delta scope grades per delta card under
            the three-clause collapse.
      sections:
        - id: review-sufficiency.sec.independence
          title: Independence — who is never whom
          intent: Author/grader separation for the sufficiency seat.
          rules:
            - id: review-sufficiency.author-grader
              class: floor
              extends: review-common.author-grader
              anchor: 2026-08-26 plan-stage-utility
        - id: review-sufficiency.sec.scope
          title: Scope — the grading unit
          intent: >-
            What one grade covers under each scope, and what collapses away under delta scope.
          rules:
            - id: review-sufficiency.unit-and-collapse
              labels: [boundary]
              class: must
              text: 'Selection scope grades per selected work row — the work row is the map''s unit of scope. Delta scope grades per delta card, and only three clauses apply: criteria testable · touched surfaces identified (contract and data exposure) · store consult and trip check run.'
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.clause9-delta-inapplicable
              labels: [boundary]
              class: must
              text: >-
                The delivered-feature exposure clause does not apply under delta scope — the
                desk's delta card is itself the `[MODIFY]` instrument, carrying the marked delta
                on the entry and folding at landing; a delta fix discovered structural re-fires
                the design phase rather than clearing here.
              when: {scope: delta}
              anchor: 2026-08-26 plan-stage-utility
        - id: review-sufficiency.sec.inputs
          title: Inputs — the read fence
          intent: What is read, what is never read, and the one carve the fence admits.
          rules:
            - id: review-sufficiency.fence-read-set
              labels: [fence, binding]
              class: must
              kind: binding
              text: >-
                Read the feature's `spec.md` (its Screens & Flows manifest included), the product
                architecture store, the product baselines (`data-model.md`, `contracts/`,
                `constraints-and-decisions.md`), and the capability map entries at
                `.mochiko/features/FEAT-XXX-<slug>.md`.
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.fence-never-reads
              labels: [fence]
              class: floor
              text: >-
                Never read the code, `tasks.md`, `**TEST:**` cases, cycle reports, or this batch's
                own `FEAT-XXX/` run-output directory — all are downstream of this verdict, and
                reading them makes the check circular.
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.clause10-carve
              labels: [fence]
              class: must
              kind: latitude
              text: >-
                An in-flight collision under the in-flight exposure clause licenses reading the
                colliding feature's design-phase deltas and owning spec — the sole run-output
                read the fence admits, scoped to the colliding surface, never extended to that
                feature's code, cards, or cycle reports.
              anchor: 2026-08-26 plan-stage-utility
        - id: review-sufficiency.sec.verdict
          title: Verdict — the clause set and its posture
          intent: >-
            The gate semantics, the ten clauses with their gap forms, and the floors that keep a
            grade honest.
          rules:
            - id: review-sufficiency.binding-gate
              labels: [verdict]
              class: must
              kind: gate
              text: >-
                A `sufficient` verdict licenses cards and build directly; any gap scopes the
                in-run design phase to exactly the named gaps, nothing else.
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.every-applicable-clause
              labels: [verdict]
              class: floor
              text: >-
                A unit is sufficient only when every applicable clause holds — a clause that
                cannot be graded is a gap, never a pass.
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.clause-testable-criteria
              labels: [verdict]
              class: must
              kind: duty
              text: >-
                Testable criteria — every acceptance scenario and SC-XXX has a stateable oracle.
                No stateable oracle = gap.
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.clause-contract-exposure
              labels: [verdict]
              class: must
              kind: duty
              text: 'Contract exposure — every touched API surface named, then graded against baseline `contracts/`: named-and-locatable (the baseline publishes a continuation point the surface attaches to) = no gap; named-and-unattachable (no seam exists to attach it) = gap.'
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.clause-data-exposure
              labels: [verdict]
              class: must
              kind: duty
              text: >-
                Data exposure — every touched entity named, then graded against baseline
                `data-model.md` on the same locatable / unattachable split.
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.clause-structural-trigger
              labels: [verdict]
              class: must
              kind: duty
              text: 'Structural trigger — store consulted, trip check run, and either a no-delta claim recordable or a delta needed (gap). Spine elements whose `Derived from` cites the row''s own feature or epic delta are excluded from the no-delta evidence: a row never satisfies this clause with its own planned structure.'
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.clause-nfr-targets
              labels: [verdict]
              class: must
              kind: duty
              text: >-
                NFR targets — the applicable store concern rows identified and their targets
                stated. Targets absent = gap. A row plausibly bearing NFR load (user-facing
                latency, data volume, auth surface, availability) with no identifiable concern row
                = gap.
              when: {scope: selection}
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.clause-commodity-exposure
              labels: [verdict]
              class: must
              kind: duty
              text: >-
                Commodity exposure — any storage, queueing, caching, auth, search, or
                serialization need named and adopt-first answerable. A stated mechanism with no
                weighed alternatives is not resolved; unresolved = gap.
              when: {scope: selection}
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.clause-dependency-order
              labels: [verdict]
              class: must
              kind: duty
              text: Dependency order — in-batch row dependencies resolvable. Unresolvable = gap.
              when: {scope: selection}
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.clause-ux-trace
              labels: [verdict]
              class: must
              kind: duty
              text: 'UX trace — where the spec carries a Screens & Flows manifest: every FEAT-tagged SCR-XXX''s data shown has a nameable serving contract surface, and every FLOW-XXX action a mutation path. Existing = cited; new = gap. No manifest = n/a.'
              when: {scope: selection}
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.clause-delivered-feature
              labels: [verdict]
              class: must
              kind: duty
              text: 'Delivered-feature exposure — keyed on the row''s status, never the capability''s. A touched surface owned by a delivered row is never zero-gap: it auto-fires the design phase, its `[MODIFY]` amendment is named in this report, and the amendment is written as the marked delta on the affected feature''s map entry.'
              when: {scope: selection}
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.clause-in-flight
              labels: [verdict]
              class: must
              kind: duty
              text: 'In-flight exposure — keyed on the row''s status. A touched surface owned by an in-flight row obliges reading that feature''s deltas and owning spec: need covered → cite the planned contract, no gap · adjacent → gap, the design phase authors the proposed delta sequenced behind that delivery · conflicting → reserved to the user at run-open. No locks — conflict routing is a question to the user, never a hold on the touched feature; only silent contradiction is prohibited.'
              when: {scope: selection}
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.absent-baseline
              labels: [verdict]
              class: must
              text: 'An absent baseline file grades its touched surfaces new (gap), never n/a. The design phase''s first duty is then the seed: empty scaffolds where no code is delivered, reconstruct-and-confirm with the user at the design checkpoint where delivered code exists.'
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.verdict-routing
              labels: [verdict]
              class: must
              kind: gate
              text: >-
                The verdict is binding at entry — a gap list routes to the design phase, zero
                gaps routes to cards and build.
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.default-fail
              class: floor
              extends: review-common.default-fail
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.na-justified
              labels: [verdict]
              class: floor
              text: >-
                Every clause graded, or flagged n/a with its justification — never silently
                dropped. The UX-trace clause's no-manifest n/a and the delivered-feature clause's
                delta-scope n/a are the only structural ones.
              anchor: 2026-08-26 plan-stage-utility
        - id: review-sufficiency.sec.output
          title: Output — the report contract
          intent: Where the verdict lands and what the report carries.
          rules:
            - id: review-sufficiency.report-binding
              labels: [reporting, binding]
              class: must
              kind: binding
              text: 'The verdict lands as `sufficiency-report.md` in the feature dir (`.mochiko/features/FEAT-XXX/`), under the `templates/report-format.md` envelope. It carries: the per-unit verdicts · the gap list, each gap keyed to its clause · the store-consult result and any no-delta claim · store trips awaiting the user''s disposition at run-open · in-flight conflicts routed to the user · any `[MODIFY]` amendment naming · the `quickstart.md` null-path record where no real external-integration surface exists.'
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.evidence-floor
              labels: [evidence]
              class: floor
              text: >-
                Verdict and dispositions land in the report — review evidence living only in
                conversation is a floor violation.
              anchor: 2026-08-26 plan-stage-utility
        - id: review-sufficiency.sec.reserved
          title: Reserved — decisions this seat never takes
          intent: What routes to the lead and what only the user rules.
          rules:
            - id: review-sufficiency.trips-user-ruled
              labels: [user-gate]
              class: must
              kind: reservation
              text: 'A store trip — a touched row standing `open` or `not-now` — never becomes a gap. It rides the verdict report and is dispositioned by the user at run-open: warn and record; a recorded deferral is a legal escape, a silent skip is not.'
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.disputed-clause-gap
              labels: [user-gate]
              class: floor
              kind: reservation
              text: >-
                A disputed clause defaults to gap and the dispute goes to the user; the grader
                never clears alone.
              anchor: 2026-08-26 plan-stage-utility
            - id: review-sufficiency.verdict-is-input
              class: floor
              kind: reservation
              extends: review-common.verdict-is-input
              anchor: 2026-08-26 plan-stage-utility
  - op: import-document
    kind: skill
    name: testing-end-user
    content:
      kind: skill
      skill: testing-end-user
      sections:
        - id: testing-end-user.sec.independence
          title: Independence — none bound
          intent: Who is never whom while this skill runs.
          note: >-
            Deliberately empty — the census records no independence-shaped obligation for this
            member; the human gate that gates completion is reserved-section territory.
          rules: []
        - id: testing-end-user.sec.scope
          title: Scope — the owned runtime and the grammar seam
          intent: >-
            What this skill owns (the runtime), what it consumes but never redefines, and the
            walk-order discipline of the execution sequence.
          rules:
            - id: testing-end-user.grammar-consumed-never-redefined
              labels: [boundary]
              class: must
              kind: binding
              text: 'The `**TEST:**` construct — its legal marker set, field skeleton, action-modifier vocabulary, and assert-pattern vocabulary — is authored and owned by `patterns-vertical-tdd` in `../patterns-vertical-tdd/references/TEST-GRAMMAR.md`. This skill consumes that grammar; it does not redefine it. What this skill owns is the runtime: how to detect, parse, execute, evaluate, capture, classify, report, and gate.'
              pointer: ../patterns-vertical-tdd/references/TEST-GRAMMAR.md
              anchor: 2026-08-16 vertical-tdd-complexity-and-qa-role
            - id: testing-end-user.grammar-owner-wins
              labels: [boundary]
              class: must
              text: >-
                The parsing regexes are parse mechanics for the grammar defined by the owner —
                when the two would differ, the grammar owner wins. Detection boundaries, field
                extraction, and legacy-marker normalization live in `references/TASK-PARSING.md`,
                referenced never restated.
              pointer: references/TASK-PARSING.md
              anchor: 2026-08-02 plan-task-granularity D2
            - id: testing-end-user.strict-order
              labels: [ladder]
              class: floor
              text: Execute in strict order. No skipping steps. No reordering.
              anchor: 2026-08-11 guardrails-vs-detail
            - id: testing-end-user.setup-fail-fast
              labels: [ladder]
              class: must
              text: >-
                Fail fast if any setup fails — a setup failure blocks action execution. Record
                all setup output for debugging.
              anchor: 2026-08-11 guardrails-vs-detail
            - id: testing-end-user.modifier-execution-semantics
              labels: [evidence]
              class: must
              kind: duty
              text: 'The modifier execution semantics are owned here: `(background)` starts the action asynchronously and tracks its PID so output can be read for later asserts and the process cleaned up, pass or fail; `(timeout Ns)` enforces N seconds as the per-action limit — on expiry, capture whatever output exists, kill the process, and mark the result `TIMEOUT`; `(in path)` runs the action in the given directory.'
              anchor: 2026-08-11 guardrails-vs-detail
            - id: testing-end-user.assert-evaluation-semantics
              labels: [evidence]
              class: must
              kind: duty
              text: 'Evaluate each assert against the captured evidence with the evaluation semantics owned here: `Console contains` is a substring match against captured stdout/stderr (its `(within Ns)` form polls streaming output until the text appears or the window elapses); `File exists:` is a filesystem check (`test -f`); `Response status:` compares the captured HTTP status against the expected code; `Screen reached:` and `Page contains` are Playwright checks against the current URL/selector and the rendered page content.'
              anchor: 2026-08-11 guardrails-vs-detail
            - id: testing-end-user.rationalization-stop
              labels: [ladder]
              class: floor
              text: 'If any Red-Flags thought arises, STOP immediately — rationalization in progress: return to the execution sequence and follow every step. No exceptions — not for simple tests that obviously pass, an impatient user, slow evidence capture, a setup identical to a previous run, or "just checking one thing".'
              anchor: 2026-08-11 guardrails-vs-detail
        - id: testing-end-user.sec.inputs
          title: Inputs — task and gate sources
          intent: Where the parsed task and the quality-gate commands come from.
          rules:
            - id: testing-end-user.parse-error-halts
              labels: [user-gate]
              class: must
              kind: routing
              text: >-
                A task missing `**Action**` or `**Assert**` is a parsing error — report it, do
                not attempt execution, and ask the human how to proceed; error handling per
                `references/TASK-PARSING.md`.
              pointer: references/TASK-PARSING.md
              anchor: 2026-08-02 plan-task-granularity D2
            - id: testing-end-user.gate-source-binding
              labels: [binding]
              class: must
              kind: binding
              text: >-
                Quality-gate commands come from the `## Quality Gates` section of `tasks.md` and
                the project's own build configuration.
              anchor: 2026-08-26 plan-stage-utility D4
        - id: testing-end-user.sec.verdict
          title: Verdict — classification and result grammar
          intent: >-
            The runtime classification, the result vocabulary, and the evaluation posture that
            earns each status.
          rules:
            - id: testing-end-user.no-default-pass
              labels: [verdict, evidence]
              class: floor
              text: >-
                Each assert MUST receive an explicit pass/fail evaluation. No default to PASS —
                an unevaluated assert is a failure.
              anchor: 2026-08-11 guardrails-vs-detail
            - id: testing-end-user.runtime-classification-owned
              labels: [verdict]
              class: must
              text: 'The runtime classification is owned by this skill: before execution, classify the task from its Action and Assert content — CLI (backtick commands + measurable asserts; may auto-approve if 100% pass) · GUI (UI actions such as `click`/`tap`, or screenshot capture; always human checkpoint) · SUBJECTIVE (qualitative terms such as `looks`, `feels`, `appears`; always human checkpoint).'
              anchor: 2026-08-11 guardrails-vs-detail
            - id: testing-end-user.browser-flow-exception
              labels: [verdict]
              class: must
              text: 'Browser-flow exception: a GUI-shaped task whose actions are Playwright-driven against a cited `FLOW-XXX` path (from the spec''s Screens & Flows manifest) and whose asserts are drawn only from the grammar''s machine-evaluable patterns classifies as CLI — the walk is deterministic and may auto-approve at 100% pass, screenshots captured as evidence regardless. A subjective or custom assert anywhere in the task keeps it SUBJECTIVE/GUI. The binding surface is the flow — screen sequence and actions; visual appearance stays advisory and is never an assert target.'
              anchor: 2026-08-02 ux-mocking-in-specify D9
            - id: testing-end-user.default-subjective
              labels: [verdict, user-gate]
              class: floor
              text: >-
                Default to SUBJECTIVE if uncertain — ambiguity is a reason to escalate to a
                human, never a reason to auto-approve. Any failure, on any classification, forces
                a checkpoint.
              anchor: 2026-08-11 guardrails-vs-detail
            - id: testing-end-user.result-vocabulary
              labels: [verdict]
              class: must
              text: 'Result vocabulary: `PASS` (all asserts passed) · `FAIL` (one or more asserts failed) · `PARTIAL` (mixed results, needs judgment) · `TIMEOUT` (action exceeded its time limit) · `ERROR` (execution error, not an assertion failure).'
              anchor: 2026-08-11 guardrails-vs-detail
            - id: testing-end-user.gates-auto-resolve
              labels: [verdict, evidence]
              class: floor
              text: 'Quality gates always auto-resolve — exit `0` = pass, non-zero = fail, the failure output recorded. They are deterministic ground truth, not a matter of judgment: no human checkpoint for gate results, and the exit-code determinism MUST NOT be softened into an LLM judgment call.'
              anchor: 2026-08-26 plan-stage-utility D4
        - id: testing-end-user.sec.output
          title: Output — evidence and the report
          intent: >-
            What is captured, what the persisted report is, and what completes before the
            checkpoint.
          rules:
            - id: testing-end-user.report-machine-first
              labels: [reporting, binding]
              class: must
              kind: binding
              text: 'The persisted verification report is machine-first per `references/REPORT-TEMPLATES.md`: YAML frontmatter (per-task results, quality gates under the `quality_gates` section, classification, recommendation) — all PASS is frontmatter only; any FAIL / PARTIAL / TIMEOUT / ERROR adds a `## Failures` section with the evidence tables and bounded output excerpts for the failing items.'
              pointer: references/REPORT-TEMPLATES.md
              anchor: 2026-08-01 verbosity-caveman-ops-separation D4
            - id: testing-end-user.completion-set
              labels: [evidence, reporting]
              class: must
              kind: duty
              text: 'Before presenting the checkpoint, verify completion of ALL items: setup commands completed · actions executed or timed out · every assert evaluated · evidence captured per the Capture field · report generated at the proper detail level. No presenting partial results. No skipping evidence capture.'
              anchor: 2026-08-11 guardrails-vs-detail
            - id: testing-end-user.evidence-capture-binding
              labels: [evidence, binding]
              class: must
              kind: binding
              text: >-
                Capture evidence per `references/EVIDENCE-CAPTURE.md` — console capture,
                background-process PID tracking, timeout handling, and the four evidence types
                (`console` / `screenshot` / `logs` / `timing`).
              pointer: references/EVIDENCE-CAPTURE.md
              anchor: 2026-08-11 guardrails-vs-detail
            - id: testing-end-user.sanctioned-set-closure
              labels: [reporting]
              class: floor
              text: 'The report''s sanctioned section set is closed, its register is bound, and prose on a clean report is a defect — per the rules in `references/REPORT-TEMPLATES.md`, the ruled restatement of `templates/report-format.md` in this payload home ([v0.44.0] KEPT: cut it only with a ruling that also re-homes the check).'
              pointer: references/REPORT-TEMPLATES.md
              anchor: 2026-08-01 verbosity-caveman-ops-separation D4
            - id: testing-end-user.truncation-bounds
              labels: [reporting]
              class: must
              text: >-
                Failure evidence in the report is bounded with full-log pointers per the
                truncation rules in `references/REPORT-TEMPLATES.md`; the checkpoint presentation
                is in-memory and never persisted.
              pointer: references/REPORT-TEMPLATES.md
            - id: testing-end-user.cleanup-protocol
              labels: [evidence]
              class: must
              kind: duty
              text: 'Cleanup per `references/EVIDENCE-CAPTURE.md`: background processes are stopped pass or fail; on failure keep the logs for debugging, report their locations, and clean up only after the human reviews.'
              pointer: references/EVIDENCE-CAPTURE.md
        - id: testing-end-user.sec.reserved
          title: Reserved — the human's gate
          intent: Decisions this skill never takes.
          rules:
            - id: testing-end-user.human-gate
              labels: [user-gate]
              class: floor
              kind: gate
              text: >-
                The human decision gates completion — approve, reject, or retry; no proceeding
                without explicit human approval, and execution never continues past an explicit
                reject.
              anchor: 2026-08-11 guardrails-vs-detail
            - id: testing-end-user.custom-assert-to-human
              labels: [user-gate]
              class: must
              kind: routing
              text: >-
                Any assert text outside the grammar's machine-evaluable patterns is a custom
                assertion for human evaluation at the checkpoint.
              anchor: 2026-08-11 guardrails-vs-detail
  - op: import-document
    kind: skill
    name: testing-gap-finding
    content:
      kind: skill
      skill: testing-gap-finding
      conditions:
        run_scope:
          values: [selection, epic, delta, product-lane]
          resolution: entry-derived
          note: the implement run's scope class, declared at run open.
        depth:
          values: [low, high]
          resolution: entry-derived
          note: the project's declared depth level; probe-kit breadth is invariant at both.
        mutation_tool:
          values: presence
          resolution: surface-presence
          note: a stack-matched mutation tool available to the verification seat.
      sections:
        - id: testing-gap-finding.sec.independence
          title: Independence — the blind seat and the split authorships
          intent: Who explores, who runs the lens, and who authors the fold-back.
          rules:
            - id: testing-gap-finding.seat-devils-advocate
              labels: [independence]
              class: must
              kind: binding
              text: >-
                The seat is `mochiko:devils-advocate` — the adversarial gap-hunt craft. Persona
                carries the judgment, this skill carries the procedure.
              pointer: mochiko:devils-advocate
              anchor: 2026-08-19 qa-gap-finding-verification D4
            - id: testing-gap-finding.lens-alongside-never-inside
              labels: [independence]
              class: floor
              text: >-
                The mutation lens needs code sight, so it runs alongside, never inside, the blind
                explorer — on the existing verification seat, which already holds code sight.
              anchor: 2026-08-19 qa-gap-finding-verification D5
            - id: testing-gap-finding.fold-back-authorship
              labels: [independence]
              class: must
              text: >-
                Every gap the user rules fix-now or backlog is authored as a `**TEST:**` case, in
                the grammar owned by `mochiko:patterns-vertical-tdd`, by the QA craft
                (`mochiko:qa-engineer`) — never the exploratory seat. Findings accepted
                as-designed do not fold.
              anchor: 2026-08-19 qa-gap-finding-verification D7
        - id: testing-gap-finding.sec.scope
          title: Scope — one pass, its placement, and the jurisdiction lines
          intent: Where the pass runs, what it never executes, and the lens's bounds.
          rules:
            - id: testing-gap-finding.test-execution-is-testing-end-user
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                Executing a declared `**TEST:**` case belongs to `mochiko:testing-end-user` —
                re-running declared cases, or authoring unit tests, is not this layer.
              pointer: mochiko:testing-end-user
            - id: testing-gap-finding.test-grammar-consumed-never-redefined
              labels: [boundary]
              class: must
              kind: binding
              text: >-
                The `**TEST:**` construct is owned by `mochiko:patterns-vertical-tdd` — consumed
                here when folding findings back, never redefined.
              pointer: mochiko:patterns-vertical-tdd
            - id: testing-gap-finding.one-pass-at-final-validation
              labels: [boundary]
              class: must
              text: >-
                One pass, at final validation, over the whole built feature — full surface
                visible, seams live against real delivered sides, one cost per run.
                Selection-scope runs run the pass; an epic runs it once, over the union of member
                territories, at the epic's single final validation.
              when: {run_scope: [selection, epic]}
              anchor: 2026-08-19 qa-gap-finding-verification D2
            - id: testing-gap-finding.delta-lane-skip-stated
              labels: [reporting]
              class: floor
              kind: duty
              text: 'Delta-scope and product-lane runs are skipped, and the final-validation report states the skip explicitly. A silent no-op is a defect: their sole expectation source is the card, which the fence forbids.'
              when: {run_scope: [delta, product-lane]}
              anchor: 2026-08-19 qa-gap-finding-verification D2
            - id: testing-gap-finding.real-infrastructure-never-mocks
              labels: [evidence]
              class: floor
              text: Probing runs against real infrastructure, never mocks.
              anchor: 2026-08-19 qa-gap-finding-verification D2
            - id: testing-gap-finding.probe-kit-breadth-invariant
              labels: [evidence]
              class: must
              text: The probe kit's seven families run at both depth levels; breadth is invariant.
            - id: testing-gap-finding.mutation-lens-bounds
              labels: [boundary]
              class: must
              kind: bound
              text: >-
                The mutation lens runs at HIGH depth only, over this feature's diff only
                (changed-code mutation, `cargo-mutants --in-diff` class), timeboxed.
              when: {depth: high, mutation_tool: present}
              anchor: 2026-08-19 qa-gap-finding-verification D5
            - id: testing-gap-finding.tool-advisory-posture
              labels: [boundary]
              class: floor
              text: 'The mutation tool is an advisory post-hoc checker read as an optional exit-code signal: it never gates progress, never dispatches agents, never holds judgment this skill owns.'
              anchor: 2026-08-19 qa-gap-finding-verification D10
            - id: testing-gap-finding.out-of-territory-routing
              labels: [boundary]
              class: must
              kind: routing
              text: >-
                A gap in a previously delivered feature's territory — via the accumulated gates
                or a seam — is not this run's rework. It routes to a `/mochiko:feature` delta
                card, cited in the report.
              anchor: 2026-08-19 qa-gap-finding-verification D6
        - id: testing-gap-finding.sec.inputs
          title: Inputs — the blindness fence and the derivation duty
          intent: >-
            The explicit inclusion list, its structural exclusions, and what is on the record
            before probing opens.
          rules:
            - id: testing-gap-finding.blindness-fence-inclusion-list
              labels: [fence]
              class: floor
              kind: binding
              text: 'The explorer is blind to code and cards. Admissible inputs are an explicit inclusion list, not a layer label: `spec.md` (FR-XXX, SC-XXX, stories, declared edge cases) · the run''s sufficiency report and the feature''s design-phase deltas — those two artifacts only, never the `FEAT-XXX/` run-output directory at large · Screens & Flows (SCR-XXX, FLOW-XXX) · `data-model.md` (entities, state machines, DS-XXX sensitivity) · `contracts/` (`api.yaml` and any sibling contract documents) · the architecture store''s concern rows only — their `NFR-XXX` targets (`.mochiko/product/architecture/concerns.md` plus any graduated `concerns/AX-XXX-<slug>.md`). All define externally-observable promised behavior, so the pass stays black-box.'
              anchor: 2026-08-19 qa-gap-finding-verification D3
            - id: testing-gap-finding.spine-outside-fence
              labels: [fence]
              class: must
              text: >-
                The store's spine deep view stays outside the fence — it is design structure,
                not promised behavior, and admitting it would widen the fence no ruling widened.
              anchor: 2026-08-19 product-architecture-schema D12
            - id: testing-gap-finding.structural-exclusions
              labels: [fence]
              class: floor
              text: 'Excluded, structurally: the code · the cycle cards (`tasks.md`) · the `**TEST:**` cases · cycle reports · the builder''s tests.'
              anchor: 2026-08-19 qa-gap-finding-verification D3
            - id: testing-gap-finding.delegated-reads-inherit-fence
              labels: [fence]
              class: floor
              text: >-
                Delegated reads inherit the inclusion list. A locate, enumeration, or targeted
                read over the code, the cycle cards, or the `**TEST:**` cases is outside the fence
                and is never delegated — a subagent's return carries code sight back to the
                blind seat exactly as a direct read would.
              anchor: 2026-08-19 qa-gap-finding-verification D3
            - id: testing-gap-finding.two-message-dispatch
              labels: [fence, independence]
              class: floor
              kind: duty
              text: >-
                The fence is held by dispatch order, not trust. Message 1 carries inclusion-list
                references only — never a card, code, or `**TEST:**` path — and the seat reads
                them and states its derived expectations; message 2 opens probing only once those
                expectations are on the record.
              anchor: 2026-08-19 qa-gap-finding-verification D3
            - id: testing-gap-finding.expectations-numbered-before-probing
              labels: [evidence]
              class: must
              kind: duty
              text: >-
                Before probing, expected behaviors are enumerated as a numbered list, across the
                five derivation families — the numbering makes the done condition's count
                auditable.
              anchor: 2026-08-19 qa-gap-finding-verification D3
        - id: testing-gap-finding.sec.verdict
          title: Verdict — the finding-kind split and the clean-pass polarity
          intent: How findings classify, and what completes the pass.
          rules:
            - id: testing-gap-finding.finding-kind-split
              labels: [verdict, evidence]
              class: must
              text: >-
                Findings split by kind, never by severity. Spec-violation is blocking — final
                validation fails — with evidence captured and the spec clause cited; a broken
                `NFR-XXX` numeric target on a store concern row qualifies. Beyond-spec (robustness
                gap, undeclared edge behavior, surviving mutant, observability hole) is advisory
                to the final checkpoint, where the user rules fix-now / backlog / accept.
              anchor: 2026-08-19 qa-gap-finding-verification D6
            - id: testing-gap-finding.observability-advisory-only
              labels: [verdict]
              class: must
              text: 'Observability findings are advisory-only, always: by construction no clause exists to cite.'
              anchor: 2026-08-19 qa-gap-finding-verification D6
            - id: testing-gap-finding.surviving-mutants-advisory
              labels: [verdict]
              class: must
              text: Surviving mutants are beyond-spec advisory findings — never blocking.
              anchor: 2026-08-19 qa-gap-finding-verification D5
            - id: testing-gap-finding.done-condition
              labels: [verdict]
              class: must
              kind: duty
              text: >-
                The pass is complete when every derived expectation has been probed, or explicitly
                marked unprobeable with a reason, within the charter's timebox.
              anchor: 2026-08-19 qa-gap-finding-verification D8
            - id: testing-gap-finding.zero-findings-clean-pass
              labels: [verdict]
              class: must
              text: >-
                Zero findings is a clean pass — no never-zero rule, no quota. The disclosure is
                the honesty mechanism, not the finding tally; padding findings to avoid a zero
                corrupts the disclosure.
              anchor: 2026-08-19 qa-gap-finding-verification D8
        - id: testing-gap-finding.sec.output
          title: Output — the disclosure, the noted skips, and the durable gate set
          intent: What the report states and where fold-back lands.
          rules:
            - id: testing-gap-finding.tool-absent-skip-noted
              labels: [reporting]
              class: must
              kind: duty
              text: >-
                Tool absent = lens skipped AND noted — never silent. Routine on the mobile and
                desktop shelves, where mutation tooling is sparse; note it there too.
              when: {mutation_tool: absent}
              anchor: 2026-08-19 qa-gap-finding-verification D5
            - id: testing-gap-finding.flaky-suite-skip-noted
              labels: [reporting]
              class: must
              kind: duty
              text: A flaky suite detected during the run = lens skipped, and the skip noted.
              when: {mutation_tool: present}
              anchor: 2026-08-19 qa-gap-finding-verification D5
            - id: testing-gap-finding.report-disclosure
              labels: [reporting, evidence]
              class: must
              kind: binding
              text: >-
                The final-validation report discloses the expectation count, the probed count,
                each unprobeable expectation with its reason, and the findings by kind.
              anchor: 2026-08-19 qa-gap-finding-verification D8
            - id: testing-gap-finding.gates-artifact-contract
              labels: [binding]
              class: must
              kind: binding
              text: 'The durable gate set is `.mochiko/features/FEAT-XXX/gates.md` — minted at first fold (or at card authoring inside the implement run) and surviving graduation: work rows vanish, `gates.md` persists. It is the named read source of the accumulated territory `**TEST:**` gates; at a later final validation that read is the union of the territory features'' `gates.md` plus their cards'' cases.'
              anchor: 2026-08-19 qa-gap-finding-verification D7
            - id: testing-gap-finding.reviewer-mirror-checklist
              labels: [reporting]
              class: must
              kind: duty
              text: >-
                The pre-hand-up quality checklist mirrors this schema's rules one-for-one —
                scope and skip statement · fence-clean dispatch and delegation · numbered
                expectations before probing · depth-bound lens or noted skip · kinds proposed
                with evidence · adjudication and routing honored · done condition met ·
                disclosure complete · fold-back authored — each box checked against its rule,
                none beyond them.
        - id: testing-gap-finding.sec.reserved
          title: Reserved — the lead's confirmation and the user's rulings
          intent: Decisions the finder never takes alone.
          rules:
            - id: testing-gap-finding.adjudication-lead-and-user
              labels: [user-gate, verdict]
              class: floor
              kind: reservation
              text: >-
                The finder proposes the kind; the lead confirms the blocking classification at the
                checkpoint verdict against the cited clause; a disputed kind defaults advisory and
                goes to the user, who rules. The finder never gates alone.
              anchor: 2026-08-19 qa-gap-finding-verification D6
            - id: testing-gap-finding.rework-bound
              labels: [verdict]
              class: must
              kind: bound
              text: >-
                Gap-rework carries a whole-run bound, default 2 rounds, redeclarable only at run
                open. A finding localizing to one cycle's territory charges that cycle's remaining
                attempts instead.
              anchor: 2026-08-19 qa-gap-finding-verification D6
            - id: testing-gap-finding.bound-exhaustion-user-ruled
              labels: [user-gate]
              class: must
              kind: reservation
              text: >-
                Bound exhaustion or a no-progress round halts the run; the disposition is reserved
                to the user.
              anchor: 2026-08-19 qa-gap-finding-verification D6
  - op: import-document
    kind: skill
    name: validation-constitution
    content:
      kind: skill
      skill: validation-constitution
      vars:
        verdict: PASS
      sections:
        - id: validation-constitution.sec.independence
          title: Independence — who is never whom
          intent: Author/grader separation for the governance validator.
          rules:
            - id: validation-constitution.author-grader
              class: floor
              extends: review-common.author-grader
        - id: validation-constitution.sec.scope
          title: Scope — jurisdiction and routing
          intent: What is a governance set, what is not, and where excess governance sits.
          rules:
            - id: validation-constitution.not-for
              labels: [boundary]
              class: must
              kind: routing
              text: 'Not for: initial drafting (validate AFTER, never during) · non-constitution documents (specs, plans, code) · read-only requests · informal governance sketches — verify the document IS a governance set before validating.'
            - id: validation-constitution.excess-governance
              labels: [boundary]
              class: must
              text: 'Excess governance is an anti-pattern too, FAIL-eligible: a principle restating a constraint already homed elsewhere (a GI-017 violation — governance surfaces point at constraint homes, never restate them) or one with no eliciting fact in the synthesis — admissible only naming the constraint''s existing home (point, don''t restate) or the missing fact; it lands in the `Anti-patterns found` line.'
            - id: validation-constitution.never-excess
              class: must
              extends: review-common.never-excess
        - id: validation-constitution.sec.inputs
          title: Inputs — what is read and what is assembled
          intent: The from-file input set and the checklist the grade runs on.
          rules:
            - id: validation-constitution.from-file-floor
              labels: [fence, evidence]
              class: floor
              text: Inputs are all read from file, never from the author's report.
              anchor: 2026-08-26 validation-constitution-true-deletion-cut
            - id: validation-constitution.input-set
              labels: [fence, binding]
              class: must
              kind: binding
              text: 'The input set: the surface set — the CLAUDE.md governance region (between `<!-- mochiko:governance:begin -->` / `<!-- mochiko:governance:end -->`), every rules file under `.claude/rules/mochiko/`, the ledger (`.mochiko/memory/governance-ledger.md`) — plus the session synthesis (`.mochiko/memory/governance-intent.md`, the traceable contract) and the producer''s trace summary manifest.'
            - id: validation-constitution.missing-input-fails
              labels: [verdict]
              class: must
              text: >-
                A missing synthesis when the set carries trace keys, a missing manifest, or a
                missing set member — each is itself a FAIL.
            - id: validation-constitution.superseded-artifact-flag
              labels: [evidence]
              class: must
              kind: duty
              text: >-
                A `.mochiko/memory/constitution.md` on disk is a superseded artifact the lead
                should have deleted — flag it in the fix list.
            - id: validation-constitution.checklist-assembly
              labels: [evidence]
              class: must
              kind: duty
              text: 'Assemble the working checklist module-parameterized: universal core + the checklist fragment embedded in each SELECTED module''s file (`templates/constitution-modules/*.md`), applied to the module''s routed content — region pointer / rules files / ledger section, per the authoring skill''s routing table.'
            - id: validation-constitution.quality-checklist
              labels: [floor-pointer]
              class: must
              kind: duty
              text: >-
                The checklist sets — including the governance-surfaces re-key's two-arm header
                citation and the section-bound placeholder items — are as
                references/QUALITY-CHECKLIST.md states them; applied as stated, never re-derived.
              pointer: references/QUALITY-CHECKLIST.md
              anchor: 2026-08-16 schema-based-template-guidance
            - id: validation-constitution.anti-patterns-scan
              labels: [floor-pointer]
              class: must
              kind: duty
              text: >-
                The anti-pattern scan list is as references/ANTI-PATTERNS.md states it; the scan
                runs against the files regardless of the author's claims.
              pointer: references/ANTI-PATTERNS.md
        - id: validation-constitution.sec.verdict
          title: Verdict — binary, complete, and rationalization-proof
          intent: The grading floors, the bump grammar, and the posture that keeps PASS earned.
          rules:
            - id: validation-constitution.set-not-file
              labels: [verdict]
              class: floor
              text: >-
                The graded artifact is a set, not a file — the CLAUDE.md governance region, the
                rules files, and the ledger are one deliverable, graded together; grading only the
                region is partial validation, which is not validation.
              anchor: 2026-08-26 validation-constitution-true-deletion-cut
            - id: validation-constitution.every-set-must-pass
              labels: [verdict]
              class: floor
              text: >-
                Every set MUST pass — no exceptions for "simple projects" or "tight deadlines".
              anchor: 2026-08-26 validation-constitution-true-deletion-cut
            - id: validation-constitution.letter-is-spirit
              labels: [verdict]
              class: floor
              text: The letter of the rules IS the spirit.
            - id: validation-constitution.verify-every-item
              labels: [verdict]
              class: floor
              text: >-
                Verify every item — never skip one as "obvious", never check a fragment the
                synthesis did not select.
            - id: validation-constitution.vague-language
              labels: [verdict, binding]
              class: must
              kind: binding
              text: >-
                Vague language MUST be replaced with measurable criteria — patterns and
                quantified examples single-sourced in references/ANTI-PATTERNS.md (*Vague
                Principle*, *Generic Thresholds*, *Missing Enforcement*).
              pointer: references/ANTI-PATTERNS.md
            - id: validation-constitution.version-bump
              labels: [verdict]
              class: must
              text: 'Determine the version bump: MAJOR (principle removed or incompatibly redefined; floor-level change, incl. a low→high depth-level flip; module attach/detach) · MINOR (principle added or significantly expanded; waiver added/removed) · PATCH (clarification, non-semantic). Every change gets a bump determination.'
              anchor: 2026-08-11 production-floor-adaptive-depth
            - id: validation-constitution.binary-verdict
              labels: [verdict]
              class: floor
              text: Binary PASS or FAIL — no soft language, no middle ground.
            - id: validation-constitution.default-fail
              class: floor
              extends: review-common.default-fail
            - id: validation-constitution.rationalization-stop
              labels: [verdict]
              class: floor
              text: >-
                Catching yourself rationalizing — "looks complete enough" · "just a minor
                update" (minor updates introduce major anti-patterns) · "anti-patterns don't
                apply here" (every rationalization claims uniqueness) · "I didn't use
                placeholders" (the scan runs against the files regardless) · "skipping is
                pragmatic" (pragmatic = following the process) · "validate later" (later rarely
                comes) — means STOP and restart from checklist assembly.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: validation-constitution.placeholders-incomplete
              labels: [verdict]
              class: floor
              text: Placeholders = incomplete, return for completion.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: validation-constitution.missing-parts-fail
              labels: [verdict]
              class: floor
              text: >-
                Missing parts = FAIL — return to authoring, never sign off incomplete
                governance.
              anchor: 2026-07-25 skill-succinctness-strip
            - id: validation-constitution.satisfaction-verifies-nothing
              labels: [verdict]
              class: floor
              text: >-
                User satisfaction verifies nothing — enforcement mechanisms are checked, not
                vibes.
              anchor: 2026-07-25 skill-succinctness-strip
        - id: validation-constitution.sec.output
          title: Output — the verdict block
          intent: The explicit result contract the grade lands in.
          rules:
            - id: validation-constitution.validation-result-block
              labels: [reporting, binding]
              class: must
              kind: binding
              text: 'The VALIDATION RESULT block carries every line: `VALIDATION RESULT: PASS/FAIL` · checklist items X/Y passed (core + N module fragments, named) · surface integrity (region markers · index→home resolution · rules files paths-scoped · scope coverage · new-file read line present/absent/n-a · universal-in-rules violations) · trace closure (manifest rows closed, primary home + companions · synthesis elements realized-or-flagged · waivers matched · modules matched) · floor/module accounting (floor + declared level asserted, region stamp = ledger · modules matched to the fact profile · floor categories principled at the declared level or waived) · anti-patterns found (list or "none") · version bump · issues requiring fix (each failure listed) · advisory (judgment-grade, non-blocking — suspected trace-fidelity mismatches, or "none").'
              anchor: 2026-08-26 validation-constitution-true-deletion-cut
            - id: validation-constitution.evidence-floor
              class: floor
              extends: review-common.evidence-floor
        - id: validation-constitution.sec.reserved
          title: Reserved — what only the user rules
          intent: The skip path and its documentation duty.
          rules:
            - id: validation-constitution.skip-documented
              labels: [user-gate]
              class: floor
              kind: reservation
              text: 'A user request to skip validation does not override process: if the user insists, document that validation was skipped against recommendation — never claim a validated set when validation was skipped.'
