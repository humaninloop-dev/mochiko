[package]
name = "mochiko-cli"
# 0.2.0 at the 2026-09-19 author-grader-consolidation wave: `mint-rule` carrying no `section:` now
# appends a block to a common library, so a log written against this grammar is rejected by an
# older binary. The grammar version stays 1 — no binary carrying the narrower rule was released.
version = "0.2.0"
edition = "2021"
description = "Template-schema guidance renderer for the mochiko plugin (foundation seed CLI)."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Only the features a machine-consumed CLI uses. `color` and `suggestions` are deliberately off:
# nothing reads this output by eye, and dropping them keeps the anstream/anstyle/strsim chain out
# of the audit surface.
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
sha2 = "0.10"
