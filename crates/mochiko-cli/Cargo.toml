[package]
name = "mochiko-cli"
# 0.3.0 at the 2026-09-29 joint hook/delta build, wave 1: tree-root home resolution, the closed
# world under `.mochiko/`, the raw-output home, the per-entry budget kind and `check --path`. The
# new home fields are grammar 2 — an older binary would ignore them and read the run folder as an
# ordinary home — so the range becomes 1..2. No `mochiko-cli-v*` tag rides this bump (seams R4).
version = "0.3.0"
edition = "2021"
description = "Template-schema guidance renderer for the mochiko plugin (foundation seed CLI)."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Only the features a machine-consumed CLI uses. `color` and `suggestions` are deliberately off:
# nothing reads this output by eye, and dropping them keeps the anstream/anstyle/strsim chain out
# of the audit surface.
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
sha2 = "0.10"
