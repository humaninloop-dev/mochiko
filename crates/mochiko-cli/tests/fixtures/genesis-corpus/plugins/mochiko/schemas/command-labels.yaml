# Label registry for command content schemas — the cross-command vocabulary: the SAME LABEL
# on rules in different command schemas is the cross-command link.
# Retired: `fail-condition`, removed at 0.98.0 — `kind: fail` is the selector for the
# Not-done set; ruling: command-schema-ontology D1, build item 4
# (`.mochiko/brainstorms/command-schema-ontology/record.md`, `DECISIONS.md` 2026-08-27).
kind: command-labels
labels:
  independence: Who is never whom — author/grader separation, non-author seats, blind dispatch.
  user-gate: A decision or checkpoint reserved to the user — never the run's own call.
  attempt-economy: Attempt bounds, no-progress stops, exhaustion dispositions, and their redeclaration points.
  landing: What executes at acceptance — folds, graduations, store landing, close semantics.
  evidence: What must be captured, run, or shown — real-infrastructure proof, sweeps, disclosed claims.
  scope-entry: Run entry, scope typing, sufficiency verdict and gap routing.
  seats: Seat wiring — who is staffed, spawned, briefed, or bounded, and with what.
  floor-pointer: A binding that points at a skill-owned floor or procedure — the pointer, never the restated procedure.
  reporting: Where reports land, what they state, and the register they use.
  binding: A path, schema, workspace, or surface the command binds to — where its artifacts live and what shapes them.
  stewardship: Living-artifact care — map and store hygiene, integrity, lifecycle bookkeeping at a standing desk.
