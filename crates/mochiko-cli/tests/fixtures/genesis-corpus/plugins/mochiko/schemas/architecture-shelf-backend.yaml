# Shelf data file for the backend / service architecture shelf (SaaS / PLG).
# Dealt by mochiko:patterns-architecture-shelves, which carries the walk order, the breadth
# invariant, the stance vocabulary, and the three-strata precedence. This file carries only the
# opinions. Read raw — the binary does not render shelves; raw Read is this file's first-class
# path (GI-020).
shelf: backend-service
title: Backend / Service Shelf (SaaS / PLG)
dealt_to: backend, service, fullstack (API side)
status: seeded

# Provenance disclosure (external-claims floor). Every default below is memory-asserted — common
# SaaS/PLG practice as the lead model knows it, not verified against a named external source. Each
# is a falsifiable judgment posture, dealt recommend-then-arbitrate, never asserted.
provenance: memory-asserted

revisit: |
  Whole-shelf revisit condition: shelf content is re-reviewed when the desk skill's first live run
  completes, and thereafter whenever a desk visit finds a default argued against twice in one
  project (the arguing-twice signal means the default is stale or the segment moved). The store
  steward (the principal-architect seat) owns freshness — no calendar cadence, event-keyed only.

# A `floor_bound` value names the universal-floor card that asserts this category. What that
# binding costs the row is a rule, and the rule lives in mochiko:patterns-architecture-shelves
# (three strata) — never restated here.

# `SPINE-OP-*` ids name OPINIONS on this shelf. They are not store elements: a store's own spine
# elements are `SPN-XXX`, minted when the opinion is ruled into the product's topology.
spine_opinions:
  - id: SPINE-OP-1
    opinion: Modular monolith first; extract a service only when change-rate or scale pays for it.
    provenance: memory-asserted
  - id: SPINE-OP-2
    opinion: One Postgres, tenant-scoped, before polyglot storage.
    provenance: memory-asserted
  - id: SPINE-OP-3
    opinion: Background jobs via queue before an event bus.
    provenance: memory-asserted

# The 13 concern dimensions, in the order the accepted shelf records them. Order here is
# provenance order, NOT walk order: the walk is ordered by retrofit cost, a rule owned by
# mochiko:patterns-architecture-shelves.
dimensions:
  - id: 1
    dimension: Identity & auth
    default: Managed IdP or framework auth; SSO a deferred-not-forgotten row
    provenance: memory-asserted
    floor_bound: FLOOR-SEC

  - id: 2
    dimension: Multi-tenancy
    default: Pooled, `tenant_id` + row-level scoping; silo only when compliance pays
    provenance: memory-asserted

  - id: 3
    dimension: Authorization
    default: RBAC per tenant, coarse roles first
    provenance: memory-asserted

  - id: 4
    dimension: Billing & entitlements
    default: Stripe-class provider; entitlements decoupled from billing events; self-serve trial→upgrade
    provenance: memory-asserted

  - id: 5
    dimension: Observability
    default: Structured logs + error tracking + traces from day one
    provenance: memory-asserted
    floor_bound: FLOOR-OBS

  - id: 6
    dimension: Product analytics
    default: Event taxonomy `{object}_{action}`; activation funnel instrumented (PLG core)
    provenance: memory-asserted

  - id: 7
    dimension: Feature flags & rollout
    default: Flags before branches for risky surfaces
    provenance: memory-asserted

  - id: 8
    dimension: Data lifecycle
    default: Migrations discipline · backups · PII classification · delete/export path
    provenance: memory-asserted

  - id: 9
    dimension: Background work
    default: Job queue + scheduler, idempotent jobs
    provenance: memory-asserted

  - id: 10
    dimension: API surface
    default: Internal vs public split; versioning + webhooks when public
    provenance: memory-asserted

  - id: 11
    dimension: Notifications
    default: Transactional email provider; in-app later
    provenance: memory-asserted

  - id: 12
    dimension: Deployment & environments
    default: PaaS-first, staging + prod, IaC when the team pays for it
    provenance: memory-asserted

  - id: 13
    dimension: Security baseline
    default: Secrets handling · rate limiting · audit log
    provenance: memory-asserted
    floor_bound: FLOOR-SEC

# Other surfaces (frontend-web · mobile · desktop) are honest, named gaps, not silent ones: their
# shelves are authored later as pure data, each shippable alone. Until a surface has a seeded
# shelf, the desk leans on the universal floor and on minting rows from the project's own facts —
# never on dealing a filtered backend list to a non-backend surface.
gaps:
  - surface: frontend-web
    status: planned
  - surface: mobile
    status: planned
  - surface: desktop
    status: planned
