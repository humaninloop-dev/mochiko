# Skill content schema for mochiko:review-governance-intent. The SKILL.md body instructs a
# raw, full Read of this file at skill invoke — beside
# plugins/mochiko/schemas/skill-review-common.yaml — and its "Rules — load the schema first"
# section carries the reading grammar. Two semantics live only here:
#   class   floor = non-waivable · must = binding obligation · advisory = guidance, not binding.
#   conditions:  each dimension declares its resolution point (entry-derived · surface-presence);
#           a rule gated on an unresolved dimension is inapplicable until it resolves.
kind: skill
skill: review-governance-intent

vars:
  verdict: "ready"

conditions:
  pairing:
    values: [pair, solo]
    resolution: entry-derived
    note: whether the spawn brief seats a counterpart reviewer.
  analysis:
    values: presence
    resolution: surface-presence
    note: the brownfield codebase analysis at `.mochiko/memory/codebase-analysis.md`.

sections:
  - id: review-governance-intent.sec.independence
    title: Independence — you are the challenge
    intent: >-
      Seat separation and sequestration the intent reviewer carries.
    rules:

      - id: review-governance-intent.never-a-participant
        labels: [independence]
        class: floor
        text: >-
          Never a participant in the session — the session is recommend-then-arbitrate
          and unchallenged; you are the challenge, and in the session means not a
          reviewer.

      - id: review-governance-intent.author-grader
        extends: review-common.author-grader
        class: floor

      - id: review-governance-intent.sequestration
        labels: [independence]
        class: must
        text: >-
          Sequestration — the entire attack formed before counterpart contact; the lead
          withholds the counterpart's name until findings are formed.

  - id: review-governance-intent.sec.scope
    title: Scope & jurisdiction
    intent: >-
      When this review runs, what depth a lens sets, and what stays permanently out.
    rules:

      - id: review-governance-intent.pre-ratification-timing
        labels: [boundary]
        class: must
        text: >-
          You run before ratification, spawned at the sizing gate.

      - id: review-governance-intent.lens-depth-never-jurisdiction
        labels: [boundary]
        class: must
        text: >-
          A lens brief — coverage or coherence — sets depth, never jurisdiction.

      - id: review-governance-intent.report-out-of-lens-trips
        labels: [boundary]
        class: must
        kind: duty
        text: >-
          Report real out-of-lens trips.

      - id: review-governance-intent.solo-and-verify-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Solo, the whole surface is yours; the verify pass belongs to the coherence lens
          in a pair, to you automatically when solo.

      - id: review-governance-intent.authored-surfaces-out
        labels: [boundary]
        class: floor
        text: >-
          Permanently out of jurisdiction: the authored surface set and its Tier-2
          grading (`mochiko:validation-constitution`, downstream — different artifact,
          different family).

      - id: review-governance-intent.formulation-quality-excluded
        labels: [boundary]
        class: floor
        text: >-
          Formulation and enforceability quality of authored principles closed
          `Contested` (D1) — never re-raise.

      - id: review-governance-intent.never-excess
        extends: review-common.never-excess
        class: must

      - id: review-governance-intent.its-command-states-them
        extends: review-common.its-command-states-them
        class: floor
        kind: routing

  - id: review-governance-intent.sec.inputs
    title: Inputs — the frozen synthesis and the fact routes
    intent: >-
      What is read, what stays frozen, and how each fact class verifies.
    rules:

      - id: review-governance-intent.frozen-window
        labels: [fence]
        class: must
        text: >-
          The synthesis is frozen from your spawn until dispositions land.

      - id: review-governance-intent.read-set-binding
        labels: [binding, fence]
        class: must
        kind: binding
        text: >-
          Read the frozen synthesis and the agenda at
          `../authoring-constitution/references/INTERROGATION-AGENDA.md` — its ten
          dimensions are the coverage yardstick.
        pointer: "../authoring-constitution/references/INTERROGATION-AGENDA.md"

      - id: review-governance-intent.brownfield-analysis-read
        labels: [binding]
        class: must
        kind: binding
        when: {analysis: present}
        text: >-
          Read `.mochiko/memory/codebase-analysis.md` beside the synthesis.

      - id: review-governance-intent.cross-exam-binding
        labels: [binding, floor-pointer]
        class: must
        kind: binding
        when: {pairing: pair}
        text: >-
          Cross-examination — after the lead introduces the counterpart, the one-shot
          four-message exchange per
          `../review-brainstorm/references/CROSS-EXAM.md` (the single source, shared with
          `mochiko:review-brainstorm`); solo skips to the report.
        pointer: "../review-brainstorm/references/CROSS-EXAM.md"

      - id: review-governance-intent.substrate-bindings
        labels: [binding]
        class: must
        kind: binding
        text: >-
          Substrate bindings — artifact: the frozen synthesis; fact substrate:
          `.mochiko/memory/codebase-analysis.md` plus the detect-stack baseline in
          brownfield, the files otherwise.

      - id: review-governance-intent.reality-facts-checked
        labels: [evidence]
        class: must
        kind: routing
        text: >-
          A reality-surface fact is checked against the analysis or the files, never
          argued.

      - id: review-governance-intent.user-facts-flagged
        labels: [evidence, user-gate]
        class: must
        kind: routing
        text: >-
          A user-declared fact (team size, risk posture, lifespan, values) is checkable
          against nothing on disk — flag for the lead to route to the user as
          confirmation, never to argument.

      - id: review-governance-intent.external-facts-binding
        labels: [evidence, binding]
        class: must
        kind: routing
        text: >-
          An external-sourced fact — a floor-class claim fed from outside the repo — runs
          per `../review-brainstorm/references/EXTERNAL-CLAIMS.md`, never argued.
        pointer: "../review-brainstorm/references/EXTERNAL-CLAIMS.md"

  - id: review-governance-intent.sec.verdict
    title: Verdict — the hunt and its criteria
    intent: >-
      What earns the status, the admissibility bars, and the mark discipline.
    rules:

      - id: review-governance-intent.unresolvable-is-commentary
        labels: [verdict]
        class: must
        text: >-
          Unresolvable = commentary, not a finding.

      - id: review-governance-intent.over-governance-admissibility
        labels: [verdict]
        class: must
        text: >-
          The over-governance hunt is in-jurisdiction, remove-shaped — a minted principle
          or intent no elicited fact justifies is a finding like any absence, admissible
          only naming the fact it fails to trace to or the lighter surface carrying the
          real need; it never reaches formulation quality.

      - id: review-governance-intent.status-vocabulary-and-criteria
        labels: [verdict]
        class: must
        text: >-
          Recommended status: `ready` (every hunt class actively worked, nothing blocking
          survived) / `needs-revision` (survivors resolvable by the session) /
          `critical-gaps` (a fact profile contradicted by its own risk declaration or
          detected reality, an unrecorded ruling — a missing or unrecorded depth-level
          declaration among them — or a synthesis too thin to review).

      - id: review-governance-intent.default-fail
        extends: review-common.default-fail
        class: floor

      - id: review-governance-intent.too-thin-first-finding
        labels: [verdict]
        class: floor
        text: >-
          Too thin to attack — rulings without rationale, marks without basis — is itself
          the first finding.

      - id: review-governance-intent.contested-audit-first
        labels: [verdict]
        class: floor
        text: >-
          Honor `Contested` only after its rationale audit — an unaudited `Contested` is
          a shield, and a shield is a finding.

      - id: review-governance-intent.echo-rationales-outrank
        labels: [verdict, evidence]
        class: floor
        text: >-
          Marks are lead-self-reported; echo-rationales and adoption streaks outrank any
          mark.

      - id: review-governance-intent.declared-level-discipline
        labels: [verdict]
        class: floor
        text: >-
          The declared depth level is the user's recorded ruling (D1/D2): challenge
          expression, waivers, and fact consistency; verify it exists in the ledger, was
          recommend-then-arbitrated, and greenfield got the low recommendation. Never
          flag it against real users or deployment state (D6 no-watcher), never grade
          stricter than the declared level.

      - id: review-governance-intent.yardstick-never-taste
        labels: [verdict]
        class: floor
        text: >-
          The yardstick is the agenda, the asserted floor, and the synthesis's own
          internal consistency — never your governance taste.

      - id: review-governance-intent.no-in-session-confirmation
        labels: [verdict, independence]
        class: floor
        text: >-
          A session confirming its own synthesis is the gap this review closes — never
          soften on "the user already confirmed it in session".

  - id: review-governance-intent.sec.output
    title: Output — the survivor report
    intent: >-
      The finding contract and the one shape the report takes.
    rules:

      - id: review-governance-intent.finding-contract
        labels: [reporting, evidence]
        class: must
        text: >-
          Every finding: severity, the GI element(s) touched, a concrete failure scenario
          or cited contradiction, and a resolution path — the one question or check that
          settles it.

      - id: review-governance-intent.survivor-report-form
        labels: [reporting]
        class: must
        kind: binding
        text: >-
          The survivor report is a message to the lead, no report files: your own
          survivors severity-classified, each with failure scenario and resolution path,
          unresolved counterpart objections, flagged counterpart duplicates; a tally
          ("N raised, M survived" — the fallen stay retrievable on ask).

      - id: review-governance-intent.evidence-floor
        extends: review-common.evidence-floor
        class: floor

  - id: review-governance-intent.sec.reserved
    title: Reserved — the lead's verdict, the user's ratification
    intent: >-
      Decisions this seat never takes.
    rules:

      - id: review-governance-intent.verdict-is-input
        extends: review-common.verdict-is-input
        class: floor
        kind: reservation

      - id: review-governance-intent.ratification-user-owned
        labels: [user-gate]
        class: floor
        kind: reservation
        text: >-
          The user owns ratification; you never ratify.

      - id: review-governance-intent.findings-through-leads-pen
        labels: [independence]
        class: floor
        kind: reservation
        text: >-
          Findings enter through the lead's pen, dispositions in the Review section —
          never your own edits to the synthesis.
