# Skill content schema for mochiko:review-specifications. The SKILL.md body obligates a raw,
# whole Read of this file — and of plugins/mochiko/schemas/skill-review-common.yaml, which the
# extends: stubs bind — as the first action at invoke; the model interprets it live, and the
# SKILL.md "Rules — load the schema first" section carries the reading grammar. Two semantics
# live only here:
#   class   floor = non-waivable · must = binding obligation · advisory = guidance, not binding.
#   conditions:  each dimension declares its resolution point (entry-derived · surface-presence);
#           a rule gated on an unresolved dimension is inapplicable until it resolves.
kind: skill
skill: review-specifications

conditions:
  manifest-present:
    values: presence
    resolution: surface-presence
    note: the spec carries a Screens & Flows SCR/FLOW manifest with its `prototype/` app.

sections:
  - id: review-specifications.sec.independence
    title: Independence — who is never whom
    intent: >-
      Author/grader separation for the gap-finding seat.
    rules:

      - id: review-specifications.author-grader
        extends: review-common.author-grader
        class: floor

  - id: review-specifications.sec.scope
    title: Scope — jurisdiction and routing
    intent: >-
      What this review hunts, what it routes away, and what it never adds.
    rules:

      - id: review-specifications.what-not-how
        labels: [boundary]
        class: must
        text: >-
          WHAT is missing, never HOW to implement — product questions, never implementation
          questions; implementation detail, technical edge cases, architecture, and
          performance belong to later design work.

      - id: review-specifications.not-for
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Not for: architecture/design review · code review (sole carve-out
          `mochiko:review-code-minimalism`, implement-side) · implementation planning ·
          performance specs · no spec yet (`mochiko:authoring-requirements` first) · pre-spec
          enrichment of a sparse idea (`mochiko:analysis-iterative` — disjoint triggers by
          design).

      - id: review-specifications.excess-admissibility
        labels: [boundary]
        class: must
        text: >-
          An excess / unpaid-scope gap — no user need or ratified driver pays for it — is
          admissible only naming the driver it fails to trace to or the cheaper shape.

      - id: review-specifications.never-excess
        extends: review-common.never-excess
        class: must

      - id: review-specifications.feature-layer-same-report
        labels: [boundary]
        class: must
        text: >-
          The feature layer is graded with the spec, same reviewer, same report — only the
          story-reader sees derivation dishonesty.

      - id: review-specifications.no-scope-creep
        labels: [boundary]
        class: floor
        text: >-
          Scope creep is not a gap: clarify existing features, never add new ones as
          "missing requirements".

  - id: review-specifications.sec.inputs
    title: Inputs — what is read and how far the hunt reaches
    intent: >-
      Coverage duties, baselines, and the surfaces the hunt stands on.
    rules:

      - id: review-specifications.complete-coverage
        labels: [evidence]
        class: must
        kind: duty
        text: >-
          Coverage is complete, never sampled: every user story reviewed for completeness,
          every success criterion checked for measurability, edge cases hunted per main flow.

      - id: review-specifications.external-claims
        labels: [evidence]
        class: must
        kind: binding
        text: >-
          A regulatory or product-legal assertion is a floor-class external claim — verify per
          ../review-brainstorm/references/EXTERNAL-CLAIMS.md; undisclosed is a gap.
        pointer: "../review-brainstorm/references/EXTERNAL-CLAIMS.md"

      - id: review-specifications.map-git-baseline
        labels: [evidence]
        class: floor
        text: >-
          Grade staged feature-map writes against the git state of the map at run open, never
          a workspace copy.

      - id: review-specifications.map-mirror
        labels: [binding, floor-pointer]
        class: must
        kind: binding
        text: >-
          Feature-map machinery is single-sourced in `mochiko:authoring-feature-map`; the
          feature-layer check list is the reviewer's mirror, never a second definition.
        pointer: "mochiko:authoring-feature-map"

      - id: review-specifications.sf-legal-shapes
        labels: [boundary]
        class: must
        text: >-
          A UX-bearing spec has two legal Screens & Flows shapes: a SCR/FLOW manifest with its
          `prototype/` app, or the waiver line "No UX surface — prototype waived at intent".

      - id: review-specifications.serve-and-click
        labels: [evidence]
        class: must
        kind: duty
        when: {manifest-present: present}
        text: >-
          Serve the prototype and click it (bun, or open `prototype/index.html`) —
          adversarial, not ceremonial: a skeptic walking the app finds what a text read
          cannot.

      - id: review-specifications.check-existing-first
        labels: [evidence]
        class: floor
        kind: duty
        text: >-
          Check existing patterns and decisions first — never ask what is already answered.

  - id: review-specifications.sec.verdict
    title: Verdict — the grading grammar
    intent: >-
      The hunt taxonomy, the check sets, and the severity grammar findings are graded by.
    rules:

      - id: review-specifications.gap-taxonomy
        labels: [verdict, binding]
        class: must
        kind: binding
        text: >-
          The six requirement-defect classes — missing requirements · ambiguities · edge
          cases · assumption gaps · contradictions · excess / unpaid scope — are the canonical
          hunt taxonomy `devils-advocate` leans on; hunt them across the user-facing
          categories (user expectations · business rules · scope boundaries · success/failure
          states · permissions).

      - id: review-specifications.smuggled-posture
        labels: [verdict]
        class: must
        text: >-
          Implementation posture smuggled into a constraint ("files on disk" where the
          requirement is "locally computable") is an assumption-gap finding — it freezes a
          choice stakeholders never ratified.

      - id: review-specifications.feature-critical-checks
        labels: [verdict]
        class: must
        kind: duty
        text: >-
          Feature-layer Critical checks: derivation honesty (every feature traceable to
          supporting stories) · disposition completeness (every story homed to exactly one
          feature, or filter-rejected with the why recorded) · dedup by capability against the
          map files at baseline · delta legality (full grammar — what grows, in-flight mark,
          named spec; no `delivered` regressed) · SC re-homing (every SC-XXX on a verifying
          feature; deferred SCs and one-sided seams on the owning entry's obligations line) ·
          in-flight handling (touches read into the owning spec; resolved by reference,
          sequenced delta, or escalation — never silent contradiction).

      - id: review-specifications.feature-important-checks
        labels: [verdict]
        class: must
        kind: duty
        text: >-
          Feature-layer Important checks: granularity (one-breath capability, extent ≤ ~3
          lines, or split) · entry well-formedness (entry-template shape, all fields) ·
          selection-card honesty (deferred-SC list visible, agreeing with the SC split) ·
          specs-index agreement (staged row matches staged writes — slug, FEAT-IDs, outcomes).

      - id: review-specifications.authority-split
        labels: [verdict]
        class: must
        when: {manifest-present: present}
        text: >-
          Prototype authority split: flows, screens, and data shown are binding; layout and
          styling advisory — a cosmetic finding against a low-fi prototype is wrong-altitude.

      - id: review-specifications.sf-critical-checks
        labels: [verdict]
        class: must
        kind: duty
        when: {manifest-present: present}
        text: >-
          Screens & Flows Critical checks: screen reachability (every SCR-XXX renders a
          reachable page) · flow walkability (every FLOW-XXX clickable end-to-end, no dead
          ends) · scenario coverage (every P1 acceptance scenario has a FLOW click path) ·
          flow traceability (every FLOW-XXX keyed to a real story scenario — no scope
          invention) · drift both directions (no page without a SCR row, no row without its
          page).

      - id: review-specifications.sf-important-checks
        labels: [verdict]
        class: must
        kind: duty
        when: {manifest-present: present}
        text: >-
          Screens & Flows Important checks: data-shape honesty (realistic fields/cardinality,
          enough to expose layout and flow problems) · FEAT tags (post-derivation rows
          FEAT-tagged; out-of-selection and filter-rejected screens greyed but reachable,
          rejected ones carrying the rejection pointer) · waiver second-guess (a waiver where
          stories imply screens, or a prototype the intent ruled out — graded against the
          Intent section's UX-bearing ruling).

      - id: review-specifications.severity-grammar
        labels: [verdict]
        class: must
        text: >-
          Severity grammar: Critical = cannot build without this answer, ask now · Important =
          will cause rework, should ask now · Minor = polish, log and defer.

      - id: review-specifications.density-never-gap
        labels: [verdict]
        class: floor
        text: >-
          Density is never itself a gap (the `templates/artifact-format.md` envelope) — grade
          substance, never prose style; undisclosed overage past the envelope's size defaults
          is advisory per its rule 8.

  - id: review-specifications.sec.output
    title: Output — questions and report contracts
    intent: >-
      The question craft and the shapes the findings land in.
    rules:

      - id: review-specifications.question-format
        labels: [reporting]
        class: must
        text: >-
          Every question is a decision the stakeholder can make: 2–3 concrete options, what
          each means for users, why it matters — specific, never vague.

      - id: review-specifications.no-presupposed-mechanism
        labels: [reporting]
        class: must
        text: >-
          Never presuppose a mechanism in a question — "should we cache?" assumes caching.

      - id: review-specifications.clarifications-shape
        labels: [reporting, binding]
        class: must
        kind: binding
        text: >-
          Questions land in the Clarifications shape of
          `templates/advocate-report-template.md`, never a variant.

      - id: review-specifications.report-structure
        labels: [reporting, binding]
        class: must
        kind: binding
        text: >-
          Report structure (machine-first findings YAML, clarifications with options + impact,
          recommended verdict, one-line `strengths:`) is single-sourced at
          `templates/advocate-report-template.md`; no report path named → same structure
          inline.

      - id: review-specifications.evidence-floor
        extends: review-common.evidence-floor
        class: floor

      - id: review-specifications.gap-bound
        labels: [reporting]
        class: floor
        kind: bound
        text: >-
          5–7 Critical/Important gaps per round, related gaps grouped — never a 20-gap dump.

  - id: review-specifications.sec.reserved
    title: Reserved — the clearing this seat never issues
    intent: >-
      The verdict posture: input to the caller, never a clearing of its own.
    rules:

      - id: review-specifications.input-not-verdict
        labels: [verdict, boundary]
        class: floor
        text: >-
          The output is gap-finding input, never a clearing PASS/FAIL verdict of its own.
