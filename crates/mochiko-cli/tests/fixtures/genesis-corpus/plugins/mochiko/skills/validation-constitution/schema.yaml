# Skill content schema for mochiko:validation-constitution. The SKILL.md body obligates a raw,
# whole Read of this file — and of plugins/mochiko/schemas/skill-review-common.yaml, which the
# extends: stubs bind — as the first action at invoke; the model interprets it live, and the
# SKILL.md "Rules — load the schema first" section carries the reading grammar. One semantic
# lives only here:
#   class   floor = non-waivable · must = binding obligation · advisory = guidance, not binding.
kind: skill
skill: validation-constitution

vars:
  verdict: PASS

sections:
  - id: validation-constitution.sec.independence
    title: Independence — who is never whom
    intent: >-
      Author/grader separation for the governance validator.
    rules:

      - id: validation-constitution.author-grader
        extends: review-common.author-grader
        class: floor

  - id: validation-constitution.sec.scope
    title: Scope — jurisdiction and routing
    intent: >-
      What is a governance set, what is not, and where excess governance sits.
    rules:

      - id: validation-constitution.not-for
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Not for: initial drafting (validate AFTER, never during) · non-constitution
          documents (specs, plans, code) · read-only requests · informal governance
          sketches — verify the document IS a governance set before validating.

      - id: validation-constitution.excess-governance
        labels: [boundary]
        class: must
        text: >-
          Excess governance is an anti-pattern too, FAIL-eligible: a principle restating a
          constraint already homed elsewhere (a GI-017 violation — governance surfaces point
          at constraint homes, never restate them) or one with no eliciting fact in the
          synthesis — admissible only naming the constraint's existing home (point, don't
          restate) or the missing fact; it lands in the `Anti-patterns found` line.

      - id: validation-constitution.never-excess
        extends: review-common.never-excess
        class: must

  - id: validation-constitution.sec.inputs
    title: Inputs — what is read and what is assembled
    intent: >-
      The from-file input set and the checklist the grade runs on.
    rules:

      - id: validation-constitution.from-file-floor
        labels: [fence, evidence]
        class: floor
        text: >-
          Inputs are all read from file, never from the author's report.

      - id: validation-constitution.input-set
        labels: [fence, binding]
        class: must
        kind: binding
        text: >-
          The input set: the surface set — the CLAUDE.md governance region (between
          `<!-- mochiko:governance:begin -->` / `<!-- mochiko:governance:end -->`), every
          rules file under `.claude/rules/mochiko/`, the ledger
          (`.mochiko/memory/governance-ledger.md`) — plus the session synthesis
          (`.mochiko/memory/governance-intent.md`, the traceable contract) and the producer's
          trace summary manifest.

      - id: validation-constitution.missing-input-fails
        labels: [verdict]
        class: must
        text: >-
          A missing synthesis when the set carries trace keys, a missing manifest, or a
          missing set member — each is itself a FAIL.

      - id: validation-constitution.superseded-artifact-flag
        labels: [evidence]
        class: must
        kind: duty
        text: >-
          A `.mochiko/memory/constitution.md` on disk is a superseded artifact the lead
          should have deleted — flag it in the fix list.

      - id: validation-constitution.checklist-assembly
        labels: [evidence]
        class: must
        kind: duty
        text: >-
          Assemble the working checklist module-parameterized: universal core + the checklist
          fragment embedded in each SELECTED module's file
          (`templates/constitution-modules/*.md`), applied to the module's routed content —
          region pointer / rules files / ledger section, per the authoring skill's routing
          table.

      - id: validation-constitution.quality-checklist
        labels: [floor-pointer]
        class: must
        kind: duty
        text: >-
          The checklist sets — including the governance-surfaces re-key's two-arm header
          citation and the section-bound placeholder items — are as
          references/QUALITY-CHECKLIST.md states them; applied as stated, never re-derived.
        pointer: "references/QUALITY-CHECKLIST.md"

      - id: validation-constitution.anti-patterns-scan
        labels: [floor-pointer]
        class: must
        kind: duty
        text: >-
          The anti-pattern scan list is as references/ANTI-PATTERNS.md states it; the scan
          runs against the files regardless of the author's claims.
        pointer: "references/ANTI-PATTERNS.md"

  - id: validation-constitution.sec.verdict
    title: Verdict — binary, complete, and rationalization-proof
    intent: >-
      The grading floors, the bump grammar, and the posture that keeps PASS earned.
    rules:

      - id: validation-constitution.set-not-file
        labels: [verdict]
        class: floor
        text: >-
          The graded artifact is a set, not a file — the CLAUDE.md governance region, the
          rules files, and the ledger are one deliverable, graded together; grading only the
          region is partial validation, which is not validation.

      - id: validation-constitution.every-set-must-pass
        labels: [verdict]
        class: floor
        text: >-
          Every set MUST pass — no exceptions for "simple projects" or "tight deadlines".

      - id: validation-constitution.letter-is-spirit
        labels: [verdict]
        class: floor
        text: >-
          The letter of the rules IS the spirit.

      - id: validation-constitution.verify-every-item
        labels: [verdict]
        class: floor
        text: >-
          Verify every item — never skip one as "obvious", never check a fragment the
          synthesis did not select.

      - id: validation-constitution.vague-language
        labels: [verdict, binding]
        class: must
        kind: binding
        text: >-
          Vague language MUST be replaced with measurable criteria — patterns and quantified
          examples single-sourced in references/ANTI-PATTERNS.md (*Vague Principle*, *Generic
          Thresholds*, *Missing Enforcement*).
        pointer: "references/ANTI-PATTERNS.md"

      - id: validation-constitution.version-bump
        labels: [verdict]
        class: must
        text: >-
          Determine the version bump: MAJOR (principle removed or incompatibly redefined;
          floor-level change, incl. a low→high depth-level flip; module attach/detach) ·
          MINOR (principle added or significantly expanded; waiver added/removed) · PATCH
          (clarification, non-semantic). Every change gets a bump determination.

      - id: validation-constitution.binary-verdict
        labels: [verdict]
        class: floor
        text: >-
          Binary PASS or FAIL — no soft language, no middle ground.

      - id: validation-constitution.default-fail
        extends: review-common.default-fail
        class: floor

      - id: validation-constitution.rationalization-stop
        labels: [verdict]
        class: floor
        text: >-
          Catching yourself rationalizing — "looks complete enough" · "just a minor update"
          (minor updates introduce major anti-patterns) · "anti-patterns don't apply here"
          (every rationalization claims uniqueness) · "I didn't use placeholders" (the scan
          runs against the files regardless) · "skipping is pragmatic" (pragmatic = following
          the process) · "validate later" (later rarely comes) — means STOP and restart from
          checklist assembly.

      - id: validation-constitution.placeholders-incomplete
        labels: [verdict]
        class: floor
        text: >-
          Placeholders = incomplete, return for completion.

      - id: validation-constitution.missing-parts-fail
        labels: [verdict]
        class: floor
        text: >-
          Missing parts = FAIL — return to authoring, never sign off incomplete governance.

      - id: validation-constitution.satisfaction-verifies-nothing
        labels: [verdict]
        class: floor
        text: >-
          User satisfaction verifies nothing — enforcement mechanisms are checked, not vibes.

  - id: validation-constitution.sec.output
    title: Output — the verdict block
    intent: >-
      The explicit result contract the grade lands in.
    rules:

      - id: validation-constitution.validation-result-block
        labels: [reporting, binding]
        class: must
        kind: binding
        text: >-
          The VALIDATION RESULT block carries every line: `VALIDATION RESULT: PASS/FAIL` ·
          checklist items X/Y passed (core + N module fragments, named) · surface integrity
          (region markers · index→home resolution · rules files paths-scoped · scope
          coverage · new-file read line present/absent/n-a · universal-in-rules violations) ·
          trace closure (manifest rows closed, primary home + companions · synthesis elements
          realized-or-flagged · waivers matched · modules matched) · floor/module accounting
          (floor + declared level asserted, region stamp = ledger · modules matched to the
          fact profile · floor categories principled at the declared level or waived) ·
          anti-patterns found (list or "none") · version bump · issues requiring fix (each
          failure listed) · advisory (judgment-grade, non-blocking — suspected trace-fidelity
          mismatches, or "none").

      - id: validation-constitution.evidence-floor
        extends: review-common.evidence-floor
        class: floor

  - id: validation-constitution.sec.reserved
    title: Reserved — what only the user rules
    intent: >-
      The skip path and its documentation duty.
    rules:

      - id: validation-constitution.skip-documented
        labels: [user-gate]
        class: floor
        kind: reservation
        text: >-
          A user request to skip validation does not override process: if the user insists,
          document that validation was skipped against recommendation — never claim a
          validated set when validation was skipped.
