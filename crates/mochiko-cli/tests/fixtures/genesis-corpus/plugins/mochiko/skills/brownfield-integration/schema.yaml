# Skill content schema for mochiko:brownfield-integration. The SKILL.md body instructs a
# raw, full Read of this file at skill invoke — the small families ship no common file, so
# the pair's own schema is the whole first action — and its "Rules — load the schema first"
# section carries the reading grammar. One semantic lives only here:
#   class   floor = non-waivable · must = binding obligation · advisory = guidance, not binding.
kind: skill
skill: brownfield-integration

sections:
  - id: brownfield-integration.sec.independence
    title: Independence — none bound
    intent: >-
      Seat separations this craft would carry.
    note: >-
      Deliberately empty — the census records no independence obligation at D12 grain;
      this is an implement-time consumption craft, not a grading seat.
    rules: []

  - id: brownfield-integration.sec.scope
    title: Scope — the consumed classification and its interface impact
    intent: >-
      What each marker is allowed to do to an existing interface, and what stays outside
      the task.
    rules:

      - id: brownfield-integration.consumes-classification-never-decides
        labels: [boundary]
        class: must
        text: >-
          Brownfield tasks arrive tagged `[EXTEND]` or `[MODIFY]` by the builder's own
          decomposition — classified from the cycle card's brownfield exposure line,
          which `patterns-vertical-tdd` declares at design time. This skill does not
          decide the classification — it is the implement-time discipline of consuming
          one safely.
        pointer: "mochiko:patterns-vertical-tdd"

      - id: brownfield-integration.extend-interface-impact
        labels: [boundary]
        class: floor
        text: >-
          `[EXTEND]` — new functions, new methods, new exports, alongside what exists:
          MUST NOT change existing function signatures, exports, or type contracts.

      - id: brownfield-integration.modify-interface-impact
        labels: [boundary]
        class: floor
        text: >-
          `[MODIFY]` — the specified sections only: MAY change function internals; MUST
          NOT change signatures unless the task explicitly says so.

      - id: brownfield-integration.interface-preservation
        labels: [boundary]
        class: floor
        text: >-
          When extending existing code: do NOT rename existing variables, functions, or
          classes; DO add new exports alongside existing ones; DO follow the file's
          established patterns for new code.

      - id: brownfield-integration.refactoring-out-of-scope
        labels: [boundary]
        class: must
        text: >-
          Refactoring is out of scope for an extend/modify task — note the opportunity,
          do not act on it.

  - id: brownfield-integration.sec.inputs
    title: Inputs — read before write
    intent: >-
      What is read, identified, and checked before any code lands in an existing file.
    rules:

      - id: brownfield-integration.read-full-file-first
        labels: [fence]
        class: floor
        kind: duty
        text: >-
          Before writing any code in an existing file, read the full file — not just the
          section you plan to change — and understand the complete context. Skimming is
          not sufficient for brownfield work.

      - id: brownfield-integration.follow-file-conventions
        labels: [fence]
        class: must
        kind: duty
        text: >-
          Before writing, identify the file's own patterns and match them exactly:
          naming conventions (variable, file, function) · error-handling patterns
          (try-catch, Result types, error callbacks) · import style (relative vs
          absolute, named vs default, ordering) · test patterns (describe/it nesting,
          assertion style, fixtures).

      - id: brownfield-integration.conflict-detection-set
        labels: [evidence]
        class: must
        kind: duty
        text: >-
          Before adding new code, check for: name collisions (search the file for the
          function/class/variable name you plan to add) · import collisions (new imports
          must not shadow existing ones) · test-file alignment (adding to `user.ts`,
          check that `user.test.ts` exists and follow its patterns) · circular
          dependencies (new imports must not create circular reference chains).

  - id: brownfield-integration.sec.verdict
    title: Verdict — the letter is the spirit
    intent: >-
      The posture that closes every shortcut.
    rules:

      - id: brownfield-integration.letter-is-spirit
        labels: [verdict]
        class: floor
        text: >-
          Violating the letter of the rules is violating the spirit of the rules — every
          shortcut in read-before-write discipline is a broken consumer waiting to
          surface. No exceptions: not for "obviously broken" code, not for "trivially
          better" patterns, not for "quick cleanup while I'm here", not even if the
          existing code has no tests or its naming is inconsistent. A red-flag thought
          is a rationalization in progress — the Rationalizations table rebuts each.

  - id: brownfield-integration.sec.output
    title: Output — blockers land in the cycle report
    intent: >-
      Where surfaced conflicts go.
    rules:

      - id: brownfield-integration.flag-blockers-into-cycle-report
        labels: [reporting, boundary]
        class: must
        kind: routing
        text: >-
          Surface blockers rather than silently resolving them — they belong in the
          cycle report the run produces (owned by `executing-tdd-cycle`), not in a quiet
          workaround: existing code contradicting the task description · inconsistent
          in-file patterns (multiple conflicting conventions) · an `[EXTEND]` whose
          existing interface cannot support the addition without modification · existing
          tests that would break from the addition (interface leak) · a file with no
          tests where the task expects test-first development.
        pointer: "mochiko:executing-tdd-cycle"

  - id: brownfield-integration.sec.reserved
    title: Reserved — the rewrite decision is never this seat's
    intent: >-
      What is surfaced, never silently resolved.
    rules:

      - id: brownfield-integration.extend-never-silently-modify
        labels: [boundary]
        class: floor
        text: >-
          Never treat an `[EXTEND]` task as a `[MODIFY]`. If the existing code cannot
          support the extension without changing its interface, surface it as a
          blocker — do not silently rewrite.
