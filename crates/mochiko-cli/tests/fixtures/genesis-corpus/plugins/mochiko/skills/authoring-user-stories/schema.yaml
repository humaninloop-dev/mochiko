# Skill content schema for mochiko:authoring-user-stories. The SKILL.md body instructs a
# raw, full Read of this file at skill invoke — beside
# plugins/mochiko/schemas/skill-authoring-common.yaml, one declared first action — and its
# "Rules — load the schema first" section carries the reading grammar. One semantic lives
# only here:
#   class   floor = non-waivable · must = binding obligation · advisory = guidance, not binding.
kind: skill
skill: authoring-user-stories

sections:
  - id: authoring-user-stories.sec.independence
    title: Independence — none bound
    intent: >-
      Who is never whom while stories are authored.
    note: >-
      Deliberately empty at census — this member carries no independence rule of its own;
      the spec the stories land in is graded from the reviewer's side, not from here.
    rules: []

  - id: authoring-user-stories.sec.scope
    title: Scope — the story craft's seam
    intent: >-
      What this skill owns, routes away, and never authors.
    rules:

      - id: authoring-user-stories.pm-frame-boundary
        labels: [boundary]
        class: floor
        text: >-
          Authored inside the product-manager's frame — the PM owns which capabilities
          (features, the story filter, selection advice — map machinery:
          `mochiko:authoring-feature-map`); this craft owns how well the stories are
          written. Neither edits the other's verdicts.

      - id: authoring-user-stories.technical-tasks-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Technical implementation tasks are not stories — use task decomposition
          instead.

      - id: authoring-user-stories.bug-reports-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Bug reports are not stories — use issue templates with reproduction steps.

      - id: authoring-user-stories.already-story-form
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          When requirements are already in user story format, do not duplicate the work.

      - id: authoring-user-stories.architecture-decisions-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Architecture decisions — capture technical-decision rationale in the design
          track instead; this skill authors user stories, not technical choices.

      - id: authoring-user-stories.api-contracts-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          API contract design — define endpoints and schemas in the design track
          instead; this skill authors user stories, not interface contracts.

      - id: authoring-user-stories.rationalization-stop
        labels: [boundary]
        class: floor
        text: >-
          If any excuse in the Common Rationalizations table arises as a thought
          mid-authoring, STOP immediately — you are rationalizing; write complete
          stories with all required sections. No exceptions: not for "simple" features,
          "we'll refine later", "tight deadlines", nor even if the user says "just give
          me quick stories".

  - id: authoring-user-stories.sec.inputs
    title: Inputs — none bound
    intent: >-
      Surfaces read before authoring.
    note: >-
      Deliberately empty at census — this member binds no pre-read surface beyond its
      schema pair; the feature description arrives as the run's material, not a bound
      input.
    rules: []

  - id: authoring-user-stories.sec.artifact
    title: Artifact — the story set's binding grammar
    intent: >-
      The produced stories' form, caps, and field rules.
    rules:

      - id: authoring-user-stories.letter-is-spirit
        extends: authoring-common.letter-is-spirit
        class: floor

      - id: authoring-user-stories.independently-testable
        labels: [artifact-grammar]
        class: must
        text: >-
          Each story MUST be independently testable, with measurable acceptance
          criteria.

      - id: authoring-user-stories.deliverable-envelope
        extends: authoring-common.envelope-binding
        class: must
        kind: binding

      - id: authoring-user-stories.story-structure
        labels: [artifact-grammar, binding]
        class: must
        kind: binding
        text: >-
          Generate 2–5 user stories per feature, landing in `spec.md`, each to the exact
          structure the SKILL.md format block renders — title with priority, the user
          journey, a "Why this priority" line, an Independent Test line, and numbered
          acceptance scenarios.

      - id: authoring-user-stories.density-fields
        labels: [artifact-grammar]
        class: must
        text: >-
          Every field is dense — the journey ≤ 2 lines, the priority justification and
          the independent test one line each, and each acceptance scenario a single line
          (the T1 form). A scenario that needs a paragraph is hiding several scenarios
          or restating context the Given already carries.

      - id: authoring-user-stories.priority-justified
        labels: [artifact-grammar]
        class: must
        text: >-
          Every story carries a P1 / P2 / P3 priority with a one-line justification —
          detailed assignment guidance in `references/PRIORITY-DEFINITIONS.md`,
          referenced never restated.
        pointer: "references/PRIORITY-DEFINITIONS.md"

      - id: authoring-user-stories.scenario-count-bound
        labels: [artifact-grammar]
        class: must
        kind: bound
        text: >-
          Each story needs 2–3 acceptance scenarios — the happy path plus the key edge
          case(s); more than 3 means the story is compound or the scenarios overlap.

      - id: authoring-user-stories.scenarios-independently-verifiable
        labels: [artifact-grammar]
        class: must
        text: >-
          Scenarios must be independently verifiable.

      - id: authoring-user-stories.observable-outcomes
        labels: [artifact-grammar]
        class: must
        text: >-
          Use concrete, observable outcomes — never implementation details or
          technology references.

      - id: authoring-user-stories.independent-test-required
        labels: [artifact-grammar, evidence]
        class: must
        text: >-
          Each story includes an Independent Test description naming how QA can verify
          the story in isolation, what data or setup is required, and what constitutes
          passing / failing — enabling parallel testing and clear verification.

      - id: authoring-user-stories.validation-script
        labels: [binding]
        class: advisory
        kind: binding
        text: >-
          Validate format (priority markers + justification, Given/When/Then
          completeness, independent-test presence, header format) with
          `python scripts/validate-user-stories.py path/to/spec.md`.
        pointer: "scripts/validate-user-stories.py"

  - id: authoring-user-stories.sec.output
    title: Output — none beyond the artifact
    intent: >-
      Report contracts this skill carries.
    note: >-
      Deliberately empty at census — the story set lands in `spec.md` per the artifact
      rules; no separate report contract exists.
    rules: []

  - id: authoring-user-stories.sec.reserved
    title: Reserved — the user's clearing
    intent: >-
      Decisions this seat never takes.
    rules:

      - id: authoring-user-stories.boundary-dispute-escalates
        labels: [user-gate, boundary]
        class: floor
        kind: reservation
        text: >-
          A disagreement across the PM-frame boundary escalates to the user — never
          resolved by either craft editing the other's verdicts.
