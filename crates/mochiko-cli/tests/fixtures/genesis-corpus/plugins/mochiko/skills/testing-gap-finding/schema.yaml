# Skill content schema for mochiko:testing-gap-finding. The SKILL.md body instructs a raw,
# full Read of this file at skill invoke — the small families ship no common file, so the
# pair's own schema is the whole first action — and its "Rules — load the schema first"
# section carries the reading grammar. Two semantics live only here:
#   class   floor = non-waivable · must = binding obligation · advisory = guidance, not binding.
#   conditions:  each dimension declares its resolution point (entry-derived · surface-presence);
#           a rule gated on an unresolved dimension is inapplicable until it resolves.
kind: skill
skill: testing-gap-finding

conditions:
  run_scope:
    values: [selection, epic, delta, product-lane]
    resolution: entry-derived
    note: the implement run's scope class, declared at run open.
  depth:
    values: [low, high]
    resolution: entry-derived
    note: the project's declared depth level; probe-kit breadth is invariant at both.
  mutation_tool:
    values: presence
    resolution: surface-presence
    note: a stack-matched mutation tool available to the verification seat.

sections:
  - id: testing-gap-finding.sec.independence
    title: Independence — the blind seat and the split authorships
    intent: >-
      Who explores, who runs the lens, and who authors the fold-back.
    rules:

      - id: testing-gap-finding.seat-devils-advocate
        labels: [independence]
        class: must
        kind: binding
        text: >-
          The seat is `mochiko:devils-advocate` — the adversarial gap-hunt craft.
          Persona carries the judgment, this skill carries the procedure.
        pointer: "mochiko:devils-advocate"

      - id: testing-gap-finding.lens-alongside-never-inside
        labels: [independence]
        class: floor
        text: >-
          The mutation lens needs code sight, so it runs alongside, never inside, the
          blind explorer — on the existing verification seat, which already holds code
          sight.

      - id: testing-gap-finding.fold-back-authorship
        labels: [independence]
        class: must
        text: >-
          Every gap the user rules fix-now or backlog is authored as a `**TEST:**` case,
          in the grammar owned by `mochiko:patterns-vertical-tdd`, by the QA craft
          (`mochiko:qa-engineer`) — never the exploratory seat. Findings accepted
          as-designed do not fold.

  - id: testing-gap-finding.sec.scope
    title: Scope — one pass, its placement, and the jurisdiction lines
    intent: >-
      Where the pass runs, what it never executes, and the lens's bounds.
    rules:

      - id: testing-gap-finding.test-execution-is-testing-end-user
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Executing a declared `**TEST:**` case belongs to `mochiko:testing-end-user` —
          re-running declared cases, or authoring unit tests, is not this layer.
        pointer: "mochiko:testing-end-user"

      - id: testing-gap-finding.test-grammar-consumed-never-redefined
        labels: [boundary]
        class: must
        kind: binding
        text: >-
          The `**TEST:**` construct is owned by `mochiko:patterns-vertical-tdd` —
          consumed here when folding findings back, never redefined.
        pointer: "mochiko:patterns-vertical-tdd"

      - id: testing-gap-finding.one-pass-at-final-validation
        labels: [boundary]
        class: must
        when: {run_scope: [selection, epic]}
        text: >-
          One pass, at final validation, over the whole built feature — full surface
          visible, seams live against real delivered sides, one cost per run.
          Selection-scope runs run the pass; an epic runs it once, over the union of
          member territories, at the epic's single final validation.

      - id: testing-gap-finding.delta-lane-skip-stated
        labels: [reporting]
        class: floor
        kind: duty
        when: {run_scope: [delta, product-lane]}
        text: >-
          Delta-scope and product-lane runs are skipped, and the final-validation report
          states the skip explicitly. A silent no-op is a defect: their sole expectation
          source is the card, which the fence forbids.

      - id: testing-gap-finding.real-infrastructure-never-mocks
        labels: [evidence]
        class: floor
        text: >-
          Probing runs against real infrastructure, never mocks.

      - id: testing-gap-finding.probe-kit-breadth-invariant
        labels: [evidence]
        class: must
        text: >-
          The probe kit's seven families run at both depth levels; breadth is invariant.

      - id: testing-gap-finding.mutation-lens-bounds
        labels: [boundary]
        class: must
        kind: bound
        when: {depth: high, mutation_tool: present}
        text: >-
          The mutation lens runs at HIGH depth only, over this feature's diff only
          (changed-code mutation, `cargo-mutants --in-diff` class), timeboxed.

      - id: testing-gap-finding.tool-advisory-posture
        labels: [boundary]
        class: floor
        text: >-
          The mutation tool is an advisory post-hoc checker read as an optional exit-code
          signal: it never gates progress, never dispatches agents, never holds judgment
          this skill owns.

      - id: testing-gap-finding.out-of-territory-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          A gap in a previously delivered feature's territory — via the accumulated gates
          or a seam — is not this run's rework. It routes to a `/mochiko:feature` delta
          card, cited in the report.

  - id: testing-gap-finding.sec.inputs
    title: Inputs — the blindness fence and the derivation duty
    intent: >-
      The explicit inclusion list, its structural exclusions, and what is on the record
      before probing opens.
    rules:

      - id: testing-gap-finding.blindness-fence-inclusion-list
        labels: [fence]
        class: floor
        kind: binding
        text: >-
          The explorer is blind to code and cards. Admissible inputs are an explicit
          inclusion list, not a layer label: `spec.md` (FR-XXX, SC-XXX, stories, declared
          edge cases) · the run's sufficiency report and the feature's design-phase
          deltas — those two artifacts only, never the `FEAT-XXX/` run-output directory
          at large · Screens & Flows (SCR-XXX, FLOW-XXX) · `data-model.md` (entities,
          state machines, DS-XXX sensitivity) · `contracts/` (`api.yaml` and any sibling
          contract documents) · the architecture store's concern rows only — their
          `NFR-XXX` targets (`.mochiko/product/architecture/concerns.md` plus any
          graduated `concerns/AX-XXX-<slug>.md`). All define externally-observable
          promised behavior, so the pass stays black-box.

      - id: testing-gap-finding.spine-outside-fence
        labels: [fence]
        class: must
        text: >-
          The store's spine deep view stays outside the fence — it is design structure,
          not promised behavior, and admitting it would widen the fence no ruling
          widened.

      - id: testing-gap-finding.structural-exclusions
        labels: [fence]
        class: floor
        text: >-
          Excluded, structurally: the code · the cycle cards (`tasks.md`) · the
          `**TEST:**` cases · cycle reports · the builder's tests.

      - id: testing-gap-finding.delegated-reads-inherit-fence
        labels: [fence]
        class: floor
        text: >-
          Delegated reads inherit the inclusion list. A locate, enumeration, or targeted
          read over the code, the cycle cards, or the `**TEST:**` cases is outside the
          fence and is never delegated — a subagent's return carries code sight back to
          the blind seat exactly as a direct read would.

      - id: testing-gap-finding.two-message-dispatch
        labels: [fence, independence]
        class: floor
        kind: duty
        text: >-
          The fence is held by dispatch order, not trust. Message 1 carries
          inclusion-list references only — never a card, code, or `**TEST:**` path — and
          the seat reads them and states its derived expectations; message 2 opens
          probing only once those expectations are on the record.

      - id: testing-gap-finding.expectations-numbered-before-probing
        labels: [evidence]
        class: must
        kind: duty
        text: >-
          Before probing, expected behaviors are enumerated as a numbered list, across
          the five derivation families — the numbering makes the done condition's count
          auditable.

  - id: testing-gap-finding.sec.verdict
    title: Verdict — the finding-kind split and the clean-pass polarity
    intent: >-
      How findings classify, and what completes the pass.
    rules:

      - id: testing-gap-finding.finding-kind-split
        labels: [verdict, evidence]
        class: must
        text: >-
          Findings split by kind, never by severity. Spec-violation is blocking — final
          validation fails — with evidence captured and the spec clause cited; a broken
          `NFR-XXX` numeric target on a store concern row qualifies. Beyond-spec
          (robustness gap, undeclared edge behavior, surviving mutant, observability
          hole) is advisory to the final checkpoint, where the user rules fix-now /
          backlog / accept.

      - id: testing-gap-finding.observability-advisory-only
        labels: [verdict]
        class: must
        text: >-
          Observability findings are advisory-only, always: by construction no clause
          exists to cite.

      - id: testing-gap-finding.surviving-mutants-advisory
        labels: [verdict]
        class: must
        text: >-
          Surviving mutants are beyond-spec advisory findings — never blocking.

      - id: testing-gap-finding.done-condition
        labels: [verdict]
        class: must
        kind: duty
        text: >-
          The pass is complete when every derived expectation has been probed, or
          explicitly marked unprobeable with a reason, within the charter's timebox.

      - id: testing-gap-finding.zero-findings-clean-pass
        labels: [verdict]
        class: must
        text: >-
          Zero findings is a clean pass — no never-zero rule, no quota. The disclosure is
          the honesty mechanism, not the finding tally; padding findings to avoid a zero
          corrupts the disclosure.

  - id: testing-gap-finding.sec.output
    title: Output — the disclosure, the noted skips, and the durable gate set
    intent: >-
      What the report states and where fold-back lands.
    rules:

      - id: testing-gap-finding.tool-absent-skip-noted
        labels: [reporting]
        class: must
        kind: duty
        when: {mutation_tool: absent}
        text: >-
          Tool absent = lens skipped AND noted — never silent. Routine on the mobile and
          desktop shelves, where mutation tooling is sparse; note it there too.

      - id: testing-gap-finding.flaky-suite-skip-noted
        labels: [reporting]
        class: must
        kind: duty
        when: {mutation_tool: present}
        text: >-
          A flaky suite detected during the run = lens skipped, and the skip noted.

      - id: testing-gap-finding.report-disclosure
        labels: [reporting, evidence]
        class: must
        kind: binding
        text: >-
          The final-validation report discloses the expectation count, the probed count,
          each unprobeable expectation with its reason, and the findings by kind.

      - id: testing-gap-finding.gates-artifact-contract
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The durable gate set is `.mochiko/features/FEAT-XXX/gates.md` — minted at first
          fold (or at card authoring inside the implement run) and surviving graduation:
          work rows vanish, `gates.md` persists. It is the named read source of the
          accumulated territory `**TEST:**` gates; at a later final validation that read
          is the union of the territory features' `gates.md` plus their cards' cases.

      - id: testing-gap-finding.reviewer-mirror-checklist
        labels: [reporting]
        class: must
        kind: duty
        text: >-
          The pre-hand-up quality checklist mirrors this schema's rules one-for-one — scope and
          skip statement · fence-clean dispatch and delegation · numbered expectations
          before probing · depth-bound lens or noted skip · kinds proposed with evidence ·
          adjudication and routing honored · done condition met · disclosure complete ·
          fold-back authored — each box checked against its rule, none beyond them.

  - id: testing-gap-finding.sec.reserved
    title: Reserved — the lead's confirmation and the user's rulings
    intent: >-
      Decisions the finder never takes alone.
    rules:

      - id: testing-gap-finding.adjudication-lead-and-user
        labels: [user-gate, verdict]
        class: floor
        kind: reservation
        text: >-
          The finder proposes the kind; the lead confirms the blocking classification at
          the checkpoint verdict against the cited clause; a disputed kind defaults
          advisory and goes to the user, who rules. The finder never gates alone.

      - id: testing-gap-finding.rework-bound
        labels: [verdict]
        class: must
        kind: bound
        text: >-
          Gap-rework carries a whole-run bound, default 2 rounds, redeclarable only at
          run open. A finding localizing to one cycle's territory charges that cycle's
          remaining attempts instead.

      - id: testing-gap-finding.bound-exhaustion-user-ruled
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          Bound exhaustion or a no-progress round halts the run; the disposition is
          reserved to the user.
