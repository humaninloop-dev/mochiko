# Skill content schema for mochiko:patterns-architecture-shelves. The SKILL.md body instructs
# a raw, full Read of this file at skill invoke — one declared first action — and its "Rules —
# load the schema first" section carries the reading grammar. One semantic lives only here:
#   class   floor = non-waivable · must = binding obligation · advisory = guidance, not binding.
# This schema declares no `conditions:` — no rule carries a `when:` guard.
kind: skill
skill: patterns-architecture-shelves

sections:
  - id: patterns-architecture-shelves.sec.trigger
    title: Trigger — when the shelf comes back out
    intent: >-
      What fires a revisit of a dealt shelf.
    rules:

      - id: patterns-architecture-shelves.event-keyed-freshness
        labels: [trigger]
        class: advisory
        text: >-
          Shelf revisit is event-keyed, never calendrical — after the desk skill's first
          live run, and thereafter whenever a desk visit finds a default argued against
          twice in one project: that signal means the default is stale or the segment
          moved. The store steward owns freshness.

  - id: patterns-architecture-shelves.sec.scope
    title: Scope — what the shelf governs and what it never is
    intent: >-
      Jurisdiction lines: the desk's axis, the store's grammar, the siblings.
    rules:

      - id: patterns-architecture-shelves.ax-grammar-routing
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          Stances land as `AX-XXX` rows in the store — `mochiko:authoring-architecture-store`
          owns that grammar: row fields, ids, statuses, and the index are its, never
          redefined here.

      - id: patterns-architecture-shelves.never-a-rigor-dial
        labels: [boundary]
        class: floor
        text: >-
          The shelf never reads the governance low/high depth level — a low-depth project
          walks the same shelf as a high-depth one; the shelf is not a rigor dial.

      - id: patterns-architecture-shelves.not-per-feature-design
        labels: [boundary]
        class: must
        kind: routing
        text: >-
          The shelf sets the product's standing posture, never a per-feature design — a
          feature's structural delta is `mochiko:patterns-system-design`'s.

      - id: patterns-architecture-shelves.one-dial-one-system
        labels: [boundary]
        class: must
        text: >-
          Two instruments, two axes, stated openly — the governance depth dial governs how
          rigorous a floor row's obligation is; the desk governs what stance the product
          takes. One dial must not silently drive two systems, so it drives one and this
          skill drives the other.

  - id: patterns-architecture-shelves.sec.discipline
    title: Discipline — breadth, order, and the floor stratum
    intent: >-
      The binding core of the walk: every row, retrofit-cost order, honest gaps,
      floor-asserted precedence.
    rules:

      - id: patterns-architecture-shelves.honest-gaps
        labels: [evidence]
        class: floor
        text: >-
          When the scoped surface has no seeded shelf — only the backend/service shelf is
          seeded today — the gap is named plainly, honest never silent, and the walk leans
          on the project's own facts and the universal floor's categories. A filtered
          backend list is never dealt to a non-backend surface: a frontend repo needs
          frontend depth, not backend leftovers.

      - id: patterns-architecture-shelves.retrofit-cost-walk-order
        labels: [ladder]
        class: must
        kind: duty
        text: >-
          The shelf is walked in order of what costs most to retrofit, never in file
          order; retrofit cost is the whole ordering principle, and where a row sits
          between the poles is judgment made fresh against the project.

      - id: patterns-architecture-shelves.breadth-invariant
        labels: [ladder]
        class: floor
        text: >-
          Every row on the scoped shelf is walked — a row may close in two seconds, but it
          is never silently skipped: an unwalked row is invisible, a row walked and
          dismissed is a recorded decision. There is no magnitude scaling — a two-person
          MVP and a mature platform walk the same shelf; the per-row stance is the
          magnitude valve, and `not-now` is the per-dimension depth control.

      - id: patterns-architecture-shelves.floor-asserted-rows
        labels: [floor-pointer, user-gate]
        class: floor
        text: >-
          Where a universal-floor card asserts a category — the rows carrying a
          `floor_bound` value in the shelf data; read the data for the live set, never
          work from a remembered list — `n-a — genuinely never` is unavailable at the
          desk. The legal moves are a stance within the obligation, `n-a — handled
          elsewhere` with its pointer, or narrowing the scope; a genuine drop is a
          governance waiver recorded in the ledger, never a shelf stance. This rule is
          the first stratum of the three-strata precedence;
          `patterns-architecture-shelves.card-shelf-conflict-users` and
          `patterns-architecture-shelves.one-dial-one-system` carry the second and third.

  - id: patterns-architecture-shelves.sec.inputs
    title: Inputs — the data and the scope line
    intent: >-
      What is read before dealing, and where scope durably lives.
    rules:

      - id: patterns-architecture-shelves.opinions-in-data
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The opinions live in data — the backend shelf ships at
          `plugins/mochiko/schemas/architecture-shelf-backend.yaml`, Read raw; the
          judgment lives in this skill.
        pointer: "../../schemas/architecture-shelf-backend.yaml"

      - id: patterns-architecture-shelves.scope-from-spine
        labels: [binding]
        class: must
        kind: binding
        text: >-
          The scope is read from `spine.md`'s `Scope:` line — setup's scaffold wrote it
          there, and the desk overrides it there: the user knows their repo better than
          the setup answer does. The read scope is shown to the user for override, never
          silently assumed; that line is scope's durable home, and the user is never
          re-asked at each walk.

  - id: patterns-architecture-shelves.sec.disclosure
    title: Disclosure — the stance grammar and its provenance
    intent: >-
      What each dealt row states and carries.
    rules:

      - id: patterns-architecture-shelves.memory-asserted-provenance
        labels: [evidence]
        class: must
        kind: duty
        text: >-
          Every default is memory-asserted — common practice as the shelf's author knows
          it, not a verified external claim. Say so whenever a row's default carries
          weight in the decision.

      - id: patterns-architecture-shelves.stance-vocabulary
        labels: [artifact-grammar]
        class: must
        text: >-
          A stance is one of `decided` (a ruling exists — carries the ruling and its
          rationale) · `not-now` (real concern, consciously deferred) · `n-a` (permanently
          dismissed) · `open` (walked, no stance formed — the health view counts it).

      - id: patterns-architecture-shelves.na-reason-axis
        labels: [artifact-grammar]
        class: must
        kind: duty
        text: >-
          `n-a` is always written with its reason suffixed — `n-a — genuinely never` (the
          concern does not apply to this product, ever) or `n-a — handled elsewhere` (the
          concern is real and another repo, system, or team owns it) — and the two are not
          interchangeable. `handled elsewhere` requires the pointer to that owner, not
          optional: without it the row is an unowned concern wearing a dismissal.

      - id: patterns-architecture-shelves.not-now-carries-trigger
        labels: [artifact-grammar]
        class: must
        kind: duty
        text: >-
          Every `not-now` carries an upgrade trigger — the condition that reopens it; a
          deferral with no trigger is a row nobody will look at again.

  - id: patterns-architecture-shelves.sec.reserved
    title: Reserved — the user rules, the shelf never asserts
    intent: >-
      Decisions the desk never takes on its own.
    rules:

      - id: patterns-architecture-shelves.recommend-then-arbitrate
        labels: [user-gate]
        class: floor
        kind: reservation
        text: >-
          Every row is recommend-then-arbitrate — name the suggested default, say what it
          costs and what would argue against it, then the user rules. Architecture choice
          is per-project judgment, not a standard; an asserted default here would be an
          opinion wearing a rule's clothes.

      - id: patterns-architecture-shelves.card-shelf-conflict-users
        labels: [user-gate]
        class: must
        kind: reservation
        text: >-
          Arbitrated constitution cards and shelf rows bind different things — cards bind
          code-layer structure, shelf rows bind product topology and cross-cutting
          concerns, and they usually miss each other entirely. A genuine conflict is the
          user's to rule, never resolved at the desk.
