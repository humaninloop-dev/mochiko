# mochiko-cli release — build the binaries a `cargo binstall` or a manual download consumes.
#
# Distribution is D4: the user installs `mochiko-cli` as an ordinary developer tool, and the
# plugin depends on it being on PATH. This workflow is the machinery half of wave 1; the public
# release itself belongs to wave 2, AFTER the `/mochiko:setup` amend run lands the GI-020
# rewrite (record D9). So the `publish` job below is present and disabled: wave 2 flips one
# condition here and lifts `publish = false` in `Cargo.toml`, and nothing else moves.
#
# Actions are pinned to release tags, matching ci.yml; SHA-pinning is the same recorded
# hardening follow-up that file carries.
name: release

on:
  push:
    tags:
      - "mochiko-cli-v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          # arm64 Linux builds through `cross` rather than an arm64 runner: it needs no runner
          # availability and produces the same artifact wherever the job lands.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} -p mochiko-cli
          else
            cargo build --release --locked --target ${{ matrix.target }} -p mochiko-cli
          fi

      - name: Strip, archive and checksum
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/mochiko-cli"
          strip "$bin" || echo "strip unavailable for ${{ matrix.target }}; shipping unstripped"
          stage="mochiko-cli-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "$bin" "$stage/"
          cp README.md LICENSE* "$stage/" 2>/dev/null || true
          tar -czf "$stage.tar.gz" "$stage"
          shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256"

      - name: Upload the release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mochiko-cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            mochiko-cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

  publish:
    name: publish to crates.io (disabled until wave 2)
    needs: build
    # DISABLED BY DESIGN. The first public publish lands at wave 2, after the amend run
    # rewrites GI-020 (record D9). Wave 2 changes this line to `if: true` — or drops it — and
    # lifts `publish = false` from crates/mochiko-cli/Cargo.toml in the same landing.
    if: false
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p mochiko-cli
