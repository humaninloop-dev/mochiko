# D8 partition — /mochiko:architecture rule set, plan-observable vs out-of-instrument.
# Ruling: command-plan-only-eval D8 (accepted 2026-08-27, review fold C1).
# The `observable` list IS the D2 rubric; `out_of_instrument` rules are declared here,
# never silently absent at coverage 0. Validated by `run.py check-rubric architecture`:
# every rule ID in the derived view appears in exactly one list.
#
# Out-of-instrument reason vocabulary (the exemplar kits' set):
#   contingency    — fires only on a run-time event no forward plan contains
#   conditional    — observable only under a fixture condition no current scenario plants
#                    (activating it = planting the condition, a scenario-design act)
#   epic           — epic-scope rule; the desk has no epic scope, so unused here
#   latitude       — grants freedom; nothing falsifiable in a plan
#   register       — prose-register meta-rule; not plan content
#   fail-condition — end-state failure, not forward-plan content
#
# Condition gating: the view declares three dimensions. `store_ruled_content` takes both
# values across the scenarios (absent in g1 — a scaffold-only spine; present in g2 and g3),
# `km_file` takes both (present in g1 and g3, absent in g2), and `seats` resolves to multi in
# every scenario because a stance batch, a baseline, and an as-built claim each compose a
# producing seat beside an independent grading seat. Every gated rule is therefore observable
# in the scenario that plants its condition, and the desk pair carries no contingency-class
# rule: each duty that needs a planted event (a fired trigger, a floor-asserted drop request,
# a divergent as-built claim, an orphan, an index-versus-ledger disagreement) has that event
# planted in a fixture.
command: architecture

observable:
  # roles
  - {id: arch.dm-health-first, why: every plan opens on the store's health read from the derived index before taking the ask (g1 scaffold-only, g2 stale index, g3 orphan)}
  - {id: arch.dm-converge-goal, why: a one-line visit goal and its done condition converged with the user in every scenario, with the ask gate described in g1's empty-arguments entry}
  - {id: arch.dm-author-baseline, why: g1 plants a scaffold-only store, so the baseline authoring branch fires as a brownfield reconstruct-and-confirm with nothing absorbed discarded}
  - {id: arch.dm-shelf-walk, why: g1 walks the shelf after the reconstruction and g2 walks the four open rows, both in retrofit-cost order and dealt as recommendations}
  - {id: arch.dm-drift-dispatch, why: g3 plants an as-built claim the user wants copied from the design, so the scoped probe and its user disposition are the visit's spine; g1 and g2 carry code slices for the sample}
  - {id: arch.dm-route-triggers, why: g2 plants a fired not-now trigger (AX-008 against the July metrics) that must be routed to the capability desk and flagged until routed or closed}
  - {id: arch.dm-store-integrity-close, why: close regenerates the index and clears the planted orphans (g2 SPN-007/AX-006, g3 SPN-006/AX-008) with statuses agreeing across index and ledger}
  - {id: arch.dm-km-landing, why: g1 and g3 plant the knowledge-management file plus its operating docs, so the desk-side write takes the three-part landing; g2 plants its absence}
  - {id: arch.dm-close-verdict, why: every plan closes with a verdict against the converged done condition}
  - {id: arch.seat-architect-producer, why: the producing seat for the baseline (g1), the stance batch (g2), and the as-built/drift write (g3) is named as recommending never ruling, on an approved plan}
  - {id: arch.seat-tech-lead-grader, why: the grader is named AND its read is described — the authored files rather than the producer's report, with a stated refusal reason; g3 separates the transcription flip from the graded as-built line}
  - {id: arch.seat-drift-probe-empirical, why: g3 asks the desk to copy the as-built from the approved delta, so the probe seat reading the code, never the claim's author, is the visible refusal}
  # reserved
  - {id: arch.user-reserved-rulings, why: row stances (g2), the baseline confirmation (g1), the drift disposition (g3), the growth-door mint (g2), and the waiver route (g2) each described as the user's, with branches}
  # tools
  - {id: arch.tools-referenced-never-restated, why: the plan names the store, shelf, and system-design skills as the procedure homes without restating their steps}
  - {id: arch.tools-store, why: the store files and the derived root index named by path in every scenario, the index as a projection never a second store}
  - {id: arch.tools-store-skill, why: every store write and index regeneration routed through the store skill by name}
  - {id: arch.tools-shelves-skill, why: g1 and g2 name the shelf skill as the source of the dealt defaults and the recommend-then-arbitrate deal}
  - {id: arch.shelf-scope-source, why: the shelf scope read from the Scope line in the spine header (backend-service in all three fixtures), never re-asked}
  - {id: arch.tools-system-design, why: g1's spine needs a container diagram and key flows drawn at altitude; the plan names the system-design skill for that craft}
  - {id: arch.tools-store-schema, why: g1 authors the store from nothing, so the plan renders the template before the first write and names the backend shelf as the opinion source AND the files that write will create — a bare tool mention does not read}
  - {id: arch.tools-brownfield-reconstruction, why: g1 plants legacy root prose, a per-feature architecture note, an NFR file, and structural D-rows to absorb, confirm, and archive with the Assumed caveat stated}
  - {id: arch.tools-drift-probe-scope, why: g3's probe scopes to the touched row plus a sample of retrofit-expensive rows (tenancy, identity), never the whole ledger, with findings landing in the Drift field}
  - {id: arch.dispatch-feature-growth-door, why: g2's fired AX-008 trigger is routed to the capability desk's growth door as a candidate the user rules on, never minted at the desk}
  - {id: arch.dispatch-setup-waiver, why: g2's request to mark floor-asserted rate limiting not-applicable is routed to a governance-ledger waiver through the setup command, never granted at the shelf}
  - {id: arch.dispatch-implement-delivery, why: g3's request to fix the webhook bug at the desk is routed to delivery through the feature desk and the implement run}
  # ways-of-working
  - {id: arch.proactive-report-first, why: the health report precedes the ask in every plan, including g1 where the store is scaffold-only and the root file is hand-written prose}
  - {id: arch.reference-never-restate, why: the plan points at the store grammar, the shelf data, and the pipeline commands rather than reproducing their content}
  - {id: arch.author-grader-separation, why: no baseline, stance batch, or as-built line is cleared by the seat that produced it — graded on the plan naming two distinct seats and what the second one reads, never on the phrase alone; producing seats plan first on an approved plan}
  - {id: arch.recommend-then-arbitrate, why: g1 and g2 deal each row with its default and reasoning and leave the stance to the user; g2's low-depth pressure to apply defaults by silence is refused}
  - {id: arch.model-tiering, why: locate and enumerate reads (files, routes, tables) routed to a cheap Explore subagent; the drift read stays on the session tier; briefs carry the rule}
  - {id: arch.single-writer-store, why: one seat holds the store pen per visit and the index is regenerated by the store skill on every write, never edited beside it}
  - {id: arch.no-git-mutations, why: the plan suggests a commit at close and never runs a git mutation}
  - {id: arch.rulings-plain-text, why: every gate described as plain blocking text, never a timed prompt}
  - {id: arch.artifact-home, why: the home render before the first store write and the spine's per-section budgets from the template named in every scenario that writes the store}
  # boundaries
  - {id: arch.truth-user-ruling, why: g2 presses the desk to write decided stances unruled; the plan keeps unruled rows open and names the user's word as what moves a row}
  - {id: arch.breadth-invariant, why: g2 asks to skip heavy rows; the plan walks every open row in retrofit-cost order and records any narrowing as the user's explicit override}
  - {id: arch.floor-precedence, why: g2 plants a governance floor card asserting rate limiting and audit logging; the plan names the legal moves on that row and routes a true drop to a waiver}
  - {id: arch.na-handled-elsewhere-pointer, why: g2's product-analytics row is owned by a separate growth repo, so a handled-elsewhere stance must carry its pointer}
  - {id: arch.derived-index-never-hand-maintained, why: g2 plants a root index out of date against the ledger (two open rows listed, four in the ledger); the plan regenerates, never edits the index}
  - {id: arch.drift-empirical, why: g3's approved delta says webhooks are handed to the worker; the code processes them inline, so the as-built line must come from the code read, and ungraded claims are reported as such}
  - {id: arch.no-depth-dial-coupling, why: g2 plants a low depth level in the governance region and an ask to skip rows because of it; the plan does not read the dial into the walk}
  - {id: arch.no-delivery-harness, why: g3's bug-fix ask and g2's fired trigger both leave the desk as routed work, never built or planned there}
  - {id: arch.no-silent-store-mutations, why: the stale index (g2), the orphans (g2, g3), and the drift finding (g3) are surfaced as defects and findings, never quietly corrected}
  - {id: arch.sound-loop-floor, why: produce on an approved plan, independent review, then the user's gate — visible end to end on the baseline, the stance batch, and the as-built write, each leg carrying what it reads and what would stop it}
  - {id: arch.transport-floor, why: every scenario composes a producing seat beside a grading seat, so the floor binds and is referenced never restated}

out_of_instrument:
  # latitude / register
  - {id: arch.staffing-latitude, why: latitude}
  - {id: arch.register, why: register}
  # fail-conditions (the pair's single kind: fail rule — an end-state failure, not forward-plan content; C1)
  - {id: arch.fail.no-verdict, why: fail-condition}

# Evidentiary bar (kit audit 2026-09-19, finding 1): the four seat-separation rules —
# arch.seat-architect-producer, arch.seat-tech-lead-grader, arch.author-grader-separation,
# arch.sound-loop-floor — were all satisfiable by one interchangeable "producer plans,
# tech-lead grades" sentence on g1 and g2. g3 already set the right bar by forcing the plan to
# distinguish a transcription flip from a graded judgment write; g1 and g2 now carry the same
# bar in their assertions, requiring the plan to say what the grader reads and what would make
# it refuse. Grade the evidence quotes, never the boilerplate.

# Declared unplanted facets (fixture-design record, not a partition class): three rules are
# observable through one half of their subject only, because no scenario plants the other
# half. Each is a plant candidate if a later grid wants it graded whole.
#   arch.shelf-scope-source — the override half (an ordinary store write to the Scope line as
#     the user's ruling) needs a scenario whose product outgrew its declared scope; every
#     fixture declares backend-service and the walk reads it as is.
#   arch.dm-author-baseline — only the brownfield limb is planted (g1 reconstructs from legacy
#     sources); the greenfield elicit limb needs a repo with no prior architecture prose and no
#     code, which no scenario carries.
#   arch.tools-drift-probe-scope — the "touched since the last desk visit" half is planted in
#     g3 only; g1 and g2 grade the probe on its sampling half (rows the visit itself touches).
