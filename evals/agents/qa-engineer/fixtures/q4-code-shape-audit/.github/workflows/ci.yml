name: ci
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postbox, POSTGRES_PASSWORD: postbox, POSTGRES_DB: postbox }
        ports: ["5436:5432"]
        options: >-
          --health-cmd "pg_isready -U postbox" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postbox:postbox@localhost:5436/postbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && pip install -e .
      - run: ruff check src tests
      - run: make migrate
      - run: pytest -q
