name: ci
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: shiftbook, POSTGRES_PASSWORD: shiftbook, POSTGRES_DB: shiftbook }
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U shiftbook" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://shiftbook:shiftbook@localhost:5435/shiftbook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: ruff check src tests
      - run: make migrate
      - run: pytest -q
