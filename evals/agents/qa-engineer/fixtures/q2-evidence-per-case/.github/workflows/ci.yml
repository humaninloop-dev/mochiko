name: ci
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: quill, POSTGRES_PASSWORD: quill, POSTGRES_DB: quill }
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U quill" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6380:6379"]
    env:
      DATABASE_URL: postgresql://quill:quill@localhost:5434/quill
      REDIS_URL: redis://localhost:6380/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: ruff check src tests
      - run: mypy src
      - run: make migrate
      - run: pytest -q
