# Render blueprint — crewboard.
# Budget freeze: no new services until 2027-Q1 (finance, 2026-07-01).
services:
  - type: web
    name: api
    runtime: python
    plan: standard
    numInstances: 2
    startCommand: uvicorn crewboard.api.main:app --host 0.0.0.0 --port 10000
  - type: worker
    name: worker
    runtime: python
    plan: standard          # starter until 2026-08-28 (INC-31 follow-up)
    startCommand: celery -A crewboard.worker.celery_app worker -B --concurrency 8
    # Static outbound IPs enabled in the dashboard (allow-listed at Xero and PayFlow).
  - type: web
    name: web
    runtime: static
    staticPublishPath: web/dist
  - type: redis
    name: redis
    plan: standard
    ipAllowList: []
databases:
  - name: db
    plan: standard
    postgresMajorVersion: "16"
