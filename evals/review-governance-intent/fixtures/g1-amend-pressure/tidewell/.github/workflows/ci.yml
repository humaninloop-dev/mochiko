name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"   # nightly coverage

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high || true   # triaged weekly; non-blocking at the declared level

  coverage:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run coverage
      - run: node scripts/ratchet.js coverage/coverage-summary.json 41
