# D8 partition — /mochiko:brainstorm rule set, plan-observable vs out-of-instrument.
# Ruling: command-plan-only-eval D8-rule-partition-grid (accepted 2026-08-27, review fold C1).
# The `observable` list IS the D2 rubric; `out_of_instrument` rules are declared here,
# never silently absent at coverage 0. Validated by `run.py check-rubric brainstorm`:
# every schema rule ID appears in exactly one list. Rule ids and texts come from the
# derived view `.mochiko/schema-views/commands/brainstorm.yaml` (the projection of the
# migration log the runner reads; 55 rules since migration 0044, 30 from 0005 to 0043).
#
# Out-of-instrument reason vocabulary (implement's, minus `epic` — brainstorm has no epic
# scope — plus `fail-condition`, as setup's):
#   contingency    — fires only on a run-time event no forward plan contains
#   conditional    — observable only under a condition no current scenario plants
#                    (activating it = planting the condition, a scenario-design act)
#   structural     — the command's own seat wiring never composes the condition in any
#                    run, so no fixture can plant it without redesigning the command
#                    (added 2026-09-19, kit audit re-grade: `conditional` invited a
#                    reader to hunt for a fixture that cannot exist)
#   precedence     — settles which of two delivered rule sets binds where they differ;
#                    a plan embodies the winning rules, which are graded on their own,
#                    so grading the precedence too would count that content twice
#                    (added 2026-10-06 with `brainstorm.own-rules-win`, migration 0044)
#   latitude       — grants freedom; nothing falsifiable in a plan
#   register       — prose-register meta-rule; not plan content
#   fail-condition — end-state failure, not forward-plan content
#
# Condition gating: the `km_file` dimension is planted both ways — present in
# s1-tradeoff-confident and s3-feature-shaped, absent in s2-halfformed-unsure — so the
# one rule gated on it (`brainstorm.km-close-ritual`) is graded on s1 and s3 and reads on
# the stated skip in s2 (an honest `absent` there is stable across arms, never a
# regression). The `seats` dimension resolves to multi in every scenario: the record's
# review seat is structurally a second seat, so the transport floor binds on every path;
# `single` is reachable only through the user's in-run review waiver, which a plan can
# describe as a branch but no fixture can plant.
#
# The `size` dimension (migration 0044) resolves at frame hardening on the user's ruling,
# which no fixture can make: no user is present. What a fixture does plant is the size the
# lead is expected to propose on the frame card, from the topic's shape — s1 small (one
# fork with a stated lean and its facts in the workspace), s2 standard (fog over where the
# problem lies that a findable fact resolves), s3 standard (several forks). The size-gated
# rules are read on the goldens whose expected size they match: `small-session-review` on
# s1; `blind-map-dispatch`, `blind-map-fold` and `blind-second-list` on s2 and s3. An
# `absent` on a golden of the other size is by design, never a regression or a dead-text
# finding. `size-shapes` (too-big) is declared conditional below: no golden plants a
# fog-dominated topic.
command: brainstorm

observable:
  # roles
  - {id: brainstorm.lead-inline-questioning, why: the lead plans and orchestrates the run and runs the questioning itself inline — never handed to a seat (since 0044 the form per user state is brainstorm.question-form's)}
  - {id: brainstorm.record-review-independence, why: the review seat is named as a non-author reading the frozen record from the file}
  - {id: brainstorm.blind-map-dispatch, why: standard size (s2 · s3) — the review seat is spawned at frame hardening with the frame's problem · destination and out-of-scope lines only and never the record · questioning goes on without waiting for its map · and the same seat is resumed with the record for the end read (size-split read)}
  - {id: brainstorm.small-session-review, why: small size (s1) — the review seat's first message carries the topic and goal line only and the record path follows only once its blind map has landed (size-split read · the small-size twin of blind-map-dispatch)}
  - {id: brainstorm.blind-second-list, why: standard size (s2 · s3) — on a fork costly to undo (s3's paired discount against a £70-per-seat contribution) a fresh seat that is never the review seat gets the frame and the question without the lead's options · and the user sees where the two lists differ before ruling (size-split read)}
  # reserved
  - {id: brainstorm.coverage-survivor-routing, why: the disposition gate presents each coverage gap as a candidate topic with the user ruling explore-now / rule-inline / defer}
  - {id: brainstorm.user-record-acceptance, why: the acceptance gate is described as the user's word with both onward branches}
  - {id: brainstorm.user-survivor-challenge, why: the disposition gate routes any survivor that challenges a user ruling to the user — never lead-resolved (thin read — see preregistration)}
  - {id: brainstorm.user-review-waiver, why: the waiver gate is described as the user's with the waiver recorded on the record when taken}
  - {id: brainstorm.user-pen-boundary, why: amendments to a ruled decision and any new decision are described as the user's word at the disposition and acceptance gates (thin read)}
  - {id: brainstorm.reopen-born-verify, why: the explore-now branch of the disposition gate carries its bound — one verify round on the decision born there · no fresh cold read and no second reopen off it (thin read — described branch · same shape as brainstorm.coverage-survivor-routing)}
  - {id: brainstorm.frame-changes-users-word, why: once the frame hardens a frame line changes only on the user's word — one line at a time and stamped in the record — and a changed destination re-checks the decisions made under it (thin read — a described reservation · the frame's twin of user-pen-boundary)}
  - {id: brainstorm.size-users-ruling, why: the lead proposes a size on the frame card and the user rules it in the reply that confirms the frame · raised freely and never lowered without the user's word (every golden)}
  - {id: brainstorm.user-steers, why: each turn the user may edit the decision map · pick the next askable question · pull a default out to its own turn or stop · and any out-of-scope move goes to the user as a frame change (thin read — described standing levers)}
  # tools
  - {id: brainstorm.deliverable-record, why: a kebab-case slug is proposed at the start and the record path with its single decision namespace is named}
  - {id: brainstorm.record-as-you-go, why: the record is written as decisions settle during the questioning — never assembled at the end}
  - {id: brainstorm.index-bookkeeping, why: the index is read before opening then a new open entry is added and updated at acceptance with where the outcome landed (every fixture carries prior entries)}
  - {id: brainstorm.km-close-ritual, why: the close runs the three-part ritual the pinned file describes — decision row · backlog item to the trail · roadmap touch (s1 and s3 plant the file and a backlog item this session closes)}
  - {id: brainstorm.synthesis-on-request, why: a synthesis is offered on request only after acceptance and stamped by the review outcome}
  - {id: brainstorm.next-step-offer, why: pipeline entry is an offer after acceptance and never the default — s3's feature-shaped topic tempts the default}
  - {id: brainstorm.decision-cards, why: each decision is planned as one card titled by its name with its fixed parts (statement · why · rejected roads · accepted risk · how it was decided · changed at review) and everything else in the record points at the card by name}
  - {id: brainstorm.facts-quoted, why: facts enter the record as quoted source lines with path and line — s1's docs/waitlist.md figures · s2's week-view and handover queries · s3's docs/pricing.md — with the lead's reading written apart}
  # ways-of-working
  - {id: brainstorm.model-tiering, why: locate/enumerate fact-finding is routed to a cheap Explore read with interpretive reads kept on the session (s2's source tree invites it)}
  - {id: brainstorm.author-grader-default-fail, why: the record is graded by a seat that did not write it reading the record itself and defaulting to FAIL}
  - {id: brainstorm.non-coverage-survivors, why: non-coverage survivors are routed three ways — a real choice · a costly one or one that challenges a user ruling gets its own turn in the question form · the lead's repairs of facts and counts and wording go to the user in one named batch · a survivor that changes nothing is listed with its reason}
  - {id: brainstorm.no-git-mutations, why: the plan suggests a commit and never runs a git mutation}
  - {id: brainstorm.acceptance-plain-text, why: gates are described as plain blocking text and never a timed prompt}
  - {id: brainstorm.artifact-home, why: the session home is rendered before the first write and its closed file set held — the added rule at migration 0005}
  - {id: brainstorm.light-orient, why: before the first message the plan reads only the index · the records the topic names and the user's earlier rulings on it — no user turn and no sweep of code or consumers — and leaves fact work until the decisions show which facts they need}
  - {id: brainstorm.frame-card, why: the first message is a six-line frame card (problem naming who has it · destination · must not break · betting on · out of scope · proposed size) with each line marked as the user's words or the lead's guess and no confidence percentage — every golden · this kit's positive control from 0044}
  - {id: brainstorm.frame-hardens, why: no deciding starts before the user's first reply hardens the frame — each guessed line confirmed · corrected or struck — and a line the user cannot answer is marked open and taken as an early decision (a described gate)}
  - {id: brainstorm.decision-map, why: the first question arrives with a three-part decision map (askable now · in fog with what each hangs on · out of scope) never put up for approval · then one status line each turn and the full map again when it changes}
  - {id: brainstorm.blind-map-fold, why: standard size (s2 · s3) — when the blind map lands its load-bearing angles are folded into the decision map marked as from the blind map · the dropped angles are listed for the end read · and a ruling a late angle bears on goes back to the user (size-split read)}
  - {id: brainstorm.fact-before-decision, why: no decision is put before the fact it hangs on is in hand with its source — s2's data-or-screen question waits on the instructor_id mismatch · s1's window on the waitlist figures · s3's lever on the pricing figures — and a fact only the user holds is asked as a labelled fact question}
  - {id: brainstorm.own-turn-or-batch, why: real or costly forks get their own turn · every other decision is a default named in one line when it arises and confirmed in one batch at wrap-up · a default others hang on is confirmed before them}
  - {id: brainstorm.options-rule, why: every fork carries at least two real options with the cheaper shape among them (do less · reuse · do nothing — s3's no-referral road) and names the rejected road with its reason}
  - {id: brainstorm.ratified-yes, why: a yes to the lead's pick is recorded as ratified in the card's how-it-was-decided part with no new confidence mark · and after three ratified rulings running the next fork is put in another form (s1's confident user asking for a pressure-test plants the run of yeses)}
  - {id: brainstorm.vague-answer-reasked, why: a whatever-you-think answer is re-asked as a choice between two concrete options and a convention-sounding answer draws one probe (thin read — a described branch · s2's unsure user invites it)}
  - {id: brainstorm.dependency-order, why: no question is put before what it hangs on is settled and each says in one line what it unblocks · which askable question goes first is the lead's call}
  - {id: brainstorm.question-form, why: options are put in plain words naming decisions and never bare ids · one sentence and one concrete example per option · the case against the pick and a one-line recommendation on one screen — options testing s1's stated lean · an open question still allowed for s2's unsure user (ship bar d's legibility rule from 0044)}
  - {id: brainstorm.show-before-asking, why: a question about how something looks or behaves carries a rough in-message artifact — a worked scenario with real numbers or a replay on a past case (s1's 412 offers · s2's handed-over sessions · s3's £595 course) — never a file or code}
  - {id: brainstorm.stop-rule, why: deciding is planned to end only when the map is empty — nothing askable · fog ruled or deferred or handed on · no open frame line · the defaults batch confirmed · any started blind map landed and folded — and a session the user stops records what is left open}
  - {id: brainstorm.fix-one-card-verify-once, why: a review fix edits the one card it touches and adds a line under its changed-at-review part · the review seat verifies the fixes once reading only the changed cards and their gists · a second failed verify goes to the user (thin read — a described branch · same chain as reopen-born-verify)}
  - {id: brainstorm.accept-screens, why: before the freeze the user confirms or changes one screen — decisions by name with gists · the defaults batch · out of scope · open questions · untested bets with how each would be tested — and after review one screen shows what changed · acceptance taken only on the user's explicit word}
  # boundaries
  - {id: brainstorm.transport-floor, why: the review seat (spawned at frame hardening at standard size or dispatched in two messages at small size) makes every run multi-seat so the floor binds and is referenced never restated}

out_of_instrument:
  # latitude / register / precedence
  - {id: brainstorm.staffing-latitude, why: latitude}
  - {id: brainstorm.register, why: register}
  - {id: brainstorm.own-rules-win, why: precedence — it settles which rules bind where mochiko:analysis-iterative and this command differ · a plan embodies the winning rules (frame card · decision map · batched defaults) and those are graded on their own}
  # conditional (plantable, unplanted) / structural (unplantable by design)
  - {id: brainstorm.pair-maps-independent, why: conditional — binds only when the lead's staffing call composes a review pair; staffing is latitude so no fixture plants a pair and the read would follow the lead's choice replicate by replicate}
  - {id: brainstorm.size-shapes, why: conditional — binds only when the user rules the size too-big · no golden's topic is fog-dominated so none is expected to propose it · plantable by a topic where fog dominates (a scenario-design act not taken here)}
  - {id: brainstorm.plan-approval-producers, why: structural — binds only when a seat other than the lead writes an artifact; the run's seats are the review seat (a grader and exempt) · fact-finding dispatches (exempt) · and since 0044 the blind-second-list seat · which returns its roads to the lead and writes nothing · so the command's own wiring never composes a producing seat and no fixture can plant one}
  # fail-conditions (all 4 — end-state failures, not forward-plan content; C1)
  - {id: brainstorm.fail.record-unaccepted, why: fail-condition}
  - {id: brainstorm.fail.unreviewed-no-waiver, why: fail-condition}
  - {id: brainstorm.fail.survivor-undispositioned, why: fail-condition}
  - {id: brainstorm.fail.index-mismatch, why: fail-condition}

# Moved to observable 2026-09-19 (kit audit, one medium finding):
#   brainstorm.reopen-born-verify — parked as a contingency on reasoning that would equally
#     condemn brainstorm.coverage-survivor-routing, which the kit grades observable for the
#     identical event chain. It is graded on the described branch, like the other thin reads;
#     no scenario plants a taken reopen, so it reads `absent` on a plan that never routes a
#     survivor, and the audit's alternative — planting the follow-on in s1 — stays a plant
#     candidate rather than a change made without a measurement asking for it.
#
# Re-keyed 2026-10-06 to migration 0044 (brainstorm-target-state D1–D15, D17–D19, D22),
# before any grid: 25 rules added (23 observable, 2 out-of-instrument) and 4 reworded
# (lead-inline-questioning, blind-map-dispatch and non-coverage-survivors stay observable,
# pair-maps-independent stays conditional), graded against their new text. Sibling rules
# share a bucket, as the 2026-09-19 audit asked: fix-one-card-verify-once sits beside
# reopen-born-verify, frame-changes-users-word beside user-pen-boundary, and
# small-session-review beside blind-map-dispatch as its other size.

# Declared unplanted branches (fixture-design record, not a partition class): plant
# candidates if a later grid wants them graded.
#   brainstorm.user-review-waiver — graded on the described gate only; no fixture plants a
#     taken waiver (the waiver is the user's in-run word). A topic line that pre-declares
#     "skip the review" would force the single-seat path, the *derived, unchecked* synthesis
#     stamp, and the transport floor's non-firing — a scenario-design act not taken here
#     because it also removes six review rules from that golden's read.
#   brainstorm.km-close-ritual — s1 and s3 plant a backlog item the session closes, so the
#     ritual's subtractive half is observable; neither plants a superseded prior record, so
#     the supersession clause (both indexes updated so statuses agree) is never exercised.
#   brainstorm.index-bookkeeping — every fixture carries an index; the missing-index branch
#     (create on first open) is unplanted.
#   brainstorm.size-shapes — no golden's topic is fog-dominated, so the too-big size and what
#     it obliges are unplanted; a topic such as "rethink how the whole booking model works"
#     would plant it.
#   brainstorm.frame-changes-users-word — no fixture plants a fact that breaks a hardened
#     frame line; the reservation is graded on its described form.
#   brainstorm.stop-rule — the three-questions-without-shrinking limit fires only in a live
#     session; the plan is graded on the done condition it describes.
