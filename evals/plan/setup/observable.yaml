# D8 partition — /mochiko:setup rule set, plan-observable vs out-of-instrument.
# Ruling: command-plan-only-eval D8-rule-partition-grid (accepted 2026-08-27, review fold C1).
# The `observable` list IS the D2 rubric; `out_of_instrument` rules are declared here,
# never silently absent at coverage 0. Validated by `run.py check-rubric setup`:
# every schema rule ID appears in exactly one list.
#
# Out-of-instrument reason vocabulary (implement's, minus `epic` — setup has no epic
# scope):
#   contingency    — fires only on a run-time event no forward plan contains
#   conditional    — observable only under a fixture condition no current scenario plants
#                    (activating it = planting the condition, a scenario-design act)
#   latitude       — grants freedom; nothing falsifiable in a plan
#   register       — prose-register meta-rule; not plan content
#   fail-condition — end-state failure, not forward-plan content
#
# Mode gating: the three scenarios plant all three values of the `mode` dimension
# (s1-greenfield · s2-brownfield · s3-amend), so every mode-gated rule is observable in
# the scenario that plants its mode. The `seats` dimension resolves to multi in every
# scenario, because the pre-ratification stress-test is always a second seat.
command: setup

observable:
  # artifact homes (0005-artifact-homes, 2026-09-13)
  - {id: setup.artifact-home, why: the plan names the `mochiko-cli home .mochiko/memory` render before its first write and takes governance-intent / codebase-analysis section shapes from `mochiko-cli template <kind>`}
  # roles
  - {id: setup.interrogation-inline, why: lead runs the interrogation itself — agenda adaptively then the catalog deck card by card}
  - {id: setup.stress-test-cold-seat, why: the pre-ratification stress-test is staffed by a cold seat or a recorded waiver}
  - {id: setup.blind-map-dispatch, why: that seat is dispatched in two messages — the setup topic / project name and goal first — with the angle map returning before the synthesis path}
  # reserved
  - {id: setup.coverage-survivor-routing, why: surviving coverage findings presented as candidate topics with the user ruling the path}
  - {id: setup.user-mode-ruling, why: mode proposed from what the workspace shows and ruled by the user when ambiguous (all three modes planted)}
  - {id: setup.user-card-rulings, why: every card ruling / module ruling / waiver described as the user's}
  - {id: setup.gate-synthesis-ratification, why: ratification gate described with both onward branches before any authoring}
  - {id: setup.user-conflict-rulings, why: s2 plants three reality-versus-README conflicts to confront in the open}
  - {id: setup.gate-final-acceptance, why: acceptance gate described flagged proposal by flagged proposal}
  # tools
  - {id: setup.surface-set, why: the authored set named — region · scoped rules files · pointers · ledger · trace summary}
  - {id: setup.synthesis-artifact, why: synthesis path and its template-or-schema source named}
  - {id: setup.interrogation-inputs, why: agenda and catalog deck read from the plugin references (s2 adds the codebase analysis)}
  - {id: setup.constitution-superseded, why: s3 plants a stale constitution file to delete on sight in one line}
  - {id: setup.km-module-scaffold, why: the knowledge-management adoption branch described with its scaffold and pinned copy}
  - {id: setup.feature-map-greenfield, why: s1 and s2 scaffold the empty index write-if-absent — s2's carrying the line that reconstruction is pending and not setup's — while s3's existing index is left alone}
  - {id: setup.design-scaffold-unconditional, why: the lead writes the design home's empty truth headings where missing on every path — no fixture carries design.md — with no product-designer seat}
  - {id: setup.store-scaffold-unconditional, why: store scaffolded on every path — s3 creates only the missing concerns file}
  - {id: setup.architecture-scope-handoff, why: surface types declared on the spine header in s1 and s2 and the existing line left alone in s3}
  - {id: setup.next-step, why: close names the next doors}
  # ways-of-working
  - {id: setup.model-tiering, why: locate/enumerate reads routed to a cheap Explore subagent and every brief carries the routing rule}
  - {id: setup.plan-approval-producers, why: producing seats plan first and work only on an approved plan — graders exempt}
  - {id: setup.validate-seat-form, why: the validate step's grader named as a plain fresh seat running validation-constitution on an explicit model alias not below the producer's tier}
  - {id: setup.author-grader-default-fail, why: grading reads the authored surfaces themselves and defaults to FAIL}
  - {id: setup.no-git-mutations, why: plan suggests commits and never runs a git mutation}
  - {id: setup.acceptance-plain-text, why: gates described as plain blocking text and never a timed prompt}
  # boundaries
  - {id: setup.transport-floor, why: the cold seat makes every run multi-seat so the floor binds and is referenced never restated}
  - {id: setup.durables-never-deleted, why: s3 carries both durables — the amend extends them and never offers deletion}
  - {id: setup.governance-region-ownership, why: region regenerated between the markers with user content outside them untouched (planted in s1 and s3)}
  - {id: setup.carve-outs-preserved, why: s3 plants the output-style pair carrying a user-set value plus a user-added line}
  - {id: setup.map-never-overwrite, why: "the empty-index scaffold is written only where absent — s1 and s2 — nothing is reconstructed on any path, and s3's existing map is never written over"}
  - {id: setup.gate-loop-bound, why: "the validate loop described as one fix and one re-grade by the same seat, a second FAIL halting to the user"}
  - {id: setup.store-ruled-content-never-here, why: no architecture stance taken in the run on any path}
  # the thinking stage (0088-setup-thinking-stage, 2026-10-15)
  - {id: setup.thinking-stage, why: the plan binds the interrogation to mochiko:analysis-iterative as setup's thinking stage — the engine's asking rules referenced never restated · setup's rules carry the domain part (s1 · s2 · co-moves with setup.interrogation-inline)}
  # the asking line and ruling places (0085-asking-line · 0099-setup-asking-line, 2026-10-15)
  - {id: setup.ruling-places, why: each ruling outside the interrogation goes on the asking line with its next writer set — s2's three reality-versus-README conflicts writer held by the trace from ratified intent to the authored surfaces · the mode where ambiguous (all three modes planted) · the coverage survivors' routing · and a second FAIL at the gate loop writer off · synthesis ratification and final acceptance kept yes-or-no gates held by that trace and the validate seat's grade · the interrogation's card · module and waiver rulings left its own (co-moves with setup.asking-line)}
  - {id: setup.asking-line, why: the run's rulings outside the interrogation — s2's conflicts · the mode where ambiguous · the coverage survivors' routing · a second FAIL at the gate loop — are put under mochiko:analysis-iterative's asking rules by reference (facts read first · options with a recommendation · a mock in the message) and never restated · ratification and final acceptance keep their yes-or-no gate form (co-moves with setup.ruling-places)}

out_of_instrument:
  # latitude / register
  - {id: setup.staffing-latitude, why: latitude}
  - {id: setup.register, why: register}
  # fail-conditions (all 6 — end-state failures, not forward-plan content; C1)
  - {id: setup.fail.pre-ratification-authoring, why: fail-condition}
  - {id: setup.fail.unclosed-trace, why: fail-condition}
  - {id: setup.fail.author-graded, why: fail-condition}
  - {id: setup.fail.floor-category-uncovered, why: fail-condition}
  - {id: setup.fail.no-acceptance, why: fail-condition}
  - {id: setup.fail.no-feature-map, why: fail-condition}

# Declared unplanted branches (fixture-design record, not a partition class): two
# rule facets are observable through one half of their subject only, because no scenario
# plants the other half. Each is a plant candidate if a later grid wants it graded whole.
# (setup.fail.no-feature-map's amend-clause facet left this list when the "2026-09-24
# setup-product-agnostic D5" ruling narrowed the rule to one clause — no feature-map index at
# close, absent and not scaffolded.)
#   setup.carve-outs-preserved — the mochiko:domain-registry half needs the layer-rules
#     module attached and a domain-layer rules file; only the output-style pair is planted.
#   setup.km-module-scaffold — no fixture plants an adopted knowledge-management module, so
#     the rule is graded on the described adoption branch, never on a never-overwrite read.

