  - {id: impl.card-review-before-confirm, why: verification seat reviews cards before the confirm}
  - {id: impl.craft-build-bindings, why: build binds the executing/brownfield/minimalism skills}
  - {id: impl.craft-verify-bindings, why: verify binds testing-end-user + code-minimalism lens}
  - {id: impl.design-inputs, why: inputs enumerated - sufficiency report, the architecture.md drawing and the marked baseline entries in the pinned-base diff, baselines, spec}
  - {id: impl.progress-surface, why: per-card checkboxes flipped as progress}
  - {id: impl.reports-envelope, why: report paths + envelope format named}
  - {id: impl.gates-full-suite, why: quality gates run the full suite}
  - {id: impl.regression-sweep, why: accumulated delivered gates re-run (s2 - FEAT-001 gates.md)}
  - {id: impl.cold-verification, why: dependency-cold snapshot step planned}
  - {id: impl.gap-finding-scope, why: pass present on selection scope, skip stated otherwise}
  - {id: impl.gap-finding-blind-dispatch, why: two-message blind dispatch with the fence list}
  - {id: impl.finding-kinds, why: finding split spec-required vs beyond-spec described}
  - {id: impl.store-landing, why: three-part store landing (flip · As-built/Drift judgment · orphan check) planned where a store delta exists (s2)}
  - {id: impl.landing-selection, why: graduation batch - row fold, status, index, specs-index}
  - {id: impl.baseline-diff-review, why: pinned-base diff of every touched baseline reviewed - non-author grade; unmarked-write test; duplicate-id check; landing flip}
  - {id: impl.base-pins, why: run-open base pinned at entry before the sufficiency seat; sign-off pin at the checkpoint; both in the final-validation report}
  - {id: impl.baseline-entry-grammar, why: written and amended baseline entries carry the run's Lifecycle marker - proposed (<key>) until the checkpoint flips them}
  - {id: impl.run-folder, why: run-open names the run folder .mochiko/runs/<owner>-run<n>/ with its .gitignore line ensured, every seat brief carries it, and the lead removes it after acceptance}
  - {id: impl.evidence-citation, why: reports quote decisive lines with the command and commit (or the run-open pin plus the working fingerprint), never a full-log path}
  - {id: impl.gates-fold, why: ruled findings fold into gates.md in TEST grammar}
  # ways-of-working
  - {id: impl.author-grader-default-fail, why: no output cleared by its author across the roster}
  - {id: impl.plan-approval-producers, why: producing seats plan first, graders exempt}
  - {id: impl.escalation-batching, why: reserved questions accumulate to the cycle checkpoint and are put there on the asking line · only a build-blocking question interrupts mid-cycle}
  - {id: impl.finding-severity-routing, why: Minor to BACKLOG, Important blocks - routing described}
  - {id: impl.model-tiering, why: explore reads routed to haiku Explore, briefs carry the rule}
  - {id: impl.no-git-mutations, why: plan suggests commits, never runs git}
  - {id: impl.acceptance-plain-text, why: gates as plain blocking text, never timed}
  - {id: impl.design-stage-unit, why: each of s2's gaps opens on the user's direction and one I'd-know-it-works line (open allowed) · the contract gap's pieces proposed read-only by the technical-analyst and the worker gap's by the principal-architect · each piece put on its own turn or in the defaults batch · the seats' plans finished inside the ruled set}
  - {id: impl.design-stage-file, why: s2's ruled set is written to design-stage.md in FEAT-002's home in the shape `mochiko-cli template design-stage` renders · item by item as ruled and whole before the pen passes to the design seats}
  - {id: impl.index-regeneration, why: s2 writes contracts and store entries · so the derived ARCHITECTURE.md is regenerated through the store skill at the design checkpoint and again at landing (the fold only where structure was built)}
  # the asking line (0085-asking-line · 0093-implement-asking-line, 2026-10-15)
  - {id: impl.asking-line, why: the run's rulings outside the design stage — the card-order question where one is put (s1 · s2) and s2's desk offer — are put under mochiko:analysis-iterative's asking rules by reference (facts read first · options with a recommendation · a mock in the message) and never restated · the card confirm and final acceptance keep their yes-or-no gate form (co-moves with impl.ruling-places)}
