# D8 partition — /mochiko:implement rule set, plan-observable vs out-of-instrument.
# Ruling: command-plan-only-eval D8-rule-partition-grid (accepted 2026-08-27, review fold C1).
# The `observable` list IS the D2 rubric; `out_of_instrument` rules are declared here,
# never silently absent at coverage 0. Validated by `run.py check-rubric implement`:
# every schema rule ID appears in exactly one list.
#
# Out-of-instrument reason vocabulary:
#   contingency  — fires only on a run-time event no forward plan contains
#   conditional  — observable only under a fixture condition no current scenario plants
#                  (activating it = planting the condition, a scenario-design act)
#   epic         — epic-scope rule; no epic scenario exists yet
#   latitude     — grants freedom; nothing falsifiable in a plan
#   register     — prose-register meta-rule; not plan content
command: implement

observable:
  # artifact homes (0005-artifact-homes, 2026-09-13)
  - {id: impl.artifact-home, why: the plan names the `mochiko-cli home` render of the feature (or epic/lane) home before its first write and routes tasks.md and reports/ to it and the run log to the run folder}
  # roles
  - {id: impl.dm-entry-gate, why: plan shows run-open gating on the selected batch}
  - {id: impl.design-phase-fires-on-gap, why: gap-vs-zero-gap branch visible (s1 vs s2)}
  - {id: impl.dm-surface-rounds, why: checkpoints described surfacing rounds and seats}
  - {id: impl.dm-landing-whole, why: landing phase enumerated whole}
  - {id: impl.dm-close-verdict, why: close step states a verdict against the done condition}
  - {id: impl.seat-sufficiency-independence, why: sufficiency seat named independent of authors}
  - {id: impl.design-seats-staffing, why: design-seat choices named (advisory)}
  - {id: impl.design-gaps-only, why: design phase scoped to exactly the named gaps}
  - {id: impl.builder-never-designs, why: roster separates builder from design seats}
  - {id: impl.seat-card-author-independence, why: card author design-class with QA on TEST cases}
  - {id: impl.builder-decompose-disclose, why: build phase shows decomposition disclosed + test-first + plan approval}
  - {id: impl.seat-verification-independence, why: verification seats never the implementer, real infrastructure}
  - {id: impl.verification-design-time-grades, why: card review + the judgment grade of any build-raised baseline entry named}
  - {id: impl.landing-verifier-folds, why: landing verification checks the landing flip — in-flight and modifying to built, removing to its stub}
  - {id: impl.seat-gap-finder-blind, why: fresh devils-advocate dispatched blind}
  # the design stage (0076-implement-design-stage · 0077-implement-on-engine, 2026-10-11)
  - {id: impl.design-stage, why: s2's two graded gaps are ruled with the user on the thinking stage with its ruled-set contract on before any design seat drafts · the ruled set saved in design-stage.md · the design seats planning and drafting only inside it · run-open still one confirmation · s1's zero-gap path runs no stage (co-moves with impl.thinking-stage)}
  - {id: impl.design-stage-blind-list, why: s2 has two gaps and is no re-fire · so once before the stage closes a fresh persona-less opus seat given only the spec · the gap list · the store index draws the blind list and each difference is put to the user as a candidate piece}
  # reserved
  - {id: impl.gate-design-checkpoint, why: gate described with sign-off content and branches (s2)}
  - {id: impl.gate-card-confirm, why: blocking card confirm described}
  - {id: impl.gate-final-acceptance, why: accept/amend/reject close described}
  - {id: impl.user-runopen-rulings, why: run-open lists the reserved rulings}
  - {id: impl.design-stage-agenda, why: s2's stage agenda is exactly its two graded gaps and nothing outside them is designed without the user's ruling (the outside-need split by kind is unplanted · no fixture carries a need outside the gap list)}
  # architecture touches (0078-implement-architecture-touches, 2026-10-11)
  - {id: impl.desk-offer, why: s2's background-worker gap is structural and no desk visit file is keyed to FEAT-002 · so the stage first offers a desk visit (/mochiko:architecture FEAT-002 · the run pausing) or going on here · the user's choice}
  # the card order and the ruling places (0092-implement-card-order · 0093-implement-asking-line, 2026-10-15)
  - {id: impl.card-order, why: s1's cards (after the run-open confirmation) and s2's (after the design checkpoint) follow a rough order of what works after each step shown as a mock in the message before the card-authoring seat slices · a question only on a real choice (which independent outcome first · few big steps or many small) and none where the walking skeleton and the dependencies decide it · the ruled order saved as one line in tasks.md's header before that seat opens the file · the cards shown at the confirm as after step n you can… (the delta and lane limbs are unplanted · no delta or lane scenario)}
  - {id: impl.ruling-places, why: each ruling outside the design stage goes on the asking line with its next writer set — the card order writer on (s1 · s2 · the card-authoring seat writes from it and the card review checks it kept) · the run-open rulings writer held (written into the sufficiency report and binding the run) · s2's desk offer writer off · final acceptance kept a yes-or-no gate held by the landing verification seat (the checkpoint · disposition · deviation · governance · scope · kind-dispute · rework-bound · exemption and disputed-clause limbs are run-time contingencies · the epic-halt limb needs an epic scenario · the absent-surface and design-first-write limbs need fixture conditions none plants · co-moves with impl.asking-line)}
  - {id: impl.promises-kept-table, why: s2's acceptance gate is shown as a promises-kept table composed in the conversation with no new file — each I'd-know-it-works line from s2's design-stage.md quoted verbatim beside the test that proves it and its result · an open line reading open — no target set · no pass or fail column · the final-validation report and the built-vs-signed diff beneath it · an amend naming the disputed rows each then put as fix now or book (s1 carries no such line · no slate · no stage · no visit file)}
